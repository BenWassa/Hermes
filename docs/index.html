  <title>The Daily</title>
  <style>
    /* ---- Design tokens: The Morning Broadsheet ------------------------- */
    :root {
      --paper: #faf8f3;        /* the sheet (warm white, never #fff) */
      --desk: #efece6;         /* the desk beyond the column */
      --ink: #17130d;          /* headlines / primary text */
      --ink-sub: #453f38;      /* standfirsts */
      --ink-muted: #635d54;    /* inactive tabs */
      --meta: #6c665c;         /* timestamps, dateline, footer (>=AA small) */
      --rule: #dcd6cc;         /* hairline between cards */
      --rule-soft: #e3ded4;    /* hairline inside an opened card */
      --navy: #1a2744;         /* structural ink */
      --navy-ink: #1a2744;     /* navy used as text (links, active tab) */
      --red: #8b1a1a;          /* editorial heat */
      --tint-open: #f2ede4;    /* ground of an expanded card */
      --tint-analysis: #ece6da;/* ground of the why-it-matters note */
      --strip-bg: #1a2744;     /* weather strip */
      --strip-ink: #f7f4ee;
      --chip-hot: #8b1a1a;     /* DEVELOPING / WAR-class flags */
      --chip-cool: #1a2744;    /* procedural flags (FINAL, EDITORIAL) */
      --chip-ink: #faf8f3;
      --focus: #1a2744;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151a22;      /* lamplight edition: deep navy-black paper */
        --desk: #0e1219;
        --ink: #e9e3d5;        /* cream ink */
        --ink-sub: #bcb6a8;
        --ink-muted: #948e82;
        --meta: #8f897d;
        --rule: #2a303a;
        --rule-soft: #2f3540;
        --navy: #6f82a8;       /* structure lifted so it reads on dark */
        --navy-ink: #a3b3d2;
        --red: #d1726b;        /* desaturated heat */
        --tint-open: #1b212b;
        --tint-analysis: #20262f;
        --strip-bg: #1b2334;
        --strip-ink: #e9e3d5;
        --chip-hot: #a8443c;
        --chip-cool: #3b4a6c;
        --chip-ink: #f0eadc;
        --focus: #a3b3d2;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 100%; }
    html, body { background: var(--desk); }
    body {
      font-family: 'Georgia', serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--paper);
      max-width: 680px;
      margin: 0 auto;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Masthead */
    .masthead {
      border-bottom: 4px solid var(--navy);
      padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
      background: var(--paper);
    }
    .masthead .date {
      font-size: 0.6875rem; color: var(--meta); letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .masthead .title {
      font-size: 2.375rem; font-weight: 700; letter-spacing: -0.01em;
      color: var(--navy); line-height: 1; margin-bottom: 2px;
    }
    .masthead .tagline {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; color: var(--meta);
      letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* Stale-edition ribbon */
    .stale {
      background: var(--tint-analysis); color: var(--meta);
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; text-align: center;
      padding: 7px 20px;
    }

    /* Weather strip */
    .weather {
      background: var(--strip-bg); color: var(--strip-ink);
      cursor: pointer; user-select: none;
    }
    .weather .summary {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
      min-height: 44px;
    }
    .weather .summary::-webkit-scrollbar { display: none; }
    .weather .ico { font-size: 1.375rem; }
    .weather .city { font-weight: 700; font-size: 0.9375rem; }
    .weather .temp { font-size: 0.9375rem; }
    .weather .muted { opacity: 0.72; font-size: 0.8125rem; white-space: nowrap; }
    .weather .chev { margin-left: auto; opacity: 0.6; font-size: 0.75rem; }
    .weather .week {
      display: flex; border-top: 1px solid rgba(255,255,255,0.12);
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
    }
    .weather .week::-webkit-scrollbar { display: none; }
    .weather .day {
      text-align: center; min-width: 52px; padding: 0 8px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .weather .day .d { font-size: 0.6875rem; opacity: 0.6; margin-bottom: 4px; }
    .weather .day .i { font-size: 1.125rem; }
    .weather .day .hi { font-size: 0.8125rem; font-weight: 700; margin-top: 4px; }
    .weather .day .lo { font-size: 0.6875rem; opacity: 0.5; }

    /* Tab nav */
    .tabs {
      display: flex; overflow-x: auto; border-bottom: 2px solid var(--navy);
      background: var(--paper); scrollbar-width: none;
      position: sticky; top: 0; z-index: 10;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; min-height: 44px; display: flex; align-items: center;
      padding: 0 18px; border: none; background: none; cursor: pointer;
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; font-weight: 700;
      color: var(--ink-muted); border-bottom: 3px solid transparent;
      margin-bottom: -2px; letter-spacing: 0.12em; text-transform: uppercase;
      transition: color 0.15s;
    }
    .tab.active { color: var(--navy-ink); border-bottom-color: var(--navy); }

    /* Stories */
    .stories { padding: 8px 20px 40px; }
    .opinion-desk + .opinion-desk { margin-top: 24px; }
    .desk-head {
      border-top: 2px solid var(--navy); padding: 12px 0 8px; margin-top: 2px;
    }
    .desk-title {
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--navy-ink);
    }
    .desk-dek {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.45;
      color: var(--meta); margin-top: 3px;
    }
    .following-block .card { padding-top: 12px; padding-bottom: 12px; }
    .follow-meta {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.45;
      color: var(--meta); margin-top: 5px;
    }
    .opinion-desk .empty { padding: 24px 4px; }
    .empty {
      padding: 40px 4px; text-align: center; color: var(--meta);
      font-style: italic; font-size: 0.9375rem;
    }
    .card {
      border-top: 1px solid var(--rule); padding: 14px 0; cursor: pointer;
      background: var(--paper); transition: background 0.15s;
    }
    .card.lead { border-top: 3px solid var(--navy); padding: 20px 0 16px; }
    .card.open { background: var(--tint-open); }
    .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card .row-main { flex: 1; min-width: 0; }
    .card .kicker {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; color: var(--red); margin-bottom: 6px; text-transform: uppercase;
    }
    .card .tag {
      color: var(--chip-ink); padding: 2px 6px; margin-right: 8px;
      font-size: 0.5625rem; border-radius: 2px; vertical-align: 1px;
    }
    .card .tag.hot { background: var(--chip-hot); }
    .card .tag.cool { background: var(--chip-cool); }
    .card .headline {
      font-size: 1.0625rem; font-weight: 700; line-height: 1.25; color: var(--ink); margin-bottom: 6px;
    }
    .card.lead .headline { font-size: 1.375rem; }
    .card .sub {
      font-size: 0.875rem; color: var(--ink-sub); line-height: 1.4; margin-bottom: 4px; font-style: italic;
    }
    .card .time { font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta); margin-top: 4px; }
    .card .toggle { color: var(--navy-ink); opacity: 0.5; font-size: 1.125rem; flex-shrink: 0; margin-top: 2px; }
    .card .expand {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    }
    .card .expand .sumtext {
      font-size: 0.9375rem; color: var(--ink-sub); line-height: 1.7;
    }
    .card .expand img {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      background: var(--tint-open); border-radius: 3px; margin-bottom: 12px;
    }
    .card .analysis {
      margin-top: 12px; padding: 10px 14px; background: var(--tint-analysis);
      font-size: 0.875rem; line-height: 1.6; color: var(--ink-sub); font-style: italic;
    }
    .card .analysis .alabel {
      display: block; font-family: 'Arial', sans-serif; font-style: normal;
      font-size: 0.625rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--navy-ink); margin-bottom: 4px;
    }
    .card .readmore {
      display: inline-block; margin-top: 12px; min-height: 44px; line-height: 44px;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink); text-decoration: none;
    }
    .card .readmore:hover { text-decoration: underline; }
    .card .readmore:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    /* Ask AI: hand the clipping and a briefing prompt to a model */
    .card .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .askai, .card .ask-opt {
      border: none; background: none; padding: 0; cursor: pointer;
      min-height: 44px; line-height: 44px; text-decoration: none;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink);
    }
    .card .askai { margin-top: 12px; }
    .card .askai:hover, .card .ask-opt:hover { text-decoration: underline; }
    .card .askai:focus-visible, .card .ask-opt:focus-visible {
      outline: 2px solid var(--focus); outline-offset: 3px;
    }
    .card .ask-panel { display: none; border-top: 1px solid var(--rule-soft); margin-top: 4px; }
    .card .ask-panel.open { display: block; }
    .card .ask-row { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .ask-note {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.55;
      color: var(--meta); letter-spacing: 0.02em; padding-bottom: 12px;
    }

    /* Footer */
    .footer {
      border-top: 2px solid var(--navy);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta);
      text-align: center; letter-spacing: 0.06em;
    }
    .notice { padding: 40px 20px; text-align: center; color: var(--meta); font-style: italic; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>

o follow safety guidelines to prevent similar occurrences.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/9/24/9241d4ec-3c38-5d1e-8b66-8ba8dbc76211/687ce3b36ad75.image.jpg?resize=300%2C200", "link": "https://www.thestar.com/news/ontario/two-separate-fires-linked-to-electric-bikes-reported-hours-apart-in-toronto/article_004a619f-9724-51d5-aaf8-714a9a0f1a2a.html"}]}, {"id": "world", "label": "World", "stories": [{"id": "w1", "lead": true, "kicker": "BALKANS", "headline": "Ratko Mladić, ‘Butcher of Bosnia’, Given Hero’s Funeral in Serbia", "sub": "Belgrade funeral for convicted war criminal sparks EU questions over Serbia’s membership aspirations.", "summary": "Ratko Mladić, known as the ‘Butcher of Bosnia’ and convicted of genocide, was given a hero’s funeral in Belgrade, Serbia. The fanfare surrounding the burial of the former Bosnian Serb military leader has drawn sharp criticism and raised questions from the European Union regarding Serbia’s commitment to European values and its path towards EU membership. The event highlights deep divisions and unaddressed historical grievances in the region.", "analysis": "The glorification of a convicted war criminal like Ratko Mladić in Serbia sends a troubling message about reconciliation and justice in the Balkans. This event complicates Serbia's relationship with the EU, potentially hindering its accession process and reigniting tensions with neighboring countries still grappling with the legacy of the 1990s conflicts.", "time": "11:20 AM", "tag": null, "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/2026/sep/07/ratko-mladic-butcher-of-bosnia-funeral-belgrade-serbia"}, {"id": "w2", "lead": false, "kicker": "CLIMATE", "headline": "Typhoon Saudel Causes Mass Evacuations in South-East China", "sub": "Torrential rain and widespread damage reported as the typhoon makes landfall.", "summary": "Typhoon Saudel has caused mass evacuations in south-east China, bringing torrential rain and widespread damage to the region. The severe weather event has prompted emergency responses as authorities work to mitigate the impact on affected communities. Meanwhile, other parts of the world are experiencing extreme weather, with thunderstorms in north-west South Africa and oppressive heat in the central-southern US.", "analysis": null, "time": "8:27 AM", "tag": "DISASTER", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/2026/sep/07/typhoon-saudel-mass-evacuations-south-east-china-weather-tracker"}, {"id": "w3", "lead": false, "kicker": "UKRAINE", "headline": "Ukraine Seeks to Seize Water Company Owned by British Billionaire Family", "sub": "Dispute centers on stake held by Patarkatsishvili family in firm jointly owned with Russian oligarch.", "summary": "Ukraine is seeking to seize a water company that is partly owned by the billionaire Patarkatsishvili family, linked to a British theatre mogul. The dispute centers on the family's stake in the bottled water firm, which is jointly held with a Russian oligarch. This move is part of broader efforts by Ukraine to nationalize assets with Russian ties amid the ongoing conflict.", "analysis": null, "time": "4:00 AM", "tag": "WAR", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/2026/sep/07/ukraine-seeks-to-seize-water-company-owned-by-billionaire-family-of-british-theatre-mogul"}, {"id": "w4", "lead": false, "kicker": "ISRAEL-PALESTINE", "headline": "UN Expert Calls for 'True Paradigm Shift' as Miliband Resets Israel Policy", "sub": "UN Special Rapporteur on occupied territories urges stronger action beyond settlement goods ban.", "summary": "Francesca Albanese, the UN Special Rapporteur on the occupied territories, has called for a 'true paradigm shift' in policy towards Israel, as David Miliband resets Labour's stance. Albanese stated that while a ban on goods from settlements is 'important', it must go further to be more than a 'press release'. Her comments underscore the demand for more robust international action on the Israeli-Palestinian conflict.", "analysis": null, "time": "4:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/5693e644ba2b520ca5cc7047ae682c4f6b0cb6b8/738_893_4235_3388/500.jpg", "link": "https://www.theguardian.com/world/2026/sep/07/un-francesca-albanese-miliband-israel-palestine-settlements-trade"}]}, {"id": "sports", "label": "Sports", "stories": [{"id": "s1", "lead": true, "kicker": "FORMULA ONE", "headline": "Wolff Hails Antonelli’s Italian GP Victory, Compares Driver to F1 Greats", "sub": "Mercedes driver Kimi Antonelli secures remarkable win, boosting his title charge.", "summary": "Mercedes team principal Toto Wolff has lauded driver Kimi Antonelli's 'remarkable' victory at the Italian Grand Prix, comparing his performance to that of Formula One's all-time greats. Antonelli's win significantly strengthens his position in the title charge, drawing high praise from Wolff who likened his strategic precision to an 'AI agent'. This dominant display at Monza signals a formidable challenge for the championship.", "analysis": "Antonelli's commanding win and Wolff's high praise position him as a serious contender for the Formula One title, potentially signaling a shift in the championship dynamics. His performance could also influence future team strategies and driver market movements.", "time": "9:48 AM", "tag": "FINAL", "sensitivity": false, "image": "https://media.guim.co.uk/4314c910eca493e8d14856dd1317f508ea68a64b/852_441_3611_2889/500.jpg", "link": "https://www.theguardian.com/sport/2026/sep/07/toto-wolff-hails-kimi-antonelli-italian-gp-victory-title-charge-formula-one"}, {"id": "s2", "lead": false, "kicker": "TENNIS", "headline": "Alcaraz Advances to US Open Quarter-Finals with Straight-Set Victory", "sub": "Reigning champion Carlos Alcaraz defeats Tommy Paul 6-4, 6-3, 6-4 at Flushing Meadows.", "summary": "Reigning champion Carlos Alcaraz has secured his spot in the US Open quarter-finals, defeating Tommy Paul in straight sets, 6-4, 6-3, 6-4. Alcaraz demonstrated a dominant performance at Flushing Meadows, taking his game 'up a level' to continue his title defense. His consistent form positions him as a strong contender as the tournament progresses.", "analysis": null, "time": "Yesterday", "tag": "FINAL", "sensitivity": false, "image": "https://media.guim.co.uk/ba11a95f966e55e9ddaf759a861c9f128ec20617/351_0_4298_3438/500.jpg", "link": "https://www.theguardian.com/sport/2026/sep/06/aryna-sabalenka-taylor-townsend-carlos-alcaraz-tommy-paul-us-open-2026-tennis"}, {"id": "s3", "lead": false, "kicker": "CRICKET", "headline": "Kevin Pietersen Appointed Mentor for England Cricket Team", "sub": "Former star joins white-ball teams ahead of ICC Men’s Cricket World Cup in late 2027.", "summary": "Former England cricket star Kevin Pietersen has received a surprise call-up to serve as a 'specialist mentor' for England’s white-ball teams. His appointment comes during the crucial run-up to the ICC Men’s Cricket World Cup, scheduled for late 2027. Pietersen's experience is expected to provide valuable guidance to the squad.", "analysis": null, "time": "10:08 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/6e79ffc86594728f328aeed0658ce298aa8b53be/303_0_3543_2833/500.jpg", "link": "https://www.theguardian.com/sport/2026/sep/07/kevin-pietersen-surprise-call-up-mentor-england-cricket-team"}, {"id": "s4", "lead": false, "kicker": "OLYMPICS", "headline": "Warning Issued Over Future of Olympic Games if Brisbane 2032 Program Not Modernised", "sub": "Australia’s top sport executive calls on IOC to update sporting program.", "summary": "Kieren Perkins, Australia’s most senior sport executive, has issued a warning regarding the future relevance of the Olympic Games if the Brisbane 2032 program is not modernized MY", "headline": "Chancellor John Healey Backs Growth, Stresses Honesty on Spending", "sub": "Healey ducks tax hike questions but commits to fiscal rules amidst economic pressures.", "summary": "Chancellor John Healey has voiced support for economic growth while emphasizing the need for honesty regarding government spending. During his remarks, Healey avoided direct questions about potential tax increases but firmly committed to adhering to existing fiscal rules. His comments come amidst ongoing economic pressures and debates over the UK's financial direction.", "analysis": null, "time": "12:54 PM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/7ac1a1ab26c15c6773452bf3aa4e26253d187642/336_0_3933_3147/500.jpg", "link": "https://www.theguardian.com/business/2026/sep/07/john-healey-growth-labour-spending-raise-taxes"}, {"id": "b3", "lead": false, "kicker": "TECH", "headline": "Grindr Pays £26M to Settle UK Lawsuit Over Alleged HIV Status Sharing", "sub": "Dating app accused of allowing ad firms access to private user information in breach of UK law.", "summary": "Grindr, the US-owned dating app, has agreed to pay £26 million to settle a UK lawsuit alleging it shared users’ HIV status and other private information with advertising firms. The settlement addresses claims that the app breached UK law by allowing third-party access to sensitive personal data. This resolution underscores growing scrutiny over data privacy practices in the tech industry.", "analysis": null, "time": "10:30 AM", "tag": "FINAL", "sensitivity": false, "image": "https://media.guim.co.uk/c3ab739c6cb52fe06c96710731f7dfcb732b5989/34_178_2692_2155/500.jpg", "link": "https://www.theguardian.com/business/2026/sep/07/grindr-settle-uk-lawsuit-dating-app-ad"}, {"id": "b4", "lead": false, "kicker": "HEALTHCARE", "headline": "UK’s Largest Private Hospital Firm Spire Agrees £1bn Takeover by Hedge Fund", "sub": "Toscafund, led by 'the Rottweiler,' acquires Spire Healthcare amid concerns over NHS privatization.", "summary": "Spire Healthcare, the UK's largest private hospital firm, has agreed to a £1 billion takeover by Toscafund, a hedge fund founded by City figure known as 'the Rottweiler.' The acquisition comes amidst increasing fears over the creeping privatization of the National Health Service (NHS). The deal marks a significant consolidation in the private healthcare sector.", "analysis": null, "time": "8:33 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/a910abeec05f9f6773f379aa7e1e303036e303eb/115_0_1635_1308/500.jpg", "link": "https://www.theguardian.com/business/2026/sep/07/uk-private-hospital-spire-healthcare-takeover-hedge-fund-toscafund-nhs"}]}, {"id": "opinion", "label": "Opinion", "stories": [{"id": "o1", "lead": true, "kicker": "GERMAN POLITICS", "headline": "The AfD’s Win in Germany is a Dark Day for Europe. Time is Running Out to Stop the Far Right", "sub": "Cas Mudde argues liberal parties must urgently change tactics to protect democracies from Europe's most extreme party.", "summary": "Cas Mudde, author of 'The Far Right Today,' asserts that the AfD’s recent victory in Germany represents a dark day for Europe, emphasizing that time is critically short to halt the advance of the far right. Mudde contends that the AfD is among Europe's most extreme parties and calls for liberal parties to urgently re-evaluate and change their tactics to safeguard democratic institutions. This op-ed highlights the profound threat posed by the rise of populist and extremist movements across the continent.", "analysis": "This opinion piece underscores the urgency of addressing the AfD's growing influence, framing it as a critical juncture for European democracy. It suggests that traditional political responses are insufficient, advocating for a fundamental shift in strategy to counter the appeal of far-right ideologies.", "time": "1:56 PM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/7afbcbe7c9bd2b35e5a2e16e548b1c29ebe92643/0_0_3344_2676/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/sep/07/afd-win-germany-far-right-europe-democracy"}, {"id": "o2", "lead": false, "kicker": "MIDDLE EAST", "headline": "Israeli Ministers Keep Telling Everyone Their Brutal Plans – So Why Doesn’t the World Take Them Seriously?", "sub": "Nesrine Malik questions why the international community ignores explicit plans for forced removal of Palestinians from Gaza.", "summary": "Guardian columnist Nesrine Malik questions why the international community continues to avert its eyes from Israeli ministers' explicit plans for the forced removal of Palestinians from Gaza. Malik highlights that these schemes are not fringe ideas but are openly promoted by officials. She argues that the world's failure to take these statements seriously allows brutal policies to advance unchecked.", "analysis": null, "time": "5:00 AM", "tag": "EDITORIAL", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/commentisfree/2026/sep/07/israeli-ministers-brutal-plans-palestinians-gaza"}, {"id": "o3", "lead": false, "kicker": "SOCIETY", "headline": "Lindsay Clancy Was Failed by Our Warped Understanding of Motherhood", "sub": "Moira Donegan argues Clancy’s case became a referendum on mothers, healthcare, and women’s status.", "summary": "Moira Donegan argues that Lindsay Clancy was failed by society's warped understanding of motherhood, turning her case into a broader referendum on mothers, healthcare, and the status of women. Donegan suggests that the public discourse surrounding Clancy's situation revealed deep-seated societal expectations and systemic failures. The piece calls for a re-evaluation of how society supports mothers and addresses mental health challenges.", "analysis": null, "time": "10:00 AM", "tag": null, "sensitivity": true, "image": null, "link": "https://www.theguardian.com/commentisfree/2026/sep/07/lindsay-clancy-case-rorschach-test"}, {"id": "o4", "lead": false, "kicker": "TECHNOLOGY", "headline": "How to Stop Cheating in the A.I. Era", "sub": "Readers respond to a guest essay on addressing the root cause of cheating with AI.", "summary": "This piece compiles reader responses to a guest essay discussing strategies to combat cheating in the age of Artificial Intelligence. The feedback explores various approaches to address the root causes of academic dishonesty when AI tools are readily available. It highlights the ongoing challenge for educators and institutions to adapt to new technologies while upholding academic integrity.", "analysis": null, "time": "9:00 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/08/30/opinion/26grant-image/26grant-image-superJumbo.jpg", "link": "https://www.nytimes.com/2026/09/07/opinion/letters/stop-cheating-ai.html"}]}]}</script>

  <script>
    (function () {
      var raw = document.getElementById('edition').textContent;
      var data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<div class="notice">No edition loaded. Run the build to generate today’s paper.</div>';
        return;
      }

      var state = { active: (data.sections[0] || {}).id, openId: null };

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Editorial heat flags keep the red chip; procedural flags cool to navy,
      // so a red chip still means something (the Scarce Red Rule).
      function isHotTag(t) {
        return /^(DEVELOPING|BREAKING|LIVE|WAR|ALERT|URGENT)$/i.test(t || '');
      }

      // ---- Ask AI ----------------------------------------------------------
      // The reader taps one story and gets a briefing, not a chat. The prompt
      // does three jobs: hand over the clipping, name the shape of the answer
      // (five parts, ~500 words, hard ceiling), and set up the follow-up so the
      // conversation continues without the reader having to think of a question.
      // Voice constraints mirror src/config.py HOUSE_VOICE, em dash ban included.
      function buildPrompt(st, sectionLabel) {
        var L = [];
        L.push('I read this in my morning paper and I want to understand it properly.');
        L.push('');
        L.push('THE CLIPPING');
        L.push('Headline: ' + st.headline);
        if (st.author) L.push('Author: ' + st.author);
        if (st.publication) L.push('Publication: ' + st.publication);
        if (st.sub) L.push('Standfirst: ' + st.sub);
        if (st.summary) L.push('Summary: ' + st.summary);
        if (st.analysis) L.push("My paper's why-it-matters note: " + st.analysis);
        L.push('Section: ' + sectionLabel + '. Filed ' + (st.time || 'this morning') +
               ', edition of ' + data.date + '.');
        if (st.link) L.push('Source: ' + st.link);
        L.push('');
        L.push('WHAT I WANT');
        L.push('A briefing that leaves me genuinely informed, not a restatement of what I just');
        L.push('pasted. Assume I know nothing beyond the clipping above.');
        L.push('');
        L.push('Check current reporting first if you are able to search. My clipping is a');
        L.push('summary and may be incomplete or already overtaken by events. If you cannot');
        L.push('search, say so in one line at the top, then separate what you are confident');
        L.push('about from what you would want verified.');
        L.push('');
        L.push('STRUCTURE');
        L.push('I am reading this on a phone. Build the answer in layers, heaviest first, so');
        L.push('I can stop at the end of any layer and still have got something whole. Use');
        L.push('these markdown headings exactly, so they render large on a small screen.');
        L.push('');
        L.push('# The gist');
        L.push('An H1 of six to ten words stating the actual point, not the topic. Then two or');
        L.push('three short sentences giving me the whole story in plain words. If I read');
        L.push('nothing else, this is what I walk away knowing. Correct my clipping here if it');
        L.push('is wrong or out of date.');
        L.push('');
        L.push('## Why it matters');
        L.push('Two or three short sentences on the stakes and the second order effects. Be');
        L.push('concrete about who gains, who pays, how much, and by when.');
        L.push('');
        L.push('## How we got here');
        L.push('Only the background I need to follow this story. Not a history lecture.');
        L.push('');
        L.push('## Where it is contested');
        L.push('The strongest disagreement among serious people, put fairly. If it is genuinely');
        L.push('uncontested, say so in one sentence and move on.');
        L.push('');
        L.push('## What to watch');
        L.push('Three bullets, each a specific checkable marker with a rough timeframe.');
        L.push('');
        L.push('## Ask me next');
        L.push('Three numbered questions, ordered by what would teach me the most. I will reply');
        L.push('with a digit.');
        L.push('');
        L.push('READING ON A PHONE');
        L.push('Short paragraphs: three sentences at most, none longer than about sixty words,');
        L.push('with a blank line between them. No tables, no nested bullets, no wall of text.');
        L.push('Around 500 words in total. Hard ceiling 650. Do not pad to reach a length; the');
        L.push('gist and why it matters are worth more than the sections under them.');
        L.push('');
        L.push('VOICE');
        L.push('Financial Times, not an encyclopedia and not a chatbot. Plain, confident,');
        L.push('concrete. Specifics over abstractions: names, numbers, dates, stakes. Every');
        L.push('sentence earns its place. No preamble, no throat clearing, no restating my');
        L.push('prompt back to me, no hedging filler, no em dashes. Where you are uncertain,');
        L.push('mark it in the sentence it applies to rather than in a disclaimer paragraph.');
        return L.join('\n');
      }

      function findStory(id) {
        var followed = data.following || [];
        for (var f = 0; f < followed.length; f++) {
          if (followed[f].id === id) {
            return { story: followed[f], label: 'Opinion · Following' };
          }
        }
        for (var i = 0; i < data.sections.length; i++) {
          var list = data.sections[i].stories || [];
          for (var j = 0; j < list.length; j++) {
            if (list[j].id === id) {
              return { story: list[j], label: data.sections[i].label };
            }
          }
        }
        return null;
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        // Older iOS standalone PWAs land here.
        return new Promise(function (resolve, reject) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('copy failed'));
        });
      }

      // Tagline reflects the sections the edition actually shipped, not a
      // hardcoded list that can disagree with the paper.
      function taglineText() {
        var labels = data.sections
          .filter(function (s) { return s.id !== 'front'; })
          .map(function (s) { return s.label; });
        return (labels.length ? labels : ['Toronto', 'World', 'Business']).join(' · ');
      }

      function weatherHtml(w) {
        if (!w || !w.icon) return '';
        var week = (w.week || []).map(function (d) {
          return '<div class="day"><div class="d">' + esc(d.day) + '</div>' +
            '<div class="i">' + esc(d.icon) + '</div>' +
            '<div class="hi">' + esc(d.hi) + '°</div>' +
            '<div class="lo">' + esc(d.lo) + '°</div></div>';
        }).join('');
        return '<div class="weather" id="weather" role="button" tabindex="0" ' +
          'aria-expanded="false" aria-label="Toronto weather, tap for the week">' +
          '<div class="summary">' +
            '<span class="ico">' + esc(w.icon) + '</span>' +
            '<span class="city">Toronto</span>' +
            '<span class="temp">' + esc(w.high) + '° / ' + esc(w.low) + '°</span>' +
            '<span class="muted">' + esc(w.condition) + '</span>' +
            '<span class="muted">Rain ' + esc(w.rain) + '</span>' +
            '<span class="muted">Wind ' + esc(w.wind) + '</span>' +
            '<span class="chev" id="wchev">▼</span>' +
          '</div>' +
          '<div class="week" id="wweek" style="display:none">' + week + '</div>' +
        '</div>';
      }

      function tabsHtml() {
        return '<div class="tabs" role="tablist">' + data.sections.map(function (s) {
          var on = s.id === state.active;
          return '<button class="tab' + (on ? ' active' : '') + '" role="tab" ' +
            'aria-selected="' + on + '" data-tab="' + esc(s.id) + '">' + esc(s.label) + '</button>';
        }).join('') + '</div>';
      }

      function cardHtml(st, sectionLabel) {
        var open = st.id === state.openId;
        var tag = st.tag
          ? '<span class="tag ' + (isHotTag(st.tag) ? 'hot' : 'cool') + '">' + esc(st.tag) + '</span>'
          : '';
        var kicker = st.kicker ? '<div class="kicker">' + tag + esc(st.kicker) + '</div>' : '';
        var sub = st.sub ? '<div class="sub">' + esc(st.sub) + '</div>' : '';
        var followMeta = '';
        var filed = '<div class="time">' + esc(st.time) + '</div>';
        if (st.following) {
          var metaParts = [st.author, st.publication, st.time].filter(function (part) { return !!part; });
          followMeta = metaParts.length
            ? '<div class="follow-meta">' + metaParts.map(esc).join(' · ') + '</div>'
            : '';
          filed = '';
        }
        var expand = '';
        if (open) {
          var img = st.image
            ? '<img src="' + esc(st.image) + '" alt="' + esc(st.headline) + '" ' +
              'loading="lazy" onerror="this.remove()" />'
            : '';
          var analysis = st.analysis
            ? '<div class="analysis"><span class="alabel">Why it matters</span>' + esc(st.analysis) + '</div>'
            : '';
          var link = st.link
            ? '<a class="readmore" href="' + esc(st.link) + '" target="_blank" rel="noopener">Read full story →</a>'
            : '';

          // Prefill the destinations at render time so a long press ("open in
          // app") carries the prompt too, instead of us intercepting the tap.
          var q = encodeURIComponent(buildPrompt(st, sectionLabel));
          // No target="_blank" on these two. In a standalone PWA a blank target
          // opens an in-app browser sheet, which iOS will not hand off to an
          // installed app; a plain top-level tap is what lets the Claude and
          // ChatGPT apps claim their own domains as Universal Links. "Read full
          // story" keeps _blank, because a news site does belong in a tab.
          var share = navigator.share
            ? '<button class="ask-opt" data-ai="share" data-id="' + esc(st.id) + '">Share to app…</button>'
            : '';
          var actions = '<div class="actions">' + link +
            '<button class="askai" data-ask="' + esc(st.id) + '" aria-expanded="false" ' +
              'aria-controls="ask-' + esc(st.id) + '">Ask AI ▾</button></div>' +
            '<div class="ask-panel" id="ask-' + esc(st.id) + '">' +
              '<div class="ask-row">' +
                '<a class="ask-opt" href="https://claude.ai/new?q=' + esc(q) + '">Claude</a>' +
                '<a class="ask-opt" href="https://chatgpt.com/?q=' + esc(q) + '">ChatGPT</a>' +
                share +
                '<button class="ask-opt" data-ai="copy" data-id="' + esc(st.id) + '">Copy</button>' +
              '</div>' +
              '<div class="ask-note">Opens in the app if you have it installed. The reply ' +
                'starts with the gist in a few lines, then goes deeper, then offers three ' +
                'follow-up questions.</div>' +
            '</div>';

          expand = '<div class="expand">' + img +
            '<p class="sumtext">' + esc(st.summary) + '</p>' + analysis + actions + '</div>';
        }
        return '<div class="card' + (st.lead ? ' lead' : '') + (open ? ' open' : '') +
          '" data-card="' + esc(st.id) + '" role="button" tabindex="0" ' +
          'aria-expanded="' + open + '">' +
          '<div class="row"><div class="row-main">' + kicker +
            '<div class="headline">' + esc(st.headline) + '</div>' + sub + followMeta + filed +
            '</div><div class="toggle" aria-hidden="true">' + (open ? '−' : '+') + '</div>' +
          '</div>' + expand +
        '</div>';
      }

      function storiesInner() {
        var section = data.sections.filter(function (s) { return s.id === state.active; })[0];
        if (!section) return '';

        var sectionStories = section.stories || [];
        var following = data.following || [];
        if (section.id === 'opinion' && following.length) {
          var followedHtml = following.map(function (st) {
            return cardHtml(st, 'Opinion · Following');
          }).join('');
          var ordinaryHtml = sectionStories.length
            ? sectionStories.map(function (st) { return cardHtml(st, section.label); }).join('')
            : '<div class="empty">Nothing else filed for Opinion this morning.</div>';
          return '<section class="opinion-desk following-block" aria-labelledby="following-title">' +
              '<div class="desk-head"><h2 class="desk-title" id="following-title">Following</h2>' +
                '<div class="desk-dek">New writing from voices you follow</div></div>' +
              followedHtml +
            '</section>' +
            '<section class="opinion-desk today-opinion" aria-labelledby="today-opinion-title">' +
              '<div class="desk-head"><h2 class="desk-title" id="today-opinion-title">Today’s Opinion</h2>' +
                '<div class="desk-dek">Selected independently by the morning desk</div></div>' +
              ordinaryHtml +
            '</section>';
        }

        if (!sectionStories.length) {
          return '<div class="empty">Nothing filed for ' + esc(section.label) + ' this morning.</div>';
        }
        return sectionStories.map(function (st) {
          return cardHtml(st, section.label);
        }).join('');
      }

      // Quietly flag a saved (not-today) edition served from cache/offline.
      function staleRibbon() {
        try {
          var meta = document.querySelector('meta[name=build]');
          if (!meta) return '';
          var built = new Date(meta.getAttribute('content'));
          if (isNaN(built.getTime())) return '';
          var opt = { timeZone: 'America/Toronto' };
          if (built.toLocaleDateString('en-CA', opt) < new Date().toLocaleDateString('en-CA', opt)) {
            return '<div class="stale">Saved edition · ' + esc(data.date) + '</div>';
          }
        } catch (e) {}
        return '';
      }

      function appHtml() {
        return '<div class="masthead">' +
            '<div class="date">' + esc(data.date) + '</div>' +
            '<div class="title">THE DAILY</div>' +
            '<div class="tagline">' + esc(taglineText()) + '</div>' +
          '</div>' +
          staleRibbon() +
          weatherHtml(data.weather) +
          tabsHtml() +
          '<div class="stories" id="stories">' + storiesInner() + '</div>' +
          '<div class="footer">THE DAILY · TORONTO · Tap any headline to read</div>';
      }

      var app = document.getElementById('app');

      // Rebuild only the stories column; masthead, weather, and tab strip (and
      // their scroll/open state) are left untouched. This is what keeps a tap
      // from resetting the reader's place.
      function refreshStories() {
        document.getElementById('stories').innerHTML = storiesInner();
        bindCards();
      }

      function selectTab(id) {
        if (id === state.active) return;
        state.active = id;
        state.openId = null;
        var tabs = document.querySelectorAll('.tab');
        Array.prototype.forEach.call(tabs, function (t) {
          var on = t.getAttribute('data-tab') === id;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on);
          if (on) t.scrollIntoView({ inline: 'center', block: 'nearest' });
        });
        refreshStories();
        // Start the new section at the top, tab strip stuck under the notch.
        var tabsEl = document.querySelector('.tabs');
        if (tabsEl) window.scrollTo(0, tabsEl.offsetTop);
      }

      function toggleCard(id) {
        var y = window.scrollY;
        state.openId = state.openId === id ? null : id;
        refreshStories();
        window.scrollTo(0, y);   // grow/collapse in place, never jump
      }

      function bindWeather() {
        var weather = document.getElementById('weather');
        if (!weather) return;
        function toggle() {
          var week = document.getElementById('wweek');
          var chev = document.getElementById('wchev');
          var showing = week.style.display !== 'none';
          week.style.display = showing ? 'none' : 'flex';
          chev.textContent = showing ? '▼' : '▲';
          weather.setAttribute('aria-expanded', String(!showing));
        }
        weather.addEventListener('click', toggle);
        weather.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
        });
      }

      function bindTabs() {
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
          btn.addEventListener('click', function () { selectTab(btn.getAttribute('data-tab')); });
        });
      }

      function bindCards() {
        Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
          function activate(ev) {
            // Let links and the Ask AI controls handle their own activation.
            if (ev.target.closest('a, button')) return;
            // While open, only the header row collapses it, so reading (and
            // selecting) the body never closes the story by accident.
            if (card.classList.contains('open') && !ev.target.closest('.row')) return;
            toggleCard(card.getAttribute('data-card'));
          }
          card.addEventListener('click', activate);
          card.addEventListener('keydown', function (ev) {
            if (ev.key !== 'Enter' && ev.key !== ' ') return;
            // Never swallow the key from a control that acts on it itself.
            if (ev.target.closest('a, button')) return;
            ev.preventDefault();
            activate(ev);
          });
          bindAsk(card);
        });
      }

      // Panel state is held in the DOM, not in `state`, so opening the
      // destinations never triggers a stories rebuild and never moves the page.
      function bindAsk(card) {
        var toggle = card.querySelector('.askai');
        if (!toggle) return;
        var panel = card.querySelector('.ask-panel');

        toggle.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var open = panel.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(open));
          toggle.textContent = open ? 'Ask AI ▴' : 'Ask AI ▾';
        });

        Array.prototype.forEach.call(panel.querySelectorAll('[data-ai]'), function (el) {
          var kind = el.getAttribute('data-ai');
          el.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var found = findStory(el.getAttribute('data-id'));
            if (!found) return;
            var prompt = buildPrompt(found.story, found.label);

            if (kind === 'share') {
              navigator.share({ text: prompt }).catch(function () {});
              return;
            }
            var label = el.textContent;
            copyText(prompt).then(function () {
              el.textContent = 'Copied';
            }).catch(function () {
              el.textContent = 'Copy failed';
            }).then(function () {
              setTimeout(function () { el.textContent = label; }, 1800);
            });
          });
        });
      }

      app.innerHTML = appHtml();
      bindWeather();
      bindTabs();
      bindCards();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
