  <style>
    /* ---- Design tokens: The Morning Broadsheet ------------------------- */
    :root {
      --paper: #faf8f3;        /* the sheet (warm white, never #fff) */
      --desk: #efece6;         /* the desk beyond the column */
      --ink: #17130d;          /* headlines / primary text */
      --ink-sub: #453f38;      /* standfirsts */
      --ink-muted: #635d54;    /* inactive tabs */
      --meta: #6c665c;         /* timestamps, dateline, footer (>=AA small) */
      --rule: #dcd6cc;         /* hairline between cards */
      --rule-soft: #e3ded4;    /* hairline inside an opened card */
      --navy: #1a2744;         /* structural ink */
      --navy-ink: #1a2744;     /* navy used as text (links, active tab) */
      --red: #8b1a1a;          /* editorial heat */
      --tint-open: #f2ede4;    /* ground of an expanded card */
      --tint-analysis: #ece6da;/* ground of the why-it-matters note */
      --strip-bg: #1a2744;     /* weather strip */
      --strip-ink: #f7f4ee;
      --chip-hot: #8b1a1a;     /* DEVELOPING / WAR-class flags */
      --chip-cool: #1a2744;    /* procedural flags (FINAL, EDITORIAL) */
      --chip-ink: #faf8f3;
      --focus: #1a2744;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151a22;      /* lamplight edition: deep navy-black paper */
        --desk: #0e1219;
        --ink: #e9e3d5;        /* cream ink */
        --ink-sub: #bcb6a8;
        --ink-muted: #948e82;
        --meta: #8f897d;
        --rule: #2a303a;
        --rule-soft: #2f3540;
        --navy: #6f82a8;       /* structure lifted so it reads on dark */
        --navy-ink: #a3b3d2;
        --red: #d1726b;        /* desaturated heat */
        --tint-open: #1b212b;
        --tint-analysis: #20262f;
        --strip-bg: #1b2334;
        --strip-ink: #e9e3d5;
        --chip-hot: #a8443c;
        --chip-cool: #3b4a6c;
        --chip-ink: #f0eadc;
        --focus: #a3b3d2;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 100%; }
    html, body { background: var(--desk); }
    body {
      font-family: 'Georgia', serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--paper);
      max-width: 680px;
      margin: 0 auto;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Masthead */
    .masthead {
      border-bottom: 4px solid var(--navy);
      padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
      background: var(--paper);
    }
    .masthead .date {
      font-size: 0.6875rem; color: var(--meta); letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .masthead .title {
      font-size: 2.375rem; font-weight: 700; letter-spacing: -0.01em;
      color: var(--navy); line-height: 1; margin-bottom: 2px;
    }
    .masthead .tagline {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; color: var(--meta);
      letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* Stale-edition ribbon */
    .stale {
      background: var(--tint-analysis); color: var(--meta);
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; text-align: center;
      padding: 7px 20px;
    }

    /* Weather strip */
    .weather {
      background: var(--strip-bg); color: var(--strip-ink);
      cursor: pointer; user-select: none;
    }
    .weather .summary {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
      min-height: 44px;
    }
    .weather .summary::-webkit-scrollbar { display: none; }
    .weather .ico { font-size: 1.375rem; }
    .weather .city { font-weight: 700; font-size: 0.9375rem; }
    .weather .temp { font-size: 0.9375rem; }
    .weather .muted { opacity: 0.72; font-size: 0.8125rem; white-space: nowrap; }
    .weather .chev { margin-left: auto; opacity: 0.6; font-size: 0.75rem; }
    .weather .week {
      display: flex; border-top: 1px solid rgba(255,255,255,0.12);
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
    }
    .weather .week::-webkit-scrollbar { display: none; }
    .weather .day {
      text-align: center; min-width: 52px; padding: 0 8px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .weather .day .d { font-size: 0.6875rem; opacity: 0.6; margin-bottom: 4px; }
    .weather .day .i { font-size: 1.125rem; }
    .weather .day .hi { font-size: 0.8125rem; font-weight: 700; margin-top: 4px; }
    .weather .day .lo { font-size: 0.6875rem; opacity: 0.5; }

    /* Tab nav */
    .tabs {
      display: flex; overflow-x: auto; border-bottom: 2px solid var(--navy);
      background: var(--paper); scrollbar-width: none;
      position: sticky; top: 0; z-index: 10;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; min-height: 44px; display: flex; align-items: center;
      padding: 0 18px; border: none; background: none; cursor: pointer;
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; font-weight: 700;
      color: var(--ink-muted); border-bottom: 3px solid transparent;
      margin-bottom: -2px; letter-spacing: 0.12em; text-transform: uppercase;
      transition: color 0.15s;
    }
    .tab.active { color: var(--navy-ink); border-bottom-color: var(--navy); }

    /* Stories */
    .stories { padding: 8px 20px 40px; }
    .empty {
      padding: 40px 4px; text-align: center; color: var(--meta);
      font-style: italic; font-size: 0.9375rem;
    }
    .card {
      border-top: 1px solid var(--rule); padding: 14px 0; cursor: pointer;
      background: var(--paper); transition: background 0.15s;
    }
    .card.lead { border-top: 3px solid var(--navy); padding: 20px 0 16px; }
    .card.open { background: var(--tint-open); }
    .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card .row-main { flex: 1; min-width: 0; }
    .card .kicker {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; color: var(--red); margin-bottom: 6px; text-transform: uppercase;
    }
    .card .tag {
      color: var(--chip-ink); padding: 2px 6px; margin-right: 8px;
      font-size: 0.5625rem; border-radius: 2px; vertical-align: 1px;
    }
    .card .tag.hot { background: var(--chip-hot); }
    .card .tag.cool { background: var(--chip-cool); }
    .card .headline {
      font-size: 1.0625rem; font-weight: 700; line-height: 1.25; color: var(--ink); margin-bottom: 6px;
    }
    .card.lead .headline { font-size: 1.375rem; }
    .card .sub {
      font-size: 0.875rem; color: var(--ink-sub); line-height: 1.4; margin-bottom: 4px; font-style: italic;
    }
    .card .time { font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta); margin-top: 4px; }
    .card .toggle { color: var(--navy-ink); opacity: 0.5; font-size: 1.125rem; flex-shrink: 0; margin-top: 2px; }
    .card .expand {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    }
    .card .expand .sumtext {
      font-size: 0.9375rem; color: var(--ink-sub); line-height: 1.7;
    }
    .card .expand img {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      background: var(--tint-open); border-radius: 3px; margin-bottom: 12px;
    }
    .card .analysis {
      margin-top: 12px; padding: 10px 14px; background: var(--tint-analysis);
      font-size: 0.875rem; line-height: 1.6; color: var(--ink-sub); font-style: italic;
    }
    .card .analysis .alabel {
      display: block; font-family: 'Arial', sans-serif; font-style: normal;
      font-size: 0.625rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--navy-ink); margin-bottom: 4px;
    }
    .card .readmore {
      display: inline-block; margin-top: 12px; min-height: 44px; line-height: 44px;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink); text-decoration: none;
    }
    .card .readmore:hover { text-decoration: underline; }
    .card .readmore:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    /* Ask AI: hand the clipping and a briefing prompt to a model */
    .card .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .askai, .card .ask-opt {
      border: none; background: none; padding: 0; cursor: pointer;
      min-height: 44px; line-height: 44px; text-decoration: none;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink);
    }
    .card .askai { margin-top: 12px; }
    .card .askai:hover, .card .ask-opt:hover { text-decoration: underline; }
    .card .askai:focus-visible, .card .ask-opt:focus-visible {
      outline: 2px solid var(--focus); outline-offset: 3px;
    }
    .card .ask-panel { display: none; border-top: 1px solid var(--rule-soft); margin-top: 4px; }
    .card .ask-panel.open { display: block; }
    .card .ask-row { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .ask-note {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.55;
      color: var(--meta); letter-spacing: 0.02em; padding-bottom: 12px;
    }

    /* Footer */
    .footer {
      border-top: 2px solid var(--navy);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta);
      text-align: center; letter-spacing: 0.06em;
    }
    .notice { padding: 40px 20px; text-align: center; color: var(--meta); font-style: italic; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>

k regions are deemed unsafe for swimming due to water quality concerns.", "summary": "Toronto Public Health and regional health departments have issued advisories against swimming at several public beaches across the Greater Toronto Area. One Toronto beach, seven in Niagara, four in Durham, and one in York Region are currently deemed unsafe due to water quality concerns. Residents are advised to stay out of the water at these locations based on the latest reports from Sunday evening.", "analysis": "These widespread beach advisories highlight persistent water quality issues in the GTA, likely exacerbated by recent weather patterns or urban runoff. The recurring nature of these warnings points to a need for improved infrastructure or environmental management to ensure public safety and access to recreational spaces.", "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/8/12/81233772-dcd7-57a5-be69-06c7c12247b4/64b959060914d.image.jpg?resize=300%2C200", "link": "https://www.thestar.com/news/gta/beach-water-quality/stay-out-of-the-water-at-one-toronto-public-beach/article_2a1c8016-23a2-535d-943e-2c77675ffe94.html"}, {"id": "t2", "lead": false, "kicker": "HEALTHCARE", "headline": "Mississauga Mom's Skin Cancer Diagnosed by New Clinic After Earlier Dismissals", "sub": "Liliya Leheta received a diagnosis within two weeks through a new program at Princess Margaret Cancer Centre after dermatologists initially dismissed her symptoms.", "summary": "A Mississauga mother, Liliya Leheta, received a skin cancer diagnosis within two weeks through a new program at Princess Margaret Cancer Centre, after her symptoms were repeatedly dismissed by dermatologists. Leheta's referral had been declined previously, highlighting a critical gap in early detection. The new program proved vital in providing timely care.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": false, vestigation.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": true, "image": null, "link": "https://www.thestar.com/news/gta/mississauga-resident-dead-after-canoe-overturns-on-stewart-lake/article_352b650c-d740-4c5f-8005-c006760b797c.html"}]}, {"id": "world", "label": "World", "stories": [{"id": "w1", "lead": true, "kicker": "MIDDLE EAST", "headline": "New Phase of Confrontation at al-Aqsa Challenges Status Quo", "sub": "Jerusalem's volatile al-Aqsa site has become a flashpoint, with Arab states and former Israeli officials raising alarms over Prime Minister Benjamin Netanyahu’s alleged complicity.", "summary": "Jerusalem's al-Aqsa Mosque compound, a historically volatile site, has entered a new phase of confrontation, signaling a significant challenge to the long-standing status quo. Arab states and former Israeli officials are sounding the alarm, expressing concern over Prime Minister Benjamin Netanyahu’s alleged complicity in actions that have escalated tensions. The situation risks broader regional instability as religious and political sensitivities converge at the holy site.", "analysis": "The escalating tensions at al-Aqsa are a critical barometer of the wider Israeli-Palestinian conflict, with potential to ignite unrest across the Middle East. Netanyahu's perceived role in the current phase of confrontation could further isolate Israel diplomatically and complicate any future peace initiatives.", "time": "5:45 AM", "tag": "DEVELOPING", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/2026/aug/10/monday-briefing-how-the-new-phase-of-confrontation-at-al-aqsa-signals-a-challenge-to-the-status-quo"}, {"id": "w2", "lead": false, "kicker": "IRELAND", "headline": "Alleged Crime Boss Daniel Kinahan Returns to Ireland, Faces Organized Crime Charges", "sub": "Kinahan, who built a boxing empire while in exile in Dubai, now faces trial in Dublin for allegedly directing organized crime.", "summary": "Alleged crime boss Daniel Kinahan has returned to Ireland, ending a global game of cat-and-mouse, and now faces trial in Dublin. Kinahan, who reportedly built a significant boxing empire during his exile in Dubai, is charged with directing organized crime. His return marks a major development in international efforts to dismantle his alleged criminal network.", "analysis": null, "time": "Yesterday", "tag": "CRIME", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/2026/aug/09/daniel-kinahan-return-ireland-ends-global-game-cat-and-mouse"}, {"id": "w3", "lead": false, "kicker": "PAKISTAN", "headline": "Extreme Heat Threatens Pakistan's Red Chile Capital", "sub": "Traditional farming methods for peppers in Pakistan may not survive climate change and soaring costs, prompting farmers to adapt.", "summary": "Pakistan's red chile capital is facing an existential threat from extreme heat, jeopardizing the traditional ways of cultivating the region's iconic peppers. Farmers are struggling to adapt to the dual challenges of climate change and soaring operational costs, which threaten the viability of their crops. This situation highlights the broader impact of environmental shifts on agricultural communities.", "analysis": null, "time": "12:01 AM", "tag": "CLIMATE", "sensitivity": false, "image": "https://static01.nyt.com/images/2026/08/06/multimedia/00int-pakistan-chiles-dispatch-promo-hmpq/00int-pakistan-chiles-dispatch-promo-hmpq-superJumbo.jpg", "link": "https://www.nytimes.com/2026/08/10/world/asia/pakistan-red-chiles-climate-change.html"}, {"id": "w4", "lead": false, "kicker": "MALAYSIA", "headline": "Malaysia's Social Media Ban for Kids Stymied by Platform Privacy Concerns", "sub": "Officials sought age verification using government IDs, but companies balked, leaving children still logged in despite the ban.", "summary": "Malaysia's attempt to ban children from social media platforms has been largely ineffective, as companies have balked at government requests inson-audrey-werro-femke-broeders-bol-womens-800m"}, {"id": "s2", "lead": false, "kicker": "CYCLING", "headline": "Vollering Claims Second Tour de France Femmes Title Amid Tactics Row", "sub": "Demi Vollering won the final stage to secure her second championship, but runner-up Kasia Niewiadoma expressed unhappiness with rival team tactics.", "summary": "Demi Vollering has secured her second Tour de France Femmes title, winning the dramatic final stage. However, her victory is overshadowed by a tactics row, with runner-up Kasia Niewiadoma reiterating her unhappiness with Vollering's rival team's strategies during the penultimate stage. The controversy adds a contentious note to an otherwise thrilling race conclusion.", "analysis": null, "time": "Yesterday", "tag": "FINAL", "sensitivity": false, "image": "https://media.guim.co.uk/5f7795f743d565f079fe87586740967e411d22c2/427_0_5038_4032/500.jpg", "link": "https://www.theguardian.com/sport/2026/aug/09/tour-de-france-femmes-demi-vollering-cycling"}, {"id": "s3", "lead": false, "kicker": "RUGBY LEAGUE", "headline": "St Helens' Decline Reaches Breaking Point, Poised to Miss Playoffs", "sub": "The record 10-time Super League champions face missing the playoffs for the first time, signaling deeper issues than just poor results.", "summary": "St Helens, the record 10-time Super League champions, are facing a critical juncture as their decline reaches a breaking point. The team is poised to miss out on the playoffs for the first time in their history, a situation that suggests their problems run deeper than just recent poor results. The stench of failure now lingers around the once-dominant club.", "analysis": null, "time": "7:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/f164b7d3278ce8ffeeb7092ded625da5ec00e74d/389_0_3886_3109/500.jpg", "link": "https://www.theguardian.com/sport/2026/aug/10/st-helens-decline-super-league-rugby-league"}, {"id": "s4", "lead": false, "kicker": "TENNIS", "headline": "Vondrousova's Suspension Puts Tennis Doping Tests in Spotlight", "sub": "The former Wimbledon champion's ban highlights a stark contrast in anti-doping processes compared to football's approach.", "summary": "Former Wimbledon champion Marketa Vondrousova's suspension has brought tennis doping tests under scrutiny, exposing a stark contrast with football's anti-doping processes. The incident, occurring as footballer Mykhailo Mudryk returns for Chelsea, highlights differing approaches and potential inconsistencies in how various sports handle doping allegations and penalties. This raises questions about the fairness and uniformity of global anti-doping efforts.", "analysis": null, "time": "7:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/380229a9127dbb0defd81510795474b4760a7e82/1055_0_4456_3566/500.jpg", "link": "https://www.theguardian.com/sport/2026/aug/10/marketa-vondrousova-doping-ban-tennis-wada-mykhailo-mudryk-chelsea-fa-return-football"}]}, {"id": "business", "label": "Business", "stories": [{"id": "b1", "lead": true, "kicker": "RETAIL", "headline": "Harvey Nichols Warns of Collapse Without Rescue Deal as Bidders Circle", "sub": "Frasers Group, led by Mike Ashley, is reportedly the frontrunner to acquire the Knightsbridge-headquartered department store chain.", "summary": "Luxury department store chain Harvey Nichols has issued a stark warning, indicating it could collapse without a successful rescue deal. Bidders are circling the Knightsbridge-headquartered retailer, with Mike Ashley’s Frasers Group emerging as the frontrunner in the acquisition race. The potential takeover highlights the ongoing challenges faced by high-end retail in a fluctuating economic climate, as the iconic brand fights for its survival.", "analysis": "The potential collapse of Harvey Nichols underscores the broader struggles in the luxury retail sector, where even established brands face immense pressure. A takeover by Frasers Group could signal a shift in market dynamics, potentially consolidating power among a few large retail conglomerates and reshaping the high street landscape.", "time": "9:45 AM", "tag": "DEVELOPING", "sensitivity": false, "image": "https://media.guim.co.uk/cc4ad1643be6551a712e46e5af8b1aec70cc7415/457_0_2646_2117/500.jpg", "link": "https://www.theguardian.com/business/2026/aug/10/harvey-nichols-rescue-deal-bidders-mike-ashley-frasers-group"}, {"id": "b2", "lead": false, "kicker": "UK ECONOMY", "headline": "UK Employment Market Shows 'Rays of Light' with Upturn in Pay", "sub": "A new study indicates a positive shift for jobseekers, with legal, technology, and accounting recruitment picking up and temporary vacancies rising for the first time in two years.", "summary": "The UK employment market is showing 'rays of light' for jobseekers, with an upturn in pay and a notable increase in recruitment activity. A new study reveals that legal, technology, and accounting sectors are experiencing a pickup, and temporary vacancies have risen for the first time in two years. This data suggests a potential recovery in certain segments of the labor market.", "analysis": null, "time": "9:22 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/8a51f745311e0fdab00539e8ecac692ed5de9133/722_0_7217_5773/500.jpg", "link": "https://www.theguardian.com/business/live/2026/aug/10/uk-employment-market-shows-rays-of-light-for-jobseekers-with-upturn-in-pay-study-shows-business-live"}, {"id": "b3", "lead": false, "kicker": "PRIVATE EQUITY", "headline": "Private Equity Firms Stuck With 33,575 Unsold Businesses", "sub": "Despite a booming deal-making environment, private equity firms are struggling to exit a growing number of investments at required investor values.", "summary": "Private equity firms are currently holding onto 33,575 unsold businesses, indicating a significant challenge in their exit strategies. Even amidst a booming deal-making environment, these firms are unable to divest a growing number of investments at the values their investors require. This backlog suggests a potential liquidity crunch or a mismatch between market expectations and asset valuations.", "analysis": null, "time": "5:01 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/08/07/business/00biz-private-equity-limbo/00biz-private-equity-limbo-superJumbo.jpg", "link": "https://www.nytimes.com/2026/08/10/business/private-equity-unsold-businesses.html"}, {"id": "b4", "lead": false, "kicker": "AI & FINANCE", "headline": "AI Push Puts Banks at Mercy of Tech Firms, Warns Moody’s", "sub": "The finance sector will benefit from AI, but it requires substantial investment and creates new risks, according to the rating agency.", "summary": "Moody’s has warned that the rapid adoption of artificial intelligence is placing banks at the mercy of tech firms. While the finance sector stands to gain significantly from AI, the rating agency cautions that it necessitates substantial investment and introduces new, complex risks. This reliance on external tech providers could shift power dynamics within the financial industry.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/155f183baa3a7bbeae6d10fead4d288fa7bc8e66/1241_0_6468_5174/500.jpg", "link": "https://www.theguardian.com/business/2026/aug/09/ai-push-banks-tech-firms-moodys-risks-financial-sector"}]}, {"id": "opinion", "label": "Opinion", "stories": [{"id": "o1", "lead": true, "kicker": "UK POLITICS", "headline": "Prime Minister Andy Burnham Vows Crackdown on 'Rip-Off' Business Practices", "sub": "PM Burnham pledges to end fake discounts and make subscription cancellations easier, calling them 'everyday fixes' to ease the cost of living crisis.", "summary": "Prime Minister Andy Burnham has vowed to crack down on 'rip-off' business practices, announcing plans to ban fake discounts and simplify the process of canceling unwanted subscriptions. In an opinion piece, Burnham stated these 'everyday fixes' are crucial steps his government will take to ease the burden of the cost of living crisis on British people. He argues that these small but cumulative hassles demand immediate government action to protect consumers.", "analysis": "Prime Minister Burnham's focus on 'rip-off' practices signals a populist approach to economic policy, aiming to directly address consumer frustrations amid the cost of living crisis. This strategy could resonate with voters by demonstrating tangible action on everyday financial pressures, potentially bolstering his government's approval.", "time": "Yesterday", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/24a31746eadc69cfe64fd13932ebf18101803998/11_0_5114_4094/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/09/andy-burnham-british-people-ripped-off-cost-of-living"}, {"id": "o2", "lead": false, "kicker": "CULTURE", "headline": "Why Poetry is Booming: The Language for Times of Violence and Chaos", "sub": "Guardian chief culture writer Charlotte Higgins argues poetry fills a void when ordinary language fails to capture the intensity of conflicts like those in Ukraine and Gaza.", "summary": "Guardian chief culture writer Charlotte Higgins argues that poetry is experiencing a boom because it serves as the only language capable of articulating times of violence and chaos. She posits that from ancient epics like the Odyssey to modern conflicts in Ukraine and Gaza, poetry fills a crucial gap when ordinary ways of writing or speaking prove insufficient to convey profound human experiences. This perspective suggests a societal turn to deeper, more expressive forms of communication.", "analysis": null, "time": "7:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/f460614bfb16ff5e071ce47109a1239a4219d049/286_0_2233_1787/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/10/poetry-boom-language-violence-chaos-odyssey-ukraine-gaza"}, {"id": "o3", "lead": false, "kicker": "US POLITICS", "headline": "Centrist Democrats Dismiss Abdul El-Sayed as Radical, Raising Questions for 2028", "sub": "Nesrine Malik argues that Americans seek politicians like the Michigan primary winner, who stand against 'sordid interests,' questioning centrist strategies for future elections.", "summary": "Centrist Democrats are dismissing Michigan primary winner Abdul El-Sayed as a 'freak radical,' a move that Guardian columnist Nesrine Malik questions regarding the party's 2028 electoral prospects. Malik argues that Americans are increasingly looking for politicians who will stand on their side against 'sordid interests,' suggesting that figures like El-Sayed and Zohran Mamdani represent a necessary shift for the Democratic party to win. This critique highlights a potential disconnect between the party's establishment and voter sentiment.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/6d616b5a7bb0eb45886508591728849c14a292d0/459_0_2298_1838/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/10/centrist-democrats-abdul-el-sayed-michigan-2028-zohran-mamdani"}, {"id": "o4", "lead": false, "kicker": "TECHNOLOGY", "headline": "AI's Water and Energy Consumption Forces Choice: Datacentres or Homes?", "sub": "John Harris highlights the environmental impact of AI, noting Whitehall's plan to triple UK datacentres and their effect on local communities.", "summary": "Guardian columnist John Harris warns that the increasing water and energy consumption of artificial intelligence is forcing a critical choice between datacentres and residential needs. He points to Whitehall’s plans to triple the number of datacentres in the UK and, drawing from observations in Slough, highlights the significant environmental and community impact these facilities are already having. This raises concerns about resource allocation and sustainable development in the age of AI.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/ee18035020cfe5bef019a8fa37828c70edc79248/0_0_5000_4000/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/09/slough-famous-the-office-datacentres-locals-hub-europe"}]}]}</script>

  <script>
    (function () {
      var raw = document.getElementById('edition').textContent;
      var data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<div class="notice">No edition loaded. Run the build to generate today’s paper.</div>';
        return;
      }

      var state = { active: (data.sections[0] || {}).id, openId: null };

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Editorial heat flags keep the red chip; procedural flags cool to navy,
      // so a red chip still means something (the Scarce Red Rule).
      function isHotTag(t) {
        return /^(DEVELOPING|BREAKING|LIVE|WAR|ALERT|URGENT)$/i.test(t || '');
      }

      // ---- Ask AI ----------------------------------------------------------
      // The reader taps one story and gets a briefing, not a chat. The prompt
      // does three jobs: hand over the clipping, name the shape of the answer
      // (five parts, ~500 words, hard ceiling), and set up the follow-up so the
      // conversation continues without the reader having to think of a question.
      // Voice constraints mirror src/config.py HOUSE_VOICE, em dash ban included.
      function buildPrompt(st, sectionLabel) {
        var L = [];
        L.push('I read this in my morning paper and I want to understand it properly.');
        L.push('');
        L.push('THE CLIPPING');
        L.push('Headline: ' + st.headline);
        if (st.sub) L.push('Standfirst: ' + st.sub);
        if (st.summary) L.push('Summary: ' + st.summary);
        if (st.analysis) L.push("My paper's why-it-matters note: " + st.analysis);
        L.push('Section: ' + sectionLabel + '. Filed ' + (st.time || 'this morning') +
               ', edition of ' + data.date + '.');
        if (st.link) L.push('Source: ' + st.link);
        L.push('');
        L.push('WHAT I WANT');
        L.push('A briefing that leaves me genuinely informed, not a restatement of what I just');
        L.push('pasted. Assume I know nothing beyond the clipping above.');
        L.push('');
        L.push('Check current reporting first if you are able to search. My clipping is a');
        L.push('summary and may be incomplete or already overtaken by events. If you cannot');
        L.push('search, say so in one line at the top, then separate what you are confident');
        L.push('about from what you would want verified.');
        L.push('');
        L.push('STRUCTURE');
        L.push('I am reading this on a phone. Build the answer in layers, heaviest first, so');
        L.push('I can stop at the end of any layer and still have got something whole. Use');
        L.push('these markdown headings exactly, so they render large on a small screen.');
        L.push('');
        L.push('# The gist');
        L.push('An H1 of six to ten words stating the actual point, not the topic. Then two or');
        L.push('three short sentences giving me the whole story in plain words. If I read');
        L.push('nothing else, this is what I walk away knowing. Correct my clipping here if it');
        L.push('is wrong or out of date.');
        L.push('');
        L.push('## Why it matters');
        L.push('Two or three short sentences on the stakes and the second order effects. Be');
        L.push('concrete about who gains, who pays, how much, and by when.');
        L.push('');
        L.push('## How we got here');
        L.push('Only the background I need to follow this story. Not a history lecture.');
        L.push('');
        L.push('## Where it is contested');
        L.push('The strongest disagreement among serious people, put fairly. If it is genuinely');
        L.push('uncontested, say so in one sentence and move on.');
        L.push('');
        L.push('## What to watch');
        L.push('Three bullets, each a specific checkable marker with a rough timeframe.');
        L.push('');
        L.push('## Ask me next');
        L.push('Three numbered questions, ordered by what would teach me the most. I will reply');
        L.push('with a digit.');
        L.push('');
        L.push('READING ON A PHONE');
        L.push('Short paragraphs: three sentences at most, none longer than about sixty words,');
        L.push('with a blank line between them. No tables, no nested bullets, no wall of text.');
        L.push('Around 500 words in total. Hard ceiling 650. Do not pad to reach a length; the');
        L.push('gist and why it matters are worth more than the sections under them.');
        L.push('');
        L.push('VOICE');
        L.push('Financial Times, not an encyclopedia and not a chatbot. Plain, confident,');
        L.push('concrete. Specifics over abstractions: names, numbers, dates, stakes. Every');
        L.push('sentence earns its place. No preamble, no throat clearing, no restating my');
        L.push('prompt back to me, no hedging filler, no em dashes. Where you are uncertain,');
        L.push('mark it in the sentence it applies to rather than in a disclaimer paragraph.');
        return L.join('\n');
      }

      function findStory(id) {
        for (var i = 0; i < data.sections.length; i++) {
          var list = data.sections[i].stories || [];
          for (var j = 0; j < list.length; j++) {
            if (list[j].id === id) {
              return { story: list[j], label: data.sections[i].label };
            }
          }
        }
        return null;
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        // Older iOS standalone PWAs land here.
        return new Promise(function (resolve, reject) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('copy failed'));
        });
      }

      // Tagline reflects the sections the edition actually shipped, not a
      // hardcoded list that can disagree with the paper.
      function taglineText() {
        var labels = data.sections
          .filter(function (s) { return s.id !== 'front'; })
          .map(function (s) { return s.label; });
        return (labels.length ? labels : ['Toronto', 'World', 'Business']).join(' · ');
      }

      function weatherHtml(w) {
        if (!w || !w.icon) return '';
        var week = (w.week || []).map(function (d) {
          return '<div class="day"><div class="d">' + esc(d.day) + '</div>' +
            '<div class="i">' + esc(d.icon) + '</div>' +
            '<div class="hi">' + esc(d.hi) + '°</div>' +
            '<div class="lo">' + esc(d.lo) + '°</div></div>';
        }).join('');
        return '<div class="weather" id="weather" role="button" tabindex="0" ' +
          'aria-expanded="false" aria-label="Toronto weather, tap for the week">' +
          '<div class="summary">' +
            '<span class="ico">' + esc(w.icon) + '</span>' +
            '<span class="city">Toronto</span>' +
            '<span class="temp">' + esc(w.high) + '° / ' + esc(w.low) + '°</span>' +
            '<span class="muted">' + esc(w.condition) + '</span>' +
            '<span class="muted">Rain ' + esc(w.rain) + '</span>' +
            '<span class="muted">Wind ' + esc(w.wind) + '</span>' +
            '<span class="chev" id="wchev">▼</span>' +
          '</div>' +
          '<div class="week" id="wweek" style="display:none">' + week + '</div>' +
        '</div>';
      }

      function tabsHtml() {
        return '<div class="tabs" role="tablist">' + data.sections.map(function (s) {
          var on = s.id === state.active;
          return '<button class="tab' + (on ? ' active' : '') + '" role="tab" ' +
            'aria-selected="' + on + '" data-tab="' + esc(s.id) + '">' + esc(s.label) + '</button>';
        }).join('') + '</div>';
      }

      function cardHtml(st, sectionLabel) {
        var open = st.id === state.openId;
        var tag = st.tag
          ? '<span class="tag ' + (isHotTag(st.tag) ? 'hot' : 'cool') + '">' + esc(st.tag) + '</span>'
          : '';
        var kicker = st.kicker ? '<div class="kicker">' + tag + esc(st.kicker) + '</div>' : '';
        var sub = st.sub ? '<div class="sub">' + esc(st.sub) + '</div>' : '';
        var expand = '';
        if (open) {
          var img = st.image
            ? '<img src="' + esc(st.image) + '" alt="' + esc(st.headline) + '" ' +
              'loading="lazy" onerror="this.remove()" />'
            : '';
          var analysis = st.analysis
            ? '<div class="analysis"><span class="alabel">Why it matters</span>' + esc(st.analysis) + '</div>'
            : '';
          var link = st.link
            ? '<a class="readmore" href="' + esc(st.link) + '" target="_blank" rel="noopener">Read full story →</a>'
            : '';

          // Prefill the destinations at render time so a long press ("open in
          // app") carries the prompt too, instead of us intercepting the tap.
          var q = encodeURIComponent(buildPrompt(st, sectionLabel));
          // No target="_blank" on these two. In a standalone PWA a blank target
          // opens an in-app browser sheet, which iOS will not hand off to an
          // installed app; a plain top-level tap is what lets the Claude and
          // ChatGPT apps claim their own domains as Universal Links. "Read full
          // story" keeps _blank, because a news site does belong in a tab.
          var share = navigator.share
            ? '<button class="ask-opt" data-ai="share" data-id="' + esc(st.id) + '">Share to app…</button>'
            : '';
          var actions = '<div class="actions">' + link +
            '<button class="askai" data-ask="' + esc(st.id) + '" aria-expanded="false" ' +
              'aria-controls="ask-' + esc(st.id) + '">Ask AI ▾</button></div>' +
            '<div class="ask-panel" id="ask-' + esc(st.id) + '">' +
              '<div class="ask-row">' +
                '<a class="ask-opt" href="https://claude.ai/new?q=' + esc(q) + '">Claude</a>' +
                '<a class="ask-opt" href="https://chatgpt.com/?q=' + esc(q) + '">ChatGPT</a>' +
                share +
                '<button class="ask-opt" data-ai="copy" data-id="' + esc(st.id) + '">Copy</button>' +
              '</div>' +
              '<div class="ask-note">Opens in the app if you have it installed. The reply ' +
                'starts with the gist in a few lines, then goes deeper, then offers three ' +
                'follow-up questions.</div>' +
            '</div>';

          expand = '<div class="expand">' + img +
            '<p class="sumtext">' + esc(st.summary) + '</p>' + analysis + actions + '</div>';
        }
        return '<div class="card' + (st.lead ? ' lead' : '') + (open ? ' open' : '') +
          '" data-card="' + esc(st.id) + '" role="button" tabindex="0" ' +
          'aria-expanded="' + open + '">' +
          '<div class="row"><div class="row-main">' + kicker +
            '<div class="headline">' + esc(st.headline) + '</div>' + sub +
            '<div class="time">' + esc(st.time) + '</div></div>' +
            '<div class="toggle" aria-hidden="true">' + (open ? '−' : '+') + '</div>' +
          '</div>' + expand +
        '</div>';
      }

      function storiesInner() {
        var section = data.sections.filter(function (s) { return s.id === state.active; })[0];
        if (!section) return '';
        if (!section.stories || !section.stories.length) {
          return '<div class="empty">Nothing filed for ' + esc(section.label) + ' this morning.</div>';
        }
        return section.stories.map(function (st) {
          return cardHtml(st, section.label);
        }).join('');
      }

      // Quietly flag a saved (not-today) edition served from cache/offline.
      function staleRibbon() {
        try {
          var meta = document.querySelector('meta[name=build]');
          if (!meta) return '';
          var built = new Date(meta.getAttribute('content'));
          if (isNaN(built.getTime())) return '';
          var opt = { timeZone: 'America/Toronto' };
          if (built.toLocaleDateString('en-CA', opt) < new Date().toLocaleDateString('en-CA', opt)) {
            return '<div class="stale">Saved edition · ' + esc(data.date) + '</div>';
          }
        } catch (e) {}
        return '';
      }

      function appHtml() {
        return '<div class="masthead">' +
            '<div class="date">' + esc(data.date) + '</div>' +
            '<div class="title">THE DAILY</div>' +
            '<div class="tagline">' + esc(taglineText()) + '</div>' +
          '</div>' +
          staleRibbon() +
          weatherHtml(data.weather) +
          tabsHtml() +
          '<div class="stories" id="stories">' + storiesInner() + '</div>' +
          '<div class="footer">THE DAILY · TORONTO · Tap any headline to read</div>';
      }

      var app = document.getElementById('app');

      // Rebuild only the stories column; masthead, weather, and tab strip (and
      // their scroll/open state) are left untouched. This is what keeps a tap
      // from resetting the reader's place.
      function refreshStories() {
        document.getElementById('stories').innerHTML = storiesInner();
        bindCards();
      }

      function selectTab(id) {
        if (id === state.active) return;
        state.active = id;
        state.openId = null;
        var tabs = document.querySelectorAll('.tab');
        Array.prototype.forEach.call(tabs, function (t) {
          var on = t.getAttribute('data-tab') === id;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on);
          if (on) t.scrollIntoView({ inline: 'center', block: 'nearest' });
        });
        refreshStories();
        // Start the new section at the top, tab strip stuck under the notch.
        var tabsEl = document.querySelector('.tabs');
        if (tabsEl) window.scrollTo(0, tabsEl.offsetTop);
      }

      function toggleCard(id) {
        var y = window.scrollY;
        state.openId = state.openId === id ? null : id;
        refreshStories();
        window.scrollTo(0, y);   // grow/collapse in place, never jump
      }

      function bindWeather() {
        var weather = document.getElementById('weather');
        if (!weather) return;
        function toggle() {
          var week = document.getElementById('wweek');
          var chev = document.getElementById('wchev');
          var showing = week.style.display !== 'none';
          week.style.display = showing ? 'none' : 'flex';
          chev.textContent = showing ? '▼' : '▲';
          weather.setAttribute('aria-expanded', String(!showing));
        }
        weather.addEventListener('click', toggle);
        weather.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
        });
      }

      function bindTabs() {
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
          btn.addEventListener('click', function () { selectTab(btn.getAttribute('data-tab')); });
        });
      }

      function bindCards() {
        Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
          function activate(ev) {
            // Let links and the Ask AI controls handle their own activation.
            if (ev.target.closest('a, button')) return;
            // While open, only the header row collapses it, so reading (and
            // selecting) the body never closes the story by accident.
            if (card.classList.contains('open') && !ev.target.closest('.row')) return;
            toggleCard(card.getAttribute('data-card'));
          }
          card.addEventListener('click', activate);
          card.addEventListener('keydown', function (ev) {
            if (ev.key !== 'Enter' && ev.key !== ' ') return;
            // Never swallow the key from a control that acts on it itself.
            if (ev.target.closest('a, button')) return;
            ev.preventDefault();
            activate(ev);
          });
          bindAsk(card);
        });
      }

      // Panel state is held in the DOM, not in `state`, so opening the
      // destinations never triggers a stories rebuild and never moves the page.
      function bindAsk(card) {
        var toggle = card.querySelector('.askai');
        if (!toggle) return;
        var panel = card.querySelector('.ask-panel');

        toggle.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var open = panel.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(open));
          toggle.textContent = open ? 'Ask AI ▴' : 'Ask AI ▾';
        });

        Array.prototype.forEach.call(panel.querySelectorAll('[data-ai]'), function (el) {
          var kind = el.getAttribute('data-ai');
          el.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var found = findStory(el.getAttribute('data-id'));
            if (!found) return;
            var prompt = buildPrompt(found.story, found.label);

            if (kind === 'share') {
              navigator.share({ text: prompt }).catch(function () {});
              return;
            }
            var label = el.textContent;
            copyText(prompt).then(function () {
              el.textContent = 'Copied';
            }).catch(function () {
              el.textContent = 'Copy failed';
            }).then(function () {
              setTimeout(function () { el.textContent = label; }, 1800);
            });
          });
        });
      }

      app.innerHTML = appHtml();
      bindWeather();
      bindTabs();
      bindCards();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
