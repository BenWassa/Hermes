<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />

  <meta name="theme-color" content="#101722" media="(prefers-color-scheme: dark)" />
  <meta name="application-name" content="The Daily" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="The Daily" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.svg" />
  <title>The Daily</title>
  <style>
    /* ---- Design tokens: The Morning Broadsheet ------------------------- */
    :root {
      --paper: #faf8f3;
      --desk: #efece6;
      --ink: #17130d;
      --ink-sub: #453f38;
      --ink-muted: #635d54;
      --meta: #6c665c;
      --rule: #dcd6cc;
      --rule-soft: #e3ded4;
      --navy: #1a2744;
      --navy-ink: #1a2744;
      --red: #8b1a1a;
      --tint-open: #f2ede4;
      --tint-analysis: #ece6da;
      --strip-bg: #1a2744;
      --strip-ink: #f7f4ee;
      --chip-hot: #8b1a1a;
      --chip-cool: #1a2744;
      --chip-ink: #faf8f3;
      --focus: #1a2744;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151a22;
        --desk: #0e1219;
        --ink: #e9e3d5;
        --ink-sub: #bcb6a8;
        --ink-muted: #948e82;
        --meta: #8f897d;
        --rule: #2a303a;
        --rule-soft: #2f3540;
        --navy: #6f82a8;
        --navy-ink: #a3b3d2;
        --red: #d1726b;
        --tint-open: #1b212b;
        --tint-analysis: #20262f;
        --strip-bg: #1b2334;
        --strip-ink: #e9e3d5;
        --chip-hot: #a8443c;
        --chip-cool: #3b4a6c;
        --chip-ink: #f0eadc;
        --focus: #a3b3d2;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 100%; }
    html, body { background: var(--desk); }
    body {
      font-family: 'Georgia', serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--paper);
      max-width: 680px;
      margin: 0 auto;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Masthead */
    .masthead {
      border-bottom: 4px solid var(--navy);
      padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
      background: var(--paper);
    }
    .masthead .date {
      font-size: 0.6875rem; color: var(--meta); letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .masthead .title {
      font-size: 2.375rem; font-weight: 700; letter-spacing: -0.01em;
      color: var(--navy); line-height: 1; margin-bottom: 2px;
    }
    .masthead .tagline {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; color: var(--meta);
      letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* Stale-edition ribbon */
    .stale {
      background: var(--tint-analysis); color: var(--meta);
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; text-align: center;
      padding: 7px 20px;
    }

    /* Weather strip */
    .weather {
      background: var(--strip-bg); color: var(--strip-ink);
      cursor: pointer; user-select: none;
    }
    .weather .summary {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
      min-height: 44px;
    }
    .weather .summary::-webkit-scrollbar { display: none; }
    .weather .ico { font-size: 1.375rem; }
    .weather .city { font-weight: 700; font-size: 0.9375rem; }
    .weather .temp { font-size: 0.9375rem; }
    .weather .muted { opacity: 0.72; font-size: 0.8125rem; white-space: nowrap; }
    .weather .chev { margin-left: auto; opacity: 0.6; font-size: 0.75rem; }
    .weather .week {
      display: flex; border-top: 1px solid rgba(255,255,255,0.12);
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
    }
    .weather .week::-webkit-scrollbar { display: none; }
    .weather .day {
      text-align: center; min-width: 52px; padding: 0 8px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .weather .day .d { font-size: 0.6875rem; opacity: 0.6; margin-bottom: 4px; }
    .weather .day .i { font-size: 1.125rem; }
    .weather .day .hi { font-size: 0.8125rem; font-weight: 700; margin-top: 4px; }
    .weather .day .lo { font-size: 0.6875rem; opacity: 0.5; }

    /* Tab nav */
    .tabs {
      display: flex; overflow-x: auto; border-bottom: 2px solid var(--navy);
      background: var(--paper); scrollbar-width: none;
      position: sticky; top: 0; z-index: 10;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; min-height: 44px; display: flex; align-items: center;
      padding: 0 18px; border: none; background: none; cursor: pointer;
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; font-weight: 700;
      color: var(--ink-muted); border-bottom: 3px solid transparent;
      margin-bottom: -2px; letter-spacing: 0.12em; text-transform: uppercase;
      transition: color 0.15s;
    }
    .tab.active { color: var(--navy-ink); border-bottom-color: var(--navy); }

    /* Stories */
    .stories { padding: 8px 20px 40px; }
    .opinion-desk + .opinion-desk { margin-top: 24px; }
    .desk-head {
      border-top: 2px solid var(--navy); padding: 12px 0 8px; margin-top: 2px;
    }
    .desk-title {
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--navy-ink);
    }
    .desk-dek {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.45;
      color: var(--meta); margin-top: 3px;
    }
    .opinion-desk .empty { padding: 24px 4px; }
    .empty {
      padding: 40px 4px; text-align: center; color: var(--meta);
      font-style: italic; font-size: 0.9375rem;
    }
    .card {
      border-top: 1px solid var(--rule); padding: 14px 0; cursor: pointer;
      background: var(--paper); transition: background 0.15s;
    }
    .card.lead { border-top: 3px solid var(--navy); padding: 20px 0 16px; }
    .card.open { background: var(--tint-open); }
    .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card .row-main { flex: 1; min-width: 0; }
    .card .kicker {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; color: var(--red); margin-bottom: 6px; text-transform: uppercase;
    }
    .card .tag {
      color: var(--chip-ink); padding: 2px 6px; margin-right: 8px;
      font-size: 0.5625rem; border-radius: 2px; vertical-align: 1px;
    }
    .card .tag.hot { background: var(--chip-hot); }
    .card .tag.cool { background: var(--chip-cool); }
    .card .headline {
      font-size: 1.0625rem; font-weight: 700; line-height: 1.25; color: var(--ink); margin-bottom: 6px;
    }
    .card.lead .headline { font-size: 1.375rem; }
    .card .sub {
      font-size: 0.875rem; color: var(--ink-sub); line-height: 1.4; margin-bottom: 4px; font-style: italic;
    }
    .card .time { font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta); margin-top: 4px; }
    .card .toggle { color: var(--navy-ink); opacity: 0.5; font-size: 1.125rem; flex-shrink: 0; margin-top: 2px; }
    .card .expand {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    }
    .card .expand .sumtext {
      font-size: 0.9375rem; color: var(--ink-sub); line-height: 1.7;
    }
    .card .expand img {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      background: var(--tint-open); border-radius: 3px; margin-bottom: 12px;
    }
    .card .analysis {
      margin-top: 12px; padding: 10px 14px; background: var(--tint-analysis);
      font-size: 0.875rem; line-height: 1.6; color: var(--ink-sub); font-style: italic;
    }
    .card .analysis .alabel {
      display: block; font-family: 'Arial', sans-serif; font-style: normal;
      font-size: 0.625rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--navy-ink); margin-bottom: 4px;
    }
    .card .readmore {
      display: inline-block; margin-top: 12px; min-height: 44px; line-height: 44px;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink); text-decoration: none;
    }
    .card .readmore:hover { text-decoration: underline; }
    .card .readmore:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    /* Ask AI: hand the clipping and a briefing prompt to a model */
    .card .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .askai, .card .ask-opt {
      border: none; background: none; padding: 0; cursor: pointer;
      min-height: 44px; line-height: 44px; text-decoration: none;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink);
    }
    .card .askai { margin-top: 12px; }
    .card .askai:hover, .card .ask-opt:hover { text-decoration: underline; }
    .card .askai:focus-visible, .card .ask-opt:focus-visible {
      outline: 2px solid var(--focus); outline-offset: 3px;
    }
    .card .ask-panel { display: none; border-top: 1px solid var(--rule-soft); margin-top: 4px; }
    .card .ask-panel.open { display: block; }
    .card .ask-row { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .ask-note {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.55;
      color: var(--meta); letter-spacing: 0.02em; padding-bottom: 12px;
    }

    /* Footer */
    .footer {
      border-top: 2px solid var(--navy);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta);
      text-align: center; letter-spacing: 0.06em;
    }
    .notice { padding: 40px 20px; text-align: center; color: var(--meta); font-style: italic; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  
/* Sports V2: a compact broadsheet sports page, never a dashboard. */
.sports-desk + .sports-desk { margin-top: 44px; }
.sports-desk .desk-head { margin-top: 0; }
.sports-toronto .desk-head { padding-bottom: 12px; }

/* Section openings read as editorial chapters, not generic app labels. */
.sports-desk .sports-desk-head {
  border-top: 3px solid var(--navy);
  padding: 10px 0 12px;
}
.sports-section-kicker {
  margin-bottom: 3px;
  font-family: 'Arial', sans-serif;
  font-size: 0.5625rem;
  font-weight: 800;
  line-height: 1.2;
  letter-spacing: 0.145em;
  text-transform: uppercase;
  color: var(--red);
}
.sports-desk .desk-title {
  font-family: 'Georgia', serif;
  font-size: 1.375rem;
  font-weight: 700;
  line-height: 1.08;
  letter-spacing: -0.025em;
  text-transform: none;
  color: var(--ink);
}
.sports-desk .desk-dek {
  margin-top: 5px;
  max-width: 38rem;
  font-size: 0.6875rem;
  line-height: 1.45;
}

/* Toronto clubs --------------------------------------------------------- */
.sports-team {
  position: relative;
  border-top: 1px solid var(--rule);
  padding: 18px 0 17px 46px;
}
.sports-team:first-of-type { border-top: 3px solid var(--navy); }

/* Text-only editorial marks. They deliberately evoke a newspaper club mark
   without reproducing protected team logos or introducing new colours. */
.sports-team::before {
  position: absolute;
  left: 0;
  top: 16px;
  width: 32px;
  min-height: 31px;
  padding: 4px 0 3px;
  border-top: 2px solid var(--navy);
  border-bottom: 1px solid var(--navy);
  font-family: 'Georgia', serif;
  font-size: 1.0625rem;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -0.04em;
  text-align: center;
  color: var(--navy-ink);
}
.sports-team[data-sports-team='leafs']::before { content: 'ML'; }
.sports-team[data-sports-team='raptors']::before {
  content: 'R';
  color: var(--red);
  border-top-color: var(--red);
  border-bottom-color: var(--red);
}
.sports-team[data-sports-team='blue-jays']::before { content: 'BJ'; }

.sports-team-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.sports-team-name {
  min-width: 0;
  font-family: 'Arial', sans-serif;
  font-size: 0.9375rem;
  font-weight: 800;
  letter-spacing: 0.105em;
  line-height: 1.2;
  text-transform: uppercase;
  color: var(--navy-ink);
}
.sports-team-league {
  margin-left: 7px;
  font-size: 0.5625rem;
  font-weight: 700;
  letter-spacing: 0.09em;
  color: var(--meta);
  white-space: nowrap;
}
.sports-phase {
  flex-shrink: 0;
  font-family: 'Arial', sans-serif;
  font-size: 0.5625rem;
  font-weight: 700;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--meta);
}
.sports-phase.postseason { color: var(--red); }

.sports-scoreline {
  display: grid;
  grid-template-columns: auto auto minmax(0, 1fr);
  align-items: baseline;
  gap: 5px 9px;
  margin-top: 11px;
  min-width: 0;
}
.sports-result {
  font-family: 'Arial', sans-serif;
  font-size: 0.6875rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--meta);
}
.sports-score {
  font-family: 'Georgia', serif;
  font-size: 1.625rem;
  line-height: 0.95;
  font-weight: 700;
  letter-spacing: -0.035em;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  white-space: nowrap;
}
.sports-opponent {
  min-width: 0;
  font-size: 0.9375rem;
  line-height: 1.3;
  color: var(--ink-sub);
  overflow-wrap: anywhere;
}
.sports-status-line {
  margin-top: 11px;
  font-size: 0.9375rem;
  line-height: 1.5;
  color: var(--ink-sub);
}
.sports-status-line strong {
  font-family: 'Arial', sans-serif;
  font-size: 0.6875rem;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--meta);
}

/* Record / standing / next fixture read as a single line of scorebook
   furniture rather than three dashboard cells. */
.sports-facts {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 6px 18px;
  margin-top: 11px;
  padding-top: 9px;
  border-top: 1px solid var(--rule-soft);
}
.sports-fact { min-width: 0; }
.sports-fact-label {
  display: inline;
  font-family: 'Arial', sans-serif;
  font-size: 0.5625rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--meta);
  margin-right: 5px;
}
.sports-fact-value {
  display: inline;
  font-size: 0.8125rem;
  line-height: 1.45;
  color: var(--ink-sub);
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.sports-next-time { white-space: normal; }

.sports-team-story,
.sports-major-story {
  display: block;
  min-height: 44px;
  margin-top: 13px;
  padding: 11px 0 2px;
  border-top: 1px solid var(--rule-soft);
  color: inherit;
  text-decoration: none;
}
.sports-team-story:hover .sports-story-title,
.sports-major-story:hover .sports-story-title { text-decoration: underline; }
.sports-team-story:focus-visible,
.sports-major-story:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}
.sports-story-label {
  display: block;
  font-family: 'Arial', sans-serif;
  font-size: 0.5625rem;
  font-weight: 800;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 5px;
}
.sports-story-title {
  display: block;
  font-family: 'Georgia', serif;
  font-size: 1rem;
  font-weight: 700;
  line-height: 1.3;
  color: var(--ink);
}
.sports-story-dek {
  display: block;
  margin-top: 4px;
  font-size: 0.8125rem;
  line-height: 1.45;
  color: var(--ink-sub);
}
.sports-story-meta {
  display: block;
  margin-top: 5px;
  font-family: 'Arial', sans-serif;
  font-size: 0.625rem;
  color: var(--meta);
}

/* Major events ---------------------------------------------------------- */
.sports-event {
  border-top: 1px solid var(--rule);
  padding: 19px 0 13px;
}
.sports-event:first-of-type { border-top: 3px solid var(--navy); }
.sports-event-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 3px;
}
.sports-event-name {
  font-family: 'Georgia', serif;
  font-size: 1.3125rem;
  line-height: 1.15;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.sports-event-mode {
  flex-shrink: 0;
  font-family: 'Arial', sans-serif;
  font-size: 0.5625rem;
  font-weight: 800;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--red);
}
.sports-event-source {
  padding-bottom: 7px;
  font-family: 'Arial', sans-serif;
  font-size: 0.5625rem;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--meta);
}
.sports-event-stage {
  margin-top: 3px;
  padding: 7px 0 6px;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule-soft);
  font-family: 'Arial', sans-serif;
  font-size: 0.625rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--navy-ink);
}
.sports-event-stage + .sports-match { border-top: 0; }
.sports-event-unavailable {
  padding: 9px 0 3px;
  font-size: 0.8125rem;
  font-style: italic;
  line-height: 1.45;
  color: var(--meta);
}
.sports-match {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 2px 14px;
  align-items: center;
  border-top: 1px solid var(--rule-soft);
  padding: 10px 0 9px;
}
.sports-match:first-of-type { border-top-color: var(--rule); }
.sports-match-teams {
  min-width: 0;
  font-size: 0.875rem;
  line-height: 1.35;
  color: var(--ink-sub);
  overflow-wrap: anywhere;
}
.sports-match-score {
  font-family: 'Georgia', serif;
  font-size: 1.1875rem;
  font-weight: 700;
  letter-spacing: -0.025em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  color: var(--ink);
}
.sports-match-meta {
  grid-column: 1 / -1;
  font-family: 'Arial', sans-serif;
  font-size: 0.5625rem;
  line-height: 1.3;
  letter-spacing: 0.055em;
  text-transform: uppercase;
  color: var(--meta);
}
.sports-canada { font-weight: 700; color: var(--ink); }

.sports-table-wrap {
  margin-top: 16px;
  border-top: 2px solid var(--navy);
  padding-top: 10px;
}
.sports-table-label {
  font-family: 'Arial', sans-serif;
  font-size: 0.625rem;
  font-weight: 800;
  letter-spacing: 0.105em;
  text-transform: uppercase;
  color: var(--navy-ink);
  margin-bottom: 4px;
}
.sports-table-note {
  margin: 0 0 8px;
  font-family: 'Arial', sans-serif;
  font-size: 0.625rem;
  line-height: 1.4;
  color: var(--meta);
}
.sports-table-note span { font-weight: 800; color: var(--ink-sub); }
.sports-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  font-family: 'Arial', sans-serif;
  font-size: 0.6875rem;
  color: var(--ink-sub);
  font-variant-numeric: tabular-nums;
}
.sports-table th,
.sports-table td {
  border-top: 1px solid var(--rule-soft);
  padding: 7px 4px;
  text-align: right;
  vertical-align: middle;
}
.sports-table th {
  font-size: 0.5625rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;

/commentisfree/2026/oct/23/trump-moral-squalor"}, {"id": "o2", "lead": false, "kicker": "UK POLITICS", "headline": "Labour must tell the truth about immigration, argues Gaby Hinsliff", "sub": "Our economy and the NHS need it, and making foreign workers' lives miserable will undermine integration.", "summary": "Gaby Hinsliff argues that the Labour party must finally tell the truth about immigration, stating that the UK economy and the NHS critically depend on it. She criticizes the Home Secretary's plans to make foreign workers' lives more miserable, contending that such policies will undermine integration efforts. Hinsliff advocates for a more honest and pragmatic approach to immigration policy.", "analysis": null, "time": "5:00 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/3f6ecef4d7954ca8740119625b4f4568d35fb1be/0_0_3000_2400/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/oct/23/labour-truth-immigration-economy-nhs-home-secretary"}, {"id": "o3", "lead": false, "kicker": "AI ETHICS", "headline": "The Guardian calls for global regulation of AI safety", "sub": "The current US administration is an obstacle, but public demand for protection will ultimately prevail.", "summary": "The Guardian's editorial board calls for advancing global regulation on AI safety, asserting that while the current US administration poses an obstacle, public demand for protection will ultimately prevail. The editorial emphasizes the urgent need for international cooperation to manage the risks associated with artificial intelligence. It argues that robust oversight is essential to ensure AI develops responsibly and safely.", "analysis": null, "time": "Yesterday", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/7b2ac9acb1cb8d1678d58a8d278df37914456a10/542_0_5417_4335/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/oct/22/the-guardian-view-on-ai-safety-the-push-for-global-regulation-must-advan   <script>
    (function () {
      var raw = document.getElementById('edition').textContent;
      var data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<div class="notice">No edition loaded. Run the build to generate today’s paper.</div>';
        return;
      }

      var state = { active: (data.sections[0] || {}).id, openId: null };

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function isHotTag(t) {
        return /^(DEVELOPING|BREAKING|LIVE|WAR|ALERT|URGENT)$/i.test(t || '');
      }

      function buildPrompt(st, sectionLabel) {
        var L = [];
        L.push('I read this in my morning paper and I want to understand it properly.');
        L.push('');
        L.push('THE CLIPPING');
        L.push('Headline: ' + st.headline);
        if (st.author) L.push('Author: ' + st.author);
        if (st.publication) L.push('Publication: ' + st.publication);
        if (st.sub) L.push('Standfirst: ' + st.sub);
        if (st.summary) L.push('Summary: ' + st.summary);
        if (st.analysis) L.push("My paper's why-it-matters note: " + st.analysis);
        L.push('Section: ' + sectionLabel + '. Filed ' + (st.time || 'this morning') +
               ', edition of ' + data.date + '.');
        if (st.link) L.push('Source: ' + st.link);
        L.push('');
        L.push('WHAT I WANT');
        L.push('A briefing that leaves me genuinely informed, not a restatement of what I just');
        L.push('pasted. Assume I know nothing beyond the clipping above.');
        L.push('');
        L.push('Check current reporting first if you are able to search. My clipping is a');
        L.push('summary and may be incomplete or already overtaken by events. If you cannot');
        L.push('search, say so in one line at the top, then separate what you are confident');
        L.push('about from what you would want verified.');
        L.push('');
        L.push('STRUCTURE');
        L.push('I am reading this on a phone. Build the answer in layers, heaviest first, so');
        L.push('I can stop at the end of any layer and still have got something whole. Use');
        L.push('these markdown headings exactly, so they render large on a small screen.');
        L.push('');
        L.push('# The gist');
        L.push('An H1 of six to ten words stating the actual point, not the topic. Then two or');
        L.push('three short sentences giving me the whole story in plain words. If I read');
        L.push('nothing else, this is what I walk away knowing. Correct my clipping here if it');
        L.push('is wrong or out of date.');
        L.push('');
        L.push('## Why it matters');
        L.push('Two or three short sentences on the stakes and the second order effects. Be');
        L.push('concrete about who gains, who pays, how much, and by when.');
        L.push('');
        L.push('## How we got here');
        L.push('Only the background I need to follow this story. Not a history lecture.');
        L.push('');
        L.push('## Where it is contested');
        L.push('The strongest disagreement among serious people, put fairly. If it is genuinely');
        L.push('uncontested, say so in one sentence and move on.');
        L.push('');
        L.push('## What to watch');
        L.push('Three bullets, each a specific checkable marker with a rough timeframe.');
        L.push('');
        L.push('## Ask me next');
        L.push('Three numbered questions, ordered by what would teach me the most. I will reply');
        L.push('with a digit.');
        L.push('');
        L.push('READING ON A PHONE');
        L.push('Short paragraphs: three sentences at most, none longer than about sixty words,');
        L.push('with a blank line between them. No tables, no nested bullets, no wall of text.');
        L.push('Around 500 words in total. Hard ceiling 650. Do not pad to reach a length; the');
        L.push('gist and why it matters are worth more than the sections under them.');
        L.push('');
        L.push('VOICE');
        L.push('Financial Times, not an encyclopedia and not a chatbot. Plain, confident,');
        L.push('concrete. Specifics over abstractions: names, numbers, dates, stakes. Every');
        L.push('sentence earns its place. No preamble, no throat clearing, no restating my');
        L.push('prompt back to me, no hedging filler, no em dashes. Where you are uncertain,');
        L.push('mark it in the sentence it applies to rather than in a disclaimer paragraph.');
        return L.join('\n');
      }

      function findStory(id) {
        var followed = data.following || [];
        for (var f = 0; f < followed.length; f++) {
          if (followed[f].id === id) {
            return { story: followed[f], label: 'Opinion · Following' };
          }
        }
        for (var i = 0; i < data.sections.length; i++) {
          var list = data.sections[i].stories || [];
          for (var j = 0; j < list.length; j++) {
            if (list[j].id === id) {
              return { story: list[j], label: data.sections[i].label };
            }
          }
        }
        return null;
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        return new Promise(function (resolve, reject) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('copy failed'));
        });
      }

      function taglineText() {
        var labels = data.sections
          .filter(function (s) { return s.id !== 'front'; })
          .map(function (s) { return s.label; });
        return (labels.length ? labels : ['Toronto', 'World', 'Business']).join(' · ');
      }

      function weatherHtml(w) {
        if (!w || !w.icon) return '';
        var week = (w.week || []).map(function (d) {
          return '<div class="day"><div class="d">' + esc(d.day) + '</div>' +
            '<div class="i">' + esc(d.icon) + '</div>' +
            '<div class="hi">' + esc(d.hi) + '°</div>' +
            '<div class="lo">' + esc(d.lo) + '°</div></div>';
        }).join('');
        return '<div class="weather" id="weather" role="button" tabindex="0" ' +
          'aria-expanded="false" aria-label="Toronto weather, tap for the week">' +
          '<div class="summary">' +
            '<span class="ico">' + esc(w.icon) + '</span>' +
            '<span class="city">Toronto</span>' +
            '<span class="temp">' + esc(w.high) + '° / ' + esc(w.low) + '°</span>' +
            '<span class="muted">' + esc(w.condition) + '</span>' +
            '<span class="muted">Rain ' + esc(w.rain) + '</span>' +
            '<span class="muted">Wind ' + esc(w.wind) + '</span>' +
            '<span class="chev" id="wchev">▼</span>' +
          '</div>' +
          '<div class="week" id="wweek" style="display:none">' + week + '</div>' +
        '</div>';
      }

      function tabsHtml() {
        return '<div class="tabs" role="tablist">' + data.sections.map(function (s) {
          var on = s.id === state.active;
          return '<button class="tab' + (on ? ' active' : '') + '" role="tab" ' +
            'aria-selected="' + on + '" data-tab="' + esc(s.id) + '">' + esc(s.label) + '</button>';
        }).join('') + '</div>';
      }

      function cardHtml(st, sectionLabel) {
        var open = st.id === state.openId;
        var tag = st.tag
          ? '<span class="tag ' + (isHotTag(st.tag) ? 'hot' : 'cool') + '">' + esc(st.tag) + '</span>'
          : '';
        var kicker = st.kicker ? '<div class="kicker">' + tag + esc(st.kicker) + '</div>' : '';
        var sub = st.sub ? '<div class="sub">' + esc(st.sub) + '</div>' : '';
        var filed = st.time ? '<div class="time">' + esc(st.time) + '</div>' : '';
        var expand = '';
        if (open) {
          var img = st.image
            ? '<img src="' + esc(st.image) + '" alt="' + esc(st.headline) + '" ' +
              'loading="lazy" onerror="this.remove()" />'
            : '';
          var analysis = st.analysis
            ? '<div class="analysis"><span class="alabel">Why it matters</span>' + esc(st.analysis) + '</div>'
            : '';
          var link = st.link
            ? '<a class="readmore" href="' + esc(st.link) + '" target="_blank" rel="noopener">Read full story →</a>'
            : '';

          var q = encodeURIComponent(buildPrompt(st, sectionLabel));
          var share = navigator.share
            ? '<button class="ask-opt" data-ai="share" data-id="' + esc(st.id) + '">Share to app…</button>'
            : '';
          var actions = '<div class="actions">' + link +
            '<button class="askai" data-ask="' + esc(st.id) + '" aria-expanded="false" ' +
              'aria-controls="ask-' + esc(st.id) + '">Ask AI ▾</button></div>' +
            '<div class="ask-panel" id="ask-' + esc(st.id) + '">' +
              '<div class="ask-row">' +
                '<a class="ask-opt" href="https://claude.ai/new?q=' + esc(q) + '">Claude</a>' +
                '<a class="ask-opt" href="https://chatgpt.com/?q=' + esc(q) + '">ChatGPT</a>' +
                share +
                '<button class="ask-opt" data-ai="copy" data-id="' + esc(st.id) + '">Copy</button>' +
              '</div>' +
              '<div class="ask-note">Opens in the app if you have it installed. The reply ' +
                'starts with the gist in a few lines, then goes deeper, then offers three ' +
                'follow-up questions.</div>' +
            '</div>';

          expand = '<div class="expand">' + img +
            '<p class="sumtext">' + esc(st.summary) + '</p>' + analysis + actions + '</div>';
        }
        return '<div class="card' + (st.lead ? ' lead' : '') + (open ? ' open' : '') +
          '" data-card="' + esc(st.id) + '" role="button" tabindex="0" ' +
          'aria-expanded="' + open + '">' +
          '<div class="row"><div class="row-main">' + kicker +
            '<div class="headline">' + esc(st.headline) + '</div>' + sub + filed +
            '</div><div class="toggle" aria-hidden="true">' + (open ? '−' : '+') + '</div>' +
          '</div>' + expand +
        '</div>';
      }

      function opinionGroupHtml(id, className, title, dek, stories, sectionLabel, emptyText) {
        var body = stories.length
          ? stories.map(function (st) { return cardHtml(st, sectionLabel); }).join('')
          : '<div class="empty">' + esc(emptyText) + '</div>';
        return '<section class="opinion-desk ' + className + '" aria-labelledby="' + id + '">' +
            '<div class="desk-head"><h2 class="desk-title" id="' + id + '">' + esc(title) + '</h2>' +
              '<div class="desk-dek">' + esc(dek) + '</div></div>' +
            body +
          '</section>';
      }

      function storiesInner() {
        var section = data.sections.filter(function (s) { return s.id === state.active; })[0];
        if (!section) return '';

        var sectionStories = section.stories || [];
        var following = data.following || [];
        if (section.id === 'opinion' && following.length) {
          return opinionGroupHtml(
              'following-title', 'following-block', 'Following',
              'New writing from voices you follow', following, 'Opinion · Following',
              'Nothing new from followed voices this morning.'
            ) +
            opinionGroupHtml(
              'today-opinion-title', 'today-opinion', 'Today’s Opinion',
              'Selected independently by the morning desk', sectionStories, section.label,
              'Nothing else filed for Opinion this morning.'
            );
        }

        if (!sectionStories.length) {
          return '<div class="empty">Nothing filed for ' + esc(section.label) + ' this morning.</div>';
        }
        return sectionStories.map(function (st) {
          return cardHtml(st, section.label);
        }).join('');
      }

      function staleRibbon() {
        try {
          var meta = document.querySelector('meta[name=build]');
          if (!meta) return '';
          var built = new Date(meta.getAttribute('content'));
          if (isNaN(built.getTime())) return '';
          var opt = { timeZone: 'America/Toronto' };
          if (built.toLocaleDateString('en-CA', opt) < new Date().toLocaleDateString('en-CA', opt)) {
            return '<div class="stale">Saved edition · ' + esc(data.date) + '</div>';
          }
        } catch (e) {}
        return '';
      }

      function appHtml() {
        return '<div class="masthead">' +
            '<div class="date">' + esc(data.date) + '</div>' +
            '<div class="title">THE DAILY</div>' +
            '<div class="tagline">' + esc(taglineText()) + '</div>' +
          '</div>' +
          staleRibbon() +
          weatherHtml(data.weather) +
          tabsHtml() +
          '<div class="stories" id="stories">' + storiesInner() + '</div>' +
          '<div class="footer">THE DAILY · TORONTO · Tap any headline to read</div>';
      }

      var app = document.getElementById('app');

      function refreshStories() {
        document.getElementById('stories').innerHTML = storiesInner();
        bindCards();
      }

      function selectTab(id) {
        if (id === state.active) return;
        state.active = id;
        state.openId = null;
        var tabs = document.querySelectorAll('.tab');
        Array.prototype.forEach.call(tabs, function (t) {
          var on = t.getAttribute('data-tab') === id;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on);
          if (on) t.scrollIntoView({ inline: 'center', block: 'nearest' });
        });
        refreshStories();
        var tabsEl = document.querySelector('.tabs');
        if (tabsEl) window.scrollTo(0, tabsEl.offsetTop);
      }

      function toggleCard(id) {
        var y = window.scrollY;
        state.openId = state.openId === id ? null : id;
        refreshStories();
        window.scrollTo(0, y);
      }

      function bindWeather() {
        var weather = document.getElementById('weather');
        if (!weather) return;
        function toggle() {
          var week = document.getElementById('wweek');
          var chev = document.getElementById('wchev');
          var showing = week.style.display !== 'none';
          week.style.display = showing ? 'none' : 'flex';
          chev.textContent = showing ? '▼' : '▲';
          weather.setAttribute('aria-expanded', String(!showing));
        }
        weather.addEventListener('click', toggle);
        weather.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
        });
      }

      function bindTabs() {
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
          btn.addEventListener('click', function () { selectTab(btn.getAttribute('data-tab')); });
        });
      }

      function bindCards() {
        Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
          function activate(ev) {
            if (ev.target.closest('a, button')) return;
            if (card.classList.contains('open') && !ev.target.closest('.row')) return;
            toggleCard(card.getAttribute('data-card'));
          }
          card.addEventListener('click', activate);
          card.addEventListener('keydown', function (ev) {
            if (ev.key !== 'Enter' && ev.key !== ' ') return;
            if (ev.target.closest('a, button')) return;
            ev.preventDefault();
            activate(ev);
          });
          bindAsk(card);
        });
      }

      function bindAsk(card) {
        var toggle = card.querySelector('.askai');
        if (!toggle) return;
        var panel = card.querySelector('.ask-panel');

        toggle.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var open = panel.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(open));
          toggle.textContent = open ? 'Ask AI ▴' : 'Ask AI ▾';
        });

        Array.prototype.forEach.call(panel.querySelectorAll('[data-ai]'), function (el) {
          var kind = el.getAttribute('data-ai');
          el.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var found = findStory(el.getAttribute('data-id'));
            if (!found) return;
            var prompt = buildPrompt(found.story, found.label);

            if (kind === 'share') {
              navigator.share({ text: prompt }).catch(function () {});
              return;
            }
            var label = el.textContent;
            copyText(prompt).then(function () {
              el.textContent = 'Copied';
            }).catch(function () {
              el.textContent = 'Copy failed';
            }).then(function () {
              setTimeout(function () { el.textContent = label; }, 1800);
            });
          });
        });
      }

      app.innerHTML = appHtml();
      bindWeather();
      bindTabs();
      bindCards();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
  <script>
(function () {
  var editionNode = document.getElementById('edition');
  if (!editionNode) return;

  var edition;
  try { edition = JSON.parse(editionNode.textContent); } catch (e) { return; }
  var sports = edition.sports;
  if (!sports) return;

  var TEAM_WORDMARK = {
    'leafs': 'LEAFS',
    'raptors': 'RAPTORS',
    'blue-jays': 'BLUE JAYS'
  };
  var TRUSTED_ASSET_HOSTS = {
    'assets.nhle.com': true,
    'cdn.nba.com': true,
    'www.mlbstatic.com': true,
    'a.espncdn.com': true,
    'secure.espncdn.com': true
  };
  var MARK_TIMEOUT_MS = 3500;

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function safeUrl(value) {
    try {
      var url = new URL(String(value || ''), window.location.href);
      if (url.protocol === 'http:' || url.protocol === 'https:') return url.href;
    } catch (e) {}
    return '';
  }

  function safeAssetUrl(value) {
    try {
      var url = new URL(String(value || ''));
      if (url.protocol === 'https:' && TRUSTED_ASSET_HOSTS[url.hostname]) return url.href;
    } catch (e) {}
    return '';
  }

  function words(value) {
    return String(value || '').replace(/[-_]+/g, ' ').replace(/\b\w/g, function (c) {
      return c.toUpperCase();
    });
  }

  function torontoWhen(iso) {
    if (!iso) return '';
    var value = new Date(iso);
    if (isNaN(value.getTime())) return '';
    var date = value.toLocaleDateString('en-CA', {
      timeZone: 'America/Toronto', weekday: 'short', month: 'short', day: 'numeric'
    });
    var time = value.toLocaleTimeString('en-CA', {
      timeZone: 'America/Toronto', hour: 'numeric', minute: '2-digit'
    });
    return date + ' · ' + time;
  }

  function gamePlace(game) {
    if (!game) return '';
    return game.home_away === 'home' ? 'vs' : '@';
  }

  function gameScore(game) {
    if (!game || game.team_score == null || game.opponent_score == null) return '';
    return esc(game.team_score) + '–' + esc(game.opponent_score);
  }

  function standingText(standing) {
    if (!standing) return '';
    if (standing.label) return standing.label;
    var bits = [];
    if (standing.rank != null) bits.push('#' + standing.rank);
    if (standing.scope) bits.push(standing.scope);
    if (standing.games_back) bits.push(standing.games_back + ' GB');
    return bits.join(' · ');
  }

  function sectionHeadHtml(kicker, title, deck, id) {
    return '<div class="desk-head sports-desk-head">' +
      '<div class="sports-section-kicker">' + esc(kicker) + '</div>' +
      '<h2 class="desk-title" id="' + esc(id) + '">' + esc(title) + '</h2>' +
      '<div class="desk-dek">' + esc(deck) + '</div></div>';
  }

  function teamMarkHtml(mark) {
    if (!mark) return '';
    var light = safeAssetUrl(mark.light);
    var dark = safeAssetUrl(mark.dark);
    if (!light) return '';
    var image = '<img src="' + esc(light) + '" alt="" aria-hidden="true" width="48" height="48" decoding="async" referrerpolicy="no-referrer">';
    if (dark) {
      image = '<picture><source media="(prefers-color-scheme: dark)" srcset="' + esc(dark) + '">' + image + '</picture>';
    }
    return '<span class="sports-mark sports-mark-loading" data-sports-mark aria-hidden="true">' + image +
      '<span class="sports-mark-fallback">' + esc(mark.fallback || '') + '</span></span>';
  }

  function crestHtml(url, tableMode) {
    var href = safeAssetUrl(url);
    if (!href) return '';
    var size = tableMode ? 24 : 30;
    return '<span class="sports-club-crest sports-mark-loading" data-sports-mark aria-hidden="true">' +
      '<img src="' + esc(href) + '" alt="" width="' + size + '" height="' + size + '" loading="lazy" decoding="async" fetchpriority="low" referrerpolicy="no-referrer">' +
      '</span>';
  }

  function settleMarks(root) {
    Array.prototype.forEach.call(root.querySelectorAll('[data-sports-mark]'), function (mark) {
      if (mark.getAttribute('data-wired') === 'true') return;
      mark.setAttribute('data-wired', 'true');
      var img = mark.querySelector('img');
      if (!img) { mark.classList.add('sports-mark-failed'); return; }
      var timer;
      function loaded() {
        window.clearTimeout(timer);
        mark.classList.remove('sports-mark-loading', 'sports-mark-failed');
        mark.classList.add('sports-mark-loaded');
      }
      function failed() {
        window.clearTimeout(timer);
        mark.classList.remove('sports-mark-loading', 'sports-mark-loaded');
        mark.classList.add('sports-mark-failed');
      }
      img.addEventListener('load', loaded, { once: true });
      img.addEventListener('error', failed, { once: true });
      timer = window.setTimeout(failed, MARK_TIMEOUT_MS);
      if (img.complete) {
        if (img.naturalWidth > 0) loaded(); else failed();
      }
    });
  }

  function factHtml(label, value, extraClass) {
    if (!value) return '';
    return '<div class="sports-fact"><span class="sports-fact-label">' + esc(label) + '</span>' +
      '<span class="sports-fact-value' + (extraClass ? ' ' + extraClass : '') + '">' +
      esc(value) + '</span></div>';
  }

  function teamHeadlineHtml(headline) {
    if (!headline || !headline.headline) return '';
    var href = safeUrl(headline.url);
    var meta = [headline.source, words(headline.significance)].filter(Boolean).join(' · ');
    var inner = '<span class="sports-story-label">Major update</span>' +
      '<span class="sports-story-title">' + esc(headline.headline) + '</span>' +
      (headline.description ? '<span class="sports-story-dek">' + esc(headline.description) + '</span>' : '') +
      (meta ? '<span class="sports-story-meta">' + esc(meta) + '</span>' : '');
    if (!href) return '<div class="sports-team-story">' + inner + '</div>';
    return '<a class="sports-team-story" href="' + esc(href) + '" target="_blank" rel="noopener">' + inner + '</a>';
  }

  function teamRowHtml(row) {
    var snapshot = (row || {}).snapshot || {};
    var team = snapshot.team || {};
    var phase = snapshot.phase || 'offseason';
    var key = team.key || '';
    var name = TEAM_WORDMARK[key] || team.name || key;
    var league = team.league || '';
    var phaseClass = phase === 'postseason' ? ' postseason' : '';
    var head = '<div class="sports-team-head"><div class="sports-team-name">' + esc(name) +
      (league ? '<span class="sports-team-league">' + esc(league) + '</span>' : '') +
      '</div><div class="sports-phase' + phaseClass + '">' + esc(words(phase)) + '</div></div>';

    var body = '';
    if (!snapshot.available) {
      body = '<div class="sports-status-line"><strong>Unavailable</strong> · Score data could not be verified this morning.</div>';
    } else if (phase === 'offseason') {
      var offNext = snapshot.next_game;
      body = '<div class="sports-status-line"><strong>Offseason</strong>' +
        (offNext ? ' · Next: ' + esc(gamePlace(offNext) + ' ' + offNext.opponent + ' · ' + torontoWhen(offNext.start_time_toronto || offNext.start_time_utc)) : '') +
        '</div>';
    } else {
      var last = snapshot.last_game;
      if (last) {
        var resultLabel = last.result || words(last.status || 'Final');
        var score = gameScore(last);
        var opponent = gamePlace(last) + ' ' + (last.opponent || 'Opponent');
        body += '<div class="sports-scoreline"><span class="sports-result">' + esc(resultLabel) + '</span>' +
          (score ? '<span class="sports-score">' + score + '</span>' : '') +
          '<span class="sports-opponent">' + esc(opponent) + '</span></div>';
      }

      var next = snapshot.next_game;
      var nextText = '';
      if (next) {
        var nextStatus = String(next.status || '').toLowerCase();
        if (nextStatus === 'postponed' || nextStatus === 'cancelled') {
          nextText = words(nextStatus) + ' · ' + gamePlace(next) + ' ' + next.opponent;
        } else {
          nextText = gamePlace(next) + ' ' + next.opponent + ' · ' + torontoWhen(next.start_time_toronto || next.start_time_utc);
        }
      }
      var facts = factHtml('Record', snapshot.record && snapshot.record.display) +
        factHtml('Standing', standingText(snapshot.standing)) +
        factHtml('Next', nextText, 'sports-next-time');
      if (facts) body += '<div class="sports-facts">' + facts + '</div>';
      if (!last && !facts) body += '<div class="sports-status-line">No current game state is available.</div>';
    }

    return '<article class="sports-team" data-sports-team="' + esc(key) + '">' + teamMarkHtml(row && row.mark) +
      '<div class="sports-team-copy">' + head + body + teamHeadlineHtml(row && row.headline) + '</div></article>';
  }

  function clubHtml(name, logoUrl, tableMode) {
    var cls = String(name || '').toLowerCase() === 'canada' ? ' sports-canada' : '';
    return '<span class="sports-club' + cls + '">' + crestHtml(logoUrl, tableMode) + '<span>' + esc(name) + '</span></span>';
  }

  function matchTeamsHtml(match) {
    return clubHtml(match.home_team, match.home_logo_url, false) +
      ' <span class="sports-versus" aria-hidden="true">v</span> ' +
      clubHtml(match.away_team, match.away_logo_url, false);
  }

  function eventMatchHtml(match, commonStage) {
    var status = String(match.status || '').toLowerCase();
    var final = status === 'final';
    var score = final && match.home_score != null && match.away_score != null
      ? esc(match.home_score) + '–' + esc(match.away_score)
      : torontoWhen(match.start_time_toronto || match.start_time_utc);
    if (status === 'postponed' || status === 'cancelled') score = words(status);
    var stage = match.stage && match.stage !== commonStage ? words(match.stage) : '';
    var meta = [stage, match.detail || ''].filter(Boolean).join(' · ');
    return '<div class="sports-match"><div class="sports-match-teams">' + matchTeamsHtml(match) + '</div>' +
      '<div class="sports-match-score">' + esc(score) + '</div>' +
      (meta ? '<div class="sports-match-meta">' + esc(meta) + '</div>' : '') + '</div>';
  }

  function commonEventStage(event) {
    var stages = (event.matches || []).map(function (match) { return match.stage || ''; }).filter(Boolean);
    if (!stages.length) return '';
    return stages.every(function (stage) { return stage === stages[0]; }) ? stages[0] : '';
  }

  function tableHasPositionGap(rows) {
    for (var i = 1; i < rows.length; i += 1) {
      if (Number(rows[i].position) > Number(rows[i - 1].position) + 1) return true;
    }
    return false;
  }

  function eventTableHtml(table, eventKey) {
    if (!table || !(table.rows || []).length) return '';
    var rowsData = table.rows || [];
    var isChampionsLeague = eventKey === 'champions-league';
    var hasGap = tableHasPositionGap(rowsData);
    var previousPosition = null;
    var rows = rowsData.map(function (row) {
      var prefix = '';
      if (previousPosition != null && Number(row.position) > Number(previousPosition) + 1) {
        prefix = '<tr class="sports-table-gap" aria-hidden="true"><td colspan="5"><span>Positions ' +
          esc(Number(previousPosition) + 1) + '–' + esc(Number(row.position) - 1) + ' omitted</span></td></tr>';
      }
      var rowClass = row.canada ? ' class="canada"' : '';
      if (isChampionsLeague && Number(row.position) === 9) rowClass = ' class="sports-qualification-cut' + (row.canada ? ' canada' : '') + '"';
      previousPosition = row.position;
      return prefix + '<tr' + rowClass + '><td>' + esc(row.position) + '</td>' +
        '<td>' + clubHtml(row.team, row.logo_url, true) + '</td><td>' + esc(row.played == null ? '–' : row.played) + '</td>' +
        '<td>' + esc(row.points == null ? '–' : row.points) + '</td>' +
        '<td class="sports-gd">' + esc(row.goal_difference == null ? '–' : row.goal_difference) + '</td></tr>';
    }).join('');
    var label = table.label || 'Table';
    if (isChampionsLeague && hasGap) label += ' · leaders + qualification cut';
    var cutNote = isChampionsLeague && rowsData.some(function (row) { return Number(row.position) === 8; }) && rowsData.some(function (row) { return Number(row.position) === 9; })
      ? '<div class="sports-table-note"><span>Top 8</span> qualify directly · <span>9–24</span> enter the knockout playoff</div>'
      : '';
    return '<div class="sports-table-wrap"><div class="sports-table-label">' + esc(label) + '</div>' +
      cutNote + '<table class="sports-table"><thead><tr><th>#</th><th>Team</th><th>P</th><th>Pts</th><th class="sports-gd">GD</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>';
  }

  function highlightsHtml(items) {
    if (!(items || []).length) return '';
    return '<div class="sports-highlights">' + items.map(function (item) {
      var flags = [];
      if (item.canada) flags.push('Canada');
      if (item.world_record) flags.push('Record');
      if (item.final) flags.push('Final');
      return '<div class="sports-highlight"><div class="sports-highlight-title">' + esc(item.label) + '</div>' +
        '<div class="sports-highlight-detail">' + esc(item.detail) +
        (flags.length ? ' · ' + esc(flags.join(' · ')) : '') + '</div></div>';
    }).join('') + '</div>';
  }

  function eventHasContent(event) {
    if (!event) return false;
    if (!event.available) return !!event.event_mode;
    return (event.matches || []).length > 0 ||
      (event.highlights || []).length > 0 ||
      !!(event.standings && (event.standings.rows || []).length);
  }

  function eventHtml(event) {
    var commonStage = commonEventStage(event);
    var head = '<div class="sports-event-head"><div class="sports-event-name">' + esc(event.label) + '</div>' +
      (event.event_mode ? '<div class="sports-event-mode">Event edition</div>' : '') + '</div>' +
      (event.source ? '<div class="sports-event-source">Source: ' + esc(event.source) + '</div>' : '') +
      (commonStage ? '<div class="sports-event-stage">' + esc(words(commonStage)) + '</div>' : '');
    if (!event.available) {
      return '<article class="sports-event" data-sports-event="' + esc(event.key) + '">' + head +
        '<div class="sports-event-unavailable">Verified event data is unavailable this morning.</div></article>';
    }
    return '<article class="sports-event" data-sports-event="' + esc(event.key) + '">' + head +
      (event.matches || []).map(function (match) { return eventMatchHtml(match, commonStage); }).join('') +
      eventTableHtml(event.standings, event.key) + highlightsHtml(event.highlights || []) + '</article>';
  }

  function majorEventsHtml(payload) {
    var events = (((payload || {}).major_events || {}).events || []).filter(eventHasContent);
    if (!events.length) return '';
    var eventMode = !!((payload || {}).major_events || {}).event_mode;
    return '<section class="sports-desk sports-events" aria-labelledby="sports-events-title">' +
      sectionHeadHtml('Global board', 'Major Events', eventMode ? 'Tournament edition · the important state, still bounded' : 'Only competitions with something worth knowing this morning', 'sports-events-title') +
      events.map(eventHtml).join('') + '</section>';
  }

  function majorHeadlineHtml(item) {
    var href = safeUrl(item.url);
    var eventLabel = item.event_key ? words(item.event_key.replace(/-20\d\d$/, '')) : 'Major sport';
    var inner = '<span class="sports-story-label">' + esc(eventLabel) + '</span>' +
      '<span class="sports-story-title">' + esc(item.headline) + '</span>' +
      (item.description ? '<span class="sports-story-dek">' + esc(item.description) + '</span>' : '') +
      (item.source ? '<span class="sports-story-meta">' + esc(item.source) + '</span>' : '');
    if (!href) return '<div class="sports-major-story">' + inner + '</div>';
    return '<a class="sports-major-story" href="' + esc(href) + '" target="_blank" rel="noopener">' + inner + '</a>';
  }

  function majorHeadlinesHtml(payload) {
    var items = (payload || {}).major_headlines || [];
    if (!items.length) return '';
    return '<section class="sports-desk sports-headlines" aria-labelledby="sports-headlines-title">' +
      sectionHeadHtml('The read', 'Major Headlines', 'Exceptional developments only', 'sports-headlines-title') +
      items.map(majorHeadlineHtml).join('') + '</section>';
  }

  function sportsHtml(payload) {
    var toronto = (payload || {}).toronto || [];
    var torontoHtml = '<section class="sports-desk sports-toronto" aria-labelledby="sports-toronto-title">' +
      sectionHeadHtml('Home teams', 'Toronto', 'Leafs · Raptors · Blue Jays', 'sports-toronto-title') +
      toronto.map(teamRowHtml).join('') + '</section>';
    return torontoHtml + majorEventsHtml(payload) + majorHeadlinesHtml(payload);
  }

  function warmCrestOrigin() {
    if (document.querySelector('link[data-sports-preconnect]')) return;
    var link = document.createElement('link');
    link.rel = 'preconnect';
    link.href = 'https://a.espncdn.com';
    link.crossOrigin = 'anonymous';
    link.setAttribute('data-sports-preconnect', 'true');
    document.head.appendChild(link);
  }

  function renderIfActive() {
    var tab = document.querySelector('.tab.active[data-tab="sports"]');
    var stories = document.getElementById('stories');
    if (!tab || !stories) return;
    stories.innerHTML = sportsHtml(sports);
    stories.setAttribute('data-sports-rendered', 'true');
    settleMarks(stories);
  }

  var sportsTab = document.querySelector('[data-tab="sports"]');
  if (!sportsTab) return;
  sportsTab.addEventListener('pointerenter', warmCrestOrigin, { once: true });
  sportsTab.addEventListener('focus', warmCrestOrigin, { once: true });
  sportsTab.addEventListener('pointerdown', warmCrestOrigin, { once: true });
  sportsTab.addEventListener('click', function () {
    window.setTimeout(renderIfActive, 0);
  });
  renderIfActive();
})();
  </script>
</body>
