  <title>The Daily</title>
  <style>
    /* ---- Design tokens: The Morning Broadsheet ------------------------- */
    :root {
      --paper: #faf8f3;        /* the sheet (warm white, never #fff) */
      --desk: #efece6;         /* the desk beyond the column */
      --ink: #17130d;          /* headlines / primary text */
      --ink-sub: #453f38;      /* standfirsts */
      --ink-muted: #635d54;    /* inactive tabs */
      --meta: #6c665c;         /* timestamps, dateline, footer (>=AA small) */
      --rule: #dcd6cc;         /* hairline between cards */
      --rule-soft: #e3ded4;    /* hairline inside an opened card */
      --navy: #1a2744;         /* structural ink */
      --navy-ink: #1a2744;     /* navy used as text (links, active tab) */
      --red: #8b1a1a;          /* editorial heat */
      --tint-open: #f2ede4;    /* ground of an expanded card */
      --tint-analysis: #ece6da;/* ground of the why-it-matters note */
      --strip-bg: #1a2744;     /* weather strip */
      --strip-ink: #f7f4ee;
      --chip-hot: #8b1a1a;     /* DEVELOPING / WAR-class flags */
      --chip-cool: #1a2744;    /* procedural flags (FINAL, EDITORIAL) */
      --chip-ink: #faf8f3;
      --focus: #1a2744;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151a22;      /* lamplight edition: deep navy-black paper */
        --desk: #0e1219;
        --ink: #e9e3d5;        /* cream ink */
        --ink-sub: #bcb6a8;
        --ink-muted: #948e82;
        --meta: #8f897d;
        --rule: #2a303a;
        --rule-soft: #2f3540;
        --navy: #6f82a8;       /* structure lifted so it reads on dark */
        --navy-ink: #a3b3d2;
        --red: #d1726b;        /* desaturated heat */
        --tint-open: #1b212b;
        --tint-analysis: #20262f;
        --strip-bg: #1b2334;
        --strip-ink: #e9e3d5;
        --chip-hot: #a8443c;
        --chip-cool: #3b4a6c;
        --chip-ink: #f0eadc;
        --focus: #a3b3d2;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 100%; }
    html, body { background: var(--desk); }
    body {
      font-family: 'Georgia', serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--paper);
      max-width: 680px;
      margin: 0 auto;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Masthead */
    .masthead {
      border-bottom: 4px solid var(--navy);
      padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
      background: var(--paper);
    }
    .masthead .date {
      font-size: 0.6875rem; color: var(--meta); letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .masthead .title {
      font-size: 2.375rem; font-weight: 700; letter-spacing: -0.01em;
      color: var(--navy); line-height: 1; margin-bottom: 2px;
    }
    .masthead .tagline {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; color: var(--meta);
      letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* Stale-edition ribbon */
    .stale {
      background: var(--tint-analysis); color: var(--meta);
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; text-align: center;
      padding: 7px 20px;
    }

    /* Weather strip */
    .weather {
      background: var(--strip-bg); color: var(--strip-ink);
      cursor: pointer; user-select: none;
    }
    .weather .summary {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
      min-height: 44px;
    }
    .weather .summary::-webkit-scrollbar { display: none; }
    .weather .ico { font-size: 1.375rem; }
    .weather .city { font-weight: 700; font-size: 0.9375rem; }
    .weather .temp { font-size: 0.9375rem; }
    .weather .muted { opacity: 0.72; font-size: 0.8125rem; white-space: nowrap; }
    .weather .chev { margin-left: auto; opacity: 0.6; font-size: 0.75rem; }
    .weather .week {
      display: flex; border-top: 1px solid rgba(255,255,255,0.12);
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
    }
    .weather .week::-webkit-scrollbar { display: none; }
    .weather .day {
      text-align: center; min-width: 52px; padding: 0 8px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .weather .day .d { font-size: 0.6875rem; opacity: 0.6; margin-bottom: 4px; }
    .weather .day .i { font-size: 1.125rem; }
    .weather .day .hi { font-size: 0.8125rem; font-weight: 700; margin-top: 4px; }
    .weather .day .lo { font-size: 0.6875rem; opacity: 0.5; }

    /* Tab nav */
    .tabs {
      display: flex; overflow-x: auto; border-bottom: 2px solid var(--navy);
      background: var(--paper); scrollbar-width: none;
      position: sticky; top: 0; z-index: 10;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; min-height: 44px; display: flex; align-items: center;
      padding: 0 18px; border: none; background: none; cursor: pointer;
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; font-weight: 700;
      color: var(--ink-muted); border-bottom: 3px solid transparent;
      margin-bottom: -2px; letter-spacing: 0.12em; text-transform: uppercase;
      transition: color 0.15s;
    }
    .tab.active { color: var(--navy-ink); border-bottom-color: var(--navy); }

    /* Stories */
    .stories { padding: 8px 20px 40px; }
    .empty {
      padding: 40px 4px; text-align: center; color: var(--meta);
      font-style: italic; font-size: 0.9375rem;
    }
    .card {
      border-top: 1px solid var(--rule); padding: 14px 0; cursor: pointer;
      background: var(--paper); transition: background 0.15s;
    }
    .card.lead { border-top: 3px solid var(--navy); padding: 20px 0 16px; }
    .card.open { background: var(--tint-open); }
    .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card .row-main { flex: 1; min-width: 0; }
    .card .kicker {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; color: var(--red); margin-bottom: 6px; text-transform: uppercase;
    }
    .card .tag {
      color: var(--chip-ink); padding: 2px 6px; margin-right: 8px;
      font-size: 0.5625rem; border-radius: 2px; vertical-align: 1px;
    }
    .card .tag.hot { background: var(--chip-hot); }
    .card .tag.cool { background: var(--chip-cool); }
    .card .headline {
      font-size: 1.0625rem; font-weight: 700; line-height: 1.25; color: var(--ink); margin-bottom: 6px;
    }
    .card.lead .headline { font-size: 1.375rem; }
    .card .sub {
      font-size: 0.875rem; color: var(--ink-sub); line-height: 1.4; margin-bottom: 4px; font-style: italic;
    }
    .card .time { font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta); margin-top: 4px; }
    .card .toggle { color: var(--navy-ink); opacity: 0.5; font-size: 1.125rem; flex-shrink: 0; margin-top: 2px; }
    .card .expand {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    }
    .card .expand .sumtext {
      font-size: 0.9375rem; color: var(--ink-sub); line-height: 1.7;
    }
    .card .expand img {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      background: var(--tint-open); border-radius: 3px; margin-bottom: 12px;
    }
    .card .analysis {
      margin-top: 12px; padding: 10px 14px; background: var(--tint-analysis);
      font-size: 0.875rem; line-height: 1.6; color: var(--ink-sub); font-style: italic;
    }
    .card .analysis .alabel {
      display: block; font-family: 'Arial', sans-serif; font-style: normal;
      font-size: 0.625rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--navy-ink); margin-bottom: 4px;
    }
    .card .readmore {
      display: inline-block; margin-top: 12px; min-height: 44px; line-height: 44px;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink); text-decoration: none;
    }
    .card .readmore:hover { text-decoration: underline; }
    .card .readmore:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    /* Ask AI: hand the clipping and a briefing prompt to a model */
    .card .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .askai, .card .ask-opt {
      border: none; background: none; padding: 0; cursor: pointer;
      min-height: 44px; line-height: 44px; text-decoration: none;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink);
    }
    .card .askai { margin-top: 12px; }
    .card .askai:hover, .card .ask-opt:hover { text-decoration: underline; }
    .card .askai:focus-visible, .card .ask-opt:focus-visible {
      outline: 2px solid var(--focus); outline-offset: 3px;
    }
    .card .ask-panel { display: none; border-top: 1px solid var(--rule-soft); margin-top: 4px; }
    .card .ask-panel.open { display: block; }
    .card .ask-row { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .ask-note {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.55;
      color: var(--meta); letter-spacing: 0.02em; padding-bottom: 12px;
    }

    /* Footer */
    .footer {
      border-top: 2px solid var(--navy);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta);
      text-align: center; letter-spacing: 0.06em;
    }
    .notice { padding: 40px 20px; text-align: center; color: var(--meta); font-style: italic; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>

 France and Spain face another day battling blazes, with a new heatwave expected to hit France this week.", "summary": "Firefighters across France and Spain are bracing for another day of intense battles against widespread wildfires, with French officials warning that it could take \"weeks or months\" to fully extinguish the blazes. Hundreds of thousands have been evacuated, and a new heatwave is forecast for France this week, exacerbating conditions. Spanish Prime Minister Pedro Sánchez has attributed the fires to the ongoing climate crisis.", "analysis": null, "time": "11:21 AM", "tag": "DISASTER", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/live/2026/jul/27/europe-wildfires-france-spain-emmanuel-macron-crisis-meeting-pedro-sanchez-castillon-latest-news-updates"}, {"id": "f3", "lead": false, "kicker": "TORONTO", "headline": "Shooting Near U.S. Consulate in Toronto Under Investigation", "sub": "Police found evidence of a firearm discharge early Monday morning after reports of gunfire in the downtown area.", "summary": "Toronto police are investigating a shooting that occurred early Monday morning near the U.S. Consulate. Officers responded to reports of gunfire and found evidence of a firearm discharge in the vicinity. No injuries have been reported, and the investigation is ongoing.", "analysis": null, "time": "6:43 AM", "tag": "DEVELOPING", "sensitivity": true, "image": null, "link": "https://www.thestar.com/news/gta/toronto-police-investigating-after-shooting-near-us-consulate/article_d3d96e2f-5249-4cc1-b8c5-85eb8cd65140.html"}, {"id": "f4", "lead": false, "kicker": "UKRAINE WAR", "headline": "Ukraine’s Deep Strikes Leave Crimea Towns Without Power, Water", "sub": "Ukrainian attacks on Crimea are causing widespread blackouts and water shortages, aiming to pressure the Kremlin to negotiate.", "summary": "Ukraine's ongoing campaign to bring the war to ordinary Russians is causing significant disruption in Crimea, with whole towns n emergency physicians are leaving the profession, citing widespread burnout and a profound sense that the health-care system is broken. The findings highlight a critical staffing crisis impacting emergency rooms across the country, including in Toronto, threatening patient care and increasing pressure on remaining staff.", "analysis": "The exodus of emergency physicians points to systemic issues within Canada's healthcare, demanding urgent policy intervention beyond short-term fixes. This trend could severely impact access to critical care, especially in major urban centers like Toronto.", "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/2/cf/2cfd438b-ef48-55e4-8fc4-33934e825570/6a63a209ca617.image.jpg?resize=300%2C196", "link": "https://www.thestar.com/news/canada/hopeless-why-1-in-10-canadian-emergency-physicians-are-leaving-the-profession/article_0d4c5858-c521-4c0b-8027-9d36ac9355d9.html"}, {"id": "t2", "lead": false, "kicker": "CITY PLANNING", "headline": "Doug Ford’s Billy Bishop Airport Expansion Plan Crashes", "sub": "A vision for an expanded airport, with jets landing every two and a half minutes, rapidly soared then came to a screeching halt.", "summary": "Premier Doug Ford's ambitious vision for an expanded Billy Bishop City Airport, which included jets landing every two and a half minutes, has abruptly stalled. The plan, which had gained significant momentum, has now come to a complete halt. This marks a major setback for the provincial government's infrastructure agenda in Toronto.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/4/2f/42f9273e-a288-5ac1-a327-6cbf12cc6c9c/6a666a8cef5ba.image.jpg?resize=300%2C200", "link": "https://www.thestar.com/news/gta/the-billy-bishop-fight-20-how-doug-fords-jets-vision-rapidly-soared--then-crashed/article_8c690375-aba6-487c-a02f-5c4a1fd06b2e.html"}, {"id": "t3", "lead": false, "kicker": "COMMUNITY", "headline": "Chef Challenges Bannock’s Dominance in Indigenous Food Scene", "sub": "Christopher Britt is building a business to reintroduce healthier, traditional Indigenous foods to Toronto, arguing bannock has overshadowed them.", "summary": "Toronto chef Christopher Britt is challenging the prevalence of bannock as the city's most popular Indigenous food, arguing it has overshadowed healthier traditional options. Britt is actively building a business aimed at reintroducing a wider variety of traditional Indigenous foods to Toronto, promoting a more balanced and authentic culinary representation.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/1/ef/1ef22c27-5d07-5364-bfc2-14e1eb6dc07b/6a5fab341ce5f.image.jpg?resize=300%2C200", "link": "https://www.thestar.com/life/food-and-drink/li-indigenous-chef-toronto/article_640803c1-e9c3-4fbb-ae67-f29d434f91cf.html"}, {"id": "t4", "lead": false, "kicker": "INSPIRATION", "headline": "Boy, 10, Who Nearly Lost Feet to Lawnmower Finishes Toronto Triathlon", "sub": "Four years after a severe accident, Austin Byres completed the Supertri Toronto, demonstrating remarkable resilience.", "summary": "Ten-year-old Austin Byres successfully crossed the finish line at Supertri Toronto on Sunday, just four years after a lawnmower accident nearly cost him both legs. His participation and completion of the triathlon serve as an inspiring testament to his resilience and recovery.", "analysis": null, "time": "7:27 PM Yesterday", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/c/a8/ca862727-6fea-57de-bfd7-ffc39debfb32/6a66988bc5e4d.image.jpg?resize=300%2C210", "link": "https://www.thestar.com/news/ontario/boy-10-who-nearly-lost-his-feet-to-lawnmower-finishes-toronto-triathlon/article_0cc7d77a-8f72-5ff3-b862-6876b36cd91d.html"}]}, {"id": "world", "label": "World", "stories": [{"id": "w1", "lead": true, "kicker": "GERMANY", "headline": "Berlin Pride Attack Suspect Shot Dead by Police, Linked to ISIS", "sub": "Abdul Ballout, 21, was killed in an operation after a fatal van and knife rampage, with prosecutors revealing he previously tried to join ISIS.", "summary": "Abdul Ballout, the 21-year-old suspect in a fatal van and knife rampage near Berlin Pride, was shot dead by police during an operation in the Spandau district. Prosecutors revealed Ballout had previously been sentenced to prison for preparing a serious act of violence against the state and had attempted to join ISIS, though he was released in May. The attack has deeply rattled Berlin's LGBTQ+ community, which reports feeling increasingly unsafe amidst a surge in threats, including from the far right.", "analysis": "The Berlin attack underscores the persistent threat of extremist violence and its impact on vulnerable communities, even from individuals previously known to authorities. The incident highlights the complex challenges of monitoring and rehabilitating individuals with extremist ties, and the broader societal implications of rising intolerance.", "time": "6:02 AM", "tag": "TERRORISM", "sensitivity": true, "image": null, "link": "https://www.nytimes.com/2026/07/27/world/europe/gay-community-berlin-attack.html"}, {"id": "w2", "lead": false, "kicker": "UKRAINE WAR", "headline": "Ukrainian Startup 'Fire Point' Boosts Deep-Strike Capability Against Russia", "sub": "The company produces 100 long-range missiles and thousands of drones monthly, vital for Kyiv’s offensive operations.", "summary": "Ukrainian startup Fire Point is playing a crucial role in Kyiv's deep-strike capabilities, producing 100 long-range missiles and thousands of drones each month. CEO Iryna Terekh stated the company is vital for taking the missile fight deep into Russian territory. This domestic production capacity is central to Ukraine's strategy of targeting Russian infrastructure and military assets far behind the front lines.", "analysis": null, "time": "6:30 AM", "tag": "WAR", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/2026/jul/27/fire-point-ukraine-cruise-missiles-russia"}, {"id": "w3", "lead": false, "kicker": "UK POLITICS", "headline": "New PM Burnham to Meet Zelenskyy in Show of 'Unwavering' UK Support", "sub": "Ukrainian President Volodymyr Zelenskyy will be the first overseas visitor for new British Prime Minister Andy Burnham at a UK naval base.", "summary": "Ukrainian President Volodymyr Zelenskyy is scheduled to meet with new British Prime Minister Andy Burnham at a UK naval base, marking Zelenskyy as Burnham's first overseas visitor. The meeting is intended to demonstrate the UK's \"unwavering\" support for Ukraine amidst ongoing conflict. This high-profile engagement signals the new British government's commitment to its alliance with Kyiv.", "analysis": null, "time": "9:30 PM Yesterday", "tag": "DIPLOMACY", "sensitivity": false, "image": "https://media.guim.co.uk/90c7f897898192dda0b8e1ef2f15387483bf44da/442_377_1661_1329/500.jpg", "link": "https://www.theguardian.com/world/2026/jul/26/andy-burnham-to-meet-volodymyr-zelenskyy-uk-ukraine"}, {"id": "w4", "lead": false, "kicker": "MIDDLE EAST", "headline": "Houthis Corner Saudi Arabia into New Battle for Concessions", "sub": "The Iran-backed Houthis are exploiting Saudi Arabia's reluctance for another war to force political concessions in Yemen.", "summary": "The Iran-backed Houthi movement has capitalized on Saudi Arabia's vulnerability and reluctance to engage in another protracted war, initiating a new battle to extract political concessions in Yemen. This strategic move aims to leverage the current regional dynamics to their advantage. The Houthis are pushing for a resolution that favors their political objectives, further complicating the already fragile peace efforts in the region.", "analysis": null, "time": "5:33 AM", "tag": "WAR", "sensitivity": true, "image": null, "link": "https://www.nytimes.com/2026/07/27/world/middleeast/houthis-saudi-arabia-iran-war.html"}]}, {"id": "sports", "label": "Sports", "stories": [{"id": "s1", "lead": true, "kicker": "COMMONWEALTH GAMES", "headline": "Commonwealth Games Day Four Underway in Glasgow", "sub": "Athletics begins, with swimming and gymnastics continuing, as Australia banks more gold medals.", "summary": "Day four of the Commonwealth Games 2026 is underway in Glasgow, with athletics events commencing alongside ongoing swimming and gymnastics competitions. Australia continues its strong performance, adding more gold medals to its tally, including Cam McEvoy's dominant win in the 50m freestyle, setting a new Games record. Host nation Scotland also celebrated gold medals in gymnastics and swimming on day three, with Reuben Ward winning the men’s all-around gymnastics and Angharad Evans taking the women’s 100m breaststroke.", "analysis": "The Glasgow Games are showcasing a blend of established and emerging talent, with early medal counts suggesting strong performances from traditional powerhouses like Australia and host nation Scotland. The commencement of athletics will broaden the competition and likely shift the medal table dynamics, setting the stage for new rivalries and record attempts.", "time": "11:41 AM", "tag": "LIVE", "sensitivity": false, "image": "https://media.guim.co.uk/2d9941cd4a0c5b377352623aee6c0468196d7ae2/38_0_4019_3218/500.jpg", "link": "https://www.theguardian.com/sport/live/2026/jul/27/commonwealth-games-2026-athletics-begins-plus-swimming-and-gymnastics-on-day-four-live"}, {"id": "s2", "lead": false, "kicker": "FORMULA ONE", "headline": "McLaren Principal Hails Norris's 'Great Trajectory' After Hungary Win", "sub": "Andrea Stella praises Lando Norris for being 'more in control of his emotions' after his first win of the season.", "summary": "McLaren team principal Andrea Stella has lauded Lando Norris's \"great trajectory\" following the world champion's first win of the season in Hungary. Stella noted Norris is now \"more in control of his emotions,\" highlighting his maturing performance. This victory marks a significant moment for Norris and the McLaren team, signaling a potential turning point in their season.", "analysis": null, "time": "10:30 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/8b072c76740241f5b3537ec4ee9a5e0b7d244392/485_0_6148_4916/500.jpg", "link": "https://www.theguardian.com/sport/2026/jul/27/mclaren-team-principal-maturity-lando-norris-f1"}, {"id": "s3", "lead": false, "kicker": "SURFING", "headline": "Paddleboarder Who Rescued Shark Attack Victim Wins World Title", "sub": "Charlie Verco, who saved Leah Stewart in June, claimed his fourth championship in Hawaii in record time.", "summary": "Charlie Verco, the paddleboarder who famously rescued Leah Stewart from a shark attack in Coogee in June, has won his fourth world title in Hawaii. Verco claimed the championship in record time, expressing his excitement for the achievement. His victory comes just weeks after his heroic act, adding another remarkable chapter to his career.", "analysis": null, "time": "6:25 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/9355390eb62fd66e3a725336cabf11c695637b0f/0_19_1285_1027/500.jpg", "link": "https://www.theguardian.com/sport/2026/jul/27/paddleboarder-who-rescued-woman-from-coogee-shark-attack-wins-world-title-in-record-time"}, {"id": "s4", "lead": false, "kicker": "CYCLING", "headline": "Pogacar's Unopposed Dominance Sets Him Apart Among Tour Legends", "sub": "The Slovene, the youngest five-time Tour de France winner, is expected to claim a sixth victory next year.", "summary": "Tadej Pogacar's unparalleled ability to win the Tour de France unopposed distinguishes him among cycling's legends. The Slovene is the youngest of only five riders to achieve five Tour de France victories, and many observers are betting on him to secure a sixth win next year. His consistent dominance highlights a rare level of control and performance in the sport.", "analysis": null, "time": "7:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/534a688fdf554f899c496e877a450a51d5994185/697_0_6659_5329/500.jpg", "link": "https://www.theguardian.com/sport/2026/jul/27/tadej-pogacars-ability-to-win-unopposed-stands-champion-out-among-tour-legends"}]}, {"id": "business", "label": "Business", "stories": [{"id": "b1", "lead": true, "kicker": "MARKETS", "headline": "Oil Prices Slide as US Pauses Iran Strikes; Fed Chair Faces Rate Hike Decision", "sub": "Brent crude drops 6% below $91 a barrel, while the new Fed Chairman Kevin M. Warsh considers an interest-rate increase.", "summary": "Oil prices have sharply declined, with Brent crude falling 6% to below $91 a barrel, following the US decision to pause military strikes on Iran. This de-escalation in the Strait of Hormuz region has eased market fears of supply disruptions. Concurrently, new Federal Reserve Chairman Kevin M. Warsh faces his biggest test yet, needing to decide whether to push for an interest-rate increase at this week's policy meeting, having previously stated the Fed has \"no tolerance\" for elevated inflation. Shares in energy firms BP and Shell also slid on the FTSE 100.", "analysis": "The simultaneous drop in oil prices and the Fed's looming rate decision create a complex economic landscape. While lower oil prices could alleviate inflationary pressures, a rate hike by Chairman Warsh would signal the Fed's firm commitment to combating inflation, potentially impacting market sentiment and economic growth.", "time": "10:55 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/eeccd0ad64c2f6bcf800fe56619130a9c35e9916/399_0_3028_2422/500.jpg", "link": "https://www.theguardian.com/business/live/2026/jul/27/oil-falls-us-iran-pause-fire-astrazeneca-profit-latest-economy-news"}, {"id": "b2", "lead": false, "kicker": "CORPORATE TAKEOVER", "headline": "FTSE 100 Energy Firm DCC Agrees to £5.75bn Takeover", "sub": "KKR and Energy Capital Partners are set to acquire DCC despite misgivings from the company's founder and largest shareholders.", "summary": "DCC, one of the FTSE 100's largest energy firms, has agreed to a £5.75 billion takeover by private equity giants KKR and Energy Capital Partners. The deal proceeds despite reported misgivings from the company's founder and biggest shareholders. This acquisition marks a significant move in the energy sector, bringing a major player under new private ownership.", "analysis": null, "time": "11:25 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/c2c8e36da1559c7cfd1f202da245f61ec5caaa65/475_0_4029_3225/500.jpg", "link": "https://www.theguardian.com/business/2026/jul/27/dcc-energy-private-equity-takeover-ftse-100-kkr-energy-capital-partners"}, {"id": "b3", "lead": false, "kicker": "UK POLITICS", "headline": "Ed Miliband Signals Climate, Development Central to UK Foreign Policy", "sub": "The Foreign Secretary will take up a World Bank seat, actively shaping changes to the global lender.", "summary": "UK Foreign Secretary Ed Miliband has indicated that development and climate issues will be at the core of Britain's foreign policy agenda. He is set to take up a seat on the World Bank board, where he plans to play an active role in shaping changes to the global lending institution. This move signals a renewed focus on environmental and developmental diplomacy under the new government.", "analysis": null, "time": "4:00 PM Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/e39d05de3405616eae6dff2d7ce984d7d376d880/131_0_1833_1467/500.jpg", "link": "https://www.theguardian.com/business/2026/jul/26/ed-miliband-development-climate-crisis-uk-foreign-policy-world-bank-seat"}, {"id": "b4", "lead": false, "kicker": "RETAIL", "headline": "Liberty Embraces Sewing Boom with Craft Classes and Expanded Fabrics", "sub": "The London store plans a larger haberdashery area and autumn workshops to cater to the growing interest in crafting.", "summary": "London's iconic Liberty store is expanding its fabrics section and introducing craft classes to capitalize on a growing sewing boom. The retailer plans to create a larger haberdashery area and will host autumn workshops for crafters. This initiative reflects a strategic move to engage with the increasing consumer interest in DIY and creative hobbies.", "analysis": null, "time": "6:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/802e86dff23e7f1e05a34bab12856f05c0ddb651/840_28_6795_5436/500.jpg", "link": "https://www.theguardian.com/business/2026/jul/27/liberty-london-store-expands-fabrics-section-sewing-boom-craft-classes"}]}, {"id": "opinion", "label": "Opinion", "stories": [{"id": "o1", "lead": true, "kicker": "US POLITICS", "headline": "Trump’s Wars: We Are All Victims of the Commander-in-Chief of Chaos", "sub": "The author argues that new tariffs, rising gas prices, and global insecurity are consequences of one capricious man's whims.", "summary": "Guardian columnist Nesrine Malik argues that the world is suffering as \"victims of Trump's wars,\" describing the President as a \"commander-in-chief of chaos.\" Malik contends that new tariffs, escalating gas prices, and widespread global insecurity are direct consequences of one capricious, vain, and easily bored man and his inner circle. The piece criticizes the profound impact of his policies on international stability and the daily lives of citizens.", "analysis": "This opinion piece offers a sharp critique of President Trump's foreign policy and its global repercussions, framing current international instability as a direct result of his leadership style. It connects diverse issues like economic tariffs and regional conflicts to a central theme of executive caprice, suggesting a profound and personal impact on global affairs.", "time": "4:00 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/894468e7cd042ab782e54c38a4690bc70a3f610b/0_0_2400_1920/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/jul/27/commander-in-chief-of-chaos-victims-trump-wars"}, {"id": "o2", "lead": false, "kicker": "US POLITICS", "headline": "Why Are Democrats So Quiet About the Tate Brothers?", "sub": "The party's silence on male supremacist thinking shows how broadly it has seeped into conventional political wisdom.", "summary": "Moira Donegan questions why the Democratic Party remains largely silent regarding the Tate brothers, arguing that this silence reflects how deeply male supremacist thinking has infiltrated conventional political strategy. She suggests that the party's reluctance to address such figures indicates a broader issue within political discourse, where certain ideologies are overlooked for perceived strategic reasons.", "analysis": null, "time": "11:00 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/0e0a193f39f064422b9565b20b20d7348f5d29de/412_119_5412_4330/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/jul/27/andrew-tristain-tate-democrats"}, {"id": "o3", "lead": false, "kicker": "UK POLITICS", "headline": "Burnham's Social Media Mastery Faces Inevitable Media Foes", "sub": "While the new PM's slick online operation bypasses hostile press, he will still need friends in traditional media.", "summary": "Former Labour party adviser Tom Baldwin suggests that while new Prime Minister Andy Burnham's slick social media operation allows him to bypass a hostile press, he will ultimately need allies in traditional media. Baldwin argues that the \"Burnham bounce\" risks deflating unless the focus remains on struggling households. He cautions that media foes will offer no respite, emphasizing the need for a balanced communication strategy beyond digital platforms.", "analysis": null, "time": "7:00 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/18624fe2015b27b3d4b5c04a57879cb3aed7cd09/0_0_2637_2109/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/jul/27/andy-burnham-master-social-media-hostile-press-social-media"}, {"id": "o4", "lead": false, "kicker": "SOCIAL COMMENTARY", "headline": "Amid Birthrate Panic, New Mothers' Voices Must Be Valued", "sub": "New research reveals deep anxieties, suggesting that incentives like medals and cash bonuses miss the real need for women's feelings to be valued.", "summary": "Author and journalist Lucy Jones argues that amidst social and political panic over falling birthrates, the perspectives of new mothers are often overlooked. New research highlights deep anxieties among mothers, suggesting that proposed incentives like medals and cash bonuses fail to address their true needs. Jones emphasizes that the real requirement is for women's feelings and experiences to be genuinely valued and understood.", "analysis": null, "time": "8:00 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/0ecddf4f04eae4a8ae6afff2f4ee6620a83c26fa/405_0_6000_4800/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/jul/27/panic-falling-birthrates-new-mothers"}]}]}</script>

  <script>
    (function () {
      var raw = document.getElementById('edition').textContent;
      var data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<div class="notice">No edition loaded. Run the build to generate today’s paper.</div>';
        return;
      }

      var state = { active: (data.sections[0] || {}).id, openId: null };

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Editorial heat flags keep the red chip; procedural flags cool to navy,
      // so a red chip still means something (the Scarce Red Rule).
      function isHotTag(t) {
        return /^(DEVELOPING|BREAKING|LIVE|WAR|ALERT|URGENT)$/i.test(t || '');
      }

      // ---- Ask AI ----------------------------------------------------------
      // The reader taps one story and gets a briefing, not a chat. The prompt
      // does three jobs: hand over the clipping, name the shape of the answer
      // (five parts, ~500 words, hard ceiling), and set up the follow-up so the
      // conversation continues without the reader having to think of a question.
      // Voice constraints mirror src/config.py HOUSE_VOICE, em dash ban included.
      function buildPrompt(st, sectionLabel) {
        var L = [];
        L.push('I read this in my morning paper and I want to understand it properly.');
        L.push('');
        L.push('THE CLIPPING');
        L.push('Headline: ' + st.headline);
        if (st.sub) L.push('Standfirst: ' + st.sub);
        if (st.summary) L.push('Summary: ' + st.summary);
        if (st.analysis) L.push("My paper's why-it-matters note: " + st.analysis);
        L.push('Section: ' + sectionLabel + '. Filed ' + (st.time || 'this morning') +
               ', edition of ' + data.date + '.');
        if (st.link) L.push('Source: ' + st.link);
        L.push('');
        L.push('WHAT I WANT');
        L.push('A briefing that leaves me genuinely informed, not a restatement of what I just');
        L.push('pasted. Assume I know nothing beyond the clipping above.');
        L.push('');
        L.push('Check current reporting first if you are able to search. My clipping is a');
        L.push('summary and may be incomplete or already overtaken by events. If you cannot');
        L.push('search, say so in one line at the top, then separate what you are confident');
        L.push('about from what you would want verified.');
        L.push('');
        L.push('STRUCTURE');
        L.push('I am reading this on a phone. Build the answer in layers, heaviest first, so');
        L.push('I can stop at the end of any layer and still have got something whole. Use');
        L.push('these markdown headings exactly, so they render large on a small screen.');
        L.push('');
        L.push('# The gist');
        L.push('An H1 of six to ten words stating the actual point, not the topic. Then two or');
        L.push('three short sentences giving me the whole story in plain words. If I read');
        L.push('nothing else, this is what I walk away knowing. Correct my clipping here if it');
        L.push('is wrong or out of date.');
        L.push('');
        L.push('## Why it matters');
        L.push('Two or three short sentences on the stakes and the second order effects. Be');
        L.push('concrete about who gains, who pays, how much, and by when.');
        L.push('');
        L.push('## How we got here');
        L.push('Only the background I need to follow this story. Not a history lecture.');
        L.push('');
        L.push('## Where it is contested');
        L.push('The strongest disagreement among serious people, put fairly. If it is genuinely');
        L.push('uncontested, say so in one sentence and move on.');
        L.push('');
        L.push('## What to watch');
        L.push('Three bullets, each a specific checkable marker with a rough timeframe.');
        L.push('');
        L.push('## Ask me next');
        L.push('Three numbered questions, ordered by what would teach me the most. I will reply');
        L.push('with a digit.');
        L.push('');
        L.push('READING ON A PHONE');
        L.push('Short paragraphs: three sentences at most, none longer than about sixty words,');
        L.push('with a blank line between them. No tables, no nested bullets, no wall of text.');
        L.push('Around 500 words in total. Hard ceiling 650. Do not pad to reach a length; the');
        L.push('gist and why it matters are worth more than the sections under them.');
        L.push('');
        L.push('VOICE');
        L.push('Financial Times, not an encyclopedia and not a chatbot. Plain, confident,');
        L.push('concrete. Specifics over abstractions: names, numbers, dates, stakes. Every');
        L.push('sentence earns its place. No preamble, no throat clearing, no restating my');
        L.push('prompt back to me, no hedging filler, no em dashes. Where you are uncertain,');
        L.push('mark it in the sentence it applies to rather than in a disclaimer paragraph.');
        return L.join('\n');
      }

      function findStory(id) {
        for (var i = 0; i < data.sections.length; i++) {
          var list = data.sections[i].stories || [];
          for (var j = 0; j < list.length; j++) {
            if (list[j].id === id) {
              return { story: list[j], label: data.sections[i].label };
            }
          }
        }
        return null;
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        // Older iOS standalone PWAs land here.
        return new Promise(function (resolve, reject) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('copy failed'));
        });
      }

      // Tagline reflects the sections the edition actually shipped, not a
      // hardcoded list that can disagree with the paper.
      function taglineText() {
        var labels = data.sections
          .filter(function (s) { return s.id !== 'front'; })
          .map(function (s) { return s.label; });
        return (labels.length ? labels : ['Toronto', 'World', 'Business']).join(' · ');
      }

      function weatherHtml(w) {
        if (!w || !w.icon) return '';
        var week = (w.week || []).map(function (d) {
          return '<div class="day"><div class="d">' + esc(d.day) + '</div>' +
            '<div class="i">' + esc(d.icon) + '</div>' +
            '<div class="hi">' + esc(d.hi) + '°</div>' +
            '<div class="lo">' + esc(d.lo) + '°</div></div>';
        }).join('');
        return '<div class="weather" id="weather" role="button" tabindex="0" ' +
          'aria-expanded="false" aria-label="Toronto weather, tap for the week">' +
          '<div class="summary">' +
            '<span class="ico">' + esc(w.icon) + '</span>' +
            '<span class="city">Toronto</span>' +
            '<span class="temp">' + esc(w.high) + '° / ' + esc(w.low) + '°</span>' +
            '<span class="muted">' + esc(w.condition) + '</span>' +
            '<span class="muted">Rain ' + esc(w.rain) + '</span>' +
            '<span class="muted">Wind ' + esc(w.wind) + '</span>' +
            '<span class="chev" id="wchev">▼</span>' +
          '</div>' +
          '<div class="week" id="wweek" style="display:none">' + week + '</div>' +
        '</div>';
      }

      function tabsHtml() {
        return '<div class="tabs" role="tablist">' + data.sections.map(function (s) {
          var on = s.id === state.active;
          return '<button class="tab' + (on ? ' active' : '') + '" role="tab" ' +
            'aria-selected="' + on + '" data-tab="' + esc(s.id) + '">' + esc(s.label) + '</button>';
        }).join('') + '</div>';
      }

      function cardHtml(st, sectionLabel) {
        var open = st.id === state.openId;
        var tag = st.tag
          ? '<span class="tag ' + (isHotTag(st.tag) ? 'hot' : 'cool') + '">' + esc(st.tag) + '</span>'
          : '';
        var kicker = st.kicker ? '<div class="kicker">' + tag + esc(st.kicker) + '</div>' : '';
        var sub = st.sub ? '<div class="sub">' + esc(st.sub) + '</div>' : '';
        var expand = '';
        if (open) {
          var img = st.image
            ? '<img src="' + esc(st.image) + '" alt="' + esc(st.headline) + '" ' +
              'loading="lazy" onerror="this.remove()" />'
            : '';
          var analysis = st.analysis
            ? '<div class="analysis"><span class="alabel">Why it matters</span>' + esc(st.analysis) + '</div>'
            : '';
          var link = st.link
            ? '<a class="readmore" href="' + esc(st.link) + '" target="_blank" rel="noopener">Read full story →</a>'
            : '';

          // Prefill the destinations at render time so a long press ("open in
          // app") carries the prompt too, instead of us intercepting the tap.
          var q = encodeURIComponent(buildPrompt(st, sectionLabel));
          // No target="_blank" on these two. In a standalone PWA a blank target
          // opens an in-app browser sheet, which iOS will not hand off to an
          // installed app; a plain top-level tap is what lets the Claude and
          // ChatGPT apps claim their own domains as Universal Links. "Read full
          // story" keeps _blank, because a news site does belong in a tab.
          var share = navigator.share
            ? '<button class="ask-opt" data-ai="share" data-id="' + esc(st.id) + '">Share to app…</button>'
            : '';
          var actions = '<div class="actions">' + link +
            '<button class="askai" data-ask="' + esc(st.id) + '" aria-expanded="false" ' +
              'aria-controls="ask-' + esc(st.id) + '">Ask AI ▾</button></div>' +
            '<div class="ask-panel" id="ask-' + esc(st.id) + '">' +
              '<div class="ask-row">' +
                '<a class="ask-opt" href="https://claude.ai/new?q=' + esc(q) + '">Claude</a>' +
                '<a class="ask-opt" href="https://chatgpt.com/?q=' + esc(q) + '">ChatGPT</a>' +
                share +
                '<button class="ask-opt" data-ai="copy" data-id="' + esc(st.id) + '">Copy</button>' +
              '</div>' +
              '<div class="ask-note">Opens in the app if you have it installed. The reply ' +
                'starts with the gist in a few lines, then goes deeper, then offers three ' +
                'follow-up questions.</div>' +
            '</div>';

          expand = '<div class="expand">' + img +
            '<p class="sumtext">' + esc(st.summary) + '</p>' + analysis + actions + '</div>';
        }
        return '<div class="card' + (st.lead ? ' lead' : '') + (open ? ' open' : '') +
          '" data-card="' + esc(st.id) + '" role="button" tabindex="0" ' +
          'aria-expanded="' + open + '">' +
          '<div class="row"><div class="row-main">' + kicker +
            '<div class="headline">' + esc(st.headline) + '</div>' + sub +
            '<div class="time">' + esc(st.time) + '</div></div>' +
            '<div class="toggle" aria-hidden="true">' + (open ? '−' : '+') + '</div>' +
          '</div>' + expand +
        '</div>';
      }

      function storiesInner() {
        var section = data.sections.filter(function (s) { return s.id === state.active; })[0];
        if (!section) return '';
        if (!section.stories || !section.stories.length) {
          return '<div class="empty">Nothing filed for ' + esc(section.label) + ' this morning.</div>';
        }
        return section.stories.map(function (st) {
          return cardHtml(st, section.label);
        }).join('');
      }

      // Quietly flag a saved (not-today) edition served from cache/offline.
      function staleRibbon() {
        try {
          var meta = document.querySelector('meta[name=build]');
          if (!meta) return '';
          var built = new Date(meta.getAttribute('content'));
          if (isNaN(built.getTime())) return '';
          var opt = { timeZone: 'America/Toronto' };
          if (built.toLocaleDateString('en-CA', opt) < new Date().toLocaleDateString('en-CA', opt)) {
            return '<div class="stale">Saved edition · ' + esc(data.date) + '</div>';
          }
        } catch (e) {}
        return '';
      }

      function appHtml() {
        return '<div class="masthead">' +
            '<div class="date">' + esc(data.date) + '</div>' +
            '<div class="title">THE DAILY</div>' +
            '<div class="tagline">' + esc(taglineText()) + '</div>' +
          '</div>' +
          staleRibbon() +
          weatherHtml(data.weather) +
          tabsHtml() +
          '<div class="stories" id="stories">' + storiesInner() + '</div>' +
          '<div class="footer">THE DAILY · TORONTO · Tap any headline to read</div>';
      }

      var app = document.getElementById('app');

      // Rebuild only the stories column; masthead, weather, and tab strip (and
      // their scroll/open state) are left untouched. This is what keeps a tap
      // from resetting the reader's place.
      function refreshStories() {
        document.getElementById('stories').innerHTML = storiesInner();
        bindCards();
      }

      function selectTab(id) {
        if (id === state.active) return;
        state.active = id;
        state.openId = null;
        var tabs = document.querySelectorAll('.tab');
        Array.prototype.forEach.call(tabs, function (t) {
          var on = t.getAttribute('data-tab') === id;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on);
          if (on) t.scrollIntoView({ inline: 'center', block: 'nearest' });
        });
        refreshStories();
        // Start the new section at the top, tab strip stuck under the notch.
        var tabsEl = document.querySelector('.tabs');
        if (tabsEl) window.scrollTo(0, tabsEl.offsetTop);
      }

      function toggleCard(id) {
        var y = window.scrollY;
        state.openId = state.openId === id ? null : id;
        refreshStories();
        window.scrollTo(0, y);   // grow/collapse in place, never jump
      }

      function bindWeather() {
        var weather = document.getElementById('weather');
        if (!weather) return;
        function toggle() {
          var week = document.getElementById('wweek');
          var chev = document.getElementById('wchev');
          var showing = week.style.display !== 'none';
          week.style.display = showing ? 'none' : 'flex';
          chev.textContent = showing ? '▼' : '▲';
          weather.setAttribute('aria-expanded', String(!showing));
        }
        weather.addEventListener('click', toggle);
        weather.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
        });
      }

      function bindTabs() {
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
          btn.addEventListener('click', function () { selectTab(btn.getAttribute('data-tab')); });
        });
      }

      function bindCards() {
        Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
          function activate(ev) {
            // Let links and the Ask AI controls handle their own activation.
            if (ev.target.closest('a, button')) return;
            // While open, only the header row collapses it, so reading (and
            // selecting) the body never closes the story by accident.
            if (card.classList.contains('open') && !ev.target.closest('.row')) return;
            toggleCard(card.getAttribute('data-card'));
          }
          card.addEventListener('click', activate);
          card.addEventListener('keydown', function (ev) {
            if (ev.key !== 'Enter' && ev.key !== ' ') return;
            // Never swallow the key from a control that acts on it itself.
            if (ev.target.closest('a, button')) return;
            ev.preventDefault();
            activate(ev);
          });
          bindAsk(card);
        });
      }

      // Panel state is held in the DOM, not in `state`, so opening the
      // destinations never triggers a stories rebuild and never moves the page.
      function bindAsk(card) {
        var toggle = card.querySelector('.askai');
        if (!toggle) return;
        var panel = card.querySelector('.ask-panel');

        toggle.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var open = panel.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(open));
          toggle.textContent = open ? 'Ask AI ▴' : 'Ask AI ▾';
        });

        Array.prototype.forEach.call(panel.querySelectorAll('[data-ai]'), function (el) {
          var kind = el.getAttribute('data-ai');
          el.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var found = findStory(el.getAttribute('data-id'));
            if (!found) return;
            var prompt = buildPrompt(found.story, found.label);

            if (kind === 'share') {
              navigator.share({ text: prompt }).catch(function () {});
              return;
            }
            var label = el.textContent;
            copyText(prompt).then(function () {
              el.textContent = 'Copied';
            }).catch(function () {
              el.textContent = 'Copy failed';
            }).then(function () {
              setTimeout(function () { el.textContent = label; }, 1800);
            });
          });
        });
      }

      app.innerHTML = appHtml();
      bindWeather();
      bindTabs();
      bindCards();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
