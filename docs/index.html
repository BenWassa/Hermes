  <title>The Daily</title>
  <style>
    /* ---- Design tokens: The Morning Broadsheet ------------------------- */
    :root {
      --paper: #faf8f3;        /* the sheet (warm white, never #fff) */
      --desk: #efece6;         /* the desk beyond the column */
      --ink: #17130d;          /* headlines / primary text */
      --ink-sub: #453f38;      /* standfirsts */
      --ink-muted: #635d54;    /* inactive tabs */
      --meta: #6c665c;         /* timestamps, dateline, footer (>=AA small) */
      --rule: #dcd6cc;         /* hairline between cards */
      --rule-soft: #e3ded4;    /* hairline inside an opened card */
      --navy: #1a2744;         /* structural ink */
      --navy-ink: #1a2744;     /* navy used as text (links, active tab) */
      --red: #8b1a1a;          /* editorial heat */
      --tint-open: #f2ede4;    /* ground of an expanded card */
      --tint-analysis: #ece6da;/* ground of the why-it-matters note */
      --strip-bg: #1a2744;     /* weather strip */
      --strip-ink: #f7f4ee;
      --chip-hot: #8b1a1a;     /* DEVELOPING / WAR-class flags */
      --chip-cool: #1a2744;    /* procedural flags (FINAL, EDITORIAL) */
      --chip-ink: #faf8f3;
      --focus: #1a2744;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151a22;      /* lamplight edition: deep navy-black paper */
        --desk: #0e1219;
        --ink: #e9e3d5;        /* cream ink */
        --ink-sub: #bcb6a8;
        --ink-muted: #948e82;
        --meta: #8f897d;
        --rule: #2a303a;
        --rule-soft: #2f3540;
        --navy: #6f82a8;       /* structure lifted so it reads on dark */
        --navy-ink: #a3b3d2;
        --red: #d1726b;        /* desaturated heat */
        --tint-open: #1b212b;
        --tint-analysis: #20262f;
        --strip-bg: #1b2334;
        --strip-ink: #e9e3d5;
        --chip-hot: #a8443c;
        --chip-cool: #3b4a6c;
        --chip-ink: #f0eadc;
        --focus: #a3b3d2;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 100%; }
    html, body { background: var(--desk); }
    body {
      font-family: 'Georgia', serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--paper);
      max-width: 680px;
      margin: 0 auto;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Masthead */
    .masthead {
      border-bottom: 4px solid var(--navy);
      padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
      background: var(--paper);
    }
    .masthead .date {
      font-size: 0.6875rem; color: var(--meta); letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .masthead .title {
      font-size: 2.375rem; font-weight: 700; letter-spacing: -0.01em;
      color: var(--navy); line-height: 1; margin-bottom: 2px;
    }
    .masthead .tagline {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; color: var(--meta);
      letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* Stale-edition ribbon */
    .stale {
      background: var(--tint-analysis); color: var(--meta);
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; text-align: center;
      padding: 7px 20px;
    }

    /* Weather strip */
    .weather {
      background: var(--strip-bg); color: var(--strip-ink);
      cursor: pointer; user-select: none;
    }
    .weather .summary {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
      min-height: 44px;
    }
    .weather .summary::-webkit-scrollbar { display: none; }
    .weather .ico { font-size: 1.375rem; }
    .weather .city { font-weight: 700; font-size: 0.9375rem; }
    .weather .temp { font-size: 0.9375rem; }
    .weather .muted { opacity: 0.72; font-size: 0.8125rem; white-space: nowrap; }
    .weather .chev { margin-left: auto; opacity: 0.6; font-size: 0.75rem; }
    .weather .week {
      display: flex; border-top: 1px solid rgba(255,255,255,0.12);
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
    }
    .weather .week::-webkit-scrollbar { display: none; }
    .weather .day {
      text-align: center; min-width: 52px; padding: 0 8px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .weather .day .d { font-size: 0.6875rem; opacity: 0.6; margin-bottom: 4px; }
    .weather .day .i { font-size: 1.125rem; }
    .weather .day .hi { font-size: 0.8125rem; font-weight: 700; margin-top: 4px; }
    .weather .day .lo { font-size: 0.6875rem; opacity: 0.5; }

    /* Tab nav */
    .tabs {
      display: flex; overflow-x: auto; border-bottom: 2px solid var(--navy);
      background: var(--paper); scrollbar-width: none;
      position: sticky; top: 0; z-index: 10;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; min-height: 44px; display: flex; align-items: center;
      padding: 0 18px; border: none; background: none; cursor: pointer;
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; font-weight: 700;
      color: var(--ink-muted); border-bottom: 3px solid transparent;
      margin-bottom: -2px; letter-spacing: 0.12em; text-transform: uppercase;
      transition: color 0.15s;
    }
    .tab.active { color: var(--navy-ink); border-bottom-color: var(--navy); }

    /* Stories */
    .stories { padding: 8px 20px 40px; }
    .empty {
      padding: 40px 4px; text-align: center; color: var(--meta);
      font-style: italic; font-size: 0.9375rem;
    }
    .card {
      border-top: 1px solid var(--rule); padding: 14px 0; cursor: pointer;
      background: var(--paper); transition: background 0.15s;
    }
    .card.lead { border-top: 3px solid var(--navy); padding: 20px 0 16px; }
    .card.open { background: var(--tint-open); }
    .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card .row-main { flex: 1; min-width: 0; }
    .card .kicker {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; color: var(--red); margin-bottom: 6px; text-transform: uppercase;
    }
    .card .tag {
      color: var(--chip-ink); padding: 2px 6px; margin-right: 8px;
      font-size: 0.5625rem; border-radius: 2px; vertical-align: 1px;
    }
    .card .tag.hot { background: var(--chip-hot); }
    .card .tag.cool { background: var(--chip-cool); }
    .card .headline {
      font-size: 1.0625rem; font-weight: 700; line-height: 1.25; color: var(--ink); margin-bottom: 6px;
    }
    .card.lead .headline { font-size: 1.375rem; }
    .card .sub {
      font-size: 0.875rem; color: var(--ink-sub); line-height: 1.4; margin-bottom: 4px; font-style: italic;
    }
    .card .time { font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta); margin-top: 4px; }
    .card .toggle { color: var(--navy-ink); opacity: 0.5; font-size: 1.125rem; flex-shrink: 0; margin-top: 2px; }
    .card .expand {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    }
    .card .expand .sumtext {
      font-size: 0.9375rem; color: var(--ink-sub); line-height: 1.7;
    }
    .card .expand img {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      background: var(--tint-open); border-radius: 3px; margin-bottom: 12px;
    }
    .card .analysis {
      margin-top: 12px; padding: 10px 14px; background: var(--tint-analysis);
      font-size: 0.875rem; line-height: 1.6; color: var(--ink-sub); font-style: italic;
    }
    .card .analysis .alabel {
      display: block; font-family: 'Arial', sans-serif; font-style: normal;
      font-size: 0.625rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--navy-ink); margin-bottom: 4px;
    }
    .card .readmore {
      display: inline-block; margin-top: 12px; min-height: 44px; line-height: 44px;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink); text-decoration: none;
    }
    .card .readmore:hover { text-decoration: underline; }
    .card .readmore:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    /* Ask AI: hand the clipping and a briefing prompt to a model */
    .card .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .askai, .card .ask-opt {
      border: none; background: none; padding: 0; cursor: pointer;
      min-height: 44px; line-height: 44px; text-decoration: none;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink);
    }
    .card .askai { margin-top: 12px; }
    .card .askai:hover, .card .ask-opt:hover { text-decoration: underline; }
    .card .askai:focus-visible, .card .ask-opt:focus-visible {
      outline: 2px solid var(--focus); outline-offset: 3px;
    }
    .card .ask-panel { display: none; border-top: 1px solid var(--rule-soft); margin-top: 4px; }
    .card .ask-panel.open { display: block; }
    .card .ask-row { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .ask-note {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.55;
      color: var(--meta); letter-spacing: 0.02em; padding-bottom: 12px;
    }

    /* Footer */
    .footer {
      border-top: 2px solid var(--navy);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta);
      text-align: center; letter-spacing: 0.06em;
    }
    .notice { padding: 40px 20px; text-align: center; color: var(--meta); font-style: italic; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>

e for Germany (AfD) if it takes power.", "summary": "The far-right Alternative for Germany (AfD) party is poised for a significant victory in upcoming state elections next week. This potential outcome has prompted concern among state and federal leaders, who are exploring ways to avoid sharing sensitive intelligence with the AfD should it assume power. The situation highlights growing political tensions and challenges to traditional governance in Germany.", "analysis": null, "time": "1:00 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/08/30/multimedia/30int-germany-afd-01-pmkj/30int-germany-afd-01-pmkj-superJumbo.jpg", "link": "https://www.nytimes.com/2026/08/30/world/europe/germany-afd-saxony-anhalt.html"}, {"id": "f5", "lead": false, "kicker": "IRAN", "headline": "Long Lines for Gas in Iran Signal Supply Squeeze Amid U.S. Blockade", "sub": "The Iranian government struggles to meet fuel shortfalls, fearing higher prices could ignite public unrest.", "summary": "Long queues at gas stations across Iran indicate a severe squeeze on fuel supplies, exacerbated by the ongoing U.S. blockade and the country's civil war. The Iranian government is reportedly struggling to address the shortfall, wary that any increase in pump prices could trigger widespread public unrest. This situation underscores the significant economic pressure facing the nation and its leadership.", "analysis": null, "time": "1:07 AM", "tag": "WAR", "sensitivity": true, "image": null, "link": "https://www.nytimes.com/2026/08/30/world/middleeast/iran-fuel-supplies-blockade.html"}]}, {"id": "toronto", "label": "Toronto", "stories": [{"id": "t1", "lead": true, "kicker": "COLD CASE", "headline": "DNA Solves Two-Decade 'Jane Doe' Mystery from Highway 401 Crash", "sub": "A birth daughter's DNA has finally identified the 'Highway 401 Fire Victim' after more than 20 years, bringing closure to a long-unsolved case.", "summary": "The identity of the 'Highway 401 Fire Victim, ck local health advisories before visiting any public beaches.", "analysis": null, "time": "6:55 AM", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/f/c9/fc9e7bd2-a719-59d5-a84a-e5d73c3581c0/64b9590b4091e.image.jpg?resize=300%2C200", "link": "https://www.thestar.com/news/gta/beach-water-quality/stay-out-of-the-water-at-one-toronto-public-beach/article_adedfed3-e61e-5cbb-b39c-c7ac0a691902.html"}]}, {"id": "world", "label": "World", "stories": [{"id": "w1", "lead": true, "kicker": "SUDAN", "headline": "Sudan Civil War Refugees Face 'Dire and Deteriorating' Conditions in El Obeid", "sub": "Traumatized civilians arrive daily at 'shockingly overcrowded' El Obeid and its surrounding camps, exacerbating a humanitarian crisis.", "summary": "Civilians fleeing the ongoing civil war in Sudan are encountering 'dire and deteriorating' conditions in the refuge city of El Obeid and its surrounding camps. Traumatized individuals continue to arrive daily, overwhelming already 'shockingly overcrowded' facilities. The influx of displaced people is deepening a severe humanitarian crisis, with urgent needs for shelter, food, and medical aid. International aid organizations are struggling to keep pace with the escalating demands.", "analysis": "The worsening humanitarian situation in Sudan underscores the devastating long-term consequences of civil conflict, pushing already vulnerable populations to the brink. The strain on refuge cities like El Obeid highlights the critical need for sustained international support and diplomatic efforts to achieve a lasting ceasefire and facilitate aid delivery.", "time": "2:00 AM", "tag": "WAR", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/2026/aug/30/humanitarian-crisis-worsening-refuge-civilians-sudan-el-obeid"}, {"id": "w2", "lead": false, "kicker": "PACIFIC", "headline": "Pacific Islands Forum Meeting in Turmoil as Leaders Pull rebound from a significant professional defeat early in his promising career.", "time": "Yesterday", "tag": "FINAL", "sensitivity": false, "image": "https://media.guim.co.uk/629fd39eec10b151967b31295c47a7ac000ca70f/323_0_3214_2573/500.jpg", "link": "https://www.theguardian.com/sport/2026/aug/30/filip-hrgovic-stuns-moses-itauma-ibf-world-boxing-heavyweight-title"}, {"id": "s2", "lead": false, "kicker": "TENNIS", "headline": "Novak Djokovic 'As Best As I Can Be' Ahead of US Open Title Bid", "sub": "Djokovic aims for his 25th Grand Slam title, feeling well-prepared for the wide-open men's draw in New York.", "summary": "Novak Djokovic has declared himself 'as best as I can be' as he prepares for the US Open, where he will attempt to secure his 25th Grand Slam title. The Serbian tennis star aims to capitalize on what is perceived as a wide-open men's draw in New York. His confidence signals a strong bid for another major championship.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/1ecaf29fd23d7640690763d00e6b19044441bfce/258_0_2581_2065/500.jpg", "link": "https://www.theguardian.com/sport/2026/aug/29/novak-djokovic-in-good-shape-as-he-aims-for-25th-grand-slam-title-in-new-york"}, {"id": "s3", "lead": false, "kicker": "RUGBY", "headline": "Wallabies Defeat Argentina in Thriller, Maintain Kiss’s Winning Run", "sub": "Australia took a significant step in their redemption arc under new coach Les Kiss, beating Los Pumas 27-21 in San Salvador de Jujuy.", "summary": "The Wallabies secured a thrilling 27-21 victory over Argentina's Los Pumas in San Salvador de Jujuy, continuing new coach Les Kiss’s winning streak. This win marks a significant step in Australia’s redemption arc, showcasing improved performance and strategic play. Rob Valetini filled in for captain Harry Wilson at No. 8, while Fraser McReight's performance also provided the coach with valuable insights.", "analysis": null, "time": "Yesterday", "tag": "FINAL", "sensitivity": false, "image": "https://media.guim.co.uk/4732c82b30dc145bfe5ab0133d1defe93bc1fa3e/563_0_5627_4501/500.jpg", "link": "https://www.theguardian.com/sport/2026/aug/29/argentina-australia-rugby-union-match-report"}, {"id": "s4", "lead": false, "kicker": "BOXING", "headline": "Chantelle Cameron Unifies Super-Welterweight Titles", "sub": "The British fighter added WBC and WBA belts to her WBO title with a points win over Mikaela Mayer after a bloody battle in Birmingham.", "summary": "British boxer Chantelle Cameron has unified the super-welterweight titles, defeating Mikaela Mayer by points in a bloody battle in Birmingham. Cameron added the WBC and WBA belts to her existing WBO title, solidifying her dominance in the division. In another bout, Caroline Dubois cruised to victory, further highlighting British talent in women's boxing.", "analysis": null, "time": "Yesterday", "tag": "FINAL", "sensitivity": false, "image": "https://media.guim.co.uk/37148d0588e60149fd9607ddbefa4aa0adab0224/452_0_5823_4661/500.jpg", "link": "https://www.guardian.com/sport/2026/aug/29/chantelle-cameron-mikaela-mayer-boxing-world-titles"}]}, {"id": "business", "label": "Business", "stories": [{"id": "b1", "lead": true, "kicker": "FINANCE", "headline": "UK Asks Banks for 'Feelgood Stories' on Combating Dirty Money", "sub": "City firms are being tapped for case studies to convince a global watchdog that London has improved its efforts against financial crime.", "summary": "The UK government is soliciting 'feelgood stories' from City firms, requesting case studies that demonstrate their success in keeping out dirty money. This initiative aims to convince a global watchdog that London has significantly cleaned up its act regarding financial crime. The move comes as the UK seeks to bolster its reputation and avoid potential sanctions or negative assessments from international financial regulators. The government hopes these examples will provide real-life proof of effective anti-money laundering measures.", "analysis": "This unusual request highlights the pressure the UK faces to maintain its status as a leading financial hub while combating illicit finance. The reliance on 'feelgood stories' rather than solely data suggests a strategic effort to influence perception, but the underlying challenge remains demonstrating robust, systemic changes to deter sophisticated financial crime.", "time": "7:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/c9c7df672c39d2e25ed1540629429e74e02e03bc/37_0_1957_1566/500.jpg", "link": "https://www.theguardian.com/business/2026/aug/30/treasury-city-real-life-proof-blocking-dirty-money"}, {"id": "b2", "lead": false, "kicker": "ENERGY", "headline": "EU Gas Stores at 13-Year Low, Raising 'Winter Panic' Fears", "sub": "The UK, as a major gas consumer, is particularly exposed to heightened price volatility as Europe faces its lowest gas storage levels in over a decade.", "summary": "European Union gas stores have plummeted to their lowest level in 13 years, sparking fears of 'winter panic' across the continent. This critical situation leaves the UK, one of Europe’s largest gas consumers, particularly vulnerable to heightened price volatility. The low reserves raise concerns about energy security and potential cost increases for consumers as winter approaches.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/c5ebfab77c83c07b4de057c1add8490c44148f59/122_0_3612_2891/500.jpg", "link": "https://www.theguardian.com/business/2026/aug/29/european-gas-stores-lowest-13-years-eu-price"}, {"id": "b3", "lead": false, "kicker": "AUTOMOTIVE", "headline": "Nissan's Sunderland Plant Seeks Chery Deal Amid Brexit Challenges", "sub": "Operating at half capacity, the 'shining star' factory battles Brexit threats, with its recovery crucial for the north-east's economy.", "summary": "Nissan's Sunderland plant, once a 'shining star' of UK manufacturing, is operating at only half its capacity and seeking a deal with China’s Chery. The factory is battling ongoing threats posed by Brexit, with its survival seen as crucial for the north-east’s economic recovery. The move underscores the challenges faced by the automotive sector in a post-Brexit landscape.", "analysis": null, "time": "2:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/5d0a4c6f1d26f888754ca301cb9b6113d5d5314f/0_0_7200_5760/500.jpg", "link": "https://www.theguardian.com/business/2026/aug/30/brexit-north-east-recovery-rides-survival-nissan-plant"}, {"id": "b4", "lead": false, "kicker": "FRAUD", "headline": "Mortgage Address Change Scam Targets Homeowners", "sub": "A letter from PNC Bank about an unauthorized address change on a mortgage account signals a potential deed theft scheme.", "summary": "Homeowners are being warned about a potential deed theft scheme after a letter from PNC Bank notified a borrower of an unauthorized address change on their mortgage account. Such changes can be a precursor to fraudulent activities, including the illegal transfer of property ownership. This incident highlights the need for vigilance against sophisticated financial scams targeting real estate.", "analysis": null, "time": "1:02 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/08/29/business/00biz-how-sub/00biz-how-sub-superJumbo.jpg", "link": "https://www.nytimes.com/2026/08/30/business/address-change-mortgage-scam.html"}]}, {"id": "opinion", "label": "Opinion", "stories": [{"id": "o1", "lead": true, "kicker": "EDITORIAL", "headline": "Labour Should Curb the Power of Big Money in Politics", "sub": "The Daily argues that Prime Minister Andy Burnham's retreat from a £500,000 donations cap is a mistake, urging a return to principles of curbing big money's influence.", "summary": "The Daily's editorial board argues that Prime Minister Andy Burnham's decision to back away from a previously favored £500,000 cap on political donations is a significant misstep. Before taking office, Burnham advocated for such a limit, but his current stance suggests a retreat from principles aimed at curbing the power of big money in politics. The editorial asserts that Labour should uphold its commitment to fundamental rewiring of power and reduce the influence of large financial contributions to ensure a more equitable political landscape. This move is seen as crucial for maintaining public trust and fostering genuine democratic representation.", "analysis": "This editorial highlights the tension between political ideals and the practicalities of fundraising, particularly for a party in power. Burnham's shift suggests a pragmatic concession to financial realities, but it risks alienating a base that expects reform. The debate over donation caps is central to broader discussions about democratic integrity and the influence of wealth in policymaking.", "time": "Yesterday", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/e6ac777ffd63d4223a920eba1f5a5e711f6aeb8f/500_0_5000_4000/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/28/the-guardian-view-on-political-donations-labour-should-curb-the-power-of-big-money"}, {"id": "o2", "lead": false, "kicker": "GEOPOLITICS", "headline": "Trump’s ‘Economic D-Day’ Against Iran Risks Escalation", "sub": "Sina Toossi argues that the US approach to Iran mistakes pressure for strategy, warning Tehran has its own leverage.", "summary": "Sina Toossi of the Center for International Policy warns that President Trump’s 'economic D-day' against Iran risks significantly escalating tensions. Toossi argues that the US strategy mistakenly equates applying pressure with a coherent long-term plan, similar to its approach in the Strait of Hormuz. He cautions that Tehran possesses its own chips to play, suggesting that the current path could lead to unintended and dangerous consequences.", "analysis": null, "time": "3:00 AM", "tag": "WAR", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/commentisfree/2026/aug/30/trump-economic-d-day-iran-stakes-higher-war"}, {"id": "o3", "lead": false, "kicker": "SOCIAL COMMENTARY", "headline": "The Barbecue is Fundamentally Unenjoyable, Argues Max Liu", "sub": "Freelance writer Max Liu contends that barbecues are toxic, tiresome, and malnourishing, urging people to 'put a lid on it.'", "summary": "Freelance writer Max Liu provocatively argues that the barbecue is 'fundamentally unenjoyable,' describing it as toxic, tiresome, and malnourishing. In his opinion piece, Liu urges readers to 'put a lid on it,' challenging the widespread cultural affection for outdoor grilling. His critique extends beyond the food to the entire experience, suggesting it is an overrated and unpleasant social ritual.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/0dd03607557a32240ddc1d0f7360d4f5b7f3fcb3/0_0_5000_4000/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/29/the-hill-i-will-die-on-barbecue-unenjoyable-toxic-tiresome-malnourishing"}, {"id": "o4", "lead": false, "kicker": "CULTURE", "headline": "Why is 'Vegan' Suddenly Being Used as a Slur?", "sub": "Emma Beddington explores how US Republicans are tarnishing plant-eating opponents, arguing vegans are well-suited for power.", "summary": "Emma Beddington examines the phenomenon of 'vegan' being used as a slur by US Republicans, who are increasingly tarnishing their plant-eating political opponents. Beddington argues that, contrary to this negative framing, vegans are actually well-suited to hold positions of power. She contends that the qualities often associated with veganism, such as discipline and foresight, are beneficial for leadership.", "analysis": null, "time": "9:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/04e71ce87ae9df9a0d0c0bf14e6443a8753ee379/292_0_2917_2333/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/30/why-is-vegan-suddenly-being-used-as-a-slur"}]}]}</script>

  <script>
    (function () {
      var raw = document.getElementById('edition').textContent;
      var data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<div class="notice">No edition loaded. Run the build to generate today’s paper.</div>';
        return;
      }

      var state = { active: (data.sections[0] || {}).id, openId: null };

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Editorial heat flags keep the red chip; procedural flags cool to navy,
      // so a red chip still means something (the Scarce Red Rule).
      function isHotTag(t) {
        return /^(DEVELOPING|BREAKING|LIVE|WAR|ALERT|URGENT)$/i.test(t || '');
      }

      // ---- Ask AI ----------------------------------------------------------
      // The reader taps one story and gets a briefing, not a chat. The prompt
      // does three jobs: hand over the clipping, name the shape of the answer
      // (five parts, ~500 words, hard ceiling), and set up the follow-up so the
      // conversation continues without the reader having to think of a question.
      // Voice constraints mirror src/config.py HOUSE_VOICE, em dash ban included.
      function buildPrompt(st, sectionLabel) {
        var L = [];
        L.push('I read this in my morning paper and I want to understand it properly.');
        L.push('');
        L.push('THE CLIPPING');
        L.push('Headline: ' + st.headline);
        if (st.sub) L.push('Standfirst: ' + st.sub);
        if (st.summary) L.push('Summary: ' + st.summary);
        if (st.analysis) L.push("My paper's why-it-matters note: " + st.analysis);
        L.push('Section: ' + sectionLabel + '. Filed ' + (st.time || 'this morning') +
               ', edition of ' + data.date + '.');
        if (st.link) L.push('Source: ' + st.link);
        L.push('');
        L.push('WHAT I WANT');
        L.push('A briefing that leaves me genuinely informed, not a restatement of what I just');
        L.push('pasted. Assume I know nothing beyond the clipping above.');
        L.push('');
        L.push('Check current reporting first if you are able to search. My clipping is a');
        L.push('summary and may be incomplete or already overtaken by events. If you cannot');
        L.push('search, say so in one line at the top, then separate what you are confident');
        L.push('about from what you would want verified.');
        L.push('');
        L.push('STRUCTURE');
        L.push('I am reading this on a phone. Build the answer in layers, heaviest first, so');
        L.push('I can stop at the end of any layer and still have got something whole. Use');
        L.push('these markdown headings exactly, so they render large on a small screen.');
        L.push('');
        L.push('# The gist');
        L.push('An H1 of six to ten words stating the actual point, not the topic. Then two or');
        L.push('three short sentences giving me the whole story in plain words. If I read');
        L.push('nothing else, this is what I walk away knowing. Correct my clipping here if it');
        L.push('is wrong or out of date.');
        L.push('');
        L.push('## Why it matters');
        L.push('Two or three short sentences on the stakes and the second order effects. Be');
        L.push('concrete about who gains, who pays, how much, and by when.');
        L.push('');
        L.push('## How we got here');
        L.push('Only the background I need to follow this story. Not a history lecture.');
        L.push('');
        L.push('## Where it is contested');
        L.push('The strongest disagreement among serious people, put fairly. If it is genuinely');
        L.push('uncontested, say so in one sentence and move on.');
        L.push('');
        L.push('## What to watch');
        L.push('Three bullets, each a specific checkable marker with a rough timeframe.');
        L.push('');
        L.push('## Ask me next');
        L.push('Three numbered questions, ordered by what would teach me the most. I will reply');
        L.push('with a digit.');
        L.push('');
        L.push('READING ON A PHONE');
        L.push('Short paragraphs: three sentences at most, none longer than about sixty words,');
        L.push('with a blank line between them. No tables, no nested bullets, no wall of text.');
        L.push('Around 500 words in total. Hard ceiling 650. Do not pad to reach a length; the');
        L.push('gist and why it matters are worth more than the sections under them.');
        L.push('');
        L.push('VOICE');
        L.push('Financial Times, not an encyclopedia and not a chatbot. Plain, confident,');
        L.push('concrete. Specifics over abstractions: names, numbers, dates, stakes. Every');
        L.push('sentence earns its place. No preamble, no throat clearing, no restating my');
        L.push('prompt back to me, no hedging filler, no em dashes. Where you are uncertain,');
        L.push('mark it in the sentence it applies to rather than in a disclaimer paragraph.');
        return L.join('\n');
      }

      function findStory(id) {
        for (var i = 0; i < data.sections.length; i++) {
          var list = data.sections[i].stories || [];
          for (var j = 0; j < list.length; j++) {
            if (list[j].id === id) {
              return { story: list[j], label: data.sections[i].label };
            }
          }
        }
        return null;
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        // Older iOS standalone PWAs land here.
        return new Promise(function (resolve, reject) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('copy failed'));
        });
      }

      // Tagline reflects the sections the edition actually shipped, not a
      // hardcoded list that can disagree with the paper.
      function taglineText() {
        var labels = data.sections
          .filter(function (s) { return s.id !== 'front'; })
          .map(function (s) { return s.label; });
        return (labels.length ? labels : ['Toronto', 'World', 'Business']).join(' · ');
      }

      function weatherHtml(w) {
        if (!w || !w.icon) return '';
        var week = (w.week || []).map(function (d) {
          return '<div class="day"><div class="d">' + esc(d.day) + '</div>' +
            '<div class="i">' + esc(d.icon) + '</div>' +
            '<div class="hi">' + esc(d.hi) + '°</div>' +
            '<div class="lo">' + esc(d.lo) + '°</div></div>';
        }).join('');
        return '<div class="weather" id="weather" role="button" tabindex="0" ' +
          'aria-expanded="false" aria-label="Toronto weather, tap for the week">' +
          '<div class="summary">' +
            '<span class="ico">' + esc(w.icon) + '</span>' +
            '<span class="city">Toronto</span>' +
            '<span class="temp">' + esc(w.high) + '° / ' + esc(w.low) + '°</span>' +
            '<span class="muted">' + esc(w.condition) + '</span>' +
            '<span class="muted">Rain ' + esc(w.rain) + '</span>' +
            '<span class="muted">Wind ' + esc(w.wind) + '</span>' +
            '<span class="chev" id="wchev">▼</span>' +
          '</div>' +
          '<div class="week" id="wweek" style="display:none">' + week + '</div>' +
        '</div>';
      }

      function tabsHtml() {
        return '<div class="tabs" role="tablist">' + data.sections.map(function (s) {
          var on = s.id === state.active;
          return '<button class="tab' + (on ? ' active' : '') + '" role="tab" ' +
            'aria-selected="' + on + '" data-tab="' + esc(s.id) + '">' + esc(s.label) + '</button>';
        }).join('') + '</div>';
      }

      function cardHtml(st, sectionLabel) {
        var open = st.id === state.openId;
        var tag = st.tag
          ? '<span class="tag ' + (isHotTag(st.tag) ? 'hot' : 'cool') + '">' + esc(st.tag) + '</span>'
          : '';
        var kicker = st.kicker ? '<div class="kicker">' + tag + esc(st.kicker) + '</div>' : '';
        var sub = st.sub ? '<div class="sub">' + esc(st.sub) + '</div>' : '';
        var expand = '';
        if (open) {
          var img = st.image
            ? '<img src="' + esc(st.image) + '" alt="' + esc(st.headline) + '" ' +
              'loading="lazy" onerror="this.remove()" />'
            : '';
          var analysis = st.analysis
            ? '<div class="analysis"><span class="alabel">Why it matters</span>' + esc(st.analysis) + '</div>'
            : '';
          var link = st.link
            ? '<a class="readmore" href="' + esc(st.link) + '" target="_blank" rel="noopener">Read full story →</a>'
            : '';

          // Prefill the destinations at render time so a long press ("open in
          // app") carries the prompt too, instead of us intercepting the tap.
          var q = encodeURIComponent(buildPrompt(st, sectionLabel));
          // No target="_blank" on these two. In a standalone PWA a blank target
          // opens an in-app browser sheet, which iOS will not hand off to an
          // installed app; a plain top-level tap is what lets the Claude and
          // ChatGPT apps claim their own domains as Universal Links. "Read full
          // story" keeps _blank, because a news site does belong in a tab.
          var share = navigator.share
            ? '<button class="ask-opt" data-ai="share" data-id="' + esc(st.id) + '">Share to app…</button>'
            : '';
          var actions = '<div class="actions">' + link +
            '<button class="askai" data-ask="' + esc(st.id) + '" aria-expanded="false" ' +
              'aria-controls="ask-' + esc(st.id) + '">Ask AI ▾</button></div>' +
            '<div class="ask-panel" id="ask-' + esc(st.id) + '">' +
              '<div class="ask-row">' +
                '<a class="ask-opt" href="https://claude.ai/new?q=' + esc(q) + '">Claude</a>' +
                '<a class="ask-opt" href="https://chatgpt.com/?q=' + esc(q) + '">ChatGPT</a>' +
                share +
                '<button class="ask-opt" data-ai="copy" data-id="' + esc(st.id) + '">Copy</button>' +
              '</div>' +
              '<div class="ask-note">Opens in the app if you have it installed. The reply ' +
                'starts with the gist in a few lines, then goes deeper, then offers three ' +
                'follow-up questions.</div>' +
            '</div>';

          expand = '<div class="expand">' + img +
            '<p class="sumtext">' + esc(st.summary) + '</p>' + analysis + actions + '</div>';
        }
        return '<div class="card' + (st.lead ? ' lead' : '') + (open ? ' open' : '') +
          '" data-card="' + esc(st.id) + '" role="button" tabindex="0" ' +
          'aria-expanded="' + open + '">' +
          '<div class="row"><div class="row-main">' + kicker +
            '<div class="headline">' + esc(st.headline) + '</div>' + sub +
            '<div class="time">' + esc(st.time) + '</div></div>' +
            '<div class="toggle" aria-hidden="true">' + (open ? '−' : '+') + '</div>' +
          '</div>' + expand +
        '</div>';
      }

      function storiesInner() {
        var section = data.sections.filter(function (s) { return s.id === state.active; })[0];
        if (!section) return '';
        if (!section.stories || !section.stories.length) {
          return '<div class="empty">Nothing filed for ' + esc(section.label) + ' this morning.</div>';
        }
        return section.stories.map(function (st) {
          return cardHtml(st, section.label);
        }).join('');
      }

      // Quietly flag a saved (not-today) edition served from cache/offline.
      function staleRibbon() {
        try {
          var meta = document.querySelector('meta[name=build]');
          if (!meta) return '';
          var built = new Date(meta.getAttribute('content'));
          if (isNaN(built.getTime())) return '';
          var opt = { timeZone: 'America/Toronto' };
          if (built.toLocaleDateString('en-CA', opt) < new Date().toLocaleDateString('en-CA', opt)) {
            return '<div class="stale">Saved edition · ' + esc(data.date) + '</div>';
          }
        } catch (e) {}
        return '';
      }

      function appHtml() {
        return '<div class="masthead">' +
            '<div class="date">' + esc(data.date) + '</div>' +
            '<div class="title">THE DAILY</div>' +
            '<div class="tagline">' + esc(taglineText()) + '</div>' +
          '</div>' +
          staleRibbon() +
          weatherHtml(data.weather) +
          tabsHtml() +
          '<div class="stories" id="stories">' + storiesInner() + '</div>' +
          '<div class="footer">THE DAILY · TORONTO · Tap any headline to read</div>';
      }

      var app = document.getElementById('app');

      // Rebuild only the stories column; masthead, weather, and tab strip (and
      // their scroll/open state) are left untouched. This is what keeps a tap
      // from resetting the reader's place.
      function refreshStories() {
        document.getElementById('stories').innerHTML = storiesInner();
        bindCards();
      }

      function selectTab(id) {
        if (id === state.active) return;
        state.active = id;
        state.openId = null;
        var tabs = document.querySelectorAll('.tab');
        Array.prototype.forEach.call(tabs, function (t) {
          var on = t.getAttribute('data-tab') === id;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on);
          if (on) t.scrollIntoView({ inline: 'center', block: 'nearest' });
        });
        refreshStories();
        // Start the new section at the top, tab strip stuck under the notch.
        var tabsEl = document.querySelector('.tabs');
        if (tabsEl) window.scrollTo(0, tabsEl.offsetTop);
      }

      function toggleCard(id) {
        var y = window.scrollY;
        state.openId = state.openId === id ? null : id;
        refreshStories();
        window.scrollTo(0, y);   // grow/collapse in place, never jump
      }

      function bindWeather() {
        var weather = document.getElementById('weather');
        if (!weather) return;
        function toggle() {
          var week = document.getElementById('wweek');
          var chev = document.getElementById('wchev');
          var showing = week.style.display !== 'none';
          week.style.display = showing ? 'none' : 'flex';
          chev.textContent = showing ? '▼' : '▲';
          weather.setAttribute('aria-expanded', String(!showing));
        }
        weather.addEventListener('click', toggle);
        weather.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
        });
      }

      function bindTabs() {
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
          btn.addEventListener('click', function () { selectTab(btn.getAttribute('data-tab')); });
        });
      }

      function bindCards() {
        Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
          function activate(ev) {
            // Let links and the Ask AI controls handle their own activation.
            if (ev.target.closest('a, button')) return;
            // While open, only the header row collapses it, so reading (and
            // selecting) the body never closes the story by accident.
            if (card.classList.contains('open') && !ev.target.closest('.row')) return;
            toggleCard(card.getAttribute('data-card'));
          }
          card.addEventListener('click', activate);
          card.addEventListener('keydown', function (ev) {
            if (ev.key !== 'Enter' && ev.key !== ' ') return;
            // Never swallow the key from a control that acts on it itself.
            if (ev.target.closest('a, button')) return;
            ev.preventDefault();
            activate(ev);
          });
          bindAsk(card);
        });
      }

      // Panel state is held in the DOM, not in `state`, so opening the
      // destinations never triggers a stories rebuild and never moves the page.
      function bindAsk(card) {
        var toggle = card.querySelector('.askai');
        if (!toggle) return;
        var panel = card.querySelector('.ask-panel');

        toggle.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var open = panel.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(open));
          toggle.textContent = open ? 'Ask AI ▴' : 'Ask AI ▾';
        });

        Array.prototype.forEach.call(panel.querySelectorAll('[data-ai]'), function (el) {
          var kind = el.getAttribute('data-ai');
          el.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var found = findStory(el.getAttribute('data-id'));
            if (!found) return;
            var prompt = buildPrompt(found.story, found.label);

            if (kind === 'share') {
              navigator.share({ text: prompt }).catch(function () {});
              return;
            }
            var label = el.textContent;
            copyText(prompt).then(function () {
              el.textContent = 'Copied';
            }).catch(function () {
              el.textContent = 'Copy failed';
            }).then(function () {
              setTimeout(function () { el.textContent = label; }, 1800);
            });
          });
        });
      }

      app.innerHTML = appHtml();
      bindWeather();
      bindTabs();
      bindCards();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
