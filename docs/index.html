  <title>The Daily</title>
  <style>
    /* ---- Design tokens: The Morning Broadsheet ------------------------- */
    :root {
      --paper: #faf8f3;        /* the sheet (warm white, never #fff) */
      --desk: #efece6;         /* the desk beyond the column */
      --ink: #17130d;          /* headlines / primary text */
      --ink-sub: #453f38;      /* standfirsts */
      --ink-muted: #635d54;    /* inactive tabs */
      --meta: #6c665c;         /* timestamps, dateline, footer (>=AA small) */
      --rule: #dcd6cc;         /* hairline between cards */
      --rule-soft: #e3ded4;    /* hairline inside an opened card */
      --navy: #1a2744;         /* structural ink */
      --navy-ink: #1a2744;     /* navy used as text (links, active tab) */
      --red: #8b1a1a;          /* editorial heat */
      --tint-open: #f2ede4;    /* ground of an expanded card */
      --tint-analysis: #ece6da;/* ground of the why-it-matters note */
      --strip-bg: #1a2744;     /* weather strip */
      --strip-ink: #f7f4ee;
      --chip-hot: #8b1a1a;     /* DEVELOPING / WAR-class flags */
      --chip-cool: #1a2744;    /* procedural flags (FINAL, EDITORIAL) */
      --chip-ink: #faf8f3;
      --focus: #1a2744;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151a22;      /* lamplight edition: deep navy-black paper */
        --desk: #0e1219;
        --ink: #e9e3d5;        /* cream ink */
        --ink-sub: #bcb6a8;
        --ink-muted: #948e82;
        --meta: #8f897d;
        --rule: #2a303a;
        --rule-soft: #2f3540;
        --navy: #6f82a8;       /* structure lifted so it reads on dark */
        --navy-ink: #a3b3d2;
        --red: #d1726b;        /* desaturated heat */
        --tint-open: #1b212b;
        --tint-analysis: #20262f;
        --strip-bg: #1b2334;
        --strip-ink: #e9e3d5;
        --chip-hot: #a8443c;
        --chip-cool: #3b4a6c;
        --chip-ink: #f0eadc;
        --focus: #a3b3d2;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 100%; }
    html, body { background: var(--desk); }
    body {
      font-family: 'Georgia', serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--paper);
      max-width: 680px;
      margin: 0 auto;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Masthead */
    .masthead {
      border-bottom: 4px solid var(--navy);
      padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
      background: var(--paper);
    }
    .masthead .date {
      font-size: 0.6875rem; color: var(--meta); letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .masthead .title {
      font-size: 2.375rem; font-weight: 700; letter-spacing: -0.01em;
      color: var(--navy); line-height: 1; margin-bottom: 2px;
    }
    .masthead .tagline {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; color: var(--meta);
      letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* Stale-edition ribbon */
    .stale {
      background: var(--tint-analysis); color: var(--meta);
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; text-align: center;
      padding: 7px 20px;
    }

    /* Weather strip */
    .weather {
      background: var(--strip-bg); color: var(--strip-ink);
      cursor: pointer; user-select: none;
    }
    .weather .summary {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
      min-height: 44px;
    }
    .weather .summary::-webkit-scrollbar { display: none; }
    .weather .ico { font-size: 1.375rem; }
    .weather .city { font-weight: 700; font-size: 0.9375rem; }
    .weather .temp { font-size: 0.9375rem; }
    .weather .muted { opacity: 0.72; font-size: 0.8125rem; white-space: nowrap; }
    .weather .chev { margin-left: auto; opacity: 0.6; font-size: 0.75rem; }
    .weather .week {
      display: flex; border-top: 1px solid rgba(255,255,255,0.12);
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
    }
    .weather .week::-webkit-scrollbar { display: none; }
    .weather .day {
      text-align: center; min-width: 52px; padding: 0 8px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .weather .day .d { font-size: 0.6875rem; opacity: 0.6; margin-bottom: 4px; }
    .weather .day .i { font-size: 1.125rem; }
    .weather .day .hi { font-size: 0.8125rem; font-weight: 700; margin-top: 4px; }
    .weather .day .lo { font-size: 0.6875rem; opacity: 0.5; }

    /* Tab nav */
    .tabs {
      display: flex; overflow-x: auto; border-bottom: 2px solid var(--navy);
      background: var(--paper); scrollbar-width: none;
      position: sticky; top: 0; z-index: 10;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; min-height: 44px; display: flex; align-items: center;
      padding: 0 18px; border: none; background: none; cursor: pointer;
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; font-weight: 700;
      color: var(--ink-muted); border-bottom: 3px solid transparent;
      margin-bottom: -2px; letter-spacing: 0.12em; text-transform: uppercase;
      transition: color 0.15s;
    }
    .tab.active { color: var(--navy-ink); border-bottom-color: var(--navy); }

    /* Stories */
    .stories { padding: 8px 20px 40px; }
    .empty {
      padding: 40px 4px; text-align: center; color: var(--meta);
      font-style: italic; font-size: 0.9375rem;
    }
    .card {
      border-top: 1px solid var(--rule); padding: 14px 0; cursor: pointer;
      background: var(--paper); transition: background 0.15s;
    }
    .card.lead { border-top: 3px solid var(--navy); padding: 20px 0 16px; }
    .card.open { background: var(--tint-open); }
    .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card .row-main { flex: 1; min-width: 0; }
    .card .kicker {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; color: var(--red); margin-bottom: 6px; text-transform: uppercase;
    }
    .card .tag {
      color: var(--chip-ink); padding: 2px 6px; margin-right: 8px;
      font-size: 0.5625rem; border-radius: 2px; vertical-align: 1px;
    }
    .card .tag.hot { background: var(--chip-hot); }
    .card .tag.cool { background: var(--chip-cool); }
    .card .headline {
      font-size: 1.0625rem; font-weight: 700; line-height: 1.25; color: var(--ink); margin-bottom: 6px;
    }
    .card.lead .headline { font-size: 1.375rem; }
    .card .sub {
      font-size: 0.875rem; color: var(--ink-sub); line-height: 1.4; margin-bottom: 4px; font-style: italic;
    }
    .card .time { font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta); margin-top: 4px; }
    .card .toggle { color: var(--navy-ink); opacity: 0.5; font-size: 1.125rem; flex-shrink: 0; margin-top: 2px; }
    .card .expand {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    }
    .card .expand .sumtext {
      font-size: 0.9375rem; color: var(--ink-sub); line-height: 1.7;
    }
    .card .expand img {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      background: var(--tint-open); border-radius: 3px; margin-bottom: 12px;
    }
    .card .analysis {
      margin-top: 12px; padding: 10px 14px; background: var(--tint-analysis);
      font-size: 0.875rem; line-height: 1.6; color: var(--ink-sub); font-style: italic;
    }
    .card .analysis .alabel {
      display: block; font-family: 'Arial', sans-serif; font-style: normal;
      font-size: 0.625rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--navy-ink); margin-bottom: 4px;
    }
    .card .readmore {
      display: inline-block; margin-top: 12px; min-height: 44px; line-height: 44px;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink); text-decoration: none;
    }
    .card .readmore:hover { text-decoration: underline; }
    .card .readmore:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    /* Ask AI: hand the clipping and a briefing prompt to a model */
    .card .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .askai, .card .ask-opt {
      border: none; background: none; padding: 0; cursor: pointer;
      min-height: 44px; line-height: 44px; text-decoration: none;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink);
    }
    .card .askai { margin-top: 12px; }
    .card .askai:hover, .card .ask-opt:hover { text-decoration: underline; }
    .card .askai:focus-visible, .card .ask-opt:focus-visible {
      outline: 2px solid var(--focus); outline-offset: 3px;
    }
    .card .ask-panel { display: none; border-top: 1px solid var(--rule-soft); margin-top: 4px; }
    .card .ask-panel.open { display: block; }
    .card .ask-row { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .ask-note {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.55;
      color: var(--meta); letter-spacing: 0.02em; padding-bottom: 12px;
    }

    /* Footer */
    .footer {
      border-top: 2px solid var(--navy);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta);
      text-align: center; letter-spacing: 0.06em;
    }
    .notice { padding: 40px 20px; text-align: center; color: var(--meta); font-style: italic; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>

 victim. This revelation underscores a tragic pattern of domestic violence preceding the murder.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": true, "image": null, "link": "https://www.thestar.com/news/gta/man-accused-of-murdering-etobicoke-woman-was-awaiting-trial-for-alleged-intimate-partner-assault-against-her/article_1037613a-c24e-4a44-b9c7-eb46dd4efc85.html"}, {"id": "t3", "lead": false, "kicker": "COURTS", "headline": "Toronto Gym Teacher's Sex Assault Case Tossed Due to Trial Overbooking Delays", "sub": "The teacher maintains his innocence, as the practice of 'stacking' trials in Ontario courts leads to significant delays.", "summary": "A Toronto gym teacher's sex assault case has been dismissed due to delays caused by the overbooking of trials in Ontario's court system. The teacher has consistently maintained his innocence throughout the proceedings. This dismissal highlights the ongoing issue of \"stacking\" trials, a practice intended to improve court efficiency but often resulting in lengthy delays that can compromise justice.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": true, "image": null, "link": "https://www.thestar.com/news/gta/toronto-gym-teachers-sex-assault-case-tossed-for-delay-caused-by-overbooking-trials/article_5d6d0d37-512a-48d3-9587-1df08145012d.html"}, {"id": "t4", "lead": false, "kicker": "PUBLIC SAFETY", "headline": "Fire Chief Sounds Alarm on Rising Lithium-Ion Battery Fires After E-Bike Incident", "sub": "A recent e-bike fire adds to a growing number of lithium-ion battery incidents that have sent multiple people to hospital.", "summary": "Toronto's fire chief is raising concerns about the increasing number of lithium-ion battery fires, following a recent incident where an e-bike burst into flames. Similar battery fires have led to multiple hospitalizations in recent months and have shown a significant increase in recent years. The chief emphasized the need for greater awareness and safety measures regarding these devices.", "analysis": null, "time": "9:58 PM Yesterday", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/8/08/80847b2d-64f1-5eab-ad8d-e19f03911169/6a6807be86675.image.jpg?resize=300%2C158", "link": "https://www.thestar.com/news/gta/as-e-bike-busts-into-flames-fire-chief-sounds-alarm-on-rising-lithium-ion-battery-fires/article_075b1a5e-485a-4084-828c-51a7fedf3634.html"}]}, {"id": "world", "label": "World", "stories": [{"id": "w1", "lead": true, "kicker": "MIDDLE EAST", "headline": "Asia 'Scraping the Bottom of the Barrel' as Red Sea Oil Blockade Worsens Energy Crisis", "sub": "The Houthi threat to Saudi oil exports compounds an existing energy crisis for Asian nations reeling from the Strait of Hormuz closure.", "summary": "Asian nations are facing a severe energy crisis, described as \"scraping the bottom of the barrel,\" as a Red Sea oil blockade intensifies. The Houthi threat to Saudi oil exports is exacerbating the situation, coming on the heels of the closure of the Strait of Hormuz. Countries like Japan, South Korea, and the Philippines are particularly hard-hit, struggling to secure vital energy supplies amid the escalating geopolitical tensions.", "analysis": "The deepening energy crisis in Asia, driven by Red Sea and Strait of Hormuz blockades, highlights the fragility of global supply chains and the profound economic impact of regional conflicts. This situation could force a rapid re-evaluation of energy security strategies and accelerate diversification efforts, potentially shifting global trade dynamics and diplomatic priorities.", "time": "1:37 AM", "tag": "WAR", "sensitivity": false, "image": "https://media.guim.co.uk/fcc9efbf60936f70258e466770fbc094e903e225/414_0_4728_3783/500.jpg", "link": "https://www.theguardian.com/world/2026/jul/28/asia-energy-oil-crisis-red-sea-blockade-houthis"}, {"id": "w2", "lead": false, "kicker": "ARGENTINA", "headline": "Javier Milei Accuses US Democrats of Financing 'Anti-Argentina Campaign' at World Cup", "sub": "The Argentine President also blamed Brazil and Mexico, claiming online critics \"do not want the ideas of freedom to succeed.\"", "summary": "Argentine President Javier Milei has accused US Democrats of financing an \"anti-Argentina campaign\" during the World Cup. He also pointed fingers at Brazil and Mexico, stating that online critics are motivated by a desire to prevent \"the ideas of freedom to succeed.\" Milei's comments reflect his ongoing confrontational stance against perceived political opposition.", "analysis": null, "time": "10:21 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/86aeafb5c20cd5724a6740beae18fce5628841ac/660_0_3298_2639/500.jpg", "link": "https://www.theguardian.com/world/2026/jul/28/javier-milei-accuses-us-democrats-of-financing-anti-argentina-campaign-at-world-cup"}, {"id": "w3", "lead": false, "kicker": "UK POLITICS", "headline": "New UK Prime Minister Andy Burnham Faces Social Care Crisis After Decades of Failure", "sub": "Burnham has pledged to reform the system to prevent NHS 'collapse,' but the path forward remains unclear.", "summary": "New UK Prime Minister Andy Burnham is confronting the nation's social care crisis, a challenge that has persisted for three decades. Burnham has publicly committed to reforming the system, stating it is essential to prevent the \"collapse\" of the National Health Service. However, the specific strategies and feasibility of his proposed changes are yet to be fully detailed.", "analysis": null, "time": "5:44 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/e927c9460b2ee2791017eaadb8e2b12c4b0c5c40/454_0_3989_3193/500.jpg", "link": "https://www.theguardian.com/world/2026/jul/28/tuesday-briefing-can-andy-burnham-solve-the-social-care-crisis-after-three-decades-of-failure"}, {"id": "w4", "lead": false, "kicker": "SURVEILLANCE", "headline": "Concerns Rise Over AI-Enabled Smart Lamp-Posts and Surveillance State Fears", "sub": "The new camera-equipped streetlights promise crime fighting and missing person tracking, but critics warn of a step towards a surveillance state.", "summary": "The deployment of AI-enabled smart lamp-posts, equipped with cameras, is raising concerns about privacy and the potential for a surveillance state. Proponents argue these new streetlights can effectively fight crime and aid in locating missing persons. However, critics fear their widespread use could erode civil liberties and move Britain closer to a comprehensive surveillance society.", "analysis": null, "time": "10:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/2830eb38a2dc5fcf309cd54b4a9eea6d361b07be/0_0_2500_2000/500.jpg", "link": "https://www.theguardian.com/world/2026/jul/28/spies-in-sky-worried-ai-enabled-smart-lamp-posts-surveillance"}]}, {"id": "sports", "label": "Sports", "stories": [{"id": "s1", "lead": true, "kicker": "COMMONWEALTH GAMES", "headline": "Commonwealth Games Day Five: Athletics Finals and Medal Races Underway in Glasgow", "sub": "Australia's Rose Davies secures the first athletics gold, while Adam Ramsay-Peaty adds another bronze in swimming.", "summary": "Day five of the Commonwealth Games in Glasgow is in full swing, featuring key finals in athletics, weightlifting, and gymnastics. Australia's Rose Davies claimed the first athletics gold medal, storming home in the women's 10,000m. In swimming, Adam Ramsay-Peaty secured his second bronze medal in the men's 50m breaststroke. The Games continue with intense competition as countries vie for positions on the medal table.", "analysis": "The Commonwealth Games continue to deliver compelling narratives, from athletic triumphs to personal stories of resilience. The early medal wins set the tone for national pride and competitive spirit, while the sheer breadth of events underscores the Games' role in showcasing diverse sporting talent across the Commonwealth.", "time": "10:38 AM", "tag": "FINAL", "sensitivity": false, "image": "https://media.guim.co.uk/f7a5385bc1a2c463dfe929d553aebef87589bc76/158_0_5977_4781/500.jpg", "link": "https://www.theguardian.com/sport/live/2026/jul/28/commonwealth-games-2026-athletics-weightlifting-gymnastics-day-five-live"}, {"id": "s2", "lead": false, "kicker": "F1", "headline": "F1 Summer Report Card: Mercedes Tops Class, Others Must Improve", "sub": "As the paddock enters its mid-season break, the race to catch Kimi Antonelli intensifies.", "summary": "The Formula 1 paddock is on its traditional three-week mid-season break, with a summer report card placing Mercedes at the top of the class. The focus now shifts to which teams can improve to catch Kimi Antonelli, who is leading the charge. Other teams are urged to do better in the second half of the season.", "analysis": null, "time": "7:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/0f20e2723adf159204328e46f26d8c9b1d25b57f/0_0_5000_4000/500.jpg", "link": "https://www.theguardian.com/sport/2026/jul/28/f1-summer-report-card-from-top-of-the-class-to-the-team-that-must-do-better"}, {"id": "s3", "lead": false, "kicker": "WNBA", "headline": "WNBA All-Star Weekend Triumphs, Emphasizing Joy and Community", "sub": "Despite pre-game headaches, festivities in Chicago, including a Barack Obama cameo, drew a record crowd and celebrated the league's spirit.", "summary": "The WNBA's All-Star Weekend in Chicago proved a resounding success, overcoming initial challenges to deliver a celebration of joy and community. The festivities, which included a cameo by Barack Obama, attracted a record crowd. The event highlighted the league's vibrant atmosphere and its growing appeal, encouraging fans to focus on the positive aspects of the game.", "analysis": null, "time": "3:13 PM Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/2d467b91dcdc69ef06f4de0b4a3e76333a8e702f/250_0_2500_2000/500.jpg", "link": "https://www.theguardian.com/sport/2026/jul/27/wnba-all-star-weekend-obama-caitlin-clark-cathy-engelbert"}, {"id": "s4", "lead": false, "kicker": "HORSE RACING", "headline": "Jockey Club Staff Cull Leaves Derby Feeling Flat as Ascot and Goodwood Thrive", "sub": "The departure of key personnel, including Jim Allen, is seen as a significant loss for the Epsom project to revive the Derby.", "summary": "A staff cull at the Jockey Club has left the Derby feeling flat, while other major racing events like Ascot and Goodwood are riding high. The departure of individuals such as Jim Allen, known for his drive and enthusiasm, is considered a major loss for the five-year project aimed at reviving the Derby. This internal restructuring raises concerns about the future direction and prestige of the historic race.", "analysis": null, "time": "4:35 PM Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/bfa460930c18f11c87ddf4954a3aeb19fc1bcbf6/231_0_2918_2334/500.jpg", "link": "https://www.theguardian.com/sport/2026/jul/27/jockey-club-staff-cull-leaves-derby-feeling-flat-with-ascot-goodwood-riding-high-horse-racing"}]}, {"id": "business", "label": "Business", "stories": [{"id": "b1", "lead": true, "kicker": "MARKETS", "headline": "AI Sell-Off Deepens as Chip Stocks Slump in Market Retreat", "sub": "Samsung and SK Hynix shares fall over 10% amid renewed fears over AI spending and Chinese competition.", "summary": "The AI sector is experiencing a deepening sell-off, with chip stocks leading a broader market retreat. Major players like Samsung and SK Hynix saw their shares plummet by over 10%. This intensified downturn is driven by renewed investor fears regarding future AI spending and increasing competition from Chinese manufacturers. The market is reacting to concerns about overvaluation and potential headwinds for the high-growth technology sector.", "analysis": "The significant AI sell-off, particularly in chip stocks, signals a potential recalibration of investor expectations for the sector's rapid growth. This market correction could be influenced by broader economic uncertainties, rising interest rates, and geopolitical tensions impacting global supply chains, suggesting a more cautious outlook for tech investments in the near term.", "time": "10:19 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/3ebf0973d09a84c6d75336c7a69877e2a55100ce/420_0_3136_2509/500.jpg", "link": "https://www.theguardian.com/business/live/2026/jul/28/ai-sell-off-chip-stocks-slump-market-south-korea-japan-economy-latest-news"}, {"id": "b2", "lead": false, "kicker": "UK ECONOMY", "headline": "New UK Prime Minister Andy Burnham Proposes 'Public Control' Economic Model", "sub": "Burnham faults Margaret Thatcher's 1980s privatization, advocating for an alternative model, especially for utilities.", "summary": "New UK Prime Minister Andy Burnham is advocating for an alternative economic model based on \"public control,\" departing from the privatization policies of Margaret Thatcher in the 1980s. He specifically targets utilities for this new approach. Critics, however, have labeled his proposals as a return to \"20th-century socialism,\" setting the stage for a significant ideological debate over Britain's economic future.", "analysis": null, "time": "5:02 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/07/24/multimedia/Biz-UK-Nationalization-01-hplv/Biz-UK-Nationalization-01-hplv-superJumbo.jpg", "link": "https://www.nytimes.com/2026/07/28/business/andy-burnham-uk.html"}, {"id": "b3", "lead": false, "kicker": "CRYPTOCURRENCY", "headline": "World's Biggest Crypto Exchange, Binance, Hinders Crime Fighting, Police Say", "sub": "Investigators in Europe report that the cryptocurrency giant has made it more difficult to track scammers and solve other crimes.", "summary": "Binance, the world's largest cryptocurrency exchange, is reportedly making it harder for police to fight crime, according to European investigators. Authorities claim the platform's operations have complicated efforts to track down scammers and solve various other financial crimes. This development raises concerns about regulatory oversight and the role of crypto exchanges in combating illicit activities.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/07/10/multimedia/00inv-binance-01-wgpc/00inv-binance-01-wgpc-superJumbo.jpg", "link": "https://www.nytimes.com/2026/07/28/us/binance-crypto-crime.html"}, {"id": "b4", "lead": false, "kicker": "UK POSTAL SERVICE", "headline": "Royal Mail Raises Bulk User Prices by a Third, Dealing Blow to NHS", "sub": "An average 25% increase for letters, including medical appointment notices, takes effect October 5.", "summary": "Royal Mail is set to increase prices for bulk users by a third, a move expected to significantly impact organizations like the NHS. The average 25% price hike, effective October 5, will apply to letters such as marketing materials, bills, and crucial medical appointment notices. This increase will add financial pressure to public services and businesses reliant on large-volume mail.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/c538159a77f9008d7d355812ee2ebb678021fe0a/72_0_2457_1966/500.jpg", "link": "https://www.theguardian.com/business/2026/jul/28/nhs-royal-mail-price-rises-bulk-users-mail"}]}, {"id": "opinion", "label": "Opinion", "stories": [{"id": "o1", "lead": true, "kicker": "EDITORIAL", "headline": "The Guardian View on Europe’s Wildfires: Politics Must Catch Up With New Reality", "sub": "At a time when the quickening pace of global heating has never been clearer, climate policies are being deprioritised.", "summary": "The Guardian editorial argues that political action on climate change is failing to keep pace with the escalating reality of global heating, as evidenced by the widespread European wildfires. The piece criticizes the deprioritization of climate policies at a time when the impacts are increasingly severe and undeniable. It calls for governments to urgently align their political agendas with the scientific consensus and implement robust measures to address the climate emergency.", "analysis": "This editorial directly links the current European wildfires to a broader failure in political will regarding climate policy, suggesting that short-term economic or political considerations are overshadowing an existential threat. The call for politics to 'catch up' implies a need for fundamental shifts in governance and public discourse to effectively tackle the climate crisis.", "time": "5:30 PM Yesterday", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/b14d9f1c221e92725a8aa96ef6d64e0fdbdfdae8/0_0_6880_5504/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/jul/27/the-guardian-view-on-europes-wildfires-politics-must-catch-up-new-reality"}, {"id": "o2", "lead": false, "kicker": "HONG KONG", "headline": "Britain Promised to Protect Hongkongers, Why Does It Seem Ready to Sacrifice Us?", "sub": "Pro-democracy activist Nathan Law argues that the safety of activists must not be traded for warmer relations with China.", "summary": "Pro-democracy activist Nathan Law questions Britain's commitment to protecting Hongkongers, alleging that activists under threat from Beijing are facing unusual difficulties with UK immigration. Law argues that the safety and well-being of these individuals should not be sacrificed for the sake of improving relations with China. He calls on Britain to uphold its promises and ensure the protection of those fleeing persecution.", "analysis": null, "time": "9:01 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/a1aef521f6bcbf35a38430abf8d3cba535f18191/1014_0_5012_4010/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/jul/28/britain-hong-kong-china-activists-immigration"}, {"id": "o3", "lead": false, "kicker": "FILM CRITICISM", "headline": "Why Has Christopher Nolan Removed All Sex From His Adaptation of The Odyssey?", "sub": "Zoe Williams questions the narrative logic of Odysseus's long journey home without his famed romantic encounters.", "summary": "Zoe Williams critiques Christopher Nolan's adaptation of Homer's The Odyssey, questioning the director's decision to remove all sexual content. Williams suggests that omitting Odysseus's romantic encounters with figures like Calypso creates a narrative mystery, making his prolonged journey home less explicable. The column explores how this creative choice impacts the interpretation of the classic epic.", "analysis": null, "time": "10:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/a02cad01332411e277a1e26daa38a4992b83a756/359_0_2560_2049/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/jul/28/christopher-nolan-sex-the-odyssey"}, {"id": "o4", "lead": false, "kicker": "UK POLITICS", "headline": "Burnham Takes Bold Risk by Busting the 'Big Lie' of Political Impossibility", "sub": "Frances Ryan argues that admitting political choices drive inequality could empower voters to demand change.", "summary": "Guardian columnist Frances Ryan asserts that Andy Burnham, the new Prime Minister, is taking a bold risk by challenging the political \"big lie\" that certain societal issues are inevitable. Ryan argues that unequal capitalist societies thrive on this premise, and by exposing these as political choices, Burnham could empower voters to demand significant change. The column suggests this approach could fundamentally alter public expectations and political discourse.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/174a9ee9f13b1621c1f2ec1d37b92534531cc1be/312_0_5949_4760/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/jul/28/andy-burnham-bold-start-change-prime-minister"}]}]}</script>

  <script>
    (function () {
      var raw = document.getElementById('edition').textContent;
      var data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<div class="notice">No edition loaded. Run the build to generate today’s paper.</div>';
        return;
      }

      var state = { active: (data.sections[0] || {}).id, openId: null };

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Editorial heat flags keep the red chip; procedural flags cool to navy,
      // so a red chip still means something (the Scarce Red Rule).
      function isHotTag(t) {
        return /^(DEVELOPING|BREAKING|LIVE|WAR|ALERT|URGENT)$/i.test(t || '');
      }

      // ---- Ask AI ----------------------------------------------------------
      // The reader taps one story and gets a briefing, not a chat. The prompt
      // does three jobs: hand over the clipping, name the shape of the answer
      // (five parts, ~500 words, hard ceiling), and set up the follow-up so the
      // conversation continues without the reader having to think of a question.
      // Voice constraints mirror src/config.py HOUSE_VOICE, em dash ban included.
      function buildPrompt(st, sectionLabel) {
        var L = [];
        L.push('I read this in my morning paper and I want to understand it properly.');
        L.push('');
        L.push('THE CLIPPING');
        L.push('Headline: ' + st.headline);
        if (st.sub) L.push('Standfirst: ' + st.sub);
        if (st.summary) L.push('Summary: ' + st.summary);
        if (st.analysis) L.push("My paper's why-it-matters note: " + st.analysis);
        L.push('Section: ' + sectionLabel + '. Filed ' + (st.time || 'this morning') +
               ', edition of ' + data.date + '.');
        if (st.link) L.push('Source: ' + st.link);
        L.push('');
        L.push('WHAT I WANT');
        L.push('A briefing that leaves me genuinely informed, not a restatement of what I just');
        L.push('pasted. Assume I know nothing beyond the clipping above.');
        L.push('');
        L.push('Check current reporting first if you are able to search. My clipping is a');
        L.push('summary and may be incomplete or already overtaken by events. If you cannot');
        L.push('search, say so in one line at the top, then separate what you are confident');
        L.push('about from what you would want verified.');
        L.push('');
        L.push('STRUCTURE');
        L.push('I am reading this on a phone. Build the answer in layers, heaviest first, so');
        L.push('I can stop at the end of any layer and still have got something whole. Use');
        L.push('these markdown headings exactly, so they render large on a small screen.');
        L.push('');
        L.push('# The gist');
        L.push('An H1 of six to ten words stating the actual point, not the topic. Then two or');
        L.push('three short sentences giving me the whole story in plain words. If I read');
        L.push('nothing else, this is what I walk away knowing. Correct my clipping here if it');
        L.push('is wrong or out of date.');
        L.push('');
        L.push('## Why it matters');
        L.push('Two or three short sentences on the stakes and the second order effects. Be');
        L.push('concrete about who gains, who pays, how much, and by when.');
        L.push('');
        L.push('## How we got here');
        L.push('Only the background I need to follow this story. Not a history lecture.');
        L.push('');
        L.push('## Where it is contested');
        L.push('The strongest disagreement among serious people, put fairly. If it is genuinely');
        L.push('uncontested, say so in one sentence and move on.');
        L.push('');
        L.push('## What to watch');
        L.push('Three bullets, each a specific checkable marker with a rough timeframe.');
        L.push('');
        L.push('## Ask me next');
        L.push('Three numbered questions, ordered by what would teach me the most. I will reply');
        L.push('with a digit.');
        L.push('');
        L.push('READING ON A PHONE');
        L.push('Short paragraphs: three sentences at most, none longer than about sixty words,');
        L.push('with a blank line between them. No tables, no nested bullets, no wall of text.');
        L.push('Around 500 words in total. Hard ceiling 650. Do not pad to reach a length; the');
        L.push('gist and why it matters are worth more than the sections under them.');
        L.push('');
        L.push('VOICE');
        L.push('Financial Times, not an encyclopedia and not a chatbot. Plain, confident,');
        L.push('concrete. Specifics over abstractions: names, numbers, dates, stakes. Every');
        L.push('sentence earns its place. No preamble, no throat clearing, no restating my');
        L.push('prompt back to me, no hedging filler, no em dashes. Where you are uncertain,');
        L.push('mark it in the sentence it applies to rather than in a disclaimer paragraph.');
        return L.join('\n');
      }

      function findStory(id) {
        for (var i = 0; i < data.sections.length; i++) {
          var list = data.sections[i].stories || [];
          for (var j = 0; j < list.length; j++) {
            if (list[j].id === id) {
              return { story: list[j], label: data.sections[i].label };
            }
          }
        }
        return null;
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        // Older iOS standalone PWAs land here.
        return new Promise(function (resolve, reject) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('copy failed'));
        });
      }

      // Tagline reflects the sections the edition actually shipped, not a
      // hardcoded list that can disagree with the paper.
      function taglineText() {
        var labels = data.sections
          .filter(function (s) { return s.id !== 'front'; })
          .map(function (s) { return s.label; });
        return (labels.length ? labels : ['Toronto', 'World', 'Business']).join(' · ');
      }

      function weatherHtml(w) {
        if (!w || !w.icon) return '';
        var week = (w.week || []).map(function (d) {
          return '<div class="day"><div class="d">' + esc(d.day) + '</div>' +
            '<div class="i">' + esc(d.icon) + '</div>' +
            '<div class="hi">' + esc(d.hi) + '°</div>' +
            '<div class="lo">' + esc(d.lo) + '°</div></div>';
        }).join('');
        return '<div class="weather" id="weather" role="button" tabindex="0" ' +
          'aria-expanded="false" aria-label="Toronto weather, tap for the week">' +
          '<div class="summary">' +
            '<span class="ico">' + esc(w.icon) + '</span>' +
            '<span class="city">Toronto</span>' +
            '<span class="temp">' + esc(w.high) + '° / ' + esc(w.low) + '°</span>' +
            '<span class="muted">' + esc(w.condition) + '</span>' +
            '<span class="muted">Rain ' + esc(w.rain) + '</span>' +
            '<span class="muted">Wind ' + esc(w.wind) + '</span>' +
            '<span class="chev" id="wchev">▼</span>' +
          '</div>' +
          '<div class="week" id="wweek" style="display:none">' + week + '</div>' +
        '</div>';
      }

      function tabsHtml() {
        return '<div class="tabs" role="tablist">' + data.sections.map(function (s) {
          var on = s.id === state.active;
          return '<button class="tab' + (on ? ' active' : '') + '" role="tab" ' +
            'aria-selected="' + on + '" data-tab="' + esc(s.id) + '">' + esc(s.label) + '</button>';
        }).join('') + '</div>';
      }

      function cardHtml(st, sectionLabel) {
        var open = st.id === state.openId;
        var tag = st.tag
          ? '<span class="tag ' + (isHotTag(st.tag) ? 'hot' : 'cool') + '">' + esc(st.tag) + '</span>'
          : '';
        var kicker = st.kicker ? '<div class="kicker">' + tag + esc(st.kicker) + '</div>' : '';
        var sub = st.sub ? '<div class="sub">' + esc(st.sub) + '</div>' : '';
        var expand = '';
        if (open) {
          var img = st.image
            ? '<img src="' + esc(st.image) + '" alt="' + esc(st.headline) + '" ' +
              'loading="lazy" onerror="this.remove()" />'
            : '';
          var analysis = st.analysis
            ? '<div class="analysis"><span class="alabel">Why it matters</span>' + esc(st.analysis) + '</div>'
            : '';
          var link = st.link
            ? '<a class="readmore" href="' + esc(st.link) + '" target="_blank" rel="noopener">Read full story →</a>'
            : '';

          // Prefill the destinations at render time so a long press ("open in
          // app") carries the prompt too, instead of us intercepting the tap.
          var q = encodeURIComponent(buildPrompt(st, sectionLabel));
          // No target="_blank" on these two. In a standalone PWA a blank target
          // opens an in-app browser sheet, which iOS will not hand off to an
          // installed app; a plain top-level tap is what lets the Claude and
          // ChatGPT apps claim their own domains as Universal Links. "Read full
          // story" keeps _blank, because a news site does belong in a tab.
          var share = navigator.share
            ? '<button class="ask-opt" data-ai="share" data-id="' + esc(st.id) + '">Share to app…</button>'
            : '';
          var actions = '<div class="actions">' + link +
            '<button class="askai" data-ask="' + esc(st.id) + '" aria-expanded="false" ' +
              'aria-controls="ask-' + esc(st.id) + '">Ask AI ▾</button></div>' +
            '<div class="ask-panel" id="ask-' + esc(st.id) + '">' +
              '<div class="ask-row">' +
                '<a class="ask-opt" href="https://claude.ai/new?q=' + esc(q) + '">Claude</a>' +
                '<a class="ask-opt" href="https://chatgpt.com/?q=' + esc(q) + '">ChatGPT</a>' +
                share +
                '<button class="ask-opt" data-ai="copy" data-id="' + esc(st.id) + '">Copy</button>' +
              '</div>' +
              '<div class="ask-note">Opens in the app if you have it installed. The reply ' +
                'starts with the gist in a few lines, then goes deeper, then offers three ' +
                'follow-up questions.</div>' +
            '</div>';

          expand = '<div class="expand">' + img +
            '<p class="sumtext">' + esc(st.summary) + '</p>' + analysis + actions + '</div>';
        }
        return '<div class="card' + (st.lead ? ' lead' : '') + (open ? ' open' : '') +
          '" data-card="' + esc(st.id) + '" role="button" tabindex="0" ' +
          'aria-expanded="' + open + '">' +
          '<div class="row"><div class="row-main">' + kicker +
            '<div class="headline">' + esc(st.headline) + '</div>' + sub +
            '<div class="time">' + esc(st.time) + '</div></div>' +
            '<div class="toggle" aria-hidden="true">' + (open ? '−' : '+') + '</div>' +
          '</div>' + expand +
        '</div>';
      }

      function storiesInner() {
        var section = data.sections.filter(function (s) { return s.id === state.active; })[0];
        if (!section) return '';
        if (!section.stories || !section.stories.length) {
          return '<div class="empty">Nothing filed for ' + esc(section.label) + ' this morning.</div>';
        }
        return section.stories.map(function (st) {
          return cardHtml(st, section.label);
        }).join('');
      }

      // Quietly flag a saved (not-today) edition served from cache/offline.
      function staleRibbon() {
        try {
          var meta = document.querySelector('meta[name=build]');
          if (!meta) return '';
          var built = new Date(meta.getAttribute('content'));
          if (isNaN(built.getTime())) return '';
          var opt = { timeZone: 'America/Toronto' };
          if (built.toLocaleDateString('en-CA', opt) < new Date().toLocaleDateString('en-CA', opt)) {
            return '<div class="stale">Saved edition · ' + esc(data.date) + '</div>';
          }
        } catch (e) {}
        return '';
      }

      function appHtml() {
        return '<div class="masthead">' +
            '<div class="date">' + esc(data.date) + '</div>' +
            '<div class="title">THE DAILY</div>' +
            '<div class="tagline">' + esc(taglineText()) + '</div>' +
          '</div>' +
          staleRibbon() +
          weatherHtml(data.weather) +
          tabsHtml() +
          '<div class="stories" id="stories">' + storiesInner() + '</div>' +
          '<div class="footer">THE DAILY · TORONTO · Tap any headline to read</div>';
      }

      var app = document.getElementById('app');

      // Rebuild only the stories column; masthead, weather, and tab strip (and
      // their scroll/open state) are left untouched. This is what keeps a tap
      // from resetting the reader's place.
      function refreshStories() {
        document.getElementById('stories').innerHTML = storiesInner();
        bindCards();
      }

      function selectTab(id) {
        if (id === state.active) return;
        state.active = id;
        state.openId = null;
        var tabs = document.querySelectorAll('.tab');
        Array.prototype.forEach.call(tabs, function (t) {
          var on = t.getAttribute('data-tab') === id;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on);
          if (on) t.scrollIntoView({ inline: 'center', block: 'nearest' });
        });
        refreshStories();
        // Start the new section at the top, tab strip stuck under the notch.
        var tabsEl = document.querySelector('.tabs');
        if (tabsEl) window.scrollTo(0, tabsEl.offsetTop);
      }

      function toggleCard(id) {
        var y = window.scrollY;
        state.openId = state.openId === id ? null : id;
        refreshStories();
        window.scrollTo(0, y);   // grow/collapse in place, never jump
      }

      function bindWeather() {
        var weather = document.getElementById('weather');
        if (!weather) return;
        function toggle() {
          var week = document.getElementById('wweek');
          var chev = document.getElementById('wchev');
          var showing = week.style.display !== 'none';
          week.style.display = showing ? 'none' : 'flex';
          chev.textContent = showing ? '▼' : '▲';
          weather.setAttribute('aria-expanded', String(!showing));
        }
        weather.addEventListener('click', toggle);
        weather.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
        });
      }

      function bindTabs() {
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
          btn.addEventListener('click', function () { selectTab(btn.getAttribute('data-tab')); });
        });
      }

      function bindCards() {
        Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
          function activate(ev) {
            // Let links and the Ask AI controls handle their own activation.
            if (ev.target.closest('a, button')) return;
            // While open, only the header row collapses it, so reading (and
            // selecting) the body never closes the story by accident.
            if (card.classList.contains('open') && !ev.target.closest('.row')) return;
            toggleCard(card.getAttribute('data-card'));
          }
          card.addEventListener('click', activate);
          card.addEventListener('keydown', function (ev) {
            if (ev.key !== 'Enter' && ev.key !== ' ') return;
            // Never swallow the key from a control that acts on it itself.
            if (ev.target.closest('a, button')) return;
            ev.preventDefault();
            activate(ev);
          });
          bindAsk(card);
        });
      }

      // Panel state is held in the DOM, not in `state`, so opening the
      // destinations never triggers a stories rebuild and never moves the page.
      function bindAsk(card) {
        var toggle = card.querySelector('.askai');
        if (!toggle) return;
        var panel = card.querySelector('.ask-panel');

        toggle.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var open = panel.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(open));
          toggle.textContent = open ? 'Ask AI ▴' : 'Ask AI ▾';
        });

        Array.prototype.forEach.call(panel.querySelectorAll('[data-ai]'), function (el) {
          var kind = el.getAttribute('data-ai');
          el.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var found = findStory(el.getAttribute('data-id'));
            if (!found) return;
            var prompt = buildPrompt(found.story, found.label);

            if (kind === 'share') {
              navigator.share({ text: prompt }).catch(function () {});
              return;
            }
            var label = el.textContent;
            copyText(prompt).then(function () {
              el.textContent = 'Copied';
            }).catch(function () {
              el.textContent = 'Copy failed';
            }).then(function () {
              setTimeout(function () { el.textContent = label; }, 1800);
            });
          });
        });
      }

      app.innerHTML = appHtml();
      bindWeather();
      bindTabs();
      bindCards();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
