  <title>The Daily</title>
  <style>
    /* ---- Design tokens: The Morning Broadsheet ------------------------- */
    :root {
      --paper: #faf8f3;        /* the sheet (warm white, never #fff) */
      --desk: #efece6;         /* the desk beyond the column */
      --ink: #17130d;          /* headlines / primary text */
      --ink-sub: #453f38;      /* standfirsts */
      --ink-muted: #635d54;    /* inactive tabs */
      --meta: #6c665c;         /* timestamps, dateline, footer (>=AA small) */
      --rule: #dcd6cc;         /* hairline between cards */
      --rule-soft: #e3ded4;    /* hairline inside an opened card */
      --navy: #1a2744;         /* structural ink */
      --navy-ink: #1a2744;     /* navy used as text (links, active tab) */
      --red: #8b1a1a;          /* editorial heat */
      --tint-open: #f2ede4;    /* ground of an expanded card */
      --tint-analysis: #ece6da;/* ground of the why-it-matters note */
      --strip-bg: #1a2744;     /* weather strip */
      --strip-ink: #f7f4ee;
      --chip-hot: #8b1a1a;     /* DEVELOPING / WAR-class flags */
      --chip-cool: #1a2744;    /* procedural flags (FINAL, EDITORIAL) */
      --chip-ink: #faf8f3;
      --focus: #1a2744;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151a22;      /* lamplight edition: deep navy-black paper */
        --desk: #0e1219;
        --ink: #e9e3d5;        /* cream ink */
        --ink-sub: #bcb6a8;
        --ink-muted: #948e82;
        --meta: #8f897d;
        --rule: #2a303a;
        --rule-soft: #2f3540;
        --navy: #6f82a8;       /* structure lifted so it reads on dark */
        --navy-ink: #a3b3d2;
        --red: #d1726b;        /* desaturated heat */
        --tint-open: #1b212b;
        --tint-analysis: #20262f;
        --strip-bg: #1b2334;
        --strip-ink: #e9e3d5;
        --chip-hot: #a8443c;
        --chip-cool: #3b4a6c;
        --chip-ink: #f0eadc;
        --focus: #a3b3d2;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 100%; }
    html, body { background: var(--desk); }
    body {
      font-family: 'Georgia', serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--paper);
      max-width: 680px;
      margin: 0 auto;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Masthead */
    .masthead {
      border-bottom: 4px solid var(--navy);
      padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
      background: var(--paper);
    }
    .masthead .date {
      font-size: 0.6875rem; color: var(--meta); letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .masthead .title {
      font-size: 2.375rem; font-weight: 700; letter-spacing: -0.01em;
      color: var(--navy); line-height: 1; margin-bottom: 2px;
    }
    .masthead .tagline {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; color: var(--meta);
      letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* Stale-edition ribbon */
    .stale {
      background: var(--tint-analysis); color: var(--meta);
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; text-align: center;
      padding: 7px 20px;
    }

    /* Weather strip */
    .weather {
      background: var(--strip-bg); color: var(--strip-ink);
      cursor: pointer; user-select: none;
    }
    .weather .summary {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
      min-height: 44px;
    }
    .weather .summary::-webkit-scrollbar { display: none; }
    .weather .ico { font-size: 1.375rem; }
    .weather .city { font-weight: 700; font-size: 0.9375rem; }
    .weather .temp { font-size: 0.9375rem; }
    .weather .muted { opacity: 0.72; font-size: 0.8125rem; white-space: nowrap; }
    .weather .chev { margin-left: auto; opacity: 0.6; font-size: 0.75rem; }
    .weather .week {
      display: flex; border-top: 1px solid rgba(255,255,255,0.12);
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
    }
    .weather .week::-webkit-scrollbar { display: none; }
    .weather .day {
      text-align: center; min-width: 52px; padding: 0 8px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .weather .day .d { font-size: 0.6875rem; opacity: 0.6; margin-bottom: 4px; }
    .weather .day .i { font-size: 1.125rem; }
    .weather .day .hi { font-size: 0.8125rem; font-weight: 700; margin-top: 4px; }
    .weather .day .lo { font-size: 0.6875rem; opacity: 0.5; }

    /* Tab nav */
    .tabs {
      display: flex; overflow-x: auto; border-bottom: 2px solid var(--navy);
      background: var(--paper); scrollbar-width: none;
      position: sticky; top: 0; z-index: 10;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; min-height: 44px; display: flex; align-items: center;
      padding: 0 18px; border: none; background: none; cursor: pointer;
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; font-weight: 700;
      color: var(--ink-muted); border-bottom: 3px solid transparent;
      margin-bottom: -2px; letter-spacing: 0.12em; text-transform: uppercase;
      transition: color 0.15s;
    }
    .tab.active { color: var(--navy-ink); border-bottom-color: var(--navy); }

    /* Stories */
    .stories { padding: 8px 20px 40px; }
    .opinion-desk + .opinion-desk { margin-top: 24px; }
    .desk-head {
      border-top: 2px solid var(--navy); padding: 12px 0 8px; margin-top: 2px;
    }
    .desk-title {
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--navy-ink);
    }
    .desk-dek {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.45;
      color: var(--meta); margin-top: 3px;
    }
    .following-block .card { padding-top: 12px; padding-bottom: 12px; }
    .follow-meta {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.45;
      color: var(--meta); margin-top: 5px;
    }
    .opinion-desk .empty { padding: 24px 4px; }
    .empty {
      padding: 40px 4px; text-align: center; color: var(--meta);
      font-style: italic; font-size: 0.9375rem;
    }
    .card {
      border-top: 1px solid var(--rule); padding: 14px 0; cursor: pointer;
      background: var(--paper); transition: background 0.15s;
    }
    .card.lead { border-top: 3px solid var(--navy); padding: 20px 0 16px; }
    .card.open { background: var(--tint-open); }
    .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card .row-main { flex: 1; min-width: 0; }
    .card .kicker {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; color: var(--red); margin-bottom: 6px; text-transform: uppercase;
    }
    .card .tag {
      color: var(--chip-ink); padding: 2px 6px; margin-right: 8px;
      font-size: 0.5625rem; border-radius: 2px; vertical-align: 1px;
    }
    .card .tag.hot { background: var(--chip-hot); }
    .card .tag.cool { background: var(--chip-cool); }
    .card .headline {
      font-size: 1.0625rem; font-weight: 700; line-height: 1.25; color: var(--ink); margin-bottom: 6px;
    }
    .card.lead .headline { font-size: 1.375rem; }
    .card .sub {
      font-size: 0.875rem; color: var(--ink-sub); line-height: 1.4; margin-bottom: 4px; font-style: italic;
    }
    .card .time { font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta); margin-top: 4px; }
    .card .toggle { color: var(--navy-ink); opacity: 0.5; font-size: 1.125rem; flex-shrink: 0; margin-top: 2px; }
    .card .expand {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    }
    .card .expand .sumtext {
      font-size: 0.9375rem; color: var(--ink-sub); line-height: 1.7;
    }
    .card .expand img {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      background: var(--tint-open); border-radius: 3px; margin-bottom: 12px;
    }
    .card .analysis {
      margin-top: 12px; padding: 10px 14px; background: var(--tint-analysis);
      font-size: 0.875rem; line-height: 1.6; color: var(--ink-sub); font-style: italic;
    }
    .card .analysis .alabel {
      display: block; font-family: 'Arial', sans-serif; font-style: normal;
      font-size: 0.625rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--navy-ink); margin-bottom: 4px;
    }
    .card .readmore {
      display: inline-block; margin-top: 12px; min-height: 44px; line-height: 44px;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink); text-decoration: none;
    }
    .card .readmore:hover { text-decoration: underline; }
    .card .readmore:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    /* Ask AI: hand the clipping and a briefing prompt to a model */
    .card .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .askai, .card .ask-opt {
      border: none; background: none; padding: 0; cursor: pointer;
      min-height: 44px; line-height: 44px; text-decoration: none;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink);
    }
    .card .askai { margin-top: 12px; }
    .card .askai:hover, .card .ask-opt:hover { text-decoration: underline; }
    .card .askai:focus-visible, .card .ask-opt:focus-visible {
      outline: 2px solid var(--focus); outline-offset: 3px;
    }
    .card .ask-panel { display: none; border-top: 1px solid var(--rule-soft); margin-top: 4px; }
    .card .ask-panel.open { display: block; }
    .card .ask-row { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .ask-note {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.55;
      color: var(--meta); letter-spacing: 0.02em; padding-bottom: 12px;
    }

    /* Footer */
    .footer {
      border-top: 2px solid var(--navy);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta);
      text-align: center; letter-spacing: 0.06em;
    }
    .notice { padding: 40px 20px; text-align: center; color: var(--meta); font-style: italic; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>

onse After Hungary Expels 10 Diplomats", "sub": "Moscow warns of retaliation against 'Russophobic lobby' in Budapest following expulsions for 'unacceptable' activities.", "summary": "Russia has threatened a 'harsh and painful' response after Hungary expelled 10 Russian diplomats for engaging in 'unacceptable' activities. Moscow's foreign minister issued a strong warning to what he termed the 'Russophobic lobby in Budapest,' indicating a significant deterioration in diplomatic relations between the two nations. The expulsions mark a notable escalation in tensions within Europe.", "analysis": "This diplomatic spat underscores the ongoing geopolitical friction between Russia and parts of Europe, even among countries like Hungary that have historically maintained closer ties with Moscow. The 'harsh and painful' response could manifest in reciprocal expulsions, economic measures, or other forms of diplomatic pressure, further fragmenting European unity on Russia policy.", "time": "12:47 PM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/038af15df82ab51d97dfb4ac7ef9022e491f76b1/1204_127_2689_2152/500.jpg", "link": "https://www.theguardian.com/world/live/2026/sep/08/ukraine-russia-war-zelesnkyy-putin-ruslan-kravchenko-prosecutor-general-germany-france-europe-latest-news-updates"}, {"id": "w2", "lead": false, "kicker": "MIGRATION", "headline": "Fourteen Men on Trial in Paris Over Deadly Channel Crossing", "sub": "Sinking of inflatable dinghy in 2021 resulted in 31 people dead or missing, including a child.", "summary": "Fourteen men are currently on trial in Paris in connection with the deadliest small-boat Channel crossing incident, which occurred in 2021. The sinking of an inflatable dinghy resulted in 31 people dead or missing, including a seven-year-old child. The trial aims to address the responsibilities behind the tragic loss of life.", "analysis": null, "time": "11:02 AM", "tag": "COURT", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/2026/sep/08/paris-trial-deadliest-channel-small-boat-crossing"}, {"id": "w3", "lead": false, "kicker": "MARITIME SECURITY", "headline": "Pirates Exploit Regional Chaos to Return to Somali Seas", "sub": "US-Israel war against Iran and instability in Somalia linked to resurgence of cargo ship hijackings.", "summary": "Pirates are exploiting regional chaos, including the US-Israel war against Iran and political instability in Somalia, to resume targeting cargo ships off the Horn of Africa. This resurgence of hijacking activities poses a significant threat to international shipping lanes. The complex geopolitical environment has created a permissive operational space for these criminal groups.", "analysis": null, "time": "8:00 AM", "tag": "WAR", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/2026/sep/08/hijacking-pirates-somalia-geopolitical-chaos"}, {"id": "w4", "lead": false, "kicker": "TOURISM", "headline": "Tokyo Tourist Hotspot Bans Short-Term Rentals Amid Complaints", "sub": "Shinjuku ward targets residential and cultural areas as locals cite noise and improper rubbish disposal.", "summary": "Shinjuku ward, a popular tourist hotspot in Tokyo, has banned short-term rentals in residential areas and near cultural sites. The decision comes amid a surge in complaints from local residents regarding visitors disposing of rubbish improperly and excessive noise. This move aims to address the negative impacts of over-tourism on community life.", "analysis": null, "time": "7:43 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/f4e2c4e9c7a0abdbbcdd9da0a11ed42ed9929853/47_0_3559_2847/500.jpg", "link": "https://www.theguardian.com/world/2026/sep/08/shinjuku-tokyo-tourism-hotspot-bans-short-term-rentals-airbnb-surge-in-complaints"}]}, {"id": "sports", "label": "Sports", "stories": [{"id": "s1", "lead": true, "kicker": "TENNIS", "headline": "Coco Gauff Dominates Jovic to Reach US Open Quarter-Finals", "sub": "The 2023 champion delivers her most complete performance yet, setting up a clash with Mirra Andreeva.", "summary": "Coco Gauff, the reigning 2023 US Open champion, delivered her most complete performance of the tournament, dismantling fellow American Iva Jovic with a decisive 6-1, 6-4 victory. This confident win propels Gauff into the quarter-finals, where she is set to face Mirra Andreeva. Her strong form positions her as a formidable contender as the tournament progresses.", "analysis": "Gauff's dominant performance signals her intent to defend her title, showcasing a level of play that will challenge any opponent. Her upcoming match against Andreeva will be a key test, potentially setting the tone for the latter stages of the women's singles draw and captivating tennis fans globally.", "time": "4:00 AM", "tag": "FINAL", "sensitivity": false, "image": "https://media.guim.co.uk/914d358a8b3b161d395190fdedf62b392f8ea350/396_0_4295_3438/500.jpg", "link": "https://www.theguardian.com/sport/2026/sep/08/coco-gauff-iva-jovic-us-open-quarter-finals-mirra-andreeva"}, {"id": "s2", "lead": false, "kicker": "WNBA", "headline": "WNBA Stars Caitlin Clark and Sophie Cunningham Face Stalking Dangers", "sub": "League's surging popularity brings increased fan interaction but also heightened risks for players.", "summary": "WNBA stars Caitlin Clark and Sophie Cunningham have been targeted by stalkers, highlighting a growing concern within the league. While players generally welcome fan interaction, the WNBA's surging popularity has brought increased dangers. The incidents underscore the need for enhanced security measures to protect athletes as the league's profile continues to rise.", "analysis": null, "time": "9:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/e80aa5cec66e41f1715adfe7b8612024c303eace/2_100_2253_1802/500.jpg", "link": "https://www.theguardian.com/sport/2026/sep/08/wnba-stalkers-basketball"}, {"id": "s3", "lead": false, "kicker": "RUGBY", "headline": "Smaller Ball Trial in WXV Draws 'Mixed Bag of Emotions'", "sub": "Controversial trial in women's rugby sparks heated debate, with some players calling it the 'worst decision ever'.", "summary": "A trial of a smaller ball in the WXV women's rugby competition has generated a 'mixed bag of emotions' and heated debate among players. England's Zoe Harrison notably called it the 'worst decision ever,' while others remain more open to the change. The trial is testing potential adjustments to the sport's equipment.", "analysis": null, "time": "9:24 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/9db6a290afe90a45c2aa94f52b435a8d26ed6e44/275_70_2786_2229/500.jpg", "link": "https://www.theguardian.com/sport/2026/sep/08/how-the-smaller-ball-trial-in-wxv-has-brought-mixed-bag-of-emotions"}, {"id": "s4", "lead": false, "kicker": "AFL", "headline": "AFL Boss Demands Zero Tolerance for Player Misconduct", "sub": "AFL Commission chair states players must uphold high standards or face removal from the game.", "summary": "The AFL Commission chair has declared a zero-tolerance policy for players' poor behavior, emphasizing that athletes must adhere to the competition's high standards or risk losing their place in the game. This stern warning follows a recent Swans scandal, underscoring the league's commitment to maintaining integrity and respect. The directive aims to reinforce accountability across all teams.", "analysis": null, "time": "4:28 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/ed47fe7d3507b39cad6a75cbba2674276c5649c7/679_0_4407_3526/500.jpg", "link": "https://www.theguardian.com/sport/2026/sep/08/afl-boss-craig-drummond-zero-tolerance-on-players-poor-behaviour-swans-scandal-ntwnfb"}]}, {"id": "business", "label": "Business", "stories": [{"id": "b1", "lead": true, "kicker": "AUTOMOTIVE", "headline": "Jaguar Land Rover Confirms 4,000 Job Cuts Over Two Years", "sub": "Carmaker battles Trump tariffs and cyber-attack fallout, with a £500,000 package to aid affected workers.", "summary": "Jaguar Land Rover has confirmed plans to cut 4,000 jobs over the next two years, a decision labeled a 'body blow for workers.' The carmaker is grappling with the impact of US President Trump's tariffs and the fallout from a recent cyber-attack, which have severely affected its operations. A £500,000 package has been announced to support employees facing redundancy, though some argue the company does not warrant public money for assistance.", "analysis": "The job cuts at Jaguar Land Rover highlight the significant challenges facing the automotive industry, from geopolitical trade tensions to cybersecurity threats. This move could signal broader economic headwinds for manufacturers reliant on international markets, prompting calls for government support while also sparking debate on the appropriate role of public funds in corporate restructuring.", "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/6912c7af4a42678444df822e6f35395f7da4e8e7/327_0_3273_2620/500.jpg", "link": "https://www.theguardian.com/business/2026/sep/07/jaguar-land-rover-job-trump-tariffs"}, {"id": "b2", "lead": false, "kicker": "TECHNOLOGY", "headline": "AI to Cure Cancer 'Within Our Lifetimes,' Says Arm Holdings Chief", "sub": "Rene Haas also predicts widespread use of humanoid robots within five years, driven by artificial intelligence.", "summary": "Rene Haas, chief of Arm Holdings, has boldly predicted that artificial intelligence will lead to a cure for cancer 'within our lifetimes.' Haas also claimed that AI advancements could pave the way for widespread use of humanoid robots within the next five years. These optimistic forecasts underscore the transformative potential seen in AI technology across various sectors.", "analysis": null, "time": "11:49 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/35fda37d88f97320b4f215c7d6d925bde94ad822/0_50_4290_3434/500.jpg", "link": "https://www.theguardian.com/business/2026/sep/08/ai-cure-cancer-arm-holdings-rene-haas"}, {"id": "b3", "lead": false, "kicker": "DEFENSE INDUSTRY", "headline": "Europe's Fighter Jet Plans in Disarray Amid Joint Venture Failures", "sub": "UK and Italy make progress, but France and Germany's joint venture collapses, hindering continental defense.", "summary": "Europe's fighter jet development plans are in disarray, with the joint venture between France and Germany having collapsed. While the UK and Italy are making progress on their own projects, the broader prospect of continental collaboration appears distant. This fragmentation raises concerns about Europe's future defense capabilities and industrial competitiveness.", "analysis": null, "time": "4:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/62cb866a5632640eb2c58bd7b1a5c49c393705dd/348_0_4997_4000/500.jpg", "link": "https://www.theguardian.com/business/2026/sep/08/europe-fighter-jet-plans-france-germany"}, {"id": "b4", "lead": false, "kicker": "RETAIL", "headline": "Next Overturns Equal Pay Ruling for Shop Staff", "sub": "Retailer wins appeal against 2024 decision to pay shop workers the same as warehouse employees.", "summary": "Retail giant Next has successfully overturned a 2024 equal pay ruling that mandated it pay shop workers the same wages as warehouse employees. The company won its appeal, reversing the decision that aimed to equalize basic pay across different roles. This outcome has implications for pay equity discussions within the retail sector.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/870a9718f6f20f526c2a68c4b17bda629cc41a03/828_330_3853_3085/500.jpg", "link": "https://www.theguardian.com/business/2026/sep/07/next-overturns-equal-pay-ruling-that-raised-basic-wages-for-shop-staff"}]}, {"id": "opinion", "label": "Opinion", "stories": [{"id": "o1", "lead": true, "kicker": "US POLITICS", "headline": "Donald Trump's Midterm Strategy: Make It All About Him", "sub": "Robert Reich argues the former president prioritizes self-admiration over Republican electoral success.", "summary": "Robert Reich contends that former President Donald Trump's strategy for the upcoming midterm elections is to make the campaign entirely about himself, even if it does not align with Republican Party interests. Reich suggests Trump prioritizes his own image and admiration above the broader electoral success of his party. This approach, he argues, could prove detrimental to Republican candidates seeking to gain ground.", "analysis": "Trump's self-centered midterm strategy could deepen divisions within the Republican Party, forcing candidates to align with his personal brand rather than focusing on local issues. This dynamic might alienate moderate voters and hinder the party's ability to present a unified front, potentially impacting election outcomes across the country.", "time": "11:00 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/2d4e53881b4cdc1a98a92a1a1ae310b6426c5495/377_0_1923_1538/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/sep/08/trump-midterm-strategy"}, {"id": "o2", "lead": false, "kicker": "UK POLITICS", "headline": "The Far Right's Real Weapon: The Politics of Powerlessness", "sub": "Editorial argues extremists thrive when voters feel established parties fail to deliver security or change.", "summary": "A Guardian editorial asserts that the far right's true strength lies in exploiting the politics of powerlessness. It argues that extremists, from Dover to Saxony-Anhalt, thrive when voters believe established political parties are no longer capable of delivering security, prosperity, or meaningful change. This sentiment allows radical ideologies to gain traction among disillusioned populations.", "analysis": null, "time": "Yesterday", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/3dc2708bab8c28b14e66f206a88eccfeac7d2658/369_0_1559_1248/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/sep/07/the-guardian-view-on-the-far-rights-real-weapon-it-is-the-politics-of-powerlessness"}, {"id": "o3", "lead": false, "kicker": "SOCIAL COMMENTARY", "headline": "Why Aren't Democrats Listening to Voters?", "sub": "The party's brand remains unpopular and gripped by an identity crisis, despite a catastrophic election.", "summary": "Despite a catastrophic election less than two years ago, the Democratic brand remains unpopular, and the party is still grappling with a divisive identity crisis. The author questions why Democrats appear to be failing to heed the clear messages from voters. This ongoing disconnect suggests a fundamental challenge in addressing public concerns and regaining trust.", "analysis": null, "time": "5:05 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://static01.nyt.com/images/2026/09/08/opinion/08rhodes-image/08rhodes-image-superJumbo.jpg", "link": "https://www.nytimes.com/2026/09/08/opinion/democrats-midterms.html"}, {"id": "o4", "lead": false, "kicker": "PUBLIC HEALTH", "headline": "Fear the Heat of the Sun: A Call for Skin Cancer Awareness", "sub": "Editorial urges UK to learn from other public health campaigns as melanoma cases continue to rise.", "summary": "A Guardian editorial emphasizes the critical need to 'fear the heat of the sun' as melanoma cases continue to rise. It urges the UK to adopt lessons from successful public health campaigns in other countries to combat skin cancer effectively. The piece highlights the importance of increased awareness and preventative measures to address this growing health concern.", "analysis": null, "time": "Yesterday", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/634c65a429c7e48507b8dc107414be8d33546dc1/667_0_3499_2800/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/sep/07/the-guardian-view-on-skin-cancer-fear-the-heat-of-the-sun"}]}]}</script>

  <script>
    (function () {
      var raw = document.getElementById('edition').textContent;
      var data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<div class="notice">No edition loaded. Run the build to generate today’s paper.</div>';
        return;
      }

      var state = { active: (data.sections[0] || {}).id, openId: null };

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Editorial heat flags keep the red chip; procedural flags cool to navy,
      // so a red chip still means something (the Scarce Red Rule).
      function isHotTag(t) {
        return /^(DEVELOPING|BREAKING|LIVE|WAR|ALERT|URGENT)$/i.test(t || '');
      }

      // ---- Ask AI ----------------------------------------------------------
      // The reader taps one story and gets a briefing, not a chat. The prompt
      // does three jobs: hand over the clipping, name the shape of the answer
      // (five parts, ~500 words, hard ceiling), and set up the follow-up so the
      // conversation continues without the reader having to think of a question.
      // Voice constraints mirror src/config.py HOUSE_VOICE, em dash ban included.
      function buildPrompt(st, sectionLabel) {
        var L = [];
        L.push('I read this in my morning paper and I want to understand it properly.');
        L.push('');
        L.push('THE CLIPPING');
        L.push('Headline: ' + st.headline);
        if (st.author) L.push('Author: ' + st.author);
        if (st.publication) L.push('Publication: ' + st.publication);
        if (st.sub) L.push('Standfirst: ' + st.sub);
        if (st.summary) L.push('Summary: ' + st.summary);
        if (st.analysis) L.push("My paper's why-it-matters note: " + st.analysis);
        L.push('Section: ' + sectionLabel + '. Filed ' + (st.time || 'this morning') +
               ', edition of ' + data.date + '.');
        if (st.link) L.push('Source: ' + st.link);
        L.push('');
        L.push('WHAT I WANT');
        L.push('A briefing that leaves me genuinely informed, not a restatement of what I just');
        L.push('pasted. Assume I know nothing beyond the clipping above.');
        L.push('');
        L.push('Check current reporting first if you are able to search. My clipping is a');
        L.push('summary and may be incomplete or already overtaken by events. If you cannot');
        L.push('search, say so in one line at the top, then separate what you are confident');
        L.push('about from what you would want verified.');
        L.push('');
        L.push('STRUCTURE');
        L.push('I am reading this on a phone. Build the answer in layers, heaviest first, so');
        L.push('I can stop at the end of any layer and still have got something whole. Use');
        L.push('these markdown headings exactly, so they render large on a small screen.');
        L.push('');
        L.push('# The gist');
        L.push('An H1 of six to ten words stating the actual point, not the topic. Then two or');
        L.push('three short sentences giving me the whole story in plain words. If I read');
        L.push('nothing else, this is what I walk away knowing. Correct my clipping here if it');
        L.push('is wrong or out of date.');
        L.push('');
        L.push('## Why it matters');
        L.push('Two or three short sentences on the stakes and the second order effects. Be');
        L.push('concrete about who gains, who pays, how much, and by when.');
        L.push('');
        L.push('## How we got here');
        L.push('Only the background I need to follow this story. Not a history lecture.');
        L.push('');
        L.push('## Where it is contested');
        L.push('The strongest disagreement among serious people, put fairly. If it is genuinely');
        L.push('uncontested, say so in one sentence and move on.');
        L.push('');
        L.push('## What to watch');
        L.push('Three bullets, each a specific checkable marker with a rough timeframe.');
        L.push('');
        L.push('## Ask me next');
        L.push('Three numbered questions, ordered by what would teach me the most. I will reply');
        L.push('with a digit.');
        L.push('');
        L.push('READING ON A PHONE');
        L.push('Short paragraphs: three sentences at most, none longer than about sixty words,');
        L.push('with a blank line between them. No tables, no nested bullets, no wall of text.');
        L.push('Around 500 words in total. Hard ceiling 650. Do not pad to reach a length; the');
        L.push('gist and why it matters are worth more than the sections under them.');
        L.push('');
        L.push('VOICE');
        L.push('Financial Times, not an encyclopedia and not a chatbot. Plain, confident,');
        L.push('concrete. Specifics over abstractions: names, numbers, dates, stakes. Every');
        L.push('sentence earns its place. No preamble, no throat clearing, no restating my');
        L.push('prompt back to me, no hedging filler, no em dashes. Where you are uncertain,');
        L.push('mark it in the sentence it applies to rather than in a disclaimer paragraph.');
        return L.join('\n');
      }

      function findStory(id) {
        var followed = data.following || [];
        for (var f = 0; f < followed.length; f++) {
          if (followed[f].id === id) {
            return { story: followed[f], label: 'Opinion · Following' };
          }
        }
        for (var i = 0; i < data.sections.length; i++) {
          var list = data.sections[i].stories || [];
          for (var j = 0; j < list.length; j++) {
            if (list[j].id === id) {
              return { story: list[j], label: data.sections[i].label };
            }
          }
        }
        return null;
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        // Older iOS standalone PWAs land here.
        return new Promise(function (resolve, reject) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('copy failed'));
        });
      }

      // Tagline reflects the sections the edition actually shipped, not a
      // hardcoded list that can disagree with the paper.
      function taglineText() {
        var labels = data.sections
          .filter(function (s) { return s.id !== 'front'; })
          .map(function (s) { return s.label; });
        return (labels.length ? labels : ['Toronto', 'World', 'Business']).join(' · ');
      }

      function weatherHtml(w) {
        if (!w || !w.icon) return '';
        var week = (w.week || []).map(function (d) {
          return '<div class="day"><div class="d">' + esc(d.day) + '</div>' +
            '<div class="i">' + esc(d.icon) + '</div>' +
            '<div class="hi">' + esc(d.hi) + '°</div>' +
            '<div class="lo">' + esc(d.lo) + '°</div></div>';
        }).join('');
        return '<div class="weather" id="weather" role="button" tabindex="0" ' +
          'aria-expanded="false" aria-label="Toronto weather, tap for the week">' +
          '<div class="summary">' +
            '<span class="ico">' + esc(w.icon) + '</span>' +
            '<span class="city">Toronto</span>' +
            '<span class="temp">' + esc(w.high) + '° / ' + esc(w.low) + '°</span>' +
            '<span class="muted">' + esc(w.condition) + '</span>' +
            '<span class="muted">Rain ' + esc(w.rain) + '</span>' +
            '<span class="muted">Wind ' + esc(w.wind) + '</span>' +
            '<span class="chev" id="wchev">▼</span>' +
          '</div>' +
          '<div class="week" id="wweek" style="display:none">' + week + '</div>' +
        '</div>';
      }

      function tabsHtml() {
        return '<div class="tabs" role="tablist">' + data.sections.map(function (s) {
          var on = s.id === state.active;
          return '<button class="tab' + (on ? ' active' : '') + '" role="tab" ' +
            'aria-selected="' + on + '" data-tab="' + esc(s.id) + '">' + esc(s.label) + '</button>';
        }).join('') + '</div>';
      }

      function cardHtml(st, sectionLabel) {
        var open = st.id === state.openId;
        var tag = st.tag
          ? '<span class="tag ' + (isHotTag(st.tag) ? 'hot' : 'cool') + '">' + esc(st.tag) + '</span>'
          : '';
        var kicker = st.kicker ? '<div class="kicker">' + tag + esc(st.kicker) + '</div>' : '';
        var sub = st.sub ? '<div class="sub">' + esc(st.sub) + '</div>' : '';
        var followMeta = '';
        var filed = '<div class="time">' + esc(st.time) + '</div>';
        if (st.following) {
          var metaParts = [st.author, st.publication, st.time].filter(function (part) { return !!part; });
          followMeta = metaParts.length
            ? '<div class="follow-meta">' + metaParts.map(esc).join(' · ') + '</div>'
            : '';
          filed = '';
        }
        var expand = '';
        if (open) {
          var img = st.image
            ? '<img src="' + esc(st.image) + '" alt="' + esc(st.headline) + '" ' +
              'loading="lazy" onerror="this.remove()" />'
            : '';
          var analysis = st.analysis
            ? '<div class="analysis"><span class="alabel">Why it matters</span>' + esc(st.analysis) + '</div>'
            : '';
          var link = st.link
            ? '<a class="readmore" href="' + esc(st.link) + '" target="_blank" rel="noopener">Read full story →</a>'
            : '';

          // Prefill the destinations at render time so a long press ("open in
          // app") carries the prompt too, instead of us intercepting the tap.
          var q = encodeURIComponent(buildPrompt(st, sectionLabel));
          // No target="_blank" on these two. In a standalone PWA a blank target
          // opens an in-app browser sheet, which iOS will not hand off to an
          // installed app; a plain top-level tap is what lets the Claude and
          // ChatGPT apps claim their own domains as Universal Links. "Read full
          // story" keeps _blank, because a news site does belong in a tab.
          var share = navigator.share
            ? '<button class="ask-opt" data-ai="share" data-id="' + esc(st.id) + '">Share to app…</button>'
            : '';
          var actions = '<div class="actions">' + link +
            '<button class="askai" data-ask="' + esc(st.id) + '" aria-expanded="false" ' +
              'aria-controls="ask-' + esc(st.id) + '">Ask AI ▾</button></div>' +
            '<div class="ask-panel" id="ask-' + esc(st.id) + '">' +
              '<div class="ask-row">' +
                '<a class="ask-opt" href="https://claude.ai/new?q=' + esc(q) + '">Claude</a>' +
                '<a class="ask-opt" href="https://chatgpt.com/?q=' + esc(q) + '">ChatGPT</a>' +
                share +
                '<button class="ask-opt" data-ai="copy" data-id="' + esc(st.id) + '">Copy</button>' +
              '</div>' +
              '<div class="ask-note">Opens in the app if you have it installed. The reply ' +
                'starts with the gist in a few lines, then goes deeper, then offers three ' +
                'follow-up questions.</div>' +
            '</div>';

          expand = '<div class="expand">' + img +
            '<p class="sumtext">' + esc(st.summary) + '</p>' + analysis + actions + '</div>';
        }
        return '<div class="card' + (st.lead ? ' lead' : '') + (open ? ' open' : '') +
          '" data-card="' + esc(st.id) + '" role="button" tabindex="0" ' +
          'aria-expanded="' + open + '">' +
          '<div class="row"><div class="row-main">' + kicker +
            '<div class="headline">' + esc(st.headline) + '</div>' + sub + followMeta + filed +
            '</div><div class="toggle" aria-hidden="true">' + (open ? '−' : '+') + '</div>' +
          '</div>' + expand +
        '</div>';
      }

      function storiesInner() {
        var section = data.sections.filter(function (s) { return s.id === state.active; })[0];
        if (!section) return '';

        var sectionStories = section.stories || [];
        var following = data.following || [];
        if (section.id === 'opinion' && following.length) {
          var followedHtml = following.map(function (st) {
            return cardHtml(st, 'Opinion · Following');
          }).join('');
          var ordinaryHtml = sectionStories.length
            ? sectionStories.map(function (st) { return cardHtml(st, section.label); }).join('')
            : '<div class="empty">Nothing else filed for Opinion this morning.</div>';
          return '<section class="opinion-desk following-block" aria-labelledby="following-title">' +
              '<div class="desk-head"><h2 class="desk-title" id="following-title">Following</h2>' +
                '<div class="desk-dek">New writing from voices you follow</div></div>' +
              followedHtml +
            '</section>' +
            '<section class="opinion-desk today-opinion" aria-labelledby="today-opinion-title">' +
              '<div class="desk-head"><h2 class="desk-title" id="today-opinion-title">Today’s Opinion</h2>' +
                '<div class="desk-dek">Selected independently by the morning desk</div></div>' +
              ordinaryHtml +
            '</section>';
        }

        if (!sectionStories.length) {
          return '<div class="empty">Nothing filed for ' + esc(section.label) + ' this morning.</div>';
        }
        return sectionStories.map(function (st) {
          return cardHtml(st, section.label);
        }).join('');
      }

      // Quietly flag a saved (not-today) edition served from cache/offline.
      function staleRibbon() {
        try {
          var meta = document.querySelector('meta[name=build]');
          if (!meta) return '';
          var built = new Date(meta.getAttribute('content'));
          if (isNaN(built.getTime())) return '';
          var opt = { timeZone: 'America/Toronto' };
          if (built.toLocaleDateString('en-CA', opt) < new Date().toLocaleDateString('en-CA', opt)) {
            return '<div class="stale">Saved edition · ' + esc(data.date) + '</div>';
          }
        } catch (e) {}
        return '';
      }

      function appHtml() {
        return '<div class="masthead">' +
            '<div class="date">' + esc(data.date) + '</div>' +
            '<div class="title">THE DAILY</div>' +
            '<div class="tagline">' + esc(taglineText()) + '</div>' +
          '</div>' +
          staleRibbon() +
          weatherHtml(data.weather) +
          tabsHtml() +
          '<div class="stories" id="stories">' + storiesInner() + '</div>' +
          '<div class="footer">THE DAILY · TORONTO · Tap any headline to read</div>';
      }

      var app = document.getElementById('app');

      // Rebuild only the stories column; masthead, weather, and tab strip (and
      // their scroll/open state) are left untouched. This is what keeps a tap
      // from resetting the reader's place.
      function refreshStories() {
        document.getElementById('stories').innerHTML = storiesInner();
        bindCards();
      }

      function selectTab(id) {
        if (id === state.active) return;
        state.active = id;
        state.openId = null;
        var tabs = document.querySelectorAll('.tab');
        Array.prototype.forEach.call(tabs, function (t) {
          var on = t.getAttribute('data-tab') === id;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on);
          if (on) t.scrollIntoView({ inline: 'center', block: 'nearest' });
        });
        refreshStories();
        // Start the new section at the top, tab strip stuck under the notch.
        var tabsEl = document.querySelector('.tabs');
        if (tabsEl) window.scrollTo(0, tabsEl.offsetTop);
      }

      function toggleCard(id) {
        var y = window.scrollY;
        state.openId = state.openId === id ? null : id;
        refreshStories();
        window.scrollTo(0, y);   // grow/collapse in place, never jump
      }

      function bindWeather() {
        var weather = document.getElementById('weather');
        if (!weather) return;
        function toggle() {
          var week = document.getElementById('wweek');
          var chev = document.getElementById('wchev');
          var showing = week.style.display !== 'none';
          week.style.display = showing ? 'none' : 'flex';
          chev.textContent = showing ? '▼' : '▲';
          weather.setAttribute('aria-expanded', String(!showing));
        }
        weather.addEventListener('click', toggle);
        weather.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
        });
      }

      function bindTabs() {
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
          btn.addEventListener('click', function () { selectTab(btn.getAttribute('data-tab')); });
        });
      }

      function bindCards() {
        Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
          function activate(ev) {
            // Let links and the Ask AI controls handle their own activation.
            if (ev.target.closest('a, button')) return;
            // While open, only the header row collapses it, so reading (and
            // selecting) the body never closes the story by accident.
            if (card.classList.contains('open') && !ev.target.closest('.row')) return;
            toggleCard(card.getAttribute('data-card'));
          }
          card.addEventListener('click', activate);
          card.addEventListener('keydown', function (ev) {
            if (ev.key !== 'Enter' && ev.key !== ' ') return;
            // Never swallow the key from a control that acts on it itself.
            if (ev.target.closest('a, button')) return;
            ev.preventDefault();
            activate(ev);
          });
          bindAsk(card);
        });
      }

      // Panel state is held in the DOM, not in `state`, so opening the
      // destinations never triggers a stories rebuild and never moves the page.
      function bindAsk(card) {
        var toggle = card.querySelector('.askai');
        if (!toggle) return;
        var panel = card.querySelector('.ask-panel');

        toggle.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var open = panel.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(open));
          toggle.textContent = open ? 'Ask AI ▴' : 'Ask AI ▾';
        });

        Array.prototype.forEach.call(panel.querySelectorAll('[data-ai]'), function (el) {
          var kind = el.getAttribute('data-ai');
          el.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var found = findStory(el.getAttribute('data-id'));
            if (!found) return;
            var prompt = buildPrompt(found.story, found.label);

            if (kind === 'share') {
              navigator.share({ text: prompt }).catch(function () {});
              return;
            }
            var label = el.textContent;
            copyText(prompt).then(function () {
              el.textContent = 'Copied';
            }).catch(function () {
              el.textContent = 'Copy failed';
            }).then(function () {
              setTimeout(function () { el.textContent = label; }, 1800);
            });
          });
        });
      }

      app.innerHTML = appHtml();
      bindWeather();
      bindTabs();
      bindCards();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
