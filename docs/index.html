  <title>The Daily</title>
  <style>
    /* ---- Design tokens: The Morning Broadsheet ------------------------- */
    :root {
      --paper: #faf8f3;        /* the sheet (warm white, never #fff) */
      --desk: #efece6;         /* the desk beyond the column */
      --ink: #17130d;          /* headlines / primary text */
      --ink-sub: #453f38;      /* standfirsts */
      --ink-muted: #635d54;    /* inactive tabs */
      --meta: #6c665c;         /* timestamps, dateline, footer (>=AA small) */
      --rule: #dcd6cc;         /* hairline between cards */
      --rule-soft: #e3ded4;    /* hairline inside an opened card */
      --navy: #1a2744;         /* structural ink */
      --navy-ink: #1a2744;     /* navy used as text (links, active tab) */
      --red: #8b1a1a;          /* editorial heat */
      --tint-open: #f2ede4;    /* ground of an expanded card */
      --tint-analysis: #ece6da;/* ground of the why-it-matters note */
      --strip-bg: #1a2744;     /* weather strip */
      --strip-ink: #f7f4ee;
      --chip-hot: #8b1a1a;     /* DEVELOPING / WAR-class flags */
      --chip-cool: #1a2744;    /* procedural flags (FINAL, EDITORIAL) */
      --chip-ink: #faf8f3;
      --focus: #1a2744;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151a22;      /* lamplight edition: deep navy-black paper */
        --desk: #0e1219;
        --ink: #e9e3d5;        /* cream ink */
        --ink-sub: #bcb6a8;
        --ink-muted: #948e82;
        --meta: #8f897d;
        --rule: #2a303a;
        --rule-soft: #2f3540;
        --navy: #6f82a8;       /* structure lifted so it reads on dark */
        --navy-ink: #a3b3d2;
        --red: #d1726b;        /* desaturated heat */
        --tint-open: #1b212b;
        --tint-analysis: #20262f;
        --strip-bg: #1b2334;
        --strip-ink: #e9e3d5;
        --chip-hot: #a8443c;
        --chip-cool: #3b4a6c;
        --chip-ink: #f0eadc;
        --focus: #a3b3d2;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 100%; }
    html, body { background: var(--desk); }
    body {
      font-family: 'Georgia', serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--paper);
      max-width: 680px;
      margin: 0 auto;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Masthead */
    .masthead {
      border-bottom: 4px solid var(--navy);
      padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
      background: var(--paper);
    }
    .masthead .date {
      font-size: 0.6875rem; color: var(--meta); letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .masthead .title {
      font-size: 2.375rem; font-weight: 700; letter-spacing: -0.01em;
      color: var(--navy); line-height: 1; margin-bottom: 2px;
    }
    .masthead .tagline {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; color: var(--meta);
      letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* Stale-edition ribbon */
    .stale {
      background: var(--tint-analysis); color: var(--meta);
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; text-align: center;
      padding: 7px 20px;
    }

    /* Weather strip */
    .weather {
      background: var(--strip-bg); color: var(--strip-ink);
      cursor: pointer; user-select: none;
    }
    .weather .summary {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
      min-height: 44px;
    }
    .weather .summary::-webkit-scrollbar { display: none; }
    .weather .ico { font-size: 1.375rem; }
    .weather .city { font-weight: 700; font-size: 0.9375rem; }
    .weather .temp { font-size: 0.9375rem; }
    .weather .muted { opacity: 0.72; font-size: 0.8125rem; white-space: nowrap; }
    .weather .chev { margin-left: auto; opacity: 0.6; font-size: 0.75rem; }
    .weather .week {
      display: flex; border-top: 1px solid rgba(255,255,255,0.12);
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
    }
    .weather .week::-webkit-scrollbar { display: none; }
    .weather .day {
      text-align: center; min-width: 52px; padding: 0 8px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .weather .day .d { font-size: 0.6875rem; opacity: 0.6; margin-bottom: 4px; }
    .weather .day .i { font-size: 1.125rem; }
    .weather .day .hi { font-size: 0.8125rem; font-weight: 700; margin-top: 4px; }
    .weather .day .lo { font-size: 0.6875rem; opacity: 0.5; }

    /* Tab nav */
    .tabs {
      display: flex; overflow-x: auto; border-bottom: 2px solid var(--navy);
      background: var(--paper); scrollbar-width: none;
      position: sticky; top: 0; z-index: 10;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; min-height: 44px; display: flex; align-items: center;
      padding: 0 18px; border: none; background: none; cursor: pointer;
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; font-weight: 700;
      color: var(--ink-muted); border-bottom: 3px solid transparent;
      margin-bottom: -2px; letter-spacing: 0.12em; text-transform: uppercase;
      transition: color 0.15s;
    }
    .tab.active { color: var(--navy-ink); border-bottom-color: var(--navy); }

    /* Stories */
    .stories { padding: 8px 20px 40px; }
    .empty {
      padding: 40px 4px; text-align: center; color: var(--meta);
      font-style: italic; font-size: 0.9375rem;
    }
    .card {
      border-top: 1px solid var(--rule); padding: 14px 0; cursor: pointer;
      background: var(--paper); transition: background 0.15s;
    }
    .card.lead { border-top: 3px solid var(--navy); padding: 20px 0 16px; }
    .card.open { background: var(--tint-open); }
    .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card .row-main { flex: 1; min-width: 0; }
    .card .kicker {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; color: var(--red); margin-bottom: 6px; text-transform: uppercase;
    }
    .card .tag {
      color: var(--chip-ink); padding: 2px 6px; margin-right: 8px;
      font-size: 0.5625rem; border-radius: 2px; vertical-align: 1px;
    }
    .card .tag.hot { background: var(--chip-hot); }
    .card .tag.cool { background: var(--chip-cool); }
    .card .headline {
      font-size: 1.0625rem; font-weight: 700; line-height: 1.25; color: var(--ink); margin-bottom: 6px;
    }
    .card.lead .headline { font-size: 1.375rem; }
    .card .sub {
      font-size: 0.875rem; color: var(--ink-sub); line-height: 1.4; margin-bottom: 4px; font-style: italic;
    }
    .card .time { font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta); margin-top: 4px; }
    .card .toggle { color: var(--navy-ink); opacity: 0.5; font-size: 1.125rem; flex-shrink: 0; margin-top: 2px; }
    .card .expand {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    }
    .card .expand .sumtext {
      font-size: 0.9375rem; color: var(--ink-sub); line-height: 1.7;
    }
    .card .expand img {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      background: var(--tint-open); border-radius: 3px; margin-bottom: 12px;
    }
    .card .analysis {
      margin-top: 12px; padding: 10px 14px; background: var(--tint-analysis);
      font-size: 0.875rem; line-height: 1.6; color: var(--ink-sub); font-style: italic;
    }
    .card .analysis .alabel {
      display: block; font-family: 'Arial', sans-serif; font-style: normal;
      font-size: 0.625rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--navy-ink); margin-bottom: 4px;
    }
    .card .readmore {
      display: inline-block; margin-top: 12px; min-height: 44px; line-height: 44px;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink); text-decoration: none;
    }
    .card .readmore:hover { text-decoration: underline; }
    .card .readmore:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    /* Ask AI: hand the clipping and a briefing prompt to a model */
    .card .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .askai, .card .ask-opt {
      border: none; background: none; padding: 0; cursor: pointer;
      min-height: 44px; line-height: 44px; text-decoration: none;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink);
    }
    .card .askai { margin-top: 12px; }
    .card .askai:hover, .card .ask-opt:hover { text-decoration: underline; }
    .card .askai:focus-visible, .card .ask-opt:focus-visible {
      outline: 2px solid var(--focus); outline-offset: 3px;
    }
    .card .ask-panel { display: none; border-top: 1px solid var(--rule-soft); margin-top: 4px; }
    .card .ask-panel.open { display: block; }
    .card .ask-row { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .ask-note {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.55;
      color: var(--meta); letter-spacing: 0.02em; padding-bottom: 12px;
    }

    /* Footer */
    .footer {
      border-top: 2px solid var(--navy);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta);
      text-align: center; letter-spacing: 0.06em;
    }
    .notice { padding: 40px 20px; text-align: center; color: var(--meta); font-style: italic; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>

ss/live/2026/sep/01/bond-sell-off-oil-prices-inflation-fears-shein-shares-latest-news-updates"}, {"id": "f2", "lead": false, "kicker": "NEPAL-TIBET FLOODS", "headline": "Nepal-Tibet Flood Death Toll Exceeds 1,000, Warnings Were Visible", "sub": "Scientists say better early-warning systems could have saved lives as rescue efforts continue for 4,500 still missing; one Australian found alive.", "summary": "The death toll from the Nepal-Tibet glacier collapse and subsequent floods has surpassed 1,000, with approximately 4,500 people still missing. Scientists report that warning signs were visible before the disaster, suggesting that improved early-warning systems could have mitigated the loss of life. Rescue efforts are ongoing, and authorities are collecting DNA samples from relatives to identify victims. Among the missing, 42 Australians were reported, with one now confirmed found alive in Tibet.", "analysis": null, "time": "9:25 AM", "tag": "DISASTER", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/live/2026/sep/01/nepal-tibet-floods-death-toll-rescue-hydropower-tunnels-china-latest-updates"}, {"id": "f3", "lead": false, "kicker": "TORONTO POLITICS", "headline": "Ford Government Moves to Remove Toronto Bike Lanes", "sub": "The province begins the process of tearing out Bloor, Yonge, and University bike lanes following a recent Appeal Court victory.", "summary": "The Ford government has initiated the process to remove bike lanes on Toronto's Bloor, Yonge, and University streets. This action follows a recent victory for the province at the Appeal Court earlier this month, clearing a legal hurdle. The decision marks a significant step towards altering the city's cycling infrastructure, a move that has faced considerable public debate.", "analysis": null, "time": "9:00 AM", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/1/7e/17ed2171-1bab-56df-a659-d44 , "image": "https://static01.nyt.com/images/2026/09/01/world/01int-shanghai-g20-social-promo/01int-shanghai-g20-social-promo-superJumbo.jpg", "link": "https://www.nytimes.com/2026/09/01/world/asia/g20-meeting-china-trump-bishkek.html"}]}, {"id": "toronto", "label": "Toronto", "stories": [{"id": "t1", "lead": true, "kicker": "CRIME", "headline": "Senior Detective on Sherman Murder Case Leaves Homicide Unit", "sub": "Brandon Price, a key investigator in the Barry and Honey Sherman murder case, has been promoted to inspector and transferred to the intelligence unit.", "summary": "Detective Sergeant Brandon Price, a senior investigator assigned to the high-profile Barry and Honey Sherman murder case, has been promoted to inspector and transferred from the Toronto police homicide unit to the force's intelligence unit. The departure of a lead detective marks a significant change in the ongoing investigation into the unsolved 2017 deaths of the billionaire couple. The case remains one of Toronto's most perplexing and closely watched murder inquiries.", "analysis": "The reassignment of a lead detective in a cold case like the Sherman murders could be interpreted in multiple ways, from a routine career progression to a strategic shift in investigative approach. It raises questions about the continuity of the investigation and whether new leadership might bring fresh perspectives or face challenges in picking up the complex threads of the case.", "time": "5:00 AM", "tag": null, "sensitivity": true, "image": null, "link": "https://www.thestar.com/news/investigations/senior-detective-on-barry-and-honey-sherman-murder-case-leaves-toronto-police-homicide-unit/article_4dda9924-7b46-435a-ba90-d3c9271a4ffa.html"}, {"id": "t2", "lead": false, "kicker": "PUBLIC HEALTH", "headline": "Stay Out of the Water at Multiple GTA Beaches", "sub": "Toronto Public Health advises against swimming at one city beach, with similar warnings issued for beaches in Halton, Niagara, York, and Durham regions.", "summary": "Toronto Public Health has issued a warning advising residents to stay out of the water at one public beach in the city due to water quality concerns. Similar advisories have been released by public health departments in Halton, Niagara, York, and Durham regions, collectively affecting numerous beaches across the Greater Toronto Area. These warnings are based on the latest water quality reports as of September 1 at 9 a.m.", "analysis": null, "time": "6:55 AM", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/f/c9/fc9e7bd2-a719-59d5-a84a-e5d73c3581c0/64b9590b4091e.image.jpg?resize=300%2C200", "link": "https://www.thestar.com/news/gta/beach-water-quality/stay-out-of-the-water-at-one-toronto-public-beach/article_1802b86d-ec1e-5ea0-8d1f-0ce41001bb64.html"}, {"id": "t3", "lead": false, "kicker": "PUBLIC SAFETY", "headline": "Toronto Police Issue Over 1,600 Tickets in E-Bike Safety Blitz", "sub": "An educational campaign targeted illegal sidewalk riding, wrong-way travel in bike lanes, and illegal moped driving.", "summary": "Toronto police issued more than 1,600 tickets during a recent e-bike safety blitz aimed at improving road safety. The campaign focused on educating and enforcing rules against illegal sidewalk riding, traveling the wrong way in bike lanes, and unauthorized moped operation. This initiative comes as e-bike usage continues to rise, prompting increased scrutiny on rider compliance with traffic laws.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/7/86/7867a8a6-de6a-5110-a6b9-c525e7fe1269/6a96197e9ceb0.image.jpg?resize=300%2C303", "link": "https://www.thestar.com/news/gta/toronto-police-issue-over-1600-tickets-in-e-bike-safety-blitz/article_ec1c7303-e5db-410a-8f1d-a65a88d049f1.html"}, {"id": "t4", "lead": false, "kicker": "LOCAL NEWS", "headline": "Mel Gibson Mocking Sign Language at Toronto Fan Expo Draws Criticism", "sub": "An advocate for the deaf community condemns the actor's actions, citing a lack of respect.", "summary": "Actor Mel Gibson is facing criticism after reportedly mocking sign language at the Toronto Fan Expo. An advocate for the deaf community has condemned his actions, highlighting a perceived lack of respect. Gibson's career has previously been marred by public outbursts and interviews that led to accusations of antisemitism, homophobia, racism, and misogyny.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/3/9b/39bb5d89-2218-50f5-b1e2-f787e846aa94/69ea6835b4c96.image.jpg?resize=300%2C200", "link": "https://www.thestar.com/news/gta/mel-gibson-mocking-sign-language-at-toronto-fan-expo-shows-lack-of-respect-for-the-deaf-advocate-says/article_2db4cf45-14f6-43f7-94bd-ccac9d253d93.html"}]}, {"id": "world", "label": "World", "stories": [{"id": "w1", "lead": true, "kicker": "GERMANY", "headline": "German Police Investigate Reported Explosives at Brandenburg Power Substation", "sub": "Police are responding to reports of explosives near the coal-fired Jänschwalde power plant in Turnow-Preilack, Germany.", "summary": "German police are currently investigating reports of explosives found at a power substation in Turnow-Preilack, Brandenburg. The substation is located near the Jänschwalde coal-fired power plant, a critical energy infrastructure site. Authorities have secured the area and initiated an investigation into the nature of the reported devices. The incident has prompted a heightened security response and raised concerns about potential sabotage or threats to energy supply.", "analysis": "Any threat to critical infrastructure like a power plant substation carries significant implications for national security and economic stability. This incident, if confirmed as an attempt at sabotage, could signal an escalation in non-state actor threats or a new front in geopolitical tensions impacting energy supplies, particularly in the context of ongoing European energy challenges.", "time": "9:13 AM", "tag": "DEVELOPING", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/live/2026/sep/01/ukraine-russia-strikes-attacks-odesa-zelenskyy-putin-eu-defence-europe-latest-news-updates"}, {"id": "w2", "lead": false, "kicker": "CHINA", "headline": "China Censors Flood Aftermath in Tibet, Contrasting Nepal's Open Reporting", "sub": "While Nepal allows free reporting on grief and anger, China's state media presents a sanitized version of the disaster in Tibet.", "summary": "China's official media has presented a heavily sanitized account of the recent flood disaster in Tibet, contrasting sharply with the free reporting on grief and anger allowed in Nepal. This approach reflects China's long-standing playbook for managing information during crises, particularly in sensitive regions. The disparity in reporting highlights Beijing's tight control over narratives, even in the face of widespread devastation from the glacial collapse.", "analysis": null, "time": "6:44 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/09/01/multimedia/01INT-TIBET-CENSORSHIP-01-jhgz/01INT-TIBET-CENSORSHIP-01-jhgz-superJumbo.jpg", "link": "https://www.nytimes.com/2026/09/01/world/asia/china-tibet-floods-nepal-censorship.html"}, {"id": "w3", "lead": false, "kicker": "BRAZIL", "headline": "US Accused of Meddling in Brazilian Election, Echoing Cold War Tactics", "sub": "Claims suggest President Trump and Senator Rubio are attempting to influence the election, drawing parallels to CIA intervention 64 years ago.", "summary": "Accusations have surfaced alleging that President Trump and Senator Marco Rubio are attempting to influence the ongoing Brazilian election. Critics draw parallels between these claims and historical CIA interventions in Brazil 64 years ago, evoking echoes of Cold War-era meddling. The allegations raise concerns about foreign interference in democratic processes and the potential impact on the election's outcome.", "analysis": null, "time": "8:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/bfef516da23e76801d1ad9d93ede10efd70eb042/667_0_3333_2667/500.jpg", "link": "https://www.theguardian.com/world/2026/sep/01/us-trump-rubio-meddling-brazil-election"}, {"id": "w4", "lead": false, "kicker": "DR CONGO", "headline": "Ebola Outbreak Fuels Coffin Making Business Amid Safe Burial Debate", "sub": "In Bunia, coffin makers provide a public service but are central to discussions on ensuring safe burial practices during the Ebola crisis.", "summary": "In Bunia, Democratic Republic of Congo, the ongoing Ebola outbreak has led to a grim boom in the coffin-making business. While local coffin makers view their work as a public service, their operations are at the center of a critical debate surrounding safe burial practices. Ensuring proper handling of bodies is vital to preventing further spread of the virus, making their role both essential and controversial amidst the public health crisis.", "analysis": null, "time": "12:01 AM", "tag": "HEALTH CRISIS", "sensitivity": true, "image": null, "link": "https://www.nytimes.com/2026/09/01/world/africa/congo-ebola-coffins.html"}]}, {"id": "sports", "label": "Sports", "stories": [{"id": "s1", "lead": true, "kicker": "TENNIS", "headline": "Tsitsipas Says Kyrgios Cocaine Ban Was 'Pretty Much Expected'", "sub": "Stefanos Tsitsipas expresses little surprise at Nick Kyrgios's suspension from tennis for cocaine use, a significant blow to the Australian's career.", "summary": "Stefanos Tsitsipas stated he was not surprised by Nick Kyrgios's recent suspension from tennis for cocaine use, remarking it was \"pretty much expected.\" The ban represents a major setback for the controversial Australian player, who has faced numerous disciplinary issues throughout his career. This development casts a shadow over Kyrgios's future in professional tennis and highlights ongoing concerns about player conduct and well-being within the sport.", "analysis": "Tsitsipas's comments underscore a perception within the tennis community regarding Kyrgios's past behavior and struggles. The ban not only impacts Kyrgios's career but also brings renewed attention to mental health and substance abuse challenges that can affect professional athletes, prompting broader discussions about support systems in elite sports.", "time": "1:27 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/8e0460ded8799d699c831b40c3f7c0764c0c1195/868_597_3585_2869/500.jpg", "link": "https://www.theguardian.com/sport/2026/aug/31/stefanos-tsitsipas-says-nick-kyrgioss-cocaine-ban-was-pretty-much-expected"}, {"id": "s2", "lead": false, "kicker": "CRICKET", "headline": "England v Ireland Women's ODI Series Kicks Off", "sub": "The first One-Day International of the three-match series between England and Ireland women's cricket teams is underway at Grace Road.", "summary": "The women's cricket teams of England and Ireland have begun their three-match One-Day International series today. The opening ODI is currently in progress at Grace Road, marking the start of a competitive international fixture. Both teams will be looking to secure an early advantage in the series.", "analysis": null, "time": "9:28 AM", "tag": "LIVE", "sensitivity": false, "image": "https://media.guim.co.uk/4c031d99a9f4d575d115ab25c8e58dda174ef614/215_97_2315_1851/500.jpg", "link": "https://www.theguardian.com/sport/live/2026/sep/01/england-v-ireland-first-womens-cricket-one-day-international-live"}, {"id": "s3", "lead": false, "kicker": "RUGBY", "headline": "Erasmus's Mind Games and New Zealand's Resurgence in Rugby Rivalry", "sub": "Late changes to South Africa’s team hinted at mind games, but a reinvigorated New Zealand remains competitive in the 'Greatest Rivalry' thriller.", "summary": "Rassie Erasmus, South Africa's Director of Rugby, made late changes to the team, which were perceived as strategic mind games ahead of their clash with New Zealand. Despite these tactics, a reinvigorated New Zealand side proved resilient, maintaining their competitive edge in what is dubbed rugby's 'Greatest Rivalry.' The thrilling encounter suggests the All Blacks remain a formidable force.", "analysis": null, "time": "6:34 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/4c230edbeb5bfef7d5f539b33e26778ae3aee4f0/352_0_3282_2626/500.jpg", "link": "https://www.theguardian.com/sport/2026/sep/01/rugby-union-breakdown-south-africa-new-zealand-rassie-erasmus-greatest-rivalry"}, {"id": "s4", "lead": false, "kicker": "US OPEN", "headline": "Alex Eala Becomes Global Star with One US Open Main-Draw Win", "sub": "The Filipino tennis player, dubbed the Philippines' biggest sporting star since Manny Pacquiao, draws a traveling army of fans to Flushing Meadows.", "summary": "Alex Eala, the Filipino tennis sensation, has achieved global stardom despite having only one career main-draw win at the US Open. Dubbed the Philippines' biggest sporting star since Manny Pacquiao, Eala has attracted a dedicated following, with an army of fans traveling to Flushing Meadows to support her. Her rapid rise highlights her immense popularity and potential on the international tennis circuit.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/413b9651c0b8f1fd0d02a7839e56742cd2ef531d/111_0_3331_2666/500.jpg", "link": "https://www.theguardian.com/sport/2026/sep/01/alex-eala-us-open-philippines"}]}, {"id": "business", "label": "Business", "stories": [{"id": "b1", "lead": true, "kicker": "RETAIL", "headline": "Shein Shares Slide on Lackluster Stock Market Debut", "sub": "The fast-fashion retailer's Hong Kong flotation at $26 billion follows failed attempts to list in the US and UK, signaling investor caution.", "summary": "Fast-fashion giant Shein experienced a lackluster stock market debut in Hong Kong, with its shares sliding after an initial valuation of $26 billion. This flotation follows previous unsuccessful attempts to list in the United States and the United Kingdom. The decline in share value suggests investor apprehension, possibly influenced by new trade rules, shrinking market share, and ongoing labor concerns associated with the company's business model. The debut indicates a challenging environment for fast-fashion retailers in public markets.", "analysis": "Shein's disappointing IPO reflects a broader shift in investor sentiment towards fast fashion, which is increasingly scrutinized for its environmental and labor practices. The failure to achieve its once-projected $100 billion valuation suggests that market participants are prioritizing sustainability and ethical concerns, alongside traditional financial metrics, when evaluating companies in the retail sector.", "time": "3:11 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/7fcf7e5dd65065994b8f99f70707aa0cca9b9c4c/1149_0_3695_2958/500.jpg", "link": "https://www.theguardian.com/business/2026/sep/01/shein-shares-slide-fast-fashion-retailer-stock-market-debut-hong-kong"}, {"id": "b2", "lead": false, "kicker": "UK ECONOMY", "headline": "UK House Prices Rise for First Time Since April", "sub": "Nationwide reports a 0.2% month-on-month increase in August, bringing the average home price to £275,465 as the market awaits an interest rate decision.", "summary": "UK house prices saw their first increase since April, rising by 0.2% month-on-month in August, according to Nationwide. The average price of a home now stands at £275,465. This modest uptick comes as the market anticipates an upcoming interest rate vote, which could significantly influence future housing affordability and demand. The rise offers a glimmer of stability after several months of stagnation.", "analysis": null, "time": "4:32 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/6d474167e5b93736f676723401e7aab4bb2371cf/1170_223_4265_3414/500.jpg", "link": "https://www.theguardian.com/business/2026/sep/01/uk-house-prices-rise-for-first-time-since-april-says-nationwide"}, {"id": "b3", "lead": false, "kicker": "UK REGULATION", "headline": "City Regulator Accused of Threatening Consumer Group Over Car Loan Scheme", "sub": "FCA chief Nikhil Rathi allegedly warned of 'adverse consequences' if a challenge was made to a £9.1 billion car loan settlement, court filings reveal.", "summary": "Nikhil Rathi, the chief of the Financial Conduct Authority (FCA), has been accused of threatening a consumer group over a £9.1 billion car loan scheme. Court filings allege that Rathi warned of \"adverse consequences\" if the group challenged the proposed settlement. This accusation raises serious questions about the conduct of the UK's financial watchdog and its interactions with consumer advocacy organizations.", "analysis": null, "time": "3:16 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/7c28a5ea060e351e8c55b2808dee70ea3007b969/376_149_3135_2509/500.jpg", "link": "https://www.theguardian.com/business/2026/sep/01/boss-of-city-regulator-accused-of-threatening-consumer-group-over-91bn-car-loan-scheme"}, {"id": "b4", "lead": false, "kicker": "ENERGY", "headline": "Pentagon Enters Venezuelan Oil Business Under Trump Administration", "sub": "The Defense Department's Office of Strategic Capital is facilitating President Trump's oil deal, a departure from its original mandate.", "summary": "The Pentagon's Office of Strategic Capital, initially established by the Biden administration to bolster the US defense industry with loans, is now actively involved in President Trump's Venezuelan oil deal. This move signifies a notable shift in the office's mandate and the Defense Department's role in international energy policy. The involvement raises questions about the intersection of national security and commercial interests under the current administration.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/08/31/multimedia/31dc-trump-venez-photo-lhft/31dc-trump-venez-photo-lhft-superJumbo.jpg", "link": "https://www.nytimes.com/2026/08/31/us/politics/pentagon-venezuela-oil.html"}]}, {"id": "opinion", "label": "Opinion", "stories": [{"id": "o1", "lead": true, "kicker": "CLIMATE CRISIS", "headline": "Nepal's Glacial Collapse Foreshadows Future Climate Disasters", "sub": "Climate professor Michael Mann argues that the recent deluge caps a summer of extreme climate events, demanding immediate action.", "summary": "Climate professor Michael Mann asserts that the glacial collapse in Nepal and Tibet serves as a stark warning of impending climate disasters worldwide. He highlights that this deluge follows a summer marked by extreme climate events, including deadly heatwaves and wildfires across the globe. Mann argues that these incidents are clear indicators of a rapidly changing climate, emphasizing the urgent need for global action to mitigate further catastrophic consequences. The melting of snow and ice in regions like the Himalayas, Andes, and Greenland could trigger more deadly chain reactions.", "analysis": "This opinion piece connects a specific disaster to the broader pattern of climate change, urging policymakers and the public to recognize the escalating frequency and intensity of extreme weather events. It frames the Nepal floods not as an isolated incident, but as a critical signal for immediate, comprehensive climate action to prevent future, more widespread calamities.", "time": "5:00 AM", "tag": "EDITORIAL", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/commentisfree/2026/sep/01/nepal-flooding-climate-disaster"}, {"id": "o2", "lead": false, "kicker": "POLITICAL FUNDING", "headline": "A Plan to Stop the Rich and Powerful From Swaying Elections", "sub": "MP Stella Creasy advocates for a bill proposing a cap on political donations to keep big money out of politics.", "summary": "MP Stella Creasy is championing a bill designed to curb the influence of wealthy donors on elections by proposing a cap on political donations. Creasy argues that the rich and powerful are already attempting to sway the next election, and this week's debate on the bill presents a crucial opportunity. She believes that seizing this chance is essential to safeguard the integrity of the political process from the undue influence of large financial contributions.", "analysis": null, "time": "8:00 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/9afc8f439aa86515f5d319a21adbfb40f006d07f/620_0_3642_2913/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/sep/01/party-funding-cap-political-donations-reform-uk-stella-creasy"}, {"id": "o3", "lead": false, "kicker": "LONDON", "headline": "Notting Hill Carnival: A Symbol of London's Potential at 60", "sub": "London Mayor Sadiq Khan celebrates the carnival's 60th anniversary as a powerful force for challenging racism and building community.", "summary": "London Mayor Sadiq Khan celebrates the 60th anniversary of the Notting Hill Carnival, hailing it as a powerful symbol of London's potential. Khan emphasizes that the carnival's founders understood culture's ability to challenge racism, foster understanding, and unite diverse communities. He asserts that this spirit is as vital now as it ever was, underscoring the event's enduring significance in promoting social cohesion and cultural exchange.", "analysis": null, "time": "6:15 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/e4386c2bb13827f93b6eb6e1fb80931485c3f078/166_0_2502_2002/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/sep/01/60th-anniversary-notting-hill-carnival-london-sadiq-khan"}, {"id": "o4", "lead": false, "kicker": "US POLITICS", "headline": "The Media's Hasan Piker Obsession Lets Republican Mike Rogers Off the Hook", "sub": "Mehdi Hasan argues that media focus on a controversial supporter distracts from Mike Rogers's campaign including an extremist on its faith leadership team.", "summary": "Mehdi Hasan criticizes the media's intense focus on Hasan Piker, arguing it inadvertently deflects scrutiny from Republican Mike Rogers. Hasan contends that the obsession with Piker, a controversial supporter, allows Rogers to avoid accountability for including an extremist on his campaign's faith leadership team. This media dynamic, Hasan suggests, misdirects attention from more substantive concerns about the candidate's associations and political agenda.", "analysis": null, "time": "6:00 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/9cb26a93e3c95105712a00ac8b72a304d1328c2a/335_0_3331_2666/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/sep/01/hasan-piker-mike-rogers-media"}]}]}</script>

  <script>
    (function () {
      var raw = document.getElementById('edition').textContent;
      var data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<div class="notice">No edition loaded. Run the build to generate today’s paper.</div>';
        return;
      }

      var state = { active: (data.sections[0] || {}).id, openId: null };

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Editorial heat flags keep the red chip; procedural flags cool to navy,
      // so a red chip still means something (the Scarce Red Rule).
      function isHotTag(t) {
        return /^(DEVELOPING|BREAKING|LIVE|WAR|ALERT|URGENT)$/i.test(t || '');
      }

      // ---- Ask AI ----------------------------------------------------------
      // The reader taps one story and gets a briefing, not a chat. The prompt
      // does three jobs: hand over the clipping, name the shape of the answer
      // (five parts, ~500 words, hard ceiling), and set up the follow-up so the
      // conversation continues without the reader having to think of a question.
      // Voice constraints mirror src/config.py HOUSE_VOICE, em dash ban included.
      function buildPrompt(st, sectionLabel) {
        var L = [];
        L.push('I read this in my morning paper and I want to understand it properly.');
        L.push('');
        L.push('THE CLIPPING');
        L.push('Headline: ' + st.headline);
        if (st.sub) L.push('Standfirst: ' + st.sub);
        if (st.summary) L.push('Summary: ' + st.summary);
        if (st.analysis) L.push("My paper's why-it-matters note: " + st.analysis);
        L.push('Section: ' + sectionLabel + '. Filed ' + (st.time || 'this morning') +
               ', edition of ' + data.date + '.');
        if (st.link) L.push('Source: ' + st.link);
        L.push('');
        L.push('WHAT I WANT');
        L.push('A briefing that leaves me genuinely informed, not a restatement of what I just');
        L.push('pasted. Assume I know nothing beyond the clipping above.');
        L.push('');
        L.push('Check current reporting first if you are able to search. My clipping is a');
        L.push('summary and may be incomplete or already overtaken by events. If you cannot');
        L.push('search, say so in one line at the top, then separate what you are confident');
        L.push('about from what you would want verified.');
        L.push('');
        L.push('STRUCTURE');
        L.push('I am reading this on a phone. Build the answer in layers, heaviest first, so');
        L.push('I can stop at the end of any layer and still have got something whole. Use');
        L.push('these markdown headings exactly, so they render large on a small screen.');
        L.push('');
        L.push('# The gist');
        L.push('An H1 of six to ten words stating the actual point, not the topic. Then two or');
        L.push('three short sentences giving me the whole story in plain words. If I read');
        L.push('nothing else, this is what I walk away knowing. Correct my clipping here if it');
        L.push('is wrong or out of date.');
        L.push('');
        L.push('## Why it matters');
        L.push('Two or three short sentences on the stakes and the second order effects. Be');
        L.push('concrete about who gains, who pays, how much, and by when.');
        L.push('');
        L.push('## How we got here');
        L.push('Only the background I need to follow this story. Not a history lecture.');
        L.push('');
        L.push('## Where it is contested');
        L.push('The strongest disagreement among serious people, put fairly. If it is genuinely');
        L.push('uncontested, say so in one sentence and move on.');
        L.push('');
        L.push('## What to watch');
        L.push('Three bullets, each a specific checkable marker with a rough timeframe.');
        L.push('');
        L.push('## Ask me next');
        L.push('Three numbered questions, ordered by what would teach me the most. I will reply');
        L.push('with a digit.');
        L.push('');
        L.push('READING ON A PHONE');
        L.push('Short paragraphs: three sentences at most, none longer than about sixty words,');
        L.push('with a blank line between them. No tables, no nested bullets, no wall of text.');
        L.push('Around 500 words in total. Hard ceiling 650. Do not pad to reach a length; the');
        L.push('gist and why it matters are worth more than the sections under them.');
        L.push('');
        L.push('VOICE');
        L.push('Financial Times, not an encyclopedia and not a chatbot. Plain, confident,');
        L.push('concrete. Specifics over abstractions: names, numbers, dates, stakes. Every');
        L.push('sentence earns its place. No preamble, no throat clearing, no restating my');
        L.push('prompt back to me, no hedging filler, no em dashes. Where you are uncertain,');
        L.push('mark it in the sentence it applies to rather than in a disclaimer paragraph.');
        return L.join('\n');
      }

      function findStory(id) {
        for (var i = 0; i < data.sections.length; i++) {
          var list = data.sections[i].stories || [];
          for (var j = 0; j < list.length; j++) {
            if (list[j].id === id) {
              return { story: list[j], label: data.sections[i].label };
            }
          }
        }
        return null;
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        // Older iOS standalone PWAs land here.
        return new Promise(function (resolve, reject) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('copy failed'));
        });
      }

      // Tagline reflects the sections the edition actually shipped, not a
      // hardcoded list that can disagree with the paper.
      function taglineText() {
        var labels = data.sections
          .filter(function (s) { return s.id !== 'front'; })
          .map(function (s) { return s.label; });
        return (labels.length ? labels : ['Toronto', 'World', 'Business']).join(' · ');
      }

      function weatherHtml(w) {
        if (!w || !w.icon) return '';
        var week = (w.week || []).map(function (d) {
          return '<div class="day"><div class="d">' + esc(d.day) + '</div>' +
            '<div class="i">' + esc(d.icon) + '</div>' +
            '<div class="hi">' + esc(d.hi) + '°</div>' +
            '<div class="lo">' + esc(d.lo) + '°</div></div>';
        }).join('');
        return '<div class="weather" id="weather" role="button" tabindex="0" ' +
          'aria-expanded="false" aria-label="Toronto weather, tap for the week">' +
          '<div class="summary">' +
            '<span class="ico">' + esc(w.icon) + '</span>' +
            '<span class="city">Toronto</span>' +
            '<span class="temp">' + esc(w.high) + '° / ' + esc(w.low) + '°</span>' +
            '<span class="muted">' + esc(w.condition) + '</span>' +
            '<span class="muted">Rain ' + esc(w.rain) + '</span>' +
            '<span class="muted">Wind ' + esc(w.wind) + '</span>' +
            '<span class="chev" id="wchev">▼</span>' +
          '</div>' +
          '<div class="week" id="wweek" style="display:none">' + week + '</div>' +
        '</div>';
      }

      function tabsHtml() {
        return '<div class="tabs" role="tablist">' + data.sections.map(function (s) {
          var on = s.id === state.active;
          return '<button class="tab' + (on ? ' active' : '') + '" role="tab" ' +
            'aria-selected="' + on + '" data-tab="' + esc(s.id) + '">' + esc(s.label) + '</button>';
        }).join('') + '</div>';
      }

      function cardHtml(st, sectionLabel) {
        var open = st.id === state.openId;
        var tag = st.tag
          ? '<span class="tag ' + (isHotTag(st.tag) ? 'hot' : 'cool') + '">' + esc(st.tag) + '</span>'
          : '';
        var kicker = st.kicker ? '<div class="kicker">' + tag + esc(st.kicker) + '</div>' : '';
        var sub = st.sub ? '<div class="sub">' + esc(st.sub) + '</div>' : '';
        var expand = '';
        if (open) {
          var img = st.image
            ? '<img src="' + esc(st.image) + '" alt="' + esc(st.headline) + '" ' +
              'loading="lazy" onerror="this.remove()" />'
            : '';
          var analysis = st.analysis
            ? '<div class="analysis"><span class="alabel">Why it matters</span>' + esc(st.analysis) + '</div>'
            : '';
          var link = st.link
            ? '<a class="readmore" href="' + esc(st.link) + '" target="_blank" rel="noopener">Read full story →</a>'
            : '';

          // Prefill the destinations at render time so a long press ("open in
          // app") carries the prompt too, instead of us intercepting the tap.
          var q = encodeURIComponent(buildPrompt(st, sectionLabel));
          // No target="_blank" on these two. In a standalone PWA a blank target
          // opens an in-app browser sheet, which iOS will not hand off to an
          // installed app; a plain top-level tap is what lets the Claude and
          // ChatGPT apps claim their own domains as Universal Links. "Read full
          // story" keeps _blank, because a news site does belong in a tab.
          var share = navigator.share
            ? '<button class="ask-opt" data-ai="share" data-id="' + esc(st.id) + '">Share to app…</button>'
            : '';
          var actions = '<div class="actions">' + link +
            '<button class="askai" data-ask="' + esc(st.id) + '" aria-expanded="false" ' +
              'aria-controls="ask-' + esc(st.id) + '">Ask AI ▾</button></div>' +
            '<div class="ask-panel" id="ask-' + esc(st.id) + '">' +
              '<div class="ask-row">' +
                '<a class="ask-opt" href="https://claude.ai/new?q=' + esc(q) + '">Claude</a>' +
                '<a class="ask-opt" href="https://chatgpt.com/?q=' + esc(q) + '">ChatGPT</a>' +
                share +
                '<button class="ask-opt" data-ai="copy" data-id="' + esc(st.id) + '">Copy</button>' +
              '</div>' +
              '<div class="ask-note">Opens in the app if you have it installed. The reply ' +
                'starts with the gist in a few lines, then goes deeper, then offers three ' +
                'follow-up questions.</div>' +
            '</div>';

          expand = '<div class="expand">' + img +
            '<p class="sumtext">' + esc(st.summary) + '</p>' + analysis + actions + '</div>';
        }
        return '<div class="card' + (st.lead ? ' lead' : '') + (open ? ' open' : '') +
          '" data-card="' + esc(st.id) + '" role="button" tabindex="0" ' +
          'aria-expanded="' + open + '">' +
          '<div class="row"><div class="row-main">' + kicker +
            '<div class="headline">' + esc(st.headline) + '</div>' + sub +
            '<div class="time">' + esc(st.time) + '</div></div>' +
            '<div class="toggle" aria-hidden="true">' + (open ? '−' : '+') + '</div>' +
          '</div>' + expand +
        '</div>';
      }

      function storiesInner() {
        var section = data.sections.filter(function (s) { return s.id === state.active; })[0];
        if (!section) return '';
        if (!section.stories || !section.stories.length) {
          return '<div class="empty">Nothing filed for ' + esc(section.label) + ' this morning.</div>';
        }
        return section.stories.map(function (st) {
          return cardHtml(st, section.label);
        }).join('');
      }

      // Quietly flag a saved (not-today) edition served from cache/offline.
      function staleRibbon() {
        try {
          var meta = document.querySelector('meta[name=build]');
          if (!meta) return '';
          var built = new Date(meta.getAttribute('content'));
          if (isNaN(built.getTime())) return '';
          var opt = { timeZone: 'America/Toronto' };
          if (built.toLocaleDateString('en-CA', opt) < new Date().toLocaleDateString('en-CA', opt)) {
            return '<div class="stale">Saved edition · ' + esc(data.date) + '</div>';
          }
        } catch (e) {}
        return '';
      }

      function appHtml() {
        return '<div class="masthead">' +
            '<div class="date">' + esc(data.date) + '</div>' +
            '<div class="title">THE DAILY</div>' +
            '<div class="tagline">' + esc(taglineText()) + '</div>' +
          '</div>' +
          staleRibbon() +
          weatherHtml(data.weather) +
          tabsHtml() +
          '<div class="stories" id="stories">' + storiesInner() + '</div>' +
          '<div class="footer">THE DAILY · TORONTO · Tap any headline to read</div>';
      }

      var app = document.getElementById('app');

      // Rebuild only the stories column; masthead, weather, and tab strip (and
      // their scroll/open state) are left untouched. This is what keeps a tap
      // from resetting the reader's place.
      function refreshStories() {
        document.getElementById('stories').innerHTML = storiesInner();
        bindCards();
      }

      function selectTab(id) {
        if (id === state.active) return;
        state.active = id;
        state.openId = null;
        var tabs = document.querySelectorAll('.tab');
        Array.prototype.forEach.call(tabs, function (t) {
          var on = t.getAttribute('data-tab') === id;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on);
          if (on) t.scrollIntoView({ inline: 'center', block: 'nearest' });
        });
        refreshStories();
        // Start the new section at the top, tab strip stuck under the notch.
        var tabsEl = document.querySelector('.tabs');
        if (tabsEl) window.scrollTo(0, tabsEl.offsetTop);
      }

      function toggleCard(id) {
        var y = window.scrollY;
        state.openId = state.openId === id ? null : id;
        refreshStories();
        window.scrollTo(0, y);   // grow/collapse in place, never jump
      }

      function bindWeather() {
        var weather = document.getElementById('weather');
        if (!weather) return;
        function toggle() {
          var week = document.getElementById('wweek');
          var chev = document.getElementById('wchev');
          var showing = week.style.display !== 'none';
          week.style.display = showing ? 'none' : 'flex';
          chev.textContent = showing ? '▼' : '▲';
          weather.setAttribute('aria-expanded', String(!showing));
        }
        weather.addEventListener('click', toggle);
        weather.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
        });
      }

      function bindTabs() {
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
          btn.addEventListener('click', function () { selectTab(btn.getAttribute('data-tab')); });
        });
      }

      function bindCards() {
        Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
          function activate(ev) {
            // Let links and the Ask AI controls handle their own activation.
            if (ev.target.closest('a, button')) return;
            // While open, only the header row collapses it, so reading (and
            // selecting) the body never closes the story by accident.
            if (card.classList.contains('open') && !ev.target.closest('.row')) return;
            toggleCard(card.getAttribute('data-card'));
          }
          card.addEventListener('click', activate);
          card.addEventListener('keydown', function (ev) {
            if (ev.key !== 'Enter' && ev.key !== ' ') return;
            // Never swallow the key from a control that acts on it itself.
            if (ev.target.closest('a, button')) return;
            ev.preventDefault();
            activate(ev);
          });
          bindAsk(card);
        });
      }

      // Panel state is held in the DOM, not in `state`, so opening the
      // destinations never triggers a stories rebuild and never moves the page.
      function bindAsk(card) {
        var toggle = card.querySelector('.askai');
        if (!toggle) return;
        var panel = card.querySelector('.ask-panel');

        toggle.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var open = panel.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(open));
          toggle.textContent = open ? 'Ask AI ▴' : 'Ask AI ▾';
        });

        Array.prototype.forEach.call(panel.querySelectorAll('[data-ai]'), function (el) {
          var kind = el.getAttribute('data-ai');
          el.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var found = findStory(el.getAttribute('data-id'));
            if (!found) return;
            var prompt = buildPrompt(found.story, found.label);

            if (kind === 'share') {
              navigator.share({ text: prompt }).catch(function () {});
              return;
            }
            var label = el.textContent;
            copyText(prompt).then(function () {
              el.textContent = 'Copied';
            }).catch(function () {
              el.textContent = 'Copy failed';
            }).then(function () {
              setTimeout(function () { el.textContent = label; }, 1800);
            });
          });
        });
      }

      app.innerHTML = appHtml();
      bindWeather();
      bindTabs();
      bindCards();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
