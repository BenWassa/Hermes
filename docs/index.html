  <title>The Daily</title>
  <style>
    /* ---- Design tokens: The Morning Broadsheet ------------------------- */
    :root {
      --paper: #faf8f3;        /* the sheet (warm white, never #fff) */
      --desk: #efece6;         /* the desk beyond the column */
      --ink: #17130d;          /* headlines / primary text */
      --ink-sub: #453f38;      /* standfirsts */
      --ink-muted: #635d54;    /* inactive tabs */
      --meta: #6c665c;         /* timestamps, dateline, footer (>=AA small) */
      --rule: #dcd6cc;         /* hairline between cards */
      --rule-soft: #e3ded4;    /* hairline inside an opened card */
      --navy: #1a2744;         /* structural ink */
      --navy-ink: #1a2744;     /* navy used as text (links, active tab) */
      --red: #8b1a1a;          /* editorial heat */
      --tint-open: #f2ede4;    /* ground of an expanded card */
      --tint-analysis: #ece6da;/* ground of the why-it-matters note */
      --strip-bg: #1a2744;     /* weather strip */
      --strip-ink: #f7f4ee;
      --chip-hot: #8b1a1a;     /* DEVELOPING / WAR-class flags */
      --chip-cool: #1a2744;    /* procedural flags (FINAL, EDITORIAL) */
      --chip-ink: #faf8f3;
      --focus: #1a2744;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151a22;      /* lamplight edition: deep navy-black paper */
        --desk: #0e1219;
        --ink: #e9e3d5;        /* cream ink */
        --ink-sub: #bcb6a8;
        --ink-muted: #948e82;
        --meta: #8f897d;
        --rule: #2a303a;
        --rule-soft: #2f3540;
        --navy: #6f82a8;       /* structure lifted so it reads on dark */
        --navy-ink: #a3b3d2;
        --red: #d1726b;        /* desaturated heat */
        --tint-open: #1b212b;
        --tint-analysis: #20262f;
        --strip-bg: #1b2334;
        --strip-ink: #e9e3d5;
        --chip-hot: #a8443c;
        --chip-cool: #3b4a6c;
        --chip-ink: #f0eadc;
        --focus: #a3b3d2;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 100%; }
    html, body { background: var(--desk); }
    body {
      font-family: 'Georgia', serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--paper);
      max-width: 680px;
      margin: 0 auto;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Masthead */
    .masthead {
      border-bottom: 4px solid var(--navy);
      padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
      background: var(--paper);
    }
    .masthead .date {
      font-size: 0.6875rem; color: var(--meta); letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .masthead .title {
      font-size: 2.375rem; font-weight: 700; letter-spacing: -0.01em;
      color: var(--navy); line-height: 1; margin-bottom: 2px;
    }
    .masthead .tagline {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; color: var(--meta);
      letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* Stale-edition ribbon */
    .stale {
      background: var(--tint-analysis); color: var(--meta);
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; text-align: center;
      padding: 7px 20px;
    }

    /* Weather strip */
    .weather {
      background: var(--strip-bg); color: var(--strip-ink);
      cursor: pointer; user-select: none;
    }
    .weather .summary {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
      min-height: 44px;
    }
    .weather .summary::-webkit-scrollbar { display: none; }
    .weather .ico { font-size: 1.375rem; }
    .weather .city { font-weight: 700; font-size: 0.9375rem; }
    .weather .temp { font-size: 0.9375rem; }
    .weather .muted { opacity: 0.72; font-size: 0.8125rem; white-space: nowrap; }
    .weather .chev { margin-left: auto; opacity: 0.6; font-size: 0.75rem; }
    .weather .week {
      display: flex; border-top: 1px solid rgba(255,255,255,0.12);
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
    }
    .weather .week::-webkit-scrollbar { display: none; }
    .weather .day {
      text-align: center; min-width: 52px; padding: 0 8px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .weather .day .d { font-size: 0.6875rem; opacity: 0.6; margin-bottom: 4px; }
    .weather .day .i { font-size: 1.125rem; }
    .weather .day .hi { font-size: 0.8125rem; font-weight: 700; margin-top: 4px; }
    .weather .day .lo { font-size: 0.6875rem; opacity: 0.5; }

    /* Tab nav */
    .tabs {
      display: flex; overflow-x: auto; border-bottom: 2px solid var(--navy);
      background: var(--paper); scrollbar-width: none;
      position: sticky; top: 0; z-index: 10;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; min-height: 44px; display: flex; align-items: center;
      padding: 0 18px; border: none; background: none; cursor: pointer;
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; font-weight: 700;
      color: var(--ink-muted); border-bottom: 3px solid transparent;
      margin-bottom: -2px; letter-spacing: 0.12em; text-transform: uppercase;
      transition: color 0.15s;
    }
    .tab.active { color: var(--navy-ink); border-bottom-color: var(--navy); }

    /* Stories */
    .stories { padding: 8px 20px 40px; }
    .empty {
      padding: 40px 4px; text-align: center; color: var(--meta);
      font-style: italic; font-size: 0.9375rem;
    }
    .card {
      border-top: 1px solid var(--rule); padding: 14px 0; cursor: pointer;
      background: var(--paper); transition: background 0.15s;
    }
    .card.lead { border-top: 3px solid var(--navy); padding: 20px 0 16px; }
    .card.open { background: var(--tint-open); }
    .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card .row-main { flex: 1; min-width: 0; }
    .card .kicker {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; color: var(--red); margin-bottom: 6px; text-transform: uppercase;
    }
    .card .tag {
      color: var(--chip-ink); padding: 2px 6px; margin-right: 8px;
      font-size: 0.5625rem; border-radius: 2px; vertical-align: 1px;
    }
    .card .tag.hot { background: var(--chip-hot); }
    .card .tag.cool { background: var(--chip-cool); }
    .card .headline {
      font-size: 1.0625rem; font-weight: 700; line-height: 1.25; color: var(--ink); margin-bottom: 6px;
    }
    .card.lead .headline { font-size: 1.375rem; }
    .card .sub {
      font-size: 0.875rem; color: var(--ink-sub); line-height: 1.4; margin-bottom: 4px; font-style: italic;
    }
    .card .time { font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta); margin-top: 4px; }
    .card .toggle { color: var(--navy-ink); opacity: 0.5; font-size: 1.125rem; flex-shrink: 0; margin-top: 2px; }
    .card .expand {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    }
    .card .expand .sumtext {
      font-size: 0.9375rem; color: var(--ink-sub); line-height: 1.7;
    }
    .card .expand img {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      background: var(--tint-open); border-radius: 3px; margin-bottom: 12px;
    }
    .card .analysis {
      margin-top: 12px; padding: 10px 14px; background: var(--tint-analysis);
      font-size: 0.875rem; line-height: 1.6; color: var(--ink-sub); font-style: italic;
    }
    .card .analysis .alabel {
      display: block; font-family: 'Arial', sans-serif; font-style: normal;
      font-size: 0.625rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--navy-ink); margin-bottom: 4px;
    }
    .card .readmore {
      display: inline-block; margin-top: 12px; min-height: 44px; line-height: 44px;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink); text-decoration: none;
    }
    .card .readmore:hover { text-decoration: underline; }
    .card .readmore:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    /* Ask AI: hand the clipping and a briefing prompt to a model */
    .card .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .askai, .card .ask-opt {
      border: none; background: none; padding: 0; cursor: pointer;
      min-height: 44px; line-height: 44px; text-decoration: none;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink);
    }
    .card .askai { margin-top: 12px; }
    .card .askai:hover, .card .ask-opt:hover { text-decoration: underline; }
    .card .askai:focus-visible, .card .ask-opt:focus-visible {
      outline: 2px solid var(--focus); outline-offset: 3px;
    }
    .card .ask-panel { display: none; border-top: 1px solid var(--rule-soft); margin-top: 4px; }
    .card .ask-panel.open { display: block; }
    .card .ask-row { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .ask-note {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.55;
      color: var(--meta); letter-spacing: 0.02em; padding-bottom: 12px;
    }

    /* Footer */
    .footer {
      border-top: 2px solid var(--navy);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta);
      text-align: center; letter-spacing: 0.06em;
    }
    .notice { padding: 40px 20px; text-align: center; color: var(--meta); font-style: italic; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>

ce and fairness in the province's legal system, potentially leading to increased pre-trial detention for those unable to afford bail.", "analysis": "This legal challenge could significantly impact how bail is administered across Ontario, potentially forcing the provincial government to revise its approach to pre-trial detention. The outcome will be closely watched by legal professionals and civil rights advocates nationwide, as it addresses critical questions about access to justice and systemic inequities.", "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/d/d1/dd1d7402-df74-5251-b236-2958eb7cf959/6a8f58be33236.image.jpg?resize=300%2C210", "link": "https://www.thestar.com/news/gta/why-legal-groups-are-in-a-toronto-court-today-fighting-to-strike-down-ontarios-new-cash-bail-rules/article_26857c76-d658-4f0f-a63f-e9f4ee5feeac"}, {"id": "t2", "lead": false, "kicker": "HOMICIDE", "headline": "Durham Police Arrest Two Men in 2023 Murder of 17-Year-Old", "sub": "Arrests made in connection with the homicide of Anthony Dixon, which occurred in June 2023.", "summary": "Durham police have arrested two men in connection with the 2023 murder of 17-year-old Anthony Dixon. The arrests come more than a year after the homicide, which took place in June 2023. Further details regarding the suspects and charges are expected to be released as the investigation progresses.", "analysis": null, "time": "8:02 AM", "tag": "FINAL", "sensitivity": true, "image": null, "link": "https://www.thestar.com/news/gta/durham-police-arrest-two-men-in-the-2023-murder-of-anthony-dixon/article_50751666-34b8-4077-8b78-cf7fb897f748.html"}, {"id": "t3", "lead": false, "kicker": "EDUCATION", "headline": "Toronto Catholic School Trustee Resigns Teaching Licence After Misconduct Ruling", "sub": "Trustee faces significant financial penalties following controversial 2019 comments on LGBTQ+ protections.", "summary": "A Toronto Catholic school trustee has relinquished his teaching licence following a misconduct ruling related to controversial comments made in 2019. The comments linked LGBTQ+ protections to a range of sexual fetishes, sparking widespread criticism. The trustee now faces a substantial bill for the disciplinary proceedings.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/4/3c/43cc6875-b38c-5ea7-9a8f-2456d7b542d1/646b566d2eb3c.image.jpg?resize=300%2C205", "link": "https://www.thestar.com/news/gta/toronto-catholic-school-trustee-gives-up-teaching-licence-after-misconduct-ruling-but-he-faces-a-hefty-bill/article_80bcf4ae-bd94-490d-8523-7fd351c12cd3.html"}, {"id": "t4", "lead": false, "kicker": "PUBLIC HEALTH", "headline": "Toronto Public Beaches Open for Swimming, Others Under Advisory", "sub": "Latest water quality report shows some Toronto beaches safe, while Durham, Halton, Niagara, and York regions have advisories.", "summary": "Toronto Public Health's latest water quality report indicates that several Toronto public beaches are safe for swimming as of Thursday afternoon. However, advisories are in effect for 11 beaches in Durham Region, one in Halton Region, five in Niagara Region, and three in York Region, where residents are advised to stay out of the water due to elevated bacteria levels.", "analysis": null, "time": "11:30 AM", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/f/c9/fc9e7bd2-a719-59d5-a84a-e5d73c3581c0/64b9590b4091e.image.jpg?resize=300%2C200", "link": "https://www.thestar.com/news/gta/beach-water-quality/these-toronto-public-beaches-are-open-for-swimming/article_e662609c-2813-503f-b7ca-11e0040b1116.html"}]}, {"id": "world", "label": "World", "stories": [{"id": "w1", "lead": true, "kicker": "NEPAL FLOODS", "headline": "Climate Crisis Linked to Destabilized Mountains in Nepal Flood Disaster", "sub": "Experts warn unusual heat may have melted ice and thawed glacial bonds, contributing to catastrophic flash floods.", "summary": "Experts are warning that the climate crisis may be destabilizing mountain areas like Nepal, contributing to the recent catastrophic flash floods that have killed hundreds. Unusual heat this year is believed to have melted glacial ice and thawed the bonds holding glaciers in place, leading to the massive collapse that triggered the floods. This environmental degradation exacerbates the risk of such disasters in the Himalayan region, prompting calls for urgent climate action and preparedness.", "analysis": "The scientific link between rising global temperatures and glacial instability underscores the long-term, systemic risks posed by climate change to vulnerable mountain communities. This disaster serves as a stark reminder of the need for both immediate humanitarian response and sustained global efforts to mitigate climate impacts.", "time": "6:25 PM", "tag": "DEVELOPING", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/2026/aug/27/climate-crisis-mountain-areas-glaciers-nepal-tibet"}, {"id": "w2", "lead": false, "kicker": "UKRAINE WAR", "headline": "Ukraine War Becomes Deadly Game of Cat and Mouse Where Drones Cannot See", "sub": "Russian troops attempt infiltration in overgrown reservoir basin as Ukrainian soldiers hunt at close quarters.", "summary": "The Ukraine War has devolved into a deadly game of cat and mouse in areas where drones are ineffective, particularly in the vast, overgrown reservoir basin of a dam blown up three years ago. Russian troops are attempting to infiltrate these challenging terrains, while Ukrainian soldiers are engaged in close-quarters hunting to counter their movements. This shift highlights the brutal, intimate nature of combat away from modern surveillance technologies.", "analysis": null, "time": "5:54 AM", "tag": "WAR", "sensitivity": true, "image": null, "link": "https://www.nytimes.com/2026/08/27/world/europe/ukraine-russia-war-zaporizhzhia-frontline-fighting.html"}, {"id": "w3", "lead": false, "kicker": "CANADA", "headline": "Russian Sanctions Fueling Canadian Car Theft Epidemic", "sub": "Russia has become the primary destination for stolen Canadian vehicles, feeding a booming black market.", "summary": "Russian sanctions are inadvertently fueling a significant car theft epidemic in Canada, with Russia emerging as the largest destination for stolen Canadian vehicles. Smugglers are capitalizing on the demand created by a booming black market for cars in Russia. This illicit trade is causing substantial losses for Canadian car owners and insurers.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/08/18/00vid-canada-cars-74502-cover/00vid-canada-cars-74502-cover-superJumbo-v2.jpg", "link": "https://www.nytimes.com/2026/08/27/world/canada/canada-car-theft-russia-sanctions.html"}, {"id": "w4", "lead": false, "kicker": "GREENLAND", "headline": "Greenlandic Women to Receive Compensation for Forced Contraception", "sub": "Denmark passes bill to compensate women subjected to forced intrauterine device implantation for decades.", "summary": "Greenlandic women will finally receive compensation for decades of forced contraception imposed by Denmark. On Thursday, the Danish government passed a compensation bill addressing the historical practice of implanting intrauterine devices in women in Greenland, an effort to control the island's population. This landmark decision acknowledges a dark chapter in Danish-Greenlandic relations.", "analysis": null, "time": "12:28 PM", "tag": "FINAL", "sensitivity": false, "image": "https://static01.nyt.com/images/2026/08/27/multimedia/27greenland-birth-control-hzpg/27greenland-birth-control-hzpg-superJumbo.jpg", "link": "https://www.nytimes.com/2026/08/27/world/europe/denmark-greenland-forced-contraception-compensation.html"}]}, {"id": "sports", "label": "Sports", "stories": [{"id": "s1", "lead": true, "kicker": "CRICKET", "headline": "Pakistan's Mohammad Abbas Dominates England on Day One of Second Test", "sub": "Seamer claims four wickets as England struggle to 248-9 before bad light stops play at Lord’s.", "summary": "Pakistan's seamer Mohammad Abbas delivered a dominant performance on day one of the second Test against England at Lord’s, claiming four crucial wickets. England struggled on a challenging batting pitch, reaching 248 for 9 before bad light halted play. Jamie Smith provided some resistance with a counter-attacking 61, but Abbas's consistency pegged back the home side. The performance marks a strong showing for Pakistan, who are looking to make their mark in the series.", "analysis": "Abbas's exceptional bowling performance has put Pakistan in a strong position early in the second Test, setting up a potentially decisive contest. England's ability to recover on day two will be critical, as they face the challenge of building a competitive total against a confident Pakistani attack.", "time": "6:12 PM", "tag": "DEVELOPING", "sensitivity": false, "image": "https://media.guim.co.uk/4921bdd75a0f49c1b5bae72affd99927c61a11de/633_107_3850_3080/500.jpg", "link": "https://www.theguardian.com/sport/live/2026/aug/27/england-v-pakistan-second-mens-cricket-test-day-one-live"}, {"id": "s2", "lead": false, "kicker": "WNBA", "headline": "WNBA Star Cameron Brink Slams Enes Kanter Freedom Over Anti-Trans Stunt", "sub": "Brink defends trans community, calls Freedom's WNBA draft attempt a bid for 'relevance'.", "summary": "Los Angeles WNBA star Cameron Brink launched a scathing attack on Enes Kanter Freedom, defending the trans community and branding his attempt to enter the WNBA draft as a stunt to 'stay relevant.' Brink's comments came after Freedom, a former NBA player, made headlines for his anti-trans stance and his declared intenti ndy Canadian luxury e-commerce retailer, is grappling with the impact of former President Trump's tariffs by moving a core part of its business to the United States. This strategic relocation aims to help American customers avoid hefty import duties, which have affected the company's comeback efforts. The move reflects broader challenges faced by international businesses navigating complex trade policies.", "analysis": null, "time": "11:59 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/08/26/multimedia/26biz-ssense-whvl/26biz-ssense-whvl-superJumbo.jpg", "link": "https://www.nytimes.com/2026/08/27/business/ssense-canada-tariffs-trump.html"}, {"id": "b3", "lead": false, "kicker": "CYBERSECURITY", "headline": "UK Small Power Plants Face Higher Cyber Risk into 2030s", "sub": "Decision not to improve resilience sooner described as 'unacceptable gamble with our national security' despite Iran-linked hack.", "summary": "Small power plants in the UK are projected to face heightened cyber risks well into the 2030s, despite a previous Iran-linked hack. Critics have labeled the decision not to improve resilience sooner as an 'unacceptable gamble with our national security.' This delay in bolstering cybersecurity measures leaves critical infrastructure vulnerable to future attacks.", "analysis": null, "time": "9:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/45b140061cd05dc2ef6c40ebd5fb1a37152a20d8/2142_1128_3481_2785/500.jpg", "link": "https://www.theguardian.com/business/2026/aug/27/uk-small-power-plants-risk-cyber-attacks-iran-hack"}, {"id": "b4", "lead": false, "kicker": "FINANCE", "headline": "City Firms Prepare for FCA Crackdown on Bullying and Harassment", "sub": "Hedge funds, insurers, and pension firms must report all non-financial wrongdoing as watchdog expands focus.", "summary": "City firms are racing to prepare for an impending crackdown by the Financial Conduct Authority (FCA) on bullying and harassment. The new regulations will require hedge funds, insurers, and pension firms to report all non-financial wrongdoing, significantly expanding the watchdog's oversight. This initiative aims to foster a more ethical and inclusive work environment within the financial sector.", "analysis": null, "time": "7:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/6658c9d519fea78d40422300951645c3394b3509/1625_426_5489_4393/500.jpg", "link": "https://www.theguardian.com/business/2026/aug/27/city-fca-crackdown-bullying-harassment-rules"}]}, {"id": "opinion", "label": "Opinion", "stories": [{"id": "o1", "lead": true, "kicker": "CLIMATE CRISIS", "headline": "The Guardian View: Prepare for More Climate-Linked Disasters After Nepal Floods", "sub": "Editorial emphasizes urgent need for medicine and food, alongside facing rising risks from shrinking glaciers.", "summary": "The Guardian's editorial board argues that the devastating Nepal-Tibet floods underscore the urgent need to prepare for more climate-linked disasters. While immediate priorities include medicine, food, and other supplies for flood victims, the editorial stresses that the long-term risks from shrinking glaciers must be confronted. It calls for proactive measures and policy changes to address the escalating environmental threats posed by climate change in vulnerable regions.", "analysis": "This editorial connects the immediate tragedy in Nepal to the broader, systemic issue of climate change, advocating for a dual approach of humanitarian aid and long-term climate resilience. It frames the disaster not as an isolated event, but as a harbinger of future challenges requiring global attention and policy shifts.", "time": "5:40 PM", "tag": "EDITORIAL", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/commentisfree/2026/aug/27/the-guardian-view-on-the-nepal-tibet-floods-prepare-for-more-climate-linked-disasters"}, {"id": "o2", "lead": false, "kicker": "POLITICS", "headline": "Angela Eagle: Britain Faces Wildfires and Flood Risks, Climate Crisis is Real", "sub": "Environment Secretary asserts honesty and bold action are needed, criticizing Reform and Conservatives for misleading public.", "summary": "Environment Secretary Angela Eagle asserts that Britain is facing increasing risks of wildfires and floods, emphasizing that the climate crisis is real and requires bold action. Eagle criticizes the Reform and Conservative parties for allegedly misleading the public on environmental issues. She argues that as Environment Secretary, she believes it is crucial to be honest with the public about these threats and to implement decisive policies to address them.", "analysis": null, "time": "12:05 PM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/dc41492bc0930910f36b5fda9ca1b7b1daf18e9f/112_0_3094_2475/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/27/britain-wildfires-flood-risks-climate-crisis"}, {"id": "o3", "lead": false, "kicker": "SOCIAL ETIQUETTE", "headline": "It's Time to Stop Flaking on Friends for No Good Reason", "sub": "Columnist argues that canceling plans due to minor discomfort has become too common and must cease.", "summary": "A columnist argues that the widespread habit of canceling plans with friends for no substantial reason has become an unacceptable norm. The piece contends that people are increasingly desperate to avoid even minor discomforts, leading to a culture of flaking. It calls for an immediate end to this behavior, advocating for greater respect for social commitments and the value of friendships.", "analysis": null, "time": "3:00 PM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/649c2b706e9768115538b81c4da2d546b54e54cb/366_0_5200_4160/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/28/friend-flaking-on-someone-cancel-plans"}, {"id": "o4", "lead": false, "kicker": "PUBLIC HEALTH", "headline": "Food Allergies on Planes: Nuts Should Be Banned, Says Opinion Editor", "sub": "Lucy Pasha-Robinson argues that people with allergies deserve to travel without fear, necessitating a ban on nuts.", "summary": "Lucy Pasha-Robinson, an assistant Opinion editor at The Guardian, argues that nuts should be banned on planes to ensure people with food allergies can travel without fear. She contends that a compassionate society must respect the right of individuals with allergies to travel safely, free from the constant threat of allergic reactions. The piece advocates for policy changes to prioritize the health and safety of all passengers.", "analysis": null, "time": "3:00 PM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/31ee28ce51178d2d9636584aad5d686ab9779a24/598_0_4697_3757/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/27/food-allergies-flying-planes-banned-peanuts"}]}]}</script>

  <script>
    (function () {
      var raw = document.getElementById('edition').textContent;
      var data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<div class="notice">No edition loaded. Run the build to generate today’s paper.</div>';
        return;
      }

      var state = { active: (data.sections[0] || {}).id, openId: null };

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Editorial heat flags keep the red chip; procedural flags cool to navy,
      // so a red chip still means something (the Scarce Red Rule).
      function isHotTag(t) {
        return /^(DEVELOPING|BREAKING|LIVE|WAR|ALERT|URGENT)$/i.test(t || '');
      }

      // ---- Ask AI ----------------------------------------------------------
      // The reader taps one story and gets a briefing, not a chat. The prompt
      // does three jobs: hand over the clipping, name the shape of the answer
      // (five parts, ~500 words, hard ceiling), and set up the follow-up so the
      // conversation continues without the reader having to think of a question.
      // Voice constraints mirror src/config.py HOUSE_VOICE, em dash ban included.
      function buildPrompt(st, sectionLabel) {
        var L = [];
        L.push('I read this in my morning paper and I want to understand it properly.');
        L.push('');
        L.push('THE CLIPPING');
        L.push('Headline: ' + st.headline);
        if (st.sub) L.push('Standfirst: ' + st.sub);
        if (st.summary) L.push('Summary: ' + st.summary);
        if (st.analysis) L.push("My paper's why-it-matters note: " + st.analysis);
        L.push('Section: ' + sectionLabel + '. Filed ' + (st.time || 'this morning') +
               ', edition of ' + data.date + '.');
        if (st.link) L.push('Source: ' + st.link);
        L.push('');
        L.push('WHAT I WANT');
        L.push('A briefing that leaves me genuinely informed, not a restatement of what I just');
        L.push('pasted. Assume I know nothing beyond the clipping above.');
        L.push('');
        L.push('Check current reporting first if you are able to search. My clipping is a');
        L.push('summary and may be incomplete or already overtaken by events. If you cannot');
        L.push('search, say so in one line at the top, then separate what you are confident');
        L.push('about from what you would want verified.');
        L.push('');
        L.push('STRUCTURE');
        L.push('I am reading this on a phone. Build the answer in layers, heaviest first, so');
        L.push('I can stop at the end of any layer and still have got something whole. Use');
        L.push('these markdown headings exactly, so they render large on a small screen.');
        L.push('');
        L.push('# The gist');
        L.push('An H1 of six to ten words stating the actual point, not the topic. Then two or');
        L.push('three short sentences giving me the whole story in plain words. If I read');
        L.push('nothing else, this is what I walk away knowing. Correct my clipping here if it');
        L.push('is wrong or out of date.');
        L.push('');
        L.push('## Why it matters');
        L.push('Two or three short sentences on the stakes and the second order effects. Be');
        L.push('concrete about who gains, who pays, how much, and by when.');
        L.push('');
        L.push('## How we got here');
        L.push('Only the background I need to follow this story. Not a history lecture.');
        L.push('');
        L.push('## Where it is contested');
        L.push('The strongest disagreement among serious people, put fairly. If it is genuinely');
        L.push('uncontested, say so in one sentence and move on.');
        L.push('');
        L.push('## What to watch');
        L.push('Three bullets, each a specific checkable marker with a rough timeframe.');
        L.push('');
        L.push('## Ask me next');
        L.push('Three numbered questions, ordered by what would teach me the most. I will reply');
        L.push('with a digit.');
        L.push('');
        L.push('READING ON A PHONE');
        L.push('Short paragraphs: three sentences at most, none longer than about sixty words,');
        L.push('with a blank line between them. No tables, no nested bullets, no wall of text.');
        L.push('Around 500 words in total. Hard ceiling 650. Do not pad to reach a length; the');
        L.push('gist and why it matters are worth more than the sections under them.');
        L.push('');
        L.push('VOICE');
        L.push('Financial Times, not an encyclopedia and not a chatbot. Plain, confident,');
        L.push('concrete. Specifics over abstractions: names, numbers, dates, stakes. Every');
        L.push('sentence earns its place. No preamble, no throat clearing, no restating my');
        L.push('prompt back to me, no hedging filler, no em dashes. Where you are uncertain,');
        L.push('mark it in the sentence it applies to rather than in a disclaimer paragraph.');
        return L.join('\n');
      }

      function findStory(id) {
        for (var i = 0; i < data.sections.length; i++) {
          var list = data.sections[i].stories || [];
          for (var j = 0; j < list.length; j++) {
            if (list[j].id === id) {
              return { story: list[j], label: data.sections[i].label };
            }
          }
        }
        return null;
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        // Older iOS standalone PWAs land here.
        return new Promise(function (resolve, reject) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('copy failed'));
        });
      }

      // Tagline reflects the sections the edition actually shipped, not a
      // hardcoded list that can disagree with the paper.
      function taglineText() {
        var labels = data.sections
          .filter(function (s) { return s.id !== 'front'; })
          .map(function (s) { return s.label; });
        return (labels.length ? labels : ['Toronto', 'World', 'Business']).join(' · ');
      }

      function weatherHtml(w) {
        if (!w || !w.icon) return '';
        var week = (w.week || []).map(function (d) {
          return '<div class="day"><div class="d">' + esc(d.day) + '</div>' +
            '<div class="i">' + esc(d.icon) + '</div>' +
            '<div class="hi">' + esc(d.hi) + '°</div>' +
            '<div class="lo">' + esc(d.lo) + '°</div></div>';
        }).join('');
        return '<div class="weather" id="weather" role="button" tabindex="0" ' +
          'aria-expanded="false" aria-label="Toronto weather, tap for the week">' +
          '<div class="summary">' +
            '<span class="ico">' + esc(w.icon) + '</span>' +
            '<span class="city">Toronto</span>' +
            '<span class="temp">' + esc(w.high) + '° / ' + esc(w.low) + '°</span>' +
            '<span class="muted">' + esc(w.condition) + '</span>' +
            '<span class="muted">Rain ' + esc(w.rain) + '</span>' +
            '<span class="muted">Wind ' + esc(w.wind) + '</span>' +
            '<span class="chev" id="wchev">▼</span>' +
          '</div>' +
          '<div class="week" id="wweek" style="display:none">' + week + '</div>' +
        '</div>';
      }

      function tabsHtml() {
        return '<div class="tabs" role="tablist">' + data.sections.map(function (s) {
          var on = s.id === state.active;
          return '<button class="tab' + (on ? ' active' : '') + '" role="tab" ' +
            'aria-selected="' + on + '" data-tab="' + esc(s.id) + '">' + esc(s.label) + '</button>';
        }).join('') + '</div>';
      }

      function cardHtml(st, sectionLabel) {
        var open = st.id === state.openId;
        var tag = st.tag
          ? '<span class="tag ' + (isHotTag(st.tag) ? 'hot' : 'cool') + '">' + esc(st.tag) + '</span>'
          : '';
        var kicker = st.kicker ? '<div class="kicker">' + tag + esc(st.kicker) + '</div>' : '';
        var sub = st.sub ? '<div class="sub">' + esc(st.sub) + '</div>' : '';
        var expand = '';
        if (open) {
          var img = st.image
            ? '<img src="' + esc(st.image) + '" alt="' + esc(st.headline) + '" ' +
              'loading="lazy" onerror="this.remove()" />'
            : '';
          var analysis = st.analysis
            ? '<div class="analysis"><span class="alabel">Why it matters</span>' + esc(st.analysis) + '</div>'
            : '';
          var link = st.link
            ? '<a class="readmore" href="' + esc(st.link) + '" target="_blank" rel="noopener">Read full story →</a>'
            : '';

          // Prefill the destinations at render time so a long press ("open in
          // app") carries the prompt too, instead of us intercepting the tap.
          var q = encodeURIComponent(buildPrompt(st, sectionLabel));
          // No target="_blank" on these two. In a standalone PWA a blank target
          // opens an in-app browser sheet, which iOS will not hand off to an
          // installed app; a plain top-level tap is what lets the Claude and
          // ChatGPT apps claim their own domains as Universal Links. "Read full
          // story" keeps _blank, because a news site does belong in a tab.
          var share = navigator.share
            ? '<button class="ask-opt" data-ai="share" data-id="' + esc(st.id) + '">Share to app…</button>'
            : '';
          var actions = '<div class="actions">' + link +
            '<button class="askai" data-ask="' + esc(st.id) + '" aria-expanded="false" ' +
              'aria-controls="ask-' + esc(st.id) + '">Ask AI ▾</button></div>' +
            '<div class="ask-panel" id="ask-' + esc(st.id) + '">' +
              '<div class="ask-row">' +
                '<a class="ask-opt" href="https://claude.ai/new?q=' + esc(q) + '">Claude</a>' +
                '<a class="ask-opt" href="https://chatgpt.com/?q=' + esc(q) + '">ChatGPT</a>' +
                share +
                '<button class="ask-opt" data-ai="copy" data-id="' + esc(st.id) + '">Copy</button>' +
              '</div>' +
              '<div class="ask-note">Opens in the app if you have it installed. The reply ' +
                'starts with the gist in a few lines, then goes deeper, then offers three ' +
                'follow-up questions.</div>' +
            '</div>';

          expand = '<div class="expand">' + img +
            '<p class="sumtext">' + esc(st.summary) + '</p>' + analysis + actions + '</div>';
        }
        return '<div class="card' + (st.lead ? ' lead' : '') + (open ? ' open' : '') +
          '" data-card="' + esc(st.id) + '" role="button" tabindex="0" ' +
          'aria-expanded="' + open + '">' +
          '<div class="row"><div class="row-main">' + kicker +
            '<div class="headline">' + esc(st.headline) + '</div>' + sub +
            '<div class="time">' + esc(st.time) + '</div></div>' +
            '<div class="toggle" aria-hidden="true">' + (open ? '−' : '+') + '</div>' +
          '</div>' + expand +
        '</div>';
      }

      function storiesInner() {
        var section = data.sections.filter(function (s) { return s.id === state.active; })[0];
        if (!section) return '';
        if (!section.stories || !section.stories.length) {
          return '<div class="empty">Nothing filed for ' + esc(section.label) + ' this morning.</div>';
        }
        return section.stories.map(function (st) {
          return cardHtml(st, section.label);
        }).join('');
      }

      // Quietly flag a saved (not-today) edition served from cache/offline.
      function staleRibbon() {
        try {
          var meta = document.querySelector('meta[name=build]');
          if (!meta) return '';
          var built = new Date(meta.getAttribute('content'));
          if (isNaN(built.getTime())) return '';
          var opt = { timeZone: 'America/Toronto' };
          if (built.toLocaleDateString('en-CA', opt) < new Date().toLocaleDateString('en-CA', opt)) {
            return '<div class="stale">Saved edition · ' + esc(data.date) + '</div>';
          }
        } catch (e) {}
        return '';
      }

      function appHtml() {
        return '<div class="masthead">' +
            '<div class="date">' + esc(data.date) + '</div>' +
            '<div class="title">THE DAILY</div>' +
            '<div class="tagline">' + esc(taglineText()) + '</div>' +
          '</div>' +
          staleRibbon() +
          weatherHtml(data.weather) +
          tabsHtml() +
          '<div class="stories" id="stories">' + storiesInner() + '</div>' +
          '<div class="footer">THE DAILY · TORONTO · Tap any headline to read</div>';
      }

      var app = document.getElementById('app');

      // Rebuild only the stories column; masthead, weather, and tab strip (and
      // their scroll/open state) are left untouched. This is what keeps a tap
      // from resetting the reader's place.
      function refreshStories() {
        document.getElementById('stories').innerHTML = storiesInner();
        bindCards();
      }

      function selectTab(id) {
        if (id === state.active) return;
        state.active = id;
        state.openId = null;
        var tabs = document.querySelectorAll('.tab');
        Array.prototype.forEach.call(tabs, function (t) {
          var on = t.getAttribute('data-tab') === id;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on);
          if (on) t.scrollIntoView({ inline: 'center', block: 'nearest' });
        });
        refreshStories();
        // Start the new section at the top, tab strip stuck under the notch.
        var tabsEl = document.querySelector('.tabs');
        if (tabsEl) window.scrollTo(0, tabsEl.offsetTop);
      }

      function toggleCard(id) {
        var y = window.scrollY;
        state.openId = state.openId === id ? null : id;
        refreshStories();
        window.scrollTo(0, y);   // grow/collapse in place, never jump
      }

      function bindWeather() {
        var weather = document.getElementById('weather');
        if (!weather) return;
        function toggle() {
          var week = document.getElementById('wweek');
          var chev = document.getElementById('wchev');
          var showing = week.style.display !== 'none';
          week.style.display = showing ? 'none' : 'flex';
          chev.textContent = showing ? '▼' : '▲';
          weather.setAttribute('aria-expanded', String(!showing));
        }
        weather.addEventListener('click', toggle);
        weather.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
        });
      }

      function bindTabs() {
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
          btn.addEventListener('click', function () { selectTab(btn.getAttribute('data-tab')); });
        });
      }

      function bindCards() {
        Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
          function activate(ev) {
            // Let links and the Ask AI controls handle their own activation.
            if (ev.target.closest('a, button')) return;
            // While open, only the header row collapses it, so reading (and
            // selecting) the body never closes the story by accident.
            if (card.classList.contains('open') && !ev.target.closest('.row')) return;
            toggleCard(card.getAttribute('data-card'));
          }
          card.addEventListener('click', activate);
          card.addEventListener('keydown', function (ev) {
            if (ev.key !== 'Enter' && ev.key !== ' ') return;
            // Never swallow the key from a control that acts on it itself.
            if (ev.target.closest('a, button')) return;
            ev.preventDefault();
            activate(ev);
          });
          bindAsk(card);
        });
      }

      // Panel state is held in the DOM, not in `state`, so opening the
      // destinations never triggers a stories rebuild and never moves the page.
      function bindAsk(card) {
        var toggle = card.querySelector('.askai');
        if (!toggle) return;
        var panel = card.querySelector('.ask-panel');

        toggle.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var open = panel.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(open));
          toggle.textContent = open ? 'Ask AI ▴' : 'Ask AI ▾';
        });

        Array.prototype.forEach.call(panel.querySelectorAll('[data-ai]'), function (el) {
          var kind = el.getAttribute('data-ai');
          el.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var found = findStory(el.getAttribute('data-id'));
            if (!found) return;
            var prompt = buildPrompt(found.story, found.label);

            if (kind === 'share') {
              navigator.share({ text: prompt }).catch(function () {});
              return;
            }
            var label = el.textContent;
            copyText(prompt).then(function () {
              el.textContent = 'Copied';
            }).catch(function () {
              el.textContent = 'Copy failed';
            }).then(function () {
              setTimeout(function () { el.textContent = label; }, 1800);
            });
          });
        });
      }

      app.innerHTML = appHtml();
      bindWeather();
      bindTabs();
      bindCards();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
