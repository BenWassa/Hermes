  <style>
    /* ---- Design tokens: The Morning Broadsheet ------------------------- */
    :root {
      --paper: #faf8f3;        /* the sheet (warm white, never #fff) */
      --desk: #efece6;         /* the desk beyond the column */
      --ink: #17130d;          /* headlines / primary text */
      --ink-sub: #453f38;      /* standfirsts */
      --ink-muted: #635d54;    /* inactive tabs */
      --meta: #6c665c;         /* timestamps, dateline, footer (>=AA small) */
      --rule: #dcd6cc;         /* hairline between cards */
      --rule-soft: #e3ded4;    /* hairline inside an opened card */
      --navy: #1a2744;         /* structural ink */
      --navy-ink: #1a2744;     /* navy used as text (links, active tab) */
      --red: #8b1a1a;          /* editorial heat */
      --tint-open: #f2ede4;    /* ground of an expanded card */
      --tint-analysis: #ece6da;/* ground of the why-it-matters note */
      --strip-bg: #1a2744;     /* weather strip */
      --strip-ink: #f7f4ee;
      --chip-hot: #8b1a1a;     /* DEVELOPING / WAR-class flags */
      --chip-cool: #1a2744;    /* procedural flags (FINAL, EDITORIAL) */
      --chip-ink: #faf8f3;
      --focus: #1a2744;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151a22;      /* lamplight edition: deep navy-black paper */
        --desk: #0e1219;
        --ink: #e9e3d5;        /* cream ink */
        --ink-sub: #bcb6a8;
        --ink-muted: #948e82;
        --meta: #8f897d;
        --rule: #2a303a;
        --rule-soft: #2f3540;
        --navy: #6f82a8;       /* structure lifted so it reads on dark */
        --navy-ink: #a3b3d2;
        --red: #d1726b;        /* desaturated heat */
        --tint-open: #1b212b;
        --tint-analysis: #20262f;
        --strip-bg: #1b2334;
        --strip-ink: #e9e3d5;
        --chip-hot: #a8443c;
        --chip-cool: #3b4a6c;
        --chip-ink: #f0eadc;
        --focus: #a3b3d2;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 100%; }
    html, body { background: var(--desk); }
    body {
      font-family: 'Georgia', serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--paper);
      max-width: 680px;
      margin: 0 auto;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Masthead */
    .masthead {
      border-bottom: 4px solid var(--navy);
      padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
      background: var(--paper);
    }
    .masthead .date {
      font-size: 0.6875rem; color: var(--meta); letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .masthead .title {
      font-size: 2.375rem; font-weight: 700; letter-spacing: -0.01em;
      color: var(--navy); line-height: 1; margin-bottom: 2px;
    }
    .masthead .tagline {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; color: var(--meta);
      letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* Stale-edition ribbon */
    .stale {
      background: var(--tint-analysis); color: var(--meta);
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; text-align: center;
      padding: 7px 20px;
    }

    /* Weather strip */
    .weather {
      background: var(--strip-bg); color: var(--strip-ink);
      cursor: pointer; user-select: none;
    }
    .weather .summary {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
      min-height: 44px;
    }
    .weather .summary::-webkit-scrollbar { display: none; }
    .weather .ico { font-size: 1.375rem; }
    .weather .city { font-weight: 700; font-size: 0.9375rem; }
    .weather .temp { font-size: 0.9375rem; }
    .weather .muted { opacity: 0.72; font-size: 0.8125rem; white-space: nowrap; }
    .weather .chev { margin-left: auto; opacity: 0.6; font-size: 0.75rem; }
    .weather .week {
      display: flex; border-top: 1px solid rgba(255,255,255,0.12);
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
    }
    .weather .week::-webkit-scrollbar { display: none; }
    .weather .day {
      text-align: center; min-width: 52px; padding: 0 8px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .weather .day .d { font-size: 0.6875rem; opacity: 0.6; margin-bottom: 4px; }
    .weather .day .i { font-size: 1.125rem; }
    .weather .day .hi { font-size: 0.8125rem; font-weight: 700; margin-top: 4px; }
    .weather .day .lo { font-size: 0.6875rem; opacity: 0.5; }

    /* Tab nav */
    .tabs {
      display: flex; overflow-x: auto; border-bottom: 2px solid var(--navy);
      background: var(--paper); scrollbar-width: none;
      position: sticky; top: 0; z-index: 10;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; min-height: 44px; display: flex; align-items: center;
      padding: 0 18px; border: none; background: none; cursor: pointer;
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; font-weight: 700;
      color: var(--ink-muted); border-bottom: 3px solid transparent;
      margin-bottom: -2px; letter-spacing: 0.12em; text-transform: uppercase;
      transition: color 0.15s;
    }
    .tab.active { color: var(--navy-ink); border-bottom-color: var(--navy); }

    /* Stories */
    .stories { padding: 8px 20px 40px; }
    .empty {
      padding: 40px 4px; text-align: center; color: var(--meta);
      font-style: italic; font-size: 0.9375rem;
    }
    .card {
      border-top: 1px solid var(--rule); padding: 14px 0; cursor: pointer;
      background: var(--paper); transition: background 0.15s;
    }
    .card.lead { border-top: 3px solid var(--navy); padding: 20px 0 16px; }
    .card.open { background: var(--tint-open); }
    .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card .row-main { flex: 1; min-width: 0; }
    .card .kicker {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; color: var(--red); margin-bottom: 6px; text-transform: uppercase;
    }
    .card .tag {
      color: var(--chip-ink); padding: 2px 6px; margin-right: 8px;
      font-size: 0.5625rem; border-radius: 2px; vertical-align: 1px;
    }
    .card .tag.hot { background: var(--chip-hot); }
    .card .tag.cool { background: var(--chip-cool); }
    .card .headline {
      font-size: 1.0625rem; font-weight: 700; line-height: 1.25; color: var(--ink); margin-bottom: 6px;
    }
    .card.lead .headline { font-size: 1.375rem; }
    .card .sub {
      font-size: 0.875rem; color: var(--ink-sub); line-height: 1.4; margin-bottom: 4px; font-style: italic;
    }
    .card .time { font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta); margin-top: 4px; }
    .card .toggle { color: var(--navy-ink); opacity: 0.5; font-size: 1.125rem; flex-shrink: 0; margin-top: 2px; }
    .card .expand {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    }
    .card .expand .sumtext {
      font-size: 0.9375rem; color: var(--ink-sub); line-height: 1.7;
    }
    .card .expand img {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      background: var(--tint-open); border-radius: 3px; margin-bottom: 12px;
    }
    .card .analysis {
      margin-top: 12px; padding: 10px 14px; background: var(--tint-analysis);
      font-size: 0.875rem; line-height: 1.6; color: var(--ink-sub); font-style: italic;
    }
    .card .analysis .alabel {
      display: block; font-family: 'Arial', sans-serif; font-style: normal;
      font-size: 0.625rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--navy-ink); margin-bottom: 4px;
    }
    .card .readmore {
      display: inline-block; margin-top: 12px; min-height: 44px; line-height: 44px;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink); text-decoration: none;
    }
    .card .readmore:hover { text-decoration: underline; }
    .card .readmore:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    /* Ask AI: hand the clipping and a briefing prompt to a model */
    .card .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .askai, .card .ask-opt {
      border: none; background: none; padding: 0; cursor: pointer;
      min-height: 44px; line-height: 44px; text-decoration: none;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink);
    }
    .card .askai { margin-top: 12px; }
    .card .askai:hover, .card .ask-opt:hover { text-decoration: underline; }
    .card .askai:focus-visible, .card .ask-opt:focus-visible {
      outline: 2px solid var(--focus); outline-offset: 3px;
    }
    .card .ask-panel { display: none; border-top: 1px solid var(--rule-soft); margin-top: 4px; }
    .card .ask-panel.open { display: block; }
    .card .ask-row { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .ask-note {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.55;
      color: var(--meta); letter-spacing: 0.02em; padding-bottom: 12px;
    }

    /* Footer */
    .footer {
      border-top: 2px solid var(--navy);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta);
      text-align: center; letter-spacing: 0.06em;
    }
    .notice { padding: 40px 20px; text-align: center; color: var(--meta); font-style: italic; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>

2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/0/ff/0ff89b98-e9d9-5fe1-913b-5d00072c1949/6a96fdc62c00b.image.jpg?resize=300%2C221", "link": "https://www.thestar.com/entertainment/movies/hot-docs-hires-documentary-film-veteran-as-it-turnaround-effort-enters-a-new-phase/article_cdf30959-f8dd-46c5-b093-a2196fd78b6e.html"}]}, {"id": "world", "label": "World", "stories": [{"id": "w1", "lead": true, "kicker": "GLOBAL POLITICS", "headline": "China and US Offer Competing Showcases of Global Power", "sub": "Xi Jinping meets with Russia and Iran leaders, while Europe challenges Trump administration at the G20.", "summary": "The global stage is witnessing a split-screen view of international power dynamics, with China and the United States presenting competing visions. Chinese President Xi Jinping gathered with the leaders of Russia and Iran, showcasing a united front among these nations. Concurrently, European leaders at the G20 summit challenged the Trump administration, highlighting a divergence in Western alliances. This dual narrative underscores a changing world order and increasing geopolitical fragmentation.", "analysis": "The simultaneous gatherings reflect a deepening ideological and strategic divide between major global powers. China's outreach to Russia and Iran solidifies an alternative bloc, while European resistance to US policies signals a potential realignment of traditional alliances, impacting future international cooperation and trade.", "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/09/01/world/01int-shanghai-g20-social-promo/01int-shanghai-g20-social-promo-superJumbo.jpg", "link": "https://www.nytimes.com/2026/09/01/world/asia/g20-meeting-china-trump-bishkek.html"}, {"id": "w2", "lead": false, "kicker": "AFRICA", "headline": "Ebola Ravages Bunia, Coffin Makers at Center of Safe Burial Debate", "sub": "The virus has put coffin makers in Bunia at the heart of discussions surrounding safe burial practices.", "summary": "In Bunia, a city ravaged by Ebola, coffin makers find themselves at the center of a debate surrounding safe burial practices. While several makers assert they are providing a crucial public service, the ongoing virus outbreak has highlighted the complexities and risks associated with traditional burial customs. Efforts to control the spread of Ebola often conflict with cultural practices, making safe burials a critical public health challenge.", "analysis": null, "time": "Yesterday", "tag": "HEALTH", "sensitivity": true, "image": null, "link": "https://www.nytimes.com/2026/09/01/world/africa/congo-ebola-coffins.html"}, {"id": "w3", "lead": false, "kicker": "JAPAN", "headline": "Japan Halves Speed Limit to 30km/h on Narrow City Streets", "sub": "The new regulation applies to approximately 70% of general roads, aiming to enhance urban safety.", "summary": "Japan has implemented a new regulation, halving the speed limit to 30km/h on all narrow city streets. This change, down from 60km/h, affects roughly 70% of general roads across the country. The initiative aims to significantly improve safety in crowded urban areas, reducing the risk of accidents for pedestrians and drivers alike.", "analysis": null, "time": "1:15 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/239bad6d4d630d5c23de374c64025bb65a23c595/0_1123_3620_2894/500.jpg", "link": "https://www.theguardian.com/world/2026/sep/02/japan-new-speed-limit-30kmh-narrow-city-streets"}, {"id": "w4", "lead": false, "kicker": "HUMAN RIGHTS", "headline": "US Sanctions Isolate Aspiring Iranians From Study Abroad Exams", "sub": "New measures have forced the cancellation of English proficiency and graduate exams, hindering international ties.", "summary": "Recent US sanctions have led to the cancellation of English proficiency and graduate exams in Iran, effectively cutting off many aspiring Iranians from opportunities to study abroad. This isolation impacts those most eager to foster ties with the international community, limiting their access to global education and professional development. The measures are intensifying the challenges faced by Iranian students and academics.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/08/31/multimedia/00int-iran-educaton-01-ktjc/00int-iran-educaton-01-ktjc-superJumbo.jpg", "link": "https://www.nytimes.com/2026/09/01/world/middleeast/iran-study-abroad-sanctions.html"}]}, {"id": "sports", "label": "Sports", "stories": [{"id": "s1", "lead": true, "kicker": "NFL", "headline": "Rams Make Bold Moves, Bringing Aaron Donald Out of Retirement", "sub": "LA adds Myles Garrett and reunites with Donald to create what could be the NFL's most menacing defense.", "summary": "The Los Angeles Rams have made bold moves to bolster their defense, signing Myles Garrett and successfully coaxing Aaron Donald out of retirement. This formidable pairing is expected to create the NFL's most menacing defensive line, aiming to anchor a Super Bowl contender. While the talent is undeniable, a championship run is still not guaranteed, as the team integrates these high-profile additions.", "analysis": "The Rams' aggressive strategy to bring back a generational talent like Aaron Donald, combined with another elite pass rusher, signals a 'win now' mentality. This high-stakes gamble could either lead to immediate Super Bowl contention or create significant salary cap challenges if the desired results don't materialize.", "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/bd7d27c70d613d391d0fcc8ce3203ca58a3e75d8/638_0_6383_5106/500.jpg", "link": "https://www.theguardian.com/sport/2026/sep/02/los-angeles-rams-aaron-donald-myles-garrett-matthew-stafford"}, {"id": "s2", "lead": false, "kicker": "TENNIS", "headline": "Coco Gauff Serves Notice with Assured Start to US Open Title Pursuit", "sub": "The American star defeats Zeynep Sonmez 6-3, 6-4, showcasing her rebuilt serve and newfound calm.", "summary": "In-form Coco Gauff has made an assured start to her US Open title pursuit, defeating Zeynep Sonmez 6-3, 6-4 in the first round. The American showcased her rebuilt serve and a newfound calm on court, passing an encouraging initial test at Flushing Meadows. Gauff's performance signals her strong intentions for the tournament.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/81430bb3726af9e8e511256057acde0b5e2245bf/415_0_3871_3098/500.jpg", "link": "https://www.theguardian.com/sport/2026/sep/01/coco-gauff-zeynep-sonmez-us-open-first-round-tennis"}, {"id": "s3", "lead": false, "kicker": "CRICKET", "headline": "Hampshire U-Turns on Kuggeleijn Signing After Fan Backlash", "sub": "The county cricket club reverses its decision following significant negative reaction from supporters.", "summary": "Hampshire County Cricket Club has made a U-turn on its decision to sign Kuggeleijn, following a significant backlash from fans. The reversal comes as the County Championship enters its final month, with teams vying for top positions. The club's decision highlights the growing influence of fan sentiment on team management and player acquisitions.", "analysis": null, "time": "8:47 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/ff3509d8d30ce7a40ae62f6046eed01efcf811a7/325_0_3500_2800/500.jpg", "link": "https://www.theguardian.com/sport/live/2026/sep/02/somerset-v-glamorgan-notts-v-leicestershire-and-more-county-cricket-day-one-live"}, {"id": "s4", "lead": false, "kicker": "GOLF", "headline": "Tiger Woods Set for Plea Change in Florida DUI Case", "sub": "The golf legend is expected to alter his not guilty plea following a March rollover crash near his home.", "summary": "Tiger Woods is expected to change his not guilty plea in a DUI case stemming from a rollover crash in March near his Florida home. The golf legend's legal team is preparing for the plea alteration, which could impact the outcome of the high-profile case. Further details on the new plea are anticipated soon.", "analysis": null, "time": "12:35 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/9d0865d44789b1e819b9453bf18b212be19a37eb/0_71_1591_1274/500.jpg", "link": "https://www.theguardian.com/sport/2026/sep/02/tiger-woods-change-plea-dui-florida-crash"}]}, {"id": "business", "label": "Business", "stories": [{"id": "b1", "lead": true, "kicker": "ENERGY", "headline": "Chevron Expansion in Venezuela Extends US Influence Over Oil Riches", "sub": "The US energy giant will invest $7 billion to more than double its production, solidifying its presence.", "summary": "Chevron, the US energy giant, is set to invest $7 billion in Venezuela, aiming to more than double its oil production in the country. This significant expansion extends US influence over Venezuela's vast oil riches, as Chevron was one of the few Western companies to maintain operations after others withdrew. The move underscores the strategic importance of Venezuelan oil to global energy markets and US interests, despite ongoing political complexities.", "analysis": "Chevron's increased investment in Venezuela highlights a pragmatic shift in US energy policy, prioritizing access to oil resources amidst global supply concerns. This expansion could stabilize Venezuela's struggling economy while deepening US corporate ties, potentially influencing future diplomatic relations.", "time": "6:36 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/09/02/business/02biz-chevron-venezuela/02biz-chevron-venezuela-superJumbo.jpg", "link": "https://www.nytimes.com/2026/09/02/business/energy-environment/chevron-venezuela-oil-trump.html"}, {"id": "b2", "lead": false, "kicker": "AUTOMOTIVE", "headline": "Range Rover Launches First Electric Vehicle at £154,070", "sub": "The fully electric SUV is unveiled after a year-long delay, to be built at Jaguar Land Rover’s Solihull plant.", "summary": "Range Rover has officially launched its first fully electric vehicle, an SUV with a starting price of £154,070. The unveiling comes after a year-long delay and confirms that the luxury EV will be manufactured at Jaguar Land Rover’s plant in Solihull. This marks a significant step for the iconic brand into the rapidly expanding electric vehicle market.", "analysis": null, "time": "5:08 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/d445f7f198b16669700973a152ed8edc4363e6bd/2068_0_6789_5434/500.jpg", "link": "https://www.theguardian.com/business/2026/sep/02/range-rover-launches-first-electric-vehicle"}, {"id": "b3", "lead": false, "kicker": "AIRLINES", "headline": "Ryanair Warns European Air Fares Will Jump Next Year if Oil Prices Stay High", "sub": "The budget carrier cuts passenger targets, citing exposure to 'unhedged winter oil' and potential airline bankruptcies.", "summary": "Ryanair has issued a warning that air fares across Europe are set to jump next year if current high oil prices persist. The budget airline announced cuts to its passenger targets to reduce exposure to 'unhedged winter oil,' indicating that sustained high fuel costs could lead to other airlines going bust. This forecast signals potential challenges for the travel industry and consumers.", "analysis": null, "time": "4:58 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/b52864d4c0b9d2ab7fa534706c339430bddbd71f/183_0_2102_1682/500.jpg", "link": "https://www.theguardian.com/business/2026/sep/02/ryanair-warns-air-fares-europe-jump-next-year-oil-price-stays-high"}, {"id": "b4", "lead": false, "kicker": "HEALTHCARE", "headline": "Employer Health Costs Expected to Spike 11 Percent in 2027", "sub": "A new US survey anticipates the highest increase in decades unless benefits are significantly cut.", "summary": "A new US survey projects an average increase of 11 percent in employer health costs for 2027, marking the highest rate in decades. This sharp rise is anticipated unless companies implement significant cuts to employee benefits. The findings indicate growing financial pressure on businesses and employees regarding healthcare coverage.", "analysis": null, "time": "6:00 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/09/02/multimedia/02biz-insurers-pvqm/02biz-insurers-pvqm-superJumbo.jpg", "link": "https://www.nytimes.com/2026/09/02/business/health-insurance-increases.html"}]}, {"id": "opinion", "label": "Opinion", "stories": [{"id": "o1", "lead": true, "kicker": "UK POLITICS", "headline": "Andy Burnham's 'Mistake' Over Political Donations Will Cost His Premiership", "sub": "Columnist George Monbiot argues subservience to the wealthy will tie the Prime Minister's hands on pressing issues.", "summary": "Prime Minister Andy Burnham has made a critical mistake regarding political donations that will ultimately cost him his premiership, according to Guardian columnist George Monbiot. Monbiot contends that Burnham's perceived subservience to wealthy interests has tied his hands, rendering him unable to effectively tackle Britain’s most pressing issues. This perceived lack of independence, Monbiot argues, will undermine his ability to govern and deliver meaningful change for the country.", "analysis": "This commentary suggests that public perception of political integrity, particularly concerning financial influence, is paramount for a leader's long-term viability. Monbiot's critique implies that Burnham's early actions on donations could define his administration, limiting his capacity to enact a progressive agenda and potentially alienating his base.", "time": "1:00 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/ed3c2b874fa7b8e58b80a7c0dd6f17673e9a8b00/625_0_3750_3000/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/sep/02/andy-burnham-mistake-political-donations-wealthy-britain"}, {"id": "o2", "lead": false, "kicker": "US POLITICS", "headline": "Trump's Threat Against NBC Journalist is an Attack on Reality", "sub": "Margaret Sullivan argues the President's call for FCC scrutiny of Kristin Welker's remarks shows desperation.", "summary": "President Trump's threat against an NBC journalist, Kristin Welker, and his call for the FCC to scrutinize her 'innocuous remarks' is an attack on reality, according to columnist Margaret Sullivan. Sullivan suggests that the President's actions are a sign of desperation, aiming to control narratives and undermine journalistic credibility. This move raises concerns about press freedom and the administration's relationship with the media.", "analysis": null, "time": "7:00 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/24e8ca044b3f54495a52174c7b64424e5c29af5b/250_0_2500_2000/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/sep/02/trump-nbc-fcc-kristin-welker"}, {"id": "o3", "lead": false, "kicker": "GERMAN POLITICS", "headline": "Shadow of AfD Hangs Over German Democracy, But Faith Remains", "sub": "Author John Kampfner reflects on five years of citizenship as the far-right AfD gains ground in Saxony-Anhalt.", "summary": "As the far-right AfD party is poised to take control in Saxony-Anhalt, the shadow of its influence hangs over German democracy, writes author John Kampfner. Celebrating five years of German citizenship, Kampfner expresses continued faith in his adopted country, emphasizing that courage is needed to defeat the rising far-right movement. His commentary highlights the ongoing struggle to preserve democratic values in the face of extremist political gains.", "analysis": null, "time": "12:00 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/22c9e3388470db226e5cccd974b233b78e28cc0c/254_0_4763_3810/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/sep/02/germany-afd-democracy-country-citizenship-far-right"}, {"id": "o4", "lead": false, "kicker": "ENVIRONMENT", "headline": "Thames Water: I Refuse to Pay Sewage Charge While Rivers are Polluted", "sub": "Green party peer Jenny Jones pledges to take a stand against the utility company's pollution practices.", "summary": "Green party peer Jenny Jones has declared her refusal to pay the sewage charge on her Thames Water bill, citing the company's continued pollution of Britain's rivers and coastlines. Jones states she will calmly await any legal action, asserting her commitment to take a stand where the government has not. Her protest highlights public frustration with water quality and corporate accountability.", "analysis": null, "time": "6:00 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/a1ba4de3336296401476b29b93882f68c1d095dc/366_0_4536_3630/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/sep/02/thames-water-sewage-charge-bill-pollute-britain-river-coastline"}]}]}</script>

  <script>
    (function () {
      var raw = document.getElementById('edition').textContent;
      var data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<div class="notice">No edition loaded. Run the build to generate today’s paper.</div>';
        return;
      }

      var state = { active: (data.sections[0] || {}).id, openId: null };

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Editorial heat flags keep the red chip; procedural flags cool to navy,
      // so a red chip still means something (the Scarce Red Rule).
      function isHotTag(t) {
        return /^(DEVELOPING|BREAKING|LIVE|WAR|ALERT|URGENT)$/i.test(t || '');
      }

      // ---- Ask AI ----------------------------------------------------------
      // The reader taps one story and gets a briefing, not a chat. The prompt
      // does three jobs: hand over the clipping, name the shape of the answer
      // (five parts, ~500 words, hard ceiling), and set up the follow-up so the
      // conversation continues without the reader having to think of a question.
      // Voice constraints mirror src/config.py HOUSE_VOICE, em dash ban included.
      function buildPrompt(st, sectionLabel) {
        var L = [];
        L.push('I read this in my morning paper and I want to understand it properly.');
        L.push('');
        L.push('THE CLIPPING');
        L.push('Headline: ' + st.headline);
        if (st.sub) L.push('Standfirst: ' + st.sub);
        if (st.summary) L.push('Summary: ' + st.summary);
        if (st.analysis) L.push("My paper's why-it-matters note: " + st.analysis);
        L.push('Section: ' + sectionLabel + '. Filed ' + (st.time || 'this morning') +
               ', edition of ' + data.date + '.');
        if (st.link) L.push('Source: ' + st.link);
        L.push('');
        L.push('WHAT I WANT');
        L.push('A briefing that leaves me genuinely informed, not a restatement of what I just');
        L.push('pasted. Assume I know nothing beyond the clipping above.');
        L.push('');
        L.push('Check current reporting first if you are able to search. My clipping is a');
        L.push('summary and may be incomplete or already overtaken by events. If you cannot');
        L.push('search, say so in one line at the top, then separate what you are confident');
        L.push('about from what you would want verified.');
        L.push('');
        L.push('STRUCTURE');
        L.push('I am reading this on a phone. Build the answer in layers, heaviest first, so');
        L.push('I can stop at the end of any layer and still have got something whole. Use');
        L.push('these markdown headings exactly, so they render large on a small screen.');
        L.push('');
        L.push('# The gist');
        L.push('An H1 of six to ten words stating the actual point, not the topic. Then two or');
        L.push('three short sentences giving me the whole story in plain words. If I read');
        L.push('nothing else, this is what I walk away knowing. Correct my clipping here if it');
        L.push('is wrong or out of date.');
        L.push('');
        L.push('## Why it matters');
        L.push('Two or three short sentences on the stakes and the second order effects. Be');
        L.push('concrete about who gains, who pays, how much, and by when.');
        L.push('');
        L.push('## How we got here');
        L.push('Only the background I need to follow this story. Not a history lecture.');
        L.push('');
        L.push('## Where it is contested');
        L.push('The strongest disagreement among serious people, put fairly. If it is genuinely');
        L.push('uncontested, say so in one sentence and move on.');
        L.push('');
        L.push('## What to watch');
        L.push('Three bullets, each a specific checkable marker with a rough timeframe.');
        L.push('');
        L.push('## Ask me next');
        L.push('Three numbered questions, ordered by what would teach me the most. I will reply');
        L.push('with a digit.');
        L.push('');
        L.push('READING ON A PHONE');
        L.push('Short paragraphs: three sentences at most, none longer than about sixty words,');
        L.push('with a blank line between them. No tables, no nested bullets, no wall of text.');
        L.push('Around 500 words in total. Hard ceiling 650. Do not pad to reach a length; the');
        L.push('gist and why it matters are worth more than the sections under them.');
        L.push('');
        L.push('VOICE');
        L.push('Financial Times, not an encyclopedia and not a chatbot. Plain, confident,');
        L.push('concrete. Specifics over abstractions: names, numbers, dates, stakes. Every');
        L.push('sentence earns its place. No preamble, no throat clearing, no restating my');
        L.push('prompt back to me, no hedging filler, no em dashes. Where you are uncertain,');
        L.push('mark it in the sentence it applies to rather than in a disclaimer paragraph.');
        return L.join('\n');
      }

      function findStory(id) {
        for (var i = 0; i < data.sections.length; i++) {
          var list = data.sections[i].stories || [];
          for (var j = 0; j < list.length; j++) {
            if (list[j].id === id) {
              return { story: list[j], label: data.sections[i].label };
            }
          }
        }
        return null;
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        // Older iOS standalone PWAs land here.
        return new Promise(function (resolve, reject) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('copy failed'));
        });
      }

      // Tagline reflects the sections the edition actually shipped, not a
      // hardcoded list that can disagree with the paper.
      function taglineText() {
        var labels = data.sections
          .filter(function (s) { return s.id !== 'front'; })
          .map(function (s) { return s.label; });
        return (labels.length ? labels : ['Toronto', 'World', 'Business']).join(' · ');
      }

      function weatherHtml(w) {
        if (!w || !w.icon) return '';
        var week = (w.week || []).map(function (d) {
          return '<div class="day"><div class="d">' + esc(d.day) + '</div>' +
            '<div class="i">' + esc(d.icon) + '</div>' +
            '<div class="hi">' + esc(d.hi) + '°</div>' +
            '<div class="lo">' + esc(d.lo) + '°</div></div>';
        }).join('');
        return '<div class="weather" id="weather" role="button" tabindex="0" ' +
          'aria-expanded="false" aria-label="Toronto weather, tap for the week">' +
          '<div class="summary">' +
            '<span class="ico">' + esc(w.icon) + '</span>' +
            '<span class="city">Toronto</span>' +
            '<span class="temp">' + esc(w.high) + '° / ' + esc(w.low) + '°</span>' +
            '<span class="muted">' + esc(w.condition) + '</span>' +
            '<span class="muted">Rain ' + esc(w.rain) + '</span>' +
            '<span class="muted">Wind ' + esc(w.wind) + '</span>' +
            '<span class="chev" id="wchev">▼</span>' +
          '</div>' +
          '<div class="week" id="wweek" style="display:none">' + week + '</div>' +
        '</div>';
      }

      function tabsHtml() {
        return '<div class="tabs" role="tablist">' + data.sections.map(function (s) {
          var on = s.id === state.active;
          return '<button class="tab' + (on ? ' active' : '') + '" role="tab" ' +
            'aria-selected="' + on + '" data-tab="' + esc(s.id) + '">' + esc(s.label) + '</button>';
        }).join('') + '</div>';
      }

      function cardHtml(st, sectionLabel) {
        var open = st.id === state.openId;
        var tag = st.tag
          ? '<span class="tag ' + (isHotTag(st.tag) ? 'hot' : 'cool') + '">' + esc(st.tag) + '</span>'
          : '';
        var kicker = st.kicker ? '<div class="kicker">' + tag + esc(st.kicker) + '</div>' : '';
        var sub = st.sub ? '<div class="sub">' + esc(st.sub) + '</div>' : '';
        var expand = '';
        if (open) {
          var img = st.image
            ? '<img src="' + esc(st.image) + '" alt="' + esc(st.headline) + '" ' +
              'loading="lazy" onerror="this.remove()" />'
            : '';
          var analysis = st.analysis
            ? '<div class="analysis"><span class="alabel">Why it matters</span>' + esc(st.analysis) + '</div>'
            : '';
          var link = st.link
            ? '<a class="readmore" href="' + esc(st.link) + '" target="_blank" rel="noopener">Read full story →</a>'
            : '';

          // Prefill the destinations at render time so a long press ("open in
          // app") carries the prompt too, instead of us intercepting the tap.
          var q = encodeURIComponent(buildPrompt(st, sectionLabel));
          // No target="_blank" on these two. In a standalone PWA a blank target
          // opens an in-app browser sheet, which iOS will not hand off to an
          // installed app; a plain top-level tap is what lets the Claude and
          // ChatGPT apps claim their own domains as Universal Links. "Read full
          // story" keeps _blank, because a news site does belong in a tab.
          var share = navigator.share
            ? '<button class="ask-opt" data-ai="share" data-id="' + esc(st.id) + '">Share to app…</button>'
            : '';
          var actions = '<div class="actions">' + link +
            '<button class="askai" data-ask="' + esc(st.id) + '" aria-expanded="false" ' +
              'aria-controls="ask-' + esc(st.id) + '">Ask AI ▾</button></div>' +
            '<div class="ask-panel" id="ask-' + esc(st.id) + '">' +
              '<div class="ask-row">' +
                '<a class="ask-opt" href="https://claude.ai/new?q=' + esc(q) + '">Claude</a>' +
                '<a class="ask-opt" href="https://chatgpt.com/?q=' + esc(q) + '">ChatGPT</a>' +
                share +
                '<button class="ask-opt" data-ai="copy" data-id="' + esc(st.id) + '">Copy</button>' +
              '</div>' +
              '<div class="ask-note">Opens in the app if you have it installed. The reply ' +
                'starts with the gist in a few lines, then goes deeper, then offers three ' +
                'follow-up questions.</div>' +
            '</div>';

          expand = '<div class="expand">' + img +
            '<p class="sumtext">' + esc(st.summary) + '</p>' + analysis + actions + '</div>';
        }
        return '<div class="card' + (st.lead ? ' lead' : '') + (open ? ' open' : '') +
          '" data-card="' + esc(st.id) + '" role="button" tabindex="0" ' +
          'aria-expanded="' + open + '">' +
          '<div class="row"><div class="row-main">' + kicker +
            '<div class="headline">' + esc(st.headline) + '</div>' + sub +
            '<div class="time">' + esc(st.time) + '</div></div>' +
            '<div class="toggle" aria-hidden="true">' + (open ? '−' : '+') + '</div>' +
          '</div>' + expand +
        '</div>';
      }

      function storiesInner() {
        var section = data.sections.filter(function (s) { return s.id === state.active; })[0];
        if (!section) return '';
        if (!section.stories || !section.stories.length) {
          return '<div class="empty">Nothing filed for ' + esc(section.label) + ' this morning.</div>';
        }
        return section.stories.map(function (st) {
          return cardHtml(st, section.label);
        }).join('');
      }

      // Quietly flag a saved (not-today) edition served from cache/offline.
      function staleRibbon() {
        try {
          var meta = document.querySelector('meta[name=build]');
          if (!meta) return '';
          var built = new Date(meta.getAttribute('content'));
          if (isNaN(built.getTime())) return '';
          var opt = { timeZone: 'America/Toronto' };
          if (built.toLocaleDateString('en-CA', opt) < new Date().toLocaleDateString('en-CA', opt)) {
            return '<div class="stale">Saved edition · ' + esc(data.date) + '</div>';
          }
        } catch (e) {}
        return '';
      }

      function appHtml() {
        return '<div class="masthead">' +
            '<div class="date">' + esc(data.date) + '</div>' +
            '<div class="title">THE DAILY</div>' +
            '<div class="tagline">' + esc(taglineText()) + '</div>' +
          '</div>' +
          staleRibbon() +
          weatherHtml(data.weather) +
          tabsHtml() +
          '<div class="stories" id="stories">' + storiesInner() + '</div>' +
          '<div class="footer">THE DAILY · TORONTO · Tap any headline to read</div>';
      }

      var app = document.getElementById('app');

      // Rebuild only the stories column; masthead, weather, and tab strip (and
      // their scroll/open state) are left untouched. This is what keeps a tap
      // from resetting the reader's place.
      function refreshStories() {
        document.getElementById('stories').innerHTML = storiesInner();
        bindCards();
      }

      function selectTab(id) {
        if (id === state.active) return;
        state.active = id;
        state.openId = null;
        var tabs = document.querySelectorAll('.tab');
        Array.prototype.forEach.call(tabs, function (t) {
          var on = t.getAttribute('data-tab') === id;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on);
          if (on) t.scrollIntoView({ inline: 'center', block: 'nearest' });
        });
        refreshStories();
        // Start the new section at the top, tab strip stuck under the notch.
        var tabsEl = document.querySelector('.tabs');
        if (tabsEl) window.scrollTo(0, tabsEl.offsetTop);
      }

      function toggleCard(id) {
        var y = window.scrollY;
        state.openId = state.openId === id ? null : id;
        refreshStories();
        window.scrollTo(0, y);   // grow/collapse in place, never jump
      }

      function bindWeather() {
        var weather = document.getElementById('weather');
        if (!weather) return;
        function toggle() {
          var week = document.getElementById('wweek');
          var chev = document.getElementById('wchev');
          var showing = week.style.display !== 'none';
          week.style.display = showing ? 'none' : 'flex';
          chev.textContent = showing ? '▼' : '▲';
          weather.setAttribute('aria-expanded', String(!showing));
        }
        weather.addEventListener('click', toggle);
        weather.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
        });
      }

      function bindTabs() {
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
          btn.addEventListener('click', function () { selectTab(btn.getAttribute('data-tab')); });
        });
      }

      function bindCards() {
        Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
          function activate(ev) {
            // Let links and the Ask AI controls handle their own activation.
            if (ev.target.closest('a, button')) return;
            // While open, only the header row collapses it, so reading (and
            // selecting) the body never closes the story by accident.
            if (card.classList.contains('open') && !ev.target.closest('.row')) return;
            toggleCard(card.getAttribute('data-card'));
          }
          card.addEventListener('click', activate);
          card.addEventListener('keydown', function (ev) {
            if (ev.key !== 'Enter' && ev.key !== ' ') return;
            // Never swallow the key from a control that acts on it itself.
            if (ev.target.closest('a, button')) return;
            ev.preventDefault();
            activate(ev);
          });
          bindAsk(card);
        });
      }

      // Panel state is held in the DOM, not in `state`, so opening the
      // destinations never triggers a stories rebuild and never moves the page.
      function bindAsk(card) {
        var toggle = card.querySelector('.askai');
        if (!toggle) return;
        var panel = card.querySelector('.ask-panel');

        toggle.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var open = panel.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(open));
          toggle.textContent = open ? 'Ask AI ▴' : 'Ask AI ▾';
        });

        Array.prototype.forEach.call(panel.querySelectorAll('[data-ai]'), function (el) {
          var kind = el.getAttribute('data-ai');
          el.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var found = findStory(el.getAttribute('data-id'));
            if (!found) return;
            var prompt = buildPrompt(found.story, found.label);

            if (kind === 'share') {
              navigator.share({ text: prompt }).catch(function () {});
              return;
            }
            var label = el.textContent;
            copyText(prompt).then(function () {
              el.textContent = 'Copied';
            }).catch(function () {
              el.textContent = 'Copy failed';
            }).then(function () {
              setTimeout(function () { el.textContent = label; }, 1800);
            });
          });
        });
      }

      app.innerHTML = appHtml();
      bindWeather();
      bindTabs();
      bindCards();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
