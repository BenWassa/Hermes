  <title>The Daily</title>
  <style>
    /* ---- Design tokens: The Morning Broadsheet ------------------------- */
    :root {
      --paper: #faf8f3;        /* the sheet (warm white, never #fff) */
      --desk: #efece6;         /* the desk beyond the column */
      --ink: #17130d;          /* headlines / primary text */
      --ink-sub: #453f38;      /* standfirsts */
      --ink-muted: #635d54;    /* inactive tabs */
      --meta: #6c665c;         /* timestamps, dateline, footer (>=AA small) */
      --rule: #dcd6cc;         /* hairline between cards */
      --rule-soft: #e3ded4;    /* hairline inside an opened card */
      --navy: #1a2744;         /* structural ink */
      --navy-ink: #1a2744;     /* navy used as text (links, active tab) */
      --red: #8b1a1a;          /* editorial heat */
      --tint-open: #f2ede4;    /* ground of an expanded card */
      --tint-analysis: #ece6da;/* ground of the why-it-matters note */
      --strip-bg: #1a2744;     /* weather strip */
      --strip-ink: #f7f4ee;
      --chip-hot: #8b1a1a;     /* DEVELOPING / WAR-class flags */
      --chip-cool: #1a2744;    /* procedural flags (FINAL, EDITORIAL) */
      --chip-ink: #faf8f3;
      --focus: #1a2744;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151a22;      /* lamplight edition: deep navy-black paper */
        --desk: #0e1219;
        --ink: #e9e3d5;        /* cream ink */
        --ink-sub: #bcb6a8;
        --ink-muted: #948e82;
        --meta: #8f897d;
        --rule: #2a303a;
        --rule-soft: #2f3540;
        --navy: #6f82a8;       /* structure lifted so it reads on dark */
        --navy-ink: #a3b3d2;
        --red: #d1726b;        /* desaturated heat */
        --tint-open: #1b212b;
        --tint-analysis: #20262f;
        --strip-bg: #1b2334;
        --strip-ink: #e9e3d5;
        --chip-hot: #a8443c;
        --chip-cool: #3b4a6c;
        --chip-ink: #f0eadc;
        --focus: #a3b3d2;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 100%; }
    html, body { background: var(--desk); }
    body {
      font-family: 'Georgia', serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--paper);
      max-width: 680px;
      margin: 0 auto;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Masthead */
    .masthead {
      border-bottom: 4px solid var(--navy);
      padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
      background: var(--paper);
    }
    .masthead .date {
      font-size: 0.6875rem; color: var(--meta); letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .masthead .title {
      font-size: 2.375rem; font-weight: 700; letter-spacing: -0.01em;
      color: var(--navy); line-height: 1; margin-bottom: 2px;
    }
    .masthead .tagline {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; color: var(--meta);
      letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* Stale-edition ribbon */
    .stale {
      background: var(--tint-analysis); color: var(--meta);
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; text-align: center;
      padding: 7px 20px;
    }

    /* Weather strip */
    .weather {
      background: var(--strip-bg); color: var(--strip-ink);
      cursor: pointer; user-select: none;
    }
    .weather .summary {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
      min-height: 44px;
    }
    .weather .summary::-webkit-scrollbar { display: none; }
    .weather .ico { font-size: 1.375rem; }
    .weather .city { font-weight: 700; font-size: 0.9375rem; }
    .weather .temp { font-size: 0.9375rem; }
    .weather .muted { opacity: 0.72; font-size: 0.8125rem; white-space: nowrap; }
    .weather .chev { margin-left: auto; opacity: 0.6; font-size: 0.75rem; }
    .weather .week {
      display: flex; border-top: 1px solid rgba(255,255,255,0.12);
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
    }
    .weather .week::-webkit-scrollbar { display: none; }
    .weather .day {
      text-align: center; min-width: 52px; padding: 0 8px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .weather .day .d { font-size: 0.6875rem; opacity: 0.6; margin-bottom: 4px; }
    .weather .day .i { font-size: 1.125rem; }
    .weather .day .hi { font-size: 0.8125rem; font-weight: 700; margin-top: 4px; }
    .weather .day .lo { font-size: 0.6875rem; opacity: 0.5; }

    /* Tab nav */
    .tabs {
      display: flex; overflow-x: auto; border-bottom: 2px solid var(--navy);
      background: var(--paper); scrollbar-width: none;
      position: sticky; top: 0; z-index: 10;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; min-height: 44px; display: flex; align-items: center;
      padding: 0 18px; border: none; background: none; cursor: pointer;
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; font-weight: 700;
      color: var(--ink-muted); border-bottom: 3px solid transparent;
      margin-bottom: -2px; letter-spacing: 0.12em; text-transform: uppercase;
      transition: color 0.15s;
    }
    .tab.active { color: var(--navy-ink); border-bottom-color: var(--navy); }

    /* Stories */
    .stories { padding: 8px 20px 40px; }
    .opinion-desk + .opinion-desk { margin-top: 24px; }
    .desk-head {
      border-top: 2px solid var(--navy); padding: 12px 0 8px; margin-top: 2px;
    }
    .desk-title {
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--navy-ink);
    }
    .desk-dek {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.45;
      color: var(--meta); margin-top: 3px;
    }
    .following-block .card { padding-top: 12px; padding-bottom: 12px; }
    .follow-meta {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.45;
      color: var(--meta); margin-top: 5px;
    }
    .opinion-desk .empty { padding: 24px 4px; }
    .empty {
      padding: 40px 4px; text-align: center; color: var(--meta);
      font-style: italic; font-size: 0.9375rem;
    }
    .card {
      border-top: 1px solid var(--rule); padding: 14px 0; cursor: pointer;
      background: var(--paper); transition: background 0.15s;
    }
    .card.lead { border-top: 3px solid var(--navy); padding: 20px 0 16px; }
    .card.open { background: var(--tint-open); }
    .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card .row-main { flex: 1; min-width: 0; }
    .card .kicker {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; color: var(--red); margin-bottom: 6px; text-transform: uppercase;
    }
    .card .tag {
      color: var(--chip-ink); padding: 2px 6px; margin-right: 8px;
      font-size: 0.5625rem; border-radius: 2px; vertical-align: 1px;
    }
    .card .tag.hot { background: var(--chip-hot); }
    .card .tag.cool { background: var(--chip-cool); }
    .card .headline {
      font-size: 1.0625rem; font-weight: 700; line-height: 1.25; color: var(--ink); margin-bottom: 6px;
    }
    .card.lead .headline { font-size: 1.375rem; }
    .card .sub {
      font-size: 0.875rem; color: var(--ink-sub); line-height: 1.4; margin-bottom: 4px; font-style: italic;
    }
    .card .time { font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta); margin-top: 4px; }
    .card .toggle { color: var(--navy-ink); opacity: 0.5; font-size: 1.125rem; flex-shrink: 0; margin-top: 2px; }
    .card .expand {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    }
    .card .expand .sumtext {
      font-size: 0.9375rem; color: var(--ink-sub); line-height: 1.7;
    }
    .card .expand img {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      background: var(--tint-open); border-radius: 3px; margin-bottom: 12px;
    }
    .card .analysis {
      margin-top: 12px; padding: 10px 14px; background: var(--tint-analysis);
      font-size: 0.875rem; line-height: 1.6; color: var(--ink-sub); font-style: italic;
    }
    .card .analysis .alabel {
      display: block; font-family: 'Arial', sans-serif; font-style: normal;
      font-size: 0.625rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--navy-ink); margin-bottom: 4px;
    }
    .card .readmore {
      display: inline-block; margin-top: 12px; min-height: 44px; line-height: 44px;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink); text-decoration: none;
    }
    .card .readmore:hover { text-decoration: underline; }
    .card .readmore:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    /* Ask AI: hand the clipping and a briefing prompt to a model */
    .card .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .askai, .card .ask-opt {
      border: none; background: none; padding: 0; cursor: pointer;
      min-height: 44px; line-height: 44px; text-decoration: none;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink);
    }
    .card .askai { margin-top: 12px; }
    .card .askai:hover, .card .ask-opt:hover { text-decoration: underline; }
    .card .askai:focus-visible, .card .ask-opt:focus-visible {
      outline: 2px solid var(--focus); outline-offset: 3px;
    }
    .card .ask-panel { display: none; border-top: 1px solid var(--rule-soft); margin-top: 4px; }
    .card .ask-panel.open { display: block; }
    .card .ask-row { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .ask-note {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.55;
      color: var(--meta); letter-spacing: 0.02em; padding-bottom: 12px;
    }

    /* Footer */
    .footer {
      border-top: 2px solid var(--navy);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta);
      text-align: center; letter-spacing: 0.06em;
    }
    .notice { padding: 40px 20px; text-align: center; color: var(--meta); font-style: italic; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>

d/2026/sep/05/us-military-iran-tankers"}, {"id": "f4", "lead": false, "kicker": "INDONESIA", "headline": "Volcanic Ash Cloud Halts Flights at Five Indonesian Airports", "sub": "The eruption of Anak Krakatau has disrupted 301 flights, affecting Jakarta's main international airport and local activities.", "summary": "An ash cloud from the Anak Krakatau volcano has forced the halt of flights at five Indonesian airports, including Jakarta's main international hub. The eruption has disrupted a total of 301 flights, causing widespread travel chaos. Beyond air travel, the volcanic activity has also impacted local fishing operations and some school activities in the affected regions.", "analysis": null, "time": "6:38 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/775131d69ba12fbfa80df770ed180d8d85442f32/40_0_1201_960/500.jpg", "link": "https://www.theguardian.com/world/2026/sep/06/volcanic-ash-cloud-halts-flights-at-indonesias-main-international-airport"}, {"id": "f5", "lead": false, "kicker": "IRAN", "headline": "Twin Sisters Jailed Over Iran Protests Face Death Sentence", "sub": "Taraneh Rahimi was reportedly threatened with her sister Romina's rape if she did not sign a confession.", "summary": "Twin sisters Taraneh and Romina Rahimi, jailed over Iran protests, now face a death sentence. Taraneh Rahimi reported being told by prison guards that her sister, Romina, would be raped if she refused to sign a confession. The sisters' plight highlights the severe human rights abuses faced by detainees in Iran, particularly those involved in protests, with reports of broken feet and ripped-out hair also emerging from their detention.", "analysis": null, "time": "6:00 AM", "tag": "HUMAN RIGHTS", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/2026/sep/06/taraneh-romina-rahimi-twin-sisters-jailed-over-iran-protests"}]}, {"id": "toronto", "label": "Toronto", "stories": [{"id": "t1", "lead": true, "kicker": "LOCAL DEVELOPMENT", "headline": "Oakville Residents Demand Pause on 11-Tower Condo Project Over Developer Concerns", "sub": "Residents are urging Doug Ford's government to halt the transit-oriented community development, citing vetting issues with developer Emil Toma's Distrikt Developments.", "summary": "Oakville residents are calling on Premier Doug Ford's government to pause an 11-tower condo project, raising concerns about the vetting of developer Emil Toma and his company, Distrikt Developments. The proposed transit-oriented community development has sparked community opposition, with residents questioning the developer's qualifications. Toma maintains that Distrikt Developments is fully qualified for the project, but the community's pushback highlights growing scrutiny over large-scale developments and developer accountability in the GTA.", "analysis": "This local dispute in Oakville reflects a broader tension across the GTA between rapid urban development and community concerns over transparency and oversight. The call for government intervention underscores the public's desire for stricter developer vetting, potentially setting a precedent for future large-scale projects in the region.", "time": "7:00 AM", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/1/22/122a18ef-f701-5779-b242-43dac3532985/6a872806b17d8.image.jpg?resize=300%2C200", "link": "https://www.thestar.com/news/investigations/oakville-residents-want-doug-ford-s-government-to-pause-an-11-tower-condo-project-over-developer-vetting-concerns/article_b4344488-2ad2-4b6b-b5af-cf0556404e4a.html"}, {"id": "t2", "lead": false, "kicker": "CRIME", "headline": "Hells Angels' Toronto Empire Builder Watches New Era Go Digital", "sub": "Walter Stadnick, 74, a key figure in establishing the outlaw biker gang in the GTA, is now a relic in a changing criminal landscape.", "summary": "Walter Stadnick, 74, who established the Hells Angels' Toronto empire a quarter-century ago, is now observing a new era of organized crime shifting to digital operations. Once instrumental in bringing the world's largest outlaw biker gang to the GTA, Stadnick is described as a relic of a bygone era. His story highlights the evolving nature of criminal enterprises, moving from traditional physical networks to more technologically advanced methods.", "analysis": null, "time": "7:00 AM", "tag": null, "sensitivity": true, "image": null, "link": "https://www.thestar.com/news/gta/he-built-the-hells-angels-toronto-empire-now-this-old-school-biker-is-watching-a-new-era-go-digital/article_df5f57b4-f097-433b-979c-982863110062.html"}, {"id": "t3", "lead": false, "kicker": "PUBLIC HEALTH", "headline": "Water Quality Warnings Issued for Toronto Area Beaches", "sub": "Toronto Public Health and regional authorities advise staying out of the water at multiple beaches across Toronto, Niagara, and Durham regions.", "summary": "Public health authorities have issued warnings advising residents to stay out of the water at several beaches across the Greater Toronto Area. Toronto Public Health reports five city beaches are unsafe, while Niagara Region Public Health has flagged ten, and Durham Region Health Department three. These advisories are based on the latest water quality reports as of Sunday morning, indicating elevated bacteria levels.", "analysis": null, "time": "8:00 AM", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/f/c9/fc9e7bd2-a719-59d5-a84a-e5d73c3581c0/64b9590b4091e.image.jpg?resize=300%2C200", "link": "https://www.thestar.com/news/gta/beach-water-quality/stay-out-of-the-water-at-five-toronto-public-beaches/article_7b432491-07fd-516c-9747-b838831e893f.html"}, {"id": "t4", "lead": false, "kicker": "INFRASTRUCTURE", "headline": "Loose Paving Stones Pose Danger at Busy Toronto Intersection", "sub": "Pedestrians are urged to be cautious at an unnamed intersection where holes and loose stones create hazards; the city promises action.", "summary": "Pedestrians navigating a busy Toronto intersection are facing hazards from loose paving stones and holes in the sidewalk, prompting calls for caution. The city has acknowledged the issue and stated it will address the dangerous conditions. This infrastructure problem highlights ongoing challenges in maintaining urban pedestrian safety in high-traffic areas.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/1/c8/1c830efd-36bd-5ca2-9fe1-3eb9b23925f1/6a99873cebd24.image.jpg?resize=300%2C225", "link": "https://www.thestar.com/news/gta/the-fixer/loose-paving-stones-at-this-busy-toronto-intersection-are-a-danger-to-pedestrians-here-s-what-the-city-says-it-will-do/article_42e6d5e9-383c-4c77-9474-cac487a59a8d.html"}]}, {"id": "world", "label": "World", "stories": [{"id": "w1", "lead": true, "kicker": "YEMEN", "headline": "Escalating Ground Fighting in Yemen Kills at Least 60 Civilians", "sub": "A Houthi rebel offensive against government forces on the west coast has led to some of the deadliest clashes in years.", "summary": "At least 60 civilians have been killed in Yemen as ground fighting escalates, marking some of the deadliest clashes in years. The casualties stem from a Houthi rebel offensive against government forces on the west coast. The intensified conflict underscores the ongoing humanitarian crisis and the devastating impact of the protracted war on the civilian population, with no immediate signs of de-escalation.", "analysis": "The renewed intensity of fighting in Yemen, particularly the high civilian death toll, signals a dangerous turn in the conflict, potentially undermining fragile peace efforts. The Houthi offensive suggests a strategic push that could reshape frontlines and further entrench the humanitarian catastrophe.", "time": "Yesterday", "tag": "WAR", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/2026/sep/05/yemen-ground-fighting-escalates-houthi-rebels-government-forces"}, {"id": "w2", "lead": false, "kicker": "UKRAINE", "headline": "Ukraine's Military Procurement System Riddled with Fraud and Waste", "sub": "Secret audits reveal $1.2 billion lost to mismanagement in 2024 alone, raising concerns about weapons contracts.", "summary": "Secret military audits have exposed a Ukrainian military procurement system rife with mismanagement, fraud, and waste, with an estimated $1.2 billion lost in 2024 alone. The findings raise serious concerns about the allocation of international aid and the integrity of weapons contracts. This corruption risks undermining the war effort and the trust of international partners providing crucial support.", "analysis": null, "time": "5:00 AM", "tag": "CORRUPTION", "sensitivity": false, "image": "https://static01.nyt.com/images/2026/09/02/multimedia/00int-ukraine-profiteering-01-khzg/00int-ukraine-profiteering-01-khzg-superJumbo.jpg", "link": "https://www.nytimes.com/2026/09/06/world/europe/ukraine-war-weapons-fraud-corruption.html"}, {"id": "w3", "lead": false, "kicker": "ITALY", "headline": "Women Reshaping Venice's Traditions and Future", "sub": "From gondoliers to boat builders, women are actively preserving and transforming the city's unique heritage.", "summary": "Women in Venice are actively preserving and transforming the city's unique traditions, challenging historical gender roles. This includes female gondoliers, a maestra d’ascia building gondolas, the city’s only female sandolista, and teachers for lagoon navigation. Their efforts are not only maintaining Venice's cultural heritage but also reshaping its future, demonstrating a powerful shift in the city's social and professional landscape.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/0b565b5af20413ce9eeeb with scorecards reading 110-90, 110-90, and 98-91 in her final bout. Fans at Croke Park saluted their retiring hero, marking the end of a remarkable career that saw her achieve unparalleled success.", "analysis": null, "time": "Yesterday", "tag": "FINAL", "sensitivity": false, "image": "https://media.guim.co.uk/aaeea383e99bece0f92f1876a5984215581e9c52/932_409_5190_4154/500.jpg", "link": "https://www.theguardian.com/sport/2026/sep/05/katie-taylor-bows-out-boxing-undisputed-world-champion-dominating-flora-pili"}, {"id": "s3", "lead": false, "kicker": "MOTORSPORT", "headline": "British Driver Ollie Millroy Saved from Burning Car by Rival", "sub": "Millroy credits heroic rival Loek Hartog for pulling him from a fiery wreck at the China GT race.", "summary": "British racing driver Ollie Millroy has credited his life to heroic rival Loek Hartog, who pulled him from a burning car after a massive crash at the China GT. Millroy expressed profound gratitude for Hartog's quick thinking and bravery, which prevented a potentially fatal outcome. The incident highlights the dangers of motorsport and the camaraderie among competitors.", "analysis": null, "time": "11:46 AM", "tag": null, "sensitivity": true, "image": null, "link": "https://www.theguardian.com/sport/2026/sep/06/ollie-millroy-loek-hartog-heroic-rival-burning-car-china-gt"}, {"id": "s4", "lead": false, "kicker": "ALPS", "headline": "Canadian Skyrunner Kalie McCrystal Missing During Matterhorn Record Attempt Training", "sub": "Athlete disappeared during preparations for a record attempt in the Alps, prompting search efforts.", "summary": "Canadian athlete Kalie McCrystal has gone missing during a training session in the Alps, where she was preparing for a record attempt on the Matterhorn. Search efforts are underway to locate the skyrunner. Her disappearance raises concerns for her safety in the challenging mountain environment.", "analysis": null, "time": "12:05 PM", "tag": "DEVELOPING", "sensitivity": false, "image": "https://media.guim.co.uk/56523e8ee330b91985f6730a0176501399f034cc/407_0_1993_1595/500.jpg", "link": "https://www.theguardian.com/sport/2026/sep/06/canadian-skyrunner-kalie-mccrystal-missing-matterhorn-alps"}]}, {"id": "business", "label": "Business", "stories": [{"id": "b1", "lead": true, "kicker": "GLOBAL ECONOMY", "headline": "Bond Market Instability Raises Concerns for Mortgages and Inflation", "sub": "Concerns about the public finances of major economies are having wide-reaching consequences, with experts warning of a lack of clear plans.", "summary": "Rising instability in global bond markets is raising significant concerns about knock-on effects for mortgages and inflation worldwide. Experts warn that the public finances of major economies are under pressure, with a perceived lack of clear plans to address the issues. This volatility means that UK Shadow Chancellor John Healey will face tough decisions to meet spending pledges, while Bank of England Governor Andrew Bailey cautions that central bankers must explain their decisions to avoid being seen as an 'unrepresentative elite' amid populist challenges.", "analysis": "The current bond market volatility signals a critical juncture for global economic stability, potentially leading to higher borrowing costs for consumers and governments alike. The interconnectedness of these financial markets means that fiscal decisions in one major economy can quickly ripple through, impacting everything from housing affordability to national debt management.", "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/907ad9d0b36b83bec407b5788e79ff4eff4096a4/229_0_2373_1898/500.jpg", "link": "https://www.theguardian.com/business/2026/sep/04/instability-in-global-bond-markets-rising-knock-on-effects"}, {"id": "b2", "lead": false, "kicker": "AUTOMOTIVE", "headline": "Volkswagen to Cut 50,000 Jobs in Major Restructure", "sub": "The under-pressure carmaker will shed 15% of its workforce and halve its product line, marking the sector's largest-ever restructuring.", "summary": "Volkswagen is set to cut a further 50,000 jobs, representing 15% of its workforce, as part of the automotive sector's largest-ever restructuring. The under-pressure carmaker will also halve its product line in an effort to streamline operations and improve profitability. This drastic measure comes as the company seeks to navigate a challenging global market and end a dispute with its union over the revival plan.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/691351e2fe2e0941e4795eede71342a8aaa5dad0/233_0_4611_3689/500.jpg", "link": "https://www.theguardian.com/business/2026/sep/03/volkswagen-confirms-100000-job-cuts-by-2030"}, {"id": "b3", "lead": false, "kicker": "TECH SANCTIONS", "headline": "Blacklisted Chinese Tech Giant Evades US AI Chip Sanctions", "sub": "Inspur, sanctioned for military ties, used a subsidiary to continue shipping Nvidia's advanced AI chips to China's leading firms.", "summary": "Inspur, a Chinese tech giant blacklisted by Washington for its ties to the Chinese military, has reportedly circumvented US sanctions to acquire advanced AI chips. The company's subsidiary continued to ship Nvidia's best chips, supplying China's leading AI firms. This evasion highlights the challenges in enforcing technology sanctions and the persistent efforts by Chinese companies to access critical components for AI development.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/09/01/multimedia/00biz-china-ai-smuggle-Aivres-lvjb/00biz-china-ai-smuggle-Aivres-lvjb-superJumbo.jpg", "link": "https://www.nytimes.com/2026/09/06/technology/ai-chips-china-blacklist.html"}, {"id": "b4", "lead": false, "kicker": "EU TRAVEL", "headline": "EU Border-Check Rules Expire, Renewing Queue Fears for Travellers", "sub": "The end of flexibility rules for biometric controls could lead to renewed delays at EU borders, though some states may not enforce them.", "summary": "Travellers to the European Union face renewed fears of long queues as border-check flexibility rules expire today. The expiration of these rules means the Entry/Exit System (EES) biometric controls could be fully enforced, potentially causing significant delays. However, sources indicate that some member states may choose not to immediately enforce the new biometric requirements, offering a potential reprieve for travellers.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/028814bd68a4796d9e854133b481c4781c98306e/93_193_4343_3474/500.jpg", "link": "https://www.theguardian.com/business/2026/sep/06/travellers-eu-queues-border-check-flexibility-rules-expire-entry-exit-system-ees"}]}, {"id": "opinion", "label": "Opinion", "stories": [{"id": "o1", "lead": true, "kicker": "US POLITICS", "headline": "Defense Secretary Pete Hegseth's Purges and Whims Come at a High Price", "sub": "The current Defense Secretary's actions are described as a 'wrecking ball,' leading to significant costs for national security.", "summary": "Defense Secretary Pete Hegseth's leadership is being characterized as a 'wrecking ball,' with his purges and whims exacting a high price on national security. Critics argue that his actions are destabilizing the Pentagon and undermining military readiness. The piece contends that the country is already paying a significant cost for the Secretary's decisions, raising alarms about the long-term implications for the US military and its global standing.", "analysis": "This critique of Defense Secretary Hegseth highlights growing concerns within the defense establishment and political circles about the impact of his leadership style. The accusation of 'purges and whims' suggests a politicization of the military, which could have lasting consequences for morale, expertise, and the effectiveness of US defense policy.", "time": "6:00 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://static01.nyt.com/images/2026/09/08/multimedia/06french-vfpj/06french-vfpj-superJumbo.jpg", "link": "https://www.nytimes.com/2026/09/06/opinion/hegseth-national-security-military-generals.html"}, {"id": "o2", "lead": false, "kicker": "TECHNOLOGY", "headline": "Big Tech Needs a Duty of Care Over Addictive Designs, Not Just an Algorithm Off Switch", "sub": "As AI advances, holding tech giants accountable for their addictive designs becomes increasingly urgent.", "summary": "An algorithm off switch is insufficient; big tech companies need a fundamental duty of care regarding their addictive designs. As artificial intelligence rapidly advances, governments struggle to manage new developments, making accountability for tech giants even more urgent. The argument is that platforms like Meta and TikTok are designed to be addictive, and a digital duty of care is essential to protect users and hold these companies responsible.", "analysis": null, "time": "Yesterday", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/49b6188405a000df87a729df5dedc9213195991c/525_0_4581_3666/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/sep/06/digital-duty-of-care-can-hold-big-tech-to-account-meta-tiktok-addictive-social-media-ban"}, {"id": "o3", "lead": false, "kicker": "SOCIAL COMMENTARY", "headline": "Prediction Markets Become America’s New National Pastime", "sub": "The rise of prediction markets reflects a societal shift, with implications for gambling and public discourse.", "summary": "Prediction markets have emerged as America's new national pastime, reflecting a societal shift towards monetizing speculation. The author suggests that while previous generations railed against gambling, the current embrace of prediction markets, exemplified by figures like George Santos, indicates a broader cultural acceptance. This trend raises questions about the intersection of entertainment, finance, and public engagement.", "analysis": null, "time": "11:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/19c71a4cb0eed83996d2ebfc7cafc8980ce984d8/1_0_3000_2401/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/sep/06/prediction-markets-gambling-american-pastime"}, {"id": "o4", "lead": false, "kicker": "GLOBAL AFFAIRS", "headline": "The World on the Brink, But a Brighter Future is Possible", "sub": "Despite the rise of thugs and dictators, ordinary people possess more power than commonly believed to shape global events.", "summary": "The world appears driven to the brink by thugs and dictators, leading some analysts to suggest we are already in a third world war. However, a brighter future remains possible, as ordinary people possess more power than they often realize. The commentary argues that collective action and individual agency can still influence global patterns and steer away from escalating conflicts, offering a hopeful perspective amidst widespread disquiet.", "analysis": null, "time": "5:00 AM", "tag": "EDITORIAL", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/commentisfree/2026/sep/06/world-brink-thugs-dictators-brighter-future-ordinary-people"}]}]}</script>

  <script>
    (function () {
      var raw = document.getElementById('edition').textContent;
      var data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<div class="notice">No edition loaded. Run the build to generate today’s paper.</div>';
        return;
      }

      var state = { active: (data.sections[0] || {}).id, openId: null };

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Editorial heat flags keep the red chip; procedural flags cool to navy,
      // so a red chip still means something (the Scarce Red Rule).
      function isHotTag(t) {
        return /^(DEVELOPING|BREAKING|LIVE|WAR|ALERT|URGENT)$/i.test(t || '');
      }

      // ---- Ask AI ----------------------------------------------------------
      // The reader taps one story and gets a briefing, not a chat. The prompt
      // does three jobs: hand over the clipping, name the shape of the answer
      // (five parts, ~500 words, hard ceiling), and set up the follow-up so the
      // conversation continues without the reader having to think of a question.
      // Voice constraints mirror src/config.py HOUSE_VOICE, em dash ban included.
      function buildPrompt(st, sectionLabel) {
        var L = [];
        L.push('I read this in my morning paper and I want to understand it properly.');
        L.push('');
        L.push('THE CLIPPING');
        L.push('Headline: ' + st.headline);
        if (st.author) L.push('Author: ' + st.author);
        if (st.publication) L.push('Publication: ' + st.publication);
        if (st.sub) L.push('Standfirst: ' + st.sub);
        if (st.summary) L.push('Summary: ' + st.summary);
        if (st.analysis) L.push("My paper's why-it-matters note: " + st.analysis);
        L.push('Section: ' + sectionLabel + '. Filed ' + (st.time || 'this morning') +
               ', edition of ' + data.date + '.');
        if (st.link) L.push('Source: ' + st.link);
        L.push('');
        L.push('WHAT I WANT');
        L.push('A briefing that leaves me genuinely informed, not a restatement of what I just');
        L.push('pasted. Assume I know nothing beyond the clipping above.');
        L.push('');
        L.push('Check current reporting first if you are able to search. My clipping is a');
        L.push('summary and may be incomplete or already overtaken by events. If you cannot');
        L.push('search, say so in one line at the top, then separate what you are confident');
        L.push('about from what you would want verified.');
        L.push('');
        L.push('STRUCTURE');
        L.push('I am reading this on a phone. Build the answer in layers, heaviest first, so');
        L.push('I can stop at the end of any layer and still have got something whole. Use');
        L.push('these markdown headings exactly, so they render large on a small screen.');
        L.push('');
        L.push('# The gist');
        L.push('An H1 of six to ten words stating the actual point, not the topic. Then two or');
        L.push('three short sentences giving me the whole story in plain words. If I read');
        L.push('nothing else, this is what I walk away knowing. Correct my clipping here if it');
        L.push('is wrong or out of date.');
        L.push('');
        L.push('## Why it matters');
        L.push('Two or three short sentences on the stakes and the second order effects. Be');
        L.push('concrete about who gains, who pays, how much, and by when.');
        L.push('');
        L.push('## How we got here');
        L.push('Only the background I need to follow this story. Not a history lecture.');
        L.push('');
        L.push('## Where it is contested');
        L.push('The strongest disagreement among serious people, put fairly. If it is genuinely');
        L.push('uncontested, say so in one sentence and move on.');
        L.push('');
        L.push('## What to watch');
        L.push('Three bullets, each a specific checkable marker with a rough timeframe.');
        L.push('');
        L.push('## Ask me next');
        L.push('Three numbered questions, ordered by what would teach me the most. I will reply');
        L.push('with a digit.');
        L.push('');
        L.push('READING ON A PHONE');
        L.push('Short paragraphs: three sentences at most, none longer than about sixty words,');
        L.push('with a blank line between them. No tables, no nested bullets, no wall of text.');
        L.push('Around 500 words in total. Hard ceiling 650. Do not pad to reach a length; the');
        L.push('gist and why it matters are worth more than the sections under them.');
        L.push('');
        L.push('VOICE');
        L.push('Financial Times, not an encyclopedia and not a chatbot. Plain, confident,');
        L.push('concrete. Specifics over abstractions: names, numbers, dates, stakes. Every');
        L.push('sentence earns its place. No preamble, no throat clearing, no restating my');
        L.push('prompt back to me, no hedging filler, no em dashes. Where you are uncertain,');
        L.push('mark it in the sentence it applies to rather than in a disclaimer paragraph.');
        return L.join('\n');
      }

      function findStory(id) {
        var followed = data.following || [];
        for (var f = 0; f < followed.length; f++) {
          if (followed[f].id === id) {
            return { story: followed[f], label: 'Opinion · Following' };
          }
        }
        for (var i = 0; i < data.sections.length; i++) {
          var list = data.sections[i].stories || [];
          for (var j = 0; j < list.length; j++) {
            if (list[j].id === id) {
              return { story: list[j], label: data.sections[i].label };
            }
          }
        }
        return null;
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        // Older iOS standalone PWAs land here.
        return new Promise(function (resolve, reject) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('copy failed'));
        });
      }

      // Tagline reflects the sections the edition actually shipped, not a
      // hardcoded list that can disagree with the paper.
      function taglineText() {
        var labels = data.sections
          .filter(function (s) { return s.id !== 'front'; })
          .map(function (s) { return s.label; });
        return (labels.length ? labels : ['Toronto', 'World', 'Business']).join(' · ');
      }

      function weatherHtml(w) {
        if (!w || !w.icon) return '';
        var week = (w.week || []).map(function (d) {
          return '<div class="day"><div class="d">' + esc(d.day) + '</div>' +
            '<div class="i">' + esc(d.icon) + '</div>' +
            '<div class="hi">' + esc(d.hi) + '°</div>' +
            '<div class="lo">' + esc(d.lo) + '°</div></div>';
        }).join('');
        return '<div class="weather" id="weather" role="button" tabindex="0" ' +
          'aria-expanded="false" aria-label="Toronto weather, tap for the week">' +
          '<div class="summary">' +
            '<span class="ico">' + esc(w.icon) + '</span>' +
            '<span class="city">Toronto</span>' +
            '<span class="temp">' + esc(w.high) + '° / ' + esc(w.low) + '°</span>' +
            '<span class="muted">' + esc(w.condition) + '</span>' +
            '<span class="muted">Rain ' + esc(w.rain) + '</span>' +
            '<span class="muted">Wind ' + esc(w.wind) + '</span>' +
            '<span class="chev" id="wchev">▼</span>' +
          '</div>' +
          '<div class="week" id="wweek" style="display:none">' + week + '</div>' +
        '</div>';
      }

      function tabsHtml() {
        return '<div class="tabs" role="tablist">' + data.sections.map(function (s) {
          var on = s.id === state.active;
          return '<button class="tab' + (on ? ' active' : '') + '" role="tab" ' +
            'aria-selected="' + on + '" data-tab="' + esc(s.id) + '">' + esc(s.label) + '</button>';
        }).join('') + '</div>';
      }

      function cardHtml(st, sectionLabel) {
        var open = st.id === state.openId;
        var tag = st.tag
          ? '<span class="tag ' + (isHotTag(st.tag) ? 'hot' : 'cool') + '">' + esc(st.tag) + '</span>'
          : '';
        var kicker = st.kicker ? '<div class="kicker">' + tag + esc(st.kicker) + '</div>' : '';
        var sub = st.sub ? '<div class="sub">' + esc(st.sub) + '</div>' : '';
        var followMeta = '';
        var filed = '<div class="time">' + esc(st.time) + '</div>';
        if (st.following) {
          var metaParts = [st.author, st.publication, st.time].filter(function (part) { return !!part; });
          followMeta = metaParts.length
            ? '<div class="follow-meta">' + metaParts.map(esc).join(' · ') + '</div>'
            : '';
          filed = '';
        }
        var expand = '';
        if (open) {
          var img = st.image
            ? '<img src="' + esc(st.image) + '" alt="' + esc(st.headline) + '" ' +
              'loading="lazy" onerror="this.remove()" />'
            : '';
          var analysis = st.analysis
            ? '<div class="analysis"><span class="alabel">Why it matters</span>' + esc(st.analysis) + '</div>'
            : '';
          var link = st.link
            ? '<a class="readmore" href="' + esc(st.link) + '" target="_blank" rel="noopener">Read full story →</a>'
            : '';

          // Prefill the destinations at render time so a long press ("open in
          // app") carries the prompt too, instead of us intercepting the tap.
          var q = encodeURIComponent(buildPrompt(st, sectionLabel));
          // No target="_blank" on these two. In a standalone PWA a blank target
          // opens an in-app browser sheet, which iOS will not hand off to an
          // installed app; a plain top-level tap is what lets the Claude and
          // ChatGPT apps claim their own domains as Universal Links. "Read full
          // story" keeps _blank, because a news site does belong in a tab.
          var share = navigator.share
            ? '<button class="ask-opt" data-ai="share" data-id="' + esc(st.id) + '">Share to app…</button>'
            : '';
          var actions = '<div class="actions">' + link +
            '<button class="askai" data-ask="' + esc(st.id) + '" aria-expanded="false" ' +
              'aria-controls="ask-' + esc(st.id) + '">Ask AI ▾</button></div>' +
            '<div class="ask-panel" id="ask-' + esc(st.id) + '">' +
              '<div class="ask-row">' +
                '<a class="ask-opt" href="https://claude.ai/new?q=' + esc(q) + '">Claude</a>' +
                '<a class="ask-opt" href="https://chatgpt.com/?q=' + esc(q) + '">ChatGPT</a>' +
                share +
                '<button class="ask-opt" data-ai="copy" data-id="' + esc(st.id) + '">Copy</button>' +
              '</div>' +
              '<div class="ask-note">Opens in the app if you have it installed. The reply ' +
                'starts with the gist in a few lines, then goes deeper, then offers three ' +
                'follow-up questions.</div>' +
            '</div>';

          expand = '<div class="expand">' + img +
            '<p class="sumtext">' + esc(st.summary) + '</p>' + analysis + actions + '</div>';
        }
        return '<div class="card' + (st.lead ? ' lead' : '') + (open ? ' open' : '') +
          '" data-card="' + esc(st.id) + '" role="button" tabindex="0" ' +
          'aria-expanded="' + open + '">' +
          '<div class="row"><div class="row-main">' + kicker +
            '<div class="headline">' + esc(st.headline) + '</div>' + sub + followMeta + filed +
            '</div><div class="toggle" aria-hidden="true">' + (open ? '−' : '+') + '</div>' +
          '</div>' + expand +
        '</div>';
      }

      function storiesInner() {
        var section = data.sections.filter(function (s) { return s.id === state.active; })[0];
        if (!section) return '';

        var sectionStories = section.stories || [];
        var following = data.following || [];
        if (section.id === 'opinion' && following.length) {
          var followedHtml = following.map(function (st) {
            return cardHtml(st, 'Opinion · Following');
          }).join('');
          var ordinaryHtml = sectionStories.length
            ? sectionStories.map(function (st) { return cardHtml(st, section.label); }).join('')
            : '<div class="empty">Nothing else filed for Opinion this morning.</div>';
          return '<section class="opinion-desk following-block" aria-labelledby="following-title">' +
              '<div class="desk-head"><h2 class="desk-title" id="following-title">Following</h2>' +
                '<div class="desk-dek">New writing from voices you follow</div></div>' +
              followedHtml +
            '</section>' +
            '<section class="opinion-desk today-opinion" aria-labelledby="today-opinion-title">' +
              '<div class="desk-head"><h2 class="desk-title" id="today-opinion-title">Today’s Opinion</h2>' +
                '<div class="desk-dek">Selected independently by the morning desk</div></div>' +
              ordinaryHtml +
            '</section>';
        }

        if (!sectionStories.length) {
          return '<div class="empty">Nothing filed for ' + esc(section.label) + ' this morning.</div>';
        }
        return sectionStories.map(function (st) {
          return cardHtml(st, section.label);
        }).join('');
      }

      // Quietly flag a saved (not-today) edition served from cache/offline.
      function staleRibbon() {
        try {
          var meta = document.querySelector('meta[name=build]');
          if (!meta) return '';
          var built = new Date(meta.getAttribute('content'));
          if (isNaN(built.getTime())) return '';
          var opt = { timeZone: 'America/Toronto' };
          if (built.toLocaleDateString('en-CA', opt) < new Date().toLocaleDateString('en-CA', opt)) {
            return '<div class="stale">Saved edition · ' + esc(data.date) + '</div>';
          }
        } catch (e) {}
        return '';
      }

      function appHtml() {
        return '<div class="masthead">' +
            '<div class="date">' + esc(data.date) + '</div>' +
            '<div class="title">THE DAILY</div>' +
            '<div class="tagline">' + esc(taglineText()) + '</div>' +
          '</div>' +
          staleRibbon() +
          weatherHtml(data.weather) +
          tabsHtml() +
          '<div class="stories" id="stories">' + storiesInner() + '</div>' +
          '<div class="footer">THE DAILY · TORONTO · Tap any headline to read</div>';
      }

      var app = document.getElementById('app');

      // Rebuild only the stories column; masthead, weather, and tab strip (and
      // their scroll/open state) are left untouched. This is what keeps a tap
      // from resetting the reader's place.
      function refreshStories() {
        document.getElementById('stories').innerHTML = storiesInner();
        bindCards();
      }

      function selectTab(id) {
        if (id === state.active) return;
        state.active = id;
        state.openId = null;
        var tabs = document.querySelectorAll('.tab');
        Array.prototype.forEach.call(tabs, function (t) {
          var on = t.getAttribute('data-tab') === id;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on);
          if (on) t.scrollIntoView({ inline: 'center', block: 'nearest' });
        });
        refreshStories();
        // Start the new section at the top, tab strip stuck under the notch.
        var tabsEl = document.querySelector('.tabs');
        if (tabsEl) window.scrollTo(0, tabsEl.offsetTop);
      }

      function toggleCard(id) {
        var y = window.scrollY;
        state.openId = state.openId === id ? null : id;
        refreshStories();
        window.scrollTo(0, y);   // grow/collapse in place, never jump
      }

      function bindWeather() {
        var weather = document.getElementById('weather');
        if (!weather) return;
        function toggle() {
          var week = document.getElementById('wweek');
          var chev = document.getElementById('wchev');
          var showing = week.style.display !== 'none';
          week.style.display = showing ? 'none' : 'flex';
          chev.textContent = showing ? '▼' : '▲';
          weather.setAttribute('aria-expanded', String(!showing));
        }
        weather.addEventListener('click', toggle);
        weather.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
        });
      }

      function bindTabs() {
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
          btn.addEventListener('click', function () { selectTab(btn.getAttribute('data-tab')); });
        });
      }

      function bindCards() {
        Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
          function activate(ev) {
            // Let links and the Ask AI controls handle their own activation.
            if (ev.target.closest('a, button')) return;
            // While open, only the header row collapses it, so reading (and
            // selecting) the body never closes the story by accident.
            if (card.classList.contains('open') && !ev.target.closest('.row')) return;
            toggleCard(card.getAttribute('data-card'));
          }
          card.addEventListener('click', activate);
          card.addEventListener('keydown', function (ev) {
            if (ev.key !== 'Enter' && ev.key !== ' ') return;
            // Never swallow the key from a control that acts on it itself.
            if (ev.target.closest('a, button')) return;
            ev.preventDefault();
            activate(ev);
          });
          bindAsk(card);
        });
      }

      // Panel state is held in the DOM, not in `state`, so opening the
      // destinations never triggers a stories rebuild and never moves the page.
      function bindAsk(card) {
        var toggle = card.querySelector('.askai');
        if (!toggle) return;
        var panel = card.querySelector('.ask-panel');

        toggle.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var open = panel.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(open));
          toggle.textContent = open ? 'Ask AI ▴' : 'Ask AI ▾';
        });

        Array.prototype.forEach.call(panel.querySelectorAll('[data-ai]'), function (el) {
          var kind = el.getAttribute('data-ai');
          el.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var found = findStory(el.getAttribute('data-id'));
            if (!found) return;
            var prompt = buildPrompt(found.story, found.label);

            if (kind === 'share') {
              navigator.share({ text: prompt }).catch(function () {});
              return;
            }
            var label = el.textContent;
            copyText(prompt).then(function () {
              el.textContent = 'Copied';
            }).catch(function () {
              el.textContent = 'Copy failed';
            }).then(function () {
              setTimeout(function () { el.textContent = label; }, 1800);
            });
          });
        });
      }

      app.innerHTML = appHtml();
      bindWeather();
      bindTabs();
      bindCards();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
