  <style>
    /* ---- Design tokens: The Morning Broadsheet ------------------------- */
    :root {
      --paper: #faf8f3;        /* the sheet (warm white, never #fff) */
      --desk: #efece6;         /* the desk beyond the column */
      --ink: #17130d;          /* headlines / primary text */
      --ink-sub: #453f38;      /* standfirsts */
      --ink-muted: #635d54;    /* inactive tabs */
      --meta: #6c665c;         /* timestamps, dateline, footer (>=AA small) */
      --rule: #dcd6cc;         /* hairline between cards */
      --rule-soft: #e3ded4;    /* hairline inside an opened card */
      --navy: #1a2744;         /* structural ink */
      --navy-ink: #1a2744;     /* navy used as text (links, active tab) */
      --red: #8b1a1a;          /* editorial heat */
      --tint-open: #f2ede4;    /* ground of an expanded card */
      --tint-analysis: #ece6da;/* ground of the why-it-matters note */
      --strip-bg: #1a2744;     /* weather strip */
      --strip-ink: #f7f4ee;
      --chip-hot: #8b1a1a;     /* DEVELOPING / WAR-class flags */
      --chip-cool: #1a2744;    /* procedural flags (FINAL, EDITORIAL) */
      --chip-ink: #faf8f3;
      --focus: #1a2744;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151a22;      /* lamplight edition: deep navy-black paper */
        --desk: #0e1219;
        --ink: #e9e3d5;        /* cream ink */
        --ink-sub: #bcb6a8;
        --ink-muted: #948e82;
        --meta: #8f897d;
        --rule: #2a303a;
        --rule-soft: #2f3540;
        --navy: #6f82a8;       /* structure lifted so it reads on dark */
        --navy-ink: #a3b3d2;
        --red: #d1726b;        /* desaturated heat */
        --tint-open: #1b212b;
        --tint-analysis: #20262f;
        --strip-bg: #1b2334;
        --strip-ink: #e9e3d5;
        --chip-hot: #a8443c;
        --chip-cool: #3b4a6c;
        --chip-ink: #f0eadc;
        --focus: #a3b3d2;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 100%; }
    html, body { background: var(--desk); }
    body {
      font-family: 'Georgia', serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--paper);
      max-width: 680px;
      margin: 0 auto;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Masthead */
    .masthead {
      border-bottom: 4px solid var(--navy);
      padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
      background: var(--paper);
    }
    .masthead .date {
      font-size: 0.6875rem; color: var(--meta); letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .masthead .title {
      font-size: 2.375rem; font-weight: 700; letter-spacing: -0.01em;
      color: var(--navy); line-height: 1; margin-bottom: 2px;
    }
    .masthead .tagline {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; color: var(--meta);
      letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* Stale-edition ribbon */
    .stale {
      background: var(--tint-analysis); color: var(--meta);
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; text-align: center;
      padding: 7px 20px;
    }

    /* Weather strip */
    .weather {
      background: var(--strip-bg); color: var(--strip-ink);
      cursor: pointer; user-select: none;
    }
    .weather .summary {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
      min-height: 44px;
    }
    .weather .summary::-webkit-scrollbar { display: none; }
    .weather .ico { font-size: 1.375rem; }
    .weather .city { font-weight: 700; font-size: 0.9375rem; }
    .weather .temp { font-size: 0.9375rem; }
    .weather .muted { opacity: 0.72; font-size: 0.8125rem; white-space: nowrap; }
    .weather .chev { margin-left: auto; opacity: 0.6; font-size: 0.75rem; }
    .weather .week {
      display: flex; border-top: 1px solid rgba(255,255,255,0.12);
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
    }
    .weather .week::-webkit-scrollbar { display: none; }
    .weather .day {
      text-align: center; min-width: 52px; padding: 0 8px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .weather .day .d { font-size: 0.6875rem; opacity: 0.6; margin-bottom: 4px; }
    .weather .day .i { font-size: 1.125rem; }
    .weather .day .hi { font-size: 0.8125rem; font-weight: 700; margin-top: 4px; }
    .weather .day .lo { font-size: 0.6875rem; opacity: 0.5; }

    /* Tab nav */
    .tabs {
      display: flex; overflow-x: auto; border-bottom: 2px solid var(--navy);
      background: var(--paper); scrollbar-width: none;
      position: sticky; top: 0; z-index: 10;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; min-height: 44px; display: flex; align-items: center;
      padding: 0 18px; border: none; background: none; cursor: pointer;
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; font-weight: 700;
      color: var(--ink-muted); border-bottom: 3px solid transparent;
      margin-bottom: -2px; letter-spacing: 0.12em; text-transform: uppercase;
      transition: color 0.15s;
    }
    .tab.active { color: var(--navy-ink); border-bottom-color: var(--navy); }

    /* Stories */
    .stories { padding: 8px 20px 40px; }
    .empty {
      padding: 40px 4px; text-align: center; color: var(--meta);
      font-style: italic; font-size: 0.9375rem;
    }
    .card {
      border-top: 1px solid var(--rule); padding: 14px 0; cursor: pointer;
      background: var(--paper); transition: background 0.15s;
    }
    .card.lead { border-top: 3px solid var(--navy); padding: 20px 0 16px; }
    .card.open { background: var(--tint-open); }
    .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card .row-main { flex: 1; min-width: 0; }
    .card .kicker {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; color: var(--red); margin-bottom: 6px; text-transform: uppercase;
    }
    .card .tag {
      color: var(--chip-ink); padding: 2px 6px; margin-right: 8px;
      font-size: 0.5625rem; border-radius: 2px; vertical-align: 1px;
    }
    .card .tag.hot { background: var(--chip-hot); }
    .card .tag.cool { background: var(--chip-cool); }
    .card .headline {
      font-size: 1.0625rem; font-weight: 700; line-height: 1.25; color: var(--ink); margin-bottom: 6px;
    }
    .card.lead .headline { font-size: 1.375rem; }
    .card .sub {
      font-size: 0.875rem; color: var(--ink-sub); line-height: 1.4; margin-bottom: 4px; font-style: italic;
    }
    .card .time { font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta); margin-top: 4px; }
    .card .toggle { color: var(--navy-ink); opacity: 0.5; font-size: 1.125rem; flex-shrink: 0; margin-top: 2px; }
    .card .expand {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    }
    .card .expand .sumtext {
      font-size: 0.9375rem; color: var(--ink-sub); line-height: 1.7;
    }
    .card .expand img {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      background: var(--tint-open); border-radius: 3px; margin-bottom: 12px;
    }
    .card .analysis {
      margin-top: 12px; padding: 10px 14px; background: var(--tint-analysis);
      font-size: 0.875rem; line-height: 1.6; color: var(--ink-sub); font-style: italic;
    }
    .card .analysis .alabel {
      display: block; font-family: 'Arial', sans-serif; font-style: normal;
      font-size: 0.625rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--navy-ink); margin-bottom: 4px;
    }
    .card .readmore {
      display: inline-block; margin-top: 12px; min-height: 44px; line-height: 44px;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink); text-decoration: none;
    }
    .card .readmore:hover { text-decoration: underline; }
    .card .readmore:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    /* Ask AI: hand the clipping and a briefing prompt to a model */
    .card .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .askai, .card .ask-opt {
      border: none; background: none; padding: 0; cursor: pointer;
      min-height: 44px; line-height: 44px; text-decoration: none;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink);
    }
    .card .askai { margin-top: 12px; }
    .card .askai:hover, .card .ask-opt:hover { text-decoration: underline; }
    .card .askai:focus-visible, .card .ask-opt:focus-visible {
      outline: 2px solid var(--focus); outline-offset: 3px;
    }
    .card .ask-panel { display: none; border-top: 1px solid var(--rule-soft); margin-top: 4px; }
    .card .ask-panel.open { display: block; }
    .card .ask-row { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .ask-note {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.55;
      color: var(--meta); letter-spacing: 0.02em; padding-bottom: 12px;
    }

    /* Footer */
    .footer {
      border-top: 2px solid var(--navy);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta);
      text-align: center; letter-spacing: 0.06em;
    }
    .notice { padding: 40px 20px; text-align: center; color: var(--meta); font-style: italic; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>

ly-sunny/article_07277ee7-e5fe-55ff-9821-4c245d756ac8.html"}]}, {"id": "world", "label": "World", "stories": [{"id": "w1", "lead": true, "kicker": "CANADA", "headline": "Canada's Worst Wildfire Season Fuels Calls for National Emergency Agency", "sub": "With over 900 fires burning, Canada remains the only G7 country without a coordinated national response agency.", "summary": "Canada is experiencing its worst wildfire season on record, with more than 900 fires currently burning across the country. This escalating crisis has intensified calls for the establishment of a national emergency agency to coordinate response efforts. Canada remains the only G7 country without such a centralized body, a deficiency highlighted by the widespread devastation and the challenges in managing the numerous blazes.", "analysis": "The unprecedented scale of Canada's wildfires underscores a critical gap in national emergency preparedness, especially for a country highly susceptible to climate-related disasters. Establishing a dedicated agency could streamline resources, improve inter-provincial coordination, and potentially mitigate future environmental and economic damage, aligning Canada with its G7 peers.", "time": "6:00 AM", "tag": "CLIMATE", "sensitivity": false, "image": "https://media.guim.co.uk/baec7b1ccd58a51a3cdd81d4536d5581ba2997d0/0_0_4761_3808/500.jpg", "link": "https://www.theguardian.com/world/2026/jul/29/canada-wildfire-emergency-agency"}, {"id": "w2", "lead": false, "kicker": "CLIMATE", "headline": "Caribbean Bears Brunt of £43bn Climate Damage to Developing Islands", "sub": "New findings highlight the severe economic impact of climate change on vulnerable island nations.", "summary": "The Caribbean region has borne the brunt of an estimated £43 billion in climate-fuelled damage to developing island nations. Researchers indicate these findings are crucial for informing global conversations about climate reparations and financing for mitigation efforts. The report underscores the disproportionate impact of climate change on vulnerable communities, demanding international attention and support.", "analysis": null, "time": "7:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/bb9b619d22f2ca63276d8c0da3e1d70cc1126aed/528_0_2813_2250/500.jpg", "link": "https://www.theguardian.com/world/2026/jul/29/caribbean-climate-related-economic-damage-developing-islands"}, {"id": "w3", "lead": false, "kicker": "INDIA", "headline": "India's Death Toll Rises Amid Escalating Heat Crisis", "sub": "Extreme heat claims lives in India's poorest areas, raising fears of undercounted mortality rates.", "summary": "India is grappling with an escalating heat crisis, with extreme temperatures claiming the lives of workers in the country's poorest areas. Many fear the true mortality rate is being dangerously undercounted, obscuring the full scale of the disaster. The situation highlights the severe human cost of climate change and the vulnerability of marginalized populations to environmental extremes.", "analysis": null, "time": "12:00 AM", "tag": "CLIMATE", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/2026/jul/29/extreme-heat-deaths-india-climate-crisis-environment"}, {"id": "w4", "lead": false, "kicker": "UKRAINE", "headline": "Zelenskyy's Domestic Struggles Raise Global Reputation Concerns", "sub": "A recent government reshuffle exposes deep fractures within Ukraine's wartime cabinet.", "summary": "A recent government reshuffle in Ukraine has exposed deep fractures within President Volodymyr Zelenskyy's wartime cabinet, raising questions about his domestic leadership. Analysts are now debating whether these internal struggles will harm his reputation on the global stage, particularly as Ukraine continues to navigate the ongoing conflict. The political turbulence comes at a critical time for the nation.", "analysis": null, "time": "1:46 AM", "tag": "WAR", "sensitivity": false, "image": "https://media.guim.co.uk/eea4beac08b8d7341134d3f6a3ccb2df71df036b/271_155_4806_3845/500.jpg", "link": "https://www.theguardian.com/world/2026/jul/29/wednesday-briefing-will-zelenskyys-domestic-struggles-harm-his-reputation-on-the-global-stage"}]}, {"id": "sports", "label": "Sports", "stories": [{"id": "s1", "lead": true, "kicker": "COMMONWEALTH GAMES", "headline": "Kennedy Breaks 100m National Record, Ends Australia’s 64-Year Medal Wait", "sub": "Lachie Kennedy secures a historic 100m medal for Australia, while Zoe Hobbs and Emmanuel Eseme claim gold in Glasgow.", "summary": "Lachie Kennedy broke the national record to end Australia’s 64-year wait for a 100m medal at the Commonwealth Games in Glasgow. Kennedy's silver medal performance was part of a thrilling day six, which also saw New Zealand's Zoe Hobbs win the women's 100m in a personal best of 10.93 seconds, and Cameroon's Emmanuel Eseme surge to the men's 100m title in 9.83 seconds. Jersey's 18-year-old Filip Nowacki also made history, taking gold in the 200m breaststroke.", "analysis": "The Commonwealth Games continue to deliver standout performances, with Lachie Kennedy's historic medal underscoring a resurgence in Australian sprinting. The emergence of young talents like Filip Nowacki also signals a changing guard in various disciplines, promising exciting rivalries and record-breaking attempts in future international competitions.", "time": "Yesterday", "tag": "FINAL", "sensitivity": false, "image": "https://media.guim.co.uk/4e68fe1143b151b86499e262787fe73da2b4b47c/525_0_3865_3092/500.jpg", "link": "https://www.theguardian.com/sport/2026/jul/29/commonwealth-games-glasgow-100m-final-athletics-emmanuel-eseme-lachie-kennedy-torrie-lewis"}, {"id": "s2", "lead": false, "kicker": "COMMONWEALTH GAMES", "headline": "Commonwealth Games 2026: Day Six Underway with 26 Golds Up for Grabs", "sub": "Swimming, athletics, and weightlifting headline a busy day of competition in Glasgow.", "summary": "Day six of the Commonwealth Games 2026 is underway in Glasgow, with 26 gold medals set to be awarded across various disciplines. Key events include finals in swimming, athletics, and weightlifting, as athletes from 74 countries continue to compete for the 645 medals on offer. The Games have already seen several national records broken and new stars emerge.", "analysis": null, "time": "7:32 AM", "tag": "DEVELOPING", "sensitivity": false, "image": "https://media.guim.co.uk/9db8fafdf3463b6b0a338c3c8207d9dcf49f54d0/29_22_3583_2866/500.jpg", "link": "https://www.theguardian.com/sport/live/2026/jul/29/commonwealth-games-2026-swimming-athletics-weightlifting-netball-basketball-day-six-live"}, {"id": "s3", "lead": false, "kicker": "CHESS", "headline": "Geneva to Host Youngest World Chess Title Match Ever", "sub": "Gukesh Dommaraju and Javokhir Sindarov will make history in November.", "summary": "Geneva has been selected to host the world chess championship from November 25, where Gukesh Dommaraju and Javokhir Sindarov will contest the youngest title match in history. The highly anticipated event will showcase two of the sport's brightest young talents. This historic match is expected to draw significant attention from the global chess community.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/7fb01fba2c892beaaf3401ec019d4f940fc3557a/334_0_3331_2666/500.jpg", "link": "https://www.theguardian.com/sport/2026/jul/28/geneva-world-chess-championship-gukesh-sindarov"}, {"id": "s4", "lead": false, "kicker": "CRICKET", "headline": "Boris Karloff’s Unlikely Love of Cricket Lives On Through Foundation", "sub": "The horror actor's legacy continues to fund the Windrush cricket festival.", "summary": "Boris Karloff, the actor renowned for his haunting film roles, had an unlikely passion for cricket, serving as president of the Hollywood Cricket Club. His estate now helps to fund the Windrush cricket festival, ensuring his love for the sport lives on. This foundation supports community cricket, connecting the golden age of Hollywood with modern sporting initiatives.", "analysis": null, "time": "6:47 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/cb7dc21d1bab97f5223772746e14339286c615f4/237_466_1196_957/500.jpg", "link": "https://www.theguardian.com/sport/2026/jul/29/boris-karloff-hollywood-cricket-club-foundation"}]}, {"id": "business", "label": "Business", "stories": [{"id": "b1", "lead": true, "kicker": "CENTRAL BANK", "headline": "Federal Reserve Chairman Kevin Warsh Faces Pressure to Raise Rates", "sub": "Warsh presides over his second meeting as inflation remains elevated, prompting calls for tighter monetary policy.", "summary": "Federal Reserve Chairman Kevin M. Warsh is under increasing pressure to raise interest rates as he presides over his second meeting at the helm of the central bank. Inflation remains elevated, fueling calls for tighter monetary policy to cool the economy. The decisions made at this meeting will be closely watched by markets and could significantly impact borrowing costs and economic growth.", "analysis": "Chairman Warsh's early tenure is defined by the challenge of persistent inflation, a stark contrast to previous eras of low rates. His approach to balancing economic growth with price stability will set the tone for the Fed's policy direction, with any rate hike potentially impacting everything from mortgage rates to corporate investment decisions.", "time": "5:02 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/07/29/multimedia/29dc-fed-vmhw/29dc-fed-vmhw-superJumbo.jpg", "link": "https://www.nytimes.com/2026/07/29/business/what-to-know-federal-reserve-july-meeting.html"}, {"id": "b2", "lead": false, "kicker": "TRADE", "headline": "Trump's Tariffs Drive Some U.S. Companies Back to China", "sub": "Despite protectionist policies, the economic logic for factory locations is once again favoring China for some brands.", "summary": "Despite the Trump administration's tariffs aimed at boosting domestic manufacturing, some U.S. brands are finding the economic logic for their factories is once again pointing to China. The tariffs, intended to make Chinese goods less competitive, have inadvertently led some companies to reconsider their supply chains and production locations, with China still offering compelling advantages for certain industries.", "analysis": null, "time": "5:02 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/07/28/multimedia/28DC-Flashlight-Tariffs-mbwf/28DC-Flashlight-Tariffs-mbwf-superJumbo.jpg", "link": "https://www.nytimes.com/2026/07/29/business/economy/trumps-tariffs-are-sending-some-companies-back-to-china.html"}, {"id": "b3", "lead": false, "kicker": "AI", "headline": "The 'Slop Janitor' Aims to Combat AI-Generated Content", "sub": "Pangram, an AI detection startup, promises near-perfect accuracy in identifying non-human writing and imagery.", "summary": "Pangram, an AI detection startup, is positioning itself as the 'Slop Janitor' for the digital age, promising near-perfect accuracy in sniffing out writing and imagery not created by humans. The company's emergence highlights growing concerns over the proliferation of AI-generated content and its impact on authenticity and information integrity. Pangram's technology is raising significant questions about the future of content creation and consumption.", "analysis": null, "time": "7:00 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/07/29/business/29db-pangram/29db-pangram-superJumbo.png", "link": "https://www.nytimes.com/2026/07/29/business/dealbook/sick-of-ai-generated-content-the-slop-janitor-is-here-to-help.html"}, {"id": "b4", "lead": false, "kicker": "CORPORATE", "headline": "GSK Invests £400m in New Cambridge Research Centre", "sub": "Pharmaceutical giant's move accompanied by positive news for shareholders, praised by Prime Minister Andy Burnham.", "summary": "Pharmaceutical company GSK is investing £400 million to move its research centre to Cambridge, a move accompanied by encouraging news for shareholders. Prime Minister Andy Burnham praised the decision as a 'vote of confidence' in the UK economy and its scientific sector. The new facility is expected to bolster the country's position in global pharmaceutical research and development.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/f5394ce79c058ce80da6080c93307ee60c151404/299_0_1350_1080/500.jpg", "link": "https://www.theguardian.com/business/nils-pratley-on-finance/2026/jul/28/gsk-cambridge-long-awaited-good-vibes"}]}, {"id": "opinion", "label": "Opinion", "stories": [{"id": "o1", "lead": true, "kicker": "GEOPOLITICS", "headline": "What Should Replace the American-Led World Order?", "sub": "Aslı Bâli and Samuel Moyn argue it is time to build the foundations of a new multipolar world.", "summary": "Aslı Bâli and Samuel Moyn contend that the global community must move beyond mourning the decline of the American-led world order and instead focus on building the foundations of a new multipolar system. They argue that the task now is to actively construct a replacement, rather than lamenting the past. This perspective calls for a fundamental rethinking of international relations and power structures in the 21st century.", "analysis": "This commentary reflects a growing sentiment among international relations scholars that the unipolar moment is over, necessitating a proactive approach to shaping a new global framework. The challenge lies in defining what a multipolar order entails and how to navigate the transition without exacerbating existing geopolitical tensions, particularly as new powers assert their influence.", "time": "6:00 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/83689ec5f2f4732c1ab80fbd27a26dd2b767c39e/458_0_4583_3667/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/jul/29/us-decline-world-order-replacement"}, {"id": "o2", "lead": false, "kicker": "CLIMATE", "headline": "Wildfires Rage, 45 Climate Pledges Junked: Disaster Looms", "sub": "Climate professor Bill McGuire urges scientists to act as governments retreat from climate action.", "summary": "Climate professor Bill McGuire warns that disaster looms as wildfires rage globally and 45 climate pledges have been abandoned by world governments. Five years after urging climate scientists to speak out, McGuire now asserts it is time for decisive action, not just words, as governments retreat from their commitments. He emphasizes the urgent need for a renewed focus on climate action to avert catastrophic consequences.", "analysis": null, "time": "5:00 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/61acc7867a76bd761c23f7c3fb39c928ab77a652/646_0_6830_5464/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/jul/29/wildfires-rage-world-climate-action-scientists-fossil-fuels"}, {"id": "o3", "lead": false, "kicker": "U.S. POLITICS", "headline": "Even Maga is Falling Out of Love with JD Vance", "sub": "Arwa Mahdawi notes the US Vice-President faces allegations and complaints, benefiting Marco Rubio.", "summary": "Arwa Mahdawi observes that even within the Maga movement, support for US Vice-President JD Vance is waning, as he faces a barrage of allegations and complaints from both inside and outside Republican ranks. This situation, Mahdawi writes, is good news for Marco Rubio, but potentially concerning for the rest of the world. The internal party struggles highlight a shifting political landscape.", "analysis": null, "time": "6:00 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/1994651a59b2c3161d7cf14b51a17b376f78eafd/484_0_3453_2762/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/jul/29/maga-jd-vance-rivals-marco-rubio"}, {"id": "o4", "lead": false, "kicker": "INDIA", "headline": "India’s Gen Z Revolt: The Cockroaches Are Coming Together", "sub": "Editorial: A youth movement born from exam leaks and online mockery challenges Narendra Modi's authority.", "summary": "An editorial from The Guardian describes India's Gen Z revolt, a youth movement born from exam leaks and online mockery, as having pierced Prime Minister Narendra Modi’s aura of invincibility. This burgeoning movement, metaphorically referred to as 'the cockroaches coming together,' may yet reshape Indian politics. It signals a significant challenge to established power structures from a new generation.", "analysis": null, "time": "Yesterday", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/c08a78b1b2d47a78e8c33a538ade71c9ed1c83/500_0_5000_4000/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/jul/28/the-guardian-view-on-indias-gen-z-revolt-the-cockroaches-are-coming-together"}]}]}</script>

  <script>
    (function () {
      var raw = document.getElementById('edition').textContent;
      var data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<div class="notice">No edition loaded. Run the build to generate today’s paper.</div>';
        return;
      }

      var state = { active: (data.sections[0] || {}).id, openId: null };

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Editorial heat flags keep the red chip; procedural flags cool to navy,
      // so a red chip still means something (the Scarce Red Rule).
      function isHotTag(t) {
        return /^(DEVELOPING|BREAKING|LIVE|WAR|ALERT|URGENT)$/i.test(t || '');
      }

      // ---- Ask AI ----------------------------------------------------------
      // The reader taps one story and gets a briefing, not a chat. The prompt
      // does three jobs: hand over the clipping, name the shape of the answer
      // (five parts, ~500 words, hard ceiling), and set up the follow-up so the
      // conversation continues without the reader having to think of a question.
      // Voice constraints mirror src/config.py HOUSE_VOICE, em dash ban included.
      function buildPrompt(st, sectionLabel) {
        var L = [];
        L.push('I read this in my morning paper and I want to understand it properly.');
        L.push('');
        L.push('THE CLIPPING');
        L.push('Headline: ' + st.headline);
        if (st.sub) L.push('Standfirst: ' + st.sub);
        if (st.summary) L.push('Summary: ' + st.summary);
        if (st.analysis) L.push("My paper's why-it-matters note: " + st.analysis);
        L.push('Section: ' + sectionLabel + '. Filed ' + (st.time || 'this morning') +
               ', edition of ' + data.date + '.');
        if (st.link) L.push('Source: ' + st.link);
        L.push('');
        L.push('WHAT I WANT');
        L.push('A briefing that leaves me genuinely informed, not a restatement of what I just');
        L.push('pasted. Assume I know nothing beyond the clipping above.');
        L.push('');
        L.push('Check current reporting first if you are able to search. My clipping is a');
        L.push('summary and may be incomplete or already overtaken by events. If you cannot');
        L.push('search, say so in one line at the top, then separate what you are confident');
        L.push('about from what you would want verified.');
        L.push('');
        L.push('STRUCTURE');
        L.push('I am reading this on a phone. Build the answer in layers, heaviest first, so');
        L.push('I can stop at the end of any layer and still have got something whole. Use');
        L.push('these markdown headings exactly, so they render large on a small screen.');
        L.push('');
        L.push('# The gist');
        L.push('An H1 of six to ten words stating the actual point, not the topic. Then two or');
        L.push('three short sentences giving me the whole story in plain words. If I read');
        L.push('nothing else, this is what I walk away knowing. Correct my clipping here if it');
        L.push('is wrong or out of date.');
        L.push('');
        L.push('## Why it matters');
        L.push('Two or three short sentences on the stakes and the second order effects. Be');
        L.push('concrete about who gains, who pays, how much, and by when.');
        L.push('');
        L.push('## How we got here');
        L.push('Only the background I need to follow this story. Not a history lecture.');
        L.push('');
        L.push('## Where it is contested');
        L.push('The strongest disagreement among serious people, put fairly. If it is genuinely');
        L.push('uncontested, say so in one sentence and move on.');
        L.push('');
        L.push('## What to watch');
        L.push('Three bullets, each a specific checkable marker with a rough timeframe.');
        L.push('');
        L.push('## Ask me next');
        L.push('Three numbered questions, ordered by what would teach me the most. I will reply');
        L.push('with a digit.');
        L.push('');
        L.push('READING ON A PHONE');
        L.push('Short paragraphs: three sentences at most, none longer than about sixty words,');
        L.push('with a blank line between them. No tables, no nested bullets, no wall of text.');
        L.push('Around 500 words in total. Hard ceiling 650. Do not pad to reach a length; the');
        L.push('gist and why it matters are worth more than the sections under them.');
        L.push('');
        L.push('VOICE');
        L.push('Financial Times, not an encyclopedia and not a chatbot. Plain, confident,');
        L.push('concrete. Specifics over abstractions: names, numbers, dates, stakes. Every');
        L.push('sentence earns its place. No preamble, no throat clearing, no restating my');
        L.push('prompt back to me, no hedging filler, no em dashes. Where you are uncertain,');
        L.push('mark it in the sentence it applies to rather than in a disclaimer paragraph.');
        return L.join('\n');
      }

      function findStory(id) {
        for (var i = 0; i < data.sections.length; i++) {
          var list = data.sections[i].stories || [];
          for (var j = 0; j < list.length; j++) {
            if (list[j].id === id) {
              return { story: list[j], label: data.sections[i].label };
            }
          }
        }
        return null;
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        // Older iOS standalone PWAs land here.
        return new Promise(function (resolve, reject) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('copy failed'));
        });
      }

      // Tagline reflects the sections the edition actually shipped, not a
      // hardcoded list that can disagree with the paper.
      function taglineText() {
        var labels = data.sections
          .filter(function (s) { return s.id !== 'front'; })
          .map(function (s) { return s.label; });
        return (labels.length ? labels : ['Toronto', 'World', 'Business']).join(' · ');
      }

      function weatherHtml(w) {
        if (!w || !w.icon) return '';
        var week = (w.week || []).map(function (d) {
          return '<div class="day"><div class="d">' + esc(d.day) + '</div>' +
            '<div class="i">' + esc(d.icon) + '</div>' +
            '<div class="hi">' + esc(d.hi) + '°</div>' +
            '<div class="lo">' + esc(d.lo) + '°</div></div>';
        }).join('');
        return '<div class="weather" id="weather" role="button" tabindex="0" ' +
          'aria-expanded="false" aria-label="Toronto weather, tap for the week">' +
          '<div class="summary">' +
            '<span class="ico">' + esc(w.icon) + '</span>' +
            '<span class="city">Toronto</span>' +
            '<span class="temp">' + esc(w.high) + '° / ' + esc(w.low) + '°</span>' +
            '<span class="muted">' + esc(w.condition) + '</span>' +
            '<span class="muted">Rain ' + esc(w.rain) + '</span>' +
            '<span class="muted">Wind ' + esc(w.wind) + '</span>' +
            '<span class="chev" id="wchev">▼</span>' +
          '</div>' +
          '<div class="week" id="wweek" style="display:none">' + week + '</div>' +
        '</div>';
      }

      function tabsHtml() {
        return '<div class="tabs" role="tablist">' + data.sections.map(function (s) {
          var on = s.id === state.active;
          return '<button class="tab' + (on ? ' active' : '') + '" role="tab" ' +
            'aria-selected="' + on + '" data-tab="' + esc(s.id) + '">' + esc(s.label) + '</button>';
        }).join('') + '</div>';
      }

      function cardHtml(st, sectionLabel) {
        var open = st.id === state.openId;
        var tag = st.tag
          ? '<span class="tag ' + (isHotTag(st.tag) ? 'hot' : 'cool') + '">' + esc(st.tag) + '</span>'
          : '';
        var kicker = st.kicker ? '<div class="kicker">' + tag + esc(st.kicker) + '</div>' : '';
        var sub = st.sub ? '<div class="sub">' + esc(st.sub) + '</div>' : '';
        var expand = '';
        if (open) {
          var img = st.image
            ? '<img src="' + esc(st.image) + '" alt="' + esc(st.headline) + '" ' +
              'loading="lazy" onerror="this.remove()" />'
            : '';
          var analysis = st.analysis
            ? '<div class="analysis"><span class="alabel">Why it matters</span>' + esc(st.analysis) + '</div>'
            : '';
          var link = st.link
            ? '<a class="readmore" href="' + esc(st.link) + '" target="_blank" rel="noopener">Read full story →</a>'
            : '';

          // Prefill the destinations at render time so a long press ("open in
          // app") carries the prompt too, instead of us intercepting the tap.
          var q = encodeURIComponent(buildPrompt(st, sectionLabel));
          // No target="_blank" on these two. In a standalone PWA a blank target
          // opens an in-app browser sheet, which iOS will not hand off to an
          // installed app; a plain top-level tap is what lets the Claude and
          // ChatGPT apps claim their own domains as Universal Links. "Read full
          // story" keeps _blank, because a news site does belong in a tab.
          var share = navigator.share
            ? '<button class="ask-opt" data-ai="share" data-id="' + esc(st.id) + '">Share to app…</button>'
            : '';
          var actions = '<div class="actions">' + link +
            '<button class="askai" data-ask="' + esc(st.id) + '" aria-expanded="false" ' +
              'aria-controls="ask-' + esc(st.id) + '">Ask AI ▾</button></div>' +
            '<div class="ask-panel" id="ask-' + esc(st.id) + '">' +
              '<div class="ask-row">' +
                '<a class="ask-opt" href="https://claude.ai/new?q=' + esc(q) + '">Claude</a>' +
                '<a class="ask-opt" href="https://chatgpt.com/?q=' + esc(q) + '">ChatGPT</a>' +
                share +
                '<button class="ask-opt" data-ai="copy" data-id="' + esc(st.id) + '">Copy</button>' +
              '</div>' +
              '<div class="ask-note">Opens in the app if you have it installed. The reply ' +
                'starts with the gist in a few lines, then goes deeper, then offers three ' +
                'follow-up questions.</div>' +
            '</div>';

          expand = '<div class="expand">' + img +
            '<p class="sumtext">' + esc(st.summary) + '</p>' + analysis + actions + '</div>';
        }
        return '<div class="card' + (st.lead ? ' lead' : '') + (open ? ' open' : '') +
          '" data-card="' + esc(st.id) + '" role="button" tabindex="0" ' +
          'aria-expanded="' + open + '">' +
          '<div class="row"><div class="row-main">' + kicker +
            '<div class="headline">' + esc(st.headline) + '</div>' + sub +
            '<div class="time">' + esc(st.time) + '</div></div>' +
            '<div class="toggle" aria-hidden="true">' + (open ? '−' : '+') + '</div>' +
          '</div>' + expand +
        '</div>';
      }

      function storiesInner() {
        var section = data.sections.filter(function (s) { return s.id === state.active; })[0];
        if (!section) return '';
        if (!section.stories || !section.stories.length) {
          return '<div class="empty">Nothing filed for ' + esc(section.label) + ' this morning.</div>';
        }
        return section.stories.map(function (st) {
          return cardHtml(st, section.label);
        }).join('');
      }

      // Quietly flag a saved (not-today) edition served from cache/offline.
      function staleRibbon() {
        try {
          var meta = document.querySelector('meta[name=build]');
          if (!meta) return '';
          var built = new Date(meta.getAttribute('content'));
          if (isNaN(built.getTime())) return '';
          var opt = { timeZone: 'America/Toronto' };
          if (built.toLocaleDateString('en-CA', opt) < new Date().toLocaleDateString('en-CA', opt)) {
            return '<div class="stale">Saved edition · ' + esc(data.date) + '</div>';
          }
        } catch (e) {}
        return '';
      }

      function appHtml() {
        return '<div class="masthead">' +
            '<div class="date">' + esc(data.date) + '</div>' +
            '<div class="title">THE DAILY</div>' +
            '<div class="tagline">' + esc(taglineText()) + '</div>' +
          '</div>' +
          staleRibbon() +
          weatherHtml(data.weather) +
          tabsHtml() +
          '<div class="stories" id="stories">' + storiesInner() + '</div>' +
          '<div class="footer">THE DAILY · TORONTO · Tap any headline to read</div>';
      }

      var app = document.getElementById('app');

      // Rebuild only the stories column; masthead, weather, and tab strip (and
      // their scroll/open state) are left untouched. This is what keeps a tap
      // from resetting the reader's place.
      function refreshStories() {
        document.getElementById('stories').innerHTML = storiesInner();
        bindCards();
      }

      function selectTab(id) {
        if (id === state.active) return;
        state.active = id;
        state.openId = null;
        var tabs = document.querySelectorAll('.tab');
        Array.prototype.forEach.call(tabs, function (t) {
          var on = t.getAttribute('data-tab') === id;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on);
          if (on) t.scrollIntoView({ inline: 'center', block: 'nearest' });
        });
        refreshStories();
        // Start the new section at the top, tab strip stuck under the notch.
        var tabsEl = document.querySelector('.tabs');
        if (tabsEl) window.scrollTo(0, tabsEl.offsetTop);
      }

      function toggleCard(id) {
        var y = window.scrollY;
        state.openId = state.openId === id ? null : id;
        refreshStories();
        window.scrollTo(0, y);   // grow/collapse in place, never jump
      }

      function bindWeather() {
        var weather = document.getElementById('weather');
        if (!weather) return;
        function toggle() {
          var week = document.getElementById('wweek');
          var chev = document.getElementById('wchev');
          var showing = week.style.display !== 'none';
          week.style.display = showing ? 'none' : 'flex';
          chev.textContent = showing ? '▼' : '▲';
          weather.setAttribute('aria-expanded', String(!showing));
        }
        weather.addEventListener('click', toggle);
        weather.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
        });
      }

      function bindTabs() {
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
          btn.addEventListener('click', function () { selectTab(btn.getAttribute('data-tab')); });
        });
      }

      function bindCards() {
        Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
          function activate(ev) {
            // Let links and the Ask AI controls handle their own activation.
            if (ev.target.closest('a, button')) return;
            // While open, only the header row collapses it, so reading (and
            // selecting) the body never closes the story by accident.
            if (card.classList.contains('open') && !ev.target.closest('.row')) return;
            toggleCard(card.getAttribute('data-card'));
          }
          card.addEventListener('click', activate);
          card.addEventListener('keydown', function (ev) {
            if (ev.key !== 'Enter' && ev.key !== ' ') return;
            // Never swallow the key from a control that acts on it itself.
            if (ev.target.closest('a, button')) return;
            ev.preventDefault();
            activate(ev);
          });
          bindAsk(card);
        });
      }

      // Panel state is held in the DOM, not in `state`, so opening the
      // destinations never triggers a stories rebuild and never moves the page.
      function bindAsk(card) {
        var toggle = card.querySelector('.askai');
        if (!toggle) return;
        var panel = card.querySelector('.ask-panel');

        toggle.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var open = panel.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(open));
          toggle.textContent = open ? 'Ask AI ▴' : 'Ask AI ▾';
        });

        Array.prototype.forEach.call(panel.querySelectorAll('[data-ai]'), function (el) {
          var kind = el.getAttribute('data-ai');
          el.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var found = findStory(el.getAttribute('data-id'));
            if (!found) return;
            var prompt = buildPrompt(found.story, found.label);

            if (kind === 'share') {
              navigator.share({ text: prompt }).catch(function () {});
              return;
            }
            var label = el.textContent;
            copyText(prompt).then(function () {
              el.textContent = 'Copied';
            }).catch(function () {
              el.textContent = 'Copy failed';
            }).then(function () {
              setTimeout(function () { el.textContent = label; }, 1800);
            });
          });
        });
      }

      app.innerHTML = appHtml();
      bindWeather();
      bindTabs();
      bindCards();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
