  <title>The Daily</title>
  <style>
    /* ---- Design tokens: The Morning Broadsheet ------------------------- */
    :root {
      --paper: #faf8f3;        /* the sheet (warm white, never #fff) */
      --desk: #efece6;         /* the desk beyond the column */
      --ink: #17130d;          /* headlines / primary text */
      --ink-sub: #453f38;      /* standfirsts */
      --ink-muted: #635d54;    /* inactive tabs */
      --meta: #6c665c;         /* timestamps, dateline, footer (>=AA small) */
      --rule: #dcd6cc;         /* hairline between cards */
      --rule-soft: #e3ded4;    /* hairline inside an opened card */
      --navy: #1a2744;         /* structural ink */
      --navy-ink: #1a2744;     /* navy used as text (links, active tab) */
      --red: #8b1a1a;          /* editorial heat */
      --tint-open: #f2ede4;    /* ground of an expanded card */
      --tint-analysis: #ece6da;/* ground of the why-it-matters note */
      --strip-bg: #1a2744;     /* weather strip */
      --strip-ink: #f7f4ee;
      --chip-hot: #8b1a1a;     /* DEVELOPING / WAR-class flags */
      --chip-cool: #1a2744;    /* procedural flags (FINAL, EDITORIAL) */
      --chip-ink: #faf8f3;
      --focus: #1a2744;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151a22;      /* lamplight edition: deep navy-black paper */
        --desk: #0e1219;
        --ink: #e9e3d5;        /* cream ink */
        --ink-sub: #bcb6a8;
        --ink-muted: #948e82;
        --meta: #8f897d;
        --rule: #2a303a;
        --rule-soft: #2f3540;
        --navy: #6f82a8;       /* structure lifted so it reads on dark */
        --navy-ink: #a3b3d2;
        --red: #d1726b;        /* desaturated heat */
        --tint-open: #1b212b;
        --tint-analysis: #20262f;
        --strip-bg: #1b2334;
        --strip-ink: #e9e3d5;
        --chip-hot: #a8443c;
        --chip-cool: #3b4a6c;
        --chip-ink: #f0eadc;
        --focus: #a3b3d2;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 100%; }
    html, body { background: var(--desk); }
    body {
      font-family: 'Georgia', serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--paper);
      max-width: 680px;
      margin: 0 auto;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Masthead */
    .masthead {
      border-bottom: 4px solid var(--navy);
      padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
      background: var(--paper);
    }
    .masthead .date {
      font-size: 0.6875rem; color: var(--meta); letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .masthead .title {
      font-size: 2.375rem; font-weight: 700; letter-spacing: -0.01em;
      color: var(--navy); line-height: 1; margin-bottom: 2px;
    }
    .masthead .tagline {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; color: var(--meta);
      letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* Stale-edition ribbon */
    .stale {
      background: var(--tint-analysis); color: var(--meta);
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; text-align: center;
      padding: 7px 20px;
    }

    /* Weather strip */
    .weather {
      background: var(--strip-bg); color: var(--strip-ink);
      cursor: pointer; user-select: none;
    }
    .weather .summary {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
      min-height: 44px;
    }
    .weather .summary::-webkit-scrollbar { display: none; }
    .weather .ico { font-size: 1.375rem; }
    .weather .city { font-weight: 700; font-size: 0.9375rem; }
    .weather .temp { font-size: 0.9375rem; }
    .weather .muted { opacity: 0.72; font-size: 0.8125rem; white-space: nowrap; }
    .weather .chev { margin-left: auto; opacity: 0.6; font-size: 0.75rem; }
    .weather .week {
      display: flex; border-top: 1px solid rgba(255,255,255,0.12);
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
    }
    .weather .week::-webkit-scrollbar { display: none; }
    .weather .day {
      text-align: center; min-width: 52px; padding: 0 8px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .weather .day .d { font-size: 0.6875rem; opacity: 0.6; margin-bottom: 4px; }
    .weather .day .i { font-size: 1.125rem; }
    .weather .day .hi { font-size: 0.8125rem; font-weight: 700; margin-top: 4px; }
    .weather .day .lo { font-size: 0.6875rem; opacity: 0.5; }

    /* Tab nav */
    .tabs {
      display: flex; overflow-x: auto; border-bottom: 2px solid var(--navy);
      background: var(--paper); scrollbar-width: none;
      position: sticky; top: 0; z-index: 10;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; min-height: 44px; display: flex; align-items: center;
      padding: 0 18px; border: none; background: none; cursor: pointer;
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; font-weight: 700;
      color: var(--ink-muted); border-bottom: 3px solid transparent;
      margin-bottom: -2px; letter-spacing: 0.12em; text-transform: uppercase;
      transition: color 0.15s;
    }
    .tab.active { color: var(--navy-ink); border-bottom-color: var(--navy); }

    /* Stories */
    .stories { padding: 8px 20px 40px; }
    .empty {
      padding: 40px 4px; text-align: center; color: var(--meta);
      font-style: italic; font-size: 0.9375rem;
    }
    .card {
      border-top: 1px solid var(--rule); padding: 14px 0; cursor: pointer;
      background: var(--paper); transition: background 0.15s;
    }
    .card.lead { border-top: 3px solid var(--navy); padding: 20px 0 16px; }
    .card.open { background: var(--tint-open); }
    .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card .row-main { flex: 1; min-width: 0; }
    .card .kicker {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; color: var(--red); margin-bottom: 6px; text-transform: uppercase;
    }
    .card .tag {
      color: var(--chip-ink); padding: 2px 6px; margin-right: 8px;
      font-size: 0.5625rem; border-radius: 2px; vertical-align: 1px;
    }
    .card .tag.hot { background: var(--chip-hot); }
    .card .tag.cool { background: var(--chip-cool); }
    .card .headline {
      font-size: 1.0625rem; font-weight: 700; line-height: 1.25; color: var(--ink); margin-bottom: 6px;
    }
    .card.lead .headline { font-size: 1.375rem; }
    .card .sub {
      font-size: 0.875rem; color: var(--ink-sub); line-height: 1.4; margin-bottom: 4px; font-style: italic;
    }
    .card .time { font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta); margin-top: 4px; }
    .card .toggle { color: var(--navy-ink); opacity: 0.5; font-size: 1.125rem; flex-shrink: 0; margin-top: 2px; }
    .card .expand {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    }
    .card .expand .sumtext {
      font-size: 0.9375rem; color: var(--ink-sub); line-height: 1.7;
    }
    .card .expand img {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      background: var(--tint-open); border-radius: 3px; margin-bottom: 12px;
    }
    .card .analysis {
      margin-top: 12px; padding: 10px 14px; background: var(--tint-analysis);
      font-size: 0.875rem; line-height: 1.6; color: var(--ink-sub); font-style: italic;
    }
    .card .analysis .alabel {
      display: block; font-family: 'Arial', sans-serif; font-style: normal;
      font-size: 0.625rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--navy-ink); margin-bottom: 4px;
    }
    .card .readmore {
      display: inline-block; margin-top: 12px; min-height: 44px; line-height: 44px;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink); text-decoration: none;
    }
    .card .readmore:hover { text-decoration: underline; }
    .card .readmore:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    /* Ask AI: hand the clipping and a briefing prompt to a model */
    .card .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .askai, .card .ask-opt {
      border: none; background: none; padding: 0; cursor: pointer;
      min-height: 44px; line-height: 44px; text-decoration: none;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink);
    }
    .card .askai { margin-top: 12px; }
    .card .askai:hover, .card .ask-opt:hover { text-decoration: underline; }
    .card .askai:focus-visible, .card .ask-opt:focus-visible {
      outline: 2px solid var(--focus); outline-offset: 3px;
    }
    .card .ask-panel { display: none; border-top: 1px solid var(--rule-soft); margin-top: 4px; }
    .card .ask-panel.open { display: block; }
    .card .ask-row { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .ask-note {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.55;
      color: var(--meta); letter-spacing: 0.02em; padding-bottom: 12px;
    }

    /* Footer */
    .footer {
      border-top: 2px solid var(--navy);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta);
      text-align: center; letter-spacing: 0.06em;
    }
    .notice { padding: 40px 20px; text-align: center; color: var(--meta); font-style: italic; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>

ound-the-world-to-annual-caribbean-carnival-grand-parade/article_82536942-b88a-4227-83ea-d0a8f0ca609a.html"}, {"id": "t3", "lead": false, "kicker": "WEATHER ALERT", "headline": "Heavy Rain, Thunderstorms Expected for Toronto", "sub": "Environment Canada issues a special weather statement, forecasting up to 50 millimetres of rain for Sunday.", "summary": "Toronto is bracing for heavy rain and thunderstorms today, with Environment Canada issuing a special weather statement. The forecast predicts up to 50 millimetres of rain could fall on the city throughout Sunday. Residents are advised to prepare for potentially significant rainfall and localized flooding.", "analysis": null, "time": "Yesterday", "tag": "WEATHER", "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/c/2e/c2e3fb13-f99f-56cd-abd7-9f79f9d5dc0f/6a6e565a55585.image.jpg?resize=300%2C200", "link": "https://www.thestar.com/news/gta/heavy-rain-thunderstorms-expected-for-toronto/article_b8249487-0d6c-4c23-b49b-584efbf63673.html"}, {"id": "t4", "lead": false, "kicker": "TRANSPORTATION", "headline": "Toronto Highway Closures for Planned Roadwork on Aug. 2", "sub": "Highways 400, 401, 404, 409, 427, and the QEW are affected by scheduled roadwork today.", "summary": "Several major Toronto highways are scheduled for planned roadwork closures today, August 2. Affected routes include Highway 400, Highway 401, Highway 404, Highway 409, Highway 427, and the Queen Elizabeth Way. Motorists are advised to check for specific closure times and plan alternative routes to avoid delays.", "analysis": null, "time": "4:56 AM", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/1/b1/1b1cb060-5453-59cb-9a2c-1587b7880ee6/64b9593cf3051.image.jpg?resize=300%2C138", "link": "https://www.thestar.com/news/gta/highway-closures/toronto-highway-closures-for-planned-roadwork-on-aug-2/article_b8e2a954-c02a-5577-9d4d-0cdc3085aa70.html"}]}, {"id": "world", "label": "World", "stories": [{"id": "w1", "lead": true, "kicker": "VENEZUELA", "headline": "On Venezuela’s Coast, Life Is Reduced to Survival and Burial", "sub": "More than a month after devastating earthquakes, the coastal region of La Guaira is unrecognizable, with residents struggling for basic necessities.", "summary": "More than a month after a series of devastating earthquakes, Venezuela's coastal region of La Guaira, once the nation's primary gateway, remains unrecognizable. Residents are grappling with a dire humanitarian crisis, with daily life reduced to a struggle for survival and the grim task of burying the dead. The widespread destruction has left communities without basic infrastructure and resources, highlighting the long-term impact of the disaster.", "analysis": "The ongoing crisis in La Guaira underscores the fragility of infrastructure and the profound human cost of natural disasters, particularly in regions already facing economic hardship. The slow recovery efforts suggest a prolonged period of suffering for the affected population, with international aid likely becoming increasingly critical.", "time": "5:00 AM", "tag": "DISASTER", "sensitivity": true, "image": null, "link": "https://www.nytimes.com/2026/08/02/world/americas/venezuela-earthquakes-la-guaira.html"}, {"id": "w2", "lead": false, "kicker": "WEST AFRICA", "headline": "Anti-LGBTQ+ Laws Are on the Rise Across West Africa, Campaigners Warn", "sub": "Activists report that politicians are using LGBTQ+ people as scapegoats to maintain power, leading to increased legislative discrimination.", "summary": "Campaigners are sounding the alarm over a concerning rise in anti-LGBTQ+ laws across West Africa. Activists in the region assert that politicians are increasingly targeting LGBTQ+ individuals, using them as \"the easiest scapegoats to maintain their power.\" This trend is leading to heightened discrimination and legal challenges for LGBTQ+ communities throughout the region.", "analysis": null, "time": "4:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/725aee047802b1eb39e000a019d0566950c75641/742_425_2422_1938/500.jpg", "link": "https://www.theguardian.com/world/2026/aug/02/anti-lgbtq-laws-are-on-the-rise-across-west-africa-campaigners-warn"}, {"id": "w3", "lead": false, "kicker": "KENYA", "headline": "‘Free Up the Ganja’: Rastafarians in Kenya Fight to Decriminalise Marijuana", "sub": "Rastafari followers in Kenya argue that criminalizing marijuana, which plays a sacred role in their faith, violates their religious rights.", "summary": "Rastafarian followers in Kenya are actively campaigning for the decriminalization of marijuana, arguing that current laws violate their religious rights. They contend that cannabis, or 'ganja,' holds a sacred and central role in their spiritual practices. The movement seeks to challenge the legal framework that criminalizes a substance integral to their faith.", "analysis": null, "time": "8:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/39c804520c04e7c2ae0ede8b725a145e9b403063/453_0_5020_4016/500.jpg", "link": "https://www.theguardian.com/world/2026/aug/02/kenya-rastafari-fight-legalise-marijuana-cannabis-religion"}, {"id": "w4", "lead": false, "kicker": "EUROPE", "headline": "Callas, Beethoven, Bee-Eaters or Storks: Competition Seeks to Redesign Euro Notes", "sub": "The European Union is using a currency redesign to build identity and move away from neutral imagery.", "summary": "The European Union has launched a competition to redesign euro banknotes, seeking new imagery that moves beyond neutral themes to build a more distinct European identity. Proposals include cultural icons like Maria Callas and Beethoven, alongside natural elements such as bee-eaters or storks. This initiative aims to foster a sense of shared heritage and values through the currency's visual representation.", "analysis": null, "time": "6:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/783bff783bd5f9cc087fe1db66bcd93d2b1e6efe/0_0_3937_3150/500.jpg", "link": "https://www.theguardian.com/world/2026/aug/02/european-central-bank-notes-new-design"}]}, {"id": "sports", "label": "Sports", "stories": [{"id": "s1", "lead": true, "kicker": "COMMONWEALTH GAMES", "headline": "Commonwealth Games 2026: Track Cycling, Netball and More on Final Day – Live", "sub": "Glasgow hosts the final medal events, including track cycling and netball, before Sunday evening’s closing ceremony.", "summary": "The 2026 Commonwealth Games in Glasgow are concluding today with a packed schedule of final medal events, including track cycling and netball. Athletes are competing for the last of the 645 medals on offer before the closing ceremony this evening. Australia has already secured an unprecedented podium sweep in the women's mile and a gold in the men's 4x100m relay, while Scotland's Josh Kerr claimed gold in the men's mile.", "analysis": "The final day of the Commonwealth Games marks the culmination of intense competition and national pride, with several nations making strong showings. The focus now shifts to the legacy of the Glasgow Games and the ongoing discussions around the future of multi-sport events in a changing global landscape.", "time": "10:10 AM", "tag": "FINAL", "sensitivity": false, "image": "https://media.guim.co.uk/9fe572d7abf98853c48e8260cae9f14205f1fab4/520_0_3496_2796/500.jpg", "link": "https://www.theguardian.com/sport/live/2026/aug/02/commonwealth-games-2026-day-10-track-cycling-netball-closing-ceremony-live"}, {"id": "s2", "lead": false, "kicker": "GOLF", "headline": "Yealimi Noh Leads Women’s Open by Three Shots After Ryu Hae-ran Stumbles", "sub": "Ryu Hae-ran's bid for a third consecutive major win is in doubt, with England's Lottie Woad and Charley Hull still in contention.", "summary": "Yealimi Noh has taken a commanding three-shot lead at the Women's inct, with David Crisafulli stating the project will be enjoyed by Queenslanders for generations. However, critics are dismissing the proposals as a 'fantasy vision,' citing a significant lack of detailed information. Opponents argue that the plans lack the necessary specifics to be considered viable or realistic.", "analysis": null, "time": "6:40 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/069bfcaf7a7a417688d5380c0da14177c120c7e4/212_67_1601_1280/500.jpg", "link": "https://www.theguardian.com/sport/2026/aug/02/queensland-reveals-concept-plans-for-brisbane-olympic-stadium-precinct-but-critics-say-they-are-fantasy-vision"}]}, {"id": "business", "label": "Business", "stories": [{"id": "b1", "lead": true, "kicker": "UK ECONOMY", "headline": "UK’s State Investments Agency Hit by Data Breach", "sub": "A security lapse exposed sensitive information and contact details for 51 government officials for 40 hours.", "summary": "The UK's state investments agency has suffered a significant data breach, exposing sensitive information and contact details for 51 government officials. The security lapse remained undetected for 40 hours, raising concerns about national security and data protection protocols. An investigation is underway to determine the full extent of the breach and implement corrective measures, with potential implications for the officials involved and government operations.", "analysis": "This data breach highlights critical vulnerabilities in government cybersecurity, particularly for agencies handling sensitive financial and official information. The exposure of contact details for high-ranking officials could lead to targeted phishing attacks or other forms of exploitation, underscoring the urgent need for enhanced digital defenses across public sector bodies.", "time": "6:00 AM", "tag": "CYBERSECURITY", "sensitivity": false, "image": "https://media.guim.co.uk/c24b73fd1d29d040bef47aaa6eb42c8cfac65aed/520_0_5200_4160/500.jpg", "link": "https://www.theguardian.com/business/2026/aug/02/uk-state-investments-agency-data-breach"}, {"id": "b2", "lead": false, "kicker": "UK BUSINESS", "headline": "Kremlin Connections: The Russia Links to a £600m UK Theme Park", "sub": "French company Puy du Fou worked with a sanctioned oligarch on Crimea resort plans longer than disclosed, then courted Iran and China.", "summary": "A French company, Puy du Fou, involved in a £600 million UK theme park project, has been found to have undisclosed, extended ties with a sanctioned Russian oligarch on plans for a Crimea resort. The company later sought partnerships with Iran and China, raising questions about its financial dealings and geopolitical connections. This revelation casts a shadow over the UK theme park's development.", "analysis": null, "time": "6:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/28528f140b311168a376daabef094a0d598e73c4/16_0_4906_3925/500.jpg", "link": "https://www.theguardian.com/business/2026/aug/02/kremlin-links-new-uk-theme-park-puy-du-fou"}, {"id": "b3", "lead": false, "kicker": "AGRICULTURE", "headline": "‘Worst We’ve Known’: UK Turns to Imports as Drought and Heat Hit Vegetable Crops", "sub": "Scorching weather and lack of rain have devastated yields, causing wholesale prices to rocket and increasing reliance on imports.", "summary": "UK growers are in dismay as severe drought and scorching heat have decimated vegetable crops, leading to the 'worst' yields in memory. This agricultural crisis has caused wholesale prices to skyrocket and forced the UK to significantly increase its reliance on imported vegetables. The situation highlights the growing vulnerability of domestic food supply chains to climate change.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/420f4c8c62c8dd4cd3857ff453d7f5a6996325dc/479_0_5493_4396/500.jpg", "link": "https://www.theguardian.com/business/2026/aug/01/uk-importing-vegetabless-drough-heat-hit-british-crops-price-rises"}, {"id": "b4", "lead": false, "kicker": "TECH", "headline": "Aw, It’s Baby’s First A.I. Surveillance System", "sub": "Start-ups like Nanit are developing smart monitors to track children through the night, with plans for extended surveillance.", "summary": "New start-ups, including Nanit, are introducing AI-powered surveillance systems designed to track children through the night. These smart baby monitors aim to provide detailed data on infants' sleep patterns and health, with developers planning to extend surveillance capabilities beyond infancy. The technology raises questions about privacy and the increasing integration of AI into family life.", "analysis": null, "time": "5:01 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/08/02/multimedia/02biz-babytech-lede-flwk/02biz-babytech-lede-flwk-superJumbo.jpg", "link": "https://www.nytimes.com/2026/08/02/business/smart-baby-monitors-nanit-owlet.html"}]}, {"id": "opinion", "label": "Opinion", "stories": [{"id": "o1", "lead": true, "kicker": "US POLITICS", "headline": "The US War on Iran Is Spinning Out of Control | Mohamad Bazzi", "sub": "Mohamad Bazzi argues that President Trump’s conflict with Iran is escalating, with Saudi Arabia joining airstrikes and a potential recession looming.", "summary": "Mohamad Bazzi warns that President Trump's conflict with Iran is rapidly escalating beyond control, with Saudi Arabia reportedly joining airstrikes in Iraq and planning an attack on the Houthis. Bazzi suggests that this widening military engagement could trigger a significant economic recession. The piece critically examines the administration's foreign policy, arguing that its aggressive stance risks destabilizing the Middle East and incurring severe global consequences.", "analysis": "This opinion piece offers a stark warning about the potential for a broader regional conflict and its economic fallout, directly challenging the narrative of de-escalation presented by President Trump. It highlights the deep divisions in how the current US foreign policy in the Middle East is perceived and the high stakes involved for global stability.", "time": "Yesterday", "tag": "EDITORIAL", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/commentisfree/2026/aug/01/us-iran-war-trump-recession"}, {"id": "o2", "lead": false, "kicker": "MEDIA ETHICS", "headline": "In the Battle of Elon Musk v the Press, We Can’t Let Truth Be the Loser | Jane Martinson", "sub": "Guardian columnist Jane Martinson discusses how the media should respond to Elon Musk's attacks, including calling an editor a 'traitor to the west.'", "summary": "Guardian columnist Jane Martinson addresses the escalating conflict between Elon Musk and the press, emphasizing the critical need to uphold truth. Martinson analyzes how the media should respond to Musk's aggressive tactics, including his recent accusation that the editor of The Economist is a 'traitor to the west' following a contentious interview. The piece argues that journalistic integrity must not be compromised in the face of such attacks.", "analysis": null, "time": "Yesterday", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/723c623b125b49ffaf4b48765ad2e07315105c0d/0_0_3607_2885/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/01/elon-musk-truth-interview-editor-economist"}, {"id": "o3", "lead": false, "kicker": "SOCIAL COMMENTARY", "headline": "Apparently, I’ve Got ‘Comfort Creep’. I Prefer to Think of It as Finally Knowing What I Like | Polly Hudson", "sub": "Polly Hudson argues that routine is a reward for experimentation, not a failure of imagination, embracing her preference for familiar comforts.", "summary": "Polly Hudson challenges the notion of 'comfort creep,' asserting that embracing routine is a reward for past experimentation, not a lack of imagination. She defends her preference for returning to favorite restaurants and ordering familiar dishes, arguing that knowing what one likes is a sign of maturity and contentment. Hudson's piece advocates for finding joy in consistency rather than constantly seeking novelty.", "analysis": null, "time": "4:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/2522391b7f27b48c4f10346cb687362892d4c909/526_0_5200_4160/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/02/comfort-creep"}, {"id": "o4", "lead": false, "kicker": "EDUCATION", "headline": "If You Think Kids Will Respect a Robot Teacher, You Have Never Met a Kid | Dave Schilling", "sub": "Dave Schilling critiques a New York school district's paused plans to introduce an android into the classroom, questioning the future of educational technology.", "summary": "Dave Schilling satirically critiques a New York school district's recent decision to pause plans for introducing a robot teacher into the classroom. Schilling argues that the idea of children respecting an android educator is fundamentally flawed, suggesting it reveals a misunderstanding of child psychology and classroom dynamics. The piece questions the efficacy and wisdom of integrating advanced AI into early education.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/d01002863e751c83ac09e45c485806940292dcee/1_0_2999_2400/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/01/new-york-salamanca-school-robot-teacher-plan"}]}]}</script>

  <script>
    (function () {
      var raw = document.getElementById('edition').textContent;
      var data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<div class="notice">No edition loaded. Run the build to generate today’s paper.</div>';
        return;
      }

      var state = { active: (data.sections[0] || {}).id, openId: null };

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Editorial heat flags keep the red chip; procedural flags cool to navy,
      // so a red chip still means something (the Scarce Red Rule).
      function isHotTag(t) {
        return /^(DEVELOPING|BREAKING|LIVE|WAR|ALERT|URGENT)$/i.test(t || '');
      }

      // ---- Ask AI ----------------------------------------------------------
      // The reader taps one story and gets a briefing, not a chat. The prompt
      // does three jobs: hand over the clipping, name the shape of the answer
      // (five parts, ~500 words, hard ceiling), and set up the follow-up so the
      // conversation continues without the reader having to think of a question.
      // Voice constraints mirror src/config.py HOUSE_VOICE, em dash ban included.
      function buildPrompt(st, sectionLabel) {
        var L = [];
        L.push('I read this in my morning paper and I want to understand it properly.');
        L.push('');
        L.push('THE CLIPPING');
        L.push('Headline: ' + st.headline);
        if (st.sub) L.push('Standfirst: ' + st.sub);
        if (st.summary) L.push('Summary: ' + st.summary);
        if (st.analysis) L.push("My paper's why-it-matters note: " + st.analysis);
        L.push('Section: ' + sectionLabel + '. Filed ' + (st.time || 'this morning') +
               ', edition of ' + data.date + '.');
        if (st.link) L.push('Source: ' + st.link);
        L.push('');
        L.push('WHAT I WANT');
        L.push('A briefing that leaves me genuinely informed, not a restatement of what I just');
        L.push('pasted. Assume I know nothing beyond the clipping above.');
        L.push('');
        L.push('Check current reporting first if you are able to search. My clipping is a');
        L.push('summary and may be incomplete or already overtaken by events. If you cannot');
        L.push('search, say so in one line at the top, then separate what you are confident');
        L.push('about from what you would want verified.');
        L.push('');
        L.push('STRUCTURE');
        L.push('I am reading this on a phone. Build the answer in layers, heaviest first, so');
        L.push('I can stop at the end of any layer and still have got something whole. Use');
        L.push('these markdown headings exactly, so they render large on a small screen.');
        L.push('');
        L.push('# The gist');
        L.push('An H1 of six to ten words stating the actual point, not the topic. Then two or');
        L.push('three short sentences giving me the whole story in plain words. If I read');
        L.push('nothing else, this is what I walk away knowing. Correct my clipping here if it');
        L.push('is wrong or out of date.');
        L.push('');
        L.push('## Why it matters');
        L.push('Two or three short sentences on the stakes and the second order effects. Be');
        L.push('concrete about who gains, who pays, how much, and by when.');
        L.push('');
        L.push('## How we got here');
        L.push('Only the background I need to follow this story. Not a history lecture.');
        L.push('');
        L.push('## Where it is contested');
        L.push('The strongest disagreement among serious people, put fairly. If it is genuinely');
        L.push('uncontested, say so in one sentence and move on.');
        L.push('');
        L.push('## What to watch');
        L.push('Three bullets, each a specific checkable marker with a rough timeframe.');
        L.push('');
        L.push('## Ask me next');
        L.push('Three numbered questions, ordered by what would teach me the most. I will reply');
        L.push('with a digit.');
        L.push('');
        L.push('READING ON A PHONE');
        L.push('Short paragraphs: three sentences at most, none longer than about sixty words,');
        L.push('with a blank line between them. No tables, no nested bullets, no wall of text.');
        L.push('Around 500 words in total. Hard ceiling 650. Do not pad to reach a length; the');
        L.push('gist and why it matters are worth more than the sections under them.');
        L.push('');
        L.push('VOICE');
        L.push('Financial Times, not an encyclopedia and not a chatbot. Plain, confident,');
        L.push('concrete. Specifics over abstractions: names, numbers, dates, stakes. Every');
        L.push('sentence earns its place. No preamble, no throat clearing, no restating my');
        L.push('prompt back to me, no hedging filler, no em dashes. Where you are uncertain,');
        L.push('mark it in the sentence it applies to rather than in a disclaimer paragraph.');
        return L.join('\n');
      }

      function findStory(id) {
        for (var i = 0; i < data.sections.length; i++) {
          var list = data.sections[i].stories || [];
          for (var j = 0; j < list.length; j++) {
            if (list[j].id === id) {
              return { story: list[j], label: data.sections[i].label };
            }
          }
        }
        return null;
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        // Older iOS standalone PWAs land here.
        return new Promise(function (resolve, reject) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('copy failed'));
        });
      }

      // Tagline reflects the sections the edition actually shipped, not a
      // hardcoded list that can disagree with the paper.
      function taglineText() {
        var labels = data.sections
          .filter(function (s) { return s.id !== 'front'; })
          .map(function (s) { return s.label; });
        return (labels.length ? labels : ['Toronto', 'World', 'Business']).join(' · ');
      }

      function weatherHtml(w) {
        if (!w || !w.icon) return '';
        var week = (w.week || []).map(function (d) {
          return '<div class="day"><div class="d">' + esc(d.day) + '</div>' +
            '<div class="i">' + esc(d.icon) + '</div>' +
            '<div class="hi">' + esc(d.hi) + '°</div>' +
            '<div class="lo">' + esc(d.lo) + '°</div></div>';
        }).join('');
        return '<div class="weather" id="weather" role="button" tabindex="0" ' +
          'aria-expanded="false" aria-label="Toronto weather, tap for the week">' +
          '<div class="summary">' +
            '<span class="ico">' + esc(w.icon) + '</span>' +
            '<span class="city">Toronto</span>' +
            '<span class="temp">' + esc(w.high) + '° / ' + esc(w.low) + '°</span>' +
            '<span class="muted">' + esc(w.condition) + '</span>' +
            '<span class="muted">Rain ' + esc(w.rain) + '</span>' +
            '<span class="muted">Wind ' + esc(w.wind) + '</span>' +
            '<span class="chev" id="wchev">▼</span>' +
          '</div>' +
          '<div class="week" id="wweek" style="display:none">' + week + '</div>' +
        '</div>';
      }

      function tabsHtml() {
        return '<div class="tabs" role="tablist">' + data.sections.map(function (s) {
          var on = s.id === state.active;
          return '<button class="tab' + (on ? ' active' : '') + '" role="tab" ' +
            'aria-selected="' + on + '" data-tab="' + esc(s.id) + '">' + esc(s.label) + '</button>';
        }).join('') + '</div>';
      }

      function cardHtml(st, sectionLabel) {
        var open = st.id === state.openId;
        var tag = st.tag
          ? '<span class="tag ' + (isHotTag(st.tag) ? 'hot' : 'cool') + '">' + esc(st.tag) + '</span>'
          : '';
        var kicker = st.kicker ? '<div class="kicker">' + tag + esc(st.kicker) + '</div>' : '';
        var sub = st.sub ? '<div class="sub">' + esc(st.sub) + '</div>' : '';
        var expand = '';
        if (open) {
          var img = st.image
            ? '<img src="' + esc(st.image) + '" alt="' + esc(st.headline) + '" ' +
              'loading="lazy" onerror="this.remove()" />'
            : '';
          var analysis = st.analysis
            ? '<div class="analysis"><span class="alabel">Why it matters</span>' + esc(st.analysis) + '</div>'
            : '';
          var link = st.link
            ? '<a class="readmore" href="' + esc(st.link) + '" target="_blank" rel="noopener">Read full story →</a>'
            : '';

          // Prefill the destinations at render time so a long press ("open in
          // app") carries the prompt too, instead of us intercepting the tap.
          var q = encodeURIComponent(buildPrompt(st, sectionLabel));
          // No target="_blank" on these two. In a standalone PWA a blank target
          // opens an in-app browser sheet, which iOS will not hand off to an
          // installed app; a plain top-level tap is what lets the Claude and
          // ChatGPT apps claim their own domains as Universal Links. "Read full
          // story" keeps _blank, because a news site does belong in a tab.
          var share = navigator.share
            ? '<button class="ask-opt" data-ai="share" data-id="' + esc(st.id) + '">Share to app…</button>'
            : '';
          var actions = '<div class="actions">' + link +
            '<button class="askai" data-ask="' + esc(st.id) + '" aria-expanded="false" ' +
              'aria-controls="ask-' + esc(st.id) + '">Ask AI ▾</button></div>' +
            '<div class="ask-panel" id="ask-' + esc(st.id) + '">' +
              '<div class="ask-row">' +
                '<a class="ask-opt" href="https://claude.ai/new?q=' + esc(q) + '">Claude</a>' +
                '<a class="ask-opt" href="https://chatgpt.com/?q=' + esc(q) + '">ChatGPT</a>' +
                share +
                '<button class="ask-opt" data-ai="copy" data-id="' + esc(st.id) + '">Copy</button>' +
              '</div>' +
              '<div class="ask-note">Opens in the app if you have it installed. The reply ' +
                'starts with the gist in a few lines, then goes deeper, then offers three ' +
                'follow-up questions.</div>' +
            '</div>';

          expand = '<div class="expand">' + img +
            '<p class="sumtext">' + esc(st.summary) + '</p>' + analysis + actions + '</div>';
        }
        return '<div class="card' + (st.lead ? ' lead' : '') + (open ? ' open' : '') +
          '" data-card="' + esc(st.id) + '" role="button" tabindex="0" ' +
          'aria-expanded="' + open + '">' +
          '<div class="row"><div class="row-main">' + kicker +
            '<div class="headline">' + esc(st.headline) + '</div>' + sub +
            '<div class="time">' + esc(st.time) + '</div></div>' +
            '<div class="toggle" aria-hidden="true">' + (open ? '−' : '+') + '</div>' +
          '</div>' + expand +
        '</div>';
      }

      function storiesInner() {
        var section = data.sections.filter(function (s) { return s.id === state.active; })[0];
        if (!section) return '';
        if (!section.stories || !section.stories.length) {
          return '<div class="empty">Nothing filed for ' + esc(section.label) + ' this morning.</div>';
        }
        return section.stories.map(function (st) {
          return cardHtml(st, section.label);
        }).join('');
      }

      // Quietly flag a saved (not-today) edition served from cache/offline.
      function staleRibbon() {
        try {
          var meta = document.querySelector('meta[name=build]');
          if (!meta) return '';
          var built = new Date(meta.getAttribute('content'));
          if (isNaN(built.getTime())) return '';
          var opt = { timeZone: 'America/Toronto' };
          if (built.toLocaleDateString('en-CA', opt) < new Date().toLocaleDateString('en-CA', opt)) {
            return '<div class="stale">Saved edition · ' + esc(data.date) + '</div>';
          }
        } catch (e) {}
        return '';
      }

      function appHtml() {
        return '<div class="masthead">' +
            '<div class="date">' + esc(data.date) + '</div>' +
            '<div class="title">THE DAILY</div>' +
            '<div class="tagline">' + esc(taglineText()) + '</div>' +
          '</div>' +
          staleRibbon() +
          weatherHtml(data.weather) +
          tabsHtml() +
          '<div class="stories" id="stories">' + storiesInner() + '</div>' +
          '<div class="footer">THE DAILY · TORONTO · Tap any headline to read</div>';
      }

      var app = document.getElementById('app');

      // Rebuild only the stories column; masthead, weather, and tab strip (and
      // their scroll/open state) are left untouched. This is what keeps a tap
      // from resetting the reader's place.
      function refreshStories() {
        document.getElementById('stories').innerHTML = storiesInner();
        bindCards();
      }

      function selectTab(id) {
        if (id === state.active) return;
        state.active = id;
        state.openId = null;
        var tabs = document.querySelectorAll('.tab');
        Array.prototype.forEach.call(tabs, function (t) {
          var on = t.getAttribute('data-tab') === id;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on);
          if (on) t.scrollIntoView({ inline: 'center', block: 'nearest' });
        });
        refreshStories();
        // Start the new section at the top, tab strip stuck under the notch.
        var tabsEl = document.querySelector('.tabs');
        if (tabsEl) window.scrollTo(0, tabsEl.offsetTop);
      }

      function toggleCard(id) {
        var y = window.scrollY;
        state.openId = state.openId === id ? null : id;
        refreshStories();
        window.scrollTo(0, y);   // grow/collapse in place, never jump
      }

      function bindWeather() {
        var weather = document.getElementById('weather');
        if (!weather) return;
        function toggle() {
          var week = document.getElementById('wweek');
          var chev = document.getElementById('wchev');
          var showing = week.style.display !== 'none';
          week.style.display = showing ? 'none' : 'flex';
          chev.textContent = showing ? '▼' : '▲';
          weather.setAttribute('aria-expanded', String(!showing));
        }
        weather.addEventListener('click', toggle);
        weather.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
        });
      }

      function bindTabs() {
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
          btn.addEventListener('click', function () { selectTab(btn.getAttribute('data-tab')); });
        });
      }

      function bindCards() {
        Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
          function activate(ev) {
            // Let links and the Ask AI controls handle their own activation.
            if (ev.target.closest('a, button')) return;
            // While open, only the header row collapses it, so reading (and
            // selecting) the body never closes the story by accident.
            if (card.classList.contains('open') && !ev.target.closest('.row')) return;
            toggleCard(card.getAttribute('data-card'));
          }
          card.addEventListener('click', activate);
          card.addEventListener('keydown', function (ev) {
            if (ev.key !== 'Enter' && ev.key !== ' ') return;
            // Never swallow the key from a control that acts on it itself.
            if (ev.target.closest('a, button')) return;
            ev.preventDefault();
            activate(ev);
          });
          bindAsk(card);
        });
      }

      // Panel state is held in the DOM, not in `state`, so opening the
      // destinations never triggers a stories rebuild and never moves the page.
      function bindAsk(card) {
        var toggle = card.querySelector('.askai');
        if (!toggle) return;
        var panel = card.querySelector('.ask-panel');

        toggle.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var open = panel.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(open));
          toggle.textContent = open ? 'Ask AI ▴' : 'Ask AI ▾';
        });

        Array.prototype.forEach.call(panel.querySelectorAll('[data-ai]'), function (el) {
          var kind = el.getAttribute('data-ai');
          el.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var found = findStory(el.getAttribute('data-id'));
            if (!found) return;
            var prompt = buildPrompt(found.story, found.label);

            if (kind === 'share') {
              navigator.share({ text: prompt }).catch(function () {});
              return;
            }
            var label = el.textContent;
            copyText(prompt).then(function () {
              el.textContent = 'Copied';
            }).catch(function () {
              el.textContent = 'Copy failed';
            }).then(function () {
              setTimeout(function () { el.textContent = label; }, 1800);
            });
          });
        });
      }

      app.innerHTML = appHtml();
      bindWeather();
      bindTabs();
      bindCards();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
