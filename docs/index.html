  <title>The Daily</title>
  <style>
    /* ---- Design tokens: The Morning Broadsheet ------------------------- */
    :root {
      --paper: #faf8f3;        /* the sheet (warm white, never #fff) */
      --desk: #efece6;         /* the desk beyond the column */
      --ink: #17130d;          /* headlines / primary text */
      --ink-sub: #453f38;      /* standfirsts */
      --ink-muted: #635d54;    /* inactive tabs */
      --meta: #6c665c;         /* timestamps, dateline, footer (>=AA small) */
      --rule: #dcd6cc;         /* hairline between cards */
      --rule-soft: #e3ded4;    /* hairline inside an opened card */
      --navy: #1a2744;         /* structural ink */
      --navy-ink: #1a2744;     /* navy used as text (links, active tab) */
      --red: #8b1a1a;          /* editorial heat */
      --tint-open: #f2ede4;    /* ground of an expanded card */
      --tint-analysis: #ece6da;/* ground of the why-it-matters note */
      --strip-bg: #1a2744;     /* weather strip */
      --strip-ink: #f7f4ee;
      --chip-hot: #8b1a1a;     /* DEVELOPING / WAR-class flags */
      --chip-cool: #1a2744;    /* procedural flags (FINAL, EDITORIAL) */
      --chip-ink: #faf8f3;
      --focus: #1a2744;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151a22;      /* lamplight edition: deep navy-black paper */
        --desk: #0e1219;
        --ink: #e9e3d5;        /* cream ink */
        --ink-sub: #bcb6a8;
        --ink-muted: #948e82;
        --meta: #8f897d;
        --rule: #2a303a;
        --rule-soft: #2f3540;
        --navy: #6f82a8;       /* structure lifted so it reads on dark */
        --navy-ink: #a3b3d2;
        --red: #d1726b;        /* desaturated heat */
        --tint-open: #1b212b;
        --tint-analysis: #20262f;
        --strip-bg: #1b2334;
        --strip-ink: #e9e3d5;
        --chip-hot: #a8443c;
        --chip-cool: #3b4a6c;
        --chip-ink: #f0eadc;
        --focus: #a3b3d2;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 100%; }
    html, body { background: var(--desk); }
    body {
      font-family: 'Georgia', serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--paper);
      max-width: 680px;
      margin: 0 auto;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Masthead */
    .masthead {
      border-bottom: 4px solid var(--navy);
      padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
      background: var(--paper);
    }
    .masthead .date {
      font-size: 0.6875rem; color: var(--meta); letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .masthead .title {
      font-size: 2.375rem; font-weight: 700; letter-spacing: -0.01em;
      color: var(--navy); line-height: 1; margin-bottom: 2px;
    }
    .masthead .tagline {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; color: var(--meta);
      letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* Stale-edition ribbon */
    .stale {
      background: var(--tint-analysis); color: var(--meta);
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; text-align: center;
      padding: 7px 20px;
    }

    /* Weather strip */
    .weather {
      background: var(--strip-bg); color: var(--strip-ink);
      cursor: pointer; user-select: none;
    }
    .weather .summary {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
      min-height: 44px;
    }
    .weather .summary::-webkit-scrollbar { display: none; }
    .weather .ico { font-size: 1.375rem; }
    .weather .city { font-weight: 700; font-size: 0.9375rem; }
    .weather .temp { font-size: 0.9375rem; }
    .weather .muted { opacity: 0.72; font-size: 0.8125rem; white-space: nowrap; }
    .weather .chev { margin-left: auto; opacity: 0.6; font-size: 0.75rem; }
    .weather .week {
      display: flex; border-top: 1px solid rgba(255,255,255,0.12);
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
    }
    .weather .week::-webkit-scrollbar { display: none; }
    .weather .day {
      text-align: center; min-width: 52px; padding: 0 8px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .weather .day .d { font-size: 0.6875rem; opacity: 0.6; margin-bottom: 4px; }
    .weather .day .i { font-size: 1.125rem; }
    .weather .day .hi { font-size: 0.8125rem; font-weight: 700; margin-top: 4px; }
    .weather .day .lo { font-size: 0.6875rem; opacity: 0.5; }

    /* Tab nav */
    .tabs {
      display: flex; overflow-x: auto; border-bottom: 2px solid var(--navy);
      background: var(--paper); scrollbar-width: none;
      position: sticky; top: 0; z-index: 10;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; min-height: 44px; display: flex; align-items: center;
      padding: 0 18px; border: none; background: none; cursor: pointer;
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; font-weight: 700;
      color: var(--ink-muted); border-bottom: 3px solid transparent;
      margin-bottom: -2px; letter-spacing: 0.12em; text-transform: uppercase;
      transition: color 0.15s;
    }
    .tab.active { color: var(--navy-ink); border-bottom-color: var(--navy); }

    /* Stories */
    .stories { padding: 8px 20px 40px; }
    .empty {
      padding: 40px 4px; text-align: center; color: var(--meta);
      font-style: italic; font-size: 0.9375rem;
    }
    .card {
      border-top: 1px solid var(--rule); padding: 14px 0; cursor: pointer;
      background: var(--paper); transition: background 0.15s;
    }
    .card.lead { border-top: 3px solid var(--navy); padding: 20px 0 16px; }
    .card.open { background: var(--tint-open); }
    .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card .row-main { flex: 1; min-width: 0; }
    .card .kicker {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; color: var(--red); margin-bottom: 6px; text-transform: uppercase;
    }
    .card .tag {
      color: var(--chip-ink); padding: 2px 6px; margin-right: 8px;
      font-size: 0.5625rem; border-radius: 2px; vertical-align: 1px;
    }
    .card .tag.hot { background: var(--chip-hot); }
    .card .tag.cool { background: var(--chip-cool); }
    .card .headline {
      font-size: 1.0625rem; font-weight: 700; line-height: 1.25; color: var(--ink); margin-bottom: 6px;
    }
    .card.lead .headline { font-size: 1.375rem; }
    .card .sub {
      font-size: 0.875rem; color: var(--ink-sub); line-height: 1.4; margin-bottom: 4px; font-style: italic;
    }
    .card .time { font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta); margin-top: 4px; }
    .card .toggle { color: var(--navy-ink); opacity: 0.5; font-size: 1.125rem; flex-shrink: 0; margin-top: 2px; }
    .card .expand {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    }
    .card .expand .sumtext {
      font-size: 0.9375rem; color: var(--ink-sub); line-height: 1.7;
    }
    .card .expand img {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      background: var(--tint-open); border-radius: 3px; margin-bottom: 12px;
    }
    .card .analysis {
      margin-top: 12px; padding: 10px 14px; background: var(--tint-analysis);
      font-size: 0.875rem; line-height: 1.6; color: var(--ink-sub); font-style: italic;
    }
    .card .analysis .alabel {
      display: block; font-family: 'Arial', sans-serif; font-style: normal;
      font-size: 0.625rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--navy-ink); margin-bottom: 4px;
    }
    .card .readmore {
      display: inline-block; margin-top: 12px; min-height: 44px; line-height: 44px;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink); text-decoration: none;
    }
    .card .readmore:hover { text-decoration: underline; }
    .card .readmore:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    /* Ask AI: hand the clipping and a briefing prompt to a model */
    .card .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .askai, .card .ask-opt {
      border: none; background: none; padding: 0; cursor: pointer;
      min-height: 44px; line-height: 44px; text-decoration: none;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink);
    }
    .card .askai { margin-top: 12px; }
    .card .askai:hover, .card .ask-opt:hover { text-decoration: underline; }
    .card .askai:focus-visible, .card .ask-opt:focus-visible {
      outline: 2px solid var(--focus); outline-offset: 3px;
    }
    .card .ask-panel { display: none; border-top: 1px solid var(--rule-soft); margin-top: 4px; }
    .card .ask-panel.open { display: block; }
    .card .ask-row { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .ask-note {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.55;
      color: var(--meta); letter-spacing: 0.02em; padding-bottom: 12px;
    }

    /* Footer */
    .footer {
      border-top: 2px solid var(--navy);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta);
      text-align: center; letter-spacing: 0.06em;
    }
    .notice { padding: 40px 20px; text-align: center; color: var(--meta); font-style: italic; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>

ump-business-live-economy-latest-news-updates"}, {"id": "f2", "lead": false, "kicker": "EUROPE", "headline": "Hungary's Nuclear Plant Nears Shutdown Amid Severe Drought", "sub": "Extreme heat and low water levels in the Danube River push the Paks nuclear facility to the brink, raising energy security concerns.", "summary": "Hungary's Paks nuclear power plant came \"within millimetres\" of shutting down due to critically low water levels in the Danube River, essential for cooling operations. The crisis, driven by extreme heat and drought, has prompted the EU to monitor energy stability in Hungary, Bulgaria, and Romania. This incident highlights the escalating challenges climate change poses to critical infrastructure and energy security across Europe.", "analysis": null, "time": "10:48 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/887079ec71a027f7aaada66ff01c54ff4ed7ecb6/0_0_3021_2416/500.jpg", "link": "https://www.theguardian.com/world/live/2026/aug/04/europe-drought-extreme-heat-wildfires-climate-crisis-hungary-romania-ceuta-spain-migration-eu-latest-news-updates"}, {"id": "f3", "lead": false, "kicker": "UKRAINE", "headline": "Former Commander Says Ukraine Has No Chance of Joining NATO", "sub": "Valery Zaluzhnyi, now UK envoy, states Kyiv cannot meet military standards for alliance membership, as drone attacks kill 11 in Russia.", "summary": "Valery Zaluzhnyi, Ukraine's former top military commander and current UK envoy, stated that Ukraine cannot meet the military standards required for NATO membership. His comments come as Russia claims Ukrainian drone attacks killed 11 people, including three children, in a Black Sea resort town and Crimea. The war continues with Kyiv largely stalling Moscow's advances, marking day 1,623 of the conflict.", "analysis": null, "time": "1:24 AM", "tag": "WAR", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/2026/aug/04/ukraine-war-briefing-militarys-former-top-commander-says-kyiv-has-no-chance-of-joining-nato"}, {"id": "f4", "lead": false, "kicker": "SOUTH KOREA", "headline": "Seoul Braces for Heatwave as Death Toll Reaches 16", "sub": "South Korea's capital takes measures to combat extreme heat as nurses check on vulnerable residents.", "summary": "Seoul is preparing for a severe heatwave sweeping South Korea, which has already claimed 16 lives. Authorities are dousing city roads with water and nurses are conducting welfare checks on vulnerable populations as the extreme heat moves westward. The measures aim to mitigate the impact of the ongoing heatwave on public health.", "analysis": null, "time": "2:33 AM", "tag": null, "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/2026/aug/04/south-korea-heatwave-seoul-heat-warning"}, {"id": "f5", "lead": false, "kicker": "UK POLITICS", "headline": "New UK Prime Minister Andy Burnham's Whirlwind Start", "sub": "Burnham's social media push resonates with voters, but he faces tough decisions on funding his policy promises.", "summary": "Andy Burnham, the new Prime Minister of the United Kingdom, has had a whirlwind start to his tenure, leveraging TikToks and podcasts to connect with voters. His social media strategy appears to be resonating, but he faces significant challenges in delivering on his policy promises. Key decisions loom regarding how to fund his ambitious agenda, setting the stage for his early leadership.", "analysis": null, "time": "12:01 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/08/04/multimedia/04int-uk-burnham-image-01-mtkl/04int-uk-burnham-image-01-mtkl-superJumbo.jpg", "link": "https://www.nytimes.com/2026/08/04/world/europe/andy-burnham-uk-prime-minister.html"}]}, {"id": "toronto", "label": "Toronto", "stories": [{"id": "t1", "lead": true, "kicker": "PUBLIC SAFETY", "headline": "Toronto's Largest Landlord Struggles with Tenant Safety Response Times", "sub": "A new report reveals Toronto Community Housing Corporation's security unit is failing to meet target call response times amidst growing demand.", "summary": "Toronto Community Housing Corporation (TCHC), the city's largest landlord, is struggling to meet its target response times for tenant safety calls, according to a new report. The TCHC's security unit faces increasing demand but has not been able to keep pace, raising concerns about tenant well-being and safety in its properties. This ongoing issue highlights systemic challenges within the corporation's ability to provide timely security services to its residents.", "analysis": "The persistent failure of TCHC to meet safety response targets points to deeper issues within Toronto's public housing system, potentially impacting thousands of residents. This situation could lead to increased scrutiny of TCHC's management and funding, and may prompt calls for significant reforms to ensure tenant safety.", "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/a/18/a184e8bd-3350-5839-961c-714a693ab022/6a6cc0e3176fe.image.jpg?resize=300%2C200", "link": "https://www.thestar.com/news/gta/why-torontos-largest-landlord-is-still-struggling-to-respond-to-tenant-safety-calls/article_add4f237-267a-44b4-829c-0e4576ef2bc1.html"}, {"id": "t2", "lead": false, "kicker": "DRUG CRISIS", "headline": "Opioid Deaths Down, But Emergency Calls Spike Amid New Street Drug Threat", "sub": "A tranquilizer in Toronto's street drugs is baffling paramedics and straining hospitals, despite a reduction in overall opioid fatalities.", "summary": "While opioid deaths in Ontario have decreased, emergency calls related to overdoses are spiking, leaving paramedics \"flying blind.\" A tranquilizer found in Toronto's street drug supply is defying traditional overdose responses, adding significant strain to hospitals and emergency services. This new development presents a complex challenge for public health officials and first responders.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": true, "image": null, "link": "https://www.thestar.com/news/gta/opioid-deaths-are-down-but-emergency-calls-are-spiking-inside-the-mystery-leaving-ontario-paramedics-flying-blind/article_e4cca2c4-fbb9-4c8a-9766-e6b25b3c8f52.html"}, {"id": "t3", "lead": false, "kicker": "COURTS", "headline": "Ontario Man Jailed Over Faked Facebook Messages, Courts Struggle with Digital Forgery", "sub": "An Ontario man served eight months for faking messages from his ex-wife, highlighting judicial challenges in verifying digital evidence.", "summary": "An Ontario man was jailed for eight months after being convicted of faking Facebook messages from his ex-wife, exposing a critical vulnerability in the justice system. Legal experts note that courts are struggling to identify easily faked digital evidence, raising concerns about the reliability of such evidence in legal proceedings. This case underscores the urgent need for courts and legal professionals to adapt to new realities of digital manipulation.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/b/67/b670d883-f5dc-5691-89b3-751084c13652/6a6cec3df14ea.image.jpg?resize=300%2C200", "link": "https://www.thestar.com/news/gta/an-ontario-man-was-jailed-for-eight-months-over-faked-facebook-messages-from-his-ex-wife-why-courts-are-struggling-to-spot-easy-fakes/article_8d8bb089-27f0-45c3-827f-fad133b6521b.html"}, {"id": "t4", "lead": false, "kicker": "YOUTH MENTAL HEALTH", "headline": "Toronto Youth Seek Help at Night as Kids Help Phone Reports Surge in Late-Hour Texts", "sub": "A worrying increase in nighttime texting conversations signals a growing mental health crisis among Toronto's young people.", "summary": "Kids Help Phone has reported a significant and worrying increase in new nighttime texting conversations among Toronto youth during the first six months of this year. This trend indicates that more young people are reaching out for mental health support in the middle of the night. The surge highlights a growing mental health crisis and the critical need for accessible support services for Toronto's youth.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/c/98/c9874638-8aa2-54f5-8e96-6f930202d0d5/6a6d1f1c62f1b.image.jpg?resize=300%2C185", "link": "https://www.thestar.com/news/gta/more-toronto-youth-are-reaching-out-for-help-in-the-middle-of-the-night/article_90b6602d-12af-4a89-b77b-3ce7d70b62d5.html"}]}, {"id": "world", "label": "World", "stories": [{"id": "w1", "lead": true, "kicker": "EUROPE", "headline": "EU Passport Controls Cause Travel Chaos Across Europe", "sub": "New biometric system for non-EU citizens leads to long delays and frustration at airports, with officials promising future improvements.", "summary": "The European Union's new biometric passport control system for non-EU citizens has triggered widespread travel chaos, resulting in extensive delays and short tempers at airports across the continent. The rocky rollout of the system, designed to enhance security, has left many travelers frustrated by long queues and missed connections. EU officials acknowledge the initial difficulties but assert that the system will improve over time and ultimately bolster security measures.", "analysis": "This chaotic implementation of new EU border controls highlights the challenges of integrating advanced security technologies with high-volume travel. The disruption could impact tourism and business travel, placing pressure on EU authorities to rapidly streamline processes and mitigate economic and reputational damage.", "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/07/22/multimedia/22int-europe-travel-chaos-01-cqvg/22int-europe-travel-chaos-01-cqvg-superJumbo.jpg", "link": "https://www.nytimes.com/2026/08/04/world/europe/eu-passport-control-chaos.html"}, {"id": "w2", "lead": false, "kicker": "PAKISTAN", "headline": "Kashmir Protests Challenge Islamabad's Authority", "sub": "A wave of demonstrations in the region poses the most significant challenge to Pakistan's rule in years.", "summary": "A wave of protests is posing the most significant challenge in years to Islamabad's authority in Pakistan-administered Kashmir. The demonstrations signal growing discontent and a potential shift in the region's political landscape. This unrest could destabilize the delicate balance of power and draw international attention to the long-standing dispute.", "analysis": null, "time": "12:00 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/08/03/multimedia/00int-pakistan-kashmir-promo-fkwl/00int-pakistan-kashmir-promo-fkwl-superJumbo.jpg", "link": "https://www.nytimes.com/2026/08/04/world/asia/pakistan-kashmir-jaac-rawalkot-protests.html"}, {"id": "w3", "lead": false, "kicker": "MALTA", "headline": "Daphne Caruana Galizia Investigated Corruption Before Killing, Jury Told", "sub": "The journalist's son testifies his mother was examining a leak related to Electrogas, whose part-owner is on trial.", "summary": "A jury was told that Maltese journalist Daphne Caruana Galizia was investigating suspected corruption linked to Electrogas, a company partly owned by Yorgen Fenech, who is now on trial. Her son testified that his mother was examining a leak from the company prior to her assassination. The testimony sheds further light on the high-stakes nature of her investigative work.", "analysis": null, "time": "7:00 AM", "tag": null, "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/2026/aug/04/daphne-caruana-galizia-investigating-suspected-corruption-when-killed-jury-told"}, {"id": "w4", "lead": false, "kicker": "COLOMBIA", "headline": "Elephant-Costumed Activist Sworn In as Colombian Senator", "sub": "Luis Carlos Rúa, known as 'Elefante blanco,' will tackle graft from the senate floor after revealing his identity for safety.", "summary": "Luis Carlos Rúa, the anti-corruption activist known as 'Elefante blanco' for campaigning in an elephant costume, has been sworn in as a senator in Colombia. Rúa revealed his identity just three days before the election for his own safety, and now plans to tackle graft directly from the senate floor. His unique approach to politics has garnered significant attention.", "analysis": null, "time": "10:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/94dac3f3781a7ce9b1753024b888687bb37ae8c8/0_774_1855_1483/500.jpg", "link": "https://www.theguardian.com/world/2026/aug/04/white-elephant-colombia-anti-corruption-activist-senator-luis-carlos-rua"}]}, {"id": "sports", "label": "Sports", "stories": [{"id": "s1", "lead": true, "kicker": "CYCLING", "headline": "Sigrid Haugset Stuns Tour de France Femmes with Epic Solo Breakaway", "sub": "The Norwegian national champion takes stage three and the yellow jersey after a historic performance.", "summary": "Norwegian national champion Sigrid Haugset delivered a stunning performance in the Tour de France Femmes, winning stage three after an epic solo breakaway. Haugset's audacious move shocked the established favorites and propelled her into the overall lead, securing the coveted yellow jersey. Her victory marks a significant upset and a memorable moment in the race, showcasing her exceptional endurance and tactical prowess.", "analysis": "Haugset's unexpected victory injects new excitement into the Tour de France Femmes, challenging pre-race favorites and highlighting the unpredictable nature of professional cycling. Her performance could inspire a more aggressive racing style from competitors and reshape the overall strategy for the remaining stages.", "time": "Yesterday", "tag": "FINAL", "sensitivity": false, "image": "https://media.guim.co.uk/4ff6d91c48e92575e65b3379d0f065706adb445a/168_0_5000_4000/500.jpg", "link": "https://www.theguardian.com/sport/live/2026/aug/03/cycling-tour-de-france-femmes-stage-three-from-geneva-to-poligny-live"}, {"id": "s2", "lead": false, "kicker": "CRICKET", "headline": "Ben Stokes Rules Out 2027 Ashes Return, Eyes Coaching Role", "sub": "The former England captain rejects a comeback for the Ashes but expresses ambition to coach the national team.", "summary": "Ben Stokes has definitively ruled out reversing his recent England retirement to play in the 2027 Ashes series. While closing the door on a playing comeback, Stokes expressed a strong ambition to coach the England team one day. His decision clarifies his future role in English cricket, shifting focus from the field to a potential leadership position off it.", "analysis": null, "time": "8:12 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/010158d997a3b7c68e0e1b5eb35bda5d8f18d8c2/423_148_3481_2785/500.jpg", "link": "https://www.theguardian.com/sport/2026/aug/04/ben-stokes-rules-out-2027-ashes-return-ambition-coach-england-one-day-cricket"}, {"id": "s3", "lead": false, "kicker": "RUGBY LEAGUE", "headline": "Ex-Garbo Matt King Takes Charge of NSW Blues", "sub": "The former player with no first-grade coaching experience is appointed head coach for the State of Origin.", "summary": "Matt King, a former player and one-time bin man with no prior first-grade coaching experience, has been appointed head coach of the New South Wales Blues. King admits he hadn't always believed he could be a head coach, but the Blues' recent formula suggests he may succeed in the challenging State of Origin arena. His unconventional background brings a fresh perspective to the high-pressure role.", "analysis": null, "time": "6:02 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/529150681f14352164afe85ee101f64f1eb7435a/299_0_3347_2679/500.jpg", "link": "https://www.theguardian.com/sport/blog/2026/aug/04/matt-king-state-of-origin-nsw-blues-coach"}, {"id": "s4", "lead": false, "kicker": "SWIMMING", "headline": "Australian Swimmer Isaac Cooper Steps Down from Leadership Role", "sub": "Gold medal-winner leaves leadership group after prioritizing a drinking session over supporting teammates.", "summary": "Australian gold medal-winning swimmer Isaac Cooper has stepped down from the national swimming leadership group. The decision follows an incident where Cooper chose a drinking session over supporting his teammates at an event in Glasgow. This move reflects a commitment to team values and accountability within the sport.", "analysis": null, "time": "12:54 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/da69054bf364c80a47d39114cde6e9b449302c8f/317_0_4243_3394/500.jpg", "link": "https://www.theguardian.com/sport/2026/aug/04/australian-swimmer-isaac-cooper-leaves-leadership-role-commonwealth-games-drinking"}]}, {"id": "business", "label": "Business", "stories": [{"id": "b1", "lead": true, "kicker": "PHARMACEUTICALS", "headline": "AstraZeneca Falls Amid US Merger Talks, Analysts Question Rationale", "sub": "Proposed $400 billion tie-up with Bristol Myers Squibb would create world's fourth-largest drugmaker, but market reacts negatively.", "summary": "AstraZeneca's stock has fallen, making it the third-largest UK company, amid ongoing talks for a proposed $400 billion merger with US group Bristol Myers Squibb. If successful, the tie-up would create the world's fourth-largest drugmaker. However, analysts are questioning the strategic rationale behind such a mega-merger, suggesting it might divert from AstraZeneca's successful current formula. The market's skeptical reaction indicates concerns about the potential integration challenges and benefits of the deal.", "analysis": "AstraZeneca's pursuit of a massive merger despite market skepticism highlights the intense pressure on pharmaceutical giants to consolidate and expand. The deal's success hinges on convincing investors of its long-term strategic value, especially given the potential for disruption to existing successful operations and the high cost of integration.", "time": "Yesterday", "tag": "DEVELOPING", "sensitivity": false, "image": "https://media.guim.co.uk/6a3954e9381e3e4e24f977791697aa7b44113dc6/577_0_3445_2757/500.jpg", "link": "https://www.theguardian.com/business/2026/aug/03/astrazeneca-talks-bristol-myers-squibb-merger-pharmaceuticals"}, {"id": "b2", "lead": false, "kicker": "UK ECONOMY", "headline": "UK Economy Faces Recession if Strait of Hormuz Remains Closed, EY Warns", "sub": "The closure of the vital shipping lane could trigger a severe economic downturn for the United Kingdom.", "summary": "The UK economy faces a potential recession if the Strait of Hormuz remains closed, according to a warning from EY. The vital shipping lane's closure would severely disrupt global oil supplies and trade routes, impacting energy prices and supply chains. This forecast underscores the UK's vulnerability to geopolitical events affecting international commerce.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/5e69163220d3d732e15fd3b29b0f3ce61c9bfdec/493_0_2834_2268/500.jpg", "link": "https://www.theguardian.com/business/live/2026/aug/03/uk-economy-recession-strait-hormuz-closed-oil-latest-news-updates"}, {"id": "b3", "lead": false, "kicker": "AIR TRAVEL", "headline": "US Airports Experiment with New Programs to Slash Grueling Lines", "sub": "Airlines and airports are testing initiatives for more efficient passenger and bag screening to reduce wait times.", "summary": "US airlines and airports are implementing new programs aimed at reducing grueling wait times for passengers. These initiatives focus on more efficient screening of passengers and their bags, with the goal of streamlining the security process. The efforts seek to improve the travel experience and alleviate congestion at busy hubs.", "analysis": null, "time": "5:02 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/07/30/travel/00trav-airport-screening1/00trav-airport-screening1-superJumbo.jpg", "link": "https://www.nytimes.com/2026/08/04/travel/tsa-security-airport-wait-time.html"}, {"id": "b4", "lead": false, "kicker": "FOOD PRICES", "headline": "Olive Oil Prices Expected to Rise Again Amid European Crop Heat Stress", "sub": "Farmers warn that high temperatures, drought, and wildfires will increase costs for various foodstuffs.", "summary": "The price of olive oil is expected to rise again as European crops continue to suffer from extreme heat, drought, and wildfires. Farmers are warning that these adverse weather conditions will lead to increased costs for a range of foodstuffs, not just olive oil. The ongoing climate crisis is directly impacting agricultural yields and consumer prices across the continent.", "analysis": null, "time": "4:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/b52f9322bf0631613feef0b0ec89bc4e8c8fc3de/913_0_4587_3668/500.jpg", "link": "https://www.theguardian.com/business/2026/aug/04/price-olive-oil-expected-rise-again-european-crops-heat-drought-wildfires"}]}, {"id": "opinion", "label": "Opinion", "stories": [{"id": "o1", "lead": true, "kicker": "EDITORIAL", "headline": "The Guardian View: Ceuta Chaos Weaponized by Far Right, Mainstream EU Must Show Solidarity", "sub": "The Guardian argues that the migrant crisis in Ceuta has been exploited by nativists, and mainstream EU leaders should support Spain's Prime Minister Pedro Sánchez.", "summary": "The Guardian's editorial board asserts that the chaos and tragedy surrounding migrant events in Ceuta have been weaponized by the far right to advance anti-migrant narratives. The editorial calls for mainstream EU leaders to demonstrate solidarity with Spain's Prime Minister Pedro Sánchez, rather than engaging in finger-pointing. It argues that the EU's panic and lack of unified response embolden both smugglers and the far right, making Spain more vulnerable to future crises. The piece criticizes progressives for failing to adequately address the moment.", "analysis": "This editorial highlights the political polarization and humanitarian challenges at Europe's borders, framing the Ceuta situation as a critical test for EU unity and its response to migration. The call for solidarity reflects a broader concern that internal divisions could further empower extremist narratives and undermine the bloc's foundational values.", "time": "Yesterday", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/993bb487219dbc28f9195638b232ca2872ff159f/658_0_6490_5192/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/03/the-guardian-view-on-events-in-ceuta-chaos-and-tragedy-are-weaponised-by-the-far-right"}, {"id": "o2", "lead": false, "kicker": "HUMAN RIGHTS", "headline": "US Civil Rights Lawyers Seek International Justice Over Trump Policies", "sub": "A human rights commission will hold an extraordinary hearing on the administration's alleged attacks on protesters and journalists.", "summary": "US civil rights lawyers Thomas Becker and Antonio Romanucci are seeking international justice, driven by what they describe as President Donald Trump's policies. An extraordinary hearing by a human rights commission is scheduled to address the administration's alleged attacks on protesters, journalists, and other individuals. This move signals an escalation in legal challenges against the current US administration on the global stage.", "analysis": null, "time": "10:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/f08b7204635c3a64a1db892b7d373c56c3fbe797/500_0_5000_4000/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/04/trump-ice-migrants-human-rights"}, {"id": "o3", "lead": false, "kicker": "AFGHANISTAN", "headline": "Gordon Brown Calls for Global Fund to Aid Afghan Women and Girls", "sub": "After five brutal years of Taliban rule, girls yearn for education; former UK Prime Minister proposes a plan for support.", "summary": "Former UK Prime Minister Gordon Brown is advocating for the establishment of a global fund to support Afghan women and girls, who have endured five brutal years under Taliban rule. Brown emphasizes that despite appalling repression, girls in Afghanistan continue to yearn for educational opportunities. His plan aims to provide crucial assistance to help them fulfill their potential.", "analysis": null, "time": "6:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/c691541f995a5b3e866a299b0715dbaefb3fea20/1661_2278_1982_1586/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/04/five-years-taliban-rule-afghan-women-and-girls-need-our-help"}, {"id": "o4", "lead": false, "kicker": "CLIMATE", "headline": "Rebecca Solnit: We Are in a Climate Warzone, Robbed of Summer's Joy", "sub": "The author reflects on how humanity's 'war on nature' has transformed summer into a harsh, unrecognizable season.", "summary": "Author Rebecca Solnit reflects on the profound changes to summer, stating that humanity's \"war on nature\" has transformed the season into a \"climate warzone.\" She laments that the joys of summer are no longer what they once were, a direct consequence of environmental degradation. Solnit's commentary underscores the personal and societal impact of the ongoing climate crisis.", "analysis": null, "time": "10:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/81531c39c97e347358c0934cbf71d0f15f7849af/421_0_5600_4480/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/04/summer-heat-climate-war-zone"}]}]}</script>

  <script>
    (function () {
      var raw = document.getElementById('edition').textContent;
      var data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<div class="notice">No edition loaded. Run the build to generate today’s paper.</div>';
        return;
      }

      var state = { active: (data.sections[0] || {}).id, openId: null };

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Editorial heat flags keep the red chip; procedural flags cool to navy,
      // so a red chip still means something (the Scarce Red Rule).
      function isHotTag(t) {
        return /^(DEVELOPING|BREAKING|LIVE|WAR|ALERT|URGENT)$/i.test(t || '');
      }

      // ---- Ask AI ----------------------------------------------------------
      // The reader taps one story and gets a briefing, not a chat. The prompt
      // does three jobs: hand over the clipping, name the shape of the answer
      // (five parts, ~500 words, hard ceiling), and set up the follow-up so the
      // conversation continues without the reader having to think of a question.
      // Voice constraints mirror src/config.py HOUSE_VOICE, em dash ban included.
      function buildPrompt(st, sectionLabel) {
        var L = [];
        L.push('I read this in my morning paper and I want to understand it properly.');
        L.push('');
        L.push('THE CLIPPING');
        L.push('Headline: ' + st.headline);
        if (st.sub) L.push('Standfirst: ' + st.sub);
        if (st.summary) L.push('Summary: ' + st.summary);
        if (st.analysis) L.push("My paper's why-it-matters note: " + st.analysis);
        L.push('Section: ' + sectionLabel + '. Filed ' + (st.time || 'this morning') +
               ', edition of ' + data.date + '.');
        if (st.link) L.push('Source: ' + st.link);
        L.push('');
        L.push('WHAT I WANT');
        L.push('A briefing that leaves me genuinely informed, not a restatement of what I just');
        L.push('pasted. Assume I know nothing beyond the clipping above.');
        L.push('');
        L.push('Check current reporting first if you are able to search. My clipping is a');
        L.push('summary and may be incomplete or already overtaken by events. If you cannot');
        L.push('search, say so in one line at the top, then separate what you are confident');
        L.push('about from what you would want verified.');
        L.push('');
        L.push('STRUCTURE');
        L.push('I am reading this on a phone. Build the answer in layers, heaviest first, so');
        L.push('I can stop at the end of any layer and still have got something whole. Use');
        L.push('these markdown headings exactly, so they render large on a small screen.');
        L.push('');
        L.push('# The gist');
        L.push('An H1 of six to ten words stating the actual point, not the topic. Then two or');
        L.push('three short sentences giving me the whole story in plain words. If I read');
        L.push('nothing else, this is what I walk away knowing. Correct my clipping here if it');
        L.push('is wrong or out of date.');
        L.push('');
        L.push('## Why it matters');
        L.push('Two or three short sentences on the stakes and the second order effects. Be');
        L.push('concrete about who gains, who pays, how much, and by when.');
        L.push('');
        L.push('## How we got here');
        L.push('Only the background I need to follow this story. Not a history lecture.');
        L.push('');
        L.push('## Where it is contested');
        L.push('The strongest disagreement among serious people, put fairly. If it is genuinely');
        L.push('uncontested, say so in one sentence and move on.');
        L.push('');
        L.push('## What to watch');
        L.push('Three bullets, each a specific checkable marker with a rough timeframe.');
        L.push('');
        L.push('## Ask me next');
        L.push('Three numbered questions, ordered by what would teach me the most. I will reply');
        L.push('with a digit.');
        L.push('');
        L.push('READING ON A PHONE');
        L.push('Short paragraphs: three sentences at most, none longer than about sixty words,');
        L.push('with a blank line between them. No tables, no nested bullets, no wall of text.');
        L.push('Around 500 words in total. Hard ceiling 650. Do not pad to reach a length; the');
        L.push('gist and why it matters are worth more than the sections under them.');
        L.push('');
        L.push('VOICE');
        L.push('Financial Times, not an encyclopedia and not a chatbot. Plain, confident,');
        L.push('concrete. Specifics over abstractions: names, numbers, dates, stakes. Every');
        L.push('sentence earns its place. No preamble, no throat clearing, no restating my');
        L.push('prompt back to me, no hedging filler, no em dashes. Where you are uncertain,');
        L.push('mark it in the sentence it applies to rather than in a disclaimer paragraph.');
        return L.join('\n');
      }

      function findStory(id) {
        for (var i = 0; i < data.sections.length; i++) {
          var list = data.sections[i].stories || [];
          for (var j = 0; j < list.length; j++) {
            if (list[j].id === id) {
              return { story: list[j], label: data.sections[i].label };
            }
          }
        }
        return null;
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        // Older iOS standalone PWAs land here.
        return new Promise(function (resolve, reject) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('copy failed'));
        });
      }

      // Tagline reflects the sections the edition actually shipped, not a
      // hardcoded list that can disagree with the paper.
      function taglineText() {
        var labels = data.sections
          .filter(function (s) { return s.id !== 'front'; })
          .map(function (s) { return s.label; });
        return (labels.length ? labels : ['Toronto', 'World', 'Business']).join(' · ');
      }

      function weatherHtml(w) {
        if (!w || !w.icon) return '';
        var week = (w.week || []).map(function (d) {
          return '<div class="day"><div class="d">' + esc(d.day) + '</div>' +
            '<div class="i">' + esc(d.icon) + '</div>' +
            '<div class="hi">' + esc(d.hi) + '°</div>' +
            '<div class="lo">' + esc(d.lo) + '°</div></div>';
        }).join('');
        return '<div class="weather" id="weather" role="button" tabindex="0" ' +
          'aria-expanded="false" aria-label="Toronto weather, tap for the week">' +
          '<div class="summary">' +
            '<span class="ico">' + esc(w.icon) + '</span>' +
            '<span class="city">Toronto</span>' +
            '<span class="temp">' + esc(w.high) + '° / ' + esc(w.low) + '°</span>' +
            '<span class="muted">' + esc(w.condition) + '</span>' +
            '<span class="muted">Rain ' + esc(w.rain) + '</span>' +
            '<span class="muted">Wind ' + esc(w.wind) + '</span>' +
            '<span class="chev" id="wchev">▼</span>' +
          '</div>' +
          '<div class="week" id="wweek" style="display:none">' + week + '</div>' +
        '</div>';
      }

      function tabsHtml() {
        return '<div class="tabs" role="tablist">' + data.sections.map(function (s) {
          var on = s.id === state.active;
          return '<button class="tab' + (on ? ' active' : '') + '" role="tab" ' +
            'aria-selected="' + on + '" data-tab="' + esc(s.id) + '">' + esc(s.label) + '</button>';
        }).join('') + '</div>';
      }

      function cardHtml(st, sectionLabel) {
        var open = st.id === state.openId;
        var tag = st.tag
          ? '<span class="tag ' + (isHotTag(st.tag) ? 'hot' : 'cool') + '">' + esc(st.tag) + '</span>'
          : '';
        var kicker = st.kicker ? '<div class="kicker">' + tag + esc(st.kicker) + '</div>' : '';
        var sub = st.sub ? '<div class="sub">' + esc(st.sub) + '</div>' : '';
        var expand = '';
        if (open) {
          var img = st.image
            ? '<img src="' + esc(st.image) + '" alt="' + esc(st.headline) + '" ' +
              'loading="lazy" onerror="this.remove()" />'
            : '';
          var analysis = st.analysis
            ? '<div class="analysis"><span class="alabel">Why it matters</span>' + esc(st.analysis) + '</div>'
            : '';
          var link = st.link
            ? '<a class="readmore" href="' + esc(st.link) + '" target="_blank" rel="noopener">Read full story →</a>'
            : '';

          // Prefill the destinations at render time so a long press ("open in
          // app") carries the prompt too, instead of us intercepting the tap.
          var q = encodeURIComponent(buildPrompt(st, sectionLabel));
          // No target="_blank" on these two. In a standalone PWA a blank target
          // opens an in-app browser sheet, which iOS will not hand off to an
          // installed app; a plain top-level tap is what lets the Claude and
          // ChatGPT apps claim their own domains as Universal Links. "Read full
          // story" keeps _blank, because a news site does belong in a tab.
          var share = navigator.share
            ? '<button class="ask-opt" data-ai="share" data-id="' + esc(st.id) + '">Share to app…</button>'
            : '';
          var actions = '<div class="actions">' + link +
            '<button class="askai" data-ask="' + esc(st.id) + '" aria-expanded="false" ' +
              'aria-controls="ask-' + esc(st.id) + '">Ask AI ▾</button></div>' +
            '<div class="ask-panel" id="ask-' + esc(st.id) + '">' +
              '<div class="ask-row">' +
                '<a class="ask-opt" href="https://claude.ai/new?q=' + esc(q) + '">Claude</a>' +
                '<a class="ask-opt" href="https://chatgpt.com/?q=' + esc(q) + '">ChatGPT</a>' +
                share +
                '<button class="ask-opt" data-ai="copy" data-id="' + esc(st.id) + '">Copy</button>' +
              '</div>' +
              '<div class="ask-note">Opens in the app if you have it installed. The reply ' +
                'starts with the gist in a few lines, then goes deeper, then offers three ' +
                'follow-up questions.</div>' +
            '</div>';

          expand = '<div class="expand">' + img +
            '<p class="sumtext">' + esc(st.summary) + '</p>' + analysis + actions + '</div>';
        }
        return '<div class="card' + (st.lead ? ' lead' : '') + (open ? ' open' : '') +
          '" data-card="' + esc(st.id) + '" role="button" tabindex="0" ' +
          'aria-expanded="' + open + '">' +
          '<div class="row"><div class="row-main">' + kicker +
            '<div class="headline">' + esc(st.headline) + '</div>' + sub +
            '<div class="time">' + esc(st.time) + '</div></div>' +
            '<div class="toggle" aria-hidden="true">' + (open ? '−' : '+') + '</div>' +
          '</div>' + expand +
        '</div>';
      }

      function storiesInner() {
        var section = data.sections.filter(function (s) { return s.id === state.active; })[0];
        if (!section) return '';
        if (!section.stories || !section.stories.length) {
          return '<div class="empty">Nothing filed for ' + esc(section.label) + ' this morning.</div>';
        }
        return section.stories.map(function (st) {
          return cardHtml(st, section.label);
        }).join('');
      }

      // Quietly flag a saved (not-today) edition served from cache/offline.
      function staleRibbon() {
        try {
          var meta = document.querySelector('meta[name=build]');
          if (!meta) return '';
          var built = new Date(meta.getAttribute('content'));
          if (isNaN(built.getTime())) return '';
          var opt = { timeZone: 'America/Toronto' };
          if (built.toLocaleDateString('en-CA', opt) < new Date().toLocaleDateString('en-CA', opt)) {
            return '<div class="stale">Saved edition · ' + esc(data.date) + '</div>';
          }
        } catch (e) {}
        return '';
      }

      function appHtml() {
        return '<div class="masthead">' +
            '<div class="date">' + esc(data.date) + '</div>' +
            '<div class="title">THE DAILY</div>' +
            '<div class="tagline">' + esc(taglineText()) + '</div>' +
          '</div>' +
          staleRibbon() +
          weatherHtml(data.weather) +
          tabsHtml() +
          '<div class="stories" id="stories">' + storiesInner() + '</div>' +
          '<div class="footer">THE DAILY · TORONTO · Tap any headline to read</div>';
      }

      var app = document.getElementById('app');

      // Rebuild only the stories column; masthead, weather, and tab strip (and
      // their scroll/open state) are left untouched. This is what keeps a tap
      // from resetting the reader's place.
      function refreshStories() {
        document.getElementById('stories').innerHTML = storiesInner();
        bindCards();
      }

      function selectTab(id) {
        if (id === state.active) return;
        state.active = id;
        state.openId = null;
        var tabs = document.querySelectorAll('.tab');
        Array.prototype.forEach.call(tabs, function (t) {
          var on = t.getAttribute('data-tab') === id;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on);
          if (on) t.scrollIntoView({ inline: 'center', block: 'nearest' });
        });
        refreshStories();
        // Start the new section at the top, tab strip stuck under the notch.
        var tabsEl = document.querySelector('.tabs');
        if (tabsEl) window.scrollTo(0, tabsEl.offsetTop);
      }

      function toggleCard(id) {
        var y = window.scrollY;
        state.openId = state.openId === id ? null : id;
        refreshStories();
        window.scrollTo(0, y);   // grow/collapse in place, never jump
      }

      function bindWeather() {
        var weather = document.getElementById('weather');
        if (!weather) return;
        function toggle() {
          var week = document.getElementById('wweek');
          var chev = document.getElementById('wchev');
          var showing = week.style.display !== 'none';
          week.style.display = showing ? 'none' : 'flex';
          chev.textContent = showing ? '▼' : '▲';
          weather.setAttribute('aria-expanded', String(!showing));
        }
        weather.addEventListener('click', toggle);
        weather.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
        });
      }

      function bindTabs() {
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
          btn.addEventListener('click', function () { selectTab(btn.getAttribute('data-tab')); });
        });
      }

      function bindCards() {
        Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
          function activate(ev) {
            // Let links and the Ask AI controls handle their own activation.
            if (ev.target.closest('a, button')) return;
            // While open, only the header row collapses it, so reading (and
            // selecting) the body never closes the story by accident.
            if (card.classList.contains('open') && !ev.target.closest('.row')) return;
            toggleCard(card.getAttribute('data-card'));
          }
          card.addEventListener('click', activate);
          card.addEventListener('keydown', function (ev) {
            if (ev.key !== 'Enter' && ev.key !== ' ') return;
            // Never swallow the key from a control that acts on it itself.
            if (ev.target.closest('a, button')) return;
            ev.preventDefault();
            activate(ev);
          });
          bindAsk(card);
        });
      }

      // Panel state is held in the DOM, not in `state`, so opening the
      // destinations never triggers a stories rebuild and never moves the page.
      function bindAsk(card) {
        var toggle = card.querySelector('.askai');
        if (!toggle) return;
        var panel = card.querySelector('.ask-panel');

        toggle.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var open = panel.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(open));
          toggle.textContent = open ? 'Ask AI ▴' : 'Ask AI ▾';
        });

        Array.prototype.forEach.call(panel.querySelectorAll('[data-ai]'), function (el) {
          var kind = el.getAttribute('data-ai');
          el.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var found = findStory(el.getAttribute('data-id'));
            if (!found) return;
            var prompt = buildPrompt(found.story, found.label);

            if (kind === 'share') {
              navigator.share({ text: prompt }).catch(function () {});
              return;
            }
            var label = el.textContent;
            copyText(prompt).then(function () {
              el.textContent = 'Copied';
            }).catch(function () {
              el.textContent = 'Copy failed';
            }).then(function () {
              setTimeout(function () { el.textContent = label; }, 1800);
            });
          });
        });
      }

      app.innerHTML = appHtml();
      bindWeather();
      bindTabs();
      bindCards();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
