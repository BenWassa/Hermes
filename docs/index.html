  <title>The Daily</title>
  <style>
    /* ---- Design tokens: The Morning Broadsheet ------------------------- */
    :root {
      --paper: #faf8f3;        /* the sheet (warm white, never #fff) */
      --desk: #efece6;         /* the desk beyond the column */
      --ink: #17130d;          /* headlines / primary text */
      --ink-sub: #453f38;      /* standfirsts */
      --ink-muted: #635d54;    /* inactive tabs */
      --meta: #6c665c;         /* timestamps, dateline, footer (>=AA small) */
      --rule: #dcd6cc;         /* hairline between cards */
      --rule-soft: #e3ded4;    /* hairline inside an opened card */
      --navy: #1a2744;         /* structural ink */
      --navy-ink: #1a2744;     /* navy used as text (links, active tab) */
      --red: #8b1a1a;          /* editorial heat */
      --tint-open: #f2ede4;    /* ground of an expanded card */
      --tint-analysis: #ece6da;/* ground of the why-it-matters note */
      --strip-bg: #1a2744;     /* weather strip */
      --strip-ink: #f7f4ee;
      --chip-hot: #8b1a1a;     /* DEVELOPING / WAR-class flags */
      --chip-cool: #1a2744;    /* procedural flags (FINAL, EDITORIAL) */
      --chip-ink: #faf8f3;
      --focus: #1a2744;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151a22;      /* lamplight edition: deep navy-black paper */
        --desk: #0e1219;
        --ink: #e9e3d5;        /* cream ink */
        --ink-sub: #bcb6a8;
        --ink-muted: #948e82;
        --meta: #8f897d;
        --rule: #2a303a;
        --rule-soft: #2f3540;
        --navy: #6f82a8;       /* structure lifted so it reads on dark */
        --navy-ink: #a3b3d2;
        --red: #d1726b;        /* desaturated heat */
        --tint-open: #1b212b;
        --tint-analysis: #20262f;
        --strip-bg: #1b2334;
        --strip-ink: #e9e3d5;
        --chip-hot: #a8443c;
        --chip-cool: #3b4a6c;
        --chip-ink: #f0eadc;
        --focus: #a3b3d2;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 100%; }
    html, body { background: var(--desk); }
    body {
      font-family: 'Georgia', serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--paper);
      max-width: 680px;
      margin: 0 auto;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Masthead */
    .masthead {
      border-bottom: 4px solid var(--navy);
      padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
      background: var(--paper);
    }
    .masthead .date {
      font-size: 0.6875rem; color: var(--meta); letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .masthead .title {
      font-size: 2.375rem; font-weight: 700; letter-spacing: -0.01em;
      color: var(--navy); line-height: 1; margin-bottom: 2px;
    }
    .masthead .tagline {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; color: var(--meta);
      letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* Stale-edition ribbon */
    .stale {
      background: var(--tint-analysis); color: var(--meta);
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; text-align: center;
      padding: 7px 20px;
    }

    /* Weather strip */
    .weather {
      background: var(--strip-bg); color: var(--strip-ink);
      cursor: pointer; user-select: none;
    }
    .weather .summary {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
      min-height: 44px;
    }
    .weather .summary::-webkit-scrollbar { display: none; }
    .weather .ico { font-size: 1.375rem; }
    .weather .city { font-weight: 700; font-size: 0.9375rem; }
    .weather .temp { font-size: 0.9375rem; }
    .weather .muted { opacity: 0.72; font-size: 0.8125rem; white-space: nowrap; }
    .weather .chev { margin-left: auto; opacity: 0.6; font-size: 0.75rem; }
    .weather .week {
      display: flex; border-top: 1px solid rgba(255,255,255,0.12);
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
    }
    .weather .week::-webkit-scrollbar { display: none; }
    .weather .day {
      text-align: center; min-width: 52px; padding: 0 8px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .weather .day .d { font-size: 0.6875rem; opacity: 0.6; margin-bottom: 4px; }
    .weather .day .i { font-size: 1.125rem; }
    .weather .day .hi { font-size: 0.8125rem; font-weight: 700; margin-top: 4px; }
    .weather .day .lo { font-size: 0.6875rem; opacity: 0.5; }

    /* Tab nav */
    .tabs {
      display: flex; overflow-x: auto; border-bottom: 2px solid var(--navy);
      background: var(--paper); scrollbar-width: none;
      position: sticky; top: 0; z-index: 10;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; min-height: 44px; display: flex; align-items: center;
      padding: 0 18px; border: none; background: none; cursor: pointer;
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; font-weight: 700;
      color: var(--ink-muted); border-bottom: 3px solid transparent;
      margin-bottom: -2px; letter-spacing: 0.12em; text-transform: uppercase;
      transition: color 0.15s;
    }
    .tab.active { color: var(--navy-ink); border-bottom-color: var(--navy); }

    /* Stories */
    .stories { padding: 8px 20px 40px; }
    .opinion-desk + .opinion-desk { margin-top: 24px; }
    .desk-head {
      border-top: 2px solid var(--navy); padding: 12px 0 8px; margin-top: 2px;
    }
    .desk-title {
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--navy-ink);
    }
    .desk-dek {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.45;
      color: var(--meta); margin-top: 3px;
    }
    .following-block .card { padding-top: 12px; padding-bottom: 12px; }
    .follow-meta {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.45;
      color: var(--meta); margin-top: 5px;
    }
    .opinion-desk .empty { padding: 24px 4px; }
    .empty {
      padding: 40px 4px; text-align: center; color: var(--meta);
      font-style: italic; font-size: 0.9375rem;
    }
    .card {
      border-top: 1px solid var(--rule); padding: 14px 0; cursor: pointer;
      background: var(--paper); transition: background 0.15s;
    }
    .card.lead { border-top: 3px solid var(--navy); padding: 20px 0 16px; }
    .card.open { background: var(--tint-open); }
    .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card .row-main { flex: 1; min-width: 0; }
    .card .kicker {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; color: var(--red); margin-bottom: 6px; text-transform: uppercase;
    }
    .card .tag {
      color: var(--chip-ink); padding: 2px 6px; margin-right: 8px;
      font-size: 0.5625rem; border-radius: 2px; vertical-align: 1px;
    }
    .card .tag.hot { background: var(--chip-hot); }
    .card .tag.cool { background: var(--chip-cool); }
    .card .headline {
      font-size: 1.0625rem; font-weight: 700; line-height: 1.25; color: var(--ink); margin-bottom: 6px;
    }
    .card.lead .headline { font-size: 1.375rem; }
    .card .sub {
      font-size: 0.875rem; color: var(--ink-sub); line-height: 1.4; margin-bottom: 4px; font-style: italic;
    }
    .card .time { font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta); margin-top: 4px; }
    .card .toggle { color: var(--navy-ink); opacity: 0.5; font-size: 1.125rem; flex-shrink: 0; margin-top: 2px; }
    .card .expand {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    }
    .card .expand .sumtext {
      font-size: 0.9375rem; color: var(--ink-sub); line-height: 1.7;
    }
    .card .expand img {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      background: var(--tint-open); border-radius: 3px; margin-bottom: 12px;
    }
    .card .analysis {
      margin-top: 12px; padding: 10px 14px; background: var(--tint-analysis);
      font-size: 0.875rem; line-height: 1.6; color: var(--ink-sub); font-style: italic;
    }
    .card .analysis .alabel {
      display: block; font-family: 'Arial', sans-serif; font-style: normal;
      font-size: 0.625rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--navy-ink); margin-bottom: 4px;
    }
    .card .readmore {
      display: inline-block; margin-top: 12px; min-height: 44px; line-height: 44px;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink); text-decoration: none;
    }
    .card .readmore:hover { text-decoration: underline; }
    .card .readmore:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    /* Ask AI: hand the clipping and a briefing prompt to a model */
    .card .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .askai, .card .ask-opt {
      border: none; background: none; padding: 0; cursor: pointer;
      min-height: 44px; line-height: 44px; text-decoration: none;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink);
    }
    .card .askai { margin-top: 12px; }
    .card .askai:hover, .card .ask-opt:hover { text-decoration: underline; }
    .card .askai:focus-visible, .card .ask-opt:focus-visible {
      outline: 2px solid var(--focus); outline-offset: 3px;
    }
    .card .ask-panel { display: none; border-top: 1px solid var(--rule-soft); margin-top: 4px; }
    .card .ask-panel.open { display: block; }
    .card .ask-row { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .ask-note {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.55;
      color: var(--meta); letter-spacing: 0.02em; padding-bottom: 12px;
    }

    /* Footer */
    .footer {
      border-top: 2px solid var(--navy);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta);
      text-align: center; letter-spacing: 0.06em;
    }
    .notice { padding: 40px 20px; text-align: center; color: var(--meta); font-style: italic; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>

-extreme-storm/article_a0409883-edd2-40bf-86f6-ab477370327a"}]}, {"id": "world", "label": "World", "stories": [{"id": "w1", "lead": true, "kicker": "AFGHANISTAN", "headline": "The ‘Forever War’ in Afghanistan: 25 Years in Pictures", "sub": "The New York Times documents a quarter-century of conflict and daily life, from 9/11 to the Taliban's return.", "summary": "The New York Times has published a photojournalistic retrospective, \"The 'Forever War' in Afghanistan: 25 Years in Pictures,\" documenting a quarter-century of conflict and daily life. The collection spans from the initial weeks following the September 11 attacks to the chaotic U.S. withdrawal and the subsequent return of the Taliban. It offers a powerful visual narrative of the enduring impact of the war on the nation and its people.", "analysis": "This comprehensive visual history serves as a poignant reminder of the human cost and geopolitical complexities of the Afghanistan conflict. It provides crucial context for understanding the long-term consequences of international intervention and the ongoing challenges faced by the Afghan population under Taliban rule.", "time": "5:01 AM", "tag": "WAR", "sensitivity": true, "image": null, "link": "https://www.nytimes.com/2026/09/10/world/asia/afghanistan-war-photojournalism.html"}, {"id": "w2", "lead": false, "kicker": "MALTA", "headline": "Malta Warned of Corruption Crisis After ‘Utter Disbelief’ Over Caruana Galizia Verdict", "sub": "A Labour peer tells a Council of Europe inquiry that legal protection failures still endanger journalists.", "summary": "Malta has been warned of an escalating corruption crisis following widespread \"utter disbelief\" over the verdict in the Daphne Caruana Galizia murder case. A Labour peer informed a Council of Europe inquiry that the failure to implement adequate legal protections continues to put journalists at risk. The situation underscores persistent concerns about rule of law and press freedom in the country.", "analysis": null, "time": "12:17 PM", "tag": null, "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/2026/sep/10/malta-corruption-crisis-daphne-caruana-galizia-verdict"}, {"id": "w3", "lead": false, "kicker": "UNITED KINGDOM", "headline": "Fascism on the Rise in the UK, Anglican Bishop Says", "sub": "Arun Arora, Bishop of Kirkstall, condemned the 'twisted theology' of groups demonstrating at south coast ports.", "summary": "Arun Arora, the Anglican Bishop of Kirkstall in Leeds, has stated that fascism is on the rise in the United Kingdom. Bishop Arora condemned the \"twisted theology\" of groups who demonstrated at south coast ports over the weekend. His comments highlight growing concerns about extremist ideologies and their public expression within the UK.", "analysis": null, "time": "12:01 PM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/70cd1ddff7221708adb05e3140dcbd192bdb8d0f/577_0_2351_1882/500.jpg", "link": "https://www.theguardian.com/world/2026/sep/10/fascism-on-the-rise-in-the-uk-anglican-bishop-says"}, {"id": "w4", "lead": false, "kicker": "SWEDEN", "headline": "Swedish Muslims Challenge Far Right Ahead of Election", "sub": "An 'Ask-a-Muslim' campaign takes to the streets as the country faces the prospect of extremists entering government.", "summary": "Swedish Muslims have launched an \"Ask-a-Muslim\" campaign, taking to the streets to challenge the far right ahead of the upcoming election. The initiative comes as Sweden faces the prospect of extremist parties potentially entering the highest levels of government. The campaign aims to foster understanding and counter misinformation in a politically charged environment.", "analysis": null, "time": "4:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/9822ba4ec0a2ad3ce34359d483abdd5d7b57a501/1439_328_6416_5133/500.jpg", "link": "https://www.theguardian.com/world/2026/sep/10/sweden-muslims-challenge-far-right-election"}]}, {"id": "sports", "label": "Sports", "stories": [{"id": "s1", "lead": true, "kicker": "TENNIS", "headline": "Rybakina Sinks Zheng to Grab No. 1 Spot and Set Up US Open Semi-Final with Gauff", "sub": "Elena Rybakina will be the new world No. 1 after her three-set victory, while Coco Gauff saved two match points.", "summary": "Elena Rybakina has secured the world No. 1 ranking after defeating Zheng Qinwen in a three-set match at the US Open, ending Zheng's run. Rybakina will now face Coco Gauff in the semi-finals, who staged a dramatic comeback, saving two match points against Mirra Andreeva. Both players demonstrated immense resilience, setting the stage for a highly anticipated clash at Flushing Meadows.", "analysis": "The US Open women's singles draw is heating up with two compelling narratives: Rybakina's ascent to the top ranking and Gauff's gritty fightback. Their semi-final promises a high-stakes encounter between a new world No. 1 and a crowd favorite known for her mental toughness, potentially shaping the future of women's tennis.", "time": "Yesterday", "tag": "FINAL", "sensitivity": false, "image": "https://media.guim.co.uk/b0d7b99f3bcb3dedacfb6f14a51c7d1e06bb1a50/326_0_3418_2734/500.jpg", "link": "https://www.theguardian.com/sport/2026/sep/09/us-open-rybakina-world-no-1-zheng-qinwen-gauff-andreeva"}, {"id": "s2", "lead": false, "kicker": "CRICKET", "headline": "England v Pakistan: Third Men’s Cricket Test, Day Two – Live", "sub": "Updates from Thursday’s play at Edgbaston, with Josh Tongue unveiling a new trick.", "summary": "Day two of the third men’s cricket Test between England and Pakistan is underway at Edgbaston, with live updates available. England fast bowler Josh Tongue, who took four wickets, revealed he has learned a new wobble seam technique from teammate Ollie Robinson. This development adds an intriguing tactical element to the ongoing match.", "analysis": null, "time": "12:55 PM", "tag": "LIVE", "sensitivity": false, "image": "https://media.guim.co.uk/b3ae bel": "Business", "stories": [{"id": "b1", "lead": true, "kicker": "GLOBAL ECONOMY", "headline": "Oil Prices Rise Above $100 a Barrel for First Time Since July as Iran War Escalates", "sub": "Brent crude is up over 3% after new clashes between the US and Iran, and Houthi attacks on Saudi cities.", "summary": "Oil prices have surged above $100 a barrel for the first time since July, driven by the escalating conflict with Iran. Brent crude saw an increase of over 3% following recent clashes between the US and Iran in the Gulf, coupled with Houthi attacks on Saudi cities. This sharp rise signals growing market anxiety over supply disruptions in the Middle East, threatening to fuel inflation and potentially lead to higher interest rates globally.", "analysis": "The breach of the $100 oil mark is a critical economic indicator, reflecting the direct impact of geopolitical instability on global energy markets. This price hike could exacerbate inflationary pressures worldwide, forcing central banks to consider more aggressive monetary tightening, which may slow economic growth and increase the cost of living for consumers.", "time": "Yesterday", "tag": "DEVELOPING", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/business/2026/sep/09/oil-prices-rise-iran-war-brent-crude-inflation-higher-interest-rates"}, {"id": "b2", "lead": false, "kicker": "CENTRAL BANKS", "headline": "European Central Bank Raises Rates in Bid to Quell Inflation", "sub": "The bank increased its benchmark rate to 2.5 percent, fighting price pressures spurred by the Middle East war.", "summary": "The European Central Bank (ECB) has raised its benchmark interest rate to 2.5 percent in an effort to curb inflation. The move comes as the bank battles persistent price pressures, which have been exacerbated by the ongoing conflict in the Middle East. This rate hike is intended to cool the economy and bring inflation back to target levels.", "analysis": null, "time": "8:26 AM", "tag": null ark-home-delivery-split-abf-europe"}]}, {"id": "opinion", "label": "Opinion", "stories": [{"id": "o1", "lead": true, "kicker": "US POLITICS", "headline": "Trump’s Comments on the Falkland Islands Reflect a Fractured US-UK Relationship", "sub": "President Trump's suggestion that the US might not aid the UK if Argentina attacked the Falklands marks a new low.", "summary": "President Trump's recent comments, suggesting the US might not assist the UK if Argentina attempted to seize the Falkland Islands, reflect a deeply fractured US-UK relationship. This statement represents a new low for the long-standing 'special relationship' between the two nations. The remarks underscore a significant shift in diplomatic alliances and raise questions about future international cooperation.", "analysis": "President Trump's willingness to openly question US support for a key ally like the UK on a sensitive issue like the Falklands signals a profound reorientation of American foreign policy. This stance could embolden adversaries and force allies to reconsider the reliability of US commitments, potentially reshaping global security dynamics.", "time": "10:00 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/ccb8f63de73c3cca9e76c96ab59aa2792f17d5a6/320_0_2500_2001/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/sep/10/trump-falkland-islands-us-uk-relationship"}, {"id": "o2", "lead": false, "kicker": "US FOREIGN POLICY", "headline": "Trump’s Repeated Threats to ‘Wipe Out’ Iran Are Normalizing Mass Violence", "sub": "The president’s latest warning barely registered, but these threats have real-world consequences.", "summary": "Mohamad Bazzi argues that President Trump's repeated threats to 'wipe out' Iran are normalizing the rhetoric of mass violence. Bazzi notes that the president's latest warning received little attention, often dismissed as typical behavior. However, the author contends that such threats carry significant real-world consequences, potentially escalating tensions and desensitizing the public to extreme military action.", "analysis": null, "time": "9:00 AM", "tag": "EDITORIAL", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/commentisfree/2026/sep/10/trump-iran-violence"}, {"id": "o3", "lead": false, "kicker": "CLIMATE POLICY", "headline": "Is Burnham Trying to Appease Trump? Or Reform? What Other Reason for North Sea Oil Plans?", "sub": "George Monbiot questions Labour’s impending approval of further drilling amid climate catastrophe.", "summary": "George Monbiot questions the rationale behind Labour's impending approval of further North Sea oil drilling, suggesting it might be an attempt to appease President Trump or the Reform party. Monbiot argues that with climate catastrophe on the doorstep, such plans will bring more pain for negligible gains. He criticizes the decision as a betrayal of environmental commitments.", "analysis": null, "time": "5:00 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/bf8a9a6b38e57e465e41b36b2a5dcd1aa6d2e3cb/137_0_4585_3668/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/sep/10/andy-burnham-north-sea-oil-plans-labour-climate-drilling-trump-reform"}, {"id": "o4", "lead": false, "kicker": "US POLITICS", "headline": "It’s My Party and I’ll Lie if I Want To", "sub": "The problem for Democrats is that Trump has frequently done things sane people find irrational, and it works.", "summary": "This opinion piece argues that a core problem for Democrats is President Trump's ability to engage in actions that rational people perceive as narcissistic, irrational, or malevolent, yet these actions often prove effective for him politically. The author explores how Trump's unconventional approach challenges traditional political norms and expectations, leaving opponents struggling to counter his influence.", "analysis": null, "time": "5:05 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://static01.nyt.com/images/2026/09/10/multimedia/10conversation-gwfc/10conversation-gwfc-superJumbo.jpg", "link": "https://www.nytimes.com/2026/09/10/opinion/trump-midterms-dallas-convention.html"}]}], "following": [{"id": "follow-1", "lead": false, "kicker": null, "headline": "Economic Scenarios for Transformative AI", "sub": null, "summary": "Tyler Cowen highlights a paper by Anton Korinek and others from Anthropic, which presents a framework for assessing the economic consequences of AI between 2026 and 2030. The authors are described as sober, reasoned, and scientific in their approach. The paper aims to provide a dynamically consistent analysis of AI's potential economic impacts.", "analysis": null, "time": "4:39 AM", "tag": null, "sensitivity": false, "image": null, "link": "https://marginalrevolution.com/marginalrevolution/2026/09/economic-scenarios-for-transformative-ai.html?utm_source=rss&utm_medium=rss&utm_campaign=economic-scenarios-for-transformative-ai", "author": "Tyler Cowen", "publication": "Marginal Revolution", "paywalled": null, "voice_ids": ["tyler-cowen"], "canonical_key": "url:https://marginalrevolution.com/marginalrevolution/2026/09/economic-scenarios-for-transformative-ai.html", "following": true}, {"id": "follow-2", "lead": false, "kicker": null, "headline": "Ricardo Reis and the IMF?", "sub": null, "summary": "Tyler Cowen reports that the IMF dropped Ricardo Reis, a London School of Economics professor, as its lead candidate for chief economist at the last minute. The decision reportedly stemmed from Reis having made critical remarks about the Trump administration’s economic policies. This incident raises questions about political influence in international financial appointments.", "analysis": null, "time": "2:25 AM", "tag": null, "sensitivity": false, "image": null, "link": "https://marginalrevolution.com/marginalrevolution/2026/09/ricardo-reis-and-the-imf.html?utm_source=rss&utm_medium=rss&utm_campaign=ricardo-reis-and-the-imf", "author": "Tyler Cowen", "publication": "Marginal Revolution", "paywalled": null, "voice_ids": ["tyler-cowen"], "canonical_key": "url:https://marginalrevolution.com/marginalrevolution/2026/09/ricardo-reis-and-the-imf.html", "following": true}, {"id": "follow-3", "lead": false, "kicker": null, "headline": "My very interesting Conversation with Jared Diamond", "sub": null, "summary": "Tyler Cowen shares the audio, video, and transcript of his conversation with Jared Diamond, focusing on the question of which leaders truly make a difference. They discuss conditions for religious founders' success, whether destructive leaders have more impact than constructive ones, and the limited role of individual leaders in Papua New Guinea. The conversation also touches on the undervalued role of 'preventers' in leadership.", "analysis": null, "time": "12:36 AM", "tag": null, "sensitivity": false, "image": null, "link": "https://marginalrevolution.com/marginalrevolution/2026/09/my-very-interesting-conversation-with-jared-diamond.html?utm_source=rss&utm_medium=rss&utm_campaign=my-very-interesting-conversation-with-jared-diamond", "author": "Tyler Cowen", "publication": "Marginal Revolution", "paywalled": null, "voice_ids": ["tyler-cowen"], "canonical_key": "url:https://marginalrevolution.com/marginalrevolution/2026/09/my-very-interesting-conversation-with-jared-diamond.html", "following": true}, {"id": "follow-4", "lead": false, "kicker": null, "headline": "What should I ask Kevin Roose?", "sub": null, "summary": "Tyler Cowen is preparing for a podcast with Kevin Roose, a technology columnist and podcast host for The New York Times and author of three books, including one about Liberty University. Cowen invites readers to suggest questions for Roose. This engagement seeks to leverage community input for an upcoming interview.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": null, "link": "https://marginalrevolution.com/marginalrevolution/2026/09/what-should-i-ask-kevin-roose.html?utm_source=rss&utm_medium=rss&utm_campaign=what-should-i-ask-kevin-roose", "author": "Tyler Cowen", "publication": "Marginal Revolution", "paywalled": null, "voice_ids": ["tyler-cowen"], "canonical_key": "url:https://marginalrevolution.com/marginalrevolution/2026/09/what-should-i-ask-kevin-roose.html", "following": true}, {"id": "follow-5", "lead": false, "kicker": null, "headline": "Wednesday assorted links", "sub": null, "summary": "Tyler Cowen provides a collection of assorted links covering diverse topics. These include a historical crime and drunkenness map of England and Wales, news that author Cesar Aira will stop writing, a discussion on a potential post-cultural state, Madrid's high PISA scores, firms as foragers, and the return of Asimov Press. The links offer a varied intellectual exploration.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": null, "link": "https://marginalrevolution.com/marginalrevolution/2026/09/wednesday-assorted-links-570.html?utm_source=rss&utm_medium=rss&utm_campaign=wednesday-assorted-links-570", "author": "Tyler Cowen", "publication": "Marginal Revolution", "paywalled": null, "voice_ids": ["tyler-cowen"], "canonical_key": "url:https://marginalrevolution.com/marginalrevolution/2026/09/wednesday-assorted-links-570.html", "following": true}, {"id": "follow-6", "lead": false, "kicker": null, "headline": "It’s not disloyal to criticize the government’s handling of Trump – but it can be", "sub": null, "summary": "Andrew Coyne argues that criticizing the government's handling of a trade war is not inherently disloyal, but acknowledges that it can be perceived as such. The piece likely delves into the nuances of political discourse during international economic disputes. Coyne explores the fine line between constructive criticism and perceived undermining of national unity.", "analysis": null, "time": "Sep 8", "tag": null, "sensitivity": false, "image": null, "link": "https://www.theglobeandmail.com/opinion/article-its-not-disloyal-to-criticize-the-governments-handling-of-a-trade-war/", "author": "Andrew Coyne", "publication": "The Globe and Mail", "paywalled": null, "voice_ids": ["andrew-coyne"], "canonical_key": "url:https://theglobeandmail.com/opinion/article-its-not-disloyal-to-criticize-the-governments-handling-of-a-trade-war", "following": true}]}</script>

  <script>
    (function () {
      var raw = document.getElementById('edition').textContent;
      var data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<div class="notice">No edition loaded. Run the build to generate today’s paper.</div>';
        return;
      }

      var state = { active: (data.sections[0] || {}).id, openId: null };

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Editorial heat flags keep the red chip; procedural flags cool to navy,
      // so a red chip still means something (the Scarce Red Rule).
      function isHotTag(t) {
        return /^(DEVELOPING|BREAKING|LIVE|WAR|ALERT|URGENT)$/i.test(t || '');
      }

      // ---- Ask AI ----------------------------------------------------------
      // The reader taps one story and gets a briefing, not a chat. The prompt
      // does three jobs: hand over the clipping, name the shape of the answer
      // (five parts, ~500 words, hard ceiling), and set up the follow-up so the
      // conversation continues without the reader having to think of a question.
      // Voice constraints mirror src/config.py HOUSE_VOICE, em dash ban included.
      function buildPrompt(st, sectionLabel) {
        var L = [];
        L.push('I read this in my morning paper and I want to understand it properly.');
        L.push('');
        L.push('THE CLIPPING');
        L.push('Headline: ' + st.headline);
        if (st.author) L.push('Author: ' + st.author);
        if (st.publication) L.push('Publication: ' + st.publication);
        if (st.sub) L.push('Standfirst: ' + st.sub);
        if (st.summary) L.push('Summary: ' + st.summary);
        if (st.analysis) L.push("My paper's why-it-matters note: " + st.analysis);
        L.push('Section: ' + sectionLabel + '. Filed ' + (st.time || 'this morning') +
               ', edition of ' + data.date + '.');
        if (st.link) L.push('Source: ' + st.link);
        L.push('');
        L.push('WHAT I WANT');
        L.push('A briefing that leaves me genuinely informed, not a restatement of what I just');
        L.push('pasted. Assume I know nothing beyond the clipping above.');
        L.push('');
        L.push('Check current reporting first if you are able to search. My clipping is a');
        L.push('summary and may be incomplete or already overtaken by events. If you cannot');
        L.push('search, say so in one line at the top, then separate what you are confident');
        L.push('about from what you would want verified.');
        L.push('');
        L.push('STRUCTURE');
        L.push('I am reading this on a phone. Build the answer in layers, heaviest first, so');
        L.push('I can stop at the end of any layer and still have got something whole. Use');
        L.push('these markdown headings exactly, so they render large on a small screen.');
        L.push('');
        L.push('# The gist');
        L.push('An H1 of six to ten words stating the actual point, not the topic. Then two or');
        L.push('three short sentences giving me the whole story in plain words. If I read');
        L.push('nothing else, this is what I walk away knowing. Correct my clipping here if it');
        L.push('is wrong or out of date.');
        L.push('');
        L.push('## Why it matters');
        L.push('Two or three short sentences on the stakes and the second order effects. Be');
        L.push('concrete about who gains, who pays, how much, and by when.');
        L.push('');
        L.push('## How we got here');
        L.push('Only the background I need to follow this story. Not a history lecture.');
        L.push('');
        L.push('## Where it is contested');
        L.push('The strongest disagreement among serious people, put fairly. If it is genuinely');
        L.push('uncontested, say so in one sentence and move on.');
        L.push('');
        L.push('## What to watch');
        L.push('Three bullets, each a specific checkable marker with a rough timeframe.');
        L.push('');
        L.push('## Ask me next');
        L.push('Three numbered questions, ordered by what would teach me the most. I will reply');
        L.push('with a digit.');
        L.push('');
        L.push('READING ON A PHONE');
        L.push('Short paragraphs: three sentences at most, none longer than about sixty words,');
        L.push('with a blank line between them. No tables, no nested bullets, no wall of text.');
        L.push('Around 500 words in total. Hard ceiling 650. Do not pad to reach a length; the');
        L.push('gist and why it matters are worth more than the sections under them.');
        L.push('');
        L.push('VOICE');
        L.push('Financial Times, not an encyclopedia and not a chatbot. Plain, confident,');
        L.push('concrete. Specifics over abstractions: names, numbers, dates, stakes. Every');
        L.push('sentence earns its place. No preamble, no throat clearing, no restating my');
        L.push('prompt back to me, no hedging filler, no em dashes. Where you are uncertain,');
        L.push('mark it in the sentence it applies to rather than in a disclaimer paragraph.');
        return L.join('\n');
      }

      function findStory(id) {
        var followed = data.following || [];
        for (var f = 0; f < followed.length; f++) {
          if (followed[f].id === id) {
            return { story: followed[f], label: 'Opinion · Following' };
          }
        }
        for (var i = 0; i < data.sections.length; i++) {
          var list = data.sections[i].stories || [];
          for (var j = 0; j < list.length; j++) {
            if (list[j].id === id) {
              return { story: list[j], label: data.sections[i].label };
            }
          }
        }
        return null;
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        // Older iOS standalone PWAs land here.
        return new Promise(function (resolve, reject) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('copy failed'));
        });
      }

      // Tagline reflects the sections the edition actually shipped, not a
      // hardcoded list that can disagree with the paper.
      function taglineText() {
        var labels = data.sections
          .filter(function (s) { return s.id !== 'front'; })
          .map(function (s) { return s.label; });
        return (labels.length ? labels : ['Toronto', 'World', 'Business']).join(' · ');
      }

      function weatherHtml(w) {
        if (!w || !w.icon) return '';
        var week = (w.week || []).map(function (d) {
          return '<div class="day"><div class="d">' + esc(d.day) + '</div>' +
            '<div class="i">' + esc(d.icon) + '</div>' +
            '<div class="hi">' + esc(d.hi) + '°</div>' +
            '<div class="lo">' + esc(d.lo) + '°</div></div>';
        }).join('');
        return '<div class="weather" id="weather" role="button" tabindex="0" ' +
          'aria-expanded="false" aria-label="Toronto weather, tap for the week">' +
          '<div class="summary">' +
            '<span class="ico">' + esc(w.icon) + '</span>' +
            '<span class="city">Toronto</span>' +
            '<span class="temp">' + esc(w.high) + '° / ' + esc(w.low) + '°</span>' +
            '<span class="muted">' + esc(w.condition) + '</span>' +
            '<span class="muted">Rain ' + esc(w.rain) + '</span>' +
            '<span class="muted">Wind ' + esc(w.wind) + '</span>' +
            '<span class="chev" id="wchev">▼</span>' +
          '</div>' +
          '<div class="week" id="wweek" style="display:none">' + week + '</div>' +
        '</div>';
      }

      function tabsHtml() {
        return '<div class="tabs" role="tablist">' + data.sections.map(function (s) {
          var on = s.id === state.active;
          return '<button class="tab' + (on ? ' active' : '') + '" role="tab" ' +
            'aria-selected="' + on + '" data-tab="' + esc(s.id) + '">' + esc(s.label) + '</button>';
        }).join('') + '</div>';
      }

      function cardHtml(st, sectionLabel) {
        var open = st.id === state.openId;
        var tag = st.tag
          ? '<span class="tag ' + (isHotTag(st.tag) ? 'hot' : 'cool') + '">' + esc(st.tag) + '</span>'
          : '';
        var kicker = st.kicker ? '<div class="kicker">' + tag + esc(st.kicker) + '</div>' : '';
        var sub = st.sub ? '<div class="sub">' + esc(st.sub) + '</div>' : '';
        var followMeta = '';
        var filed = '<div class="time">' + esc(st.time) + '</div>';
        if (st.following) {
          var metaParts = [st.author, st.publication, st.time].filter(function (part) { return !!part; });
          followMeta = metaParts.length
            ? '<div class="follow-meta">' + metaParts.map(esc).join(' · ') + '</div>'
            : '';
          filed = '';
        }
        var expand = '';
        if (open) {
          var img = st.image
            ? '<img src="' + esc(st.image) + '" alt="' + esc(st.headline) + '" ' +
              'loading="lazy" onerror="this.remove()" />'
            : '';
          var analysis = st.analysis
            ? '<div class="analysis"><span class="alabel">Why it matters</span>' + esc(st.analysis) + '</div>'
            : '';
          var link = st.link
            ? '<a class="readmore" href="' + esc(st.link) + '" target="_blank" rel="noopener">Read full story →</a>'
            : '';

          // Prefill the destinations at render time so a long press ("open in
          // app") carries the prompt too, instead of us intercepting the tap.
          var q = encodeURIComponent(buildPrompt(st, sectionLabel));
          // No target="_blank" on these two. In a standalone PWA a blank target
          // opens an in-app browser sheet, which iOS will not hand off to an
          // installed app; a plain top-level tap is what lets the Claude and
          // ChatGPT apps claim their own domains as Universal Links. "Read full
          // story" keeps _blank, because a news site does belong in a tab.
          var share = navigator.share
            ? '<button class="ask-opt" data-ai="share" data-id="' + esc(st.id) + '">Share to app…</button>'
            : '';
          var actions = '<div class="actions">' + link +
            '<button class="askai" data-ask="' + esc(st.id) + '" aria-expanded="false" ' +
              'aria-controls="ask-' + esc(st.id) + '">Ask AI ▾</button></div>' +
            '<div class="ask-panel" id="ask-' + esc(st.id) + '">' +
              '<div class="ask-row">' +
                '<a class="ask-opt" href="https://claude.ai/new?q=' + esc(q) + '">Claude</a>' +
                '<a class="ask-opt" href="https://chatgpt.com/?q=' + esc(q) + '">ChatGPT</a>' +
                share +
                '<button class="ask-opt" data-ai="copy" data-id="' + esc(st.id) + '">Copy</button>' +
              '</div>' +
              '<div class="ask-note">Opens in the app if you have it installed. The reply ' +
                'starts with the gist in a few lines, then goes deeper, then offers three ' +
                'follow-up questions.</div>' +
            '</div>';

          expand = '<div class="expand">' + img +
            '<p class="sumtext">' + esc(st.summary) + '</p>' + analysis + actions + '</div>';
        }
        return '<div class="card' + (st.lead ? ' lead' : '') + (open ? ' open' : '') +
          '" data-card="' + esc(st.id) + '" role="button" tabindex="0" ' +
          'aria-expanded="' + open + '">' +
          '<div class="row"><div class="row-main">' + kicker +
            '<div class="headline">' + esc(st.headline) + '</div>' + sub + followMeta + filed +
            '</div><div class="toggle" aria-hidden="true">' + (open ? '−' : '+') + '</div>' +
          '</div>' + expand +
        '</div>';
      }

      function storiesInner() {
        var section = data.sections.filter(function (s) { return s.id === state.active; })[0];
        if (!section) return '';

        var sectionStories = section.stories || [];
        var following = data.following || [];
        if (section.id === 'opinion' && following.length) {
          var followedHtml = following.map(function (st) {
            return cardHtml(st, 'Opinion · Following');
          }).join('');
          var ordinaryHtml = sectionStories.length
            ? sectionStories.map(function (st) { return cardHtml(st, section.label); }).join('')
            : '<div class="empty">Nothing else filed for Opinion this morning.</div>';
          return '<section class="opinion-desk following-block" aria-labelledby="following-title">' +
              '<div class="desk-head"><h2 class="desk-title" id="following-title">Following</h2>' +
                '<div class="desk-dek">New writing from voices you follow</div></div>' +
              followedHtml +
            '</section>' +
            '<section class="opinion-desk today-opinion" aria-labelledby="today-opinion-title">' +
              '<div class="desk-head"><h2 class="desk-title" id="today-opinion-title">Today’s Opinion</h2>' +
                '<div class="desk-dek">Selected independently by the morning desk</div></div>' +
              ordinaryHtml +
            '</section>';
        }

        if (!sectionStories.length) {
          return '<div class="empty">Nothing filed for ' + esc(section.label) + ' this morning.</div>';
        }
        return sectionStories.map(function (st) {
          return cardHtml(st, section.label);
        }).join('');
      }

      // Quietly flag a saved (not-today) edition served from cache/offline.
      function staleRibbon() {
        try {
          var meta = document.querySelector('meta[name=build]');
          if (!meta) return '';
          var built = new Date(meta.getAttribute('content'));
          if (isNaN(built.getTime())) return '';
          var opt = { timeZone: 'America/Toronto' };
          if (built.toLocaleDateString('en-CA', opt) < new Date().toLocaleDateString('en-CA', opt)) {
            return '<div class="stale">Saved edition · ' + esc(data.date) + '</div>';
          }
        } catch (e) {}
        return '';
      }

      function appHtml() {
        return '<div class="masthead">' +
            '<div class="date">' + esc(data.date) + '</div>' +
            '<div class="title">THE DAILY</div>' +
            '<div class="tagline">' + esc(taglineText()) + '</div>' +
          '</div>' +
          staleRibbon() +
          weatherHtml(data.weather) +
          tabsHtml() +
          '<div class="stories" id="stories">' + storiesInner() + '</div>' +
          '<div class="footer">THE DAILY · TORONTO · Tap any headline to read</div>';
      }

      var app = document.getElementById('app');

      // Rebuild only the stories column; masthead, weather, and tab strip (and
      // their scroll/open state) are left untouched. This is what keeps a tap
      // from resetting the reader's place.
      function refreshStories() {
        document.getElementById('stories').innerHTML = storiesInner();
        bindCards();
      }

      function selectTab(id) {
        if (id === state.active) return;
        state.active = id;
        state.openId = null;
        var tabs = document.querySelectorAll('.tab');
        Array.prototype.forEach.call(tabs, function (t) {
          var on = t.getAttribute('data-tab') === id;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on);
          if (on) t.scrollIntoView({ inline: 'center', block: 'nearest' });
        });
        refreshStories();
        // Start the new section at the top, tab strip stuck under the notch.
        var tabsEl = document.querySelector('.tabs');
        if (tabsEl) window.scrollTo(0, tabsEl.offsetTop);
      }

      function toggleCard(id) {
        var y = window.scrollY;
        state.openId = state.openId === id ? null : id;
        refreshStories();
        window.scrollTo(0, y);   // grow/collapse in place, never jump
      }

      function bindWeather() {
        var weather = document.getElementById('weather');
        if (!weather) return;
        function toggle() {
          var week = document.getElementById('wweek');
          var chev = document.getElementById('wchev');
          var showing = week.style.display !== 'none';
          week.style.display = showing ? 'none' : 'flex';
          chev.textContent = showing ? '▼' : '▲';
          weather.setAttribute('aria-expanded', String(!showing));
        }
        weather.addEventListener('click', toggle);
        weather.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
        });
      }

      function bindTabs() {
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
          btn.addEventListener('click', function () { selectTab(btn.getAttribute('data-tab')); });
        });
      }

      function bindCards() {
        Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
          function activate(ev) {
            // Let links and the Ask AI controls handle their own activation.
            if (ev.target.closest('a, button')) return;
            // While open, only the header row collapses it, so reading (and
            // selecting) the body never closes the story by accident.
            if (card.classList.contains('open') && !ev.target.closest('.row')) return;
            toggleCard(card.getAttribute('data-card'));
          }
          card.addEventListener('click', activate);
          card.addEventListener('keydown', function (ev) {
            if (ev.key !== 'Enter' && ev.key !== ' ') return;
            // Never swallow the key from a control that acts on it itself.
            if (ev.target.closest('a, button')) return;
            ev.preventDefault();
            activate(ev);
          });
          bindAsk(card);
        });
      }

      // Panel state is held in the DOM, not in `state`, so opening the
      // destinations never triggers a stories rebuild and never moves the page.
      function bindAsk(card) {
        var toggle = card.querySelector('.askai');
        if (!toggle) return;
        var panel = card.querySelector('.ask-panel');

        toggle.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var open = panel.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(open));
          toggle.textContent = open ? 'Ask AI ▴' : 'Ask AI ▾';
        });

        Array.prototype.forEach.call(panel.querySelectorAll('[data-ai]'), function (el) {
          var kind = el.getAttribute('data-ai');
          el.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var found = findStory(el.getAttribute('data-id'));
            if (!found) return;
            var prompt = buildPrompt(found.story, found.label);

            if (kind === 'share') {
              navigator.share({ text: prompt }).catch(function () {});
              return;
            }
            var label = el.textContent;
            copyText(prompt).then(function () {
              el.textContent = 'Copied';
            }).catch(function () {
              el.textContent = 'Copy failed';
            }).then(function () {
              setTimeout(function () { el.textContent = label; }, 1800);
            });
          });
        });
      }

      app.innerHTML = appHtml();
      bindWeather();
      bindTabs();
      bindCards();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
