  <title>The Daily</title>
  <style>
    /* ---- Design tokens: The Morning Broadsheet ------------------------- */
    :root {
      --paper: #faf8f3;        /* the sheet (warm white, never #fff) */
      --desk: #efece6;         /* the desk beyond the column */
      --ink: #17130d;          /* headlines / primary text */
      --ink-sub: #453f38;      /* standfirsts */
      --ink-muted: #635d54;    /* inactive tabs */
      --meta: #6c665c;         /* timestamps, dateline, footer (>=AA small) */
      --rule: #dcd6cc;         /* hairline between cards */
      --rule-soft: #e3ded4;    /* hairline inside an opened card */
      --navy: #1a2744;         /* structural ink */
      --navy-ink: #1a2744;     /* navy used as text (links, active tab) */
      --red: #8b1a1a;          /* editorial heat */
      --tint-open: #f2ede4;    /* ground of an expanded card */
      --tint-analysis: #ece6da;/* ground of the why-it-matters note */
      --strip-bg: #1a2744;     /* weather strip */
      --strip-ink: #f7f4ee;
      --chip-hot: #8b1a1a;     /* DEVELOPING / WAR-class flags */
      --chip-cool: #1a2744;    /* procedural flags (FINAL, EDITORIAL) */
      --chip-ink: #faf8f3;
      --focus: #1a2744;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151a22;      /* lamplight edition: deep navy-black paper */
        --desk: #0e1219;
        --ink: #e9e3d5;        /* cream ink */
        --ink-sub: #bcb6a8;
        --ink-muted: #948e82;
        --meta: #8f897d;
        --rule: #2a303a;
        --rule-soft: #2f3540;
        --navy: #6f82a8;       /* structure lifted so it reads on dark */
        --navy-ink: #a3b3d2;
        --red: #d1726b;        /* desaturated heat */
        --tint-open: #1b212b;
        --tint-analysis: #20262f;
        --strip-bg: #1b2334;
        --strip-ink: #e9e3d5;
        --chip-hot: #a8443c;
        --chip-cool: #3b4a6c;
        --chip-ink: #f0eadc;
        --focus: #a3b3d2;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 100%; }
    html, body { background: var(--desk); }
    body {
      font-family: 'Georgia', serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--paper);
      max-width: 680px;
      margin: 0 auto;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Masthead */
    .masthead {
      border-bottom: 4px solid var(--navy);
      padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
      background: var(--paper);
    }
    .masthead .date {
      font-size: 0.6875rem; color: var(--meta); letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .masthead .title {
      font-size: 2.375rem; font-weight: 700; letter-spacing: -0.01em;
      color: var(--navy); line-height: 1; margin-bottom: 2px;
    }
    .masthead .tagline {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; color: var(--meta);
      letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* Stale-edition ribbon */
    .stale {
      background: var(--tint-analysis); color: var(--meta);
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; text-align: center;
      padding: 7px 20px;
    }

    /* Weather strip */
    .weather {
      background: var(--strip-bg); color: var(--strip-ink);
      cursor: pointer; user-select: none;
    }
    .weather .summary {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
      min-height: 44px;
    }
    .weather .summary::-webkit-scrollbar { display: none; }
    .weather .ico { font-size: 1.375rem; }
    .weather .city { font-weight: 700; font-size: 0.9375rem; }
    .weather .temp { font-size: 0.9375rem; }
    .weather .muted { opacity: 0.72; font-size: 0.8125rem; white-space: nowrap; }
    .weather .chev { margin-left: auto; opacity: 0.6; font-size: 0.75rem; }
    .weather .week {
      display: flex; border-top: 1px solid rgba(255,255,255,0.12);
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
    }
    .weather .week::-webkit-scrollbar { display: none; }
    .weather .day {
      text-align: center; min-width: 52px; padding: 0 8px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .weather .day .d { font-size: 0.6875rem; opacity: 0.6; margin-bottom: 4px; }
    .weather .day .i { font-size: 1.125rem; }
    .weather .day .hi { font-size: 0.8125rem; font-weight: 700; margin-top: 4px; }
    .weather .day .lo { font-size: 0.6875rem; opacity: 0.5; }

    /* Tab nav */
    .tabs {
      display: flex; overflow-x: auto; border-bottom: 2px solid var(--navy);
      background: var(--paper); scrollbar-width: none;
      position: sticky; top: 0; z-index: 10;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; min-height: 44px; display: flex; align-items: center;
      padding: 0 18px; border: none; background: none; cursor: pointer;
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; font-weight: 700;
      color: var(--ink-muted); border-bottom: 3px solid transparent;
      margin-bottom: -2px; letter-spacing: 0.12em; text-transform: uppercase;
      transition: color 0.15s;
    }
    .tab.active { color: var(--navy-ink); border-bottom-color: var(--navy); }

    /* Stories */
    .stories { padding: 8px 20px 40px; }
    .empty {
      padding: 40px 4px; text-align: center; color: var(--meta);
      font-style: italic; font-size: 0.9375rem;
    }
    .card {
      border-top: 1px solid var(--rule); padding: 14px 0; cursor: pointer;
      background: var(--paper); transition: background 0.15s;
    }
    .card.lead { border-top: 3px solid var(--navy); padding: 20px 0 16px; }
    .card.open { background: var(--tint-open); }
    .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card .row-main { flex: 1; min-width: 0; }
    .card .kicker {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; color: var(--red); margin-bottom: 6px; text-transform: uppercase;
    }
    .card .tag {
      color: var(--chip-ink); padding: 2px 6px; margin-right: 8px;
      font-size: 0.5625rem; border-radius: 2px; vertical-align: 1px;
    }
    .card .tag.hot { background: var(--chip-hot); }
    .card .tag.cool { background: var(--chip-cool); }
    .card .headline {
      font-size: 1.0625rem; font-weight: 700; line-height: 1.25; color: var(--ink); margin-bottom: 6px;
    }
    .card.lead .headline { font-size: 1.375rem; }
    .card .sub {
      font-size: 0.875rem; color: var(--ink-sub); line-height: 1.4; margin-bottom: 4px; font-style: italic;
    }
    .card .time { font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta); margin-top: 4px; }
    .card .toggle { color: var(--navy-ink); opacity: 0.5; font-size: 1.125rem; flex-shrink: 0; margin-top: 2px; }
    .card .expand {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    }
    .card .expand .sumtext {
      font-size: 0.9375rem; color: var(--ink-sub); line-height: 1.7;
    }
    .card .expand img {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      background: var(--tint-open); border-radius: 3px; margin-bottom: 12px;
    }
    .card .analysis {
      margin-top: 12px; padding: 10px 14px; background: var(--tint-analysis);
      font-size: 0.875rem; line-height: 1.6; color: var(--ink-sub); font-style: italic;
    }
    .card .analysis .alabel {
      display: block; font-family: 'Arial', sans-serif; font-style: normal;
      font-size: 0.625rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--navy-ink); margin-bottom: 4px;
    }
    .card .readmore {
      display: inline-block; margin-top: 12px; min-height: 44px; line-height: 44px;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink); text-decoration: none;
    }
    .card .readmore:hover { text-decoration: underline; }
    .card .readmore:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    /* Ask AI: hand the clipping and a briefing prompt to a model */
    .card .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .askai, .card .ask-opt {
      border: none; background: none; padding: 0; cursor: pointer;
      min-height: 44px; line-height: 44px; text-decoration: none;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink);
    }
    .card .askai { margin-top: 12px; }
    .card .askai:hover, .card .ask-opt:hover { text-decoration: underline; }
    .card .askai:focus-visible, .card .ask-opt:focus-visible {
      outline: 2px solid var(--focus); outline-offset: 3px;
    }
    .card .ask-panel { display: none; border-top: 1px solid var(--rule-soft); margin-top: 4px; }
    .card .ask-panel.open { display: block; }
    .card .ask-row { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .ask-note {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.55;
      color: var(--meta); letter-spacing: 0.02em; padding-bottom: 12px;
    }

    /* Footer */
    .footer {
      border-top: 2px solid var(--navy);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta);
      text-align: center; letter-spacing: 0.06em;
    }
    .notice { padding: 40px 20px; text-align: center; color: var(--meta); font-style: italic; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>

rmer partner, who denies the allegations.", "summary": "Hamilton Mayor Andrea Horwath has publicly disclosed that she recently left an abusive relationship, stating she is \"tired of being silent.\" Her former partner has denied the abuse allegations. The mayor's revelation brings a personal struggle into the public eye, sparking conversations about domestic abuse and the courage to speak out, even for public figures.", "analysis": "This disclosure by a prominent public official like Mayor Horwath could empower others facing similar situations to seek help and speak out. It also highlights the pervasive nature of domestic abuse, transcending socioeconomic status, and may prompt further discussion on support systems and accountability.", "time": "Yesterday", "tag": null, "sensitivity": true, "image": null, "link": "https://www.thestar.com/news/gta/hamilton-mayor-andrea-horwath-reveals-she-left-an-abusive-relationship/article_34ca7eed-9231-59dd-aa76-effa0387379f.html"}, {"id": "t2", "lead": false, "kicker": "CRIME", "headline": "Suspect Arrested in 'Senseless' Fatal Stabbing of Zenin Roussel", "sub": "A suspect has been apprehended in connection with the Sunday morning stabbing death of 21-year-old Zenin Roussel in Hamilton.", "summary": "A suspect has been arrested in the \"senseless\" fatal stabbing of 21-year-old Zenin Roussel. Roussel was found with stab wounds by a cab driver on Main Street West near Frid Street in Hamilton early Sunday morning. Police are continuing their investigation into the incident.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": true, "image": null, "link": "https://www.thestar.com/news/gta/zenin-roussel-hamilton-homicide-update/article_91c501ef-4558-5cb9-b58a-ed1ab093e2f5.html"}, {"id": "t3", "lead": false, "kicker": "WEATHER", "headline": "Severe Thunderstorm Watch Issued for Toronto, Warning of Hail and High Winds", "sub": "Environment Canada forecasts heavy rain, wind gusts near 100 km/h, and 'toonie-sized hail' for the afternoon and evening.", "summary": "Environment Canada has issued a severe thunderstorm watch for Toronto, warning residents to prepare for heavy rain, wind gusts approaching 100 km/h, and potentially \"toonie-sized hail.\" The adverse weather is expected to affect the city through the afternoon and into the evening. Residents are advised to take precautions and stay informed of changing conditions.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/e/5c/e5c73fb3-67c3-5db5-80a1-120300a8567e/6a7cb4a2ed781.image.jpg?resize=300%2C183", "link": "https://www.thestar.com/news/gta/severe-thunderstorm-watch-in-toronto-warning-of-heavy-rain-high-winds--and-toonie-sized-hail/article_b0c3be5f-aa71-4d16-b815-c4d712b83daa.html"}, {"id": "t4", "lead": false, "kicker": "HOUSING", "headline": "Eviction Rates Soar in Toronto Communities Near New Transit Lines", "sub": "A study reveals nearly 1 in 10 residents in two transit-adjacent areas faced eviction between 2010 and 2023.", "summary": "A recent study indicates that nearly one in ten residents in two Toronto communities located near new UP, Finch West, or Eglinton LRT stops faced eviction between 2010 and 2023. The findings suggest a significant increase in eviction rates in areas undergoing transit-oriented development. This raises concerns about housing affordability and tenant protection amidst urban expansion.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/6/01/60134db0-bb83-50d6-bf19-e97d7e31a040/6a7cdcb664a81.image.jpg?resize=300%2C200", "link": "https://www.thestar.com/news/gta/eviction-applications-much-higher-in-these-communities-near-new-transit/article_1879d75b-445f-41bb-adfc-c9d824d2961d.html"}]}, {"id": "world", "label": "World", "stories": [{"id": "w1", "lead": true, "kicker": "AFRICA", "headline": "A Patient’s Final Breath in a Congolese Ebola Ward", "sub": "The Democratic Republic of Congo's Ebola epidemic continues to ravage communities, with life and death separated by a razor-thin margin in medical clinics.", "summary": "In Rwampara, the heart of the Democratic Republic of Congo's devastating Ebola epidemic, the distance between life and death remains razor-thin within medical clinics. A recent report details the final moments of a patient in an Ebola ward, highlighting the ongoing struggle against the disease. The epidemic continues to claim lives and strain healthcare resources in the region, underscoring the urgent need for sustained international support and intervention.", "analysis": "The stark reality depicted in Congolese Ebola wards serves as a grim reminder of persistent global health crises, even as other international conflicts dominate headlines. The continued spread of Ebola in the DRC poses a significant public health threat, requiring renewed focus and resources to prevent wider regional and global impact.", "time": "5:02 AM", "tag": "DEVELOPING", "sensitivity": true, "image": null, "link": "https://www.nytimes.com/2026/08/13/world/africa/ebola-congo-patient-dies.html"}, {"id": "w2", "lead": false, "kicker": "ASIA", "headline": "Potatoes 'Boil' in Ground as Record Heatwave Sweeps Across Asia", "sub": "South Korean farmers suffer, Hong Kong records highest temperature, and Japan endures 'cruelly hot' days.", "summary": "A record-breaking heatwave is sweeping across swathes of Asia, causing severe agricultural damage and public health concerns. In South Korea, farmers report potatoes \"boiling\" in the ground, while Hong Kong has recorded its highest-ever temperature. Japan is also sweltering through newly designated 'cruelly hot' days, highlighting the intensifying impact of climate change on the region.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/77037a655afb5ad40039ea9c3759fdb6c48b4e85/579_0_4740_3791/500.jpg", "link": "https://www.theguardian.com/world/2026/aug/13/asia-heatwave-south-korea-potatoes-boil-ground-record-heat-hong-kong-japan"}, {"id": "w3", "lead": false, "kicker": "MEXICO", "headline": "Former Mexican Governor Charged in 2014 Disappearance of 43 Students", "sub": "Ángel Aguirre indicted in the notorious case that became a symbol of Mexico's brutal cartel violence.", "summary": "Former Mexican governor Ángel Aguirre has been indicted in connection with the disappearance of 43 students in 2014, a case that profoundly shocked Mexico and became a stark symbol of the nation's brutal cartel violence. The charges represent a significant development in the long-unresolved tragedy, offering a potential path toward justice for the victims' families.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/2026/aug/12/former-mexican-governor-charged-in-case-of-43-students-who-vanished-in-2014"}, {"id": "w4", "lead": false, "kicker": "AUKUS", "headline": "Pentagon Official Affirms Aukus Deal is 'Full Steam Ahead'", "sub": "US Under Secretary of War Elbridge Colby expresses satisfaction with the nuclear submarine program's progress, echoing former President Trump's stance.", "summary": "Elbridge Colby, a US Under Secretary of War and a former sceptic of the Aukus security pact, has declared the deal is now \"full steam ahead.\" Colby expressed his satisfaction with the progress of the nuclear submarine program, echoing sentiments previously voiced by former President Trump. This affirmation signals strong bipartisan support for the trilateral security initiative.", "analysis": null, "time": "8:20 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/27d3d8c0038e3643768bb564787f4186cc978e49/171_0_4913_3931/500.jpg", "link": "https://www.theguardian.com/world/2026/aug/13/pentagon-official-and-former-aukus-sceptic-says-deal-is-full-steam-ahead-echoing-trump"}]}, {"id": "sports", "label": "Sports", "stories": [{"id": "s1", "lead": true, "kicker": "ATHLETICS", "headline": "Hudson-Smith Dazzles Home Fans with Golden European 400m Hat-Trick", "sub": "British runner Matt Hudson-Smith secures a historic third European Championship 400m gold in Birmingham.", "summary": "British athlete Matt Hudson-Smith delivered a spectacular performance, clinching a historic third consecutive gold medal in the men's 400m at the European Athletics Championships in Birmingham. Dazzling the home crowd, Hudson-Smith's victory solidifies his status as a dominant force in European track and field. His achievement marks a significant milestone in his career and for British athletics.", "analysis": "Hudson-Smith's consistent dominance in the 400m signals a strong contender for future global championships, potentially boosting Britain's medal hopes. His performance also provides a much-needed morale boost for home fans, especially after a mixed season for some other British athletes.", "time": "Yesterday", "tag": "FINAL", "sensitivity": false, "image": "https://media.guim.co.uk/fb67bc4a87778ec5dd42f7d7a6f08a1f198f7bdb/544_0_3549_2839/500.jpg", "link": "https://www.theguardian.com/sport/2026/aug/12/matt-hudson-smith-european-athletic-championship-2026-400m"}, {"id": "s2", "lead": false, "kicker": "CRICKET", "headline": "Australia's Fragile Batting Exposed by Bangladesh in First Test", "sub": "Bangladesh fast bowler Hasan Mahmud claims six wickets on day one in Darwin, unsettling Australia's lineup.", "summary": "Australia's batting lineup proved fragile on the opening day of the first men's Test against Bangladesh in Darwin. Bangladesh fast bowler Hasan Mahmud exploited the conditions, claiming six wickets to expose the home side's vulnerabilities. The performance sets up a challenging match for Australia, who will need a strong recovery to assert control.", "analysis": null, "time": "8:30 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/b6ecb952ede65a07e9dc0e3850e34888f804f231/928_0_4641_3713/500.jpg", "link": "https://www.theguardian.com/sport/live/2026/aug/13/australia-v-bangladesh-first-mens-test-day-one-live"}, {"id": "s3", "lead": false, "kicker": "RUGBY", "headline": "Carter Gordon Returns for Wallabies in 'Balanced Selection' for Second Japan Test", "sub": "Flyhalf Carter Gordon named in Australian XV, signaling the potential start of his long-awaited era.", "summary": "Flyhalf Carter Gordon has been named in the Australian XV to play Japan in Townsville on Saturday, marking his return to the Wallabies lineup. After three previous false starts, this selection is being hailed as a \"balanced\" choice, potentially ushering in the long-anticipated \"Carter Gordon era\" for Australian rugby. Fans and analysts will be watching closely to see if he can solidify his position.", "analysis": null, "time": "2:03 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/9811d23a5f7ee587913d3619a1b13d58d05f0937/0_221_2001_1600/500.jpg", "link": "https://www.theguardian.com/sport/2026/aug/13/wallabies-team-selection-carter-gordon-australia-vs-japan-rugby-union-test"}, {"id": "s4", "lead": false, "kicker": "CRICKET", "headline": "Joe Root Abolishes England Test Team's Midnight Curfew", "sub": "Captain Joe Root removes the long-standing curfew, urging players to 'be adults' after recent late-night incidents.", "summary": "England Test captain Joe Root has abolished the team's midnight curfew, instructing his players to \"be adults\" following a series of late-night incidents. The decision reflects a shift towards greater personal responsibility within the squad. Root hopes this change will foster a more mature team environment and improve player performance.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/44e676b4a6142fd1dd657771ce5ec8540992f385/0_0_6653_5 firms argue the funds are necessary to support infrastructure for new homes and data centres. This proposed increase, if approved, will place further financial strain on consumers already grappling with rising living costs.", "analysis": null, "time": "8:10 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/9ed29074fda4a84feba454e909d61da0a645cb39/1051_0_4939_3954/500.jpg", "link": "https://www.theguardian.com/business/2026/aug/13/water-bills-suppliers-spending-england-wales-ofwat"}, {"id": "b3", "lead": false, "kicker": "RENEWABLES", "headline": "Australia's Largest Aluminium Smelter to Run on Renewables by 2033", "sub": "Rio Tinto secures a $2.5 billion taxpayer bailout deal with federal and NSW governments to decarbonise operations.", "summary": "Australia's largest aluminium smelter, Tomago, will transition to running entirely on renewable energy by 2033, following a $2.5 billion taxpayer bailout deal struck by Rio Tinto with federal and NSW governments. The agreement aims to cut emissions and decarbonise the facility, preventing its potential closure. This significant investment underscores the push towards green industrial practices.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/2445f677ae7a33a52e1028197eff744ba4a8808f/377_0_4405_3523/500.jpg", "link": "https://www.theguardian.com/business/2026/aug/13/rio-tinto-australia-tomago-aluminium-2bn-bailout-deal-renewable-energy"}, {"id": "b4", "lead": false, "kicker": "TELECOMMUNICATIONS", "headline": "Telstra CEO Receives $700,000 Pay Rise Despite Australia-Wide Outage", "sub": "Vicki Brady's salary increases to $6.8 million, while the board cuts other senior executive bonuses by $1.3 million.", "summary": "Telstra CEO Vicki Brady has received a $700,000 pay rise, bringing her total compensation to $6.8 million, despite a recent Australia-wide outage that affected millions of customers. The telco's board, however, cut senior executive bonuses by a total of $1.3 million in response to the technical failure. The decision has drawn criticism amid public frustration over service disruptions.", "analysis": null, "time": "2:16 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/b61c05a4d57d31999a4407cf6b498dceb891a303/502_0_5023_4019/500.jpg", "link": "https://www.theguardian.com/business/2026/aug/13/telstra-ceo-pay-rise-vicki-brady"}]}, {"id": "opinion", "label": "Opinion", "stories": [{"id": "o1", "lead": true, "kicker": "CLIMATE CRISIS", "headline": "Britain's Scorched Fields Mean a Food Crisis, Government Ignores Key Measure", "sub": "George Monbiot argues that extreme weather and international conflicts make food stockpiles more urgent than ever, a measure the government overlooks.", "summary": "Guardian columnist George Monbiot contends that Britain is facing an impending food crisis due to this summer's extreme weather, which has scorched fields, and ongoing international conflicts like the Iran and Ukraine wars. Monbiot criticizes the government for ignoring the pressing need for national food stockpiles, arguing that such a measure is crucial for national resilience. He asserts that current policies fail to address the escalating threats to food security, leaving the nation vulnerable.", "analysis": "Monbiot's argument highlights a critical intersection of climate change, geopolitical instability, and national policy. His call for food stockpiles suggests a fundamental re-evaluation of national security beyond traditional military concerns, urging the government to prioritize long-term resilience against predictable environmental and political shocks.", "time": "7:00 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/86b353015b0e544c3e3f799d1ee3bb2ac192e37b/1132_0_5660_4528/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/13/britain-food-crisis-government-summer-weather-war-stockpiles"}, {"id": "o2", "lead": false, "kicker": "SOCIAL JUSTICE", "headline": "Jason Arday's Story Used to Beat Back Racial Equality, Afua Hirsch Warns", "sub": "Journalist Afua Hirsch argues that the UK is far from equality, and Arday's success is being weaponized to halt progress.", "summary": "Journalist and academic Afua Hirsch warns that the story of Jason Arday, a prominent academic, is being co-opted by the right to undermine efforts for racial equality in the UK. Hirsch argues that despite individual successes, the UK remains far from achieving true equality in academia and society at large. She contends that Arday's narrative is being used to halt progress rather than inspire broader systemic change.", "analysis": null, "time": "5:00 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/88d10970d6bde68660660a34e7e585c2682ecef7/0_0_5000_4000/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/13/jason-arday-right-racial-equality-society"}, {"id": "o3", "lead": false, "kicker": "AI POLICY", "headline": "If Markets Reject OpenAI and Anthropic, US Should Nationalize Them", "sub": "Bruce Schneier and Nathan E Sanders argue for nationalizing AI models to align them with democratic values, not corporate profits.", "summary": "Bruce Schneier and Nathan E Sanders propose that if market forces fail OpenAI and Anthropic, the US government should nationalize these leading AI companies. They argue that the US has a history of fostering technology for public good, from space to telecommunications. Nationalizing these AI models could ensure they are aligned with democratic values rather than solely corporate profits, serving the broader public interest.", "analysis": null, "time": "Yesterday", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/dbf620b0570af6971845b140c7b695e407e9d7ae/313_0_3136_2509/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/12/openai-anthropic-ai-models"}, {"id": "o4", "lead": false, "kicker": "EDITORIAL", "headline": "The Guardian View on Early Prisoner Release: Don’t Lose Sight of Systemic Reform", "sub": "An editorial cautions against letting emotional urgency obscure strategic policymaking in prisoner release programs.", "summary": "A Guardian editorial advises that while empathy is a strength for a prime minister, there is a risk of allowing emotional urgency to overshadow strategic policymaking regarding early prisoner release. The editorial argues that systemic reform must remain the focus to ensure effective and sustainable changes to the justice system. It cautions against short-term solutions that may neglect long-term consequences.", "analysis": null, "time": "Yesterday", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/49e690c31eddad9c6a0e7742f538c822d8f00054/366_0_3413_2731/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/12/the-guardian-view-on-early-prisoner-release-dont-lose-sight-of-systemic-reform"}]}]}</script>

  <script>
    (function () {
      var raw = document.getElementById('edition').textContent;
      var data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<div class="notice">No edition loaded. Run the build to generate today’s paper.</div>';
        return;
      }

      var state = { active: (data.sections[0] || {}).id, openId: null };

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Editorial heat flags keep the red chip; procedural flags cool to navy,
      // so a red chip still means something (the Scarce Red Rule).
      function isHotTag(t) {
        return /^(DEVELOPING|BREAKING|LIVE|WAR|ALERT|URGENT)$/i.test(t || '');
      }

      // ---- Ask AI ----------------------------------------------------------
      // The reader taps one story and gets a briefing, not a chat. The prompt
      // does three jobs: hand over the clipping, name the shape of the answer
      // (five parts, ~500 words, hard ceiling), and set up the follow-up so the
      // conversation continues without the reader having to think of a question.
      // Voice constraints mirror src/config.py HOUSE_VOICE, em dash ban included.
      function buildPrompt(st, sectionLabel) {
        var L = [];
        L.push('I read this in my morning paper and I want to understand it properly.');
        L.push('');
        L.push('THE CLIPPING');
        L.push('Headline: ' + st.headline);
        if (st.sub) L.push('Standfirst: ' + st.sub);
        if (st.summary) L.push('Summary: ' + st.summary);
        if (st.analysis) L.push("My paper's why-it-matters note: " + st.analysis);
        L.push('Section: ' + sectionLabel + '. Filed ' + (st.time || 'this morning') +
               ', edition of ' + data.date + '.');
        if (st.link) L.push('Source: ' + st.link);
        L.push('');
        L.push('WHAT I WANT');
        L.push('A briefing that leaves me genuinely informed, not a restatement of what I just');
        L.push('pasted. Assume I know nothing beyond the clipping above.');
        L.push('');
        L.push('Check current reporting first if you are able to search. My clipping is a');
        L.push('summary and may be incomplete or already overtaken by events. If you cannot');
        L.push('search, say so in one line at the top, then separate what you are confident');
        L.push('about from what you would want verified.');
        L.push('');
        L.push('STRUCTURE');
        L.push('I am reading this on a phone. Build the answer in layers, heaviest first, so');
        L.push('I can stop at the end of any layer and still have got something whole. Use');
        L.push('these markdown headings exactly, so they render large on a small screen.');
        L.push('');
        L.push('# The gist');
        L.push('An H1 of six to ten words stating the actual point, not the topic. Then two or');
        L.push('three short sentences giving me the whole story in plain words. If I read');
        L.push('nothing else, this is what I walk away knowing. Correct my clipping here if it');
        L.push('is wrong or out of date.');
        L.push('');
        L.push('## Why it matters');
        L.push('Two or three short sentences on the stakes and the second order effects. Be');
        L.push('concrete about who gains, who pays, how much, and by when.');
        L.push('');
        L.push('## How we got here');
        L.push('Only the background I need to follow this story. Not a history lecture.');
        L.push('');
        L.push('## Where it is contested');
        L.push('The strongest disagreement among serious people, put fairly. If it is genuinely');
        L.push('uncontested, say so in one sentence and move on.');
        L.push('');
        L.push('## What to watch');
        L.push('Three bullets, each a specific checkable marker with a rough timeframe.');
        L.push('');
        L.push('## Ask me next');
        L.push('Three numbered questions, ordered by what would teach me the most. I will reply');
        L.push('with a digit.');
        L.push('');
        L.push('READING ON A PHONE');
        L.push('Short paragraphs: three sentences at most, none longer than about sixty words,');
        L.push('with a blank line between them. No tables, no nested bullets, no wall of text.');
        L.push('Around 500 words in total. Hard ceiling 650. Do not pad to reach a length; the');
        L.push('gist and why it matters are worth more than the sections under them.');
        L.push('');
        L.push('VOICE');
        L.push('Financial Times, not an encyclopedia and not a chatbot. Plain, confident,');
        L.push('concrete. Specifics over abstractions: names, numbers, dates, stakes. Every');
        L.push('sentence earns its place. No preamble, no throat clearing, no restating my');
        L.push('prompt back to me, no hedging filler, no em dashes. Where you are uncertain,');
        L.push('mark it in the sentence it applies to rather than in a disclaimer paragraph.');
        return L.join('\n');
      }

      function findStory(id) {
        for (var i = 0; i < data.sections.length; i++) {
          var list = data.sections[i].stories || [];
          for (var j = 0; j < list.length; j++) {
            if (list[j].id === id) {
              return { story: list[j], label: data.sections[i].label };
            }
          }
        }
        return null;
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        // Older iOS standalone PWAs land here.
        return new Promise(function (resolve, reject) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('copy failed'));
        });
      }

      // Tagline reflects the sections the edition actually shipped, not a
      // hardcoded list that can disagree with the paper.
      function taglineText() {
        var labels = data.sections
          .filter(function (s) { return s.id !== 'front'; })
          .map(function (s) { return s.label; });
        return (labels.length ? labels : ['Toronto', 'World', 'Business']).join(' · ');
      }

      function weatherHtml(w) {
        if (!w || !w.icon) return '';
        var week = (w.week || []).map(function (d) {
          return '<div class="day"><div class="d">' + esc(d.day) + '</div>' +
            '<div class="i">' + esc(d.icon) + '</div>' +
            '<div class="hi">' + esc(d.hi) + '°</div>' +
            '<div class="lo">' + esc(d.lo) + '°</div></div>';
        }).join('');
        return '<div class="weather" id="weather" role="button" tabindex="0" ' +
          'aria-expanded="false" aria-label="Toronto weather, tap for the week">' +
          '<div class="summary">' +
            '<span class="ico">' + esc(w.icon) + '</span>' +
            '<span class="city">Toronto</span>' +
            '<span class="temp">' + esc(w.high) + '° / ' + esc(w.low) + '°</span>' +
            '<span class="muted">' + esc(w.condition) + '</span>' +
            '<span class="muted">Rain ' + esc(w.rain) + '</span>' +
            '<span class="muted">Wind ' + esc(w.wind) + '</span>' +
            '<span class="chev" id="wchev">▼</span>' +
          '</div>' +
          '<div class="week" id="wweek" style="display:none">' + week + '</div>' +
        '</div>';
      }

      function tabsHtml() {
        return '<div class="tabs" role="tablist">' + data.sections.map(function (s) {
          var on = s.id === state.active;
          return '<button class="tab' + (on ? ' active' : '') + '" role="tab" ' +
            'aria-selected="' + on + '" data-tab="' + esc(s.id) + '">' + esc(s.label) + '</button>';
        }).join('') + '</div>';
      }

      function cardHtml(st, sectionLabel) {
        var open = st.id === state.openId;
        var tag = st.tag
          ? '<span class="tag ' + (isHotTag(st.tag) ? 'hot' : 'cool') + '">' + esc(st.tag) + '</span>'
          : '';
        var kicker = st.kicker ? '<div class="kicker">' + tag + esc(st.kicker) + '</div>' : '';
        var sub = st.sub ? '<div class="sub">' + esc(st.sub) + '</div>' : '';
        var expand = '';
        if (open) {
          var img = st.image
            ? '<img src="' + esc(st.image) + '" alt="' + esc(st.headline) + '" ' +
              'loading="lazy" onerror="this.remove()" />'
            : '';
          var analysis = st.analysis
            ? '<div class="analysis"><span class="alabel">Why it matters</span>' + esc(st.analysis) + '</div>'
            : '';
          var link = st.link
            ? '<a class="readmore" href="' + esc(st.link) + '" target="_blank" rel="noopener">Read full story →</a>'
            : '';

          // Prefill the destinations at render time so a long press ("open in
          // app") carries the prompt too, instead of us intercepting the tap.
          var q = encodeURIComponent(buildPrompt(st, sectionLabel));
          // No target="_blank" on these two. In a standalone PWA a blank target
          // opens an in-app browser sheet, which iOS will not hand off to an
          // installed app; a plain top-level tap is what lets the Claude and
          // ChatGPT apps claim their own domains as Universal Links. "Read full
          // story" keeps _blank, because a news site does belong in a tab.
          var share = navigator.share
            ? '<button class="ask-opt" data-ai="share" data-id="' + esc(st.id) + '">Share to app…</button>'
            : '';
          var actions = '<div class="actions">' + link +
            '<button class="askai" data-ask="' + esc(st.id) + '" aria-expanded="false" ' +
              'aria-controls="ask-' + esc(st.id) + '">Ask AI ▾</button></div>' +
            '<div class="ask-panel" id="ask-' + esc(st.id) + '">' +
              '<div class="ask-row">' +
                '<a class="ask-opt" href="https://claude.ai/new?q=' + esc(q) + '">Claude</a>' +
                '<a class="ask-opt" href="https://chatgpt.com/?q=' + esc(q) + '">ChatGPT</a>' +
                share +
                '<button class="ask-opt" data-ai="copy" data-id="' + esc(st.id) + '">Copy</button>' +
              '</div>' +
              '<div class="ask-note">Opens in the app if you have it installed. The reply ' +
                'starts with the gist in a few lines, then goes deeper, then offers three ' +
                'follow-up questions.</div>' +
            '</div>';

          expand = '<div class="expand">' + img +
            '<p class="sumtext">' + esc(st.summary) + '</p>' + analysis + actions + '</div>';
        }
        return '<div class="card' + (st.lead ? ' lead' : '') + (open ? ' open' : '') +
          '" data-card="' + esc(st.id) + '" role="button" tabindex="0" ' +
          'aria-expanded="' + open + '">' +
          '<div class="row"><div class="row-main">' + kicker +
            '<div class="headline">' + esc(st.headline) + '</div>' + sub +
            '<div class="time">' + esc(st.time) + '</div></div>' +
            '<div class="toggle" aria-hidden="true">' + (open ? '−' : '+') + '</div>' +
          '</div>' + expand +
        '</div>';
      }

      function storiesInner() {
        var section = data.sections.filter(function (s) { return s.id === state.active; })[0];
        if (!section) return '';
        if (!section.stories || !section.stories.length) {
          return '<div class="empty">Nothing filed for ' + esc(section.label) + ' this morning.</div>';
        }
        return section.stories.map(function (st) {
          return cardHtml(st, section.label);
        }).join('');
      }

      // Quietly flag a saved (not-today) edition served from cache/offline.
      function staleRibbon() {
        try {
          var meta = document.querySelector('meta[name=build]');
          if (!meta) return '';
          var built = new Date(meta.getAttribute('content'));
          if (isNaN(built.getTime())) return '';
          var opt = { timeZone: 'America/Toronto' };
          if (built.toLocaleDateString('en-CA', opt) < new Date().toLocaleDateString('en-CA', opt)) {
            return '<div class="stale">Saved edition · ' + esc(data.date) + '</div>';
          }
        } catch (e) {}
        return '';
      }

      function appHtml() {
        return '<div class="masthead">' +
            '<div class="date">' + esc(data.date) + '</div>' +
            '<div class="title">THE DAILY</div>' +
            '<div class="tagline">' + esc(taglineText()) + '</div>' +
          '</div>' +
          staleRibbon() +
          weatherHtml(data.weather) +
          tabsHtml() +
          '<div class="stories" id="stories">' + storiesInner() + '</div>' +
          '<div class="footer">THE DAILY · TORONTO · Tap any headline to read</div>';
      }

      var app = document.getElementById('app');

      // Rebuild only the stories column; masthead, weather, and tab strip (and
      // their scroll/open state) are left untouched. This is what keeps a tap
      // from resetting the reader's place.
      function refreshStories() {
        document.getElementById('stories').innerHTML = storiesInner();
        bindCards();
      }

      function selectTab(id) {
        if (id === state.active) return;
        state.active = id;
        state.openId = null;
        var tabs = document.querySelectorAll('.tab');
        Array.prototype.forEach.call(tabs, function (t) {
          var on = t.getAttribute('data-tab') === id;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on);
          if (on) t.scrollIntoView({ inline: 'center', block: 'nearest' });
        });
        refreshStories();
        // Start the new section at the top, tab strip stuck under the notch.
        var tabsEl = document.querySelector('.tabs');
        if (tabsEl) window.scrollTo(0, tabsEl.offsetTop);
      }

      function toggleCard(id) {
        var y = window.scrollY;
        state.openId = state.openId === id ? null : id;
        refreshStories();
        window.scrollTo(0, y);   // grow/collapse in place, never jump
      }

      function bindWeather() {
        var weather = document.getElementById('weather');
        if (!weather) return;
        function toggle() {
          var week = document.getElementById('wweek');
          var chev = document.getElementById('wchev');
          var showing = week.style.display !== 'none';
          week.style.display = showing ? 'none' : 'flex';
          chev.textContent = showing ? '▼' : '▲';
          weather.setAttribute('aria-expanded', String(!showing));
        }
        weather.addEventListener('click', toggle);
        weather.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
        });
      }

      function bindTabs() {
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
          btn.addEventListener('click', function () { selectTab(btn.getAttribute('data-tab')); });
        });
      }

      function bindCards() {
        Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
          function activate(ev) {
            // Let links and the Ask AI controls handle their own activation.
            if (ev.target.closest('a, button')) return;
            // While open, only the header row collapses it, so reading (and
            // selecting) the body never closes the story by accident.
            if (card.classList.contains('open') && !ev.target.closest('.row')) return;
            toggleCard(card.getAttribute('data-card'));
          }
          card.addEventListener('click', activate);
          card.addEventListener('keydown', function (ev) {
            if (ev.key !== 'Enter' && ev.key !== ' ') return;
            // Never swallow the key from a control that acts on it itself.
            if (ev.target.closest('a, button')) return;
            ev.preventDefault();
            activate(ev);
          });
          bindAsk(card);
        });
      }

      // Panel state is held in the DOM, not in `state`, so opening the
      // destinations never triggers a stories rebuild and never moves the page.
      function bindAsk(card) {
        var toggle = card.querySelector('.askai');
        if (!toggle) return;
        var panel = card.querySelector('.ask-panel');

        toggle.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var open = panel.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(open));
          toggle.textContent = open ? 'Ask AI ▴' : 'Ask AI ▾';
        });

        Array.prototype.forEach.call(panel.querySelectorAll('[data-ai]'), function (el) {
          var kind = el.getAttribute('data-ai');
          el.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var found = findStory(el.getAttribute('data-id'));
            if (!found) return;
            var prompt = buildPrompt(found.story, found.label);

            if (kind === 'share') {
              navigator.share({ text: prompt }).catch(function () {});
              return;
            }
            var label = el.textContent;
            copyText(prompt).then(function () {
              el.textContent = 'Copied';
            }).catch(function () {
              el.textContent = 'Copy failed';
            }).then(function () {
              setTimeout(function () { el.textContent = label; }, 1800);
            });
          });
        });
      }

      app.innerHTML = appHtml();
      bindWeather();
      bindTabs();
      bindCards();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
