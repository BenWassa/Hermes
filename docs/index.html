  <title>The Daily</title>
  <style>
    /* ---- Design tokens: The Morning Broadsheet ------------------------- */
    :root {
      --paper: #faf8f3;        /* the sheet (warm white, never #fff) */
      --desk: #efece6;         /* the desk beyond the column */
      --ink: #17130d;          /* headlines / primary text */
      --ink-sub: #453f38;      /* standfirsts */
      --ink-muted: #635d54;    /* inactive tabs */
      --meta: #6c665c;         /* timestamps, dateline, footer (>=AA small) */
      --rule: #dcd6cc;         /* hairline between cards */
      --rule-soft: #e3ded4;    /* hairline inside an opened card */
      --navy: #1a2744;         /* structural ink */
      --navy-ink: #1a2744;     /* navy used as text (links, active tab) */
      --red: #8b1a1a;          /* editorial heat */
      --tint-open: #f2ede4;    /* ground of an expanded card */
      --tint-analysis: #ece6da;/* ground of the why-it-matters note */
      --strip-bg: #1a2744;     /* weather strip */
      --strip-ink: #f7f4ee;
      --chip-hot: #8b1a1a;     /* DEVELOPING / WAR-class flags */
      --chip-cool: #1a2744;    /* procedural flags (FINAL, EDITORIAL) */
      --chip-ink: #faf8f3;
      --focus: #1a2744;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151a22;      /* lamplight edition: deep navy-black paper */
        --desk: #0e1219;
        --ink: #e9e3d5;        /* cream ink */
        --ink-sub: #bcb6a8;
        --ink-muted: #948e82;
        --meta: #8f897d;
        --rule: #2a303a;
        --rule-soft: #2f3540;
        --navy: #6f82a8;       /* structure lifted so it reads on dark */
        --navy-ink: #a3b3d2;
        --red: #d1726b;        /* desaturated heat */
        --tint-open: #1b212b;
        --tint-analysis: #20262f;
        --strip-bg: #1b2334;
        --strip-ink: #e9e3d5;
        --chip-hot: #a8443c;
        --chip-cool: #3b4a6c;
        --chip-ink: #f0eadc;
        --focus: #a3b3d2;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 100%; }
    html, body { background: var(--desk); }
    body {
      font-family: 'Georgia', serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--paper);
      max-width: 680px;
      margin: 0 auto;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Masthead */
    .masthead {
      border-bottom: 4px solid var(--navy);
      padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
      background: var(--paper);
    }
    .masthead .date {
      font-size: 0.6875rem; color: var(--meta); letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .masthead .title {
      font-size: 2.375rem; font-weight: 700; letter-spacing: -0.01em;
      color: var(--navy); line-height: 1; margin-bottom: 2px;
    }
    .masthead .tagline {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; color: var(--meta);
      letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* Stale-edition ribbon */
    .stale {
      background: var(--tint-analysis); color: var(--meta);
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; text-align: center;
      padding: 7px 20px;
    }

    /* Weather strip */
    .weather {
      background: var(--strip-bg); color: var(--strip-ink);
      cursor: pointer; user-select: none;
    }
    .weather .summary {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
      min-height: 44px;
    }
    .weather .summary::-webkit-scrollbar { display: none; }
    .weather .ico { font-size: 1.375rem; }
    .weather .city { font-weight: 700; font-size: 0.9375rem; }
    .weather .temp { font-size: 0.9375rem; }
    .weather .muted { opacity: 0.72; font-size: 0.8125rem; white-space: nowrap; }
    .weather .chev { margin-left: auto; opacity: 0.6; font-size: 0.75rem; }
    .weather .week {
      display: flex; border-top: 1px solid rgba(255,255,255,0.12);
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
    }
    .weather .week::-webkit-scrollbar { display: none; }
    .weather .day {
      text-align: center; min-width: 52px; padding: 0 8px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .weather .day .d { font-size: 0.6875rem; opacity: 0.6; margin-bottom: 4px; }
    .weather .day .i { font-size: 1.125rem; }
    .weather .day .hi { font-size: 0.8125rem; font-weight: 700; margin-top: 4px; }
    .weather .day .lo { font-size: 0.6875rem; opacity: 0.5; }

    /* Tab nav */
    .tabs {
      display: flex; overflow-x: auto; border-bottom: 2px solid var(--navy);
      background: var(--paper); scrollbar-width: none;
      position: sticky; top: 0; z-index: 10;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; min-height: 44px; display: flex; align-items: center;
      padding: 0 18px; border: none; background: none; cursor: pointer;
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; font-weight: 700;
      color: var(--ink-muted); border-bottom: 3px solid transparent;
      margin-bottom: -2px; letter-spacing: 0.12em; text-transform: uppercase;
      transition: color 0.15s;
    }
    .tab.active { color: var(--navy-ink); border-bottom-color: var(--navy); }

    /* Stories */
    .stories { padding: 8px 20px 40px; }
    .empty {
      padding: 40px 4px; text-align: center; color: var(--meta);
      font-style: italic; font-size: 0.9375rem;
    }
    .card {
      border-top: 1px solid var(--rule); padding: 14px 0; cursor: pointer;
      background: var(--paper); transition: background 0.15s;
    }
    .card.lead { border-top: 3px solid var(--navy); padding: 20px 0 16px; }
    .card.open { background: var(--tint-open); }
    .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card .row-main { flex: 1; min-width: 0; }
    .card .kicker {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; color: var(--red); margin-bottom: 6px; text-transform: uppercase;
    }
    .card .tag {
      color: var(--chip-ink); padding: 2px 6px; margin-right: 8px;
      font-size: 0.5625rem; border-radius: 2px; vertical-align: 1px;
    }
    .card .tag.hot { background: var(--chip-hot); }
    .card .tag.cool { background: var(--chip-cool); }
    .card .headline {
      font-size: 1.0625rem; font-weight: 700; line-height: 1.25; color: var(--ink); margin-bottom: 6px;
    }
    .card.lead .headline { font-size: 1.375rem; }
    .card .sub {
      font-size: 0.875rem; color: var(--ink-sub); line-height: 1.4; margin-bottom: 4px; font-style: italic;
    }
    .card .time { font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta); margin-top: 4px; }
    .card .toggle { color: var(--navy-ink); opacity: 0.5; font-size: 1.125rem; flex-shrink: 0; margin-top: 2px; }
    .card .expand {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    }
    .card .expand .sumtext {
      font-size: 0.9375rem; color: var(--ink-sub); line-height: 1.7;
    }
    .card .expand img {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      background: var(--tint-open); border-radius: 3px; margin-bottom: 12px;
    }
    .card .analysis {
      margin-top: 12px; padding: 10px 14px; background: var(--tint-analysis);
      font-size: 0.875rem; line-height: 1.6; color: var(--ink-sub); font-style: italic;
    }
    .card .analysis .alabel {
      display: block; font-family: 'Arial', sans-serif; font-style: normal;
      font-size: 0.625rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--navy-ink); margin-bottom: 4px;
    }
    .card .readmore {
      display: inline-block; margin-top: 12px; min-height: 44px; line-height: 44px;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink); text-decoration: none;
    }
    .card .readmore:hover { text-decoration: underline; }
    .card .readmore:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    /* Ask AI: hand the clipping and a briefing prompt to a model */
    .card .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .askai, .card .ask-opt {
      border: none; background: none; padding: 0; cursor: pointer;
      min-height: 44px; line-height: 44px; text-decoration: none;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink);
    }
    .card .askai { margin-top: 12px; }
    .card .askai:hover, .card .ask-opt:hover { text-decoration: underline; }
    .card .askai:focus-visible, .card .ask-opt:focus-visible {
      outline: 2px solid var(--focus); outline-offset: 3px;
    }
    .card .ask-panel { display: none; border-top: 1px solid var(--rule-soft); margin-top: 4px; }
    .card .ask-panel.open { display: block; }
    .card .ask-row { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .ask-note {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.55;
      color: var(--meta); letter-spacing: 0.02em; padding-bottom: 12px;
    }

    /* Footer */
    .footer {
      border-top: 2px solid var(--navy);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta);
      text-align: center; letter-spacing: 0.06em;
    }
    .notice { padding: 40px 20px; text-align: center; color: var(--meta); font-style: italic; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>

ere killed in the early April shooting. Police have now laid charges against three adults and two minors, bringing a significant development to the investigation into the violent incident.", "analysis": "The charges in this double homicide case highlight ongoing concerns about violent crime in the Greater Toronto Area, particularly incidents involving youth and occurring near public spaces like schools. It underscores the challenges law enforcement faces in addressing such complex cases and the community's demand for justice.", "time": "Yesterday", "tag": null, "sensitivity": true, "image": null, "link": "https://www.thestar.com/news/ontario/three-adults-two-youths-charged-in-double-homicide-in-brampton-ont/article_cd5faa3a-c50b-5d99-b718-b7f4550a43ac.html"}, {"id": "t2", "lead": false, "kicker": "LOCAL POLITICS", "headline": "Mike Layton Seeks Return to Toronto City Council", "sub": "Former councillor aims to reclaim his seat after a four-year absence from municipal politics.", "summary": "Mike Layton is seeking to return to Toronto city council, aiming to reclaim the seat he vacated four years ago. Layton stepped away from municipal politics previously, and his bid marks a notable return for a familiar figure in city governance. His campaign will focus on issues relevant to his former ward and the broader city.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/7/19/71936f16-4c28-56a0-8c7a-e427717f8a98/6a83220982604.image.jpg?resize=300%2C200", "link": "https://www.thestar.com/news/ontario/mike-layton-seeks-return-to-toronto-city-council-after-4-year-hiatus/article_5573435f-4767-5ba1-a34c-15cfe30f9d39.html"}, {"id": "t3", "lead": false, "kicker": "HEALTH CANADA", "headline": "Drug for Hot Flashes Approved for Breast Cancer Patients", "sub": "Health Canada authorizes new treatment for moderate to severe hot flashes and night sweats.", "summary": "Health Canada has authorized a new drug to treat moderate to severe hot flashes and night sweats specifically for breast cancer patients. This approval offers a new therapeutic option for individuals undergoing breast cancer treatment who often experience these challenging symptoms. The decision aims to improve the quality of life for many patients.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/0/77/07774d8f-196b-5d95-9ee5-5725916c55b9/6a8328fd16066.image.jpg?resize=300%2C400", "link": "https://www.thestar.com/news/ontario/health-canada-approves-drug-that-treats-hot-flashes-for-use-by-breast-cancer-patients/article_a4aea2af-864f-5de6-966b-2a6c9ce0cace.html"}, {"id": "t4", "lead": false, "kicker": "KAWARTHA LAKES", "headline": "Debris Found from Missing Oshawa Pilot's Plane", "sub": "Rescue crews locate parts of homebuilt aircraft in a lake, but 73-year-old David Douglas remains missing.", "summary": "Rescue crews have located debris from the homebuilt plane of missing Oshawa pilot David Douglas, 73, in a lake near the City of Kawartha Lakes. Despite the discovery of plane parts, Douglas remains missing. Search efforts are ongoing as authorities work to determine the circumstances of the crash and locate the pilot.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": true, "image": null, "link": "https://www.thestar.com/news/gta/oshawa-pilot-still-missing-as-rescue-crews-find-debris-from-homebuilt-plane-in-kawartha-lakes/article_3ee9e5bc-d934-4e12-9ead-401c879b98ba.html"}]}, {"id": "world", "label": "World", "stories": [{"id": "w1", "lead": true, "kicker": "SOUTH KOREA", "headline": "Deadly Landslide in South Korea After Nearly a Metre of Rain", "sub": "Torrential rains in Geoje trigger landslide, killing one and causing power cuts and mass evacuations.", "summary": "The southern South Korean city of Geoje has been deluged by almost a metre of rain, triggering a deadly landslide that killed one person after hitting an apartment building. The torrential downpour has led to widespread power cuts and mass evacuations across the region. Authorities are managing the disaster response amidst ongoing severe weather conditions, with concerns about further damage and casualties.", "analysis": "This severe weather event in South Korea underscores the increasing frequency and intensity of extreme weather patterns globally, likely exacerbated by climate change. The immediate human cost and infrastructure damage highlight the urgent need for robust disaster preparedness and climate resilience strategies in vulnerable regions.", "time": "12:37 AM", "tag": "DISASTER", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/2026/aug/18/south-korea-rain-deadly-landslide-philippines-major-flooding"}, {"id": "w2", "lead": false, "kicker": "JAPAN-RUSSIA", "headline": "Putin's Kuril Islands Visit Reignites 150-Year Dispute with Japan", "sub": "Moscow summons Tokyo's ambassador after Russian President's trip to the disputed islands.", "summary": "A visit by Russian President Putin to the Kuril Islands last week has reignited a 150-year-old territorial dispute between Japan and Russia. Moscow summoned Tokyo's ambassador in response to Japan's protests over the visit. The diplomatic spat continues to simmer, underscoring the long-standing tensions over the strategically important islands.", "analysis": null, "time": "5:19 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/b47be02f2caa74e89a557ddf0d9c3cdb51529c4a/363_0_2894_2315/500.jpg", "link": "https://www.theguardian.com/world/2026/aug/18/kuril-islands-putin-takaichi-dispute-japan-russia-northern-territories"}, {"id": "w3", "lead": false, "kicker": "COLOMBIA", "headline": "Remote Colombian Region Faces Deeper Hardship After Quake", "sub": "Chocó governor warns of 'pain, hunger and homelessness' for survivors; Shakira visits to raise awareness.", "summary": "Chocó, a remote region in Colombia, is facing deeper hardship following last week's earthquake, with its governor warning that 'pain, hunger and homelessness await' survivors. The area, already struggling, is grappling with the aftermath of the disaster. Singer Shakira visited the region to help draw awareness to the plight of its residents and the urgent need for aid.", "analysis": null, "time": "12:01 AM", "tag": "DISASTER", "sensitivity": true, "image": null, "link": "https://www.nytimes.com/2026/08/18/world/americas/colombia-earthquake-choco.html"}, {"id": "w4", "lead": false, "kicker": "US-KOREA", "headline": "Trump's Overture to Kim Jong-un Strains Alliance with South Korea", "sub": "President Trump seeks to curtail military exercises, despite North Korea's belligerence toward the South.", "summary": "President Trump's efforts to curtail military exercises with South Korea, citing them as hostile to North Korea, are straining the alliance between Washington and Seoul. Under Kim Jong-un, North Korea has become increasingly belligerent toward the South, raising concerns in Seoul about the implications of reduced joint military readiness. The move signals a shift in US policy towards the Korean peninsula.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/08/17/multimedia/17int-skorea-trump-promo-ctkj/17int-skorea-trump-promo-ctkj-superJumbo.jpg", "link": "https://www.nytimes.com/2026/08/17/world/asia/trump-korea-military-kim-jong-un.html"}]}, {"id": "sports", "label": "Sports", "stories": [{"id": "s1", "lead": true, "kicker": "AFL", "headline": "Sydney Swans Coach 'Extremely Disappointed' Amid Sexual Assault Allegations", "sub": "Club faces calls to stand down players as Victoria police investigate alleged incident at Melbourne hotel.", "summary": "The Sydney Swans coach has expressed extreme disappointment as the club faces pressure to stand down players linked to alleged sexual assault. Victoria police are investigating an allegation of sexual assault that occurred in the early hours of Monday morning at a Melbourne hotel. The incident has sparked a broader discussion about how such allegations are handled within the sporting community, with concerns raised about the experiences of women being sidelined.", "analysis": "This incident highlights the ongoing challenge for sports organizations in addressing serious allegations against players, balancing legal processes with public and ethical responsibilities. The club's response and any subsequent actions will be closely watched as a test of accountability within professional sports.", "time": "Yesterday", "tag": "DEVELOPING", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/sport/2026/aug/18/sydney-swans-coach-extremely-disappointed-as-club-faces-call-on-standing-down-players-over-alleged-sexual-assault-ntwnfb"}, {"id": "s2", "lead": false, "kicker": "CRICKET", "headline": "Australia Drops Jake Weatherald After Darwin Disaster", "sub": "Opener replaced by Matthew Renshaw in 13-man squad for second Bangladesh Test after poor performance.", "summary": "Australia has dropped opener Jake Weatherald from the squad for the second Bangladesh Test, following his scores of 23 and 0 in the first Test defeat in Darwin. Matthew Renshaw has been drafted into the 13-man squad in his place. The decision reflects a swift response to the team's performance and aims to bolster the batting lineup.", "analysis": null, "time": "5:19 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/4e1086f9a88ae3633f087e705b8fa310b6086de7/688_0_6880_5504/500.jpg", "link": "https://www.theguardian.com/sport/2026/aug/18/australia-test-squad-matt-renshaw-jake-weatherald-bangladesh"}, {"id": "s3", "lead": false, "kicker": "WNBA", "headline": "Tempo Star Marina Mabrey Fumes Over Rogers Wi-Fi Outage", "sub": "Toronto all-star's service failed during a key WNBA game, despite recent technician visit.", "summary": "Toronto Tempo all-star Marina Mabrey is still fuming at Rogers after her Wi-Fi service cut out again at a critical moment during a WNBA game. A technician had recently visited to address previous issues after Mabrey tweeted about the problem. The repeated outage highlights ongoing frustrations with internet service reliability for consumers.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/8/0d/80d9ba22-6409-5847-a6a1-8ceef2255c68/6a83574757295.image.jpg?resize=300%2C200", "link": "https://www.thestar.com/sports/tempo/tempo-star-marina-mabrey-still-fuming-at-rogers-after-her-wi-fi-cuts-out-again--at-the-worst-possible-moment/article_1e85d33c-27b5-4694-a7ad-eceee3b9d83f.html"}, {"id": "s4", "lead": false, "kicker": "NBA", "headline": "NBA Blasts ESPN Over 'Inaccuracies' in Kawhi Leonard Report", "sub": "League refutes claims regarding investigation into alleged Clippers salary cap circumvention.", "summary": "The NBA has criticized ESPN for 'inaccuracies' in its report concerning the investigation into Kawhi Leonard and the Clippers. ESPN's report claimed the NBA could not prove that Steve Ballmer funneled money to Leonard via team sponsorships to bypass the salary cap. The league's rebuke indicates a strong disagreement with the reporting on the high-profile inquiry.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/99da623fca83b071d9dfa81bf378da8a04f5a26c/360_0_3595_2877/500.jpg", "link": "https://www.theguardian.com/sport/2026/aug/17/kawhi-leonard-steve-ballmer-clippers-nba-investigation"}]}, {"id": "business", "label": "Business", "stories": [{"id": "b1", "lead": true, "kicker": "UK ECONOMY", "headline": "Cooling UK Labour Market Questions Need for Rate Hikes; Grocery Inflation Slows", "sub": "Youth unemployment remains high; Brent crude climbs above $91 as US-Iran ceasefire ends.", "summary": "The UK's labour market is showing signs of cooling, prompting questions about the necessity of further Bank of England interest rate hikes. While youth unemployment remains high at 16.2%, overall pay growth has slowed. Concurrently, grocery inflation has decelerated to a two-year low, offering some relief to consumers. However, the economic outlook is complicated by external factors, including Brent crude climbing above $91 a barrel following the end of the US-Iran ceasefire, which could fuel renewed cost of living pressures.", "analysis": "The mixed signals from the UK economy present a dilemma for the Bank of England, balancing inflation control with economic growth. The slowdown in pay and grocery inflation offers some domestic relief, but rising global oil prices due to Middle East tensions could quickly undermine these gains, potentially forcing difficult policy choices.", "time": "8:44 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/6d345a2f8c083aedf4649a4f2032e73fc8e6064d/500_0_5000_4000/500.jpg", "link": "https://www.theguardian.com/business/live/2026/aug/18/oil-prices-rise-us-iran-ceasefire-ends-uk-wage-growth-slows-cost-of-living-squeeze-live-updates"}, {"id": "b2", "lead": false, "kicker": "RETAIL", "headline": "Sports Direct Owner Mike Ashley Tightens Hold on Hugo Boss", "sub": "Frasers Group increases stake in German fashion house to 48% after recent acquisition of Harvey Nichols.", "summary": "Mike Ashley's Frasers Group, owner of Sports Direct, has increased its stake in German fashion house Hugo Boss to 48%. This move follows the group's acquisition of the Harvey Nichols chain last week, further expanding its luxury retail portfolio. The increased stake signals Ashley's growing influence and strategic ambitions within the high-end fashion market.", "analysis": null, "time": "8:49 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/a32c8f23b4e5eedabf8eba11dc2ba4678f69312a/0_0_3114_2492/500.jpg", "link": "https://www.theguardian.com/business/2026/aug/18/sports-direct-mike-ashley-hugo-boss-frasers-group-harvey-nichols"}, {"id": "b3", "lead": false, "kicker": "CHINA ECONOMY", "headline": "China's Economy Shows Signs of Extending Slowdown", "sub": "Industrial output and retail sales slump in July, following one of the country's weakest quarterly growth rates.", "summary": "China's economy is exhibiting further signs that its slowdown may be extending, with industrial output and retail sales slumping in July. This follows one of the country's weakest quarterly growth rates ever, indicating persistent challenges for the world's second-largest economy. The data suggests a difficult period ahead for Beijing's economic planners.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/990f70c7faa98b9a8da40ae06ea211f6b29a631d/1113_0_5439_4352/500.jpg", "link": "https://www.theguardian.com/business/2026/aug/17/china-economy-slowdown-signs-extending"}, {"id": "b4", "lead": false, "kicker": "INDIA", "headline": "India's College Boom Leaves Graduates in Debt, Without Jobs", "sub": "Families' savings on private universities turn into frustration amid a shortage of well-paying work.", "summary": "India's college boom is increasingly leaving graduates burdened with debt and without jobs, as families bet their savings on private universities for a better life. A significant shortage of well-paying work is turning this wager into widespread frustration. The situation highlights a growing crisis in India's education and employment sectors, impacting countless households.", "analysis": null, "time": "12:00 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/08/17/multimedia/Biz-India-Students-01-hzbp/Biz-India-Students-01-hzbp-superJumbo.jpg", "link": "https://www.nytimes.com/2026/08/18/business/india-private-university-debt.html"}]}, {"id": "opinion", "label": "Opinion", "stories": [{"id": "o1", "lead": true, "kicker": "US POLITICS", "headline": "Woke 1.0 is Over, But What Did Progressives Do Wrong?", "sub": "Nesrine Malik argues that while the movement faced backlash, its core principles of safety, dignity, and equality remain vital.", "summary": "Nesrine Malik contends that 'Woke 1.0' has concluded, prompting reflection on what progressives misstepped. While the movement, rooted in safety, dignity, and equality, has been blamed for fueling a right-wing backlash, Malik asserts that many of its underlying principles are still worth preserving and carrying forward. The column explores the internal dynamics and external perceptions that shaped its trajectory and eventual decline in public discourse.", "analysis": "This analysis offers a critical self-assessment of progressive movements, suggesting that while their foundational values are sound, their execution or public perception may have contributed to a backlash. Understanding these dynamics is crucial for future advocacy and for bridging ideological divides in a polarized political landscape.", "time": "7:00 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/66fe43e6a83e7f850181c1547ca1a59399d0c7e6/0_0_5000_4000/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/18/woke-progressives-rightwing-backlash-equality"}, {"id": "o2", "lead": false, "kicker": "CLIMATE POLICY", "headline": "Burnham Choosing Jobs Over Climate Security is a Big Risk", "sub": "Gaby Hinsliff criticizes the Prime Minister's net zero pragmatism as parts of the country face climate impacts.", "summary": "Gaby Hinsliff argues that Prime Minister Burnham's net zero pragmatism, prioritizing jobs, poses a significant risk to climate security. While this approach may appeal to some voters, Hinsliff contends it is an increasingly difficult sell as parts of the country experience the direct impacts of climate change, such as wildfires. The column questions the long-term wisdom of such a trade-off.", "analysis": null, "time": "5:00 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/11ce46680b0159cf5fcdcccc9b41187f6854a5fb/210_0_4573_3659/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/18/andy-burnham-climate-security-net-zero-jobs"}, {"id": "o3", "lead": false, "kicker": "EU POLITICS", "headline": "Far Right Tightening Grip Over EU From the Inside", "sub": "Alberto Alemanno warns centrist coalition is colluding with MEPs from AfD and Marine Le Pen's National Rally.", "summary": "Academic Alberto Alemanno warns that the far right is tightening its grip over the European Union from within, as the traditionally centrist coalition that shapes EU laws is now colluding with MEPs from Germany's AfD and Marine Le Pen's National Rally. This shift signals a concerning trend in European politics, potentially altering the direction of EU policy and values. The collaboration raises questions about the future of the bloc's political landscape.", "analysis": null, "time": "4:00 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/96408e6148078a0ff7fac4830f5ecc30152e8157/0_0_5000_4000/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/18/far-right-grip-eu-centrist-coalition-afd-national-rally"}, {"id": "o4", "lead": false, "kicker": "PUBLIC HEALTH", "headline": "Ebola Kills Thousands in DRC, Perfect Storm Makes Virus Hard to Stop", "sub": "Devi Sridhar highlights new species, regional instability, and decisions in US and Britain costing lives.", "summary": "Devi Sridhar, chair of global public health at the University of Edinburgh, reports that Ebola is killing thousands in the Democratic Republic of Congo, with a 'perfect storm' of factors making the virus hard to stop. New species of the virus and regional instability are contributing, but Sridhar also points to decisions made in the US and Britain as costing lives. The situation underscores the complex challenges in managing global health crises.", "analysis": null, "time": "Yesterday", "tag": "EDITORIAL", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/commentisfree/2026/aug/17/ebola-kills-thousands-drc-perfect-storm-virus"}]}]}</script>

  <script>
    (function () {
      var raw = document.getElementById('edition').textContent;
      var data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<div class="notice">No edition loaded. Run the build to generate today’s paper.</div>';
        return;
      }

      var state = { active: (data.sections[0] || {}).id, openId: null };

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Editorial heat flags keep the red chip; procedural flags cool to navy,
      // so a red chip still means something (the Scarce Red Rule).
      function isHotTag(t) {
        return /^(DEVELOPING|BREAKING|LIVE|WAR|ALERT|URGENT)$/i.test(t || '');
      }

      // ---- Ask AI ----------------------------------------------------------
      // The reader taps one story and gets a briefing, not a chat. The prompt
      // does three jobs: hand over the clipping, name the shape of the answer
      // (five parts, ~500 words, hard ceiling), and set up the follow-up so the
      // conversation continues without the reader having to think of a question.
      // Voice constraints mirror src/config.py HOUSE_VOICE, em dash ban included.
      function buildPrompt(st, sectionLabel) {
        var L = [];
        L.push('I read this in my morning paper and I want to understand it properly.');
        L.push('');
        L.push('THE CLIPPING');
        L.push('Headline: ' + st.headline);
        if (st.sub) L.push('Standfirst: ' + st.sub);
        if (st.summary) L.push('Summary: ' + st.summary);
        if (st.analysis) L.push("My paper's why-it-matters note: " + st.analysis);
        L.push('Section: ' + sectionLabel + '. Filed ' + (st.time || 'this morning') +
               ', edition of ' + data.date + '.');
        if (st.link) L.push('Source: ' + st.link);
        L.push('');
        L.push('WHAT I WANT');
        L.push('A briefing that leaves me genuinely informed, not a restatement of what I just');
        L.push('pasted. Assume I know nothing beyond the clipping above.');
        L.push('');
        L.push('Check current reporting first if you are able to search. My clipping is a');
        L.push('summary and may be incomplete or already overtaken by events. If you cannot');
        L.push('search, say so in one line at the top, then separate what you are confident');
        L.push('about from what you would want verified.');
        L.push('');
        L.push('STRUCTURE');
        L.push('I am reading this on a phone. Build the answer in layers, heaviest first, so');
        L.push('I can stop at the end of any layer and still have got something whole. Use');
        L.push('these markdown headings exactly, so they render large on a small screen.');
        L.push('');
        L.push('# The gist');
        L.push('An H1 of six to ten words stating the actual point, not the topic. Then two or');
        L.push('three short sentences giving me the whole story in plain words. If I read');
        L.push('nothing else, this is what I walk away knowing. Correct my clipping here if it');
        L.push('is wrong or out of date.');
        L.push('');
        L.push('## Why it matters');
        L.push('Two or three short sentences on the stakes and the second order effects. Be');
        L.push('concrete about who gains, who pays, how much, and by when.');
        L.push('');
        L.push('## How we got here');
        L.push('Only the background I need to follow this story. Not a history lecture.');
        L.push('');
        L.push('## Where it is contested');
        L.push('The strongest disagreement among serious people, put fairly. If it is genuinely');
        L.push('uncontested, say so in one sentence and move on.');
        L.push('');
        L.push('## What to watch');
        L.push('Three bullets, each a specific checkable marker with a rough timeframe.');
        L.push('');
        L.push('## Ask me next');
        L.push('Three numbered questions, ordered by what would teach me the most. I will reply');
        L.push('with a digit.');
        L.push('');
        L.push('READING ON A PHONE');
        L.push('Short paragraphs: three sentences at most, none longer than about sixty words,');
        L.push('with a blank line between them. No tables, no nested bullets, no wall of text.');
        L.push('Around 500 words in total. Hard ceiling 650. Do not pad to reach a length; the');
        L.push('gist and why it matters are worth more than the sections under them.');
        L.push('');
        L.push('VOICE');
        L.push('Financial Times, not an encyclopedia and not a chatbot. Plain, confident,');
        L.push('concrete. Specifics over abstractions: names, numbers, dates, stakes. Every');
        L.push('sentence earns its place. No preamble, no throat clearing, no restating my');
        L.push('prompt back to me, no hedging filler, no em dashes. Where you are uncertain,');
        L.push('mark it in the sentence it applies to rather than in a disclaimer paragraph.');
        return L.join('\n');
      }

      function findStory(id) {
        for (var i = 0; i < data.sections.length; i++) {
          var list = data.sections[i].stories || [];
          for (var j = 0; j < list.length; j++) {
            if (list[j].id === id) {
              return { story: list[j], label: data.sections[i].label };
            }
          }
        }
        return null;
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        // Older iOS standalone PWAs land here.
        return new Promise(function (resolve, reject) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('copy failed'));
        });
      }

      // Tagline reflects the sections the edition actually shipped, not a
      // hardcoded list that can disagree with the paper.
      function taglineText() {
        var labels = data.sections
          .filter(function (s) { return s.id !== 'front'; })
          .map(function (s) { return s.label; });
        return (labels.length ? labels : ['Toronto', 'World', 'Business']).join(' · ');
      }

      function weatherHtml(w) {
        if (!w || !w.icon) return '';
        var week = (w.week || []).map(function (d) {
          return '<div class="day"><div class="d">' + esc(d.day) + '</div>' +
            '<div class="i">' + esc(d.icon) + '</div>' +
            '<div class="hi">' + esc(d.hi) + '°</div>' +
            '<div class="lo">' + esc(d.lo) + '°</div></div>';
        }).join('');
        return '<div class="weather" id="weather" role="button" tabindex="0" ' +
          'aria-expanded="false" aria-label="Toronto weather, tap for the week">' +
          '<div class="summary">' +
            '<span class="ico">' + esc(w.icon) + '</span>' +
            '<span class="city">Toronto</span>' +
            '<span class="temp">' + esc(w.high) + '° / ' + esc(w.low) + '°</span>' +
            '<span class="muted">' + esc(w.condition) + '</span>' +
            '<span class="muted">Rain ' + esc(w.rain) + '</span>' +
            '<span class="muted">Wind ' + esc(w.wind) + '</span>' +
            '<span class="chev" id="wchev">▼</span>' +
          '</div>' +
          '<div class="week" id="wweek" style="display:none">' + week + '</div>' +
        '</div>';
      }

      function tabsHtml() {
        return '<div class="tabs" role="tablist">' + data.sections.map(function (s) {
          var on = s.id === state.active;
          return '<button class="tab' + (on ? ' active' : '') + '" role="tab" ' +
            'aria-selected="' + on + '" data-tab="' + esc(s.id) + '">' + esc(s.label) + '</button>';
        }).join('') + '</div>';
      }

      function cardHtml(st, sectionLabel) {
        var open = st.id === state.openId;
        var tag = st.tag
          ? '<span class="tag ' + (isHotTag(st.tag) ? 'hot' : 'cool') + '">' + esc(st.tag) + '</span>'
          : '';
        var kicker = st.kicker ? '<div class="kicker">' + tag + esc(st.kicker) + '</div>' : '';
        var sub = st.sub ? '<div class="sub">' + esc(st.sub) + '</div>' : '';
        var expand = '';
        if (open) {
          var img = st.image
            ? '<img src="' + esc(st.image) + '" alt="' + esc(st.headline) + '" ' +
              'loading="lazy" onerror="this.remove()" />'
            : '';
          var analysis = st.analysis
            ? '<div class="analysis"><span class="alabel">Why it matters</span>' + esc(st.analysis) + '</div>'
            : '';
          var link = st.link
            ? '<a class="readmore" href="' + esc(st.link) + '" target="_blank" rel="noopener">Read full story →</a>'
            : '';

          // Prefill the destinations at render time so a long press ("open in
          // app") carries the prompt too, instead of us intercepting the tap.
          var q = encodeURIComponent(buildPrompt(st, sectionLabel));
          // No target="_blank" on these two. In a standalone PWA a blank target
          // opens an in-app browser sheet, which iOS will not hand off to an
          // installed app; a plain top-level tap is what lets the Claude and
          // ChatGPT apps claim their own domains as Universal Links. "Read full
          // story" keeps _blank, because a news site does belong in a tab.
          var share = navigator.share
            ? '<button class="ask-opt" data-ai="share" data-id="' + esc(st.id) + '">Share to app…</button>'
            : '';
          var actions = '<div class="actions">' + link +
            '<button class="askai" data-ask="' + esc(st.id) + '" aria-expanded="false" ' +
              'aria-controls="ask-' + esc(st.id) + '">Ask AI ▾</button></div>' +
            '<div class="ask-panel" id="ask-' + esc(st.id) + '">' +
              '<div class="ask-row">' +
                '<a class="ask-opt" href="https://claude.ai/new?q=' + esc(q) + '">Claude</a>' +
                '<a class="ask-opt" href="https://chatgpt.com/?q=' + esc(q) + '">ChatGPT</a>' +
                share +
                '<button class="ask-opt" data-ai="copy" data-id="' + esc(st.id) + '">Copy</button>' +
              '</div>' +
              '<div class="ask-note">Opens in the app if you have it installed. The reply ' +
                'starts with the gist in a few lines, then goes deeper, then offers three ' +
                'follow-up questions.</div>' +
            '</div>';

          expand = '<div class="expand">' + img +
            '<p class="sumtext">' + esc(st.summary) + '</p>' + analysis + actions + '</div>';
        }
        return '<div class="card' + (st.lead ? ' lead' : '') + (open ? ' open' : '') +
          '" data-card="' + esc(st.id) + '" role="button" tabindex="0" ' +
          'aria-expanded="' + open + '">' +
          '<div class="row"><div class="row-main">' + kicker +
            '<div class="headline">' + esc(st.headline) + '</div>' + sub +
            '<div class="time">' + esc(st.time) + '</div></div>' +
            '<div class="toggle" aria-hidden="true">' + (open ? '−' : '+') + '</div>' +
          '</div>' + expand +
        '</div>';
      }

      function storiesInner() {
        var section = data.sections.filter(function (s) { return s.id === state.active; })[0];
        if (!section) return '';
        if (!section.stories || !section.stories.length) {
          return '<div class="empty">Nothing filed for ' + esc(section.label) + ' this morning.</div>';
        }
        return section.stories.map(function (st) {
          return cardHtml(st, section.label);
        }).join('');
      }

      // Quietly flag a saved (not-today) edition served from cache/offline.
      function staleRibbon() {
        try {
          var meta = document.querySelector('meta[name=build]');
          if (!meta) return '';
          var built = new Date(meta.getAttribute('content'));
          if (isNaN(built.getTime())) return '';
          var opt = { timeZone: 'America/Toronto' };
          if (built.toLocaleDateString('en-CA', opt) < new Date().toLocaleDateString('en-CA', opt)) {
            return '<div class="stale">Saved edition · ' + esc(data.date) + '</div>';
          }
        } catch (e) {}
        return '';
      }

      function appHtml() {
        return '<div class="masthead">' +
            '<div class="date">' + esc(data.date) + '</div>' +
            '<div class="title">THE DAILY</div>' +
            '<div class="tagline">' + esc(taglineText()) + '</div>' +
          '</div>' +
          staleRibbon() +
          weatherHtml(data.weather) +
          tabsHtml() +
          '<div class="stories" id="stories">' + storiesInner() + '</div>' +
          '<div class="footer">THE DAILY · TORONTO · Tap any headline to read</div>';
      }

      var app = document.getElementById('app');

      // Rebuild only the stories column; masthead, weather, and tab strip (and
      // their scroll/open state) are left untouched. This is what keeps a tap
      // from resetting the reader's place.
      function refreshStories() {
        document.getElementById('stories').innerHTML = storiesInner();
        bindCards();
      }

      function selectTab(id) {
        if (id === state.active) return;
        state.active = id;
        state.openId = null;
        var tabs = document.querySelectorAll('.tab');
        Array.prototype.forEach.call(tabs, function (t) {
          var on = t.getAttribute('data-tab') === id;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on);
          if (on) t.scrollIntoView({ inline: 'center', block: 'nearest' });
        });
        refreshStories();
        // Start the new section at the top, tab strip stuck under the notch.
        var tabsEl = document.querySelector('.tabs');
        if (tabsEl) window.scrollTo(0, tabsEl.offsetTop);
      }

      function toggleCard(id) {
        var y = window.scrollY;
        state.openId = state.openId === id ? null : id;
        refreshStories();
        window.scrollTo(0, y);   // grow/collapse in place, never jump
      }

      function bindWeather() {
        var weather = document.getElementById('weather');
        if (!weather) return;
        function toggle() {
          var week = document.getElementById('wweek');
          var chev = document.getElementById('wchev');
          var showing = week.style.display !== 'none';
          week.style.display = showing ? 'none' : 'flex';
          chev.textContent = showing ? '▼' : '▲';
          weather.setAttribute('aria-expanded', String(!showing));
        }
        weather.addEventListener('click', toggle);
        weather.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
        });
      }

      function bindTabs() {
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
          btn.addEventListener('click', function () { selectTab(btn.getAttribute('data-tab')); });
        });
      }

      function bindCards() {
        Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
          function activate(ev) {
            // Let links and the Ask AI controls handle their own activation.
            if (ev.target.closest('a, button')) return;
            // While open, only the header row collapses it, so reading (and
            // selecting) the body never closes the story by accident.
            if (card.classList.contains('open') && !ev.target.closest('.row')) return;
            toggleCard(card.getAttribute('data-card'));
          }
          card.addEventListener('click', activate);
          card.addEventListener('keydown', function (ev) {
            if (ev.key !== 'Enter' && ev.key !== ' ') return;
            // Never swallow the key from a control that acts on it itself.
            if (ev.target.closest('a, button')) return;
            ev.preventDefault();
            activate(ev);
          });
          bindAsk(card);
        });
      }

      // Panel state is held in the DOM, not in `state`, so opening the
      // destinations never triggers a stories rebuild and never moves the page.
      function bindAsk(card) {
        var toggle = card.querySelector('.askai');
        if (!toggle) return;
        var panel = card.querySelector('.ask-panel');

        toggle.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var open = panel.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(open));
          toggle.textContent = open ? 'Ask AI ▴' : 'Ask AI ▾';
        });

        Array.prototype.forEach.call(panel.querySelectorAll('[data-ai]'), function (el) {
          var kind = el.getAttribute('data-ai');
          el.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var found = findStory(el.getAttribute('data-id'));
            if (!found) return;
            var prompt = buildPrompt(found.story, found.label);

            if (kind === 'share') {
              navigator.share({ text: prompt }).catch(function () {});
              return;
            }
            var label = el.textContent;
            copyText(prompt).then(function () {
              el.textContent = 'Copied';
            }).catch(function () {
              el.textContent = 'Copy failed';
            }).then(function () {
              setTimeout(function () { el.textContent = label; }, 1800);
            });
          });
        });
      }

      app.innerHTML = appHtml();
      bindWeather();
      bindTabs();
      bindCards();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
