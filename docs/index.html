  <title>The Daily</title>
  <style>
    /* ---- Design tokens: The Morning Broadsheet ------------------------- */
    :root {
      --paper: #faf8f3;        /* the sheet (warm white, never #fff) */
      --desk: #efece6;         /* the desk beyond the column */
      --ink: #17130d;          /* headlines / primary text */
      --ink-sub: #453f38;      /* standfirsts */
      --ink-muted: #635d54;    /* inactive tabs */
      --meta: #6c665c;         /* timestamps, dateline, footer (>=AA small) */
      --rule: #dcd6cc;         /* hairline between cards */
      --rule-soft: #e3ded4;    /* hairline inside an opened card */
      --navy: #1a2744;         /* structural ink */
      --navy-ink: #1a2744;     /* navy used as text (links, active tab) */
      --red: #8b1a1a;          /* editorial heat */
      --tint-open: #f2ede4;    /* ground of an expanded card */
      --tint-analysis: #ece6da;/* ground of the why-it-matters note */
      --strip-bg: #1a2744;     /* weather strip */
      --strip-ink: #f7f4ee;
      --chip-hot: #8b1a1a;     /* DEVELOPING / WAR-class flags */
      --chip-cool: #1a2744;    /* procedural flags (FINAL, EDITORIAL) */
      --chip-ink: #faf8f3;
      --focus: #1a2744;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151a22;      /* lamplight edition: deep navy-black paper */
        --desk: #0e1219;
        --ink: #e9e3d5;        /* cream ink */
        --ink-sub: #bcb6a8;
        --ink-muted: #948e82;
        --meta: #8f897d;
        --rule: #2a303a;
        --rule-soft: #2f3540;
        --navy: #6f82a8;       /* structure lifted so it reads on dark */
        --navy-ink: #a3b3d2;
        --red: #d1726b;        /* desaturated heat */
        --tint-open: #1b212b;
        --tint-analysis: #20262f;
        --strip-bg: #1b2334;
        --strip-ink: #e9e3d5;
        --chip-hot: #a8443c;
        --chip-cool: #3b4a6c;
        --chip-ink: #f0eadc;
        --focus: #a3b3d2;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 100%; }
    html, body { background: var(--desk); }
    body {
      font-family: 'Georgia', serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--paper);
      max-width: 680px;
      margin: 0 auto;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Masthead */
    .masthead {
      border-bottom: 4px solid var(--navy);
      padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
      background: var(--paper);
    }
    .masthead .date {
      font-size: 0.6875rem; color: var(--meta); letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .masthead .title {
      font-size: 2.375rem; font-weight: 700; letter-spacing: -0.01em;
      color: var(--navy); line-height: 1; margin-bottom: 2px;
    }
    .masthead .tagline {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; color: var(--meta);
      letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* Stale-edition ribbon */
    .stale {
      background: var(--tint-analysis); color: var(--meta);
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; text-align: center;
      padding: 7px 20px;
    }

    /* Weather strip */
    .weather {
      background: var(--strip-bg); color: var(--strip-ink);
      cursor: pointer; user-select: none;
    }
    .weather .summary {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
      min-height: 44px;
    }
    .weather .summary::-webkit-scrollbar { display: none; }
    .weather .ico { font-size: 1.375rem; }
    .weather .city { font-weight: 700; font-size: 0.9375rem; }
    .weather .temp { font-size: 0.9375rem; }
    .weather .muted { opacity: 0.72; font-size: 0.8125rem; white-space: nowrap; }
    .weather .chev { margin-left: auto; opacity: 0.6; font-size: 0.75rem; }
    .weather .week {
      display: flex; border-top: 1px solid rgba(255,255,255,0.12);
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
    }
    .weather .week::-webkit-scrollbar { display: none; }
    .weather .day {
      text-align: center; min-width: 52px; padding: 0 8px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .weather .day .d { font-size: 0.6875rem; opacity: 0.6; margin-bottom: 4px; }
    .weather .day .i { font-size: 1.125rem; }
    .weather .day .hi { font-size: 0.8125rem; font-weight: 700; margin-top: 4px; }
    .weather .day .lo { font-size: 0.6875rem; opacity: 0.5; }

    /* Tab nav */
    .tabs {
      display: flex; overflow-x: auto; border-bottom: 2px solid var(--navy);
      background: var(--paper); scrollbar-width: none;
      position: sticky; top: 0; z-index: 10;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; min-height: 44px; display: flex; align-items: center;
      padding: 0 18px; border: none; background: none; cursor: pointer;
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; font-weight: 700;
      color: var(--ink-muted); border-bottom: 3px solid transparent;
      margin-bottom: -2px; letter-spacing: 0.12em; text-transform: uppercase;
      transition: color 0.15s;
    }
    .tab.active { color: var(--navy-ink); border-bottom-color: var(--navy); }

    /* Stories */
    .stories { padding: 8px 20px 40px; }
    .empty {
      padding: 40px 4px; text-align: center; color: var(--meta);
      font-style: italic; font-size: 0.9375rem;
    }
    .card {
      border-top: 1px solid var(--rule); padding: 14px 0; cursor: pointer;
      background: var(--paper); transition: background 0.15s;
    }
    .card.lead { border-top: 3px solid var(--navy); padding: 20px 0 16px; }
    .card.open { background: var(--tint-open); }
    .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card .row-main { flex: 1; min-width: 0; }
    .card .kicker {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; color: var(--red); margin-bottom: 6px; text-transform: uppercase;
    }
    .card .tag {
      color: var(--chip-ink); padding: 2px 6px; margin-right: 8px;
      font-size: 0.5625rem; border-radius: 2px; vertical-align: 1px;
    }
    .card .tag.hot { background: var(--chip-hot); }
    .card .tag.cool { background: var(--chip-cool); }
    .card .headline {
      font-size: 1.0625rem; font-weight: 700; line-height: 1.25; color: var(--ink); margin-bottom: 6px;
    }
    .card.lead .headline { font-size: 1.375rem; }
    .card .sub {
      font-size: 0.875rem; color: var(--ink-sub); line-height: 1.4; margin-bottom: 4px; font-style: italic;
    }
    .card .time { font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta); margin-top: 4px; }
    .card .toggle { color: var(--navy-ink); opacity: 0.5; font-size: 1.125rem; flex-shrink: 0; margin-top: 2px; }
    .card .expand {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    }
    .card .expand .sumtext {
      font-size: 0.9375rem; color: var(--ink-sub); line-height: 1.7;
    }
    .card .expand img {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      background: var(--tint-open); border-radius: 3px; margin-bottom: 12px;
    }
    .card .analysis {
      margin-top: 12px; padding: 10px 14px; background: var(--tint-analysis);
      font-size: 0.875rem; line-height: 1.6; color: var(--ink-sub); font-style: italic;
    }
    .card .analysis .alabel {
      display: block; font-family: 'Arial', sans-serif; font-style: normal;
      font-size: 0.625rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--navy-ink); margin-bottom: 4px;
    }
    .card .readmore {
      display: inline-block; margin-top: 12px; min-height: 44px; line-height: 44px;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink); text-decoration: none;
    }
    .card .readmore:hover { text-decoration: underline; }
    .card .readmore:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    /* Ask AI: hand the clipping and a briefing prompt to a model */
    .card .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .askai, .card .ask-opt {
      border: none; background: none; padding: 0; cursor: pointer;
      min-height: 44px; line-height: 44px; text-decoration: none;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink);
    }
    .card .askai { margin-top: 12px; }
    .card .askai:hover, .card .ask-opt:hover { text-decoration: underline; }
    .card .askai:focus-visible, .card .ask-opt:focus-visible {
      outline: 2px solid var(--focus); outline-offset: 3px;
    }
    .card .ask-panel { display: none; border-top: 1px solid var(--rule-soft); margin-top: 4px; }
    .card .ask-panel.open { display: block; }
    .card .ask-row { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .ask-note {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.55;
      color: var(--meta); letter-spacing: 0.02em; padding-bottom: 12px;
    }

    /* Footer */
    .footer {
      border-top: 2px solid var(--navy);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta);
      text-align: center; letter-spacing: 0.06em;
    }
    .notice { padding: 40px 20px; text-align: center; color: var(--meta); font-style: italic; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>

rst quarter and faces ongoing scrutiny over its environmental impact.", "summary": "Fast-fashion retailer Shein has set a cut-price $27 billion valuation for its upcoming Hong Kong initial public offering. The China-based company reported a $99 million loss in its first quarter and continues to face significant scrutiny regarding its environmental footprint and labor practices. This valuation is notably lower than previous estimates, reflecting market caution.", "analysis": null, "time": "8:57 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/a5f2728ff52788c315c073da43cf496d9cf46c65/500_0_5000_4000/500.jpg", "link": "https://www.theguardian.com/business/2026/aug/24/fashion-giant-shein-27bn-valuation-hong-kong-market-debut"}, {"id": "f5", "lead": false, "kicker": "TORONTO", "headline": "Ontario Regulators Take Over Paralegal Firm in 'Sham' Scheme", "sub": "The Law Society of Ontario has seized control of a Newmarket-based firm run by a suspended paralegal.", "summary": "Ontario regulators have taken over the operations of a Toronto-area paralegal accused of running a 'sham' traffic ticket scheme. The Law Society of Ontario seized control of suspended paralegal Adelin Mocanu's Newmarket-based firm. This intervention aims to protect clients and investigate the alleged fraudulent activities.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/b/2b/b2b000cd-cada-5f84-8f82-505da86e2b25/693090a9a03b0.image.jpg?resize=300%2C300", "link": "https://www.thestar.com/news/gta/ontario-regulators-take-over-operations-of-a-toronto-area-paralegal-accused-of-running-sham-traffic-ticket-scheme/article_43eb4769-2c46-4c81-b345-b04ae6f523ee.html"}]}, {"id": "toronto", "label": "Toronto", "stories": [{"id": "t1", "lead": true, "kicker": "STUNT DRIVING", "headline": "Husband Killed by Alleged Stunt Driver, Widow Says Life Can't Move On", "sub": "Preetha Varma lost her husband in a November 2024 car crash that left her with permanent injuries, while the accused continues to drive.", "summary": "Preetha Varma's life remains on hold after her husband was killed in a November 2024 car crash involving an alleged Ontario stunt driver. Varma sustained permanent, life-altering injuries in the incident, yet the accused driver reportedly continues to operate a vehicle. Her poignant statement, \"He was gone, and I was alive,\" underscores the profound impact and ongoing frustration with the legal process.", "analysis": "This story highlights critical issues within Ontario's legal system regarding alleged stunt driving offenses and their impact on victims. The ability of an accused driver in such a serious case to continue driving raises questions about bail conditions, public safety, and the emotional toll on those left behind. It fuels calls for stricter regulations and swifter justice in cases involving dangerous driving.", "time": "5:00 AM", "tag": null, "sensitivity": true, "image": null, "link": "https://www.thestar.com/news/gta/her-husband-was-killed-by-an-alleged-ontario-stunt-driver-her-life-cant-move-on-but-he-keeps-driving/article_618fea38-eb72-4f5e-96aa-a75887979807.html"}, {"id": "t2", "lead": false, "kicker": "TELECOMS", "headline": "Toronto Couple Spends Four Days Trying to Cancel Rogers Service", "sub": "Their recent ordeal highlights a surge in customer complaints about the difficulty of quitting telecom services.", "summary": "A Toronto couple, Sarah Brooks and Nick Williams, endured a four-day ordeal attempting to cancel their Rogers service. Their experience sheds light on a growing industry trend of complaints regarding the difficulty customers face when trying to terminate telecom contracts. Experts note that companies often make the cancellation process intentionally cumbersome.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/3/55/3557c2ad-9479-544f-85bb-d39e0a8be92b/6a88bd813bb20.image.jpg?resize=300%2C200", "link": "https://www.thestar.com/business/this-toronto-couple-spent-4-days-trying-to-cancel-rogers-why-some-telecoms-make-it-so-hard-to-move-on/article_8dbacd0c-bfba-46a4-a965-4c5f8683f645.html"}, {"id": "t3", "lead": false, "kicker": "PUBLIC SAFETY", "headline": "Policing Advocates Push to End Silence on Officer Suicide", "sub": "The call comes after three police officers died by suicide within a single week earlier this month.", "summary": "Policing advocates are urging an end to the silence surrounding officer suicide after three members of Canadian police services died by suicide within a single week earlier this month. The Hamilton Police Service, Durham Regional Police Service, and RCMP each lost a member, prompting renewed calls for greater mental health support and open discussion within law enforcement. Advocates emphasize that it is \"not a disease of the shadows.\"", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": true, "image": null, "link": "https://www.thestar.com/news/gta/policing-advocates-push-to-end-silence-surrounding-officer-suicide-after-3-deaths-in-a-week-its-not-a-disease-of-the-shadows/article_829d5c53-22e1-4a3d-b6be-275b396433b6.html"}, {"id": "t4", "lead": false, "kicker": "GAMING", "headline": "Ontario Dad Deletes Daughter's App Over 'Predatory' In-Game Purchases", "sub": "Experts warn that microtransactions, particularly 'loot boxes,' could serve as a gateway to gambling for children.", "summary": "An Ontario father deleted his daughter's app due to concerns over 'predatory' in-game purchases, specifically microtransactions and 'loot boxes.' Experts are increasingly worried about the design and promotion of these randomized, unpredictable rewards, suggesting they could act as a gateway to gambling for young people. This incident highlights growing parental and expert apprehension about the ethics of modern gaming monetization.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/3/8e/38ec7810-4b10-58e4-b14b-5ee9f2c35aa1/6a88b891e8833.image.jpg?resize=300%2C200", "link": "https://www.thestar.com/news/ontario/an-ontario-dad-deleted-his-daughters-app-over-predatory-in-game-purchases-experts-say-they-could-serve-as-a-gateway-to-gambling/article_8426eaee-f74d-41db-be1c-8151e7704dd1.html"}]}, {"id": "world", "label": "World", "stories": [{"id": "w1", "lead": true, "kicker": "IRAN", "headline": "Iran Warns Gulf States Against Joining Trump's Economic War", "sub": "Iran's national security adviser vowed to prevent \"a single drop of oil\" from leaving the region if sanctions are enforced.", "summary": "Iran's new hard-line national security adviser, Mohsen Rezaei, has issued a stark warning to Gulf states against joining U.S. President Donald Trump's economic war. Rezaei vowed to prevent \"a single drop of oil\" from leaving the region if Gulf nations cooperate with U.S. sanctions. This aggressive stance signals a significant escalation in regional tensions and poses a direct threat to global oil supplies.", "analysis": "Mohsen Rezaei's threat to disrupt oil exports from the Gulf region underscores Iran's willingness to retaliate against economic pressure, potentially destabilizing global energy markets. This move could force Gulf states to choose between U.S. alliances and regional stability, further complicating international efforts to de-escalate tensions in the Middle East. The implications for global oil prices and international shipping are substantial.", "time": "Yesterday", "tag": "WAR", "sensitivity": true, "image": null, "link": "https://www.nytimes.com/2026/08/23/world/europe/iran-economy-war-united-states.html"}, {"id": "w2", "lead": false, "kicker": "INDONESIA", "headline": "Indonesia Battles Intensifying Wildfires Amidst El Niño", "sub": "The unusual weather pattern and dried-out peatlands are contributing to what could be one of the country's worst fire seasons.", "summary": "Indonesia is grappling with intensifying wildfires, exacerbated by the El Niño weather pattern and dried-out peatlands. These conditions are creating one of the country's potentially worst fire seasons, leading to widespread environmental damage and health concerns. The fires highlight the severe impact of climate phenomena on vulnerable ecosystems.", "analysis": null, "time": "12:01 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/08/21/multimedia/00int-indonesia-fires-pbzg/00int-indonesia-fires-pbzg-superJumbo.jpg", "link": "https://www.nytimes.com/2026/08/24/world/asia/indonesia-el-nino-borneo-fire.html"}, {"id": "w3", "lead": false, "kicker": "GERMANY", "headline": "Berlin Scraps Swimming Day for Black Children Amidst Race Row", "sub": "Right-wing voices criticized plans to offer an exclusive afternoon at an outdoor pool in the German capital.", "summary": "Berlin has scrapped plans to offer Black children an exclusive afternoon at an outdoor pool, following criticism from right-wing voices. The decision to cancel the swimming day has become the latest in a series of race-linked pool rows in the German capital. Critics argued against the exclusivity, while supporters lamented the loss of a safe space for children.", "analysis": null, "time": "4:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/08e5d43da04f138f98f9c033bbbf70a054a8e580/688_0_6880_5504/500.jpg", "link": "https://www.theguardian.com/world/2026/aug/24/scrapping-of-berlin-swimming-day-for-black-children-becomes-latest-in-long-list-of-race-linked-pool-rows"}, {"id": "w4", "lead": false, "kicker": "FRANCE", "headline": "Marine Le Pen's Career Resurrected, Posing Greater Threat", "sub": "No longer banned from next year’s presidential election, Le Pen is seen as a more formidable force than her understudy.", "summary": "Marine Le Pen's political career has been resurrected, making her a more significant threat than ever ahead of next year's presidential election. Having been reinstated and no longer banned from running, Le Pen is now considered a far more formidable force than her understudy, Jordan Bardella. This development reshapes the landscape of French politics.", "analysis": null, "time": "4:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/ad9421baa677386c1fb0368518873b99440aecbe/5_0_6541_5233/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/24/marine-le-pen-presidential-election-france"}]}, {"id": "sports", "label": "Sports", "stories": [{"id": "s1", "lead": true, "kicker": "WNBA", "headline": "Men Claiming to Defend Women's Sports Throw Sex Toys at Athletes", "sub": "The latest stunt by grifters at WNBA games exposes the hollowness of their supposed concern for female athletes.", "summary": "Men claiming to defend women's sports have been observed throwing sex toys at female athletes during WNBA games. This latest stunt by individuals described as grifters, who show little genuine interest in basketball, exposes the profound hollowness of their stated concern for women's sports. The incidents have drawn widespread condemnation, highlighting the disrespectful and disruptive nature of their protests.", "analysis": "This incident goes beyond mere protest, revealing a disturbing trend of harassment targeting female athletes under the guise of advocacy. It underscores the challenges women's sports face in gaining legitimate support while combating performative activism that often devolves into misogyny. The WNBA and other leagues may need to implement stricter security measures and policies to protect players from such disruptive and offensive behavior.", "time": "9:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/0c2bf90b25443695c65f9e644bdb730fdb008a9d/456_0_4799_3842/500.jpg", "link": "https://www.theguardian.com/sport/2026/aug/24/the-men-claiming-to-defend-womens-sports-are-throwing-sex-toys-at-female-athletes"}, {"id": "s2", "lead": false, "kicker": "TENNIS", "headline": "Coco Gauff Gears Up for US Open with Cincinnati Title Win", "sub": "The American thoroughly outplayed Jessica Pegula in the final, winning 6-2, 6-4, to close out one of her smoothest tournaments.", "summary": "Coco Gauff has secured the Cincinnati Open title, defeating Jessica Pegula 6-2, 6-4 in a dominant performance. This victory marks one of the smoothest tournaments of her career, positioning the American tennis star strongly as she prepares for the upcoming US Open. Her decisive win demonstrates significant momentum heading into the major championship.", "analysis": null, "time": "4:33 AM", "tag": "FINAL", "sensitivity": false, "image": "https://media.guim.co.uk/3272e091203be3eaa3426c65f1d864aabaa348fd/0_319_1060_848/500.jpg", "link": "https://www.theguardian.com/sport/2026/aug/24/coco-gauff-beats-pegula-wins-cincinnati-open-title"}, {"id": "s3", "lead": false, "kicker": "TENNIS", "headline": "Arthur Fils Claims First Masters Title at Cincinnati Open", "sub": "The 22-year-old Frenchman defeated Frances Tiafoe 6-3, 1-6, 6-0 in the final.", "summary": "Arthur Fils, the 22-year-old Frenchman, has won his first Masters title at the Cincinnati Open. Fils defeated American Frances Tiafoe in the final with a score of 6-3, 1-6, 6-0. This breakthrough victory marks a significant milestone in the young player's career.", "analysis": null, "time": "Yesterday", "tag": "FINAL", "sensitivity": false, "image": "https://media.guim.co.uk/5a32e319e74915580814156b55615d62f2b89592/278_0_2767_2215/500.jpg", "link": "https://www.theguardian.com/sport/2026/aug/23/arthur-fils-masters-frances-tiafoe-cincinnati-tennis"}, {"id": "s4", "lead": false, "kicker": "AFL", "headline": "Banned Sydney Swans Players Not Welcome at Brownlows", "sub": "AFL chief executive Andrew Dillon stated the league will delay its inquiry until a police probe concludes.", "summary": "Banned Sydney Swans players will not be welcome at the Brownlow Medal ceremony, as the AFL delays its inquiry until a police probe concludes. AFL chief executive Andrew Dillon addressed the media, emphasizing, \"the way we treat women says a lot about who we are.\" This decision follows a week of controversy surrounding the club.", "analysis": null, "time": "4:22 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/59610df032b1b9f63b347ee8c822b4288df5b9ed/0_0_4019_3217/500.jpg", "link": "https://www.theguardian.com/sport/2026/aug/24/sydney-swans-players-brownlow-medal-ceremony-afl-ceo-ntwnfb"}]}, {"id": "business", "label": "Business", "stories": [{"id": "b1", "lead": true, "kicker": "FINANCE", "headline": "New Fed Chair Kevin Warsh Faces Critical Test at Jackson Hole", "sub": "Investors hope Warsh offers a 'comfort blanket' at the annual central bank meeting amidst bond market anxiety and inflation fears.", "summary": "New Federal Reserve Chair Kevin Warsh faces a critical test at the annual Jackson Hole meeting of central banks, as inflation fears mount and bond markets remain jumpy. Investors are looking to Warsh to offer a 'comfort blanket' and provide reassurance regarding the U.S. economic outlook. His address will be closely scrutinized for signals on monetary policy and strategies to manage rising prices.", "analysis": "The performance of the new Fed Chair at Jackson Hole is crucial for setting market expectations and calming investor nerves. With inflation concerns and bond market volatility, Warsh's communication will heavily influence perceptions of the Fed's independence and its ability to navigate complex economic challenges. His remarks could dictate market direction for the coming months.", "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/ca5f6a78807e86377007ff59840b9c88fe0ed8ed/461_0_4578_3662/500.jpg", "link": "https://www.theguardian.com/business/2026/aug/24/fed-chair-kevin-warsh-faces-critical-test-jackson-hole-inflation-fears-mount"}, {"id": "b2", "lead": false, "kicker": "EDUCATION", "headline": "How Big Tech Captured American Schools", "sub": "Companies like Google and Microsoft have influenced nearly every step of the education supply chain through money and massive reach.", "summary": "Big Tech companies, including Google and Microsoft, have significantly influenced American schools, effectively capturing nearly every step of the education supply chain. Through substantial financial investment and vast reach, these tech giants have shaped curricula, digital tools, and infrastructure. This pervasive influence raises questions about data privacy, educational independence, and equitable access to technology.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/08/22/business/22Biz-sun-BigTech-schools-TopArt-cover/22Biz-sun-BigTech-schools-TopArt-cover-superJumbo.png", "link": "https://www.nytimes.com/2026/08/23/business/schools-big-tech-google-microsoft.html"}, {"id": "b3", "lead": false, "kicker": "LABOR", "headline": "UK Graduate Job Vacancies Plunge to Lowest in a Decade", "sub": "Only 8,383 jobs for university graduates were advertised in July, according to recruitment website Adzuna.", "summary": "UK graduate job vacancies have plummeted to their lowest level in a decade, with only 8,383 positions advertised in July. Data from recruitment website Adzuna indicates a significant contraction in the entry-level job market for university leavers. This sharp decline signals a challenging environment for new graduates entering the workforce.", "analysis": null, "time": "6:55 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/caf2d18afcf7734fb34f5ab2d565b6469df44bc9/396_0_3335_2668/500.jpg", "link": "https://www.theguardian.com/business/2026/aug/24/uk-graduate-job-vacancies-plunge-adzuna"}, {"id": "b4", "lead": false, "kicker": "RECALL", "headline": "Nearly 40,000 Eye Drop Bottles Recalled Over Contamination Fears", "sub": "Federal regulators announced Clear Eyes Maximum Itchy Eye Relief was voluntarily recalled due to \"lack of assurance of sterility.\"", "summary": "Nearly 40,000 bottles of Clear Eyes Maximum Itchy Eye Relief eye drops have been recalled due to potential contamination. Federal safety regulators announced the voluntary recall by the manufacturer, citing a \"lack of assurance of sterility.\" Consumers are advised to discontinue use immediately to avoid potential health risks.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/08/23/multimedia/23xp-recall-01-zwbt/23xp-recall-01-zwbt-superJumbo.jpg", "link": "https://www.nytimes.com/2026/08/23/health/clear-eyes-eye-drops-fda-recall.html"}]}, {"id": "opinion", "label": "Opinion", "stories": [{"id": "o1", "lead": true, "kicker": "EDITORIAL", "headline": "The Guardian View on Andy Burnham’s Foreign Policy: Work in Progress", "sub": "The Prime Minister has focused on domestic affairs, but global disruption demands a clear definition of Britain’s place in the world.", "summary": "The Guardian editorial board argues that UK Prime Minister Andy Burnham's foreign policy remains a work in progress. While Burnham has prioritized domestic affairs since taking office, the current era of global disruption necessitates a more defined stance on Britain's role in the world. The editorial suggests that his recent visit to Ukraine, where he plans to share missile blueprints, is a step towards articulating a clearer international strategy, but more is needed to address complex global challenges.", "analysis": "This editorial highlights the tension between domestic priorities and international responsibilities for modern leaders. Burnham's evolving foreign policy will be critical in shaping Britain's post-Brexit identity and influence on the global stage, particularly amidst ongoing conflicts and geopolitical shifts. The success of his administration may hinge on its ability to balance internal focus with a coherent and impactful external strategy.", "time": "Yesterday", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/c3fe6b1d7534af1de5c47f7af7047ccd31347175/650_0_6498_5199/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/23/the-guardian-view-on-andy-burnhams-foreign-policy-work-in-progress"}, {"id": "o2", "lead": false, "kicker": "ENERGY POLICY", "headline": "Can Burnham Justify Oil Drilling? Yes, But With Conditions", "sub": "Economist Michael Jacobs argues carbon capture and storage could make the Rosebank site compatible with UK net-zero commitments.", "summary": "Economist Michael Jacobs contends that UK Prime Minister Andy Burnham can justify giving the go-ahead to oil drilling at the Rosebank site, but only under specific conditions. Jacobs argues that carbon capture and storage technology could make the project compatible with the UK's net-zero commitments, provided its owners are willing to bear the necessary costs. This perspective offers a potential pathway for fossil fuel extraction within environmental targets.", "analysis": null, "time": "9:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/85e368bfef213785b04a36de28522587a6540ca8/548_0_4761_3809/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/24/andy-burnham-rosebank-carbon-capture-storage-north-sea-uk-net-zero-commitments"}, {"id": "o3", "lead": false, "kicker": "CULTURE", "headline": "A Music Festival Isn’t a Music Festival Without Children", "sub": "Iman Amrani argues that families add to the magic of events, despite those who claim toddlers spoil the fun.", "summary": "Writer and producer Iman Amrani asserts that a music festival is incomplete without children, challenging the notion that toddlers spoil the fun. Having attended raves with her twins, Amrani argues that families contribute positively to the magic and atmosphere of such events. Her \"hill I will die on\" stance advocates for inclusivity and a broader definition of festival culture.", "analysis": null, "time": "9:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/e2cbd9959f48fcb323b9d32bf7e7997d7cbe2e20/0_3_2490_1991/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/24/the-men-claiming-to-defend-womens-sports-are-throwing-sex-toys-at-female-athletes"}, {"id": "o4", "lead": false, "kicker": "PHILOSOPHY", "headline": "Surviving Desire: What Buddhist Thought Teaches About Our War on Want", "sub": "The work involves meeting desire with curiosity, integrity, and wisdom, rather than fighting what we feel.", "summary": "An opinion piece explores what Buddhist thought teaches about navigating desire, suggesting it's less about fighting what we feel and more about meeting it with curiosity, integrity, and wisdom. The author argues that this approach offers a path to 'surviving desire' and understanding our 'war on want.' This perspective encourages a mindful engagement with our inner experiences.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/4f7d931757e7f5a179ed90f50093a1c7f70c0696/0_0_2500_2000/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/24/what-buddhist-wisdom-teaches-us-about-desire"}]}]}</script>

  <script>
    (function () {
      var raw = document.getElementById('edition').textContent;
      var data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<div class="notice">No edition loaded. Run the build to generate today’s paper.</div>';
        return;
      }

      var state = { active: (data.sections[0] || {}).id, openId: null };

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Editorial heat flags keep the red chip; procedural flags cool to navy,
      // so a red chip still means something (the Scarce Red Rule).
      function isHotTag(t) {
        return /^(DEVELOPING|BREAKING|LIVE|WAR|ALERT|URGENT)$/i.test(t || '');
      }

      // ---- Ask AI ----------------------------------------------------------
      // The reader taps one story and gets a briefing, not a chat. The prompt
      // does three jobs: hand over the clipping, name the shape of the answer
      // (five parts, ~500 words, hard ceiling), and set up the follow-up so the
      // conversation continues without the reader having to think of a question.
      // Voice constraints mirror src/config.py HOUSE_VOICE, em dash ban included.
      function buildPrompt(st, sectionLabel) {
        var L = [];
        L.push('I read this in my morning paper and I want to understand it properly.');
        L.push('');
        L.push('THE CLIPPING');
        L.push('Headline: ' + st.headline);
        if (st.sub) L.push('Standfirst: ' + st.sub);
        if (st.summary) L.push('Summary: ' + st.summary);
        if (st.analysis) L.push("My paper's why-it-matters note: " + st.analysis);
        L.push('Section: ' + sectionLabel + '. Filed ' + (st.time || 'this morning') +
               ', edition of ' + data.date + '.');
        if (st.link) L.push('Source: ' + st.link);
        L.push('');
        L.push('WHAT I WANT');
        L.push('A briefing that leaves me genuinely informed, not a restatement of what I just');
        L.push('pasted. Assume I know nothing beyond the clipping above.');
        L.push('');
        L.push('Check current reporting first if you are able to search. My clipping is a');
        L.push('summary and may be incomplete or already overtaken by events. If you cannot');
        L.push('search, say so in one line at the top, then separate what you are confident');
        L.push('about from what you would want verified.');
        L.push('');
        L.push('STRUCTURE');
        L.push('I am reading this on a phone. Build the answer in layers, heaviest first, so');
        L.push('I can stop at the end of any layer and still have got something whole. Use');
        L.push('these markdown headings exactly, so they render large on a small screen.');
        L.push('');
        L.push('# The gist');
        L.push('An H1 of six to ten words stating the actual point, not the topic. Then two or');
        L.push('three short sentences giving me the whole story in plain words. If I read');
        L.push('nothing else, this is what I walk away knowing. Correct my clipping here if it');
        L.push('is wrong or out of date.');
        L.push('');
        L.push('## Why it matters');
        L.push('Two or three short sentences on the stakes and the second order effects. Be');
        L.push('concrete about who gains, who pays, how much, and by when.');
        L.push('');
        L.push('## How we got here');
        L.push('Only the background I need to follow this story. Not a history lecture.');
        L.push('');
        L.push('## Where it is contested');
        L.push('The strongest disagreement among serious people, put fairly. If it is genuinely');
        L.push('uncontested, say so in one sentence and move on.');
        L.push('');
        L.push('## What to watch');
        L.push('Three bullets, each a specific checkable marker with a rough timeframe.');
        L.push('');
        L.push('## Ask me next');
        L.push('Three numbered questions, ordered by what would teach me the most. I will reply');
        L.push('with a digit.');
        L.push('');
        L.push('READING ON A PHONE');
        L.push('Short paragraphs: three sentences at most, none longer than about sixty words,');
        L.push('with a blank line between them. No tables, no nested bullets, no wall of text.');
        L.push('Around 500 words in total. Hard ceiling 650. Do not pad to reach a length; the');
        L.push('gist and why it matters are worth more than the sections under them.');
        L.push('');
        L.push('VOICE');
        L.push('Financial Times, not an encyclopedia and not a chatbot. Plain, confident,');
        L.push('concrete. Specifics over abstractions: names, numbers, dates, stakes. Every');
        L.push('sentence earns its place. No preamble, no throat clearing, no restating my');
        L.push('prompt back to me, no hedging filler, no em dashes. Where you are uncertain,');
        L.push('mark it in the sentence it applies to rather than in a disclaimer paragraph.');
        return L.join('\n');
      }

      function findStory(id) {
        for (var i = 0; i < data.sections.length; i++) {
          var list = data.sections[i].stories || [];
          for (var j = 0; j < list.length; j++) {
            if (list[j].id === id) {
              return { story: list[j], label: data.sections[i].label };
            }
          }
        }
        return null;
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        // Older iOS standalone PWAs land here.
        return new Promise(function (resolve, reject) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('copy failed'));
        });
      }

      // Tagline reflects the sections the edition actually shipped, not a
      // hardcoded list that can disagree with the paper.
      function taglineText() {
        var labels = data.sections
          .filter(function (s) { return s.id !== 'front'; })
          .map(function (s) { return s.label; });
        return (labels.length ? labels : ['Toronto', 'World', 'Business']).join(' · ');
      }

      function weatherHtml(w) {
        if (!w || !w.icon) return '';
        var week = (w.week || []).map(function (d) {
          return '<div class="day"><div class="d">' + esc(d.day) + '</div>' +
            '<div class="i">' + esc(d.icon) + '</div>' +
            '<div class="hi">' + esc(d.hi) + '°</div>' +
            '<div class="lo">' + esc(d.lo) + '°</div></div>';
        }).join('');
        return '<div class="weather" id="weather" role="button" tabindex="0" ' +
          'aria-expanded="false" aria-label="Toronto weather, tap for the week">' +
          '<div class="summary">' +
            '<span class="ico">' + esc(w.icon) + '</span>' +
            '<span class="city">Toronto</span>' +
            '<span class="temp">' + esc(w.high) + '° / ' + esc(w.low) + '°</span>' +
            '<span class="muted">' + esc(w.condition) + '</span>' +
            '<span class="muted">Rain ' + esc(w.rain) + '</span>' +
            '<span class="muted">Wind ' + esc(w.wind) + '</span>' +
            '<span class="chev" id="wchev">▼</span>' +
          '</div>' +
          '<div class="week" id="wweek" style="display:none">' + week + '</div>' +
        '</div>';
      }

      function tabsHtml() {
        return '<div class="tabs" role="tablist">' + data.sections.map(function (s) {
          var on = s.id === state.active;
          return '<button class="tab' + (on ? ' active' : '') + '" role="tab" ' +
            'aria-selected="' + on + '" data-tab="' + esc(s.id) + '">' + esc(s.label) + '</button>';
        }).join('') + '</div>';
      }

      function cardHtml(st, sectionLabel) {
        var open = st.id === state.openId;
        var tag = st.tag
          ? '<span class="tag ' + (isHotTag(st.tag) ? 'hot' : 'cool') + '">' + esc(st.tag) + '</span>'
          : '';
        var kicker = st.kicker ? '<div class="kicker">' + tag + esc(st.kicker) + '</div>' : '';
        var sub = st.sub ? '<div class="sub">' + esc(st.sub) + '</div>' : '';
        var expand = '';
        if (open) {
          var img = st.image
            ? '<img src="' + esc(st.image) + '" alt="' + esc(st.headline) + '" ' +
              'loading="lazy" onerror="this.remove()" />'
            : '';
          var analysis = st.analysis
            ? '<div class="analysis"><span class="alabel">Why it matters</span>' + esc(st.analysis) + '</div>'
            : '';
          var link = st.link
            ? '<a class="readmore" href="' + esc(st.link) + '" target="_blank" rel="noopener">Read full story →</a>'
            : '';

          // Prefill the destinations at render time so a long press ("open in
          // app") carries the prompt too, instead of us intercepting the tap.
          var q = encodeURIComponent(buildPrompt(st, sectionLabel));
          // No target="_blank" on these two. In a standalone PWA a blank target
          // opens an in-app browser sheet, which iOS will not hand off to an
          // installed app; a plain top-level tap is what lets the Claude and
          // ChatGPT apps claim their own domains as Universal Links. "Read full
          // story" keeps _blank, because a news site does belong in a tab.
          var share = navigator.share
            ? '<button class="ask-opt" data-ai="share" data-id="' + esc(st.id) + '">Share to app…</button>'
            : '';
          var actions = '<div class="actions">' + link +
            '<button class="askai" data-ask="' + esc(st.id) + '" aria-expanded="false" ' +
              'aria-controls="ask-' + esc(st.id) + '">Ask AI ▾</button></div>' +
            '<div class="ask-panel" id="ask-' + esc(st.id) + '">' +
              '<div class="ask-row">' +
                '<a class="ask-opt" href="https://claude.ai/new?q=' + esc(q) + '">Claude</a>' +
                '<a class="ask-opt" href="https://chatgpt.com/?q=' + esc(q) + '">ChatGPT</a>' +
                share +
                '<button class="ask-opt" data-ai="copy" data-id="' + esc(st.id) + '">Copy</button>' +
              '</div>' +
              '<div class="ask-note">Opens in the app if you have it installed. The reply ' +
                'starts with the gist in a few lines, then goes deeper, then offers three ' +
                'follow-up questions.</div>' +
            '</div>';

          expand = '<div class="expand">' + img +
            '<p class="sumtext">' + esc(st.summary) + '</p>' + analysis + actions + '</div>';
        }
        return '<div class="card' + (st.lead ? ' lead' : '') + (open ? ' open' : '') +
          '" data-card="' + esc(st.id) + '" role="button" tabindex="0" ' +
          'aria-expanded="' + open + '">' +
          '<div class="row"><div class="row-main">' + kicker +
            '<div class="headline">' + esc(st.headline) + '</div>' + sub +
            '<div class="time">' + esc(st.time) + '</div></div>' +
            '<div class="toggle" aria-hidden="true">' + (open ? '−' : '+') + '</div>' +
          '</div>' + expand +
        '</div>';
      }

      function storiesInner() {
        var section = data.sections.filter(function (s) { return s.id === state.active; })[0];
        if (!section) return '';
        if (!section.stories || !section.stories.length) {
          return '<div class="empty">Nothing filed for ' + esc(section.label) + ' this morning.</div>';
        }
        return section.stories.map(function (st) {
          return cardHtml(st, section.label);
        }).join('');
      }

      // Quietly flag a saved (not-today) edition served from cache/offline.
      function staleRibbon() {
        try {
          var meta = document.querySelector('meta[name=build]');
          if (!meta) return '';
          var built = new Date(meta.getAttribute('content'));
          if (isNaN(built.getTime())) return '';
          var opt = { timeZone: 'America/Toronto' };
          if (built.toLocaleDateString('en-CA', opt) < new Date().toLocaleDateString('en-CA', opt)) {
            return '<div class="stale">Saved edition · ' + esc(data.date) + '</div>';
          }
        } catch (e) {}
        return '';
      }

      function appHtml() {
        return '<div class="masthead">' +
            '<div class="date">' + esc(data.date) + '</div>' +
            '<div class="title">THE DAILY</div>' +
            '<div class="tagline">' + esc(taglineText()) + '</div>' +
          '</div>' +
          staleRibbon() +
          weatherHtml(data.weather) +
          tabsHtml() +
          '<div class="stories" id="stories">' + storiesInner() + '</div>' +
          '<div class="footer">THE DAILY · TORONTO · Tap any headline to read</div>';
      }

      var app = document.getElementById('app');

      // Rebuild only the stories column; masthead, weather, and tab strip (and
      // their scroll/open state) are left untouched. This is what keeps a tap
      // from resetting the reader's place.
      function refreshStories() {
        document.getElementById('stories').innerHTML = storiesInner();
        bindCards();
      }

      function selectTab(id) {
        if (id === state.active) return;
        state.active = id;
        state.openId = null;
        var tabs = document.querySelectorAll('.tab');
        Array.prototype.forEach.call(tabs, function (t) {
          var on = t.getAttribute('data-tab') === id;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on);
          if (on) t.scrollIntoView({ inline: 'center', block: 'nearest' });
        });
        refreshStories();
        // Start the new section at the top, tab strip stuck under the notch.
        var tabsEl = document.querySelector('.tabs');
        if (tabsEl) window.scrollTo(0, tabsEl.offsetTop);
      }

      function toggleCard(id) {
        var y = window.scrollY;
        state.openId = state.openId === id ? null : id;
        refreshStories();
        window.scrollTo(0, y);   // grow/collapse in place, never jump
      }

      function bindWeather() {
        var weather = document.getElementById('weather');
        if (!weather) return;
        function toggle() {
          var week = document.getElementById('wweek');
          var chev = document.getElementById('wchev');
          var showing = week.style.display !== 'none';
          week.style.display = showing ? 'none' : 'flex';
          chev.textContent = showing ? '▼' : '▲';
          weather.setAttribute('aria-expanded', String(!showing));
        }
        weather.addEventListener('click', toggle);
        weather.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
        });
      }

      function bindTabs() {
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
          btn.addEventListener('click', function () { selectTab(btn.getAttribute('data-tab')); });
        });
      }

      function bindCards() {
        Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
          function activate(ev) {
            // Let links and the Ask AI controls handle their own activation.
            if (ev.target.closest('a, button')) return;
            // While open, only the header row collapses it, so reading (and
            // selecting) the body never closes the story by accident.
            if (card.classList.contains('open') && !ev.target.closest('.row')) return;
            toggleCard(card.getAttribute('data-card'));
          }
          card.addEventListener('click', activate);
          card.addEventListener('keydown', function (ev) {
            if (ev.key !== 'Enter' && ev.key !== ' ') return;
            // Never swallow the key from a control that acts on it itself.
            if (ev.target.closest('a, button')) return;
            ev.preventDefault();
            activate(ev);
          });
          bindAsk(card);
        });
      }

      // Panel state is held in the DOM, not in `state`, so opening the
      // destinations never triggers a stories rebuild and never moves the page.
      function bindAsk(card) {
        var toggle = card.querySelector('.askai');
        if (!toggle) return;
        var panel = card.querySelector('.ask-panel');

        toggle.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var open = panel.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(open));
          toggle.textContent = open ? 'Ask AI ▴' : 'Ask AI ▾';
        });

        Array.prototype.forEach.call(panel.querySelectorAll('[data-ai]'), function (el) {
          var kind = el.getAttribute('data-ai');
          el.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var found = findStory(el.getAttribute('data-id'));
            if (!found) return;
            var prompt = buildPrompt(found.story, found.label);

            if (kind === 'share') {
              navigator.share({ text: prompt }).catch(function () {});
              return;
            }
            var label = el.textContent;
            copyText(prompt).then(function () {
              el.textContent = 'Copied';
            }).catch(function () {
              el.textContent = 'Copy failed';
            }).then(function () {
              setTimeout(function () { el.textContent = label; }, 1800);
            });
          });
        });
      }

      app.innerHTML = appHtml();
      bindWeather();
      bindTabs();
      bindCards();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
