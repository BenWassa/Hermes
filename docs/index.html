  <title>The Daily</title>
  <style>
    /* ---- Design tokens: The Morning Broadsheet ------------------------- */
    :root {
      --paper: #faf8f3;        /* the sheet (warm white, never #fff) */
      --desk: #efece6;         /* the desk beyond the column */
      --ink: #17130d;          /* headlines / primary text */
      --ink-sub: #453f38;      /* standfirsts */
      --ink-muted: #635d54;    /* inactive tabs */
      --meta: #6c665c;         /* timestamps, dateline, footer (>=AA small) */
      --rule: #dcd6cc;         /* hairline between cards */
      --rule-soft: #e3ded4;    /* hairline inside an opened card */
      --navy: #1a2744;         /* structural ink */
      --navy-ink: #1a2744;     /* navy used as text (links, active tab) */
      --red: #8b1a1a;          /* editorial heat */
      --tint-open: #f2ede4;    /* ground of an expanded card */
      --tint-analysis: #ece6da;/* ground of the why-it-matters note */
      --strip-bg: #1a2744;     /* weather strip */
      --strip-ink: #f7f4ee;
      --chip-hot: #8b1a1a;     /* DEVELOPING / WAR-class flags */
      --chip-cool: #1a2744;    /* procedural flags (FINAL, EDITORIAL) */
      --chip-ink: #faf8f3;
      --focus: #1a2744;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151a22;      /* lamplight edition: deep navy-black paper */
        --desk: #0e1219;
        --ink: #e9e3d5;        /* cream ink */
        --ink-sub: #bcb6a8;
        --ink-muted: #948e82;
        --meta: #8f897d;
        --rule: #2a303a;
        --rule-soft: #2f3540;
        --navy: #6f82a8;       /* structure lifted so it reads on dark */
        --navy-ink: #a3b3d2;
        --red: #d1726b;        /* desaturated heat */
        --tint-open: #1b212b;
        --tint-analysis: #20262f;
        --strip-bg: #1b2334;
        --strip-ink: #e9e3d5;
        --chip-hot: #a8443c;
        --chip-cool: #3b4a6c;
        --chip-ink: #f0eadc;
        --focus: #a3b3d2;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 100%; }
    html, body { background: var(--desk); }
    body {
      font-family: 'Georgia', serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--paper);
      max-width: 680px;
      margin: 0 auto;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Masthead */
    .masthead {
      border-bottom: 4px solid var(--navy);
      padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
      background: var(--paper);
    }
    .masthead .date {
      font-size: 0.6875rem; color: var(--meta); letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .masthead .title {
      font-size: 2.375rem; font-weight: 700; letter-spacing: -0.01em;
      color: var(--navy); line-height: 1; margin-bottom: 2px;
    }
    .masthead .tagline {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; color: var(--meta);
      letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* Stale-edition ribbon */
    .stale {
      background: var(--tint-analysis); color: var(--meta);
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; text-align: center;
      padding: 7px 20px;
    }

    /* Weather strip */
    .weather {
      background: var(--strip-bg); color: var(--strip-ink);
      cursor: pointer; user-select: none;
    }
    .weather .summary {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
      min-height: 44px;
    }
    .weather .summary::-webkit-scrollbar { display: none; }
    .weather .ico { font-size: 1.375rem; }
    .weather .city { font-weight: 700; font-size: 0.9375rem; }
    .weather .temp { font-size: 0.9375rem; }
    .weather .muted { opacity: 0.72; font-size: 0.8125rem; white-space: nowrap; }
    .weather .chev { margin-left: auto; opacity: 0.6; font-size: 0.75rem; }
    .weather .week {
      display: flex; border-top: 1px solid rgba(255,255,255,0.12);
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
    }
    .weather .week::-webkit-scrollbar { display: none; }
    .weather .day {
      text-align: center; min-width: 52px; padding: 0 8px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .weather .day .d { font-size: 0.6875rem; opacity: 0.6; margin-bottom: 4px; }
    .weather .day .i { font-size: 1.125rem; }
    .weather .day .hi { font-size: 0.8125rem; font-weight: 700; margin-top: 4px; }
    .weather .day .lo { font-size: 0.6875rem; opacity: 0.5; }

    /* Tab nav */
    .tabs {
      display: flex; overflow-x: auto; border-bottom: 2px solid var(--navy);
      background: var(--paper); scrollbar-width: none;
      position: sticky; top: 0; z-index: 10;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; min-height: 44px; display: flex; align-items: center;
      padding: 0 18px; border: none; background: none; cursor: pointer;
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; font-weight: 700;
      color: var(--ink-muted); border-bottom: 3px solid transparent;
      margin-bottom: -2px; letter-spacing: 0.12em; text-transform: uppercase;
      transition: color 0.15s;
    }
    .tab.active { color: var(--navy-ink); border-bottom-color: var(--navy); }

    /* Stories */
    .stories { padding: 8px 20px 40px; }
    .empty {
      padding: 40px 4px; text-align: center; color: var(--meta);
      font-style: italic; font-size: 0.9375rem;
    }
    .card {
      border-top: 1px solid var(--rule); padding: 14px 0; cursor: pointer;
      background: var(--paper); transition: background 0.15s;
    }
    .card.lead { border-top: 3px solid var(--navy); padding: 20px 0 16px; }
    .card.open { background: var(--tint-open); }
    .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card .row-main { flex: 1; min-width: 0; }
    .card .kicker {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; color: var(--red); margin-bottom: 6px; text-transform: uppercase;
    }
    .card .tag {
      color: var(--chip-ink); padding: 2px 6px; margin-right: 8px;
      font-size: 0.5625rem; border-radius: 2px; vertical-align: 1px;
    }
    .card .tag.hot { background: var(--chip-hot); }
    .card .tag.cool { background: var(--chip-cool); }
    .card .headline {
      font-size: 1.0625rem; font-weight: 700; line-height: 1.25; color: var(--ink); margin-bottom: 6px;
    }
    .card.lead .headline { font-size: 1.375rem; }
    .card .sub {
      font-size: 0.875rem; color: var(--ink-sub); line-height: 1.4; margin-bottom: 4px; font-style: italic;
    }
    .card .time { font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta); margin-top: 4px; }
    .card .toggle { color: var(--navy-ink); opacity: 0.5; font-size: 1.125rem; flex-shrink: 0; margin-top: 2px; }
    .card .expand {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    }
    .card .expand .sumtext {
      font-size: 0.9375rem; color: var(--ink-sub); line-height: 1.7;
    }
    .card .expand img {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      background: var(--tint-open); border-radius: 3px; margin-bottom: 12px;
    }
    .card .analysis {
      margin-top: 12px; padding: 10px 14px; background: var(--tint-analysis);
      font-size: 0.875rem; line-height: 1.6; color: var(--ink-sub); font-style: italic;
    }
    .card .analysis .alabel {
      display: block; font-family: 'Arial', sans-serif; font-style: normal;
      font-size: 0.625rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--navy-ink); margin-bottom: 4px;
    }
    .card .readmore {
      display: inline-block; margin-top: 12px; min-height: 44px; line-height: 44px;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink); text-decoration: none;
    }
    .card .readmore:hover { text-decoration: underline; }
    .card .readmore:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    /* Ask AI: hand the clipping and a briefing prompt to a model */
    .card .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .askai, .card .ask-opt {
      border: none; background: none; padding: 0; cursor: pointer;
      min-height: 44px; line-height: 44px; text-decoration: none;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink);
    }
    .card .askai { margin-top: 12px; }
    .card .askai:hover, .card .ask-opt:hover { text-decoration: underline; }
    .card .askai:focus-visible, .card .ask-opt:focus-visible {
      outline: 2px solid var(--focus); outline-offset: 3px;
    }
    .card .ask-panel { display: none; border-top: 1px solid var(--rule-soft); margin-top: 4px; }
    .card .ask-panel.open { display: block; }
    .card .ask-row { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .ask-note {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.55;
      color: var(--meta); letter-spacing: 0.02em; padding-bottom: 12px;
    }

    /* Footer */
    .footer {
      border-top: 2px solid var(--navy);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta);
      text-align: center; letter-spacing: 0.06em;
    }
    .notice { padding: 40px 20px; text-align: center; color: var(--meta); font-style: italic; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>

nfrastructure.", "summary": "Ontario's Court of Appeal has ruled in favour of Premier Doug Ford's government, affirming its right to remove Toronto's main downtown bike lanes. The decision overturns a lower court ruling and clears the way for the province to proceed with the controversial plan. Premier Ford has long argued that protected bike lanes contribute to traffic congestion in the city.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/7/ba/7baf66a3-6de3-5be2-a546-37073e5414e7/6a7de20a184b5.image.jpg?resize=300%2C222", "link": "https://www.thestar.com/news/gta/doug-ford-wins-major-court-battle-to-strip-toronto-of-its-main-downtown-bike-lanes/article_0da549f1-658b-4f93-b3aa-0dcd7f9273a8.html"}, {"id": "f3", "lead": false, "kicker": "AFGHANISTAN", "headline": "Taliban Marks Five Years in Power Amidst Growing Global Engagement", "sub": "The group celebrates its entrenched control, but international concerns persist over human rights and stability.", "summary": "The Taliban is celebrating five years since returning to power in Afghanistan, solidifying its grip on the nation. Despite the group's efforts to project stability, international campaigners express growing concern that deeper diplomatic ties with the Taliban are undermining demands for improvements in human rights, particularly for women. Threats to the regime's veneer of control are also beginning to emerge.", "analysis": null, "time": "12:01 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/08/15/multimedia/15int-afghanistan-anniversary-new-tmjv/15int-afghanistan-anniversary-new-tmjv-superJumbo.jpg", "link": "https://www.nytimes.com/2026/08/15/world/asia/entrenched-embattled-and-defiant-the-taliban-celebrate-5-years-in-power.html"}, {"id": "f4", "lead": false, "kicker": "BUSINESS", "headline": "US Long-Term Borrowing Costs Hit 25-Year High", "sub": "Sale of 30-year bonds at highest rates since 2001 signals rising concerns about inflation and fiscal policy.", "summary": "US long-term borrowing costs have reached a 25-year high, with the sale of 30-year bonds at their highest rates since 2001. This surge reflects growing market concerns about persistent inflation and the nation's fiscal trajectory. The weakening of the UK's electric vehicle sales targets was also criticized amidst the economic news.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/75f0ac0718a593c9328bde9a35dbb0066175ba38/604_0_6037_4832/500.jpg", "link": "https://www.theguardian.com/business/live/2026/aug/14/us-long-term-borrowing-25-year-high-trump-aviva-eurozone-economy-stock-markets-live-news-updates"}, {"id": "f5", "lead": false, "kicker": "UKRAINE", "headline": "Zelenskyy Warns Egypt of Black Sea Food Supply Threat", "sub": "Russian strikes in the Black Sea jeopardize vital grain exports, impacting global food security.", "summary": "Ukrainian President Volodymyr Zelenskyy has warned Egypt that Russian strikes in the Black Sea pose a significant threat to food supplies. He stated that exports to Egypt are particularly vulnerable to ongoing Russian attacks, which Russia has dismissed as unrelated to a Black Sea ceasefire. The conflict continues to disrupt critical shipping routes and global food security.", "analysis": null, "time": "1:53 AM", "tag": "WAR", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/2026/aug/15/ukraine-war-briefing-zelenskyy-warns-egypt-of-food-supply-threat-caused-by-russian-strikes-in-black-sea"}]}, {"id": "toronto", "label": "Toronto", "stories": [{"id": "t1", "lead": true, "kicker": "MARKHAM INDY", "headline": "First Day of Ontario Honda Dealers Indy Cancelled Due to Incomplete Track", "sub": "Practice and qualifying sessions called off in Markham as organizers struggle to complete the circuit.", "summary": "The inaugural day of the Ontario Honda Dealers Indy in Markham was cancelled Friday due to an incomplete track, forcing the postponement of practice and qualifying sessions. This marks a significant setback for the only IndyCar event in Canada. Despite the delays, local seniors living near the new circuit express excitement for the race, which will pass by their retirement home for the first time in 40 years.", "analysis": "The cancellation highlights logistical challenges in bringing a major racing event to a new urban setting, potentially impacting future events and local enthusiasm. While residents are eager, the incident raises questions about planning and execution for large-scale public events in the GTA.", "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/c/f6/cf63ef07-7a59-55d3-b0db-99f3ee1946ff/6a7f96ecc83ee.image.jpg?resize=300%2C200", "link": "https://www.thestar.com/news/gta/track-preparation-problems-delay-practice-at-ontario-honda-dealers-indy-in-markham/article_0c826ce8-33f8-583f-9cf7-ad5caf7aed91.html"}, {"id": "t2", "lead": false, "kicker": "CAMPUS CLIMATE", "headline": "TMU Report Urges Action on Intimidation, Discrimination Amidst Israel-Palestinian Tensions", "sub": "Comprehensive review outlines recommendations for addressing a 'deeply polarized campus environment'.", "summary": "A 192-page report on Toronto Metropolitan University's handling of Israel-Palestinian tensions recommends the school tackle intimidation and discrimination. The report outlines numerous recommendations to address what it describes as a \"deeply polarized campus environment.\" The findings aim to guide the university in fostering a more inclusive and respectful atmosphere for all students and staff.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/1/05/10547cf5-25cc-50db-85d4-40a6cd4477e9/69ea612e7b868.image.jpg?resize=300%2C207", "link": "https://www.thestar.com/news/gta/tmu-struggled-to-police-campus-protests-over-middle-east-tensions-a-report-found-here-is-what-it-says-needs-to-change/article_641ea556-c83c-40f7-b136-4c9a62d3245e.html"}, {"id": "t3", "lead": false, "kicker": "PUBLIC SAFETY", "headline": "TTC Worker Stabbed in Yorkville, Suspect Sought", "sub": "Employee recovering after 'unprovoked attack'; police investigating and searching for assailant.", "summary": "A TTC worker was stabbed in an \"unprovoked attack\" in Yorkville on Friday morning, with police actively searching for a suspect. The employee has been released from hospital and is recovering at home. Authorities state the worker and assailant did not know each other, raising concerns about random acts of violence on public transit.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": true, "image": null, "link": "https://www.thestar.com/news/gta/ttc-worker-stabbed-in-unprovoked-attack-in-yorkville-suspect-sought-by-police/article_d932edc0-c330-4fc3-8f1d-4cf48b49efa6.html"}, {"id": "t4", "lead": false, "kicker": "HEALTHCARE", "headline": "Homeless Patients Stuck in Hospitals Due to Lack of Discharge Options", "sub": "Study reveals homeless individuals in Ontario are 4.5 times more likely to remain hospitalized after medical clearance.", "summary": "A new study reveals that homeless individuals in Ontario are 4.5 times more likely to remain in hospital beds after they are medically cleared for discharge, due to a lack of suitable housing options. This issue creates significant strain on the healthcare system and highlights a critical gap in support for vulnerable populations. Plans are being explored to address this systemic problem.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/2/de/2dea8804-6c72-5cd7-9bb3-c6c4e34dfb22/6a7e285baa382.image.jpg?resize=300%2C193", "link": "https://www.thestar.com/news/gta/theyre-well-enough-to-leave-but-have-nowhere-to-go-why-homeless-patients-get-stuck-in-hospital--and-one-plan-to-help-fix-it/article_10e2adf9-3faa-4e5b-9374-a794d41a0918.html"}]}, {"id": "world", "label": "World", "stories": [{"id": "w1", "lead": true, "kicker": "EUROPE", "headline": "Wildfires Rage Across Europe, Hundreds Arrested for Arson", "sub": "Extreme heat fuels blazes in France, Croatia, Germany, Greece, and Spain; emergency alerts issued in UK.", "summary": "Wildfires are raging across Europe, exacerbated by extreme heat, leading to hundreds of arrests on suspicion of arson in France alone. One person has died and hundreds evacuated in Croatia, with blazes also impacting Germany, Greece, and Spain. In England and Wales, emergency alerts were sent to phones urging people to avoid lighting barbecues or campfires to prevent further outbreaks, as a lethal lack of readiness for heatwaves is exposed in countries like Belgium.", "analysis": "The widespread fires and heat-related deaths underscore Europe's escalating climate crisis and the urgent need for robust prevention and response strategies. The arrests for arson suggest a human element compounding natural disaster, adding complexity to mitigation efforts.", "time": "Yesterday", "tag": "CLIMATE", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/2026/aug/14/arrested-suspicion-starting-wildfires-europe-france"}, {"id": "w2", "lead": false, "kicker": "MIDDLE EAST", "headline": "Israel Plans to Transfer West Bank Law Enforcement to Police", "sub": "Palestine's vice-president condemns move as 'flagrant violation of international law' and step toward annexation.", "summary": "The Israeli military plans to transfer law enforcement responsibilities in the occupied West Bank to the Israeli police. Palestine's vice-president has condemned the move as a \"flagrant violation of international law\" and a step towards full Israeli annexation of the territory. The decision is expected to escalate tensions and draw international criticism.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/b3ca7d7b89c8fea93d13e3268882fcc9a706ce5d/912_0_4560_3648/500.jpg", "link": "https://www.theguardian.com/world/2026/aug/14/israeli-military-plans-transfer-law-enforcement-in-occupied-west-bank-to-police"}, {"id": "w3", "lead": false, "kicker": "FRANCE", "headline": "French Court Blocks Macron's Social Media Ban for Under-15s", "sub": "Constitutional council cites freedom of expression and privacy concerns; president vows to rework legislation.", "summary": "A French constitutional court has blocked President Emmanuel Macron's proposed ban on social media for children under 15. The council ruled that the curbs infringe upon freedom of expression and privacy rights. President Macron has vowed to rework the legislation, indicating continued efforts to regulate youth access to online platforms.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/37d9d05fd3b13992e53c2a7f0210f723e9bc0a54/92_0_2500_2000/500.jpg", "link": "https://www.theguardian.com/world/2026/aug/14/french-court-blocks-macron-social-media-ban-under-15s"}, {"id": "w4", "lead": false, "kicker": "CANADA", "headline": "Canadian Plasma Clinics Pause Collections After Two Donor Deaths", "sub": "Grifols halts donations at private chain following new government investigation into fatalities.", "summary": "Canadian plasma clinics operated by Grifols have temporarily paused collections following the deaths of two donors. The decision comes amidst a new government investigation into the fatalities. The private chain of clinics will cease taking donations while authorities examine the circumstances surrounding the deaths.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/2026/aug/14/canadian-plasma-clinics-pause-collections-after-deaths-of-donors-grifols"}]}, {"id": "sports", "label": "Sports", "stories": [{"id": "s1", "lead": true, "kicker": "CYCLING", "headline": "British Cyclist Finlay Tarling, 19, Dies in Volta a Portugal Accident", "sub": "Tragedy strikes as young NSN Development Team rider crashes during eighth stage of Tour of Portugal.", "summary": "British cyclist Finlay Tarling, a 19-year-old rider for the NSN Development Team, has tragically died in a crash during the eighth stage of the Tour of Portugal. The incident occurred during a competitive segment of the race, sending shockwaves through the international cycling community. Details surrounding the accident are still emerging, and investigations are underway.", "analysis": "The death of a promising young athlete casts a somber shadow over professional cycling, prompting renewed scrutiny of safety protocols in high-speed, demanding races. It serves as a stark reminder of the inherent risks faced by competitors in the sport.", "time": "Yesterday", "tag": "TRAGEDY", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/sport/2026/aug/14/british-cyclist-finlay-tarling-19-dies-in-volta-a-portugal-accident"}, {"id": "s2", "lead": false, "kicker": "CRICKET", "headline": "Australia on the Ropes Against Bangladesh in First Test, Day Three", "sub": "Bangladesh leads by 67 runs with six Australian wickets remaining at Marrara Cricket Ground.", "summary": "Australia is struggling in the first men's Test against Bangladesh, trailing by 67 runs with only six wickets in hand at the close of day three at Marrara Cricket Ground. Bangladesh has put Australia under significant pressure, setting up a tense final two days of play. The match outcome remains uncertain as Australia fights to avoid defeat.", "analysis": null, "time": "8:10 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/ed4 , "image": null, "link": "https://www.theguardian.com/business/2026/aug/14/ryanair-engine-parts-shattered-window-passenger-partly-sucked-out-of-report"}, {"id": "b3", "lead": false, "kicker": "RETAIL", "headline": "Sports Direct Owner Mike Ashley Acquires Harvey Nichols", "sub": "Frasers Group secures majority of upmarket retailer's sites from administrators.", "summary": "Mike Ashley, owner of Sports Direct, has acquired Harvey Nichols through his Frasers Group, securing a majority of the upmarket retailer's sites from administrators. This acquisition marks a significant expansion for Frasers Group into the luxury retail sector. The move aims to revitalize the struggling department store chain under new ownership.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/77bc5f6192b847b4060c21500d28282f13732a96/203_0_5093_4074/500.jpg", "link": "https://www.theguardian.com/business/2026/aug/13/sports-direct-owner-buys-harvey-nichols-department-store-chain"}, {"id": "b4", "lead": false, "kicker": "FOOD SAFETY", "headline": "FDA Classifies Egg Recall as Class I, Highest Health Risk", "sub": "Nearly 20 million eggs recalled in July over salmonella concerns now deemed to pose 'serious adverse health consequences or death'.", "summary": "The FDA has classified a July egg recall, involving nearly 20 million eggs due to salmonella concerns, as Class I, indicating the highest health risk. This classification signals a \"reasonable probability\" of \"serious adverse health consequences or death\" from consuming the contaminated products. Consumers are urged to check their eggs and dispose of any affected batches immediately.", "analysis": null, "time": "Yesterday", "tag": "RECALL", "sensitivity": true, "image": null, "link": "https://www.nytimes.com/2026/08/14/health/fda-egg-recall-salmonella.html"}]}, {"id": "opinion", "label": "Opinion", "stories": [{"id": "o1", "lead": true, "kicker": "UK POLITICS", "headline": "Clacton Cannot Acquit Nigel Farage, Scrutiny Continues", "sub": "The Guardian Editorial argues Reform's byelection win does not absolve Farage as the party attacks watchdogs and journalists.", "summary": "The Guardian's editorial asserts that Nigel Farage's byelection victory in Clacton for Reform UK does not acquit him of ongoing scrutiny. While Reform secured a contrived win, the editorial highlights the party's increasing attacks on watchdogs and journalists who ask difficult questions. It argues that the public should remain vigilant about the party's actions and rhetoric, despite its electoral success.", "analysis": "This editorial reflects a broader concern within the media about the rise of populist figures who challenge established institutions and norms. It suggests that electoral success does not automatically grant moral authority or immunity from critical examination, especially when democratic checks and balances are targeted.", "time": "Yesterday", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/7febc7696c1b4fa3fe5a70ff8a7994248c6ac2f3/394_0_3924_3141/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/14/the-guardian-view-on-nigel-farage-clacton-cannot-acquit-him"}, {"id": "o2", "lead": false, "kicker": "US POLITICS", "headline": "Trump's Spying on Left-Wing Groups Recalls J. Edgar Hoover's Cointelpro", "sub": "Ken Roth argues the Trump administration is repeating sordid practices of infiltrating and discrediting leftist organizations.", "summary": "Ken Roth, a Guardian columnist, argues that the Trump administration's alleged spying on left-wing groups mirrors J. Edgar Hoover's Cointelpro program. Roth states that the FBI, from the 1950s to the 1970s, sought to infiltrate and discredit leftist organizations, a practice he believes Trump is now repeating. This comparison raises concerns about civil liberties and government overreach.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/8c80a52fd049cf450f961a1d2fbcee9a9981438a/614_0_5000_4000/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/14/trump-administration-investigate-progressive-groups"}, {"id": "o3", "lead": false, "kicker": "AFGHANISTAN", "headline": "Guilt Talking to Those Left Behind in Afghanistan, Says Journalist", "sub": "Nelufar Hedayat reflects on the 'merciless and suffocating' life for women five years after Taliban's return.", "summary": "Afghan-British journalist Nelufar Hedayat expresses profound guilt when speaking with those still in Afghanistan, particularly women, five years after the Taliban's return to power. She describes life under the regime as \"merciless and suffocating,\" highlighting the stark contrast with her own freedom. Her commentary underscores the ongoing human rights crisis and the emotional toll on the Afghan diaspora.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/3146a393b1d50fbf8829db44f8700873c37a63ef/8_0_3442_2753/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/aug/15/guilt-afghanistan-freedom-prisoners-taliban"}, {"id": "o4", "lead": false, "kicker": "UKRAINE WAR", "headline": "Patriot Missiles for Ukraine Running Out, Kyiv Needs Help Fast", "sub": "Jack Watling warns Europe and NATO of looming disaster as interceptor production lags demand.", "summary": "Jack Watling, a senior research fellow at the Royal United Services Institute, warns that Ukraine's Patriot missiles are running out, creating an urgent need for more international assistance. He states that Europe and NATO have known for years that interceptor production cannot keep pace with demand, and a disaster now looms for Kyiv. The dwindling supply jeopardizes Ukraine's air defense capabilities against Russian aggression.", "analysis": null, "time": "Yesterday", "tag": "WAR", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/commentisfree/2026/aug/14/patriot-missiles-ukraine-putin-kyiv-running-out-nato-danger"}]}]}</script>

  <script>
    (function () {
      var raw = document.getElementById('edition').textContent;
      var data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<div class="notice">No edition loaded. Run the build to generate today’s paper.</div>';
        return;
      }

      var state = { active: (data.sections[0] || {}).id, openId: null };

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Editorial heat flags keep the red chip; procedural flags cool to navy,
      // so a red chip still means something (the Scarce Red Rule).
      function isHotTag(t) {
        return /^(DEVELOPING|BREAKING|LIVE|WAR|ALERT|URGENT)$/i.test(t || '');
      }

      // ---- Ask AI ----------------------------------------------------------
      // The reader taps one story and gets a briefing, not a chat. The prompt
      // does three jobs: hand over the clipping, name the shape of the answer
      // (five parts, ~500 words, hard ceiling), and set up the follow-up so the
      // conversation continues without the reader having to think of a question.
      // Voice constraints mirror src/config.py HOUSE_VOICE, em dash ban included.
      function buildPrompt(st, sectionLabel) {
        var L = [];
        L.push('I read this in my morning paper and I want to understand it properly.');
        L.push('');
        L.push('THE CLIPPING');
        L.push('Headline: ' + st.headline);
        if (st.sub) L.push('Standfirst: ' + st.sub);
        if (st.summary) L.push('Summary: ' + st.summary);
        if (st.analysis) L.push("My paper's why-it-matters note: " + st.analysis);
        L.push('Section: ' + sectionLabel + '. Filed ' + (st.time || 'this morning') +
               ', edition of ' + data.date + '.');
        if (st.link) L.push('Source: ' + st.link);
        L.push('');
        L.push('WHAT I WANT');
        L.push('A briefing that leaves me genuinely informed, not a restatement of what I just');
        L.push('pasted. Assume I know nothing beyond the clipping above.');
        L.push('');
        L.push('Check current reporting first if you are able to search. My clipping is a');
        L.push('summary and may be incomplete or already overtaken by events. If you cannot');
        L.push('search, say so in one line at the top, then separate what you are confident');
        L.push('about from what you would want verified.');
        L.push('');
        L.push('STRUCTURE');
        L.push('I am reading this on a phone. Build the answer in layers, heaviest first, so');
        L.push('I can stop at the end of any layer and still have got something whole. Use');
        L.push('these markdown headings exactly, so they render large on a small screen.');
        L.push('');
        L.push('# The gist');
        L.push('An H1 of six to ten words stating the actual point, not the topic. Then two or');
        L.push('three short sentences giving me the whole story in plain words. If I read');
        L.push('nothing else, this is what I walk away knowing. Correct my clipping here if it');
        L.push('is wrong or out of date.');
        L.push('');
        L.push('## Why it matters');
        L.push('Two or three short sentences on the stakes and the second order effects. Be');
        L.push('concrete about who gains, who pays, how much, and by when.');
        L.push('');
        L.push('## How we got here');
        L.push('Only the background I need to follow this story. Not a history lecture.');
        L.push('');
        L.push('## Where it is contested');
        L.push('The strongest disagreement among serious people, put fairly. If it is genuinely');
        L.push('uncontested, say so in one sentence and move on.');
        L.push('');
        L.push('## What to watch');
        L.push('Three bullets, each a specific checkable marker with a rough timeframe.');
        L.push('');
        L.push('## Ask me next');
        L.push('Three numbered questions, ordered by what would teach me the most. I will reply');
        L.push('with a digit.');
        L.push('');
        L.push('READING ON A PHONE');
        L.push('Short paragraphs: three sentences at most, none longer than about sixty words,');
        L.push('with a blank line between them. No tables, no nested bullets, no wall of text.');
        L.push('Around 500 words in total. Hard ceiling 650. Do not pad to reach a length; the');
        L.push('gist and why it matters are worth more than the sections under them.');
        L.push('');
        L.push('VOICE');
        L.push('Financial Times, not an encyclopedia and not a chatbot. Plain, confident,');
        L.push('concrete. Specifics over abstractions: names, numbers, dates, stakes. Every');
        L.push('sentence earns its place. No preamble, no throat clearing, no restating my');
        L.push('prompt back to me, no hedging filler, no em dashes. Where you are uncertain,');
        L.push('mark it in the sentence it applies to rather than in a disclaimer paragraph.');
        return L.join('\n');
      }

      function findStory(id) {
        for (var i = 0; i < data.sections.length; i++) {
          var list = data.sections[i].stories || [];
          for (var j = 0; j < list.length; j++) {
            if (list[j].id === id) {
              return { story: list[j], label: data.sections[i].label };
            }
          }
        }
        return null;
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        // Older iOS standalone PWAs land here.
        return new Promise(function (resolve, reject) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('copy failed'));
        });
      }

      // Tagline reflects the sections the edition actually shipped, not a
      // hardcoded list that can disagree with the paper.
      function taglineText() {
        var labels = data.sections
          .filter(function (s) { return s.id !== 'front'; })
          .map(function (s) { return s.label; });
        return (labels.length ? labels : ['Toronto', 'World', 'Business']).join(' · ');
      }

      function weatherHtml(w) {
        if (!w || !w.icon) return '';
        var week = (w.week || []).map(function (d) {
          return '<div class="day"><div class="d">' + esc(d.day) + '</div>' +
            '<div class="i">' + esc(d.icon) + '</div>' +
            '<div class="hi">' + esc(d.hi) + '°</div>' +
            '<div class="lo">' + esc(d.lo) + '°</div></div>';
        }).join('');
        return '<div class="weather" id="weather" role="button" tabindex="0" ' +
          'aria-expanded="false" aria-label="Toronto weather, tap for the week">' +
          '<div class="summary">' +
            '<span class="ico">' + esc(w.icon) + '</span>' +
            '<span class="city">Toronto</span>' +
            '<span class="temp">' + esc(w.high) + '° / ' + esc(w.low) + '°</span>' +
            '<span class="muted">' + esc(w.condition) + '</span>' +
            '<span class="muted">Rain ' + esc(w.rain) + '</span>' +
            '<span class="muted">Wind ' + esc(w.wind) + '</span>' +
            '<span class="chev" id="wchev">▼</span>' +
          '</div>' +
          '<div class="week" id="wweek" style="display:none">' + week + '</div>' +
        '</div>';
      }

      function tabsHtml() {
        return '<div class="tabs" role="tablist">' + data.sections.map(function (s) {
          var on = s.id === state.active;
          return '<button class="tab' + (on ? ' active' : '') + '" role="tab" ' +
            'aria-selected="' + on + '" data-tab="' + esc(s.id) + '">' + esc(s.label) + '</button>';
        }).join('') + '</div>';
      }

      function cardHtml(st, sectionLabel) {
        var open = st.id === state.openId;
        var tag = st.tag
          ? '<span class="tag ' + (isHotTag(st.tag) ? 'hot' : 'cool') + '">' + esc(st.tag) + '</span>'
          : '';
        var kicker = st.kicker ? '<div class="kicker">' + tag + esc(st.kicker) + '</div>' : '';
        var sub = st.sub ? '<div class="sub">' + esc(st.sub) + '</div>' : '';
        var expand = '';
        if (open) {
          var img = st.image
            ? '<img src="' + esc(st.image) + '" alt="' + esc(st.headline) + '" ' +
              'loading="lazy" onerror="this.remove()" />'
            : '';
          var analysis = st.analysis
            ? '<div class="analysis"><span class="alabel">Why it matters</span>' + esc(st.analysis) + '</div>'
            : '';
          var link = st.link
            ? '<a class="readmore" href="' + esc(st.link) + '" target="_blank" rel="noopener">Read full story →</a>'
            : '';

          // Prefill the destinations at render time so a long press ("open in
          // app") carries the prompt too, instead of us intercepting the tap.
          var q = encodeURIComponent(buildPrompt(st, sectionLabel));
          // No target="_blank" on these two. In a standalone PWA a blank target
          // opens an in-app browser sheet, which iOS will not hand off to an
          // installed app; a plain top-level tap is what lets the Claude and
          // ChatGPT apps claim their own domains as Universal Links. "Read full
          // story" keeps _blank, because a news site does belong in a tab.
          var share = navigator.share
            ? '<button class="ask-opt" data-ai="share" data-id="' + esc(st.id) + '">Share to app…</button>'
            : '';
          var actions = '<div class="actions">' + link +
            '<button class="askai" data-ask="' + esc(st.id) + '" aria-expanded="false" ' +
              'aria-controls="ask-' + esc(st.id) + '">Ask AI ▾</button></div>' +
            '<div class="ask-panel" id="ask-' + esc(st.id) + '">' +
              '<div class="ask-row">' +
                '<a class="ask-opt" href="https://claude.ai/new?q=' + esc(q) + '">Claude</a>' +
                '<a class="ask-opt" href="https://chatgpt.com/?q=' + esc(q) + '">ChatGPT</a>' +
                share +
                '<button class="ask-opt" data-ai="copy" data-id="' + esc(st.id) + '">Copy</button>' +
              '</div>' +
              '<div class="ask-note">Opens in the app if you have it installed. The reply ' +
                'starts with the gist in a few lines, then goes deeper, then offers three ' +
                'follow-up questions.</div>' +
            '</div>';

          expand = '<div class="expand">' + img +
            '<p class="sumtext">' + esc(st.summary) + '</p>' + analysis + actions + '</div>';
        }
        return '<div class="card' + (st.lead ? ' lead' : '') + (open ? ' open' : '') +
          '" data-card="' + esc(st.id) + '" role="button" tabindex="0" ' +
          'aria-expanded="' + open + '">' +
          '<div class="row"><div class="row-main">' + kicker +
            '<div class="headline">' + esc(st.headline) + '</div>' + sub +
            '<div class="time">' + esc(st.time) + '</div></div>' +
            '<div class="toggle" aria-hidden="true">' + (open ? '−' : '+') + '</div>' +
          '</div>' + expand +
        '</div>';
      }

      function storiesInner() {
        var section = data.sections.filter(function (s) { return s.id === state.active; })[0];
        if (!section) return '';
        if (!section.stories || !section.stories.length) {
          return '<div class="empty">Nothing filed for ' + esc(section.label) + ' this morning.</div>';
        }
        return section.stories.map(function (st) {
          return cardHtml(st, section.label);
        }).join('');
      }

      // Quietly flag a saved (not-today) edition served from cache/offline.
      function staleRibbon() {
        try {
          var meta = document.querySelector('meta[name=build]');
          if (!meta) return '';
          var built = new Date(meta.getAttribute('content'));
          if (isNaN(built.getTime())) return '';
          var opt = { timeZone: 'America/Toronto' };
          if (built.toLocaleDateString('en-CA', opt) < new Date().toLocaleDateString('en-CA', opt)) {
            return '<div class="stale">Saved edition · ' + esc(data.date) + '</div>';
          }
        } catch (e) {}
        return '';
      }

      function appHtml() {
        return '<div class="masthead">' +
            '<div class="date">' + esc(data.date) + '</div>' +
            '<div class="title">THE DAILY</div>' +
            '<div class="tagline">' + esc(taglineText()) + '</div>' +
          '</div>' +
          staleRibbon() +
          weatherHtml(data.weather) +
          tabsHtml() +
          '<div class="stories" id="stories">' + storiesInner() + '</div>' +
          '<div class="footer">THE DAILY · TORONTO · Tap any headline to read</div>';
      }

      var app = document.getElementById('app');

      // Rebuild only the stories column; masthead, weather, and tab strip (and
      // their scroll/open state) are left untouched. This is what keeps a tap
      // from resetting the reader's place.
      function refreshStories() {
        document.getElementById('stories').innerHTML = storiesInner();
        bindCards();
      }

      function selectTab(id) {
        if (id === state.active) return;
        state.active = id;
        state.openId = null;
        var tabs = document.querySelectorAll('.tab');
        Array.prototype.forEach.call(tabs, function (t) {
          var on = t.getAttribute('data-tab') === id;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on);
          if (on) t.scrollIntoView({ inline: 'center', block: 'nearest' });
        });
        refreshStories();
        // Start the new section at the top, tab strip stuck under the notch.
        var tabsEl = document.querySelector('.tabs');
        if (tabsEl) window.scrollTo(0, tabsEl.offsetTop);
      }

      function toggleCard(id) {
        var y = window.scrollY;
        state.openId = state.openId === id ? null : id;
        refreshStories();
        window.scrollTo(0, y);   // grow/collapse in place, never jump
      }

      function bindWeather() {
        var weather = document.getElementById('weather');
        if (!weather) return;
        function toggle() {
          var week = document.getElementById('wweek');
          var chev = document.getElementById('wchev');
          var showing = week.style.display !== 'none';
          week.style.display = showing ? 'none' : 'flex';
          chev.textContent = showing ? '▼' : '▲';
          weather.setAttribute('aria-expanded', String(!showing));
        }
        weather.addEventListener('click', toggle);
        weather.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
        });
      }

      function bindTabs() {
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
          btn.addEventListener('click', function () { selectTab(btn.getAttribute('data-tab')); });
        });
      }

      function bindCards() {
        Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
          function activate(ev) {
            // Let links and the Ask AI controls handle their own activation.
            if (ev.target.closest('a, button')) return;
            // While open, only the header row collapses it, so reading (and
            // selecting) the body never closes the story by accident.
            if (card.classList.contains('open') && !ev.target.closest('.row')) return;
            toggleCard(card.getAttribute('data-card'));
          }
          card.addEventListener('click', activate);
          card.addEventListener('keydown', function (ev) {
            if (ev.key !== 'Enter' && ev.key !== ' ') return;
            // Never swallow the key from a control that acts on it itself.
            if (ev.target.closest('a, button')) return;
            ev.preventDefault();
            activate(ev);
          });
          bindAsk(card);
        });
      }

      // Panel state is held in the DOM, not in `state`, so opening the
      // destinations never triggers a stories rebuild and never moves the page.
      function bindAsk(card) {
        var toggle = card.querySelector('.askai');
        if (!toggle) return;
        var panel = card.querySelector('.ask-panel');

        toggle.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var open = panel.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(open));
          toggle.textContent = open ? 'Ask AI ▴' : 'Ask AI ▾';
        });

        Array.prototype.forEach.call(panel.querySelectorAll('[data-ai]'), function (el) {
          var kind = el.getAttribute('data-ai');
          el.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var found = findStory(el.getAttribute('data-id'));
            if (!found) return;
            var prompt = buildPrompt(found.story, found.label);

            if (kind === 'share') {
              navigator.share({ text: prompt }).catch(function () {});
              return;
            }
            var label = el.textContent;
            copyText(prompt).then(function () {
              el.textContent = 'Copied';
            }).catch(function () {
              el.textContent = 'Copy failed';
            }).then(function () {
              setTimeout(function () { el.textContent = label; }, 1800);
            });
          });
        });
      }

      app.innerHTML = appHtml();
      bindWeather();
      bindTabs();
      bindCards();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
