  <title>The Daily</title>
  <style>
    /* ---- Design tokens: The Morning Broadsheet ------------------------- */
    :root {
      --paper: #faf8f3;        /* the sheet (warm white, never #fff) */
      --desk: #efece6;         /* the desk beyond the column */
      --ink: #17130d;          /* headlines / primary text */
      --ink-sub: #453f38;      /* standfirsts */
      --ink-muted: #635d54;    /* inactive tabs */
      --meta: #6c665c;         /* timestamps, dateline, footer (>=AA small) */
      --rule: #dcd6cc;         /* hairline between cards */
      --rule-soft: #e3ded4;    /* hairline inside an opened card */
      --navy: #1a2744;         /* structural ink */
      --navy-ink: #1a2744;     /* navy used as text (links, active tab) */
      --red: #8b1a1a;          /* editorial heat */
      --tint-open: #f2ede4;    /* ground of an expanded card */
      --tint-analysis: #ece6da;/* ground of the why-it-matters note */
      --strip-bg: #1a2744;     /* weather strip */
      --strip-ink: #f7f4ee;
      --chip-hot: #8b1a1a;     /* DEVELOPING / WAR-class flags */
      --chip-cool: #1a2744;    /* procedural flags (FINAL, EDITORIAL) */
      --chip-ink: #faf8f3;
      --focus: #1a2744;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151a22;      /* lamplight edition: deep navy-black paper */
        --desk: #0e1219;
        --ink: #e9e3d5;        /* cream ink */
        --ink-sub: #bcb6a8;
        --ink-muted: #948e82;
        --meta: #8f897d;
        --rule: #2a303a;
        --rule-soft: #2f3540;
        --navy: #6f82a8;       /* structure lifted so it reads on dark */
        --navy-ink: #a3b3d2;
        --red: #d1726b;        /* desaturated heat */
        --tint-open: #1b212b;
        --tint-analysis: #20262f;
        --strip-bg: #1b2334;
        --strip-ink: #e9e3d5;
        --chip-hot: #a8443c;
        --chip-cool: #3b4a6c;
        --chip-ink: #f0eadc;
        --focus: #a3b3d2;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 100%; }
    html, body { background: var(--desk); }
    body {
      font-family: 'Georgia', serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--paper);
      max-width: 680px;
      margin: 0 auto;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Masthead */
    .masthead {
      border-bottom: 4px solid var(--navy);
      padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
      background: var(--paper);
    }
    .masthead .date {
      font-size: 0.6875rem; color: var(--meta); letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .masthead .title {
      font-size: 2.375rem; font-weight: 700; letter-spacing: -0.01em;
      color: var(--navy); line-height: 1; margin-bottom: 2px;
    }
    .masthead .tagline {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; color: var(--meta);
      letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* Stale-edition ribbon */
    .stale {
      background: var(--tint-analysis); color: var(--meta);
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; text-align: center;
      padding: 7px 20px;
    }

    /* Weather strip */
    .weather {
      background: var(--strip-bg); color: var(--strip-ink);
      cursor: pointer; user-select: none;
    }
    .weather .summary {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
      min-height: 44px;
    }
    .weather .summary::-webkit-scrollbar { display: none; }
    .weather .ico { font-size: 1.375rem; }
    .weather .city { font-weight: 700; font-size: 0.9375rem; }
    .weather .temp { font-size: 0.9375rem; }
    .weather .muted { opacity: 0.72; font-size: 0.8125rem; white-space: nowrap; }
    .weather .chev { margin-left: auto; opacity: 0.6; font-size: 0.75rem; }
    .weather .week {
      display: flex; border-top: 1px solid rgba(255,255,255,0.12);
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
    }
    .weather .week::-webkit-scrollbar { display: none; }
    .weather .day {
      text-align: center; min-width: 52px; padding: 0 8px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .weather .day .d { font-size: 0.6875rem; opacity: 0.6; margin-bottom: 4px; }
    .weather .day .i { font-size: 1.125rem; }
    .weather .day .hi { font-size: 0.8125rem; font-weight: 700; margin-top: 4px; }
    .weather .day .lo { font-size: 0.6875rem; opacity: 0.5; }

    /* Tab nav */
    .tabs {
      display: flex; overflow-x: auto; border-bottom: 2px solid var(--navy);
      background: var(--paper); scrollbar-width: none;
      position: sticky; top: 0; z-index: 10;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; min-height: 44px; display: flex; align-items: center;
      padding: 0 18px; border: none; background: none; cursor: pointer;
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; font-weight: 700;
      color: var(--ink-muted); border-bottom: 3px solid transparent;
      margin-bottom: -2px; letter-spacing: 0.12em; text-transform: uppercase;
      transition: color 0.15s;
    }
    .tab.active { color: var(--navy-ink); border-bottom-color: var(--navy); }

    /* Stories */
    .stories { padding: 8px 20px 40px; }
    .empty {
      padding: 40px 4px; text-align: center; color: var(--meta);
      font-style: italic; font-size: 0.9375rem;
    }
    .card {
      border-top: 1px solid var(--rule); padding: 14px 0; cursor: pointer;
      background: var(--paper); transition: background 0.15s;
    }
    .card.lead { border-top: 3px solid var(--navy); padding: 20px 0 16px; }
    .card.open { background: var(--tint-open); }
    .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card .row-main { flex: 1; min-width: 0; }
    .card .kicker {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; color: var(--red); margin-bottom: 6px; text-transform: uppercase;
    }
    .card .tag {
      color: var(--chip-ink); padding: 2px 6px; margin-right: 8px;
      font-size: 0.5625rem; border-radius: 2px; vertical-align: 1px;
    }
    .card .tag.hot { background: var(--chip-hot); }
    .card .tag.cool { background: var(--chip-cool); }
    .card .headline {
      font-size: 1.0625rem; font-weight: 700; line-height: 1.25; color: var(--ink); margin-bottom: 6px;
    }
    .card.lead .headline { font-size: 1.375rem; }
    .card .sub {
      font-size: 0.875rem; color: var(--ink-sub); line-height: 1.4; margin-bottom: 4px; font-style: italic;
    }
    .card .time { font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta); margin-top: 4px; }
    .card .toggle { color: var(--navy-ink); opacity: 0.5; font-size: 1.125rem; flex-shrink: 0; margin-top: 2px; }
    .card .expand {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    }
    .card .expand .sumtext {
      font-size: 0.9375rem; color: var(--ink-sub); line-height: 1.7;
    }
    .card .expand img {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      background: var(--tint-open); border-radius: 3px; margin-bottom: 12px;
    }
    .card .analysis {
      margin-top: 12px; padding: 10px 14px; background: var(--tint-analysis);
      font-size: 0.875rem; line-height: 1.6; color: var(--ink-sub); font-style: italic;
    }
    .card .analysis .alabel {
      display: block; font-family: 'Arial', sans-serif; font-style: normal;
      font-size: 0.625rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--navy-ink); margin-bottom: 4px;
    }
    .card .readmore {
      display: inline-block; margin-top: 12px; min-height: 44px; line-height: 44px;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink); text-decoration: none;
    }
    .card .readmore:hover { text-decoration: underline; }
    .card .readmore:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    /* Ask AI: hand the clipping and a briefing prompt to a model */
    .card .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .askai, .card .ask-opt {
      border: none; background: none; padding: 0; cursor: pointer;
      min-height: 44px; line-height: 44px; text-decoration: none;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink);
    }
    .card .askai { margin-top: 12px; }
    .card .askai:hover, .card .ask-opt:hover { text-decoration: underline; }
    .card .askai:focus-visible, .card .ask-opt:focus-visible {
      outline: 2px solid var(--focus); outline-offset: 3px;
    }
    .card .ask-panel { display: none; border-top: 1px solid var(--rule-soft); margin-top: 4px; }
    .card .ask-panel.open { display: block; }
    .card .ask-row { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .ask-note {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.55;
      color: var(--meta); letter-spacing: 0.02em; padding-bottom: 12px;
    }

    /* Footer */
    .footer {
      border-top: 2px solid var(--navy);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta);
      text-align: center; letter-spacing: 0.06em;
    }
    .notice { padding: 40px 20px; text-align: center; color: var(--meta); font-style: italic; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>

e raising alarm bells as parents, like a Toronto-area dad who sold his home and moved cities to better support his autistic son, seek alternatives. This trend of families relocating for specialized educational needs is contributing to declining enrollment figures across the province, prompting concerns about the future of public education.", "analysis": null, "time": "7:00 AM", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/f/31/f319dea0-2283-525f-9cb4-c45f71b4ec4a/6a7b4f3a9cd61.image.jpg?resize=300%2C200", "link": "https://www.thestar.com/news/gta/a-toronto-area-dad-sold-his-home-and-moved-cities-to-help-his-autistic-son-why-moves-like-his-are-raising-alarm-bells-at-ontario-public-school-boards/article_2f66eb69-8f6c-406b-b4de-970d22aca408.html"}, {"id": "t4", "lead": false, "kicker": "INFRASTRUCTURE", "headline": "Rogers Stadium Damaged in Storm, Future Uncertain", "sub": "Questions swirl about the venue's next steps after a 'red-level storm' caused significant damage, with Live Nation working on inspection and remediation.", "summary": "Rogers Stadium sustained significant damage during a recent 'red-level storm,' leaving its future uncertain. Live Nation is collaborating with the city on inspections and remediation efforts, but the extent of the damage and the timeline for repairs remain unclear. The incident raises concerns about the city's infrastructure resilience against severe weather events.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/8/48/848ff6ca-af09-55ff-8238-612fed7415df/6a9b4b5726ead.image.jpg?resize=300%2C225", "link": "https://www.thestar.com/news/gta/what-s-next-for-rogers-stadium-questions-swirl-after-venue-damaged-in-storm/article_bdf87f8e-83b3-4d1a-8c34-d332bebdf310.html"}]}, {"id": "world", "label": "World", "stories": [{"id": " , "link": "https://www.theguardian.com/world/2026/sep/05/jair-bolsonaro-coup-plan-2022-election-brazil-air-force-baptista-junior"}, {"id": "w3", "lead": false, "kicker": "EUROPEAN SECURITY", "headline": "Europe Unable to Sustain War of Attrition with Russia, Defence Officials Warn", "sub": "Security experts fear Russia may be winning a 'hybrid war' against the West, fueled by the rise of pro-Kremlin, far-right parties.", "summary": "European defence officials warn that the continent would be unable to sustain a prolonged war of attrition with Russia. Security experts express concern that Russia may be gaining an advantage in a 'hybrid war' against the West, exacerbated by the growing influence of pro-Kremlin, far-right political parties across Europe.", "analysis": null, "time": "11:00 AM", "tag": "WAR", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/2026/sep/05/europe-unable-sustain-war-of-attrition-russia-defence-officials-say"}, {"id": "w4", "lead": false, "kicker": "SOCIAL MEDIA", "headline": "Influencers Chasing Fame by Filming Isolated Tribes Spark 'Colonialism for Clicks' Outcry", "sub": "A new breed of adventurer is targeting uncontacted peoples for internet fame, risking the wellbeing of remote communities and their own lives.", "summary": "A growing trend sees social media influencers seeking internet fame by attempting to meet and film the world's most isolated tribes, drawing accusations of 'colonialism for clicks.' Critics warn that these adventurers risk the wellbeing of remote communities by exposing them to outside diseases and cultural disruption, while also endangering their own lives.", "analysis": null, "time": "11:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/007adccc8bdb76885d333004dc0ad25e83adad11/256_0_7680_6144/500.jpg", "link": "https://www.theguardian.com/world/2026/sep/05/colonialism-for-clicks-influencers-attempting-meet-film-worlds-most-isolated-tribes"}]}, {"id": "sports", "label": "Sports", "stories": [{"id": "s1", "lead": true, "kicker": "TENNIS", "headline": "Williams Sisters' US Open Return Ends in Heartbreak with Third-Set Tie-Break Defeat", "sub": "Serena and Venus Williams crashed out of the women’s doubles in the first round after a grueling 6-3, 6-7(6), 7-6(7) loss to Maya Joint and Chan Hao-ching.", "summary": "The highly anticipated US Open return for tennis legends Serena and Venus Williams ended in a heartbreaking first-round defeat in the women's doubles. The American duo fell to Maya Joint and Chan Hao-ching in a marathon match, losing 6-3, 6-7(6), 7-6(7) after a tense third-set tie-break. This potentially marks the final professional appearance together for the iconic sisters.", "analysis": "The Williams sisters' early exit from the US Open doubles marks a poignant moment, potentially signaling the end of an era for two of tennis's most dominant figures. Their enduring appeal and competitive spirit, even in defeat, highlight their lasting legacy in the sport.", "time": "4:26 AM", "tag": "FINAL", "sensitivity": false, "image": "https://media.guim.co.uk/94dc7e84554ea09b8a2fc52472983bdcba76ff8d/457_0_4259_3408/500.jpg", "link": "https://www.theguardian.com/sport/2026/sep/05/serena-venus-williams-us-open-doubles-defeat"}, {"id": "s2", "lead": false, "kicker": "NFL", "headline": "CTE in Football Players: A Health Crisis Demanding Fans Stop Watching", "sub": "A new study provides further evidence of life-altering head trauma in America's biggest sport, arguing that fans must take action as the NFL will not.", "summary": "A new study has provided additional compelling evidence that American football, the nation's most popular sport, causes life-altering head trauma, specifically Chronic Traumatic Encephalopathy (CTE). The report argues that since the NFL is unlikely to implement sufficient changes, it falls to fans to stop watching to address this health crisis.", "analysis": null, "time": "10:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/0d955bb7d29e4ee34693ac07dea0619ae1415e9b/612_0_6120_4896/500.jpg", "link": "https://www.theguardian.com/sport/2026/sep/05/cte-football-players-nfl"}, {"id": "s3", "lead": false, "kicker": "BOXING", "headline": "Andy Ruiz Jr.'s Comeback Bid in Tatters After Defeat to Damian Knyba", "sub": "The former unified heavyweight champion was comprehensively outpointed in Newark, dealing a potentially terminal blow to his hopes of another title run.", "summary": "Former unified heavyweight champion Andy Ruiz Jr.'s comeback aspirations have suffered a potentially terminal blow following a sobering defeat to Damian Knyba in Newark. Ruiz Jr. was dropped and comprehensively outpointed, casting significant doubt on his ability to mount another challenge for a world title.", "analysis": null, "time": "8:14 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/0d1ac67a74ac5d2feb1552523da85369966ba1b8/170_0_2500_2001/500.jpg", "link": "https://www.theguardian.com/sport/2026/sep/05/andy-ruiz-jr-damian-knyba-boxing-heavyweight-result"}, {"id": "s4", "lead": false, "kicker": "ATHLETICS", "headline": "Cameron Myers Shines in Star-Studded Field to Win 1500m at Diamond League Final", "sub": "The Australian runner beat Olympic champions Jakob Ingebrigtsen and Cole Hocker, while pole vaulter Kurtis Marschall secured third place.", "summary": "Australian Cameron Myers delivered a standout performance at the Diamond League final, winning the 1500m race against a star-studded field that included Olympic champions Jakob Ingebrigtsen and Cole Hocker. In other events, fellow Australian Kurtis Marschall soared over 5.82m to claim third place in the pole vault, marking a successful night for Australian athletics.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/4d098b4a3819f1398a9c1230606efe94c0d2f1ea/639_219_4757_3805/500.jpg", "link": "https://www.theguardian.com/sport/2  Voting Systems contributed to an expensive defamation lawsuit against Fox. Her sidelining signals the network's efforts to mitigate further legal and reputational risks.", "analysis": null, "time": "5:04 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/09/04/multimedia/00biz-fox-mvcw/00biz-fox-mvcw-superJumbo.jpg", "link": "https://www.nytimes.com/2026/09/05/business/media/maria-bartiromo-fox-news.html"}, {"id": "b3", "lead": false, "kicker": "AI & COPYRIGHT", "headline": "Authors Wrangle with Publishers Over $1.5 Billion Anthropic A.I. Settlement", "sub": "The tech giant must pay $3,000 per pirated book used to train its chatbot, but authors fear losing funds to others in the book business.", "summary": "Authors are in dispute with publishers over the distribution of a $1.5 billion settlement from AI giant Anthropic. The settlement mandates Anthropic pay $3,000 per pirated book used to train its chatbot, but many authors fear that publishers and other entities in the book business will claim a disproportionate share of the funds, leaving creators shortchanged.", "analysis": null, "time": "5:03 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/09/03/multimedia/03xp-publishers-settlement-qgpj/03xp-publishers-settlement-qgpj-superJumbo.jpg", "link": "https://www.nytimes.com/2026/09/05/books/anthropic-settlement-ai-copyright-books.html"}, {"id": "b4", "lead": false, "kicker": "GLOBAL ECONOMY", "headline": "US Jobs Report Smashes Forecasts; Falklands Oil Explorers Plunge Amid Argentina Sanctions Threat", "sub": "The US economy added 162,000 new jobs in August, while concerns about global bond market instability and rising fuel prices persist.", "summary": "The US economy significantly exceeded expectations by adding 162,000 new jobs in August, with the unemployment rate holding steady. Meanwhile, shares in Falklands oil explorers plummeted after Argentina threatened sanctions, adding to global economic instability. Concerns also remain over rising fuel prices, which have surged 10% in less than a week due to Middle East conflict and Russian export bans, impacting farmers in the UK and US.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/6c202f240b628027d7ef93fc2206478c5785ae98/184_0_3585_2868/500.jpg", "link": "https://www.theguardian.com/business/live/2026/sep/04/uk-car-sales-rise-food-prices-bank-of-england-us-jobs-repost-latest-news-updates"}]}, {"id": "opinion", "label": "Opinion", "stories": [{"id": "o1", "lead": true, "kicker": "US POLITICS", "headline": "Does Donald Trump Care About Winning the Midterms? Apparently, Not Much at All", "sub": "Jonathan Freedland argues President Trump's narcissism leads him to see Democratic victories as proof of his indispensability, with his decisions spelling calamity for voters.", "summary": "Guardian columnist Jonathan Freedland contends that President Donald Trump's profound narcissism dictates his approach to the midterms, suggesting he views Democratic victories as validation of his own indispensability. Freedland argues that Trump's every decision is driven by self-interest, leading to policies and actions that ultimately spell calamity for American voters, regardless of electoral outcomes. This perspective paints a picture of a president detached from conventional political motivations.", "analysis": "This analysis offers a critical lens on President Trump's political strategy, suggesting his actions are less about party success and more about personal validation. If true, it implies a fundamental misalignment between presidential priorities and the electoral interests of his party, with significant implications for governance and future elections.", "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/ce808299679820120e22af9c7df92de2e5f57833/426_52_2563_2051/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/sep/04/donald-trump-winning-midterms-us-president"}, {"id": "o2", "lead": false, "kicker": "UK POLITICS", "headline": "The Pressure on Prime Minister Burnham to Appease the Right is Huge, But Now is the Time to Step Out of Reform’s Shadow", "sub": "Andy Beckett argues that a scandal-besieged Reform party's loyal base should free up Prime Minister Burnham to deliver home truths.", "summary": "Guardian columnist Andy Beckett asserts that Prime Minister Andy Burnham faces immense pressure to appease the right wing of British politics. However, with the Reform party currently embroiled in scandal but retaining a loyal base, Beckett argues this situation should liberate Burnham to articulate unvarnished truths and step out of Reform's shadow, rather than constantly trying to win over their voters.", "analysis": null, "time": "9:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/928daec8b033e5fa3f1bfddf44abf4c5d4e79cb0/681_0_6830_5464/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/sep/05/andy-burnham-reform-uk-labour-rightwing-voters"}, {"id": "o3", "lead": false, "kicker": "AI & SOCIETY", "headline": "As AI Madness Encroaches, We Need Human Connection More Than Ever, But We’ll Have to Fight for It", "sub": "Van Badham argues that people yearn for shared human experiences over the isolating, automated outputs offered by tech lords.", "summary": "Guardian columnist Van Badham argues that as 'AI madness' increasingly encroaches on daily life, the need for genuine human connection has become more critical than ever. She contends that people are yearning for shared frames of reference and authentic experiences, rejecting the isolating, automated outputs that tech companies are promoting. Badham emphasizes that securing this human connection will require a deliberate fight against technological overreach.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/4f2a264a73fc62adea2533ac3d991e6520e47472/432_0_4320_3456/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/sep/05/as-ai-madness-encroaches-we-need-human-connection-more-than-ever"}, {"id": "o4", "lead": false, "kicker": "DEATH PENALTY", "headline": "Tennessee to Execute First Woman Since 1819, Raising Troubling Questions About Justice System", "sub": "Austin Sarat argues that Christa Pike’s planned execution is emblematic of America’s broken death penalty system.", "summary": "Tennessee is preparing to execute Christa Pike, which would mark the state's first execution of a woman since 1819. Guardian columnist Austin Sarat argues that Pike's case highlights the deep flaws within America's death penalty system, raising troubling questions about fairness, due process, and the morality of capital punishment. The impending execution reignites debate over the system's inherent biases and potential for error.", "analysis": null, "time": "Yesterday", "tag": "EDITORIAL", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/commentisfree/2026/sep/04/tennessee-executes-first-woman-since-1819"}]}]}</script>

  <script>
    (function () {
      var raw = document.getElementById('edition').textContent;
      var data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<div class="notice">No edition loaded. Run the build to generate today’s paper.</div>';
        return;
      }

      var state = { active: (data.sections[0] || {}).id, openId: null };

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Editorial heat flags keep the red chip; procedural flags cool to navy,
      // so a red chip still means something (the Scarce Red Rule).
      function isHotTag(t) {
        return /^(DEVELOPING|BREAKING|LIVE|WAR|ALERT|URGENT)$/i.test(t || '');
      }

      // ---- Ask AI ----------------------------------------------------------
      // The reader taps one story and gets a briefing, not a chat. The prompt
      // does three jobs: hand over the clipping, name the shape of the answer
      // (five parts, ~500 words, hard ceiling), and set up the follow-up so the
      // conversation continues without the reader having to think of a question.
      // Voice constraints mirror src/config.py HOUSE_VOICE, em dash ban included.
      function buildPrompt(st, sectionLabel) {
        var L = [];
        L.push('I read this in my morning paper and I want to understand it properly.');
        L.push('');
        L.push('THE CLIPPING');
        L.push('Headline: ' + st.headline);
        if (st.sub) L.push('Standfirst: ' + st.sub);
        if (st.summary) L.push('Summary: ' + st.summary);
        if (st.analysis) L.push("My paper's why-it-matters note: " + st.analysis);
        L.push('Section: ' + sectionLabel + '. Filed ' + (st.time || 'this morning') +
               ', edition of ' + data.date + '.');
        if (st.link) L.push('Source: ' + st.link);
        L.push('');
        L.push('WHAT I WANT');
        L.push('A briefing that leaves me genuinely informed, not a restatement of what I just');
        L.push('pasted. Assume I know nothing beyond the clipping above.');
        L.push('');
        L.push('Check current reporting first if you are able to search. My clipping is a');
        L.push('summary and may be incomplete or already overtaken by events. If you cannot');
        L.push('search, say so in one line at the top, then separate what you are confident');
        L.push('about from what you would want verified.');
        L.push('');
        L.push('STRUCTURE');
        L.push('I am reading this on a phone. Build the answer in layers, heaviest first, so');
        L.push('I can stop at the end of any layer and still have got something whole. Use');
        L.push('these markdown headings exactly, so they render large on a small screen.');
        L.push('');
        L.push('# The gist');
        L.push('An H1 of six to ten words stating the actual point, not the topic. Then two or');
        L.push('three short sentences giving me the whole story in plain words. If I read');
        L.push('nothing else, this is what I walk away knowing. Correct my clipping here if it');
        L.push('is wrong or out of date.');
        L.push('');
        L.push('## Why it matters');
        L.push('Two or three short sentences on the stakes and the second order effects. Be');
        L.push('concrete about who gains, who pays, how much, and by when.');
        L.push('');
        L.push('## How we got here');
        L.push('Only the background I need to follow this story. Not a history lecture.');
        L.push('');
        L.push('## Where it is contested');
        L.push('The strongest disagreement among serious people, put fairly. If it is genuinely');
        L.push('uncontested, say so in one sentence and move on.');
        L.push('');
        L.push('## What to watch');
        L.push('Three bullets, each a specific checkable marker with a rough timeframe.');
        L.push('');
        L.push('## Ask me next');
        L.push('Three numbered questions, ordered by what would teach me the most. I will reply');
        L.push('with a digit.');
        L.push('');
        L.push('READING ON A PHONE');
        L.push('Short paragraphs: three sentences at most, none longer than about sixty words,');
        L.push('with a blank line between them. No tables, no nested bullets, no wall of text.');
        L.push('Around 500 words in total. Hard ceiling 650. Do not pad to reach a length; the');
        L.push('gist and why it matters are worth more than the sections under them.');
        L.push('');
        L.push('VOICE');
        L.push('Financial Times, not an encyclopedia and not a chatbot. Plain, confident,');
        L.push('concrete. Specifics over abstractions: names, numbers, dates, stakes. Every');
        L.push('sentence earns its place. No preamble, no throat clearing, no restating my');
        L.push('prompt back to me, no hedging filler, no em dashes. Where you are uncertain,');
        L.push('mark it in the sentence it applies to rather than in a disclaimer paragraph.');
        return L.join('\n');
      }

      function findStory(id) {
        for (var i = 0; i < data.sections.length; i++) {
          var list = data.sections[i].stories || [];
          for (var j = 0; j < list.length; j++) {
            if (list[j].id === id) {
              return { story: list[j], label: data.sections[i].label };
            }
          }
        }
        return null;
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        // Older iOS standalone PWAs land here.
        return new Promise(function (resolve, reject) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('copy failed'));
        });
      }

      // Tagline reflects the sections the edition actually shipped, not a
      // hardcoded list that can disagree with the paper.
      function taglineText() {
        var labels = data.sections
          .filter(function (s) { return s.id !== 'front'; })
          .map(function (s) { return s.label; });
        return (labels.length ? labels : ['Toronto', 'World', 'Business']).join(' · ');
      }

      function weatherHtml(w) {
        if (!w || !w.icon) return '';
        var week = (w.week || []).map(function (d) {
          return '<div class="day"><div class="d">' + esc(d.day) + '</div>' +
            '<div class="i">' + esc(d.icon) + '</div>' +
            '<div class="hi">' + esc(d.hi) + '°</div>' +
            '<div class="lo">' + esc(d.lo) + '°</div></div>';
        }).join('');
        return '<div class="weather" id="weather" role="button" tabindex="0" ' +
          'aria-expanded="false" aria-label="Toronto weather, tap for the week">' +
          '<div class="summary">' +
            '<span class="ico">' + esc(w.icon) + '</span>' +
            '<span class="city">Toronto</span>' +
            '<span class="temp">' + esc(w.high) + '° / ' + esc(w.low) + '°</span>' +
            '<span class="muted">' + esc(w.condition) + '</span>' +
            '<span class="muted">Rain ' + esc(w.rain) + '</span>' +
            '<span class="muted">Wind ' + esc(w.wind) + '</span>' +
            '<span class="chev" id="wchev">▼</span>' +
          '</div>' +
          '<div class="week" id="wweek" style="display:none">' + week + '</div>' +
        '</div>';
      }

      function tabsHtml() {
        return '<div class="tabs" role="tablist">' + data.sections.map(function (s) {
          var on = s.id === state.active;
          return '<button class="tab' + (on ? ' active' : '') + '" role="tab" ' +
            'aria-selected="' + on + '" data-tab="' + esc(s.id) + '">' + esc(s.label) + '</button>';
        }).join('') + '</div>';
      }

      function cardHtml(st, sectionLabel) {
        var open = st.id === state.openId;
        var tag = st.tag
          ? '<span class="tag ' + (isHotTag(st.tag) ? 'hot' : 'cool') + '">' + esc(st.tag) + '</span>'
          : '';
        var kicker = st.kicker ? '<div class="kicker">' + tag + esc(st.kicker) + '</div>' : '';
        var sub = st.sub ? '<div class="sub">' + esc(st.sub) + '</div>' : '';
        var expand = '';
        if (open) {
          var img = st.image
            ? '<img src="' + esc(st.image) + '" alt="' + esc(st.headline) + '" ' +
              'loading="lazy" onerror="this.remove()" />'
            : '';
          var analysis = st.analysis
            ? '<div class="analysis"><span class="alabel">Why it matters</span>' + esc(st.analysis) + '</div>'
            : '';
          var link = st.link
            ? '<a class="readmore" href="' + esc(st.link) + '" target="_blank" rel="noopener">Read full story →</a>'
            : '';

          // Prefill the destinations at render time so a long press ("open in
          // app") carries the prompt too, instead of us intercepting the tap.
          var q = encodeURIComponent(buildPrompt(st, sectionLabel));
          // No target="_blank" on these two. In a standalone PWA a blank target
          // opens an in-app browser sheet, which iOS will not hand off to an
          // installed app; a plain top-level tap is what lets the Claude and
          // ChatGPT apps claim their own domains as Universal Links. "Read full
          // story" keeps _blank, because a news site does belong in a tab.
          var share = navigator.share
            ? '<button class="ask-opt" data-ai="share" data-id="' + esc(st.id) + '">Share to app…</button>'
            : '';
          var actions = '<div class="actions">' + link +
            '<button class="askai" data-ask="' + esc(st.id) + '" aria-expanded="false" ' +
              'aria-controls="ask-' + esc(st.id) + '">Ask AI ▾</button></div>' +
            '<div class="ask-panel" id="ask-' + esc(st.id) + '">' +
              '<div class="ask-row">' +
                '<a class="ask-opt" href="https://claude.ai/new?q=' + esc(q) + '">Claude</a>' +
                '<a class="ask-opt" href="https://chatgpt.com/?q=' + esc(q) + '">ChatGPT</a>' +
                share +
                '<button class="ask-opt" data-ai="copy" data-id="' + esc(st.id) + '">Copy</button>' +
              '</div>' +
              '<div class="ask-note">Opens in the app if you have it installed. The reply ' +
                'starts with the gist in a few lines, then goes deeper, then offers three ' +
                'follow-up questions.</div>' +
            '</div>';

          expand = '<div class="expand">' + img +
            '<p class="sumtext">' + esc(st.summary) + '</p>' + analysis + actions + '</div>';
        }
        return '<div class="card' + (st.lead ? ' lead' : '') + (open ? ' open' : '') +
          '" data-card="' + esc(st.id) + '" role="button" tabindex="0" ' +
          'aria-expanded="' + open + '">' +
          '<div class="row"><div class="row-main">' + kicker +
            '<div class="headline">' + esc(st.headline) + '</div>' + sub +
            '<div class="time">' + esc(st.time) + '</div></div>' +
            '<div class="toggle" aria-hidden="true">' + (open ? '−' : '+') + '</div>' +
          '</div>' + expand +
        '</div>';
      }

      function storiesInner() {
        var section = data.sections.filter(function (s) { return s.id === state.active; })[0];
        if (!section) return '';
        if (!section.stories || !section.stories.length) {
          return '<div class="empty">Nothing filed for ' + esc(section.label) + ' this morning.</div>';
        }
        return section.stories.map(function (st) {
          return cardHtml(st, section.label);
        }).join('');
      }

      // Quietly flag a saved (not-today) edition served from cache/offline.
      function staleRibbon() {
        try {
          var meta = document.querySelector('meta[name=build]');
          if (!meta) return '';
          var built = new Date(meta.getAttribute('content'));
          if (isNaN(built.getTime())) return '';
          var opt = { timeZone: 'America/Toronto' };
          if (built.toLocaleDateString('en-CA', opt) < new Date().toLocaleDateString('en-CA', opt)) {
            return '<div class="stale">Saved edition · ' + esc(data.date) + '</div>';
          }
        } catch (e) {}
        return '';
      }

      function appHtml() {
        return '<div class="masthead">' +
            '<div class="date">' + esc(data.date) + '</div>' +
            '<div class="title">THE DAILY</div>' +
            '<div class="tagline">' + esc(taglineText()) + '</div>' +
          '</div>' +
          staleRibbon() +
          weatherHtml(data.weather) +
          tabsHtml() +
          '<div class="stories" id="stories">' + storiesInner() + '</div>' +
          '<div class="footer">THE DAILY · TORONTO · Tap any headline to read</div>';
      }

      var app = document.getElementById('app');

      // Rebuild only the stories column; masthead, weather, and tab strip (and
      // their scroll/open state) are left untouched. This is what keeps a tap
      // from resetting the reader's place.
      function refreshStories() {
        document.getElementById('stories').innerHTML = storiesInner();
        bindCards();
      }

      function selectTab(id) {
        if (id === state.active) return;
        state.active = id;
        state.openId = null;
        var tabs = document.querySelectorAll('.tab');
        Array.prototype.forEach.call(tabs, function (t) {
          var on = t.getAttribute('data-tab') === id;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on);
          if (on) t.scrollIntoView({ inline: 'center', block: 'nearest' });
        });
        refreshStories();
        // Start the new section at the top, tab strip stuck under the notch.
        var tabsEl = document.querySelector('.tabs');
        if (tabsEl) window.scrollTo(0, tabsEl.offsetTop);
      }

      function toggleCard(id) {
        var y = window.scrollY;
        state.openId = state.openId === id ? null : id;
        refreshStories();
        window.scrollTo(0, y);   // grow/collapse in place, never jump
      }

      function bindWeather() {
        var weather = document.getElementById('weather');
        if (!weather) return;
        function toggle() {
          var week = document.getElementById('wweek');
          var chev = document.getElementById('wchev');
          var showing = week.style.display !== 'none';
          week.style.display = showing ? 'none' : 'flex';
          chev.textContent = showing ? '▼' : '▲';
          weather.setAttribute('aria-expanded', String(!showing));
        }
        weather.addEventListener('click', toggle);
        weather.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
        });
      }

      function bindTabs() {
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
          btn.addEventListener('click', function () { selectTab(btn.getAttribute('data-tab')); });
        });
      }

      function bindCards() {
        Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
          function activate(ev) {
            // Let links and the Ask AI controls handle their own activation.
            if (ev.target.closest('a, button')) return;
            // While open, only the header row collapses it, so reading (and
            // selecting) the body never closes the story by accident.
            if (card.classList.contains('open') && !ev.target.closest('.row')) return;
            toggleCard(card.getAttribute('data-card'));
          }
          card.addEventListener('click', activate);
          card.addEventListener('keydown', function (ev) {
            if (ev.key !== 'Enter' && ev.key !== ' ') return;
            // Never swallow the key from a control that acts on it itself.
            if (ev.target.closest('a, button')) return;
            ev.preventDefault();
            activate(ev);
          });
          bindAsk(card);
        });
      }

      // Panel state is held in the DOM, not in `state`, so opening the
      // destinations never triggers a stories rebuild and never moves the page.
      function bindAsk(card) {
        var toggle = card.querySelector('.askai');
        if (!toggle) return;
        var panel = card.querySelector('.ask-panel');

        toggle.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var open = panel.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(open));
          toggle.textContent = open ? 'Ask AI ▴' : 'Ask AI ▾';
        });

        Array.prototype.forEach.call(panel.querySelectorAll('[data-ai]'), function (el) {
          var kind = el.getAttribute('data-ai');
          el.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var found = findStory(el.getAttribute('data-id'));
            if (!found) return;
            var prompt = buildPrompt(found.story, found.label);

            if (kind === 'share') {
              navigator.share({ text: prompt }).catch(function () {});
              return;
            }
            var label = el.textContent;
            copyText(prompt).then(function () {
              el.textContent = 'Copied';
            }).catch(function () {
              el.textContent = 'Copy failed';
            }).then(function () {
              setTimeout(function () { el.textContent = label; }, 1800);
            });
          });
        });
      }

      app.innerHTML = appHtml();
      bindWeather();
      bindTabs();
      bindCards();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
