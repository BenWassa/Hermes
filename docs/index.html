  <title>The Daily</title>
  <style>
    /* ---- Design tokens: The Morning Broadsheet ------------------------- */
    :root {
      --paper: #faf8f3;        /* the sheet (warm white, never #fff) */
      --desk: #efece6;         /* the desk beyond the column */
      --ink: #17130d;          /* headlines / primary text */
      --ink-sub: #453f38;      /* standfirsts */
      --ink-muted: #635d54;    /* inactive tabs */
      --meta: #6c665c;         /* timestamps, dateline, footer (>=AA small) */
      --rule: #dcd6cc;         /* hairline between cards */
      --rule-soft: #e3ded4;    /* hairline inside an opened card */
      --navy: #1a2744;         /* structural ink */
      --navy-ink: #1a2744;     /* navy used as text (links, active tab) */
      --red: #8b1a1a;          /* editorial heat */
      --tint-open: #f2ede4;    /* ground of an expanded card */
      --tint-analysis: #ece6da;/* ground of the why-it-matters note */
      --strip-bg: #1a2744;     /* weather strip */
      --strip-ink: #f7f4ee;
      --chip-hot: #8b1a1a;     /* DEVELOPING / WAR-class flags */
      --chip-cool: #1a2744;    /* procedural flags (FINAL, EDITORIAL) */
      --chip-ink: #faf8f3;
      --focus: #1a2744;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151a22;      /* lamplight edition: deep navy-black paper */
        --desk: #0e1219;
        --ink: #e9e3d5;        /* cream ink */
        --ink-sub: #bcb6a8;
        --ink-muted: #948e82;
        --meta: #8f897d;
        --rule: #2a303a;
        --rule-soft: #2f3540;
        --navy: #6f82a8;       /* structure lifted so it reads on dark */
        --navy-ink: #a3b3d2;
        --red: #d1726b;        /* desaturated heat */
        --tint-open: #1b212b;
        --tint-analysis: #20262f;
        --strip-bg: #1b2334;
        --strip-ink: #e9e3d5;
        --chip-hot: #a8443c;
        --chip-cool: #3b4a6c;
        --chip-ink: #f0eadc;
        --focus: #a3b3d2;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 100%; }
    html, body { background: var(--desk); }
    body {
      font-family: 'Georgia', serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--paper);
      max-width: 680px;
      margin: 0 auto;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Masthead */
    .masthead {
      border-bottom: 4px solid var(--navy);
      padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
      background: var(--paper);
    }
    .masthead .date {
      font-size: 0.6875rem; color: var(--meta); letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .masthead .title {
      font-size: 2.375rem; font-weight: 700; letter-spacing: -0.01em;
      color: var(--navy); line-height: 1; margin-bottom: 2px;
    }
    .masthead .tagline {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; color: var(--meta);
      letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* Stale-edition ribbon */
    .stale {
      background: var(--tint-analysis); color: var(--meta);
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; text-align: center;
      padding: 7px 20px;
    }

    /* Weather strip */
    .weather {
      background: var(--strip-bg); color: var(--strip-ink);
      cursor: pointer; user-select: none;
    }
    .weather .summary {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
      min-height: 44px;
    }
    .weather .summary::-webkit-scrollbar { display: none; }
    .weather .ico { font-size: 1.375rem; }
    .weather .city { font-weight: 700; font-size: 0.9375rem; }
    .weather .temp { font-size: 0.9375rem; }
    .weather .muted { opacity: 0.72; font-size: 0.8125rem; white-space: nowrap; }
    .weather .chev { margin-left: auto; opacity: 0.6; font-size: 0.75rem; }
    .weather .week {
      display: flex; border-top: 1px solid rgba(255,255,255,0.12);
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
    }
    .weather .week::-webkit-scrollbar { display: none; }
    .weather .day {
      text-align: center; min-width: 52px; padding: 0 8px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .weather .day .d { font-size: 0.6875rem; opacity: 0.6; margin-bottom: 4px; }
    .weather .day .i { font-size: 1.125rem; }
    .weather .day .hi { font-size: 0.8125rem; font-weight: 700; margin-top: 4px; }
    .weather .day .lo { font-size: 0.6875rem; opacity: 0.5; }

    /* Tab nav */
    .tabs {
      display: flex; overflow-x: auto; border-bottom: 2px solid var(--navy);
      background: var(--paper); scrollbar-width: none;
      position: sticky; top: 0; z-index: 10;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; min-height: 44px; display: flex; align-items: center;
      padding: 0 18px; border: none; background: none; cursor: pointer;
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; font-weight: 700;
      color: var(--ink-muted); border-bottom: 3px solid transparent;
      margin-bottom: -2px; letter-spacing: 0.12em; text-transform: uppercase;
      transition: color 0.15s;
    }
    .tab.active { color: var(--navy-ink); border-bottom-color: var(--navy); }

    /* Stories */
    .stories { padding: 8px 20px 40px; }
    .empty {
      padding: 40px 4px; text-align: center; color: var(--meta);
      font-style: italic; font-size: 0.9375rem;
    }
    .card {
      border-top: 1px solid var(--rule); padding: 14px 0; cursor: pointer;
      background: var(--paper); transition: background 0.15s;
    }
    .card.lead { border-top: 3px solid var(--navy); padding: 20px 0 16px; }
    .card.open { background: var(--tint-open); }
    .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card .row-main { flex: 1; min-width: 0; }
    .card .kicker {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; color: var(--red); margin-bottom: 6px; text-transform: uppercase;
    }
    .card .tag {
      color: var(--chip-ink); padding: 2px 6px; margin-right: 8px;
      font-size: 0.5625rem; border-radius: 2px; vertical-align: 1px;
    }
    .card .tag.hot { background: var(--chip-hot); }
    .card .tag.cool { background: var(--chip-cool); }
    .card .headline {
      font-size: 1.0625rem; font-weight: 700; line-height: 1.25; color: var(--ink); margin-bottom: 6px;
    }
    .card.lead .headline { font-size: 1.375rem; }
    .card .sub {
      font-size: 0.875rem; color: var(--ink-sub); line-height: 1.4; margin-bottom: 4px; font-style: italic;
    }
    .card .time { font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta); margin-top: 4px; }
    .card .toggle { color: var(--navy-ink); opacity: 0.5; font-size: 1.125rem; flex-shrink: 0; margin-top: 2px; }
    .card .expand {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    }
    .card .expand .sumtext {
      font-size: 0.9375rem; color: var(--ink-sub); line-height: 1.7;
    }
    .card .expand img {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      background: var(--tint-open); border-radius: 3px; margin-bottom: 12px;
    }
    .card .analysis {
      margin-top: 12px; padding: 10px 14px; background: var(--tint-analysis);
      font-size: 0.875rem; line-height: 1.6; color: var(--ink-sub); font-style: italic;
    }
    .card .analysis .alabel {
      display: block; font-family: 'Arial', sans-serif; font-style: normal;
      font-size: 0.625rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--navy-ink); margin-bottom: 4px;
    }
    .card .readmore {
      display: inline-block; margin-top: 12px; min-height: 44px; line-height: 44px;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink); text-decoration: none;
    }
    .card .readmore:hover { text-decoration: underline; }
    .card .readmore:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    /* Ask AI: hand the clipping and a briefing prompt to a model */
    .card .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .askai, .card .ask-opt {
      border: none; background: none; padding: 0; cursor: pointer;
      min-height: 44px; line-height: 44px; text-decoration: none;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink);
    }
    .card .askai { margin-top: 12px; }
    .card .askai:hover, .card .ask-opt:hover { text-decoration: underline; }
    .card .askai:focus-visible, .card .ask-opt:focus-visible {
      outline: 2px solid var(--focus); outline-offset: 3px;
    }
    .card .ask-panel { display: none; border-top: 1px solid var(--rule-soft); margin-top: 4px; }
    .card .ask-panel.open { display: block; }
    .card .ask-row { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .card .ask-note {
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; line-height: 1.55;
      color: var(--meta); letter-spacing: 0.02em; padding-bottom: 12px;
    }

    /* Footer */
    .footer {
      border-top: 2px solid var(--navy);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta);
      text-align: center; letter-spacing: 0.06em;
    }
    .notice { padding: 40px 20px; text-align: center; color: var(--meta); font-style: italic; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>

mary": "A Toronto teenager has confessed to being recruited as a 'hired-gun' and receiving explicit instructions on how to kill, including specific targeting advice like 'Aim for the body first, then go for his head.' Despite the teen's admission of being influenced by an 'influential adult,' authorities have yet to make any arrests in connection with the adult who allegedly orchestrated the crime. The case highlights concerns about the recruitment of minors into violent acts within the city.", "analysis": "This story reveals a disturbing trend of adult exploitation of minors in violent crime, raising urgent questions about public safety and the vulnerability of youth in Toronto. The failure to apprehend the adult responsible could embolden similar criminal networks, posing an ongoing threat to the community.", "time": "5:00 AM", "tag": "CRIME", "sensitivity": true, "image": null, "link": "https://www.thestar.com/news/gta/toronto-teen-hired-gun-was-coached-on-how-to-kill-aim-for-the-body-first-then-go-for-his-head/article_3af3d44d-7e8f-4622-8daa-ca408e75d64b.html"}, {"id": "t2", "lead": false, "kicker": "EDUCATION", "headline": "Canadians Support School Cellphone Bans, But Toronto Classrooms Divided", "sub": "While a majority of Canadians back cellphone prohibitions in schools, Toronto teachers report significant challenges in enforcing such policies.", "summary": "A majority of Canadians support bans on cellphones in schools, reflecting a national consensus on limiting digital distractions in classrooms. However, in Toronto, a sharp divide exists, with many high school teachers struggling to enforce such policies. One teacher reported asking students to put away phones approximately 50 times per class, underscoring the difficulty of implementation.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/f/5e/f5e0c864-b906-500d-a1ba-d94c2e4097c6/663beb5da885c.image.jpg?resize=300%2C224", "link": "https://www.thestar.com/news/gta/a-majority-of-canadians-support-school-cellphone-bans-but-in-toronto-classrooms-a-sharp-divide-exists/article_b08a4396-3128-43ce-a640-8e1bd8d8c0cf.html"}, {"id": "t3", "lead": false, "kicker": "PUBLIC HEALTH", "headline": "Stay Out of the Water at Three Toronto Public Beaches", "sub": "Toronto Public Health advises against swimming at three city beaches due to poor water quality as of Thursday morning.", "summary": "Toronto Public Health has issued advisories to stay out of the water at three public beaches within the city, effective Thursday morning. The warning comes after the latest water quality report indicated elevated bacteria levels, making the water unsafe for swimming. Residents are advised to check current conditions before visiting other Toronto beaches.", "analysis": null, "time": "5:55 AM", "tag": "HEALTH ADVISORY", "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/f/6b/f6b2487a-9b87-5397-9222-a0fbd887312b/64b959107fcd5.image.jpg?resize=300%2C225", "link": "https://www.thestar.com/news/gta/beach-water-quality/stay-out-of-the-water-at-three-toronto-public-beaches/article_e7bc9396-2123-5b26-8248-403327eb9ad3.html"}, {"id": "t4", "lead": false, "kicker": "TRANSPORTATION", "headline": "Toronto Highway Closures for Planned Roadwork on September 3", "sub": "Sections of Highway 401, Highway 409, Highway 427, and the Queen Elizabeth Way will be affected by scheduled maintenance.", "summary": "Several major Toronto highways, including sections of Highway 401, Highway 409, Highway 427, and the Queen Elizabeth Way, are scheduled for planned roadwork on Thursday, September 3. Motorists should anticipate closures and potential delays as crews conduct maintenance. Drivers are advised to check traffic updates and plan alternative routes to avoid congestion.", "analysis": null, "time": "4:56 AM", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/1/b1/1b1cb060-5453-59cb-9a2c-1587b7880ee6/64b9593cf3051.image.jpg?resize=300%2C138", "link": "https://www.thestar.com/news/gta/highway-closures/toronto-highway-closures-for-planned-roadwork-on-sept-3/article_73d8b190-8652-57c1-9f30-69064d1ff61b.html"}]}, {"id": "world", "label": "World", "stories": [{"id": "w1", "lead": true, "kicker": "MIGRATION CRISIS", "headline": "Spain’s Sánchez Defends Morocco Amid Ceuta Migration Crisis", "sub": "Prime Minister Pedro Sánchez states there is no evidence Morocco played a role in 70,000 migrants crossing into the Spanish enclave.", "summary": "Spanish Prime Minister Pedro Sánchez has publicly defended Morocco, asserting there is no evidence to suggest the country had a role in the recent incident where 70,000 migrants crossed into the Spanish North African territory of Ceuta within hours. Sánchez's remarks come as political opponents call for his removal, criticizing his handling of the crisis and his stance on Morocco's involvement. The mass crossing has intensified diplomatic tensions and raised questions about border security and international cooperation on migration.", "analysis": "The Ceuta migration crisis highlights the complex and often volatile relationship between Spain and Morocco, with significant implications for European border policy. Sánchez's defense of Morocco, despite domestic pressure, suggests a strategic effort to maintain diplomatic ties, which are crucial for managing migration flows and regional stability.", "time": "12:48 PM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/c0dd2ae7e5932bb0877575ffd8448d3b061d544f/850_0_5000_4000/500.jpg", "link": "https://www.theguardian.com/world/live/2026/sep/03/pedro-sanchez-ceuta-migration-crisis-spain-morocco-protests-europe-live-ukraine-russia-italy-latest-news"}, {"id": "w2", "lead": false, "kicker": "HAITI", "headline": "Haitian Elections Set Amid Gang War, Postponement Expected", "sub": "Election officials have scheduled elections for December 13, but experts anticipate extreme violence will force another delay.", "summary": "Haitian election officials have announced December 13 as the date for upcoming elections, despite the nation being gripped by an intense gang war. However, many experts believe that the pervasive extreme violence will inevitably lead to another postponement of the polls. The ongoing instability and lack of security continue to undermine efforts to establish a stable political process in the country.", "analysis": null, "time": "5:02 AM", "tag": "DEVELOPING", "sensitivity": true, "image": null, "link": "https://www.nytimes.com/2026/09/03/world/americas/haiti-election-gangs.html"}, {"id": "w3", "lead": false, "kicker": "INDONESIA", "headline": "Hundreds Suffer Food Poisoning from Government Free Meals in Indonesia", "sub": "Over 800 students and teachers fell ill in three separate incidents across Java and Sumatra, increasing criticism of a presidential program.", "summary": "More than 800 students and teachers in Indonesia have suffered food poisoning this week after consuming government-provided free meals. The incidents occurred in three separate locations across Java and Sumatra, sparking growing criticism of the president's flagship program. Investigations are underway to determine the cause and prevent further outbreaks.", "analysis": null, "time": "5:54 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/e2ae8a14ec300fc7e1ea9b69ddb68de88be19854/596_0_4571_3659/500.jpg", "link": "https://www.theguardian.com/world/2026/sep/03/indonesia-food-poisoning-hundreds-students-teachers-sick-government-free-meals"}, {"id": "w4", "lead": false, "kicker": "UK", "headline": "Care Workers Fleeing Modern Slavery in UK Win Visa Reprieve", "sub": "The Home Office has conceded that skilled workers abused by sponsors can change employers and complete their visa terms.", "summary": "Care workers and other skilled individuals who have fled modern slavery in the UK have won a significant visa reprieve. The Home Office has conceded that these abused workers will now be permitted to change employers and complete the terms of their existing visas. This policy change aims to protect vulnerable migrants from exploitation and provide a pathway to continued legal residency.", "analysis": null, "time": "11:19 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/df5bd73059407de30a5c490ac54685f42e4c0c67/479_12_2905_2325/500.jpg", "link": "https://www.theguardian.com/world/2026/sep/03/care-workers-fleeing-uk-modern-slavery-win-visa-reprieve"}]}, {"id": "sports", "label": "Sports", "stories": [{"id": "s1", "lead": true, "kicker": "NBA", "headline": "Clippers’ $30 Million Fine Tests NBA’s Billionaire Owners", "sub": "The hefty penalty for the Clippers is seen as Commissioner Adam Silver's message to ultra-wealthy team owners about league authority.", "summary": "The NBA has levied a substantial $30 million fine against the Los Angeles Clippers, a move widely interpreted as Commissioner Adam Silver's attempt to assert control over the league's ultra-wealthy ownership class. This hefty punishment is expected to send a clear message that the league office intends to enforce its rules and maintain authority, even against its most affluent stakeholders. The decision could set a precedent for how the NBA handles future infractions by team owners.", "analysis": "This unprecedented fine against a high-profile team owner signals a potential shift in the power dynamic between the NBA commissioner and its billionaire investors. It could lead to increased scrutiny of owner conduct and a more centralized enforcement approach, potentially impacting future team valuations and governance.", "time": "12:18 PM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/3f726b47a2ce1e107748ecc4c0c04dd1dd084a99/1072_0_5362_4292/500.jpg", "link": "https://www.theguardian.com/sport/2026/sep/03/will-the-clippers-30m-fine-tame-the-nbas-billionaire-class-were-about-to-find-out"}, {"id": "s2", "lead": false, "kicker": "CRICKET", "headline": "England v Ireland: Second Women’s Cricket ODI Underway", "sub": "England seeks to follow up its record-breaking run chase with another victory against Ireland in Derby.", "summary": "The second women's cricket One-Day International between England and Ireland is currently in progress in Derby. England aims to build on its recent record-breaking run chase performance with a second consecutive win against the Irish side. Ireland, meanwhile, is looking to bounce back and level the series.", "analysis": null, "time": "12:51 PM", "tag": "LIVE", "sensitivity": false, "image": "https://media.guim.co.uk/6d7c875eede0bd9fbe272aeec2bd098b472f03bf/512_50_4447_3557/500.jpg", "link": "https://www.theguardian.com/sport/live/2026/sep/03/england-v-ireland-second-womens-cricket-one-day-international-live"}, {"id": "s3", "lead": false, "kicker": "US OPEN", "headline": "Columbia’s Michael Zheng Advances at US Open", "sub": "The former Columbia University tennis star won on the same Flushing Meadows grounds where he trained as a child.", "summary": "Former Columbia University tennis star Michael Zheng has advanced at the US Open, securing a victory on the very Flushing Meadows grounds where he honed his skills as a child. Zheng's win marks a significant full-circle moment in his career, joining other American players like Shelton, Tiafoe, and Pegula who also progressed in the tournament.", "analysis": null, "time": "4:59 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/5258f54db7b38fe961641bfd9730aad9eeb00dff/586_0_3498_2799/500.jpg", "link": "https://www.theguardian.com/sport/2026/sep/03/michael-zheng-us-open-americans-shelton-tiafoe-pegula"}, {"id": "s4", "lead": false, "kicker": "BOXING", "headline": "Katie Taylor Eyes Fairytale Ending with Croke Park Homecoming", "sub": "The Irish boxing legend aims to retire as undisputed super-lightweight champion with a victory against Flora Pili on Saturday.", "summary": "Irish boxing legend Katie Taylor is poised for a 'fairytale ending' to her illustrious career with a highly anticipated homecoming fight at Croke Park. Taylor aims to retire as the undisputed super-lightweight champion, with a victory against Flora Pili scheduled for Saturday. The fight represents a pinnacle moment for the Irish icon, bringing her career full circle in front of her home crowd.", "analysis": null, "time": "7:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/871358271eda0d6ce8b70a49ff1cd6009287502a/834_305_4777_3822/500.jpg", "link": "https://www.theguardian.com/sport/2026/sep/03/katie-taylor-croke-park-ireland-boxing-title-fight"}]}, {"id": "business", "label": "Business", "stories": [{"id": "b1", "lead": true, "kicker": "UK ECONOMY", "headline": "Bond Market Turmoil Eases Across Europe; UK Service Sector Growth Jumps", "sub": "Prime Minister Burnham pledges 'fiscal responsibility' as the sell-off calms, but analysts warn of demands for concrete budget answers.", "summary": "Bond market turmoil has shown signs of easing across Europe, with the UK service sector reporting a significant jump in growth. This comes as Prime Minister Burnham has publicly pledged his government will make decisions 'grounded in fiscal responsibility' to calm investor fears following a recent sell-off that threatened his crucial first budget. While the immediate pressure has lessened, analysts warn that bond markets will demand concrete answers and a clear fiscal strategy in the upcoming budget to ensure long-term stability.", "analysis": "The temporary calm in bond markets offers a brief reprieve for Prime Minister Burnham, but the underlying concerns about the UK's fiscal direction persist. The market's reaction to the upcoming budget will be a critical test of investor confidence in the government's economic policies, potentially influencing borrowing costs and the broader economic outlook.", "time": "12:33 PM", "tag": "DEVELOPING", "sensitivity": false, "image": "https://media.guim.co.uk/dec78de4dde1c7a8e455a1c0ae22063ce7128983/1002_0_4557_3646/500.jpg", "link": "https://www.theguardian.com/business/live/2026/sep/03/uk-mortgage-rates-set-to-rise-bond-sell-off-borrowing-costs-latest-news-updates"}, {"id": "b2", "lead": false, "kicker": "US ECONOMY", "headline": "Rate Hike in Play as Fed Officials Await Inflation Data", "sub": "Federal Reserve Governor Christopher J. Waller indicates support for higher rates if inflation progress falters.", "summary": "A potential interest rate hike remains on the table as Federal Reserve officials await crucial inflation data. Federal Reserve Governor Christopher J. Waller expressed optimism about the current trajectory of inflation but indicated he would support further rate increases if progress towards the Fed's targets does not continue. This stance underscores the Fed's cautious approach to monetary policy amid ongoing economic uncertainties.", "analysis": null, "time": "8:30 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/09/03/multimedia/03dc-fed-lpmc/03dc-fed-lpmc-superJumbo.jpg", "link": "https://www.nytimes.com/2026/09/03/business/rate-rise-in-play-as-fed-officials-await-inflation-data.html"}, {"id": "b3", "lead": false, "kicker": "AUSTRALIA", "headline": "Australia’s New Environmental Agency Approves Coal Project, Angering Climate Groups", "sub": "The Queensland open-cut Saraji mine will continue operations until 2055, despite climate concerns and tensions with Pacific leaders.", "summary": "Australia's newly established environmental protection agency has approved the expansion of the Queensland open-cut Saraji coal mine, allowing it to continue operations until 2055. This decision has drawn strong criticism from climate groups and comes amid denials from Prime Minister Anthony Albanese regarding tensions with Pacific leaders over fossil fuel policies. The approval highlights the ongoing debate between economic interests and environmental commitments in Australia.", "analysis": null, "time": "2:23 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/57471addacc49765e22399aa128be4bb6f768c7c/432_0_4320_3456/500.jpg", "link": "https://www.theguardian.com/environment/2026/sep/03/saraji-qld-bhp-bma-coal-project-approved-2055-angering-climate-groups"}, {"id": "b4", "lead": false, "kicker": "CORPORATE", "headline": "BP Seeks to End Boardroom Turmoil with New Chair Appointment", "sub": "Ian Tyler, interim chair, is tasked with refocusing the energy giant's strategy on fossil fuel extraction.", "summary": "BP is aiming to conclude years of boardroom turmoil with the appointment of Ian Tyler as its new chair. Tyler, who has been serving in an interim capacity, is now tasked with shifting the energy giant's strategy to refocus on fossil fuel extraction. This move signals a potential pivot in BP's long-term direction, following a period of leadership instability.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/016bdd2ea70dee777e15c79942e7b5a941d5f253/364_19_2532_2027/500.jpg", "link": "https://www.theguardian.com/business/2026/sep/02/bp-appoints-new-chair-after-ousting-of-albert-manifold-in-may"}]}, {"id": "opinion", "label": "Opinion", "stories": [{"id": "o1", "lead": true, "kicker": "GEOPOLITICS", "headline": "The Wars in Ukraine and Iran Are Becoming Dangerously Enmeshed", "sub": "As the Trump administration refuses to end its war in Iran, it is steering into the storm, not out of it.", "summary": "Christopher S. Chivvis argues that the conflicts in Ukraine and Iran are becoming perilously intertwined, creating a more complex and dangerous global landscape. He contends that the Trump administration's continued refusal to de-escalate its war in Iran is actively pushing the United States deeper into the storm, rather than guiding it towards a resolution. This enmeshment risks broader regional instability and could have unforeseen consequences for international security and alliances.", "analysis": "This analysis suggests that the current U.S. foreign policy approach risks creating a multi-front crisis, diverting resources and attention from each conflict. The interconnectedness of these wars could lead to a more volatile global environment, impacting energy markets, diplomatic relations, and the potential for wider military engagement.", "time": "10:00 AM", "tag": "EDITORIAL", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/commentisfree/2026/sep/03/ukraine-iran-wars-trump"}, {"id": "o2", "lead": false, "kicker": "US POLITICS", "headline": "In 2016, Trump Pledged to Erase Federal Debt. It Just Hit $40 Trillion", "sub": "Steven Greenhouse argues that trillions in tax cuts for the wealthy could have addressed the affordability crisis instead.", "summary": "Steven Greenhouse highlights the stark contrast between Donald Trump's 2016 pledge to erase the federal debt and its current record-high of $40 trillion. Greenhouse argues that the trillions of dollars in tax cuts directed towards the rich and corporations under the Trump administration could have been utilized to address the ongoing affordability crisis facing many Americans. This piece critiques the economic priorities and outcomes of the previous administration.", "analysis": null, "time": "12:00 PM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/69dc0d19317828a13a5bb18a1872dd10afe9d6df/333_0_3333_2667/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/sep/03/trump-federal-debt-40-trillion"}, {"id": "o3", "lead": false, "kicker": "ISRAEL", "headline": "Ben-Gvir Posts Palestinians on Conveyor Belts to Detention Camps. The World is Silent", "sub": "Arwa Mahdawi criticizes the international community for affording Israel 'complete impunity,' enabling figures like Ben-Gvir.", "summary": "Arwa Mahdawi condemns Israeli official Ben-Gvir for posting images depicting Palestinians on conveyor belts to detention camps, and criticizes the international community's silence. Mahdawi argues that Ben-Gvir's rise to power was facilitated by an international community that has afforded Israel 'complete impunity.' This piece highlights concerns about human rights and the perceived lack of accountability for actions against Palestinians.", "analysis": null, "time": "10:00 AM", "tag": "EDITORIAL", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/commentisfree/2026/sep/03/ben-gvir-palestinian-comments"}, {"id": "o4", "lead": false, "kicker": "CHINA", "headline": "China’s Demise Predicted by West, While It Built an AI Revolution", "sub": "Larry Elliott argues that free, high-quality AI models from China will disrupt global markets and offer lessons for Britain.", "summary": "Larry Elliott observes that while the West gleefully predicted China's economic demise, the nation was quietly building an artificial intelligence revolution. Elliott contends that China's development of free AI models, comparable in quality to investment-heavy US versions, is poised to disrupt global markets. He suggests this technological advancement offers a crucial lesson for Britain regarding innovation and economic strategy.", "analysis": null, "time": "7:00 AM", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/4f1e9ac00cecb4a483c365cc7da2de5e4e6e38b3/1016_0_5019_4016/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/sep/03/china-demise-predicted-west-ai-revolution"}]}]}</script>

  <script>
    (function () {
      var raw = document.getElementById('edition').textContent;
      var data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<div class="notice">No edition loaded. Run the build to generate today’s paper.</div>';
        return;
      }

      var state = { active: (data.sections[0] || {}).id, openId: null };

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Editorial heat flags keep the red chip; procedural flags cool to navy,
      // so a red chip still means something (the Scarce Red Rule).
      function isHotTag(t) {
        return /^(DEVELOPING|BREAKING|LIVE|WAR|ALERT|URGENT)$/i.test(t || '');
      }

      // ---- Ask AI ----------------------------------------------------------
      // The reader taps one story and gets a briefing, not a chat. The prompt
      // does three jobs: hand over the clipping, name the shape of the answer
      // (five parts, ~500 words, hard ceiling), and set up the follow-up so the
      // conversation continues without the reader having to think of a question.
      // Voice constraints mirror src/config.py HOUSE_VOICE, em dash ban included.
      function buildPrompt(st, sectionLabel) {
        var L = [];
        L.push('I read this in my morning paper and I want to understand it properly.');
        L.push('');
        L.push('THE CLIPPING');
        L.push('Headline: ' + st.headline);
        if (st.sub) L.push('Standfirst: ' + st.sub);
        if (st.summary) L.push('Summary: ' + st.summary);
        if (st.analysis) L.push("My paper's why-it-matters note: " + st.analysis);
        L.push('Section: ' + sectionLabel + '. Filed ' + (st.time || 'this morning') +
               ', edition of ' + data.date + '.');
        if (st.link) L.push('Source: ' + st.link);
        L.push('');
        L.push('WHAT I WANT');
        L.push('A briefing that leaves me genuinely informed, not a restatement of what I just');
        L.push('pasted. Assume I know nothing beyond the clipping above.');
        L.push('');
        L.push('Check current reporting first if you are able to search. My clipping is a');
        L.push('summary and may be incomplete or already overtaken by events. If you cannot');
        L.push('search, say so in one line at the top, then separate what you are confident');
        L.push('about from what you would want verified.');
        L.push('');
        L.push('STRUCTURE');
        L.push('I am reading this on a phone. Build the answer in layers, heaviest first, so');
        L.push('I can stop at the end of any layer and still have got something whole. Use');
        L.push('these markdown headings exactly, so they render large on a small screen.');
        L.push('');
        L.push('# The gist');
        L.push('An H1 of six to ten words stating the actual point, not the topic. Then two or');
        L.push('three short sentences giving me the whole story in plain words. If I read');
        L.push('nothing else, this is what I walk away knowing. Correct my clipping here if it');
        L.push('is wrong or out of date.');
        L.push('');
        L.push('## Why it matters');
        L.push('Two or three short sentences on the stakes and the second order effects. Be');
        L.push('concrete about who gains, who pays, how much, and by when.');
        L.push('');
        L.push('## How we got here');
        L.push('Only the background I need to follow this story. Not a history lecture.');
        L.push('');
        L.push('## Where it is contested');
        L.push('The strongest disagreement among serious people, put fairly. If it is genuinely');
        L.push('uncontested, say so in one sentence and move on.');
        L.push('');
        L.push('## What to watch');
        L.push('Three bullets, each a specific checkable marker with a rough timeframe.');
        L.push('');
        L.push('## Ask me next');
        L.push('Three numbered questions, ordered by what would teach me the most. I will reply');
        L.push('with a digit.');
        L.push('');
        L.push('READING ON A PHONE');
        L.push('Short paragraphs: three sentences at most, none longer than about sixty words,');
        L.push('with a blank line between them. No tables, no nested bullets, no wall of text.');
        L.push('Around 500 words in total. Hard ceiling 650. Do not pad to reach a length; the');
        L.push('gist and why it matters are worth more than the sections under them.');
        L.push('');
        L.push('VOICE');
        L.push('Financial Times, not an encyclopedia and not a chatbot. Plain, confident,');
        L.push('concrete. Specifics over abstractions: names, numbers, dates, stakes. Every');
        L.push('sentence earns its place. No preamble, no throat clearing, no restating my');
        L.push('prompt back to me, no hedging filler, no em dashes. Where you are uncertain,');
        L.push('mark it in the sentence it applies to rather than in a disclaimer paragraph.');
        return L.join('\n');
      }

      function findStory(id) {
        for (var i = 0; i < data.sections.length; i++) {
          var list = data.sections[i].stories || [];
          for (var j = 0; j < list.length; j++) {
            if (list[j].id === id) {
              return { story: list[j], label: data.sections[i].label };
            }
          }
        }
        return null;
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        // Older iOS standalone PWAs land here.
        return new Promise(function (resolve, reject) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('copy failed'));
        });
      }

      // Tagline reflects the sections the edition actually shipped, not a
      // hardcoded list that can disagree with the paper.
      function taglineText() {
        var labels = data.sections
          .filter(function (s) { return s.id !== 'front'; })
          .map(function (s) { return s.label; });
        return (labels.length ? labels : ['Toronto', 'World', 'Business']).join(' · ');
      }

      function weatherHtml(w) {
        if (!w || !w.icon) return '';
        var week = (w.week || []).map(function (d) {
          return '<div class="day"><div class="d">' + esc(d.day) + '</div>' +
            '<div class="i">' + esc(d.icon) + '</div>' +
            '<div class="hi">' + esc(d.hi) + '°</div>' +
            '<div class="lo">' + esc(d.lo) + '°</div></div>';
        }).join('');
        return '<div class="weather" id="weather" role="button" tabindex="0" ' +
          'aria-expanded="false" aria-label="Toronto weather, tap for the week">' +
          '<div class="summary">' +
            '<span class="ico">' + esc(w.icon) + '</span>' +
            '<span class="city">Toronto</span>' +
            '<span class="temp">' + esc(w.high) + '° / ' + esc(w.low) + '°</span>' +
            '<span class="muted">' + esc(w.condition) + '</span>' +
            '<span class="muted">Rain ' + esc(w.rain) + '</span>' +
            '<span class="muted">Wind ' + esc(w.wind) + '</span>' +
            '<span class="chev" id="wchev">▼</span>' +
          '</div>' +
          '<div class="week" id="wweek" style="display:none">' + week + '</div>' +
        '</div>';
      }

      function tabsHtml() {
        return '<div class="tabs" role="tablist">' + data.sections.map(function (s) {
          var on = s.id === state.active;
          return '<button class="tab' + (on ? ' active' : '') + '" role="tab" ' +
            'aria-selected="' + on + '" data-tab="' + esc(s.id) + '">' + esc(s.label) + '</button>';
        }).join('') + '</div>';
      }

      function cardHtml(st, sectionLabel) {
        var open = st.id === state.openId;
        var tag = st.tag
          ? '<span class="tag ' + (isHotTag(st.tag) ? 'hot' : 'cool') + '">' + esc(st.tag) + '</span>'
          : '';
        var kicker = st.kicker ? '<div class="kicker">' + tag + esc(st.kicker) + '</div>' : '';
        var sub = st.sub ? '<div class="sub">' + esc(st.sub) + '</div>' : '';
        var expand = '';
        if (open) {
          var img = st.image
            ? '<img src="' + esc(st.image) + '" alt="' + esc(st.headline) + '" ' +
              'loading="lazy" onerror="this.remove()" />'
            : '';
          var analysis = st.analysis
            ? '<div class="analysis"><span class="alabel">Why it matters</span>' + esc(st.analysis) + '</div>'
            : '';
          var link = st.link
            ? '<a class="readmore" href="' + esc(st.link) + '" target="_blank" rel="noopener">Read full story →</a>'
            : '';

          // Prefill the destinations at render time so a long press ("open in
          // app") carries the prompt too, instead of us intercepting the tap.
          var q = encodeURIComponent(buildPrompt(st, sectionLabel));
          // No target="_blank" on these two. In a standalone PWA a blank target
          // opens an in-app browser sheet, which iOS will not hand off to an
          // installed app; a plain top-level tap is what lets the Claude and
          // ChatGPT apps claim their own domains as Universal Links. "Read full
          // story" keeps _blank, because a news site does belong in a tab.
          var share = navigator.share
            ? '<button class="ask-opt" data-ai="share" data-id="' + esc(st.id) + '">Share to app…</button>'
            : '';
          var actions = '<div class="actions">' + link +
            '<button class="askai" data-ask="' + esc(st.id) + '" aria-expanded="false" ' +
              'aria-controls="ask-' + esc(st.id) + '">Ask AI ▾</button></div>' +
            '<div class="ask-panel" id="ask-' + esc(st.id) + '">' +
              '<div class="ask-row">' +
                '<a class="ask-opt" href="https://claude.ai/new?q=' + esc(q) + '">Claude</a>' +
                '<a class="ask-opt" href="https://chatgpt.com/?q=' + esc(q) + '">ChatGPT</a>' +
                share +
                '<button class="ask-opt" data-ai="copy" data-id="' + esc(st.id) + '">Copy</button>' +
              '</div>' +
              '<div class="ask-note">Opens in the app if you have it installed. The reply ' +
                'starts with the gist in a few lines, then goes deeper, then offers three ' +
                'follow-up questions.</div>' +
            '</div>';

          expand = '<div class="expand">' + img +
            '<p class="sumtext">' + esc(st.summary) + '</p>' + analysis + actions + '</div>';
        }
        return '<div class="card' + (st.lead ? ' lead' : '') + (open ? ' open' : '') +
          '" data-card="' + esc(st.id) + '" role="button" tabindex="0" ' +
          'aria-expanded="' + open + '">' +
          '<div class="row"><div class="row-main">' + kicker +
            '<div class="headline">' + esc(st.headline) + '</div>' + sub +
            '<div class="time">' + esc(st.time) + '</div></div>' +
            '<div class="toggle" aria-hidden="true">' + (open ? '−' : '+') + '</div>' +
          '</div>' + expand +
        '</div>';
      }

      function storiesInner() {
        var section = data.sections.filter(function (s) { return s.id === state.active; })[0];
        if (!section) return '';
        if (!section.stories || !section.stories.length) {
          return '<div class="empty">Nothing filed for ' + esc(section.label) + ' this morning.</div>';
        }
        return section.stories.map(function (st) {
          return cardHtml(st, section.label);
        }).join('');
      }

      // Quietly flag a saved (not-today) edition served from cache/offline.
      function staleRibbon() {
        try {
          var meta = document.querySelector('meta[name=build]');
          if (!meta) return '';
          var built = new Date(meta.getAttribute('content'));
          if (isNaN(built.getTime())) return '';
          var opt = { timeZone: 'America/Toronto' };
          if (built.toLocaleDateString('en-CA', opt) < new Date().toLocaleDateString('en-CA', opt)) {
            return '<div class="stale">Saved edition · ' + esc(data.date) + '</div>';
          }
        } catch (e) {}
        return '';
      }

      function appHtml() {
        return '<div class="masthead">' +
            '<div class="date">' + esc(data.date) + '</div>' +
            '<div class="title">THE DAILY</div>' +
            '<div class="tagline">' + esc(taglineText()) + '</div>' +
          '</div>' +
          staleRibbon() +
          weatherHtml(data.weather) +
          tabsHtml() +
          '<div class="stories" id="stories">' + storiesInner() + '</div>' +
          '<div class="footer">THE DAILY · TORONTO · Tap any headline to read</div>';
      }

      var app = document.getElementById('app');

      // Rebuild only the stories column; masthead, weather, and tab strip (and
      // their scroll/open state) are left untouched. This is what keeps a tap
      // from resetting the reader's place.
      function refreshStories() {
        document.getElementById('stories').innerHTML = storiesInner();
        bindCards();
      }

      function selectTab(id) {
        if (id === state.active) return;
        state.active = id;
        state.openId = null;
        var tabs = document.querySelectorAll('.tab');
        Array.prototype.forEach.call(tabs, function (t) {
          var on = t.getAttribute('data-tab') === id;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on);
          if (on) t.scrollIntoView({ inline: 'center', block: 'nearest' });
        });
        refreshStories();
        // Start the new section at the top, tab strip stuck under the notch.
        var tabsEl = document.querySelector('.tabs');
        if (tabsEl) window.scrollTo(0, tabsEl.offsetTop);
      }

      function toggleCard(id) {
        var y = window.scrollY;
        state.openId = state.openId === id ? null : id;
        refreshStories();
        window.scrollTo(0, y);   // grow/collapse in place, never jump
      }

      function bindWeather() {
        var weather = document.getElementById('weather');
        if (!weather) return;
        function toggle() {
          var week = document.getElementById('wweek');
          var chev = document.getElementById('wchev');
          var showing = week.style.display !== 'none';
          week.style.display = showing ? 'none' : 'flex';
          chev.textContent = showing ? '▼' : '▲';
          weather.setAttribute('aria-expanded', String(!showing));
        }
        weather.addEventListener('click', toggle);
        weather.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
        });
      }

      function bindTabs() {
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
          btn.addEventListener('click', function () { selectTab(btn.getAttribute('data-tab')); });
        });
      }

      function bindCards() {
        Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
          function activate(ev) {
            // Let links and the Ask AI controls handle their own activation.
            if (ev.target.closest('a, button')) return;
            // While open, only the header row collapses it, so reading (and
            // selecting) the body never closes the story by accident.
            if (card.classList.contains('open') && !ev.target.closest('.row')) return;
            toggleCard(card.getAttribute('data-card'));
          }
          card.addEventListener('click', activate);
          card.addEventListener('keydown', function (ev) {
            if (ev.key !== 'Enter' && ev.key !== ' ') return;
            // Never swallow the key from a control that acts on it itself.
            if (ev.target.closest('a, button')) return;
            ev.preventDefault();
            activate(ev);
          });
          bindAsk(card);
        });
      }

      // Panel state is held in the DOM, not in `state`, so opening the
      // destinations never triggers a stories rebuild and never moves the page.
      function bindAsk(card) {
        var toggle = card.querySelector('.askai');
        if (!toggle) return;
        var panel = card.querySelector('.ask-panel');

        toggle.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var open = panel.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(open));
          toggle.textContent = open ? 'Ask AI ▴' : 'Ask AI ▾';
        });

        Array.prototype.forEach.call(panel.querySelectorAll('[data-ai]'), function (el) {
          var kind = el.getAttribute('data-ai');
          el.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var found = findStory(el.getAttribute('data-id'));
            if (!found) return;
            var prompt = buildPrompt(found.story, found.label);

            if (kind === 'share') {
              navigator.share({ text: prompt }).catch(function () {});
              return;
            }
            var label = el.textContent;
            copyText(prompt).then(function () {
              el.textContent = 'Copied';
            }).catch(function () {
              el.textContent = 'Copy failed';
            }).then(function () {
              setTimeout(function () { el.textContent = label; }, 1800);
            });
          });
        });
      }

      app.innerHTML = appHtml();
      bindWeather();
      bindTabs();
      bindCards();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
