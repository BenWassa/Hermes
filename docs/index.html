  <title>The Daily</title>
  <style>
    /* ---- Design tokens: The Morning Broadsheet ------------------------- */
    :root {
      --paper: #faf8f3;        /* the sheet (warm white, never #fff) */
      --desk: #efece6;         /* the desk beyond the column */
      --ink: #17130d;          /* headlines / primary text */
      --ink-sub: #453f38;      /* standfirsts */
      --ink-muted: #635d54;    /* inactive tabs */
      --meta: #6c665c;         /* timestamps, dateline, footer (>=AA small) */
      --rule: #dcd6cc;         /* hairline between cards */
      --rule-soft: #e3ded4;    /* hairline inside an opened card */
      --navy: #1a2744;         /* structural ink */
      --navy-ink: #1a2744;     /* navy used as text (links, active tab) */
      --red: #8b1a1a;          /* editorial heat */
      --tint-open: #f2ede4;    /* ground of an expanded card */
      --tint-analysis: #ece6da;/* ground of the why-it-matters note */
      --strip-bg: #1a2744;     /* weather strip */
      --strip-ink: #f7f4ee;
      --chip-hot: #8b1a1a;     /* DEVELOPING / WAR-class flags */
      --chip-cool: #1a2744;    /* procedural flags (FINAL, EDITORIAL) */
      --chip-ink: #faf8f3;
      --focus: #1a2744;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151a22;      /* lamplight edition: deep navy-black paper */
        --desk: #0e1219;
        --ink: #e9e3d5;        /* cream ink */
        --ink-sub: #bcb6a8;
        --ink-muted: #948e82;
        --meta: #8f897d;
        --rule: #2a303a;
        --rule-soft: #2f3540;
        --navy: #6f82a8;       /* structure lifted so it reads on dark */
        --navy-ink: #a3b3d2;
        --red: #d1726b;        /* desaturated heat */
        --tint-open: #1b212b;
        --tint-analysis: #20262f;
        --strip-bg: #1b2334;
        --strip-ink: #e9e3d5;
        --chip-hot: #a8443c;
        --chip-cool: #3b4a6c;
        --chip-ink: #f0eadc;
        --focus: #a3b3d2;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 100%; }
    html, body { background: var(--desk); }
    body {
      font-family: 'Georgia', serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--paper);
      max-width: 680px;
      margin: 0 auto;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Masthead */
    .masthead {
      border-bottom: 4px solid var(--navy);
      padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
      background: var(--paper);
    }
    .masthead .date {
      font-size: 0.6875rem; color: var(--meta); letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .masthead .title {
      font-size: 2.375rem; font-weight: 700; letter-spacing: -0.01em;
      color: var(--navy); line-height: 1; margin-bottom: 2px;
    }
    .masthead .tagline {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; color: var(--meta);
      letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* Stale-edition ribbon */
    .stale {
      background: var(--tint-analysis); color: var(--meta);
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; text-align: center;
      padding: 7px 20px;
    }

    /* Weather strip */
    .weather {
      background: var(--strip-bg); color: var(--strip-ink);
      cursor: pointer; user-select: none;
    }
    .weather .summary {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
      min-height: 44px;
    }
    .weather .summary::-webkit-scrollbar { display: none; }
    .weather .ico { font-size: 1.375rem; }
    .weather .city { font-weight: 700; font-size: 0.9375rem; }
    .weather .temp { font-size: 0.9375rem; }
    .weather .muted { opacity: 0.72; font-size: 0.8125rem; white-space: nowrap; }
    .weather .chev { margin-left: auto; opacity: 0.6; font-size: 0.75rem; }
    .weather .week {
      display: flex; border-top: 1px solid rgba(255,255,255,0.12);
      padding: 10px 20px; overflow-x: auto; scrollbar-width: none;
    }
    .weather .week::-webkit-scrollbar { display: none; }
    .weather .day {
      text-align: center; min-width: 52px; padding: 0 8px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .weather .day .d { font-size: 0.6875rem; opacity: 0.6; margin-bottom: 4px; }
    .weather .day .i { font-size: 1.125rem; }
    .weather .day .hi { font-size: 0.8125rem; font-weight: 700; margin-top: 4px; }
    .weather .day .lo { font-size: 0.6875rem; opacity: 0.5; }

    /* Tab nav */
    .tabs {
      display: flex; overflow-x: auto; border-bottom: 2px solid var(--navy);
      background: var(--paper); scrollbar-width: none;
      position: sticky; top: 0; z-index: 10;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; min-height: 44px; display: flex; align-items: center;
      padding: 0 18px; border: none; background: none; cursor: pointer;
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; font-weight: 700;
      color: var(--ink-muted); border-bottom: 3px solid transparent;
      margin-bottom: -2px; letter-spacing: 0.12em; text-transform: uppercase;
      transition: color 0.15s;
    }
    .tab.active { color: var(--navy-ink); border-bottom-color: var(--navy); }

    /* Stories */
    .stories { padding: 8px 20px 40px; }
    .empty {
      padding: 40px 4px; text-align: center; color: var(--meta);
      font-style: italic; font-size: 0.9375rem;
    }
    .card {
      border-top: 1px solid var(--rule); padding: 14px 0; cursor: pointer;
      background: var(--paper); transition: background 0.15s;
    }
    .card.lead { border-top: 3px solid var(--navy); padding: 20px 0 16px; }
    .card.open { background: var(--tint-open); }
    .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card .row-main { flex: 1; min-width: 0; }
    .card .kicker {
      font-family: 'Arial', sans-serif; font-size: 0.625rem; font-weight: 700;
      letter-spacing: 0.12em; color: var(--red); margin-bottom: 6px; text-transform: uppercase;
    }
    .card .tag {
      color: var(--chip-ink); padding: 2px 6px; margin-right: 8px;
      font-size: 0.5625rem; border-radius: 2px; vertical-align: 1px;
    }
    .card .tag.hot { background: var(--chip-hot); }
    .card .tag.cool { background: var(--chip-cool); }
    .card .headline {
      font-size: 1.0625rem; font-weight: 700; line-height: 1.25; color: var(--ink); margin-bottom: 6px;
    }
    .card.lead .headline { font-size: 1.375rem; }
    .card .sub {
      font-size: 0.875rem; color: var(--ink-sub); line-height: 1.4; margin-bottom: 4px; font-style: italic;
    }
    .card .time { font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta); margin-top: 4px; }
    .card .toggle { color: var(--navy-ink); opacity: 0.5; font-size: 1.125rem; flex-shrink: 0; margin-top: 2px; }
    .card .expand {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    }
    .card .expand .sumtext {
      font-size: 0.9375rem; color: var(--ink-sub); line-height: 1.7;
    }
    .card .expand img {
      display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      background: var(--tint-open); border-radius: 3px; margin-bottom: 12px;
    }
    .card .analysis {
      margin-top: 12px; padding: 10px 14px; background: var(--tint-analysis);
      font-size: 0.875rem; line-height: 1.6; color: var(--ink-sub); font-style: italic;
    }
    .card .analysis .alabel {
      display: block; font-family: 'Arial', sans-serif; font-style: normal;
      font-size: 0.625rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--navy-ink); margin-bottom: 4px;
    }
    .card .readmore {
      display: inline-block; margin-top: 12px; min-height: 44px; line-height: 44px;
      font-family: 'Arial', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--navy-ink); text-decoration: none;
    }
    .card .readmore:hover { text-decoration: underline; }
    .card .readmore:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    /* Footer */
    .footer {
      border-top: 2px solid var(--navy);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      font-family: 'Arial', sans-serif; font-size: 0.6875rem; color: var(--meta);
      text-align: center; letter-spacing: 0.06em;
    }
    .notice { padding: 40px 20px; text-align: center; color: var(--meta); font-style: italic; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>

rs targets Russian individuals and interests, impacting world chess leadership.", "summary": "The European Union has unveiled its largest sanctions package in four years, targeting Russian individuals and interests. Among the measures, the Russian president of world chess has been ousted, signaling the EU's continued pressure on Russia over the Ukraine war. The new sanctions mark day 1,612 of the conflict, as international efforts persist to isolate Russia economically and politically.", "analysis": null, "time": "1:32 AM", "tag": "WAR", "sensitivity": true, "image": null, "link": "https://www.theguardian.com/world/2026/jul/24/ukraine-war-briefing-eu-sanctions-oust-russian-president-of-world-chess"}, {"id": "f5", "lead": false, "kicker": "TORONTO", "headline": "U of T Professor Jacob Tsimerman Wins Fields Medal", "sub": "Mathematics professor and alumnus recognized with the highest honor in the field, often called the 'Nobel of math.'", "summary": "Jacob Tsimerman, a professor and graduate of the University of Toronto, has been awarded the prestigious Fields Medal, widely considered the highest honor in mathematics. The university celebrated the achievement of its own, recognizing Tsimerman's significant contributions to the field. This marks a major milestone for both the professor and the institution, elevating Toronto's profile in global academic circles.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/3/a4/3a4242b4-549f-5dab-adf8-61d3f25cd425/6a629971835bb.image.jpg?resize=300%2C200", "link": "https://www.thestar.com/news/gta/proving-ground-inside-the-moment-u-of-t-celebrated-one-of-its-own-winning-maths-highest-honour/article_54557cdf-3f57-4c7d-8405-dc26dbe5c8d4.html"}]}, {"id": "toronto", "label": "Toronto", "stories": [{"id": "t1", "lead": true, "kicker": "CITY PLANNING", "headline": "Billy Bishop Airport Expansion Looms Over Don River Revitalization", "sub": "Over a billion dollars invested in the Don River's green oasis faces uncertainty with proposed jet expansion at the city's island airport.", "summary": "More than a billion dollars has been spent on revitalizing the Don River, with the city opening more of Biidaasige Park in the Port Lands to the public today. However, the proposed expansion of Billy Bishop airport to accommodate jets casts a shadow over the future of this newly renovated green space. Critics are concerned about the potential environmental and noise impacts on the reborn urban oasis, questioning if the city's investment in green infrastructure will be undermined by airport development.", "analysis": "The debate over Billy Bishop Airport's expansion highlights a recurring tension in Toronto between economic development and environmental preservation. The outcome will set a precedent for how the city balances infrastructure growth with its commitment to green spaces and climate resilience, impacting quality of life for residents and the long-term health of the waterfront.", "time": "5:00 AM", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/8/66/866afc15-3809-5537-ab9f-c6c43ac21121/6a5f9d9f942cf.image.jpg?resize=300%2C225", "link": "https://www.thestar.com/news/gta/more-than-a-billion-dollars-has-been-spent-on-fixing-the-don-river-what-would-jets-at-billy-bishop-do-to-the-citys-reborn-green-oasis/article_88992d7c-fb7a-49dd-a703-d932e7779de0.html"}, {"id": "t2", "lead": false, "kicker": "COURTS", "headline": "Oshawa Judge Troubled by Complainant FaceTiming During Sex Assault Trial", "sub": "Superior Court judge criticizes complainant for using phone during testimony and court worker for delayed reporting.", "summary": "An Oshawa Superior Court judge has expressed deep concern after a sex assault complainant was found FaceTiming with her boyfriend while testifying at trial. The judge also criticized the court worker assigned to the case for failing to flag the complainant's actions to the Crown earlier. This incident raises serious questions about courtroom decorum and the integrity of judicial proceedings.", "analysis": null, "time": "5:00 AM", "tag": null, "sensitivity": true, "image": null, "link": "https://www.thestar.com/news/gta/while-testifying-at-trial-a-sex-assault-complainant-was-also-facetiming-with-her-boyfriend-an-oshawa-judge-calls-it-very-troubling/article_c793ece5-29af-41e1-a976-94ed1c40ca4c.html"}, {"id": "t3", "lead": false, "kicker": "PUBLIC HEALTH", "headline": "Canadian Pistachio Salmonella Outbreak Declared Over, 79 Cases in Ontario", "sub": "Public Health Agency of Canada confirms 200 cases nationwide, with actual numbers likely much higher.", "summary": "The Public Health Agency of Canada has declared the national pistachio salmonella outbreak over, confirming 200 cases across the country, including 79 in Ontario. Officials noted that the actual number of individuals sickened by the contaminated pistachios is likely significantly higher than reported. The outbreak prompted widespread recalls and public health warnings.", "analysis": null, "time": "Yesterday", "tag": "FINAL", "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/c/4f/c4fef3e3-5ea7-5594-8a0a-b1a49f28a588/6a625ddcadbd6.image.jpg?resize=300%2C200", "link": "https://www.thestar.com/news/salmonella-outbreak-pistachios-canada-july-22/article_3551b8cb-6209-5acd-b2b7-f4943b9fbd37.html"}, {"id": "t4", "lead": false, "kicker": "MUNICIPAL POLITICS", "headline": "Mayoral Candidate Brad Bradford Pledges 1,000 New Police Officers", "sub": "Beaches-East York councillor announces significant policing increase without detailing funding plan.", "summary": "Toronto mayoral candidate Brad Bradford, the Beaches-East York councillor, has pledged to hire 1,000 new police officers for the city. The ambitious proposal, which would likely cost tens of millions of dollars, was announced without a detailed plan for its funding. This commitment signals a focus on public safety as a key issue in the upcoming mayoral race.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://bloximages.chicago2.vip.townnews.com/thestar.com/content/tncms/assets/v3/editorial/1/25/12520885-4ec8-53c1-a304-b6806e56cdb0/6a62603fa03d2.image.jpg?resize=300%2C200", "link": "https://www.thestar.com/news/gta/mayoral-candidate-brad-bradford-pledges-to-hire-1000-new-toronto-police-officers/article_bb626256-cda8-4312-8467-394b49773ac2.html"}]}, {"id": "world", "label": "World", "stories": [{"id": "w1", "lead": true, "kicker": "IRAN", "headline": "Iranians Say Life on Hold Amid Months of War and Economic Crisis", "sub": "Cycles of violence and economic devastation leave many Iranians giving up on work and their futures as US strikes continue.", "summary": "Many Iranians report their lives are on hold, devastated by continuous cycles of violence and economic crisis as the United States continues its strikes against Iran. Citizens are increasingly giving up on work and their futures, with widespread despair over the prolonged conflict. The ongoing instability has crippled daily life and shattered hopes for a return to normalcy, leaving a generation struggling to cope with relentless hardship.", "analysis": "The deep human toll reported from Iran underscores the devastating long-term consequences of protracted conflict, extending far beyond immediate casualties to impact an entire society's social and economic fabric. This internal perspective highlights the urgent need for de-escalation and humanitarian aid, as the conflict risks creating a lost generation.", "time": "5:04 AM", "tag": "WAR", "sensitivity": true, "image": null, "link": "https://www.nytimes.com/2026/07/24/world/middleeast/iran-war-cycle.html"}, {"id": "w2", "lead": false, "kicker": "INDIA", "headline": "India's Young Protesters Use Memes to Challenge Modi's Media Control", "sub": "A Gen Z-led movement leverages videos and memes to seize the digital narrative, puncturing Prime Minister Modi's carefully constructed image.", "summary": "A new Gen Z-led protest movement in India is effectively using videos and memes to bypass traditional media and challenge Prime Minister Narendra Modi's tightly controlled public image. This digital strategy allows young activists to seize the narrative online, puncturing Modi's carefully constructed persona. The innovative approach demonstrates a shift in how political discourse is shaped in the country, leveraging social media for widespread impact.", "analysis": null, "time": "5:49 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/07/24/multimedia/24int-india-protest-memes-01-whkb/24int-india-protest-memes-01-whkb-superJumbo.jpg", "link": "https://www.nytimes.com/2026/07/24/world/asia/india-cockroach-party-cjp-protest-memes.html"}, {"id": "w3", "lead": false, "kicker": "VENEZUELA", "headline": "Poverty Divides Even the Dead After Venezuela Earthquakes", "sub": "Latin America's deep-seated inequalities persist, affecting funeral costs and setting earthquake victims apart.", "summary": "Latin America's profound inequalities have extended even to death following the Venezuela earthquakes, with poverty dictating how victims are laid to rest. The grimly equalizing force of disaster has been overshadowed by disparities in funeral costs and access to dignified burials, particularly in areas like La Guaira. This stark reality highlights how deep-seated economic divides continue to separate communities, even in moments of shared tragedy.", "analysis": null, "time": "5:02 AM", "tag": "DISASTER", "sensitivity": true, "image": null, "link": "https://www.nytimes.com/2026/07/24/world/americas/venezuela-earthquake-dead-costs-la-guaira.html"}, {"id": "w4", "lead": false, "kicker": "MYANMAR", "headline": "Myanmar Health Sys nner still emerge.", "time": "6:17 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/62f130426380531e48243b2fdfd465cd91f3273a/469_0_3395_2717/500.jpg", "link": "https://www.theguardian.com/sport/live/2026/jul/24/commonwealth-games-2026-day-one-updates-swimming-powerlifting-gymnastics-boxing-live"}, {"id": "s2", "lead": false, "kicker": "CHESS", "headline": "11-Year-Old Bodhana Sivanandan Breaks World Chess Record", "sub": "Harrow schoolgirl eclipses Judit Polgar's 38-year-old mark as youngest girl to defeat a grandmaster rated above 2600.", "summary": "Bodhana Sivanandan, an 11-year-old schoolgirl from Harrow, has made chess history by breaking a 38-year-old world age record. She became the youngest girl ever to defeat a grandmaster rated above 2600, surpassing the legendary Judit Polgar's mark. Sivanandan further demonstrated her prowess by drawing with a former 2700-rated player, signaling a remarkable talent in the chess world.", "analysis": null, "time": "7:00 AM", "tag": "RECORD", "sensitivity": false, "image": "https://media.guim.co.uk/60f3ed8f874aaf6988ca6f5907536c2bf00dec21/444_0_4442_3553/500.jpg", "link": "https://www.theguardian.com/sport/2026/jul/24/chess-bodhana-sivanandan-11-breaks-world-age-record-from-38-years-ago"}, {"id": "s3", "lead": false, "kicker": "BOXING", "headline": "Fury and Joshua Prepare for $100M Showdown with Low-Risk Fights", "sub": "Tyson Fury and Anthony Joshua face minor opponents this weekend, building anticipation for their long-awaited mega-fight.", "summary": "Tyson Fury and Anthony Joshua are returning to the ring this weekend against low-risk opponents, a strategic move to prepare for their long-trailed $100 million showdown. These preparatory bouts are designed to maintain momentum and fitness ahead of the highly anticipated clash between the two boxing giants. Fans eagerly await the overdue fight, which promises to be one of the biggest in recent memory.", "analysis": null, "time": "7:00 AM", "tag": owing impact of climate change on economic activity. While beneficial for some sectors in the short term, it also underscores the increasing volatility and unpredictability that businesses must contend with, potentially driving investment into climate-resilient infrastructure and product lines.", "time": "5:54 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/9179743e31066ae0eeb7bba9b64209b64209b7be7b1cc1/1223_0_6829_5464/500.jpg", "link": "https://www.theguardian.com/business/2026/jul/24/heatwave-and-online-shopping-drive-up-retail-sales-in-great-britain"}, {"id": "b2", "lead": false, "kicker": "AVIATION", "headline": "Qantas Tests Ultra Long-Range Airbus on 17,000km Flight to Melbourne", "sub": "Airbus A350-1000ULR becomes most-watched plane during Project Sunrise test flight from France.", "summary": "Qantas is testing a new ultra long-range Airbus A350-1000ULR with a 17,000km direct flight from France to Melbourne. This test, part of Qantas's Project Sunrise, saw the aircraft become the most-watched plane on flight tracking websites. The initiative aims to establish direct routes that significantly reduce travel times, pushing the boundaries of commercial aviation capabilities.", "analysis": null, "time": "12:39 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/bb0caceb6e25fb246238fd52a29bacdd54240523/184_0_4919_3935/500.jpg", "link": "https://www.theguardian.com/business/2026/jul/24/qantas-project-sunrise-airbus-a350-1000ulr-ultra-long-range-france-melbourne-test-flight"}, {"id": "b3", "lead": false, "kicker": "ENERGY", "headline": "British Gas Owner Centrica Axes 1,300 Call Centre Jobs, Citing AI Chatbots", "sub": "CEO Chris O'Shea defends decision as company reports rising retail profits and customer preference for AI.", "summary": "Centrica, the owner of British Gas, is cutting 1,300 call centre jobs, with CEO Chris O'Shea stating that customers prefer AI chatbots. The decision comes as the company reports a rise in retail profits, attributed to a focus on bigger margins. This move signals a significant shift towards automation in customer service, raising concerns about job displacement in the energy sector.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/af7587cc20c303a962f490f42006ca79318d8bde/674_0_2698_2157/500.jpg", "link": "https://www.theguardian.com/business/2026/jul/23/customers-prefer-ai-chatbots-says-chris-oshea-british-gas-centrica-boss"}, {"id": "b4", "lead": false, "kicker": "SPORTS BUSINESS", "headline": "Tour de France Family Owners Criticized for Withholding Media Revenue", "sub": "The Amaury family, owners of the Tour de France, face backlash for not sharing $170 million in media revenue, allegedly harming the sport.", "summary": "The Amaury family, who own the Tour de France, are facing criticism for reportedly withholding $170 million in media revenue from sponsors and riders. Critics argue that this resistance to sharing profits is dooming the sport, hindering its growth and financial stability. The controversy highlights a significant power imbalance within professional cycling, with calls for a more equitable distribution of earnings.", "analysis": null, "time": "5:05 AM", "tag": null, "sensitivity": false, "image": "https://static01.nyt.com/images/2026/07/23/multimedia/23biz-tourdefrance-qwtz/23biz-tourdefrance-qwtz-superJumbo.jpg", "link": "https://www.nytimes.com/2026/07/24/business/tour-de-france-amaury-aso.html"}]}, {"id": "opinion", "label": "Opinion", "stories": [{"id": "o1", "lead": true, "kicker": "EDITORIAL", "headline": "The Guardian View: Europe's Demographic Crisis Demands Urgent Debate", "sub": "A new Brussels study highlights the rapid aging of EU countries, necessitating an informed public discussion on intergenerational consequences.", "summary": "A Guardian editorial argues that Europe's accelerating demographic crisis, underscored by a new Brussels study on the rapid aging of EU countries, demands an urgent and informed public debate. The editorial stresses that the young must not be left to deal with the profound economic and social consequences alone. It calls for a comprehensive discussion on how to address declining birth rates and increasing life expectancy, and the resulting strain on social services and economic productivity.", "analysis": "This editorial highlights a critical long-term challenge for Europe, linking demographic shifts to broader societal stability. The call for public debate suggests a recognition that policy solutions will require broad societal buy-in, potentially influencing future debates on immigration, social welfare reform, and intergenerational equity across the continent.", "time": "Yesterday", "tag": "EDITORIAL", "sensitivity": false, "image": "https://media.guim.co.uk/6df04d8482181cd2b07986bf6b4d7c4b938ff283/78_0_5000_4000/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/jul/23/the-guardian-view-on-europes-demographic-crisis-the-young-must-not-be-left-to-deal-with-the-consequences"}, {"id": "o2", "lead": false, "kicker": "UK POLITICS", "headline": "Prime Minister Andy Burnham Defends 'No 10 in the North' as Engine for UK Growth", "sub": "Prime Minister Burnham argues his initiative tackles centralized power and will drive prosperity across the entire UK.", "summary": "UK Prime Minister Andy Burnham has defended his 'No 10 in the North' initiative, asserting it is an engine for growth throughout the entire UK, not just a regional office. Burnham argues that power has been excessively centralized in Britain, and this ambitious project aims to remake the state by devolving authority and fostering prosperity across all communities. His comments come amid ongoing debate about regional inequality and governance.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/9aaadb1b0b65461eed09a5507aafb5d8f69804b1/666_0_6880_5504/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/jul/23/number-10-north-growth-uk-andy-burnham"}, {"id": "o3", "lead": false, "kicker": "US POLITICS", "headline": "Brett Kavanaugh Becomes Trump's Chief Enabler on Supreme Court", "sub": "Justice Kavanaugh's opinions offer President Trump workarounds to enact his agenda despite judicial clashes.", "summary": "Sidney Blumenthal argues that Justice Brett Kavanaugh has emerged as President Donald Trump's chief enabler on the Supreme Court. Kavanaugh's judicial opinions have consistently provided the president with legal workarounds, allowing him to enact his agenda even when facing clashes with the court. This dynamic highlights a significant shift in the court's ideological balance and its relationship with the executive branch.", "analysis": null, "time": "Yesterday", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/187b9b12fc4533eaa3ada468eddcb15ad4f742b8/333_0_3333_2667/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/jul/23/brett-kavanaugh-trump-supreme-court"}, {"id": "o4", "lead": false, "kicker": "GERMANY", "headline": "Jens Spahn Surrogacy Scandal Outrages Germans", "sub": "Powerful politician's brazen defiance of a surrogacy ban he defended sparks widespread controversy.", "summary": "Berlin-based journalist Tania Roettger reports that the Jens Spahn scandal, involving his surrogate baby, has outraged Germans. The powerful politician, no stranger to controversy, brazenly defied a ban on surrogacy that he had long defended publicly. This perceived hypocrisy has become a significant point of contention, sparking widespread public debate and criticism over his actions and integrity.", "analysis": null, "time": "4:00 AM", "tag": null, "sensitivity": false, "image": "https://media.guim.co.uk/b2538f4edd3cac429ff2de154d5208910d551fda/105_0_6198_4960/500.jpg", "link": "https://www.theguardian.com/commentisfree/2026/jul/24/for-outraged-germans-the-jens-spahn-scandal-is-about-more-than-his-surrogate-baby"}]}]}</script>

  <script>
    (function () {
      var raw = document.getElementById('edition').textContent;
      var data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<div class="notice">No edition loaded. Run the build to generate today’s paper.</div>';
        return;
      }

      var state = { active: (data.sections[0] || {}).id, openId: null };

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Editorial heat flags keep the red chip; procedural flags cool to navy,
      // so a red chip still means something (the Scarce Red Rule).
      function isHotTag(t) {
        return /^(DEVELOPING|BREAKING|LIVE|WAR|ALERT|URGENT)$/i.test(t || '');
      }

      // Tagline reflects the sections the edition actually shipped, not a
      // hardcoded list that can disagree with the paper.
      function taglineText() {
        var labels = data.sections
          .filter(function (s) { return s.id !== 'front'; })
          .map(function (s) { return s.label; });
        return (labels.length ? labels : ['Toronto', 'World', 'Business']).join(' · ');
      }

      function weatherHtml(w) {
        if (!w || !w.icon) return '';
        var week = (w.week || []).map(function (d) {
          return '<div class="day"><div class="d">' + esc(d.day) + '</div>' +
            '<div class="i">' + esc(d.icon) + '</div>' +
            '<div class="hi">' + esc(d.hi) + '°</div>' +
            '<div class="lo">' + esc(d.lo) + '°</div></div>';
        }).join('');
        return '<div class="weather" id="weather" role="button" tabindex="0" ' +
          'aria-expanded="false" aria-label="Toronto weather, tap for the week">' +
          '<div class="summary">' +
            '<span class="ico">' + esc(w.icon) + '</span>' +
            '<span class="city">Toronto</span>' +
            '<span class="temp">' + esc(w.high) + '° / ' + esc(w.low) + '°</span>' +
            '<span class="muted">' + esc(w.condition) + '</span>' +
            '<span class="muted">Rain ' + esc(w.rain) + '</span>' +
            '<span class="muted">Wind ' + esc(w.wind) + '</span>' +
            '<span class="chev" id="wchev">▼</span>' +
          '</div>' +
          '<div class="week" id="wweek" style="display:none">' + week + '</div>' +
        '</div>';
      }

      function tabsHtml() {
        return '<div class="tabs" role="tablist">' + data.sections.map(function (s) {
          var on = s.id === state.active;
          return '<button class="tab' + (on ? ' active' : '') + '" role="tab" ' +
            'aria-selected="' + on + '" data-tab="' + esc(s.id) + '">' + esc(s.label) + '</button>';
        }).join('') + '</div>';
      }

      function cardHtml(st) {
        var open = st.id === state.openId;
        var tag = st.tag
          ? '<span class="tag ' + (isHotTag(st.tag) ? 'hot' : 'cool') + '">' + esc(st.tag) + '</span>'
          : '';
        var kicker = st.kicker ? '<div class="kicker">' + tag + esc(st.kicker) + '</div>' : '';
        var sub = st.sub ? '<div class="sub">' + esc(st.sub) + '</div>' : '';
        var expand = '';
        if (open) {
          var img = st.image
            ? '<img src="' + esc(st.image) + '" alt="' + esc(st.headline) + '" ' +
              'loading="lazy" onerror="this.remove()" />'
            : '';
          var analysis = st.analysis
            ? '<div class="analysis"><span class="alabel">Why it matters</span>' + esc(st.analysis) + '</div>'
            : '';
          var link = st.link
            ? '<a class="readmore" href="' + esc(st.link) + '" target="_blank" rel="noopener">Read full story →</a>'
            : '';
          expand = '<div class="expand">' + img +
            '<p class="sumtext">' + esc(st.summary) + '</p>' + analysis + link + '</div>';
        }
        return '<div class="card' + (st.lead ? ' lead' : '') + (open ? ' open' : '') +
          '" data-card="' + esc(st.id) + '" role="button" tabindex="0" ' +
          'aria-expanded="' + open + '">' +
          '<div class="row"><div class="row-main">' + kicker +
            '<div class="headline">' + esc(st.headline) + '</div>' + sub +
            '<div class="time">' + esc(st.time) + '</div></div>' +
            '<div class="toggle" aria-hidden="true">' + (open ? '−' : '+') + '</div>' +
          '</div>' + expand +
        '</div>';
      }

      function storiesInner() {
        var section = data.sections.filter(function (s) { return s.id === state.active; })[0];
        if (!section) return '';
        if (!section.stories || !section.stories.length) {
          return '<div class="empty">Nothing filed for ' + esc(section.label) + ' this morning.</div>';
        }
        return section.stories.map(cardHtml).join('');
      }

      // Quietly flag a saved (not-today) edition served from cache/offline.
      function staleRibbon() {
        try {
          var meta = document.querySelector('meta[name=build]');
          if (!meta) return '';
          var built = new Date(meta.getAttribute('content'));
          if (isNaN(built.getTime())) return '';
          var opt = { timeZone: 'America/Toronto' };
          if (built.toLocaleDateString('en-CA', opt) < new Date().toLocaleDateString('en-CA', opt)) {
            return '<div class="stale">Saved edition · ' + esc(data.date) + '</div>';
          }
        } catch (e) {}
        return '';
      }

      function appHtml() {
        return '<div class="masthead">' +
            '<div class="date">' + esc(data.date) + '</div>' +
            '<div class="title">THE DAILY</div>' +
            '<div class="tagline">' + esc(taglineText()) + '</div>' +
          '</div>' +
          staleRibbon() +
          weatherHtml(data.weather) +
          tabsHtml() +
          '<div class="stories" id="stories">' + storiesInner() + '</div>' +
          '<div class="footer">THE DAILY · TORONTO · Tap any headline to read</div>';
      }

      var app = document.getElementById('app');

      // Rebuild only the stories column; masthead, weather, and tab strip (and
      // their scroll/open state) are left untouched. This is what keeps a tap
      // from resetting the reader's place.
      function refreshStories() {
        document.getElementById('stories').innerHTML = storiesInner();
        bindCards();
      }

      function selectTab(id) {
        if (id === state.active) return;
        state.active = id;
        state.openId = null;
        var tabs = document.querySelectorAll('.tab');
        Array.prototype.forEach.call(tabs, function (t) {
          var on = t.getAttribute('data-tab') === id;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on);
          if (on) t.scrollIntoView({ inline: 'center', block: 'nearest' });
        });
        refreshStories();
        // Start the new section at the top, tab strip stuck under the notch.
        var tabsEl = document.querySelector('.tabs');
        if (tabsEl) window.scrollTo(0, tabsEl.offsetTop);
      }

      function toggleCard(id) {
        var y = window.scrollY;
        state.openId = state.openId === id ? null : id;
        refreshStories();
        window.scrollTo(0, y);   // grow/collapse in place, never jump
      }

      function bindWeather() {
        var weather = document.getElementById('weather');
        if (!weather) return;
        function toggle() {
          var week = document.getElementById('wweek');
          var chev = document.getElementById('wchev');
          var showing = week.style.display !== 'none';
          week.style.display = showing ? 'none' : 'flex';
          chev.textContent = showing ? '▼' : '▲';
          weather.setAttribute('aria-expanded', String(!showing));
        }
        weather.addEventListener('click', toggle);
        weather.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
        });
      }

      function bindTabs() {
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
          btn.addEventListener('click', function () { selectTab(btn.getAttribute('data-tab')); });
        });
      }

      function bindCards() {
        Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
          function activate(ev) {
            if (ev.target.closest('a')) return;                 // let the link work
            // While open, only the header row collapses it, so reading (and
            // selecting) the body never closes the story by accident.
            if (card.classList.contains('open') && !ev.target.closest('.row')) return;
            toggleCard(card.getAttribute('data-card'));
          }
          card.addEventListener('click', activate);
          card.addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); activate(ev); }
          });
        });
      }

      app.innerHTML = appHtml();
      bindWeather();
      bindTabs();
      bindCards();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
