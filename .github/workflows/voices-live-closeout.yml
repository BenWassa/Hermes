name: Voices live closeout audit

on:
  push:
    branches: ["issue-13-voices-production-hardening"]
    paths:
      - ".github/workflows/voices-live-closeout.yml"

permissions:
  contents: read

jobs:
  live-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Probe bounded first-party source alternatives
        run: |
          python - <<'PY'
          import requests, feedparser

          urls = [
              "https://www.jordanbpeterson.com/feed/",
              "https://www.jordanbpeterson.com/category/blog/feed/",
              "https://drjordanbpeterson.substack.com/feed",
              "https://www.nysun.com/rss.xml",
              "https://www.nysun.com/feed",
              "https://www.nysun.com/author/conrad-black-2/feed",
              "https://www.nysun.com/author/conrad-black-2",
          ]
          uas = [
              "TheDaily/2.0 (+https://github.com/BenWassa/Hermes)",
              "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36 Hermes/2.0",
          ]
          for url in urls:
              for ua in uas:
                  try:
                      r = requests.get(url, headers={"User-Agent": ua, "Accept": "application/rss+xml, application/atom+xml, application/xml, text/xml, text/html;q=0.8, */*;q=0.5"}, timeout=20)
                      parsed = feedparser.parse(r.content) if r.ok else None
                      entries = len(parsed.entries) if parsed is not None else 0
                      print(f"{r.status_code:3} entries={entries:2} type={r.headers.get('content-type','')[:50]:50} ua={'browser' if ua.startswith('Mozilla') else 'hermes':7} {url}")
                  except Exception as exc:
                      print(f"ERR {type(exc).__name__}: {exc} {url}")
          PY

      - name: Resolve Jonathan Haidt in real Perigon directory when configured
        env:
          PERIGON_API_KEY: ${{ secrets.PERIGON_API_KEY }}
        run: |
          if [ -n "$PERIGON_API_KEY" ]; then
            python -m src.voices.audit journalist "Jonathan Haidt"
          else
            echo "PERIGON_API_KEY is not configured; live Perigon directory lookup not claimed."
          fi

      - name: Build exact production artifact through normal path
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          PERIGON_API_KEY: ${{ secrets.PERIGON_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: python -m src.build

      - name: Inspect exact production artifact in Chromium
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          artifact = Path("docs/index.html").resolve()
          out = Path("live-audit")
          out.mkdir(exist_ok=True)
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for width, height in ((390, 844), (320, 568), (844, 390)):
                  context = browser.new_context(viewport={"width": width, "height": height}, has_touch=True, is_mobile=True)
                  page = context.new_page()
                  page.goto(artifact.as_uri())
                  tabs = page.locator("[data-tab]")
                  names = [tabs.nth(i).get_attribute("data-tab") for i in range(tabs.count())]
                  required = {"front", "toronto", "world", "sports", "business", "opinion"}
                  assert required.issubset(set(names)), names
                  page.locator('[data-tab="opinion"]').click()
                  overflow = page.evaluate("document.documentElement.scrollWidth - document.documentElement.clientWidth")
                  assert overflow <= 1, (width, height, overflow)
                  following = page.locator(".following-block .card").count()
                  ordinary = page.locator(".today-opinion .card, #section-opinion .stories .card").count()
                  print(f"viewport {width}x{height}: tabs=ok overflow={overflow} following={following} ordinary_opinion={ordinary}")
                  page.screenshot(path=str(out / f"production-opinion-{width}x{height}.png"))
                  context.close()
              browser.close()
          print(f"artifact bytes={artifact.stat().st_size}")
          PY

      - name: Preserve live closeout artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voices-live-closeout
          path: |
            docs/index.html
            live-audit/
          if-no-files-found: warn
          retention-days: 7
