name: Sports source probe

on:
  push:
    branches:
      - sports-34-source-audit
  workflow_dispatch: {}

jobs:
  probe-raptors-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install probe dependencies
        run: pip install requests feedparser
      - name: Probe ESPN Raptors schedule and NBA scoreboard
        run: python scripts/probe_sports_sources.py espn_nba_schedule espn_nba_scoreboard
