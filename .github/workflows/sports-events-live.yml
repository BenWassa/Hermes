name: Sports major-event live check

on:
  push:
    branches:
      - sports-37-major-events
  workflow_dispatch: {}

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Probe major-event source contracts
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("FOOTBALL_DATA_API_KEY") or os.environ.get("FOOTBALL_DATA_TOKEN")
          print("football_data_token_configured", bool(token))
          if token:
              headers = {"X-Auth-Token": token}
              for code in ("CL", "WC"):
                  response = requests.get(
                      f"https://api.football-data.org/v4/competitions/{code}/matches",
                      headers=headers,
                      timeout=15,
                  )
                  print("football-data", code, response.status_code, response.headers.get("X-Requests-Available-Minute"))
                  response.raise_for_status()

          for league in ("uefa.champions", "fifa.world"):
              scoreboard = requests.get(
                  f"https://site.api.espn.com/apis/site/v2/sports/soccer/{league}/scoreboard",
                  timeout=15,
              )
              print("espn scoreboard", league, scoreboard.status_code)
              scoreboard.raise_for_status()
              payload = scoreboard.json()
              print("  events", len(payload.get("events") or []), [(e.get("id"), e.get("date"), (e.get("status") or {}).get("type", {}).get("name")) for e in (payload.get("events") or [])[:3]])

              standings = requests.get(
                  f"https://site.api.espn.com/apis/v2/sports/soccer/{league}/standings",
                  timeout=15,
              )
              print("espn standings", league, standings.status_code)
              standings.raise_for_status()
              groups = standings.json().get("children") or []
              print("  groups", len(groups))
          PY
