name: Sports major-event live check

on:
  push:
    branches:
      - sports-37-major-events
  workflow_dispatch: {}

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Build live major-event desk
        run: |
          python - <<'PY'
          import datetime as dt
          import json

          from src.sports import build_major_events

          now = dt.datetime.now(dt.timezone.utc)
          desk = build_major_events(now=now)
          payload = desk.to_dict()
          print(json.dumps(payload, indent=2, ensure_ascii=False))
          keys = [event["key"] for event in payload["events"]]
          assert "champions-league" in keys, payload
          champions = next(event for event in payload["events"] if event["key"] == "champions-league")
          assert champions["available"], payload
          assert champions["source"] == "ESPN"
          assert payload["event_mode"] is False
          assert payload["max_items"] == 6
          assert len(champions["matches"]) <= 6
          PY
