name: Core Voice Source Audit Probe

on:
  push:
    branches: [voices-v2-wave1b-core-source-audit]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Probe bounded public candidate sources
        run: |
          python - <<'PY'
          import json, re
          import requests, feedparser
          from html.parser import HTMLParser

          UA = {'User-Agent':'TheDaily/2.0 (+https://github.com/BenWassa/Hermes)'}
          urls = [
            ('conrad-nnw','html','https://www.nationalnewswatch.com/author/conrad-black'),
            ('andrew-nnw','html','https://www.nationalnewswatch.com/author/andrew-coyne'),
            ('paul-wells','feed','https://paulwells.substack.com/feed'),
            ('ezra-nyt-by','feed','https://www.nytimes.com/svc/collections/v1/publish/https://www.nytimes.com/by/ezra-klein/rss.xml'),
            ('ezra-nyt-column','feed','https://www.nytimes.com/svc/collections/v1/publish/www.nytimes.com/column/ezra-klein/rss.xml'),
            ('brooks-nyt-column','feed','https://www.nytimes.com/svc/collections/v1/publish/www.nytimes.com/column/david-brooks/rss.xml'),
            ('brooks-nyt-by','feed','https://www.nytimes.com/svc/collections/v1/publish/https://www.nytimes.com/by/david-brooks/rss.xml'),
            ('fukuyama-persuasion-section','feed','https://www.persuasion.community/s/francis-fukuyama/feed'),
            ('fukuyama-persuasion-main','feed','https://www.persuasion.community/feed'),
            ('zakaria-wapo','feed','https://www.washingtonpost.com/arcio/rss/author/Fareed-Zakaria'),
            ('tooze-chartbook','feed','https://adamtooze.substack.com/feed'),
            ('thompson-newstatesman','html','https://www.newstatesman.com/writers/324788'),
            ('thompson-unherd','html','https://unherd.com/author/helen-thompson/'),
            ('haidt-afterbabel','feed','https://www.afterbabel.com/feed'),
            ('pinker-rssxml','feed','https://stevenpinker.com/rss.xml'),
            ('pinker-feed','feed','https://stevenpinker.com/feed'),
            ('pinker-publications','html','https://stevenpinker.com/publications'),
            ('arthur-freepress-main','feed','https://www.thefp.com/feed'),
            ('arthur-freepress-writer','html','https://www.thefp.com/w/arthur-brooks'),
            ('arthur-pursuit-feed','feed','https://www.thefp.com/s/the-pursuit-of-happiness-with-arthur/feed'),
            ('cowen-mr-main','feed','https://marginalrevolution.com/feed'),
            ('cowen-mr-author','feed','https://marginalrevolution.com/marginalrevolution/author/tyler-cowen/feed'),
            ('cowen-freepress-writer','html','https://www.thefp.com/w/tyler-cowen'),
            ('tufekci-nyt-by','feed','https://www.nytimes.com/svc/collections/v1/publish/https://www.nytimes.com/by/zeynep-tufekci/rss.xml'),
            ('tufekci-site','html','https://zeynep.me/'),
            ('dan-feed-query','feed','https://danwang.co/?feed=rss'),
            ('dan-feed','feed','https://danwang.co/feed'),
            ('dan-rss','feed','https://danwang.co/rss'),
          ]

          class H(HTMLParser):
            def __init__(self):
              super().__init__(); self.articles=0; self.ld=[]; self.in_ld=False; self.buf=[]
            def handle_starttag(self,t,a):
              d=dict(a)
              if t=='article': self.articles += 1
              if t=='script' and d.get('type','').lower()=='application/ld+json': self.in_ld=True; self.buf=[]
            def handle_data(self,d):
              if self.in_ld:self.buf.append(d)
            def handle_endtag(self,t):
              if t=='script' and self.in_ld:self.in_ld=False; self.ld.append(''.join(self.buf))

          for label, kind, url in urls:
            out={'label':label,'url':url}
            try:
              r=requests.get(url,headers=UA,timeout=20,allow_redirects=True)
              out.update(status=r.status_code, final=r.url, ctype=r.headers.get('content-type','')[:80], bytes=len(r.content))
              if kind=='feed' and r.ok:
                p=feedparser.parse(r.content)
                entries=p.entries[:25]
                out['feed_count']=len(entries)
                out['feed_title']=str(p.feed.get('title',''))[:100]
                out['newest']=str((entries[0].get('published') or entries[0].get('updated') or '') if entries else '')[:120]
                out['authors']=[str(e.get('author') or e.get('dc_creator') or '')[:80] for e in entries[:8]]
                out['titles']=[str(e.get('title',''))[:100] for e in entries[:3]]
                out['bozo']=bool(p.bozo)
              elif kind=='html' and r.ok:
                h=H(); h.feed(r.text)
                ld_articles=0
                for b in h.ld:
                  try:
                    s=json.dumps(json.loads(b)).lower()
                    ld_articles += len(re.findall(r'"@type"\s*:\s*"(?:article|newsarticle|opinionnewsarticle|blogposting)"',s))
                  except Exception: pass
                out['semantic_articles']=h.articles; out['jsonld_article_markers']=ld_articles
            except Exception as e:
              out['error']=type(e).__name__+': '+str(e)[:180]
            print('PROBE '+json.dumps(out,ensure_ascii=False))
          PY
