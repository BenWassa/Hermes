name: Core Voice Source Audit Probe

on:
  push:
    branches: [voices-v2-wave1b-core-source-audit]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Adam Tooze — Chartbook direct RSS through Hermes
        run: |
          cat > /tmp/adam-chartbook.json <<'JSON'
          {"version":1,"voices":[{"id":"adam-tooze","name":"Adam Tooze","sources":[{"type":"rss","url":"https://adamtooze.substack.com/feed","publication":"Chartbook","authorship":"scope"}]}]}
          JSON
          python - <<'PY'
          import datetime as dt
          from src.voices.discover import discover
          from src.voices.http import RequestBudget, VoiceHttp
          from src.voices.registry import load_registry
          from src.voices.window import EditionWindow

          registry = load_registry('/tmp/adam-chartbook.json')
          result = discover(
              registry,
              window=EditionWindow.ending_now(
                  lookback=dt.timedelta(days=365),
                  future_skew=dt.timedelta(minutes=10),
              ),
              http=VoiceHttp(budget=RequestBudget(limits={'rss': 2})),
          )
          for status in result.statuses:
              print(status.as_dict())
          for article in result.articles[:8]:
              print(article.published_at, article.title, article.canonical_url)
          if result.failures or not result.articles:
              raise SystemExit(1)
          PY
