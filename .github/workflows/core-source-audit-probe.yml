name: Core Voice Source Audit Probe

on:
  push:
    branches: [voices-v2-wave1b-core-source-audit]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Exercise final candidates through Hermes adapters
        run: |
          cat > /tmp/core-audit.json <<'JSON'
          {
            "version": 1,
            "voices": [
              {"id":"ezra-klein","name":"Ezra Klein","sources":[{"type":"rss","url":"https://www.nytimes.com/svc/collections/v1/publish/https://www.nytimes.com/by/ezra-klein/rss.xml","publication":"The New York Times","authorship":"byline"}]},
              {"id":"david-brooks","name":"David Brooks","sources":[{"type":"rss","url":"https://www.theatlantic.com/feed/author/david-brooks/","publication":"The Atlantic","authorship":"byline"}]},
              {"id":"adam-tooze","name":"Adam Tooze","sources":[{"type":"rss","url":"https://foreignpolicy.com/author/adam-tooze/feed/","publication":"Foreign Policy","authorship":"byline"}]},
              {"id":"jonathan-haidt","name":"Jonathan Haidt","aliases":["Jon Haidt"],"sources":[{"type":"rss","url":"https://www.afterbabel.com/feed","publication":"After Babel","authorship":"byline"}]},
              {"id":"tyler-cowen","name":"Tyler Cowen","sources":[{"type":"rss","url":"https://marginalrevolution.com/marginalrevolution/author/tyler-cowen/feed","publication":"Marginal Revolution","authorship":"byline"}]},
              {"id":"dan-wang","name":"Dan Wang","sources":[{"type":"author_page","url":"https://danwang.co/","publication":"Dan Wang","structural":true,"authorship":"scope"}]},
              {"id":"fareed-zakaria","name":"Fareed Zakaria","sources":[{"type":"author_page","url":"https://www.washingtonpost.com/people/fareed-zakaria/","publication":"The Washington Post","structural":true,"authorship":"scope"}]}
            ]
          }
          JSON
          python -m src.voices.audit --live --registry /tmp/core-audit.json || true
