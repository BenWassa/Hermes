name: Voices source endpoint probe

on:
  push:
    branches: ["issue-13-voices-production-hardening"]
    paths:
      - ".github/workflows/voices-source-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests feedparser
      - name: Inspect official Jordan Peterson RSS authorship metadata
        run: |
          python - <<'PY'
          import requests, feedparser

          headers = {
              "User-Agent": "TheDaily/2.0 (+https://github.com/BenWassa/Hermes)",
              "Accept": "application/rss+xml, application/atom+xml, application/xml, text/xml, */*;q=0.5",
          }
          for url in (
              "https://www.jordanbpeterson.com/feed/",
              "https://www.jordanbpeterson.com/category/blog/feed/",
          ):
              r = requests.get(url, headers=headers, timeout=20)
              r.raise_for_status()
              feed = feedparser.parse(r.content)
              print(f"source={url} feed={feed.feed.get('title','')} entries={len(feed.entries)}")
              for e in feed.entries[:10]:
                  authors = [a.get('name','') for a in e.get('authors', [])]
                  print(f"  title={e.get('title','')!r} author={e.get('author','')!r} authors={authors!r} link={e.get('link','')}")
          PY
