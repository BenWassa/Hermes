name: CI

# Deterministic provider coverage plus exact rendered-browser acceptance.
# Test execution never calls live news providers or uses provider keys: adapters
# run against recorded fixtures and Chromium opens locally rendered artifacts.
# Live source checks remain separate deliberate operator commands.

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/index.html"
      - "data/latest.json"
      # Generated operational state/artifacts are exercised before deployment
      # in deterministic CI; their routine production commits do not rerun CI.
      - "data/voice_watch_state.json"
      - "data/voice_roundup_state.json"
      - "docs/voices/index.html"
      - "docs/voices/recent/**"
      - "docs/voices/articles/**"
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Validate the voice registry
        run: python -m src.voices.audit

      - name: Run the deterministic and rendered-browser suite
        run: python -m pytest

      - name: Preserve rendered inspection artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-artifacts
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
