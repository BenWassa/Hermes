name: Sports V2 Branch Preview

on:
  push:
    branches:
      - sports-39-production-integration
    paths-ignore:
      - docs/sports-preview.html
      - data/sports-preview-edition.json
      - data/sports-preview-metrics.json
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sports-39-branch-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: sports-39-production-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build live Sports preview
        env:
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: python scripts/build_sports_branch_preview.py

      - name: Commit preview artifact to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sports-preview.html data/sports-preview-edition.json data/sports-preview-metrics.json
          if git diff --cached --quiet; then
            echo "Preview unchanged."
            exit 0
          fi
          git commit -m "chore(sports): refresh temporary branch preview"
          git push origin HEAD:sports-39-production-integration

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: sports-39-live-preview
          path: |
            docs/sports-preview.html
            data/sports-preview-edition.json
            data/sports-preview-metrics.json
          retention-days: 3
