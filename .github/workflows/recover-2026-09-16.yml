name: One-time Daily recovery 2026-09-16

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-2026-09-16.yml"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify recovered edition
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=America/Toronto date +%Y-%m-%d)"
          LAST="$(TZ=America/Toronto git log -1 --format=%cd --date=format-local:'%Y-%m-%d' -- docs/index.html 2>/dev/null || true)"
          SUBJECT="$(git log -1 --format=%s -- docs/index.html 2>/dev/null || true)"
          if [ "$TODAY" = "2026-09-16" ] && [ "$LAST" = "$TODAY" ] && [ "$SUBJECT" = "chore(edition): publish 2026-09-16 edition" ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "Recovered edition verification failed: today=$TODAY last=${LAST:-none} subject=${SUBJECT:-none}" >&2
            exit 1
          fi

      - name: Send recovered Daily notification
        if: steps.gate.outputs.send == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC secret not set; no notification sent."
            exit 0
          fi
          URL="${PAGES_URL:-https://BenWassa.github.io/Hermes/}"
          curl -fsS \
            -H "Title: The Daily — Sep 16" \
            -H "Click: ${URL}" \
            -H "Tags: newspaper" \
            -d "Today's recovered edition is ready." \
            "https://ntfy.sh/${NTFY_TOPIC}"
