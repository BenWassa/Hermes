name: Inspect Core Voices

# Release-time Voice notifications are retired. The only proactive Voices
# notification is the screened weekly digest in voice-roundup.yml.
#
# This workflow remains as a manual, read-only source/identity diagnostic. It
# always runs the existing watcher in --dry-run mode: no durable claim writes,
# no Gemini work, no article-page publication, and no ntfy capability.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: voice-watch-inspect
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Inspect Core voices without side effects
        env:
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          PERIGON_API_KEY: ${{ secrets.PERIGON_API_KEY }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: python -m src.voice_watch --dry-run
