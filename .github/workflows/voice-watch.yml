name: Watch Voices

# Release-time alerts for authoritative Core Voices. This remains deliberately
# separate from the morning newspaper build: it makes only Voice-source requests,
# reuses the bounded claim state, and invokes Gemini only after a genuinely new
# Core article has been durably claimed for an alert. The resulting static page
# lives at a stable /voices/articles/... URL; Selective and Discovery never enter
# this job's production registry.
#
# Cadence. GitHub's scheduled Actions are eventually-soon, not realtime. Hourly
# at :37 avoids the most congested top-of-hour slot. Scarce providers remain on
# the durable once-a-day reconciliation cadence enforced by watcher code, and
# quiet hours remain a code-level product rule.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be sent; write nothing, model nothing, send nothing"
        type: boolean
        default: false
      ignore_quiet_hours:
        description: "Run even inside the configured quiet window"
        type: boolean
        default: false
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: write

# Watcher runs never overlap each other. They deliberately do NOT share a
# group with Build The Daily or the weekly roundup. The git layer coordinates
# their disjoint writes: a Core release first commits its claim, then publishes
# one content-addressed article page, and only then attempts ntfy delivery.
concurrency:
  group: voice-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Watch Core voices
        env:
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          PERIGON_API_KEY: ${{ secrets.PERIGON_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.ignore_quiet_hours }}" = "true" ]; then ARGS="$ARGS --ignore-quiet-hours"; fi
          python -m src.voice_watch $ARGS
