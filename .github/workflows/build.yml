name: Build The Daily

on:
  workflow_dispatch: {}
  schedule:
    # Primary publication target: 05:17 America/Toronto. The off-hour minute
    # avoids GitHub Actions' busiest top-of-hour scheduler window while keeping
    # the product target inside the 05:00 local hour.
    - cron: "17 5 * * *"
      timezone: "America/Toronto"
    # One same-hour recovery protects the normal by-06:00 target if the primary
    # scheduled event is delayed or dropped. Later bounded recoveries cover a
    # wider scheduler outage. Every attempt uses the same early edition gate.
    - cron: "37 5 * * *"
      timezone: "America/Toronto"
    - cron: "17 6 * * *"
      timezone: "America/Toronto"
    - cron: "17 7 * * *"
      timezone: "America/Toronto"

permissions:
  contents: write

concurrency:
  group: build-the-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether today's edition already exists
        id: gate
        shell: bash
        run: |
          TODAY="$(TZ=America/Toronto date +%Y-%m-%d)"
          EDITION_COMMIT="$(
            git log -1 --format=%H \
              --grep="^chore(edition): publish ${TODAY} edition$" \
              -- docs/index.html 2>/dev/null || true
          )"

          if [ -n "$EDITION_COMMIT" ]; then
            echo "Edition ${TODAY} already exists at ${EDITION_COMMIT}; skipping before provider work."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No ${TODAY} Toronto-calendar edition exists; proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Build edition
        if: steps.gate.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
        run: python -m src.build

      - name: Commit and push
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/index.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          TODAY="$(TZ=America/Toronto date +%Y-%m-%d)"
          git commit -m "chore(edition): publish ${TODAY} edition"

          BRANCH="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Push failed after ${attempt} attempts." >&2
              exit 1
            fi

            echo "Push attempt ${attempt} failed; rebasing onto origin/${BRANCH}."
            git fetch origin "${BRANCH}"
            git rebase "origin/${BRANCH}"
            sleep $((attempt * 2))
          done
