name: Build The Daily

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "docs/index.html"
      - "docs/open/**"
      - "docs/closed/**"
      - "docs/ISSUE_TRACKING.md"
      - "data/voice_watch_state.json"
      - "data/voice_roundup_state.json"
      - "docs/voices/**"
  schedule:
    # GitHub scheduled delivery has repeatedly arrived 3.5-4.5 hours late.
    # Start a bounded set of hedge slots several hours early. Prompt deliveries
    # still no-op before 05:00 Toronto; a hedge delivered late at/after 05:00 can
    # publish the missing current-day edition. Later slots preserve recovery.
    - cron: "17,47 5-12 * * *"

permissions:
  contents: write

concurrency:
  group: build-the-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether today's edition already exists
        id: gate
        shell: bash
        run: |
          TODAY="$(TZ=America/Toronto date +%Y-%m-%d)"
          EVENT="${{ github.event_name }}"
          LOCAL_TIME="$(TZ=America/Toronto date +'%H:%M:%S %Z')"
          LOCAL_HOUR="$(TZ=America/Toronto date +%H)"
          LOCAL_HOUR="${LOCAL_HOUR#0}"
          if [ -z "$LOCAL_HOUR" ]; then LOCAL_HOUR=0; fi

          echo "today=${TODAY}" >> "$GITHUB_OUTPUT"
          echo "event=${EVENT}" >> "$GITHUB_OUTPUT"
          echo "local_time=${LOCAL_TIME}" >> "$GITHUB_OUTPUT"
          echo "edition_exists=false" >> "$GITHUB_OUTPUT"

          EDITION_COMMIT="$(
            git log -1 --format=%H \
              --grep="^chore(edition): publish ${TODAY} edition$" \
              -- docs/index.html 2>/dev/null || true
          )"

          if [ -n "$EDITION_COMMIT" ]; then
            echo "Edition ${TODAY} already exists at ${EDITION_COMMIT}; skipping before provider work."
            echo "edition_exists=true" >> "$GITHUB_OUTPUT"
            echo "outcome=already-published-noop" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Scheduled UTC slots are intentionally bounded, but actual GitHub
          # delivery can be arbitrarily late. Before 05:00 Toronto the current
          # day's edition must not publish; at or after 05:00, edition absence is
          # the authority and there is deliberately no scheduled upper-hour veto.
          if [ "$EVENT" = "schedule" ] && [ "$LOCAL_HOUR" -lt 5 ]; then
            echo "Scheduled attempt arrived before Toronto 05:00; skipping."
            echo "outcome=pre-05-scheduled-noop" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A meaningful main-branch push can recover a missed edition later in
          # the same morning. Generated edition/Voice/issue-doc paths are excluded
          # at the trigger, and this path remains bounded to avoid afternoon rebuilds.
          if [ "$EVENT" = "push" ] && { [ "$LOCAL_HOUR" -lt 5 ] || [ "$LOCAL_HOUR" -gt 11 ]; }; then
            echo "Push recovery is outside the Toronto 05:00-11:59 window; skipping."
            echo "outcome=push-window-noop" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No ${TODAY} Toronto-calendar edition exists; proceeding (${EVENT}, Toronto ${LOCAL_TIME})."
          echo "outcome=build-required" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Build edition
        if: steps.gate.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          PERIGON_API_KEY: ${{ secrets.PERIGON_API_KEY }}
        run: python -m src.build

      - name: Commit and push
        id: publish
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/index.html

          if git diff --cached --quiet; then
            echo "::error::Build completed for a missing Toronto-calendar edition but produced no docs/index.html change."
            echo "outcome=build-failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          TODAY="$(TZ=America/Toronto date +%Y-%m-%d)"
          git commit -m "chore(edition): publish ${TODAY} edition"

          BRANCH="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "outcome=published" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Push failed after ${attempt} attempts." >&2
              echo "outcome=build-failure" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            echo "Push attempt ${attempt} failed; rebasing onto origin/${BRANCH}."
            git fetch origin "${BRANCH}"
            git rebase "origin/${BRANCH}"
            sleep $((attempt * 2))
          done

      - name: Report Daily outcome
        if: always()
        shell: bash
        run: |
          STATUS="${{ job.status }}"
          GATE_OUTCOME="${{ steps.gate.outputs.outcome }}"
          PUBLISH_OUTCOME="${{ steps.publish.outputs.outcome }}"
          OUTCOME="$GATE_OUTCOME"

          if [ "$STATUS" != "success" ]; then
            OUTCOME="${PUBLISH_OUTCOME:-build-failure}"
          elif [ -n "$PUBLISH_OUTCOME" ]; then
            OUTCOME="$PUBLISH_OUTCOME"
          fi

          if [ -z "$OUTCOME" ]; then
            OUTCOME="build-failure"
          fi

          {
            echo "## Daily run outcome"
            echo
            echo "- Toronto date: ${{ steps.gate.outputs.today || 'unknown' }}"
            echo "- Trigger: ${{ steps.gate.outputs.event || github.event_name }}"
            echo "- Toronto gate time: ${{ steps.gate.outputs.local_time || 'unknown' }}"
            echo "- Edition existed at gate: ${{ steps.gate.outputs.edition_exists || 'unknown' }}"
            echo "- Outcome: \`${OUTCOME}\`"
            echo "- Job status: \`${STATUS}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Daily outcome: ${OUTCOME}"
