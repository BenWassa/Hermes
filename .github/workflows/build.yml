name: Build The Daily

on:
  workflow_dispatch: {}
  schedule:
    # Three morning attempts an hour apart (05:00 / 06:00 / 07:00 ET) so a
    # dropped GitHub cron self-heals: the build gate checks git history and
    # skips once today's edition exists, so the first run that lands publishes
    # and the rest are no-ops. Minutes are offset to :17 to dodge the heavily
    # throttled top-of-hour slot. Each ET hour needs both UTC offsets to cover
    # the DST shift (EDT = UTC-4 summer, EST = UTC-5 winter).
    - cron: "17 8 * * *"    # 04:17 EDT (summer, UTC-4)
    - cron: "17 9 * * *"    # 04:17 EST (winter) / 05:17 EDT (summer)
    - cron: "17 10 * * *"   # 05:17 EST (winter) / 06:17 EDT (summer)
    - cron: "17 11 * * *"   # 06:17 EST (winter) / 07:17 EDT (summer)
    - cron: "17 12 * * *"   # 07:17 EST (winter)

permissions:
  contents: write

concurrency:
  group: build-the-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build gate (skip scheduled run if today's edition already published)
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(TZ=America/Toronto date +%Y-%m-%d)
          LAST=$(TZ=America/Toronto git log -1 --format=%cd --date=format-local:'%Y-%m-%d' -- docs/index.html 2>/dev/null || echo "")
          echo "Today (ET): $TODAY  Last build (ET): ${LAST:-never}"
          if [ "$LAST" = "$TODAY" ]; then
            echo "Edition for $TODAY already published; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No edition yet for $TODAY; proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Build edition
        if: steps.gate.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          PERIGON_API_KEY: ${{ secrets.PERIGON_API_KEY }}
          CURATE_MODEL: ${{ vars.CURATE_MODEL }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: python -m src.build

      - name: Commit and push docs/
        if: steps.gate.outputs.skip != 'true'
        # The Voice watcher ("Watch Voices") also commits to this branch, to a
        # different path (data/voice_watch_state.json). The two workflows are
        # deliberately not in one concurrency group: GitHub cancels a *pending*
        # run when a newer one queues on the same group, so sharing would let
        # an hourly watcher cancel a queued morning edition. They are kept from
        # overwriting each other here instead, by rebasing onto whatever landed
        # and retrying the push. Because the paths are disjoint the rebase is
        # always clean; a conflict would mean something unexpected, so it fails
        # loudly rather than forcing.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "chore(edition): publish $(TZ=America/Toronto date +'%Y-%m-%d') edition"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Published on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); another job moved ${GITHUB_REF_NAME}. Rebasing."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            sleep $((attempt * 2))
          done
          echo "Could not publish after 5 attempts." >&2
          exit 1
