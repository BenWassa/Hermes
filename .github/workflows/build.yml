name: Build The Daily

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "docs/index.html"
      - "docs/open/**"
      - "docs/closed/**"
      - "docs/ISSUE_TRACKING.md"
      - "data/voice_watch_state.json"
      - "data/voice_roundup_state.json"
      - "docs/voices/**"
  schedule:
    # GitHub's timezone-aware Daily schedule was valid but proved unreliable in
    # production: Sep 13 runs arrived 3.5-4.5h late and all Sep 14 slots were
    # dropped. Use ordinary UTC scheduling and let the early Toronto-time gate
    # decide which attempts belong to the 05:00-07:59 local recovery window.
    # This one cadence covers both EDT and EST without duplicated DST logic.
    - cron: "17,47 9-12 * * *"

permissions:
  contents: write

concurrency:
  group: build-the-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether today's edition already exists
        id: gate
        shell: bash
        run: |
          TODAY="$(TZ=America/Toronto date +%Y-%m-%d)"
          EVENT="${{ github.event_name }}"
          LOCAL_HOUR="$(TZ=America/Toronto date +%H)"
          LOCAL_HOUR="${LOCAL_HOUR#0}"
          if [ -z "$LOCAL_HOUR" ]; then LOCAL_HOUR=0; fi

          EDITION_COMMIT="$(
            git log -1 --format=%H \
              --grep="^chore(edition): publish ${TODAY} edition$" \
              -- docs/index.html 2>/dev/null || true
          )"

          if [ -n "$EDITION_COMMIT" ]; then
            echo "Edition ${TODAY} already exists at ${EDITION_COMMIT}; skipping before provider work."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Scheduled UTC slots cover both DST regimes. Only local 05:00-07:59
          # attempts are real publication/recovery opportunities; the outer UTC
          # slots exist solely so the same cron works in EDT and EST.
          if [ "$EVENT" = "schedule" ] && { [ "$LOCAL_HOUR" -lt 5 ] || [ "$LOCAL_HOUR" -gt 7 ]; }; then
            echo "Scheduled attempt is outside the Toronto 05:00-07:59 recovery window; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A meaningful main-branch push can recover a missed edition later in
          # the same morning. Generated edition/Voice paths are excluded at the
          # trigger, and this path remains bounded to avoid afternoon rebuilds.
          if [ "$EVENT" = "push" ] && { [ "$LOCAL_HOUR" -lt 5 ] || [ "$LOCAL_HOUR" -gt 11 ]; }; then
            echo "Push recovery is outside the Toronto 05:00-11:59 window; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No ${TODAY} Toronto-calendar edition exists; proceeding (${EVENT}, Toronto hour ${LOCAL_HOUR})."
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Build edition
        if: steps.gate.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          PERIGON_API_KEY: ${{ secrets.PERIGON_API_KEY }}
        run: python -m src.build

      - name: Commit and push
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/index.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          TODAY="$(TZ=America/Toronto date +%Y-%m-%d)"
          git commit -m "chore(edition): publish ${TODAY} edition"

          BRANCH="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Push failed after ${attempt} attempts." >&2
              exit 1
            fi

            echo "Push attempt ${attempt} failed; rebasing onto origin/${BRANCH}."
            git fetch origin "${BRANCH}"
            git rebase "origin/${BRANCH}"
            sleep $((attempt * 2))
          done
