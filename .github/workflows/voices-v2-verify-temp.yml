name: Voices V2 temporary verification

on:
  push:
    branches:
      - voices-v2-registry-morning-policy

permissions:
  contents: read

jobs:
  core-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voices-v2-registry-morning-policy

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Build exact Core-only registry from production config
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('data/voices.json').read_text(encoding='utf-8'))
          core = [voice for voice in data['voices'] if voice.get('tier') == 'core']
          assert len(core) == 15, f'expected 15 Core Voices, got {len(core)}'
          Path('/tmp/core-voices.json').write_text(
              json.dumps({'version': data['version'], 'voices': core}, indent=2),
              encoding='utf-8',
          )
          PY

      - name: Audit final Core production sources through production adapters
        run: python -m src.voices.audit --live --registry /tmp/core-voices.json
