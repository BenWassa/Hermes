name: Voices V2 temporary verification

on:
  push:
    branches:
      - voices-v2-registry-morning-policy

permissions:
  contents: write

jobs:
  patch-and-live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voices-v2-registry-morning-policy
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Keep V1 watcher planning on the legacy notify set
        id: patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/voices/watch.py')
          text = path.read_text(encoding='utf-8')
          old = """    planned = plan_requests(registry, window)\n"""
          new = """    # V2 product membership must not enlarge the still-live V1 release watcher.\n    # During migration, `notify` keeps only its legacy operational meaning, so\n    # plan requests from that bounded set even when callers pass the full V2 registry.\n    watcher_registry = registry.for_legacy_watcher()\n    planned = plan_requests(watcher_registry, window)\n"""
          if old not in text:
              print('watcher planner already migrated')
              Path('/tmp/patched').write_text('false', encoding='utf-8')
          else:
              if text.count(old) != 1:
                  raise SystemExit('expected exactly one watcher planning site')
              path.write_text(text.replace(old, new), encoding='utf-8')
              Path('/tmp/patched').write_text('true', encoding='utf-8')
          PY
          echo "patched=$(cat /tmp/patched)" >> "$GITHUB_OUTPUT"

      - name: Commit planner correction
        if: steps.patch.outputs.patched == 'true'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/voices/watch.py
          git commit -m "fix(voices): bound V1 watcher planning during V2 migration"
          git push origin HEAD:voices-v2-registry-morning-policy

      - name: Install runtime dependencies
        if: steps.patch.outputs.patched == 'true'
        run: pip install -r requirements.txt

      - name: Live-audit exactly the 15 Core primary sources
        if: steps.patch.outputs.patched == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('data/voices.json').read_text(encoding='utf-8'))
          core = [voice for voice in data['voices'] if voice.get('tier') == 'core']
          assert len(core) == 15, f'expected 15 Core Voices, got {len(core)}'
          Path('/tmp/core-voices.json').write_text(
              json.dumps({'version': data['version'], 'voices': core}, indent=2),
              encoding='utf-8',
          )
          PY
          python -m src.voices.audit --live --registry /tmp/core-voices.json
