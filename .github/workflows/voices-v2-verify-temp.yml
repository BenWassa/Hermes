name: Voices V2 temporary verification

on:
  push:
    branches:
      - voices-v2-registry-morning-policy

permissions:
  contents: read

jobs:
  source-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voices-v2-registry-morning-policy

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Build contradicted-source registry
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          failed = {
              'paul-wells',
              'francis-fukuyama',
              'fareed-zakaria',
              'adam-tooze',
              'arthur-c-brooks',
              'tyler-cowen',
              'dan-wang',
          }
          data = json.loads(Path('data/voices.json').read_text(encoding='utf-8'))
          voices = [voice for voice in data['voices'] if voice['id'] in failed]
          assert len(voices) == 7
          Path('/tmp/failed-primary.json').write_text(
              json.dumps({'version': data['version'], 'voices': voices}, indent=2),
              encoding='utf-8',
          )
          PY

      - name: Re-run seven primaries with intended Hermes User-Agent forced
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/voices/http.py')
          text = path.read_text(encoding='utf-8')
          old = 'self._session.headers.setdefault("User-Agent", USER_AGENT)'
          new = 'self._session.headers["User-Agent"] = USER_AGENT'
          assert old in text
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          set +e
          python -m src.voices.audit --live --registry /tmp/failed-primary.json
          echo "AUDIT_EXIT=$?"
          exit 0

      - name: Probe documented and natural generic fallbacks
        shell: bash
        run: |
          python - <<'PY'
          import requests
          from src.voices.http import USER_AGENT

          urls = {
              'paul-wells-nnw': 'https://www.nationalnewswatch.com/author/paul-wells',
              'fukuyama-main-feed': 'https://www.persuasion.community/feed',
              'arthur-main-feed': 'https://www.thefp.com/feed',
              'dan-homepage': 'https://danwang.co/',
              'tyler-author-page': 'https://marginalrevolution.com/marginalrevolution/author/tyler-cowen',
              'tooze-author-page': 'https://foreignpolicy.com/author/adam-tooze/',
              'zakaria-author-page': 'https://www.washingtonpost.com/people/fareed-zakaria/',
          }
          headers = {'User-Agent': USER_AGENT}
          for name, url in urls.items():
              try:
                  response = requests.get(url, headers=headers, timeout=20, allow_redirects=True)
                  print(f'{name}: {response.status_code} final={response.url} bytes={len(response.content)} type={response.headers.get("content-type", "")}')
              except Exception as exc:
                  print(f'{name}: ERROR {type(exc).__name__}: {exc}')
          PY
