name: Voices V2 temporary verification

on:
  push:
    branches:
      - voices-v2-registry-morning-policy

permissions:
  contents: read

jobs:
  corrected-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voices-v2-registry-morning-policy

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Build bounded corrected-source registry
        shell: bash
        run: |
          cat > /tmp/corrected-sources.json <<'JSON'
          {
            "version": 1,
            "voices": [
              {
                "id": "paul-wells",
                "name": "Paul Wells",
                "tier": "core",
                "notify": false,
                "require_evidence": "provider_id",
                "provider_ids": [{"provider": "nationalnewswatch.com", "id": "/author/paul-wells"}],
                "sources": [{
                  "id": "national-newswatch-paul-wells",
                  "type": "author_page",
                  "url": "https://www.nationalnewswatch.com/author/paul-wells",
                  "publication": "National Newswatch",
                  "structural": true,
                  "item_tag": "div",
                  "item_class": "article",
                  "author_path": "/author/paul-wells",
                  "allow_external_links": true,
                  "authorship": "provider_id"
                }]
              },
              {
                "id": "francis-fukuyama",
                "name": "Francis Fukuyama",
                "tier": "core",
                "notify": false,
                "aliases": ["Frank Fukuyama"],
                "sources": [{
                  "id": "persuasion-main-fukuyama",
                  "type": "rss",
                  "url": "https://www.persuasion.community/feed",
                  "publication": "Persuasion",
                  "authorship": "byline"
                }]
              },
              {
                "id": "arthur-c-brooks",
                "name": "Arthur C. Brooks",
                "tier": "core",
                "notify": false,
                "aliases": ["Arthur Brooks"],
                "sources": [{
                  "id": "free-press-main-arthur-brooks",
                  "type": "rss",
                  "url": "https://www.thefp.com/feed",
                  "publication": "The Free Press",
                  "authorship": "byline"
                }]
              },
              {
                "id": "dan-wang",
                "name": "Dan Wang",
                "tier": "core",
                "notify": false,
                "sources": [{
                  "id": "dan-wang-first-party",
                  "type": "rss",
                  "url": "https://danwang.co/feed/",
                  "publication": "Dan Wang",
                  "authorship": "byline"
                }]
              },
              {
                "id": "adam-tooze",
                "name": "Adam Tooze",
                "tier": "core",
                "notify": false,
                "sources": [{
                  "id": "foreign-policy-tooze",
                  "type": "rss",
                  "url": "https://foreignpolicy.com/author/adam-tooze/feed/",
                  "publication": "Foreign Policy",
                  "authorship": "byline"
                }]
              },
              {
                "id": "tyler-cowen",
                "name": "Tyler Cowen",
                "tier": "core",
                "notify": false,
                "sources": [{
                  "id": "marginal-revolution-tyler-cowen",
                  "type": "rss",
                  "url": "https://marginalrevolution.com/marginalrevolution/author/tyler-cowen/feed",
                  "publication": "Marginal Revolution",
                  "authorship": "byline"
                }]
              }
            ]
          }
          JSON

      - name: Audit corrected six-source subset through production adapters
        run: python -m src.voices.audit --live --registry /tmp/corrected-sources.json
