name: Sports team state live check

on:
  push:
    branches:
      - sports-35-toronto-team-state
  workflow_dispatch: {}

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Inspect provider shapes and build snapshots
        run: |
          python - <<'PY'
          import json
          import requests
          from src.sports import build_toronto_snapshots

          nhl = requests.get("https://api-web.nhle.com/v1/standings/now", timeout=12).json()
          tor = next(row for row in nhl["standings"] if (row.get("teamAbbrev") or {}).get("default") == "TOR")
          print("NHL_TOR_TYPES", {k: type(tor.get(k)).__name__ for k in ["teamAbbrev", "divisionName", "conferenceName"]})
          print("NHL_TOR_VALUES", {k: tor.get(k) for k in ["teamAbbrev", "divisionName", "conferenceName", "divisionSequence", "wins", "losses", "otLosses"]})

          espn = requests.get("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/tor/schedule", timeout=12).json()
          for event in espn.get("events", [])[:5]:
              comp = (event.get("competitions") or [{}])[0]
              print("ESPN_EVENT", json.dumps({
                  "id": event.get("id"),
                  "date": event.get("date"),
                  "season": event.get("season"),
                  "seasonType": event.get("seasonType"),
                  "competition_type": comp.get("type"),
                  "competition_season": comp.get("season"),
                  "notes": comp.get("notes"),
                  "status": comp.get("status"),
              }, default=str))

          snapshots = build_toronto_snapshots()
          payload = [snapshot.to_dict() for snapshot in snapshots]
          print("SNAPSHOTS", json.dumps(payload, indent=2, ensure_ascii=False))
          PY
