name: Issue 17 source probe

on:
  push:
    branches: ["issue-17-conrad-black-source"]
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      PERIGON_API_KEY: ${{ secrets.PERIGON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Probe Perigon identity on current Conrad article
        run: |
          python - <<'PY'
          import os
          import requests

          key = os.environ.get("PERIGON_API_KEY", "")
          print("PERIGON_API_KEY", "present" if key else "absent")
          if not key:
              raise SystemExit(2)
          response = requests.get(
              "https://api.goperigon.com/v1/all",
              params={
                  "apiKey": key,
                  "url": '"nationalpost.com/opinion/conrad-black-mark-carney-puts-it-all-on-the-line"',
                  "size": 10,
                  "showReprints": "true",
              },
              timeout=20,
          )
          print("status", response.status_code)
          response.raise_for_status()
          payload = response.json()
          rows = payload.get("articles") or payload.get("results") or payload.get("data") or []
          print("keys", sorted(payload.keys()))
          print("count", len(rows))
          for row in rows:
              print("url", row.get("url"))
              print("authorsByline", row.get("authorsByline"))
              print("matchedAuthors", [
                  {"id": a.get("id"), "name": a.get("name")}
                  for a in (row.get("matchedAuthors") or row.get("journalists") or [])
                  if isinstance(a, dict)
              ])
          PY
