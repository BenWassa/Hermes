name: Issue 17 source probe

on:
  push:
    branches: ["issue-17-conrad-black-source"]
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      PERIGON_API_KEY: ${{ secrets.PERIGON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Probe current Perigon journalist endpoint
        run: |
          python - <<'PY'
          import os
          import requests

          key = os.environ.get("PERIGON_API_KEY", "")
          print("PERIGON_API_KEY", "present" if key else "absent")
          if not key:
              raise SystemExit(2)
          response = requests.get(
              "https://api.goperigon.com/v1/journalists",
              params={"apiKey": key, "name": "Conrad Black"},
              timeout=20,
          )
          print("status", response.status_code)
          response.raise_for_status()
          payload = response.json()
          print("shape", type(payload).__name__)
          if isinstance(payload, dict):
              print("keys", sorted(payload.keys()))
              rows = payload.get("results") or payload.get("journalists") or payload.get("data") or []
          else:
              rows = payload
          print("count", len(rows))
          for row in rows[:10]:
              print({
                  "id": row.get("id"),
                  "name": row.get("name") or row.get("fullName"),
                  "title": row.get("title"),
                  "sources": [s.get("name") if isinstance(s, dict) else s for s in (row.get("sources") or row.get("topSources") or [])[:5]],
              })
          PY
