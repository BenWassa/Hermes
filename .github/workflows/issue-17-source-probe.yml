name: Issue 17 source probe

on:
  push:
    branches: ["issue-17-conrad-black-source"]
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Run bounded live Conrad audit
        run: python -m src.voices.audit --live --voice conrad-black
