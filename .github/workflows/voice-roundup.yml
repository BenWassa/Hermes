name: Core Voices Roundup

# Voices notification product:
# - one silent Core-only collection after the morning edition each day;
# - a quiet bounded /voices/recent/ shelf for optional browsing;
# - one screened Sunday digest with bounded recovery attempts;
# - one weekly screening/synthesis model call at most per invocation;
# - weekly screening may use public feed/archive descriptions through the same
#   bounded generic Voice adapters, never article-body scraping;
# - only the weekly publisher receives Gemini and ntfy capability.
#
# Release-time/per-article Voice pushes are retired. The morning edition remains
# independent and continues to own its separate once-per-edition notification.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to run"
        type: choice
        options:
          - collect
          - weekly
        default: collect
      dry_run:
        description: "Fetch/report only; write nothing, model nothing, send nothing"
        type: boolean
        default: true
  schedule:
    # Daily silent collection: 11:37 EDT / 10:37 EST, comfortably after build recovery.
    - cron: "37 15 * * *"
    # Sunday digest attempts around 17:43-20:43 Toronto across DST.
    - cron: "43 22 * * 0"
    - cron: "43 23 * * 0"
    - cron: "43 0 * * 1"
    # Monday recovery for the same fixed Sunday period.
    - cron: "43 22 * * 1"

permissions:
  contents: write

concurrency:
  group: voice-roundup
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '37 15 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'collect')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect Core Voices silently
        env:
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          PERIGON_API_KEY: ${{ secrets.PERIGON_API_KEY }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m src.voice_roundup collect $ARGS
          python -m src.voice_digest recent $ARGS

  weekly:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule != '37 15 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'weekly')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish one grounded screened weekly Voice digest
        env:
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          PERIGON_API_KEY: ${{ secrets.PERIGON_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m src.voice_weekly weekly $ARGS
