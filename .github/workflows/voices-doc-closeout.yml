name: Voices documentation closeout

on:
  push:
    branches:
      - issue-13-voices-production-hardening
    paths:
      - .github/workflows/voices-doc-closeout.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile VOICES.md
        run: |
          python scripts/closeout_voices_docs.py
          sed -i '5s/[[:space:]]*$//' VOICES.md
      - name: Validate diff
        run: git diff --check
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VOICES.md
          git commit -m "docs(voices): record production closeout evidence"
          git push origin HEAD:issue-13-voices-production-hardening
